einmischen. Er mischt sich ein \u2013 he meddles. Now say \u201ctaken\u201d", "lang": "en"}, {"text": "vergeben (past participle of vergeben \u2013 to give away)", "lang": "de"}], [{"text": "Vergeben. Leute, die vergeben sind \u2013 people who are taken. --\u201cWe are not \u2013\u201d \u201cWe are not what? Together? Living together? Sleeping in the same bed?\u201d He ran a hand through his hair. \u201cI am not asking for a label, Yves. I am asking for honesty.\u201d \u201cI am being honest.\u201d \u201cThen why did you not tell me he texted you?\u201d Because I was scared. Because I did not know how to do this. \u201cI did not think it mattered,\u201d I said. Now say \u201chonesty\u201d", "lang": "en"}, {"text": "die Ehrlichkeit", "lang": "de"}], [{"text": "Die Ehrlichkeit. Feminine. Ich bitte um Ehrlichkeit", "lang": "de"}, {"text": "\u2013 I am asking for honesty Now say \u201cthe label\u201d", "lang": "en"}, {"text": "das Etikett or die Bezeichnung", "lang": "de"}], [{"text": "Das Etikett. Neuter. Ich frage nicht nach einem Etikett", "lang": "de"}, {"text": "\u2013 I am not asking for a label. --\u201cIt matters.\u201d \u201cWhy? Because you are jealous?\u201d The word hung in the air. Matei's expression did not change. But his hands \u2013 his hands curled into fists on his knees. \u201cYes,\u201d he said. \u201cI am jealous. Is that what you wanted to hear?\u201d \u201cMatei \u2013\u201d \u201cI am jealous. I am angry. I am scared. I am all the things I told myself I would not be again.\u201d He stood up. Walked to the window. \u201cI gave you a key. I gave you a job. I gave you my bed. And you are still holding back.\u201d Now say \u201cjealous\u201d", "lang": "en"}, {"text": "eifers\u00fcchtig", "lang": "de"}], [{"text": "Eifers\u00fcchtig. Ich bin eifers\u00fcchtig \u2013 I am jealous. Now say \u201cthe fist\u201d", "lang": "en"}, {"text": "die Faust", "lang": "de"}], [{"text": "Die Faust. Feminine. Seine H\u00e4nde ballten sich zu F\u00e4usten", "lang": "de"}, {"text": "\u2013 his hands curled into fists. --\u201cI am not holding back.\u201d \u201cYou did not tell me about the texts.\u201d \u201cBecause I did not want you to overreact.\u201d \u201cOverreact?\u201d He turned. His grey eyes were hard. \u201cI asked you one thing. One thing. Honesty. That is it. I do not care if Lukas flirts with you. I care that you hid it.\u201d \u201cI did not hide it. I just \u2013\u201d \u201cYou just decided I could not handle it?\u201d He laughed. It was not a happy sound. \u201cYou do not get to decide what I can handle, Yves. That is not your job.\u201d Now say \u201cto overreact\u201d", "lang": "en"}, {"text": "\u00fcberreagieren", "lang": "de"}], [{"text": "\u00dcberreagieren. Ich wollte nicht, dass du \u00fcberreagierst \u2013 I did not want you to overreact. Now say \u201cto hide\u201d verstecken. Review", "lang": "en"}], [{"text": "Verstecken. Du hast es versteckt \u2013 you hid it. --I stood up. \u201cThen what is my job? To tell you everything? Every text, every conversation, every time someone looks at me?\u201d \u201cNo. Your job is to trust me.\u201d \u201cI do trust you.\u201d \u201cThen act like it.\u201d The room was silent. The lamp buzzed. The radiator clicked. \u201cI do not know how,\u201d I said finally. Matei's face softened. Just a little. \u201cI know,\u201d he said. \u201cThat is why I am still here.\u201d Now say \u201cto act like it\u201d", "lang": "en"}, {"text": "danach handeln", "lang": "de"}], [{"text": "Danach handeln. Handel danach \u2013 act like it. Now say \u201cto soften\u201d", "lang": "en"}, {"text": "sanfter werden", "lang": "de"}], [{"text": "Sanfter werden. Sein Gesicht wurde sanfter \u2013 his face softened. --He walked to me. Put his hands on my shoulders. \u201cI am not asking you to be perfect,\u201d he said. \u201cI am asking you to try.\u201d \u201cI am trying.\u201d \u201cThen try harder.\u201d I wanted to be angry. I wanted to push him away. But I was tired of being the person who always left first. \u201cOkay,\u201d I said. \u201cOkay?\u201d \u201cOkay. I will try harder.\u201d He kissed my forehead. \u201cThat is all I need.\u201d Now say \u201cperfect\u201d", "lang": "en"}, {"text": "perfekt", "lang": "de"}], [{"text": "Perfekt. Ich bitte dich nicht, perfekt zu sein \u2013 I am not asking you to be perfect. Now say \u201cto push away\u201d wegsto\u00dfen (separable)", "lang": "en"}], [{"text": "Wegsto\u00dfen. Ich wollte ihn wegsto\u00dfen \u2013 I wanted to push him away. --We went to bed. He held me. I did not sleep. I stared at the ceiling and thought about Lukas's texts. About Matei's jealousy. About the word together and what it actually meant. I pulled out my phone. Opened Lukas's messages. Hey, I wrote. Thanks for the coffee. But maybe do not text me about Matei anymore. It is weird for both of us. Three dots appeared. Then disappeared. Then: Fair enough. Take care of him. And yourself. Now say \u201cto take care of\u201d", "lang": "en"}, {"text": "sich k\u00fcmmern um", "lang": "de"}], [{"text": "Sich k\u00fcmmern um. K\u00fcmmere dich um ihn \u2013 take care of him. Now say \u201cfair enough\u201d", "lang": "en"}, {"text": "in Ordnung or fair genug", "lang": "de"}], [{"text": "Fair genug. Fair genug \u2013 fair enough. --I put the phone away. Turned over. Pressed my face into Matei's back. He was warm. He was here. He was staying. For now, that was enough. Now say \u201cto press\u201d", "lang": "en"}, {"text": "dr\u00fccken", "lang": "de"}], [{"text": "Dr\u00fccken. Ich dr\u00fcckte mein Gesicht in seinen R\u00fccken \u2013 I pressed my face into his back. Now say \u201cfor now\u201d", "lang": "en"}, {"text": "vorerst", "lang": "de"}], [{"text": "Vorerst. Vorerst reicht das", "lang": "de"}, {"text": "\u2013 for now, that is enough --Dual-layer vocabulary review \u2013 Chapter 8 Layer 1 \u2013 Words", "lang": "en"}, {"text": "Die Nachricht", "lang": "de"}, {"text": "\u2013 the message. <break time=\"2s\"/> Die Nachricht Texten \u2013 to text. <break time=\"2s\"/> Texten. Lukas hat mir getextet. Lesen \u2013 to read. <break time=\"2s\"/> Lesen. Ich lese die Nachricht.", "lang": "en"}, {"text": "Sagen", "lang": "de"}, {"text": "\u2013 to say / tell. <break time=\"2s\"/> Sagen. Ich habe es ihm nicht gesagt", "lang": "en"}, {"text": "Das Vertrauen", "lang": "de"}, {"text": "\u2013 trust. <break time=\"2s\"/> Das Vertrauen. Vertrauen ist zerbrechlich. Unehrlich \u2013 dishonest. <break time=\"2s\"/> Unehrlich. Ich bin nicht unehrlich. Schreien \u2013 to yell. <break time=\"2s\"/> Schreien. Er hat einen Kunden angeschrien.", "lang": "en"}, {"text": "Der Dichter", "lang": "de"}, {"text": "\u2013 the poet. <break time=\"2s\"/> Der Dichter. Ein toter Dichter Pedantisch \u2013 pedantic. <break time=\"2s\"/> Pedantisch. Ein pedantischer Arschloch. Zugeben \u2013 to admit. <break time=\"2s\"/> Zugeben. Er gibt es nicht zu.", "lang": "en"}, {"text": "Das Croissant", "lang": "de"}, {"text": "\u2013 the croissant. <break time=\"2s\"/> Das Croissant. Zwei Croissants", "lang": "en"}, {"text": "Das Gewissen", "lang": "de"}, {"text": "\u2013 the conscience. <break time=\"2s\"/> Das Gewissen. Ein schlechtes Gewissen. Sich verbessern \u2013 to improve. <break time=\"2s\"/> Sich verbessern. Ich verbessere mich. Verliebt \u2013 in love. <break time=\"2s\"/> Verliebt. In jemanden verliebt sein.", "lang": "en"}, {"text": "Die Katze", "lang": "de"}, {"text": "\u2013 the cat. <break time=\"2s\"/> Die Katze. Zwei Katzen Kreisen \u2013 to circle. <break time=\"2s\"/> Kreisen. Sie kreisen umeinander. Weich \u2013 soft. Weicher \u2013 softer. <break time=\"2s\"/> Weicher. Er ist weicher mit dir. Verdienen \u2013 to deserve. <break time=\"2s\"/> Verdienen. Er verdient jemanden, der nicht wegl\u00e4uft.", "lang": "en"}, {"text": "Der Hinterraum", "lang": "de"}, {"text": "\u2013 the back room. <break time=\"2s\"/> Der Hinterraum. Im Hinterraum", "lang": "en"}, {"text": "Die Nachbarschaft", "lang": "de"}, {"text": "\u2013 the neighbourhood. <break time=\"2s\"/> Die Nachbarschaft. In der Nachbarschaft.", "lang": "en"}, {"text": "Die Besorgung", "lang": "de"}, {"text": "\u2013 the errand. <break time=\"2s\"/> Die Besorgung. Besorgungen machen", "lang": "en"}, {"text": "Die Festung", "lang": "de"}, {"text": "\u2013 the fortress. <break time=\"2s\"/> Die Festung. Es ist keine Festung Unterbrechen \u2013 to interrupt. <break time=\"2s\"/> Unterbrechen. Ich wollte nicht unterbrechen.", "lang": "en"}, {"text": "Eine Nervens\u00e4ge", "lang": "de"}, {"text": "\u2013 a pain in the ass. <break time=\"2s\"/> Eine Nervens\u00e4ge. Lukas ist eine Nervens\u00e4ge. Falsch aussprechen \u2013 to mispronounce. <break time=\"2s\"/> Falsch aussprechen. Er hat Goethe falsch ausgesprochen. L\u00e4cherlich \u2013 ridiculous. <break time=\"2s\"/> L\u00e4cherlich. Du bist l\u00e4cherlich. Prinzipientreu \u2013 principled. <break time=\"2s\"/> Prinzipientreu. Ich bin prinzipientreu. Sich einmischen \u2013 to meddle. <break time=\"2s\"/> Sich einmischen. Er mischt sich ein. Vergeben \u2013 taken (relationship). <break time=\"2s\"/> Vergeben. Leute, die vergeben sind.", "lang": "en"}, {"text": "Die Ehrlichkeit", "lang": "de"}, {"text": "\u2013 honesty. <break time=\"2s\"/> Die Ehrlichkeit. Ich bitte um Ehrlichkeit.", "lang": "en"}, {"text": "Das Etikett", "lang": "de"}, {"text": "\u2013 the label. <break time=\"2s\"/> Das Etikett. Ich frage nicht nach einem Etikett. Eifers\u00fcchtig \u2013 jealous. <break time=\"2s\"/> Eifers\u00fcchtig. Ich bin eifers\u00fcchtig.", "lang": "en"}, {"text": "Die Faust", "lang": "de"}, {"text": "\u2013 the fist. <break time=\"2s\"/> Die Faust. Seine H\u00e4nde ballten sich zu F\u00e4usten. \u00dcberreagieren \u2013 to overreact. <break time=\"2s\"/> \u00dcberreagieren. Ich wollte nicht, dass du \u00fcberreagierst. Danach handeln \u2013 to act like it. <break time=\"2s\"/> Danach handeln. Handel danach. Sanfter werden \u2013 to soften. <break time=\"2s\"/> Sanfter werden. Sein Gesicht wurde sanfter. Perfekt \u2013 perfect. <break time=\"2s\"/> Perfekt. Ich bin nicht perfekt. Wegsto\u00dfen \u2013 to push away. <break time=\"2s\"/> Wegsto\u00dfen. Ich wollte ihn wegsto\u00dfen. Sich k\u00fcmmern um \u2013 to take care of. <break time=\"2s\"/> Sich k\u00fcmmern um. K\u00fcmmere dich um ihn. Dr\u00fccken \u2013 to press. <break time=\"2s\"/> Dr\u00fccken. Ich dr\u00fcckte mein Gesicht in seinen R\u00fccken.", "lang": "en"}, {"text": "Vorerst", "lang": "de"}, {"text": "\u2013 for now. <break time=\"2s\"/> Vorerst. Vorerst reicht das Layer 2 \u2013 Story phrases \"Vertrauen ist zerbrechlich.\" \u2013 Trust is fragile. <break time=\"2s\"/> Vertrauen ist zerbrechlich. \"Er hat einen Kunden angeschrien.\" \u2013 He yelled at a customer. <break time=\"2s\"/>", "lang": "en"}, {"text": "Er hat einen Kunden angeschrien.", "lang": "de"}, {"text": "\"Ein pedantischer Arschloch.\" \u2013 A pedantic asshole. <break time=\"2s\"/> Ein pedantischer Arschloch. \"Zwei Croissants und ein schlechtes Gewissen.\" \u2013 Two croissants and a guilty conscience. <break time=\"2s\"/> Zwei Croissants und ein schlechtes Gewissen. \"Er verdient jemanden, der nicht wegl\u00e4uft.\" \u2013 He deserves someone who does not run away. <break time=\"2s\"/> Er verdient jemanden, der nicht wegl\u00e4uft. \"Lukas ist eine Nervens\u00e4ge.\" \u2013 Lukas is a pain in the ass. <break time=\"2s\"/> Lukas ist eine Nervens\u00e4ge. \"Ich bin eifers\u00fcchtig.\" \u2013 I am jealous. <break time=\"2s\"/> Ich bin eifers\u00fcchtig. \"Handel danach.\" \u2013 Act like it. <break time=\"2s\"/> Handel danach. \"K\u00fcmmere dich um ihn.\" \u2013 Take care of him. <break time=\"2s\"/> K\u00fcmmere dich um ihn. \"Vorerst reicht das.\" \u2013 For now, that's enough. <break time=\"2s\"/> Vorerst reicht das. --End of Chapter 8. --Chapter 9 \u2013 The Morning After (A2) (Narrator voice, calm, clear. Ambient: early morning \u2013 soft rain, single car passing, distant church bell.) I woke up alone. On the table, there was coffee. Black. No sugar. No milk. And a note. Yves \u2013 I need some air. I will be back tonight. \u2013 M. I read the note three times. His handwriting was small and neat. The same handwriting that had written Do not burn the milk. Now it wrote I need some air. Now say \u201cthe air\u201d die Luft. Review", "lang": "en"}], [{"text": "Die Luft. Ich brauche etwas Luft", "lang": "de"}, {"text": "\u2013 I need some air Now say \u201cthe note\u201d der Zettel. Review", "lang": "en"}], [{"text": "Der Zettel. Ein Zettel", "lang": "de"}, {"text": "\u2013 a note --Work was a disaster. I dropped two cups before noon. Frau Schmidt sat me down. \u201cWhat happened?\u201d she asked. \u201cNothing.\u201d \u201cYou dropped two cups. Last week you dropped four total. This is regression.\u201d \u201cI am tired.\u201d \u201cYou are lying.\u201d She folded her arms. \u201cDid you and Matei fight?\u201d Now say \u201cthe disaster\u201d die Katastrophe. Review", "lang": "en"}], [{"text": "Die Katastrophe. Die Arbeit war eine Katastrophe", "lang": "de"}, {"text": "\u2013 work was a disaster Now say \u201cthe regression\u201d der R\u00fcckschritt. Review", "lang": "en"}], [{"text": "Der R\u00fcckschritt. Das ist ein R\u00fcckschritt", "lang": "de"}, {"text": "\u2013 that's regression --I stared at the table. The wood was scratched. Someone had carved a heart into it, years ago, with two initials inside. T + M. Not Matei. Someone else. \u201cHe is upset,\u201d I said. \u201cBecause I did not tell him about something.\u201d \u201cWhat something?\u201d \u201cA friend texted me. A coworker of his. It was nothing. But I did not mention it, and he found out, and now he thinks I am hiding things.\u201d Now say \u201cupset\u201d", "lang": "en"}, {"text": "ver\u00e4rgert", "lang": "de"}], [{"text": "Ver\u00e4rgert. Er ist ver\u00e4rgert \u2013 he is upset. Now say \u201cthe heart\u201d", "lang": "en"}, {"text": "das Herz", "lang": "de"}], [{"text": "Das Herz. Neuter. Ein Herz in den Tisch geschnitzt", "lang": "de"}, {"text": "\u2013 a heart carved into the table. --Frau Schmidt was quiet for a moment. Then she said, \u201cIs he wrong?\u201d I looked up. \u201cWhat?\u201d \u201cAre you hiding things? Not the texts. Other things.\u201d I opened my mouth. Closed it. \u201cI do not know,\u201d I said. \u201cMaybe. I do not know how to do this.\u201d \u201cDo what?\u201d \u201cThis.\u201d I gestured at the caf\u00e9, at the window, at the grey sky. \u201cBeing with someone. Staying. Not running.\u201d Now say \u201cto gesture\u201d", "lang": "en"}, {"text": "gestikulieren", "lang": "de"}], [{"text": "Gestikulieren. Ich gestikulierte \u2013 I gestured. Now say \u201cto run\u201d", "lang": "en"}, {"text": "rennen or laufen. Nicht rennen \u2013 not running", "lang": "de"}, {"text": "She nodded slowly. \u201cMy husband was like you.\u201d \u201cHe ran?\u201d \u201cHe tried. Many times. The first year we were married, he packed a bag three times. Each time, I unpacked it for him.\u201d She smiled. \u201cThe fourth time, he packed the bag, and I packed one too. I told him, \u2018If you go, I go.\u2019 He never packed again.\u201d \u201cThat is not advice.\u201d \u201cIt is not advice. It is a story.\u201d She reached across the table and patted my hand. \u201cYou want advice? Here it is. Stop trying to be perfect. You will make mistakes. You will hurt him. He will hurt you. This is what it means to be with someone. The question is not whether you will make mistakes. The question is whether you will stay after you make them.\u201d Now say \u201cto pack a bag\u201d einen Koffer packen. Review", "lang": "en"}], [{"text": "Einen Koffer packen. Er packte einen Koffer", "lang": "de"}, {"text": "\u2013 he packed a bag Now say \u201cthe mistake\u201d der Fehler. Review", "lang": "en"}], [{"text": "Der Fehler. Du wirst Fehler machen", "lang": "de"}, {"text": "\u2013 you will make mistakes --I looked at the heart carved into the table. T + M. \u201cWhat if he leaves first?\u201d I asked. \u201cThen you let him. And you learn. And you try again with someone else.\u201d She squeezed my hand. \u201cBut he has not left yet. Has he?\u201d \u201cNo.\u201d \u201cThen stop planning for a disaster that has not happened.\u201d Now say \u201cto let go\u201d loslassen. Review", "lang": "en"}], [{"text": "Loslassen. Dann l\u00e4sst du ihn gehen \u2013 then you let him go. Now say \u201cto plan\u201d", "lang": "en"}, {"text": "planen. H\u00f6r auf, eine Katastrophe zu planen \u2013 stop planning a", "lang": "de"}, {"text": "disaster. --I left work early. Frau Schmidt shooed me out the door with a bag of apricot pastries. I walked to the bridge. The duck was there today, paddling in circles. I leaned on the railing and ate a pastry. It was warm. Flaky. Too sweet. I ate another one. My phone buzzed. Matei: Where are you? Now say \u201cto shoo away\u201d fortscheuchen. Review", "lang": "en"}], [{"text": "Fortscheuchen. Frau Schmidt scheuchte mich weg \u2013 Frau Schmidt shooed me away. Now say \u201cthe railing\u201d das Gel\u00e4nder. Review", "lang": "en"}], [{"text": "Das Gel\u00e4nder. Auf das Gel\u00e4nder lehnen", "lang": "de"}, {"text": "\u2013 to lean on the railing --I stared at the message. He had not texted me all day. Now he was asking where I was. Bridge, I wrote back. The one with the duck. I know which one. Stay there. I waited. The duck paddled. A family walked past with a dog on a leash. The dog tried to jump into the canal. The family laughed. Twenty minutes later, Matei appeared at the end of the bridge. Now say \u201cthe leash\u201d die Leine. Review", "lang": "en"}], [{"text": "Die Leine. Ein Hund an der Leine", "lang": "de"}, {"text": "\u2013 a dog on a leash Now say \u201cto appear\u201d auftauchen. Review", "lang": "en"}], [{"text": "Auftauchen. Matei tauchte am Ende der Br\u00fccke auf", "lang": "de"}, {"text": "\u2013 Matei appeared at the end of the bridge. --He was wearing the same grey coat. His hands were in his pockets. His hair was messy. He walked to me. Stopped a metre away. Did not touch me. \u201cYou came,\u201d I said. \u201cI said I would.\u201d \u201cYou also said you needed air.\u201d \u201cI got air.\u201d He looked at the duck. \u201cA lot of air. I walked halfway across the city.\u201d \u201cDid it help?\u201d \u201cNo.\u201d Now say \u201chalfway\u201d", "lang": "en"}, {"text": "die H\u00e4lfte. Die halbe Stadt \u2013 half the city", "lang": "de"}], [{"text": "Die halbe Stadt. Ich bin die halbe Stadt gelaufen", "lang": "de"}, {"text": "\u2013 I walked halfway across the city. Now say \u201cto help\u201d", "lang": "en"}, {"text": "helfen. Hat es geholfen? \u2013 Did it help?", "lang": "de"}, {"text": "I offered him a pastry. He took it. Ate it in two bites. \u201cI am not good at this,\u201d he said. \u201cAt what?\u201d \u201cAt being angry.\u201d He turned to look at me. His grey eyes were tired. \u201cWhen I am angry, I shut down. I leave. I do not talk. It is what I learned. From my father. From the ex. From all the people who taught me that anger is dangerous.\u201d \u201cIt is dangerous.\u201d \u201cNot when it is honest.\u201d Now say \u201cto shut down\u201d sich verschlie\u00dfen. Review", "lang": "en"}], [{"text": "Sich verschlie\u00dfen. Ich verschlie\u00dfe mich \u2013 I shut down. Now say \u201cdangerous\u201d gef\u00e4hrlich. Review", "lang": "en"}], [{"text": "Gef\u00e4hrlich. Wut ist gef\u00e4hrlich \u2013 anger is dangerous. --He took a breath. \u201cI was angry last night. Not because of Lukas. Because you did not trust me.\u201d \u201cI do trust you.\u201d \u201cYou hide things. Small things. Things that do not matter. And every time you hide something, I wonder what else you are hiding.\u201d I wanted to argue. But that was not true. I had been hiding my whole life. Now say \u201cto wonder\u201d sich fragen. Review", "lang": "en"}], [{"text": "Sich fragen. Ich frage mich, was du noch versteckst \u2013 I wonder what else you are hiding. Now say \u201cto argue\u201d diskutieren or streiten. Review", "lang": "en"}], [{"text": "Diskutieren. Ich wollte diskutieren \u2013 I wanted to argue. --\u201cI am scared,\u201d I said. \u201cI know.\u201d \u201cI am scared that if you know everything about me, you will leave.\u201d He stepped closer. Close enough that I could smell his coat. Cold air. Coffee. Him. \u201cYves.\u201d \u201cWhat?\u201d \u201cI already know everything about you. Not the facts. The shape of you. The parts that matter.\u201d He reached out. His hand touched my face. \u201cYou are scared. You are lonely. You want to be loved but you do not know how to ask for it. You make pasta from memory and drink coffee black and laugh when you are uncomfortable. You dropped a cup yesterday and apologised to the floor.\u201d Now say \u201cthe shape\u201d die Gestalt. Review", "lang": "en"}], [{"text": "Die Gestalt. Die Gestalt von dir", "lang": "de"}, {"text": "\u2013 the shape of you Now say \u201cto apologise\u201d sich entschuldigen. Review", "lang": "en"}], [{"text": "Sich entschuldigen. Du hast dich beim Boden entschuldigt \u2013 you apologised to the floor. --\u201cI did not apologise to the floor.\u201d \u201cFrau Schmidt told me.\u201d I laughed. I could not help it. \u201cShe tells you everything.\u201d \u201cShe does.\u201d He smiled. A real smile. Small. Tired. Real. \u201cI am not going to leave, Yves. Not because you are perfect. Because you are not. And neither am I.\u201d \u201cThat is a terrible reason to stay.\u201d \u201cIt is the only reason that matters.\u201d Now say \u201cterrible\u201d schrecklich. Review", "lang": "en"}], [{"text": "Schrecklich. Das ist ein schrecklicher Grund \u2013 that is a terrible reason. Now say \u201cto matter\u201d z\u00e4hlen. Review", "lang": "en"}], [{"text": "Z\u00e4hlen. Der einzige Grund, der z\u00e4hlt \u2013 the only reason that matters. --He kissed me. On the bridge. In front of the duck. A family with a dog whistled and said something in German that I did not understand but sounded approving. When he pulled back, his hand was still on my face. \u201cNo more hiding,\u201d he said. \u201cNo more hiding.\u201d \u201cAnd no more running.\u201d \u201cI will try.\u201d \u201cThat is all I ask.\u201d Now say \u201capproving\u201d zustimmend. Review", "lang": "en"}], [{"text": "Zustimmend. Sie klangen zustimmend \u2013 they sounded approving. Now say \u201cto try\u201d versuchen. Review", "lang": "en"}], [{"text": "Versuchen. Ich werde es versuchen \u2013 I will try. --We walked home together. His hand was in mine. The streets were wet from a rain I had not noticed. \u201cMatei.\u201d \u201cWhat?\u201d \u201cWhat is the German word for duck?\u201d \u201cEnte.\u201d \u201cEnte,\u201d I repeated. \u201cThat is a stupid word for such a good animal.\u201d \u201cGerman is a stupid language.\u201d \u201cYou are German.\u201d \u201cI am Romanian. I just live here.\u201d I squeezed his hand. He squeezed back. Now say \u201cthe duck\u201d die Ente. Review", "lang": "en"}], [{"text": "Die Ente.", "lang": "de"}, {"text": "Now say \u201cRomanian\u201d rum\u00e4nisch. Review", "lang": "en"}], [{"text": "Rum\u00e4nisch. Ich bin Rum\u00e4ne \u2013 I am Romanian. --That night, we made dinner together. Pasta again. My grandmother's recipe. He chopped the onions. I cried. Not from the onions. When we went to bed, he held me. His chest was warm against my back. \u201cYves.\u201d \u201cHm?\u201d \u201cI am glad you came to Berlin.\u201d I turned over. Faced him in the dark. \u201cI am glad I stayed.\u201d He kissed my forehead. \u201cGood night.\u201d \u201cGood night, Matei.\u201d Now say \u201cto chop\u201d schneiden. Review", "lang": "en"}], [{"text": "Schneiden. Er schnitt die Zwiebeln \u2013 he chopped the onions. Now say \u201cglad\u201d froh. Review", "lang": "en"}], [{"text": "Froh. Ich bin froh, dass du gekommen bist \u2013 I am glad you came. Ich bin froh, dass ich geblieben bin \u2013 I am glad I stayed. --Dual-layer vocabulary review \u2013 Chapter 9 Layer 1 \u2013 Words", "lang": "en"}, {"text": "Die Luft", "lang": "de"}, {"text": "\u2013 the air. <break time=\"2s\"/> Die Luft. Ich brauche etwas Luft", "lang": "en"}, {"text": "Der Zettel", "lang": "de"}, {"text": "\u2013 the note. <break time=\"2s\"/> Der Zettel", "lang": "en"}, {"text": "Die Katastrophe", "lang": "de"}, {"text": "\u2013 the disaster. <break time=\"2s\"/> Die Katastrophe. Die Arbeit war eine Katastrophe.", "lang": "en"}, {"text": "Der R\u00fcckschritt", "lang": "de"}, {"text": "\u2013 the regression. <break time=\"2s\"/> Der R\u00fcckschritt. Das ist ein R\u00fcckschritt. Ver\u00e4rgert \u2013 upset. <break time=\"2s\"/> Ver\u00e4rgert. Er ist ver\u00e4rgert.", "lang": "en"}, {"text": "Das Herz", "lang": "de"}, {"text": "\u2013 the heart. <break time=\"2s\"/> Das Herz. Ein Herz in den Tisch geschnitzt. Gestikulieren \u2013 to gesture. <break time=\"2s\"/> Gestikulieren. Ich gestikulierte.", "lang": "en"}, {"text": "Einen Koffer packen", "lang": "de"}, {"text": "\u2013 to pack a bag. <break time=\"2s\"/> Einen Koffer packen. Er packte einen Koffer.", "lang": "en"}, {"text": "Der Fehler", "lang": "de"}, {"text": "\u2013 the mistake. <break time=\"2s\"/> Der Fehler. Du wirst Fehler machen Loslassen \u2013 to let go. <break time=\"2s\"/> Loslassen. Dann l\u00e4sst du ihn gehen. Planen \u2013 to plan. <break time=\"2s\"/> Planen. H\u00f6r auf zu planen. Fortscheuchen \u2013 to shoo away. <break time=\"2s\"/> Fortscheuchen. Frau Schmidt scheuchte mich weg.", "lang": "en"}, {"text": "Das Gel\u00e4nder", "lang": "de"}, {"text": "\u2013 the railing. <break time=\"2s\"/> Das Gel\u00e4nder. Auf das Gel\u00e4nder lehnen.", "lang": "en"}, {"text": "Die Leine", "lang": "de"}, {"text": "\u2013 the leash. <break time=\"2s\"/> Die Leine. Ein Hund an der Leine", "lang": "en"}, {"text": "Auftauchen", "lang": "de"}, {"text": "\u2013 to appear. <break time=\"2s\"/> Auftauchen. Matei tauchte auf", "lang": "en"}, {"text": "Die halbe Stadt", "lang": "de"}, {"text": "\u2013 half the city. <break time=\"2s\"/> Die halbe Stadt. Ich bin die halbe Stadt gelaufen.", "lang": "en"}, {"text": "Helfen", "lang": "de"}, {"text": "\u2013 to help. <break time=\"2s\"/> Helfen. Hat es geholfen? Sich verschlie\u00dfen \u2013 to shut down. <break time=\"2s\"/> Sich verschlie\u00dfen. Ich verschlie\u00dfe mich. Gef\u00e4hrlich \u2013 dangerous. <break time=\"2s\"/> Gef\u00e4hrlich. Wut ist gef\u00e4hrlich. Sich fragen \u2013 to wonder. <break time=\"2s\"/> Sich fragen. Ich frage mich. Diskutieren \u2013 to argue. <break time=\"2s\"/> Diskutieren. Ich wollte diskutieren.", "lang": "en"}, {"text": "Die Gestalt", "lang": "de"}, {"text": "\u2013 the shape. <break time=\"2s\"/> Die Gestalt. Die Gestalt von dir Sich entschuldigen \u2013 to apologise. <break time=\"2s\"/> Sich entschuldigen. Du hast dich entschuldigt. Zustimmend \u2013 approving. <break time=\"2s\"/> Zustimmend. Sie klangen zustimmend. Versuchen \u2013 to try. <break time=\"2s\"/> Versuchen. Ich werde es versuchen.", "lang": "en"}, {"text": "Die Ente", "lang": "de"}, {"text": "\u2013 the duck. <break time=\"2s\"/> Die Ente Rum\u00e4nisch \u2013 Romanian. <break time=\"2s\"/> Rum\u00e4nisch. Ich bin Rum\u00e4ne. Schneiden \u2013 to chop. <break time=\"2s\"/> Schneiden. Er schnitt die Zwiebeln. Froh \u2013 glad. <break time=\"2s\"/> Froh. Ich bin froh. Layer 2 \u2013 Story phrases \"Ich brauche etwas Luft.\" \u2013 I need some air. <break time=\"2s\"/> Ich brauche etwas Luft. \"Das ist ein R\u00fcckschritt.\" \u2013 That's a regression. <break time=\"2s\"/> Das ist ein R\u00fcckschritt. \"Du wirst Fehler machen.\" \u2013 You will make mistakes. <break time=\"2s\"/> Du wirst Fehler machen. \"Dann l\u00e4sst du ihn gehen.\" \u2013 Then you let him go. <break time=\"2s\"/> Dann l\u00e4sst du ihn gehen. \"Ich bin die halbe Stadt gelaufen.\" \u2013 I walked halfway across the city. <break time=\"2s\"/> Ich bin die halbe Stadt gelaufen. \"Ich verschlie\u00dfe mich.\" \u2013 I shut down. <break time=\"2s\"/> Ich verschlie\u00dfe mich. \"Ich frage mich, was du noch versteckst.\" \u2013 I wonder what else you are hiding. <break time=\"2s\"/> Ich frage mich, was du noch versteckst. \"Du hast dich beim Boden entschuldigt.\" \u2013 You apologised to the floor. <break time=\"2s\"/> Du hast dich beim Boden entschuldigt. \"Ich werde es versuchen.\" \u2013 I will try. <break time=\"2s\"/> Ich werde es versuchen. \"Ich bin froh, dass du gekommen bist.\" \u2013 I am glad you came. <break time=\"2s\"/>", "lang": "en"}, {"text": "Ich bin froh, dass du gekommen bist.", "lang": "de"}, {"text": "End of Chapter 9. Chapters 10, 11, and 12 \u2013 Refined Audio Scripts Here are the next three chapters in the hybrid style: sensory prose, grammar woven into Yves's thoughts, active prompts, dual-layer reviews. --Chapter 10 \u2013 The Call (A2) (Narrator voice, calm, clear. Ambient: hospital ambience \u2013 distant beeps, soft footsteps, hushed voices.) The week after the bridge was different. Not perfect. Nothing was perfect. Matei still forgot to buy groceries. I still dropped cups at work. We still had moments where the silence between us felt like a held breath, waiting to be released. But we were trying. Both of us. And trying, it turned out, was most of the work. Then Frau Schmidt did not show up for work. Now say \u201cto show up\u201d auftauchen (separable). Review", "lang": "en"}], [{"text": "Auftauchen. Frau Schmidt tauchte nicht auf", "lang": "de"}, {"text": "\u2013 Frau Schmidt did not show up Now say \u201cthe silence\u201d", "lang": "en"}, {"text": "die Stille", "lang": "de"}], [{"text": "Die Stille. Feminine. Die Stille zwischen uns", "lang": "de"}, {"text": "\u2013 the silence between us --It was a Tuesday. I arrived at Morgenlicht at 8:45, ten minutes early. Matei had started walking me to work in the mornings. He did not say it was romantic. He just said, \u201cIt is on my way.\u201d It was not. He worked in the opposite direction. The caf\u00e9 was dark. The green awning was still closed. The chalkboard sign was blank. I stood outside, confused. Frau Schmidt was always here before me. She opened at 8:30. She had a routine \u2013 unlock the door, turn on the lights, start the espresso machine. The old brass one that hissed like a cat. Now say \u201cthe routine\u201d", "lang": "en"}, {"text": "die Routine", "lang": "de"}], [{"text": "Die Routine. Feminine. Sie hatte eine Routine", "lang": "de"}, {"text": "\u2013 she had a routine Now say \u201cthe opposite direction\u201d", "lang": "en"}, {"text": "die entgegengesetzte Richtung", "lang": "de"}], [{"text": "Die entgegengesetzte Richtung. In die entgegengesetzte Richtung", "lang": "de"}, {"text": "\u2013 in the opposite direction. --I called her phone. No answer. I texted. Nothing. I waited fifteen minutes. Then I called Matei. \u201cShe is not here,\u201d I said. \u201cWho?\u201d \u201cFrau Schmidt. The caf\u00e9 is closed. She is not answering her phone.\u201d He was quiet for a moment. \u201cStay there. I am coming.\u201d Now say \u201cto answer\u201d", "lang": "en"}, {"text": "antworten or abnehmen (for phone)", "lang": "de"}], [{"text": "Abnehmen. Sie nahm nicht ab \u2013 she did not answer. Now say \u201cquiet\u201d still. Einen Moment still sein \u2013 to be quiet for a moment He arrived in a taxi. That is how I knew he was worried \u2013 Matei never took taxis. He walked everywhere, even when it was raining, even when it was freezing, even when I offered to pay for the bus. \u201cDid you try the back door?\u201d he asked. \u201cThere is a back door?\u201d He walked around the building. I followed. The alley behind the caf\u00e9 was narrow and smelled like old grease. Matei knocked on a metal door. No answer. He knocked again. Harder. \u201cFrau Schmidt? It is Matei.\u201d Silence. He tried the handle. It was unlocked. Now say \u201cthe taxi\u201d", "lang": "en"}, {"text": "das Taxi", "lang": "de"}], [{"text": "Das Taxi. Neuter. Er kam mit dem Taxi", "lang": "de"}, {"text": "\u2013 he arrived by taxi Now say \u201cthe alley\u201d", "lang": "en"}, {"text": "die Gasse", "lang": "de"}], [{"text": "Die Gasse. Feminine. Die Gasse hinter dem Caf\u00e9", "lang": "de"}, {"text": "\u2013 the alley behind the caf\u00e9 --The door opened into a small apartment. A kitchen. A table. A sink full of dishes. Frau Schmidt was on the floor. She was unconscious. Not dead \u2013 her chest was moving, slow but steady \u2013 but her face was pale, and her lips were grey. A phone lay on the floor next to her hand, like she had tried to call someone and dropped it. Matei was on his knees next to her in half a second. His hand was on her wrist, checking her pulse. His face was calm, but I could see the tremor in his fingers. \u201cCall an ambulance,\u201d he said. \u201cI do not know the number.\u201d \u201c112. Call. Now.\u201d Now say \u201cunconscious\u201d", "lang": "en"}, {"text": "bewusstlos", "lang": "de"}], [{"text": "Bewusstlos. Sie war bewusstlos \u2013 she was unconscious. Now say \u201cthe ambulance\u201d", "lang": "en"}, {"text": "der Krankenwagen", "lang": "de"}], [{"text": "Der Krankenwagen. Masculine. Ruf einen Krankenwagen", "lang": "de"}, {"text": "\u2013 call an ambulance --I called. My German was bad. The operator asked questions I could not understand. I handed the phone to Matei. He took it without looking, spoke in rapid German, answered everything, hung up. \u201cThey are coming,\u201d he said. He had not moved from her side. His hand was still on her wrist. \u201cIs she going to be okay?\u201d He did not answer. That was the scariest thing he had done all week. Now say \u201cthe operator\u201d", "lang": "en"}, {"text": "die Vermittlung", "lang": "de"}], [{"text": "Die Vermittlung. Feminine. Die Vermittlung fragte", "lang": "de"}, {"text": "\u2013 the operator asked Now say \u201crapid\u201d", "lang": "en"}, {"text": "schnell or rasch", "lang": "de"}], [{"text": "Rasch. Er sprach rasch Deutsch \u2013 he spoke rapid German. --The ambulance came in seven minutes. I know because I counted. The paramedics were fast and efficient and spoke to Matei like he was family. They loaded Frau Schmidt onto a stretcher. One of them asked something in German. Matei answered. The paramedic looked at me. \u201cYou come too,\u201d he said in English. \u201cShe would want.\u201d I got in the ambulance. Matei stayed behind to lock the caf\u00e9. \u201cI will meet you there,\u201d he said. The doors closed. The sirens started. I held Frau Schmidt's hand and tried not to cry. Now say \u201cthe paramedic\u201d", "lang": "en"}, {"text": "der Sanit\u00e4ter", "lang": "de"}], [{"text": "Der Sanit\u00e4ter. Masculine. Die Sanit\u00e4ter kamen", "lang": "de"}, {"text": "\u2013 the paramedics came Now say \u201cthe stretcher\u201d", "lang": "en"}, {"text": "die Trage", "lang": "de"}], [{"text": "Die Trage. Feminine. Sie legten sie auf eine Trage", "lang": "de"}, {"text": "\u2013 they put her on a stretcher --The hospital was white and loud and smelled like antiseptic. They took Frau Schmidt to a room. A doctor spoke to me in English. Her English was better than my German, but not by much. \u201cShe had a stroke. Small. We caught it early.\u201d \u201cIs she going to be okay?\u201d \u201cShe will need rehabilitation. Therapy. She cannot work for several weeks. Maybe months.\u201d \u201cMonths?\u201d The doctor nodded. \u201cDo you know if she has family? Children?\u201d I did not know. Now say \u201cthe hospital\u201d", "lang": "en"}, {"text": "das Krankenhaus", "lang": "de"}], [{"text": "Das Krankenhaus. Neuter. Das Krankenhaus war wei\u00df und laut", "lang": "de"}, {"text": "\u2013 the hospital was white and loud. Now say \u201cthe stroke\u201d", "lang": "en"}, {"text": "der Schlaganfall", "lang": "de"}], [{"text": "Der Schlaganfall. Masculine. Sie hatte einen kleinen Schlaganfall", "lang": "de"}, {"text": "\u2013 she had a small stroke. --Matei arrived an hour later. He had closed the caf\u00e9, turned off the lights, locked the door. He had also called the bakery down the street and told them to cancel the morning pastry delivery. \u201cHow is she?\u201d he asked. \u201cStroke. Small. They say she will recover, but it will take time.\u201d He sat down next to me in the waiting room. His hand found mine. \u201cThe caf\u00e9,\u201d I said. \u201cShe cannot work. For months.\u201d \u201cI know.\u201d \u201cShe does not have anyone. I do not think she has family.\u201d Now say \u201cto recover\u201d", "lang": "en"}, {"text": "sich erholen", "lang": "de"}], [{"text": "Sich erholen. Sie wird sich erholen \u2013 she will recover. Now say \u201cthe waiting room\u201d", "lang": "en"}, {"text": "das Wartezimmer", "lang": "de"}], [{"text": "Das Wartezimmer. Neuter. Im Wartezimmer sitzen", "lang": "de"}, {"text": "\u2013 to sit in the waiting room --He was quiet for a moment. Then he said, \u201cThe caf\u00e9 is her life. If it closes, she will lose more than money.\u201d \u201cWhat do we do?\u201d He looked at me. His grey eyes were steady. \u201cWe run it.\u201d I stared at him. \u201cWe what?\u201d \u201cYou know how to make the coffee. You know the customers. You know the routine.\u201d \u201cI dropped four cups last week.\u201d \u201cYou dropped three. Frau Schmidt told me.\u201d Now say \u201cto lose\u201d", "lang": "en"}, {"text": "verlieren", "lang": "de"}], [{"text": "Verlieren. Sie wird mehr als Geld verlieren \u2013 she will lose more than money. Now say \u201cto run\u201d (a business)", "lang": "en"}, {"text": "f\u00fchren or leiten. Different from laufen", "lang": "de"}], [{"text": "F\u00fchren. Wir f\u00fchren das Caf\u00e9 \u2013 we run the caf\u00e9. --\u201cThat is not better.\u201d \u201cIt is better.\u201d He squeezed my hand. \u201cI will help in the mornings. Before work. And I know people. We can find someone to cover the afternoons.\u201d \u201cMatei, I cannot run a caf\u00e9. I can barely order food in German.\u201d \u201cYou do not have to run it alone. You just have to keep it alive. Until she comes back.\u201d I wanted to say no. I wanted to tell him he was crazy. But I looked at him \u2013 this man who had given me a key and a job and a reason to stay \u2013 and I thought about Frau Schmidt on the floor, reaching for her phone, alone. \u201cOkay,\u201d I said. \u201cOkay?\u201d \u201cOkay. I will do it.\u201d Now say \u201cto cover\u201d \u00fcbernehmen (separable) or abdecken", "lang": "en"}], [{"text": "\u00dcbernehmen. Wir k\u00f6nnen die Nachmittage \u00fcbernehmen \u2013 we can cover the afternoons. Now say \u201calive\u201d", "lang": "en"}, {"text": "lebendig", "lang": "de"}], [{"text": "Lebendig. Wir m\u00fcssen das Caf\u00e9 am Leben halten \u2013 we have to keep the caf\u00e9 alive. --He kissed my forehead. Right there in the hospital waiting room, with fluorescent lights and the smell of antiseptic and a woman who might never make coffee again. \u201cGood,\u201d he said. \u201cBecause I already told the bakery you would be there at 6 AM tomorrow.\u201d \u201cYou did not.\u201d \u201cI did.\u201d \u201cYou are insane.\u201d \u201cProbably.\u201d Now say \u201cinsane\u201d", "lang": "en"}, {"text": "verr\u00fcckt", "lang": "de"}], [{"text": "Verr\u00fcckt. Du bist verr\u00fcckt \u2013 you are insane. Now say \u201cthe bakery\u201d die B\u00e4ckerei. Review", "lang": "en"}], [{"text": "Die B\u00e4ckerei. Ich habe der B\u00e4ckerei schon Bescheid gesagt", "lang": "de"}, {"text": "\u2013 I already told the bakery. --I leaned my head on his shoulder. He put his arm around me. We sat like that until a nurse came to tell us Frau Schmidt was awake. She looked smaller in the hospital bed. The fluorescent light made her grey hair look white. Her eyes were open, though. They were still sharp. \u201cYou are here,\u201d she said. Her voice was weak. \u201cWhere else would we be?\u201d \u201cThe caf\u00e9,\u201d she said. \u201cI did not open.\u201d \u201cWe took care of it,\u201d I said. \u201cIt is closed. The pastries are cancelled. The lights are off.\u201d Now say \u201cthe nurse\u201d", "lang": "en"}, {"text": "die Krankenschwester", "lang": "de"}], [{"text": "Die Krankenschwester. Feminine. Eine Krankenschwester kam", "lang": "de"}, {"text": "\u2013 a nurse came Now say \u201cweak\u201d", "lang": "en"}, {"text": "schwach", "lang": "de"}], [{"text": "Schwach. Ihre Stimme war schwach \u2013 her voice was weak. --She nodded slowly. \u201cGood. Good.\u201d \u201cFrau Schmidt,\u201d Matei said. \u201cDo you have family? Someone we should call?\u201d She looked at him. Her eyes were wet. \u201cNo,\u201d she said. \u201cNo family. Just the caf\u00e9.\u201d \u201cThen we will keep it open,\u201d I said. \u201cUntil you come back.\u201d She looked at me. Really looked. The way she had when I had dropped my first cup, the way she had when she had told me Matei talked about me. \u201cYou cannot,\u201d she said. \u201cYou do not speak German.\u201d \u201cI will learn.\u201d \u201cYou drop cups.\u201d \u201cI will drop fewer.\u201d Now say \u201cwet\u201d", "lang": "en"}, {"text": "nass (for objects) or feucht (for eyes with tears). Ihre Augen", "lang": "de"}, {"text": "waren feucht \u2013 her eyes were wet.", "lang": "en"}], [{"text": "Feucht. Ihre Augen waren feucht \u2013 her eyes were wet. Now say \u201cto keep open\u201d", "lang": "en"}, {"text": "offen halten", "lang": "de"}], [{"text": "Offen halten. Wir werden das Caf\u00e9 offen halten \u2013 we will keep the caf\u00e9 open. --She was quiet for a long moment. Then she smiled. A small smile. Tired. Real. \u201cThe keys are in the drawer,\u201d she said. \u201cBehind the counter. There is a blue notebook. The passwords. The supplier numbers. Everything.\u201d \u201cI will find it,\u201d I said. \u201cYves.\u201d \u201cWhat?\u201d \u201cThank you.\u201d I did not know what to say. So I said nothing. I just stood there while Matei held her hand and promised to visit every day. Now say \u201cthe drawer\u201d", "lang": "en"}, {"text": "die Schublade", "lang": "de"}], [{"text": "Die Schublade. Feminine. Die Schl\u00fcssel sind in der Schublade", "lang": "de"}, {"text": "\u2013 the keys are in the drawer. Now say \u201cthe notebook\u201d das Notizbuch. Review", "lang": "en"}], [{"text": "Das Notizbuch. Ein blaues Notizbuch", "lang": "de"}, {"text": "\u2013 a blue notebook --That night, we sat on the sofa. The lamp was on. The radiator clicked. The plant on the windowsill \u2013 Matei Jr. \u2013 was still alive. \u201cYou are scared,\u201d Matei said. \u201cTerrified.\u201d \u201cGood. Terror means you care.\u201d \u201cOr it means I am about to ruin someone's life.\u201d He turned to look at me. \u201cFrau Schmidt trusted you. Do you know why?\u201d \u201cBecause you vouched for me?\u201d \u201cNo. Because you stayed. When she gave you a chance, you did not leave. You came back the next day. And the next. And the next.\u201d He put his hand on my knee. \u201cThat is not nothing, Yves. That is everything.\u201d Now say \u201cto vouch for\u201d", "lang": "en"}, {"text": "b\u00fcrgen f\u00fcr or sich verb\u00fcrgen f\u00fcr", "lang": "de"}], [{"text": "Sich verb\u00fcrgen f\u00fcr. Du hast dich f\u00fcr mich verb\u00fcrgt \u2013 you vouched for me. Now say \u201cthe chance\u201d die Chance. Review", "lang": "en"}], [{"text": "Die Chance. Sie gab dir eine Chance", "lang": "de"}, {"text": "\u2013 she gave you a chance --\u201cWhat if I fail?\u201d \u201cThen you fail. And you try again.\u201d He squeezed my knee. \u201cThat is what staying means.\u201d I leaned into him. His arm went around my shoulders. \u201cMatei.\u201d \u201cWhat?\u201d \u201cI am glad you are here.\u201d \u201cI am not going anywhere.\u201d We sat like that until the lamp flickered and the street went quiet. Tomorrow, I would open the caf\u00e9. I would make coffee. I would drop cups and apologise to the floor. I would learn the German words for supplier and invoice. But tonight, I was just here. And for now, that was enough. Now say \u201cto fail\u201d", "lang": "en"}, {"text": "scheitern or versagen", "lang": "de"}], [{"text": "Scheitern. Was ist, wenn ich scheitere? \u2013 What if I fail? Now say \u201cthe supplier\u201d", "lang": "en"}, {"text": "der Lieferant", "lang": "de"}], [{"text": "Der Lieferant. Masculine. Der Lieferant", "lang": "de"}, {"text": "\u2013 the supplier --Dual-layer vocabulary review \u2013 Chapter 10 Layer 1 \u2013 Words", "lang": "en"}, {"text": "Auftauchen", "lang": "de"}, {"text": "\u2013 to show up. <break time=\"2s\"/> Auftauchen. Frau Schmidt tauchte nicht auf.", "lang": "en"}, {"text": "Die Stille", "lang": "de"}, {"text": "\u2013 the silence. <break time=\"2s\"/> Die Stille. Die Stille zwischen uns", "lang": "en"}, {"text": "Die Routine", "lang": "de"}, {"text": "\u2013 the routine. <break time=\"2s\"/> Die Routine. Sie hatte eine Routine", "lang": "en"}, {"text": "Die entgegengesetzte Richtung", "lang": "de"}, {"text": "\u2013 the opposite direction. <break time=\"2s\"/> Die entgegengesetzte Richtung. Abnehmen \u2013 to answer (phone). <break time=\"2s\"/> Abnehmen. Sie nahm nicht ab. Still \u2013 quiet. <break time=\"2s\"/> Still. Einen Moment still sein.", "lang": "en"}, {"text": "Das Taxi", "lang": "de"}, {"text": "\u2013 the taxi. <break time=\"2s\"/> Das Taxi. Er kam mit dem Taxi", "lang": "en"}, {"text": "Die Gasse", "lang": "de"}, {"text": "\u2013 the alley. <break time=\"2s\"/> Die Gasse. Die Gasse hinter dem Caf\u00e9 Bewusstlos \u2013 unconscious. <break time=\"2s\"/> Bewusstlos. Sie war bewusstlos.", "lang": "en"}, {"text": "Der Krankenwagen", "lang": "de"}, {"text": "\u2013 the ambulance. <break time=\"2s\"/> Der Krankenwagen. Ruf einen Krankenwagen.", "lang": "en"}, {"text": "Die Vermittlung", "lang": "de"}, {"text": "\u2013 the operator. <break time=\"2s\"/> Die Vermittlung. Die Vermittlung fragte. Rasch \u2013 rapid. <break time=\"2s\"/> Rasch. Er sprach rasch Deutsch.", "lang": "en"}, {"text": "Der Sanit\u00e4ter", "lang": "de"}, {"text": "\u2013 the paramedic. <break time=\"2s\"/> Der Sanit\u00e4ter. Die Sanit\u00e4ter kamen.", "lang": "en"}, {"text": "Die Trage", "lang": "de"}, {"text": "\u2013 the stretcher. <break time=\"2s\"/> Die Trage. Sie legten sie auf eine Trage.", "lang": "en"}, {"text": "Das Krankenhaus", "lang": "de"}, {"text": "\u2013 the hospital. <break time=\"2s\"/> Das Krankenhaus", "lang": "en"}, {"text": "Der Schlaganfall", "lang": "de"}, {"text": "\u2013 the stroke. <break time=\"2s\"/> Der Schlaganfall. Sie hatte einen kleinen Schlaganfall. Sich erholen \u2013 to recover. <break time=\"2s\"/> Sich erholen. Sie wird sich erholen.", "lang": "en"}, {"text": "Das Wartezimmer", "lang": "de"}, {"text": "\u2013 the waiting room. <break time=\"2s\"/> Das Wartezimmer. Im Wartezimmer sitzen. Verlieren \u2013 to lose. <break time=\"2s\"/> Verlieren. Sie wird mehr verlieren. F\u00fchren \u2013 to run (a business). <break time=\"2s\"/> F\u00fchren. Wir f\u00fchren das Caf\u00e9. \u00dcbernehmen \u2013 to cover. <break time=\"2s\"/> \u00dcbernehmen. Wir k\u00f6nnen die Nachmittage \u00fcbernehmen. Lebendig \u2013 alive. <break time=\"2s\"/> Lebendig. Das Caf\u00e9 am Leben halten. Verr\u00fcckt \u2013 insane. <break time=\"2s\"/> Verr\u00fcckt. Du bist verr\u00fcckt.", "lang": "en"}, {"text": "Die Krankenschwester", "lang": "de"}, {"text": "\u2013 the nurse. <break time=\"2s\"/> Die Krankenschwester. Eine Krankenschwester kam. Schwach \u2013 weak. <break time=\"2s\"/> Schwach. Ihre Stimme war schwach. Feucht \u2013 wet (with tears). <break time=\"2s\"/> Feucht. Ihre Augen waren feucht. Offen halten \u2013 to keep open. <break time=\"2s\"/> Offen halten. Wir werden das Caf\u00e9 offen halten.", "lang": "en"}, {"text": "Die Schublade", "lang": "de"}, {"text": "\u2013 the drawer. <break time=\"2s\"/> Die Schublade. Die Schl\u00fcssel sind in der Schublade.", "lang": "en"}, {"text": "Das Notizbuch", "lang": "de"}, {"text": "\u2013 the notebook. <break time=\"2s\"/> Das Notizbuch. Ein blaues Notizbuch. Sich verb\u00fcrgen f\u00fcr \u2013 to vouch for. <break time=\"2s\"/> Sich verb\u00fcrgen f\u00fcr. Du hast dich f\u00fcr mich verb\u00fcrgt.", "lang": "en"}, {"text": "Die Chance", "lang": "de"}, {"text": "\u2013 the chance. <break time=\"2s\"/> Die Chance. Sie gab dir eine Chance Scheitern \u2013 to fail. <break time=\"2s\"/> Scheitern. Was ist, wenn ich scheitere?", "lang": "en"}, {"text": "Der Lieferant", "lang": "de"}, {"text": "\u2013 the supplier. <break time=\"2s\"/> Der Lieferant Layer 2 \u2013 Story phrases \"Frau Schmidt tauchte nicht auf.\" \u2013 Frau Schmidt didn't show up. <break time=\"2s\"/> Frau Schmidt tauchte nicht auf. \"Sie hatte einen kleinen Schlaganfall.\" \u2013 She had a small stroke. <break time=\"2s\"/> Sie hatte einen kleinen Schlaganfall. \"Wir f\u00fchren das Caf\u00e9.\" \u2013 We run the caf\u00e9. <break time=\"2s\"/> Wir f\u00fchren das Caf\u00e9. \"Wir m\u00fcssen das Caf\u00e9 am Leben halten.\" \u2013 We have to keep the caf\u00e9 alive. <break time=\"2s\"/> Wir m\u00fcssen das Caf\u00e9 am Leben halten. \"Du bist verr\u00fcckt.\" \u2013 You are insane. <break time=\"2s\"/> Du bist verr\u00fcckt. \"Ihre Stimme war schwach.\" \u2013 Her voice was weak. <break time=\"2s\"/> Ihre Stimme war schwach. \"Ihre Augen waren feucht.\" \u2013 Her eyes were wet. <break time=\"2s\"/> Ihre Augen waren feucht. \"Die Schl\u00fcssel sind in der Schublade.\" \u2013 The keys are in the drawer. <break time=\"2s\"/> Die Schl\u00fcssel sind in der Schublade. \"Was ist, wenn ich scheitere?\" \u2013 What if I fail? <break time=\"2s\"/> Was ist, wenn ich scheitere? --End of Chapter 10. --Chapter 11 \u2013 The First Day (A2) (Narrator voice, calm, clear. Ambient: early morning \u2013 coffee machine hiss, birds outside, distant traffic.) I opened the caf\u00e9 at 5:45 AM. That is not a typo. Five forty-five. In the morning. Before the sun. Before the birds. Before any reasonable person should be allowed to operate heavy machinery like an espresso machine that hissed like it wanted to kill me. The blue notebook was exactly where Frau Schmidt said it would be. Behind the counter, in the drawer, next to a bag of spare change and a photograph of a man I did not recognise. Her husband, maybe. The one who had packed a bag three times. Now say \u201cthe typo\u201d", "lang": "en"}, {"text": "der Tippfehler", "lang": "de"}], [{"text": "Der Tippfehler. Masculine. Das ist kein Tippfehler", "lang": "de"}, {"text": "\u2013 that is not a typo Now say \u201cthe machinery\u201d", "lang": "en"}, {"text": "die Maschinerie", "lang": "de"}], [{"text": "Die Maschinerie. Feminine. Schwere Maschinerie", "lang": "de"}, {"text": "\u2013 heavy machinery --The notebook had everything. Passwords. Supplier numbers. Instructions for the espresso machine written in a mix of German and English that made my eyes cross. Turn the red knob. Wait for the green light. Do not overfill the filter or you will regret it. I regretted it anyway. The first espresso shot was pure charcoal. I dumped it. The second was slightly less burnt. I dumped that too. By the fifth attempt, I had something that resembled coffee and not liquid asphalt. Now say \u201cthe knob\u201d", "lang": "en"}, {"text": "der Knopf or der Griff. Der rote Knopf \u2013 the red knob", "lang": "de"}], [{"text": "Der Knopf. Masculine. Den roten Knopf drehen", "lang": "de"}, {"text": "\u2013 turn the red knob Now say \u201cthe charcoal\u201d", "lang": "en"}, {"text": "die Kohle", "lang": "de"}], [{"text": "Die Kohle. Feminine. Reine Kohle", "lang": "de"}, {"text": "\u2013 pure charcoal --At 6:15, I unlocked the front door. The green awning rolled out. The chalkboard sign said Heute ge\u00f6ffnet in Frau Schmidt's handwriting. I did not have the heart to change it. The first customer arrived at 6:30. An old man with a newspaper and a limp. He ordered something in German. I understood the word Kaffee and nothing else. \u201cBlack?\u201d I asked. He looked at me like I had grown a second head. \u201cSchwarz?\u201d I tried. He nodded. Now say \u201cthe awning\u201d", "lang": "en"}, {"text": "die Markise", "lang": "de"}], [{"text": "Die Markise. Feminine. Die gr\u00fcne Markise", "lang": "de"}, {"text": "\u2013 the green awning Now say \u201cthe limp\u201d", "lang": "en"}, {"text": "das Hinken or der Hinkefu\u00df. More common: er humpelte \u2013 he", "lang": "de"}, {"text": "limped.", "lang": "en"}], [{"text": "Humpeln. Ein alter Mann mit einem Hinken \u2013 an old man with a limp. --I made him a black coffee. He took a sip. Made a face. Drank it anyway. \u201cDanke,\u201d he said, and left a two-euro tip. I put the tip in my pocket. Frau Schmidt had said tips were for the staff. I was the staff. Now say \u201cthe tip\u201d", "lang": "en"}, {"text": "das Trinkgeld", "lang": "de"}], [{"text": "Das Trinkgeld. Neuter. Zwei Euro Trinkgeld", "lang": "de"}, {"text": "\u2013 two euros tip Now say \u201cthe staff\u201d", "lang": "en"}, {"text": "das Personal", "lang": "de"}], [{"text": "Das Personal. Neuter. Das Personal ist die Belegschaft", "lang": "de"}, {"text": "\u2013 the staff --By 8 AM, I had made sixteen coffees, dropped one cup, and learned the German word for receipt from a woman who yelled it at me three times before I understood. Quittung, she yelled. Quittung! \u201cQuittung,\u201d I repeated. She nodded. Snatched the paper. Left. Now say \u201cthe receipt\u201d", "lang": "en"}, {"text": "die Quittung", "lang": "de"}], [{"text": "Die Quittung. Feminine. Die Quittung, bitte", "lang": "de"}, {"text": "\u2013 the receipt, please Now say \u201cto yell\u201d schreien. Review. Sie schrie \u2013 she yelled", "lang": "en"}], [{"text": "Schreien. Sie schrie \u201eQuittung!\u201c \u2013 she yelled \u201cReceipt!\u201d --I was sweating. It was February. Matei showed up at 8:15. He was supposed to be at the bookstore. Instead, he was standing in the doorway, holding a bag of pastries from the bakery down the street. \u201cYou look terrible,\u201d he said. \u201cI feel terrible.\u201d \u201cHow many cups?\u201d \u201cOne.\u201d \u201cThat is good.\u201d \u201cI also burned my hand on the steamer.\u201d Now say \u201cto sweat\u201d", "lang": "en"}, {"text": "schwitzen", "lang": "de"}], [{"text": "Schwitzen. Ich schwitzte \u2013 I was sweating. Now say \u201cthe steamer\u201d", "lang": "en"}, {"text": "der Dampfstab (on an espresso machine)", "lang": "de"}], [{"text": "Der Dampfstab. Masculine. Am Dampfstab verbrannt", "lang": "de"}, {"text": "\u2013 burned on the steamer --He walked behind the counter. Took my hand. Examined the burn. It was small. A red mark on my thumb. He kissed it. \u201cThat does not help,\u201d I said. \u201cIt helps me.\u201d He put the pastries in the display case. Took over the espresso machine while I handled the register. Together, we got through the morning rush. It was still chaos. But it was shared chaos. Now say \u201cthe burn\u201d", "lang": "en"}, {"text": "die Verbrennung", "lang": "de"}], [{"text": "Die Verbrennung. Feminine. Eine kleine Verbrennung", "lang": "de"}, {"text": "\u2013 a small burn Now say \u201cthe chaos\u201d", "lang": "en"}, {"text": "das Chaos", "lang": "de"}], [{"text": "Das Chaos. Neuter. Es war Chaos", "lang": "de"}, {"text": "\u2013 it was chaos --A woman walked in at 11. Young. Dark hair. Red coat. She looked at me. \u201cYves?\u201d \u201cDo I know you?\u201d \u201cYou do not remember me. That is okay. It was a long time ago.\u201d She paid. Sat at a table. Looked at her phone. My phone buzzed. Unknown number: You look good, Yves. Berlin suits you. I looked at the woman. She looked at me. She smiled. Now say \u201cthe red coat\u201d", "lang": "en"}, {"text": "der rote Mantel", "lang": "de"}], [{"text": "Der rote Mantel. Eine Frau im roten Mantel", "lang": "de"}, {"text": "\u2013 a woman in a red coat Now say \u201cunknown\u201d", "lang": "en"}, {"text": "unbekannt", "lang": "de"}], [{"text": "Unbekannt. Eine unbekannte Nummer \u2013 an unknown number. --I did not respond to the text. I put my phone away. Made another coffee for a customer who was not there. Matei was watching me. \u201cWho was that?\u201d he asked quietly. \u201cI do not know.\u201d \u201cShe knew your name.\u201d \u201cI noticed.\u201d The woman finished her latte. Walked to the counter. \u201cSame time tomorrow?\u201d she asked. \u201cI do not even know your name.\u201d \u201cNo.\u201d She smiled. \u201cYou do not.\u201d She left. The bell chimed. Now say \u201cto respond\u201d", "lang": "en"}, {"text": "antworten", "lang": "de"}], [{"text": "Antworten. Ich antwortete nicht \u2013 I did not respond. Now say \u201cto notice\u201d", "lang": "en"}, {"text": "bemerken", "lang": "de"}], [{"text": "Bemerken. Das habe ich bemerkt \u2013 I noticed that. --\u201cYves,\u201d Matei said. \u201cWhat?\u201d \u201cThat was weird.\u201d \u201cI know.\u201d \u201cDo you have any idea who she is?\u201d I thought about it. The dark hair. The red coat. The way she said my name. \u201cNo,\u201d I said. \u201cBut I think she knows me.\u201d Now say \u201cweird\u201d komisch or seltsam. Review", "lang": "en"}], [{"text": "Seltsam. Das war seltsam \u2013 that was weird. Now say \u201cthe idea\u201d", "lang": "en"}, {"text": "die Idee", "lang": "de"}], [{"text": "Die Idee. Feminine. Hast du eine Idee?", "lang": "de"}, {"text": "\u2013 Do you have an idea? --The rest of the day was a blur. More customers. More coffee. More dropped cups \u2013 two more, because my hands were shaking and I could not stop thinking about the woman in the red coat. At 3 PM, Matei left for his shift at the bookstore. He kissed my forehead and told me to lock the door behind me. \u201cText me if she comes back,\u201d he said. \u201cShe will not.\u201d \u201cHow do you know?\u201d \u201cBecause she said \u2018same time tomorrow.\u2019 That means she is planning something.\u201d Now say \u201cthe blur\u201d", "lang": "en"}, {"text": "der Schleier or die Unsch\u00e4rfe. Ein Blur \u2013 but English word", "lang": "de"}, {"text": "used. Better: Ein Wirbel \u2013 a whirl.", "lang": "en"}], [{"text": "Ein Wirbel. Der Rest des Tages war ein Wirbel", "lang": "de"}, {"text": "\u2013 the rest of the day was a whirl Now say \u201cto shake\u201d", "lang": "en"}, {"text": "zittern. Meine H\u00e4nde zitterten \u2013 my hands were shaking", "lang": "de"}], [{"text": "Zittern. Meine H\u00e4nde zitterten \u2013 my hands were shaking. --He looked at me. His grey eyes were worried. \u201cBe careful,\u201d he said. \u201cI am always careful.\u201d \u201cYou are not. But I am asking anyway.\u201d He left. I locked the door. Cleaned the counters. Counted the register. Turned off the lights. At 4 PM, I walked home. The streets were grey. The duck was not at the bridge. My phone buzzed again. Unknown number: You are wondering who I am. That is cute. See you tomorrow, Yves. I blocked the number. Now say \u201ccareful\u201d", "lang": "en"}, {"text": "vorsichtig", "lang": "de"}], [{"text": "Vorsichtig. Sei vorsichtig \u2013 be careful. Now say \u201cto block\u201d", "lang": "en"}, {"text": "blockieren. Ich habe die Nummer blockiert \u2013 I blocked the", "lang": "de"}, {"text": "number.", "lang": "en"}], [{"text": "Blockieren. Ich blockierte die Nummer \u2013 I blocked the number. --Matei was already home when I got there. He was sitting on the sofa, his laptop open, not typing. \u201cYou are home early,\u201d I said. \u201cThe bookstore was slow.\u201d \u201cYou are lying.\u201d \u201cI am worried.\u201d He closed the laptop. \u201cWho was that woman?\u201d \u201cI do not know.\u201d \u201cYou do not know, or you do not want to tell me?\u201d I sat on the wooden chair. The plastic one was still empty. Now say \u201cworried\u201d", "lang": "en"}, {"text": "besorgt", "lang": "de"}], [{"text": "Besorgt. Ich bin besorgt \u2013 I am worried. Now say \u201cto lie\u201d l\u00fcgen. Review. Du l\u00fcgst \u2013 you are lying", "lang": "en"}], [{"text": "L\u00fcgen. Du l\u00fcgst \u2013 you are lying. --\u201cI do not know,\u201d I said. \u201cI have never seen her before. But she knew my name. And she knew I was in Berlin. And she knew I worked at the caf\u00e9.\u201d \u201cThat is not nothing.\u201d \u201cI know.\u201d \u201cYves.\u201d He leaned forward. \u201cDid you leave behind something in Nigeria? Someone? A situation?\u201d I thought about it. My grandmother. The friends who had stopped calling. \u201cNo,\u201d I said. \u201cNothing like that.\u201d \u201cThen why is she here?\u201d \u201cI do not know.\u201d Now say \u201cthe situation\u201d", "lang": "en"}, {"text": "die Situation", "lang": "de"}], [{"text": "Die Situation. Feminine. Eine Situation hinterlassen", "lang": "de"}, {"text": "\u2013 to leave behind a situation. Now say \u201cto leave behind\u201d zur\u00fccklassen (separable)", "lang": "en"}], [{"text": "Zur\u00fccklassen. Hast du etwas zur\u00fcckgelassen? \u2013 Did you leave something behind? --He stood up. Walked to the window. Stared out at the street. \u201cI do not like this,\u201d he said. \u201cNeither do I.\u201d \u201cWhat are we going to do?\u201d I stood up. Walked to him. Put my hand on his back. \u201cWe are going to open the caf\u00e9 tomorrow,\u201d I said. \u201cAnd if she comes back, we are going to ask her who she is and what she wants.\u201d \u201cAnd if she does not tell us?\u201d \u201cThen we call the police.\u201d Now say \u201cthe police\u201d", "lang": "en"}, {"text": "die Polizei", "lang": "de"}], [{"text": "Die Polizei. Feminine. Die Polizei rufen", "lang": "de"}, {"text": "\u2013 to call the police Now say \u201cto ask\u201d", "lang": "en"}, {"text": "fragen. Wir werden sie fragen \u2013 we will ask her", "lang": "de"}, {"text": "He turned. His face was close to mine. \u201cYou are taking this very calmly.\u201d \u201cI am not calm. I am pretending to be calm. There is a difference.\u201d \u201cYou have said that before.\u201d \u201cIt is still true.\u201d He kissed me. Hard. Brief. \u201cOkay,\u201d he said. \u201cTomorrow. We figure it out.\u201d \u201cTogether.\u201d \u201cTogether.\u201d Now say \u201ccalm\u201d", "lang": "en"}, {"text": "ruhig", "lang": "de"}], [{"text": "Ruhig. Du bist sehr ruhig \u2013 you are very calm. Now say \u201cto pretend\u201d", "lang": "en"}, {"text": "vort\u00e4uschen or so tun als ob. Ich tue so, als ob ich ruhig", "lang": "de"}, {"text": "bin \u2013 I pretend to be calm.", "lang": "en"}], [{"text": "So tun als ob. Ich tue so, als ob ich ruhig bin \u2013 I pretend to be calm. --That night, I did not sleep. I lay in bed, staring at the ceiling, listening to Matei breathe. His arm was around my waist. His chest was warm against my back. I thought about the woman in the red coat. The way she had said my name. The way she had smiled. I had spent my whole life running from people who knew me. People who reminded me of who I used to be. But I did not know who I used to be anymore. I was Yves. Berlin. Coffee. Matei. That was supposed to be enough. Now say \u201cthe ceiling\u201d", "lang": "en"}, {"text": "die Decke", "lang": "de"}], [{"text": "Die Decke. Feminine. An die Decke starren", "lang": "de"}, {"text": "\u2013 to stare at the ceiling Now say \u201cto suppose\u201d", "lang": "en"}, {"text": "annehmen or sollen. Das sollte genug sein \u2013 that is", "lang": "de"}, {"text": "supposed to be enough.", "lang": "en"}], [{"text": "Sollen. Das sollte genug sein \u2013 that is supposed to be enough. --My phone buzzed. I had forgotten to block the number again. Unknown number: I know you blocked me. That is fine. I will see you tomorrow anyway. Sleep well, Yves. I deleted the message. Turned off my phone. Closed my eyes. Matei's arm tightened around me. \u201cYou are thinking too loud,\u201d he murmured. \u201cSorry.\u201d \u201cDo not be sorry. Just sleep.\u201d I tried. I really did. But somewhere in the city, a woman in a red coat was walking through the dark, and she knew my name, and she was not finished with me yet. Now say \u201cto delete\u201d", "lang": "en"}, {"text": "l\u00f6schen", "lang": "de"}], [{"text": "L\u00f6schen. Ich l\u00f6schte die Nachricht \u2013 I deleted the message. Now say \u201cto murmur\u201d", "lang": "en"}, {"text": "murmeln. Er murmelte \u2013 he murmured", "lang": "de"}], [{"text": "Murmeln. \u201eDu denkst zu laut\u201c, murmelte er \u2013 \u201cYou are thinking too loud,\u201d he murmured. --Dual-layer vocabulary review \u2013 Chapter 11 Layer 1 \u2013 Words", "lang": "en"}, {"text": "Der Tippfehler", "lang": "de"}, {"text": "\u2013 the typo. <break time=\"2s\"/> Der Tippfehler. Das ist kein Tippfehler.", "lang": "en"}, {"text": "Die Maschinerie", "lang": "de"}, {"text": "\u2013 the machinery. <break time=\"2s\"/> Die Maschinerie. Schwere Maschinerie.", "lang": "en"}, {"text": "Der Knopf", "lang": "de"}, {"text": "\u2013 the knob. <break time=\"2s\"/> Der Knopf. Den roten Knopf drehen", "lang": "en"}, {"text": "Die Kohle", "lang": "de"}, {"text": "\u2013 the charcoal. <break time=\"2s\"/> Die Kohle. Reine Kohle", "lang": "en"}, {"text": "Die Markise", "lang": "de"}, {"text": "\u2013 the awning. <break time=\"2s\"/> Die Markise. Die gr\u00fcne Markise Humpeln \u2013 to limp. <break time=\"2s\"/> Humpeln. Ein alter Mann humpelte.", "lang": "en"}, {"text": "Das Trinkgeld", "lang": "de"}, {"text": "\u2013 the tip. <break time=\"2s\"/> Das Trinkgeld. Zwei Euro Trinkgeld", "lang": "en"}, {"text": "Das Personal", "lang": "de"}, {"text": "\u2013 the staff. <break time=\"2s\"/> Das Personal. Das Personal", "lang": "en"}, {"text": "Die Quittung", "lang": "de"}, {"text": "\u2013 the receipt. <break time=\"2s\"/> Die Quittung. Die Quittung, bitte Schwitzen \u2013 to sweat. <break time=\"2s\"/> Schwitzen. Ich schwitzte.", "lang": "en"}, {"text": "Der Dampfstab", "lang": "de"}, {"text": "\u2013 the steamer (on coffee machine). <break time=\"2s\"/> Der Dampfstab Am Dampfstab verbrannt.", "lang": "en"}, {"text": "Die Verbrennung", "lang": "de"}, {"text": "\u2013 the burn. <break time=\"2s\"/> Die Verbrennung. Eine kleine Verbrennung.", "lang": "en"}, {"text": "Das Chaos", "lang": "de"}, {"text": "\u2013 the chaos. <break time=\"2s\"/> Das Chaos. Es war Chaos", "lang": "en"}, {"text": "Der rote Mantel", "lang": "de"}, {"text": "\u2013 the red coat. <break time=\"2s\"/> Der rote Mantel. Eine Frau im roten Mantel. Unbekannt \u2013 unknown. <break time=\"2s\"/> Unbekannt. Eine unbekannte Nummer. Antworten \u2013 to respond. <break time=\"2s\"/> Antworten. Ich antwortete nicht. Bemerken \u2013 to notice. <break time=\"2s\"/> Bemerken. Das habe ich bemerkt. Seltsam \u2013 weird. <break time=\"2s\"/> Seltsam. Das war seltsam.", "lang": "en"}, {"text": "Die Idee", "lang": "de"}, {"text": "\u2013 the idea. <break time=\"2s\"/> Die Idee. Hast du eine Idee?", "lang": "en"}, {"text": "Ein Wirbel", "lang": "de"}, {"text": "\u2013 a whirl / blur. <break time=\"2s\"/> Ein Wirbel. Ein Wirbel Zittern \u2013 to shake. <break time=\"2s\"/> Zittern. Meine H\u00e4nde zitterten. Vorsichtig \u2013 careful. <break time=\"2s\"/> Vorsichtig. Sei vorsichtig. Blockieren \u2013 to block. <break time=\"2s\"/> Blockieren. Ich blockierte die Nummer. Besorgt \u2013 worried. <break time=\"2s\"/> Besorgt. Ich bin besorgt.", "lang": "en"}, {"text": "Die Situation", "lang": "de"}, {"text": "\u2013 the situation. <break time=\"2s\"/> Die Situation. Eine Situation zur\u00fccklassen. Zur\u00fccklassen \u2013 to leave behind. <break time=\"2s\"/> Zur\u00fccklassen. Hast du etwas zur\u00fcckgelassen?", "lang": "en"}, {"text": "Die Polizei", "lang": "de"}, {"text": "\u2013 the police. <break time=\"2s\"/> Die Polizei. Die Polizei rufen Ruhig \u2013 calm. <break time=\"2s\"/> Ruhig. Du bist sehr ruhig. So tun als ob \u2013 to pretend. <break time=\"2s\"/> So tun als ob. Ich tue so, als ob ich ruhig bin.", "lang": "en"}, {"text": "Die Decke", "lang": "de"}, {"text": "\u2013 the ceiling. <break time=\"2s\"/> Die Decke. An die Decke starren Sollen \u2013 to be supposed to. <break time=\"2s\"/> Sollen. Das sollte genug sein. L\u00f6schen \u2013 to delete. <break time=\"2s\"/> L\u00f6schen. Ich l\u00f6schte die Nachricht. Murmeln \u2013 to murmur. <break time=\"2s\"/> Murmeln. Er murmelte. Layer 2 \u2013 Story phrases \"Das ist kein Tippfehler.\" \u2013 That's not a typo. <break time=\"2s\"/> Das ist kein Tippfehler. \"Den roten Knopf drehen.\" \u2013 Turn the red knob. <break time=\"2s\"/> Den roten Knopf drehen. \"Die Quittung, bitte.\" \u2013 The receipt, please. <break time=\"2s\"/> Die Quittung, bitte. \"Meine H\u00e4nde zitterten.\" \u2013 My hands were shaking. <break time=\"2s\"/> Meine H\u00e4nde zitterten. \"Sei vorsichtig.\" \u2013 Be careful. <break time=\"2s\"/> Sei vorsichtig. \"Ich bin besorgt.\" \u2013 I'm worried. <break time=\"2s\"/> Ich bin besorgt. \"Hast du etwas zur\u00fcckgelassen?\" \u2013 Did you leave something behind? <break time=\"2s\"/> Hast du etwas zur\u00fcckgelassen? \"Die Polizei rufen.\" \u2013 Call the police. <break time=\"2s\"/> Die Polizei rufen. \"Ich tue so, als ob ich ruhig bin.\" \u2013 I pretend to be calm. <break time=\"2s\"/> Ich tue so, als ob ich ruhig bin. \"Du denkst zu laut.\" \u2013 You're thinking too loud. <break time=\"2s\"/> Du denkst zu laut. --End of Chapter 11. --Chapter 12 \u2013 Lucky (A2) (Narrator voice, calm, clear. Ambient: caf\u00e9 ambience \u2013 soft hiss of espresso machine, clink of cups, quiet chatter.) She came back the next day. Same red coat. Same leather bag. Same smile that was not warm or cold but something in between. She ordered the same thing \u2013 latte, oat milk, extra hot \u2013 and paid with the same crisp euros. I made her drink. My hands were steady. I was proud of that. \u201cYou did not sleep well,\u201d she said. Not a question. \u201cHow would you know?\u201d \u201cYour eyes. They are tired.\u201d She took a sip of her latte. \u201cYou used to sleep like a rock. Nothing woke you up. Not the church bells, not the dogs, not your grandmother yelling at the television.\u201d Now say \u201cthe leather bag\u201d", "lang": "en"}, {"text": "die Ledertasche", "lang": "de"}], [{"text": "Die Ledertasche. Feminine. Eine Ledertasche", "lang": "de"}, {"text": "\u2013 a leather bag Now say \u201ccrisp\u201d", "lang": "en"}, {"text": "knackig or neu. Knackige Euros \u2013 crisp euros", "lang": "de"}], [{"text": "Knackig. Knackige Euros \u2013 crisp euros. --I stopped wiping the counter. \u201cWho are you?\u201d She set her cup down. Looked at me. Really looked. \u201cYou do not recognise me, do you?\u201d \u201cI told you. No.\u201d She laughed. It was a familiar laugh. Something from a long time ago, buried under years of forgetting. \u201cI am Adaeze,\u201d she said. \u201cBut you knew me as Ada.\u201d Now say \u201cto recognise\u201d", "lang": "en"}, {"text": "erkennen", "lang": "de"}], [{"text": "Erkennen. Du erkennst mich nicht", "lang": "de"}, {"text": "\u2013 you do not recognise me Now say \u201cburied\u201d", "lang": "en"}, {"text": "vergraben. Unter Jahren des Vergessens vergraben \u2013 buried under", "lang": "de"}, {"text": "years of forgetting.", "lang": "en"}], [{"text": "Vergraben. Unter Jahren des Vergessens vergraben \u2013 buried under years of forgetting. --The name hit me like a door slamming. Ada. Ada with the braids. Ada who lived down the street. Ada who used to sneak me food from her mother's kitchen when my grandmother forgot to cook. Ada who I had kissed once, behind the church, just to see what it felt like. Ada who I had stopped talking to when I realised I was kissing boys in secret and could not look her in the eye anymore. \u201cAda,\u201d I said. \u201cYou remember now.\u201d \u201cThat was ten years ago.\u201d \u201cTwelve. You were eight. I was nine.\u201d She smiled. The warm kind this time. \u201cYou kissed me behind the church and then you ran away. You have always been good at running, Lucky.\u201d Now say \u201cthe braids\u201d die Z\u00f6pfe (plural)", "lang": "en"}], [{"text": "Die Z\u00f6pfe. Plural. Ada mit den Z\u00f6pfen", "lang": "de"}, {"text": "\u2013 Ada with the braids Now say \u201cto sneak\u201d", "lang": "en"}, {"text": "schmuggeln or heimlich geben. Sie schmuggelte mir Essen zu \u2013", "lang": "de"}, {"text": "she snuck me food.", "lang": "en"}], [{"text": "Schmuggeln. Sie schmuggelte mir Essen zu \u2013 she snuck me food. --Lucky. That was my name before Yves. The name my grandmother called me. The name I had buried when I left Nigeria. The name I never wanted to hear again. \u201cDo not call me that,\u201d I said. \u201cWhy not? It is your name.\u201d \u201cIt is not my name anymore.\u201d She tilted her head. \u201cWhat is your name now?\u201d \u201cYves.\u201d \u201cYves,\u201d she repeated. \u201cFrench. Fancy. You always wanted to be somewhere else.\u201d Now say \u201cfancy\u201d", "lang": "en"}, {"text": "schick or elegant", "lang": "de"}], [{"text": "Schick. Franz\u00f6sisch. Schick. \u2013 French. Fancy. Now say \u201csomewhere else\u201d", "lang": "en"}, {"text": "irgendwo anders", "lang": "de"}], [{"text": "Irgendwo anders. Du wolltest immer irgendwo anders sein \u2013 you always wanted to be somewhere else. --The caf\u00e9 was empty except for us. The bell above the door was silent. The espresso machine hissed. \u201cWhat are you doing here, Ada?\u201d \u201cI live here now. Moved to Berlin last month. For work.\u201d She took another sip. \u201cI saw you through the window. I could not believe it. Lucky, in Berlin, making coffee. I had to come in.\u201d \u201cYou could have just said hello. You did not have to text me from an unknown number and act like a spy.\u201d \u201cI wanted to see if you would recognise me. You did not.\u201d She shrugged. \u201cThat is okay. It has been a long time.\u201d Now say \u201cthe spy\u201d", "lang": "en"}, {"text": "der Spion", "lang": "de"}], [{"text": "Der Spion. Masculine. Wie ein Spion", "lang": "de"}, {"text": "\u2013 like a spy Now say \u201cto shrug\u201d", "lang": "en"}, {"text": "mit den Schultern zucken", "lang": "de"}], [{"text": "Mit den Schultern zucken. Sie zuckte mit den Schultern \u2013 she shrugged. --\u201cHow did you get my number?\u201d \u201cYour grandmother. She said you had changed your name and moved to Germany. She did not know the city. I had to find that on my own.\u201d My grandmother. Of course. She had never understood why I left. She probably thought Ada could talk sense into me. \u201cYou should not have come,\u201d I said. \u201cToo late. I am here.\u201d The bell chimed. Matei walked in. Now say \u201cthe grandmother\u201d", "lang": "en"}, {"text": "die Gro\u00dfmutter", "lang": "de"}], [{"text": "Die Gro\u00dfmutter. Feminine. Deine Gro\u00dfmutter", "lang": "de"}, {"text": "\u2013 your grandmother Now say \u201cof course\u201d", "lang": "en"}, {"text": "nat\u00fcrlich", "lang": "de"}], [{"text": "Nat\u00fcrlich. Nat\u00fcrlich \u2013 of course. --He was wearing his grey coat. His hair was messy. His eyes went straight to Ada, then to me, then back to Ada. \u201cYves,\u201d he said. \u201cWho is this?\u201d I opened my mouth. The words did not come. This was the moment. I could introduce her as Ada, an old friend from Nigeria. I could tell the truth \u2013 that she was someone I had kissed once, someone who knew me before I knew myself. I could be honest, the way Matei had asked me to be. But I was scared. Scared of what Matei would think. Scared of the questions he would ask. Scared of the boy I used to be. \u201cAn old friend,\u201d I said. \u201cAda.\u201d Now say \u201cthe moment\u201d der Moment. Review", "lang": "en"}], [{"text": "Der Moment. Dies war der Moment", "lang": "de"}, {"text": "\u2013 this was the moment Now say \u201chonest\u201d", "lang": "en"}, {"text": "ehrlich", "lang": "de"}], [{"text": "Ehrlich. Ehrlich sein \u2013 to be honest. --Matei looked at her. Then at me. \u201cNice to meet you,\u201d he said. His voice was flat. \u201cYou too.\u201d Ada smiled at him. Then at me. \u201cAnd you are?\u201d \u201cMatei. I work at the bookstore down the street.\u201d \u201cAh. Yves's coworker?\u201d I should have corrected her. I should have said he is my boyfriend or he is the man I am sleeping with or he is the reason I am still in this city. But the words would not come. My mouth was dry. My hands were shaking. \u201cWe share an apartment,\u201d I said. \u201cHe is my roommate.\u201d Now say \u201cthe roommate\u201d", "lang": "en"}, {"text": "der Mitbewohner", "lang": "de"}], [{"text": "Der Mitbewohner. Masculine. Mein Mitbewohner", "lang": "de"}, {"text": "\u2013 my roommate Now say \u201cto correct\u201d", "lang": "en"}, {"text": "korrigieren", "lang": "de"}], [{"text": "Korrigieren. Ich h\u00e4tte sie korrigieren sollen \u2013 I should have corrected her. --Matei's expression did not change. But his hands \u2013 his hands curled into fists at his sides. \u201cThat is nice,\u201d Ada said. \u201cIt is hard to find good roommates in Berlin.\u201d \u201cHard to find good ones anywhere,\u201d Matei said. He walked behind the counter. Did not touch me. Did not look at me. Started cleaning the espresso machine. The silence was loud. Ada finished her latte. Stood up. Sling her bag over her shoulder. \u201cI will be around, Lucky,\u201d she said. \u201cWe should catch up properly. Maybe dinner?\u201d \u201cMaybe,\u201d I said. Now say \u201cto catch up\u201d", "lang": "en"}, {"text": "sich unterhalten or aufholen. Wir sollten uns unterhalten", "lang": "de"}, {"text": "\u2013 we should catch up.", "lang": "en"}], [{"text": "Sich unterhalten. Wir sollten uns unterhalten \u2013 we should catch up. Now say \u201cproperly\u201d", "lang": "en"}, {"text": "richtig or ordentlich", "lang": "de"}], [{"text": "Richtig. Richtig unterhalten \u2013 catch up properly. --She left. The bell chimed. The door closed. Matei did not look up from the espresso machine. \u201cRoommate,\u201d he said. \u201cMatei \u2013\u201d \u201cRoommate. That is what I am. A roommate.\u201d \u201cYou do not understand.\u201d \u201cThen explain it to me.\u201d I walked to him. Put my hand on his arm. He did not pull away, but he did not lean in either. Now say \u201cto explain\u201d erkl\u00e4ren. Review", "lang": "en"}], [{"text": "Erkl\u00e4ren. Dann erkl\u00e4re es mir", "lang": "de"}, {"text": "\u2013 then explain it to me Now say \u201cto pull away\u201d wegziehen (separable)", "lang": "en"}], [{"text": "Wegziehen. Er zog sich nicht weg \u2013 he did not pull away. --\u201cThat is Ada,\u201d I said. \u201cI knew her when I was a kid. In Nigeria. She called me Lucky. That was my name before Yves.\u201d \u201cI do not care what your name was.\u201d \u201cI kissed her once. Behind a church. I was eight. She was nine. I did not know what I was doing.\u201d \u201cI do not care about that either.\u201d \u201cThen what do you care about?\u201d He finally looked at me. His grey eyes were hard. \u201cI care that you introduced me as your roommate. I care that you lied. I care that you are still hiding.\u201d Now say \u201cto care\u201d", "lang": "en"}, {"text": "k\u00fcmmern. Es k\u00fcmmert mich \u2013 I care", "lang": "de"}], [{"text": "K\u00fcmmern. Es k\u00fcmmert mich, dass du gelogen hast \u2013 I care that you lied. Now say \u201cto hide\u201d verstecken. Review", "lang": "en"}], [{"text": "Verstecken. Dass du dich immer noch versteckst \u2013 that you are still hiding. --\u201cI am not hiding.\u201d \u201cYou just hid me.\u201d The words hit like a punch. \u201cI was scared,\u201d I said. \u201cOf what?\u201d \u201cOf her. Of what she would think. Of what she would say. She knew me before. Before I knew myself. She thought I was straight. She thought I was going to grow up and marry her or someone like her. And I could not \u2013 I could not just \u2013\u201d \u201cYou could not tell her the truth.\u201d \u201cI could not.\u201d Now say \u201cstraight\u201d", "lang": "en"}, {"text": "heterosexuell", "lang": "de"}], [{"text": "Heterosexuell. Sie
