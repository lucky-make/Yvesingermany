ce.” “You have been practicing?” “Every time you were not home.” I set my fork down. “Matei. What is going on?”"}, {"type": "practice", "prompt": "Now say “practice” – die Übung.", "answer": "Die Übung. Ich habe Übung – I have practice.", "slow": "Die Übung. Ich habe Übung – I have practice.", "grammar": "Ich habe Übung – I have practice."}, {"type": "practice", "prompt": "Now say “the fork” – die Gabel.", "answer": "Die Gabel. Feminine. Ich legte die Gabel hin – I set the fork down.", "slow": "Die Gabel. Feminine. Ich legte die Gabel hin – I set the fork down.", "grammar": "Feminine. Ich legte die Gabel hin – I set the fork down."}, {"type": "narration", "text": "--He ate a bite of his pasta. Chewed. Swallowed. Took a breath."}, {"type": "dialogue", "text": "“I have been thinking about the future,” he said."}, {"type": "dialogue", "text": "“That is vague.”"}, {"type": "dialogue", "text": "“I have been thinking about us. About what comes next.”"}, {"type": "narration", "text": "My chest tightened. “Are you breaking up with me?”"}, {"type": "dialogue", "text": "“No.” He reached across the table. Took my hand. “I am asking you something.”"}, {"type": "dialogue", "text": "“Okay.”"}, {"type": "dialogue", "text": "“Not yet. Eat first. I do not want you to say yes on an empty stomach.”"}, {"type": "practice", "prompt": "Now say “vague” – vage.", "answer": "Vage. Das ist vage – that is vague.", "slow": "Vage. Das ist vage – that is vague.", "grammar": "Das ist vage – that is vague."}, {"type": "practice", "prompt": "Now say “to break up” – Schluss machen.", "answer": "Schluss machen. Machst du Schluss mit mir? – are you breaking up with me?.", "slow": "Schluss machen. Machst du Schluss mit mir? – are you breaking up with me?.", "grammar": "Machst du Schluss mit mir? – are you breaking up with me?"}, {"type": "narration", "text": "--I laughed. It was shaky. “You are insane.”"}, {"type": "dialogue", "text": "“Probably.”"}, {"type": "narration", "text": "We ate. The pasta was perfect. The candles flickered. The radiator clicked. When our plates were empty, he stood up. Walked to the window. Turned back to face me."}, {"type": "dialogue", "text": "“Yves.”"}, {"type": "dialogue", "text": "“Matei.”"}, {"type": "dialogue", "text": "“I am not good with words. You know that. I remember things. I show up. I make"}, {"type": "narration", "text": "coffee. But I do not say the big things.”"}, {"type": "dialogue", "text": "“You are saying them now.”"}, {"type": "dialogue", "text": "“I am trying.”"}, {"type": "practice", "prompt": "Now say “empty” – leer.", "answer": "Leer. Unsere Teller waren leer – our plates were empty.", "slow": "Leer. Unsere Teller waren leer – our plates were empty.", "grammar": "Unsere Teller waren leer – our plates were empty."}, {"type": "practice", "prompt": "Now say “the big things” – die großen Dinge.", "answer": "Die großen Dinge. Ich sage die großen Dinge nicht – I do not say the big things.", "slow": "Die großen Dinge. Ich sage die großen Dinge nicht – I do not say the big things.", "grammar": "Ich sage die großen Dinge nicht – I do not say the big things."}, {"type": "narration", "text": "--He walked to me. Knelt down. Not on one knee – just knelt, so his face was level with mine."}, {"type": "dialogue", "text": "“I love you,” he said. “I have loved you since the first message. Two years ago."}, {"type": "narration", "text": "Before I knew your face. Before I knew your laugh. Before I knew that you drop cups and apologise to the floor.”"}, {"type": "dialogue", "text": "“I do not apologise to the floor.”"}, {"type": "dialogue", "text": "“You do. I have seen it.”"}, {"type": "narration", "text": "I laughed. He did not."}, {"type": "practice", "prompt": "Now say “to kneel” – knien.", "answer": "Knien. Er kniete sich hin – he knelt down.", "slow": "Knien. Er kniete sich hin – he knelt down.", "grammar": "Er kniete sich hin – he knelt down."}, {"type": "practice", "prompt": "Now say “level with” – auf gleicher Höhe mit.", "answer": "Auf gleicher Höhe. Sein Gesicht war auf gleicher Höhe mit meinem – his face was.", "slow": "Auf gleicher Höhe. Sein Gesicht war auf gleicher Höhe mit meinem – his face was.", "grammar": "Sein Gesicht war auf gleicher Höhe mit meinem – his face was level with mine."}, {"type": "dialogue", "text": "--“Yves. I want to build something with you. Something that lasts. Something that is"}, {"type": "dialogue", "text": "“What are you saying?”"}, {"type": "narration", "text": "He reached into his pocket. Pulled out a small box. Black velvet."}, {"type": "dialogue", "text": "“I am saying I do not want you to be my roommate anymore. Or my boyfriend. Or the"}, {"type": "narration", "text": "man who sleeps in my bed.” He opened the box. Inside was a ring. Silver. Simple. A thin band with a small etching – a line that looked like a wave, or a bridge, or the curve of a duck's neck."}, {"type": "dialogue", "text": "“I want you to be my family,” he said."}, {"type": "practice", "prompt": "Now say “the velvet” – der Samt.", "answer": "Der Samt. Masculine. Schwarzer Samt – black velvet.", "slow": "Der Samt. Masculine. Schwarzer Samt – black velvet.", "grammar": "Masculine. Schwarzer Samt – black velvet."}, {"type": "practice", "prompt": "Now say “the ring” – der Ring.", "answer": "Der Ring. Masculine. Ein silberner Ring – a silver ring.", "slow": "Der Ring. Masculine. Ein silberner Ring – a silver ring.", "grammar": "Masculine. Ein silberner Ring – a silver ring."}, {"type": "narration", "text": "--I stared at the ring. My vision blurred."}, {"type": "dialogue", "text": "“Matei.”"}, {"type": "dialogue", "text": "“Yves.”"}, {"type": "dialogue", "text": "“Are you proposing?”"}, {"type": "dialogue", "text": "“I am asking.” His voice was steady. “Will you marry me?”"}, {"type": "narration", "text": "The room was silent. The candles flickered. The radiator clicked. Somewhere downstairs, the bakery was closing – the metal grate scraping down."}, {"type": "dialogue", "text": "“Yes,” I said."}, {"type": "dialogue", "text": "“Yes. Yes, I will marry you. Yes, I will be your family. Yes, I will stop"}, {"type": "practice", "prompt": "Now say “to propose” – einen Heiratsantrag machen.", "answer": "Einen Heiratsantrag machen. Machst du mir einen Antrag? – are you proposing to me?.", "slow": "Einen Heiratsantrag machen. Machst du mir einen Antrag? – are you proposing to me?.", "grammar": "Machst du mir einen Antrag? – are you proposing to me?"}, {"type": "practice", "prompt": "Now say “to blur” – verschwimmen. Meine Sicht verschwamm – my vision blurred.", "answer": "--He took the ring out of the box. Slipped it onto my finger. It was warm from being.", "slow": "--He took the ring out of the box. Slipped it onto my finger. It was warm from being.", "grammar": "Slipped it onto my finger. It was warm from being in his pocket. It fit perfectly."}, {"type": "dialogue", "text": "“How did you know my size?” I asked."}, {"type": "dialogue", "text": "“I measured your finger while you were sleeping.”"}, {"type": "dialogue", "text": "“That is creepy.”"}, {"type": "dialogue", "text": "“That is practical.”"}, {"type": "narration", "text": "I laughed. He kissed me. The candles flickered. The pasta cooled on the table."}, {"type": "practice", "prompt": "Now say “to measure” – messen.", "answer": "Messen. Ich habe deinen Finger gemessen – I measured your finger.", "slow": "Messen. Ich habe deinen Finger gemessen – I measured your finger.", "grammar": "Ich habe deinen Finger gemessen – I measured your finger."}, {"type": "practice", "prompt": "Now say “creepy” – gruselig.", "answer": "Gruselig. Das ist gruselig – that is creepy.", "slow": "Gruselig. Das ist gruselig – that is creepy.", "grammar": "Das ist gruselig – that is creepy."}, {"type": "dialogue", "text": "--“Matei.”"}, {"type": "dialogue", "text": "“What?”"}, {"type": "dialogue", "text": "“I love you.”"}, {"type": "dialogue", "text": "“I love you too.”"}, {"type": "narration", "text": "We sat on the sofa. His arm was around me. My hand was in his. The ring caught the candlelight."}, {"type": "dialogue", "text": "“We are getting married,” I said."}, {"type": "dialogue", "text": "“We are getting married.”"}, {"type": "dialogue", "text": "“In Berlin?”"}, {"type": "dialogue", "text": "“In Berlin.”"}, {"type": "dialogue", "text": "“With Frau Schmidt as a witness?”"}, {"type": "dialogue", "text": "“With Frau Schmidt as a witness.”"}, {"type": "dialogue", "text": "“And Ada?”"}, {"type": "dialogue", "text": "“And Ada. And Andreea, if she will come.”"}, {"type": "practice", "prompt": "Now say “the witness” – der Zeuge / die Zeugin.", "answer": "Der Zeuge. Masculine. Als Zeugin – as a witness.", "slow": "Der Zeuge. Masculine. Als Zeugin – as a witness.", "grammar": "Masculine. Als Zeugin – as a witness."}, {"type": "practice", "prompt": "Now say “to catch the light” – das Licht einfangen.", "answer": "Das Licht einfangen. Der Ring fing das Kerzenlicht ein – the ring caught the.", "slow": "Das Licht einfangen. Der Ring fing das Kerzenlicht ein – the ring caught the.", "grammar": "Der Ring fing das Kerzenlicht ein – the ring caught the candlelight."}, {"type": "dialogue", "text": "“Okay,” I said."}, {"type": "dialogue", "text": "“Okay.”"}, {"type": "narration", "text": "We sat like that until the candles burned out and the street went quiet. Tomorrow, we would tell everyone. Tomorrow, we would start planning. But tonight, we were just here. Engaged. Together. And that was everything."}, {"type": "practice", "prompt": "Now say “to burn out” – ausbrennen.", "answer": "Ausbrennen. Die Kerzen brannten aus – the candles burned out.", "slow": "Ausbrennen. Die Kerzen brannten aus – the candles burned out.", "grammar": "Die Kerzen brannten aus – the candles burned out."}, {"type": "practice", "prompt": "Now say “engaged” – verlobt.", "answer": "Verlobt. Wir sind verlobt – we are engaged.", "slow": "Verlobt. Wir sind verlobt – we are engaged.", "grammar": "Wir sind verlobt – we are engaged."}], "bg": "apartment", "location": "Matei's Apartment — The Proposal"}, {"id": 21, "title": "The Plan", "level": "B1-B2", "segments": [{"type": "narration", "text": "train, soft breathing.) We did not sleep that night. It was past 2 AM. The candles on the table had burned out hours ago. The apartment was quiet except for the radiator's occasional click and the distant sound of a train somewhere across the city. We were still on the sofa. Matei's arm was around me. The ring was still on my finger. Every few minutes, I would look at it again, just to make sure it was real."}, {"type": "dialogue", "text": "“We should talk,” I said."}, {"type": "dialogue", "text": "“About what?”"}, {"type": "dialogue", "text": "“About everything. About what comes next.”"}, {"type": "practice", "prompt": "Now say “the train” – der Zug.", "answer": "Der Zug. Masculine. Ein Zug in der Ferne – a train in the distance.", "slow": "Der Zug. Masculine. Ein Zug in der Ferne – a train in the distance.", "grammar": "Masculine. Ein Zug in der Ferne – a train in the distance."}, {"type": "practice", "prompt": "Now say “to make sure” – sicherstellen. Um sicherzustellen, dass es echt ist – to", "answer": "make sure it is real.", "slow": "make sure it is real.", "grammar": "Repeat aloud: make sure it is real."}, {"type": "narration", "text": "--He was quiet for a moment. Then he said, “I thought you would want to sleep on it first.”"}, {"type": "dialogue", "text": "“Sleep on an engagement? That is not how it works.”"}, {"type": "dialogue", "text": "“How does it work?”"}, {"type": "dialogue", "text": "“I do not know. I have never been engaged before.” I looked at him. “Neither have"}, {"type": "dialogue", "text": "“Fair point.”"}, {"type": "narration", "text": "I sat up. Turned to face him. The sofa creaked."}, {"type": "practice", "prompt": "Now say “the engagement” – die Verlobung.", "answer": "Die Verlobung. Feminine. Über eine Verlobung schlafen – to sleep on an engagement.", "slow": "Die Verlobung. Feminine. Über eine Verlobung schlafen – to sleep on an engagement.", "grammar": "Feminine. Über eine Verlobung schlafen – to sleep on an engagement."}, {"type": "practice", "prompt": "Now say “fair point” – das ist ein fairer Punkt.", "answer": "Das ist ein fairer Punkt. Fairer Punkt – fair point.", "slow": "Das ist ein fairer Punkt. Fairer Punkt – fair point.", "grammar": "Fairer Punkt – fair point."}, {"type": "dialogue", "text": "--“Matei. I need to know what you want. Not just the proposal. The real things. The"}, {"type": "narration", "text": "house, the kids, the money, the work. All of it.” He ran a hand through his hair. “That is a lot for 2 AM.”"}, {"type": "dialogue", "text": "“We are not going to sleep anyway.”"}, {"type": "narration", "text": "He sighed. “Okay. What do you want to know first?”"}, {"type": "dialogue", "text": "“Where are we going to live?”"}, {"type": "narration", "text": "He blinked. “Here? In Berlin?”"}, {"type": "dialogue", "text": "“For now. But eventually. Do we stay in this apartment forever? Do we find"}, {"type": "dialogue", "text": "“You want to be a boring adult?”"}, {"type": "dialogue", "text": "“I want a garden.”"}, {"type": "practice", "prompt": "Now say “the garden” – der Garten.", "answer": "Der Garten. Masculine. Ich möchte einen Garten – I want a garden.", "slow": "Der Garten. Masculine. Ich möchte einen Garten – I want a garden.", "grammar": "Masculine. Ich möchte einen Garten – I want a garden."}, {"type": "practice", "prompt": "Now say “boring” – langweilig.", "answer": "Langweilig. Ein langweiliger Erwachsener – a boring adult.", "slow": "Langweilig. Ein langweiliger Erwachsener – a boring adult.", "grammar": "Ein langweiliger Erwachsener – a boring adult."}, {"type": "narration", "text": "--He stared at me. “A garden.”"}, {"type": "dialogue", "text": "“For the kids. And the duck.”"}, {"type": "dialogue", "text": "“The duck does not live with us.”"}, {"type": "dialogue", "text": "“The duck can visit.”"}, {"type": "dialogue", "text": "“You are not going to let that go, are you?”"}, {"type": "dialogue", "text": "“Never.”"}, {"type": "narration", "text": "He laughed. It was tired, but real."}, {"type": "dialogue", "text": "“Okay,” he said. “A garden. Eventually. But first, we save money. The café does"}, {"type": "dialogue", "text": "“I have the IT Ausbildung coming up. If I get it, the salary will be better.”"}, {"type": "dialogue", "text": "“You keep saying ‘if.’”"}, {"type": "dialogue", "text": "“Because I am scared.”"}, {"type": "practice", "prompt": "Now say “to save money” – Geld sparen.", "answer": "Geld sparen. Wir müssen Geld sparen – we have to save money.", "slow": "Geld sparen. Wir müssen Geld sparen – we have to save money.", "grammar": "Wir müssen Geld sparen – we have to save money."}, {"type": "practice", "prompt": "Now say “the salary” – das Gehalt.", "answer": "Das Gehalt. Neuter. Das Gehalt wird besser sein – the salary will be better.", "slow": "Das Gehalt. Neuter. Das Gehalt wird besser sein – the salary will be better.", "grammar": "Neuter. Das Gehalt wird besser sein – the salary will be better."}, {"type": "dialogue", "text": "--“Do not be scared,” he said."}, {"type": "dialogue", "text": "“Telling me not to be scared does not make me less scared.”"}, {"type": "narration", "text": "He took my hand. “Then let me help you study. Let me practice the interview questions with you. Let me be useful.”"}, {"type": "dialogue", "text": "“You are already useful.”"}, {"type": "dialogue", "text": "“I want to be more useful.”"}, {"type": "narration", "text": "I leaned into him. “Okay. You can help me study.”"}, {"type": "dialogue", "text": "“Good.”"}, {"type": "narration", "text": "We were quiet for a moment."}, {"type": "practice", "prompt": "Now say “useful” – nützlich.", "answer": "Nützlich. Du bist schon nützlich – you are already useful.", "slow": "Nützlich. Du bist schon nützlich – you are already useful.", "grammar": "Du bist schon nützlich – you are already useful."}, {"type": "practice", "prompt": "Now say “to study” – lernen or studieren. Du kannst mir helfen zu lernen – you can", "answer": "help me study.", "slow": "help me study.", "grammar": "Repeat aloud: help me study."}, {"type": "dialogue", "text": "--“Kids,” I said. “How do you want to do it?”"}, {"type": "dialogue", "text": "“Adoption,” he said without hesitation."}, {"type": "dialogue", "text": "“Really?”"}, {"type": "dialogue", "text": "“I have thought about it. For a long time. Even before you.”"}, {"type": "dialogue", "text": "“How long?”"}, {"type": "dialogue", "text": "“Since I was a kid. My parents were not great. My father drank. My mother"}, {"type": "narration", "text": "pretended everything was fine.” He paused. “I always thought that if I ever had children, I would want to give them something different. A home that did not hurt.”"}, {"type": "practice", "prompt": "Now say “adoption” – die Adoption.", "answer": "Die Adoption. Feminine. Adoption – adoption.", "slow": "Die Adoption. Feminine. Adoption – adoption.", "grammar": "Feminine. Adoption – adoption."}, {"type": "practice", "prompt": "Now say “to pretend” – vortäuschen. Meine Mutter tat so, als ob alles in Ordnung", "answer": "wäre – my mother pretended everything was fine.", "slow": "wäre – my mother pretended everything was fine.", "grammar": "Repeat aloud: wäre – my mother pretended everything was fine."}, {"type": "narration", "text": "--I looked at him. His grey eyes were wet."}, {"type": "dialogue", "text": "“I did not know that about you,” I said."}, {"type": "dialogue", "text": "“I do not talk about it.”"}, {"type": "dialogue", "text": "“Why not?”"}, {"type": "dialogue", "text": "“Because it is done. It is in the past. I do not need to fix it. I just need to"}, {"type": "narration", "text": "not repeat it.” I held his hand tighter."}, {"type": "dialogue", "text": "“Then we adopt,” I said. “Two kids. Maybe three.”"}, {"type": "dialogue", "text": "“Two to start.”"}, {"type": "dialogue", "text": "“Two to start. And we give them everything we did not have.”"}, {"type": "dialogue", "text": "“Everything.”"}, {"type": "practice", "prompt": "Now say “to repeat” – wiederholen.", "answer": "Wiederholen. Ich will es nicht wiederholen – I do not want to repeat it.", "slow": "Wiederholen. Ich will es nicht wiederholen – I do not want to repeat it.", "grammar": "Ich will es nicht wiederholen – I do not want to repeat it."}, {"type": "practice", "prompt": "Now say “tighter” – fester. Ich hielt seine Hand fester – I held his hand tighter.", "answer": "--We sat with that for a while. The weight of it. The promise.", "slow": "--We sat with that for a while. The weight of it. The promise.", "grammar": "The weight of it. The promise. “What about the café?” I asked. “What about it?” “Frau Schmidt wants us to take over. Do you want to?” “It is your café.” “I run it. But you help. It is ours.”"}, {"type": "narration", "text": "He shook his head. “It is not mine. I just carry pastries.”"}, {"type": "dialogue", "text": "“You do more than that.”"}, {"type": "dialogue", "text": "“I make moral support.”"}, {"type": "dialogue", "text": "“That is not nothing.”"}, {"type": "practice", "prompt": "Now say “moral support” – moralische Unterstützung.", "answer": "Moralische Unterstützung. Moralische Unterstützung leisten – to provide moral.", "slow": "Moralische Unterstützung. Moralische Unterstützung leisten – to provide moral.", "grammar": "Moralische Unterstützung leisten – to provide moral support."}, {"type": "practice", "prompt": "Now say “to carry” – tragen. Ich trage nur Gebäck – I just carry pastries.", "answer": "--He was quiet for a long moment. Then he said, “You really mean that.”.", "slow": "--He was quiet for a long moment. Then he said, “You really mean that.”.", "grammar": "Then he said, “You really mean that.” “I really do.” “Okay. Then we take over the café. Not now. In a year. Two years. Whenever Frau Schmidt is ready.” “And we learn the business side together.” “I hate numbers.” “You will learn to tolerate them.” He sighed. “Fine.”"}, {"type": "practice", "prompt": "Now say “the business side” – die geschäftliche Seite.", "answer": "Die geschäftliche Seite. Die geschäftliche Seite lernen – to learn the business.", "slow": "Die geschäftliche Seite. Die geschäftliche Seite lernen – to learn the business.", "grammar": "Die geschäftliche Seite lernen – to learn the business side."}, {"type": "practice", "prompt": "Now say “to tolerate” – tolerieren or ertragen. Du wirst lernen, sie zu ertragen –", "answer": "you will learn to tolerate them.", "slow": "you will learn to tolerate them.", "grammar": "Repeat aloud: you will learn to tolerate them."}, {"type": "narration", "text": "--Around 3 AM, we moved to the bed. Not to sleep – just to lie down. The ceiling was cracked in the corner. Matei had been saying he would fix it for months. He never did."}, {"type": "dialogue", "text": "“We need a bigger apartment,” I said."}, {"type": "dialogue", "text": "“After the wedding.”"}, {"type": "dialogue", "text": "“There is no wedding yet. We are just engaged.”"}, {"type": "dialogue", "text": "“Engaged people can look for apartments.”"}, {"type": "dialogue", "text": "“Engaged people save money first.”"}, {"type": "narration", "text": "He turned his head to look at me."}, {"type": "dialogue", "text": "“You are very practical,” he said."}, {"type": "dialogue", "text": "“I am very scared. Practical is what scared people become.”"}, {"type": "practice", "prompt": "Now say “practical” – praktisch. Review.", "answer": "Praktisch. Du bist sehr praktisch – you are very practical.", "slow": "Praktisch. Du bist sehr praktisch – you are very practical.", "grammar": "Du bist sehr praktisch – you are very practical."}, {"type": "practice", "prompt": "Now say “scared” – verängstigt. Das ist, was verängstigte Menschen werden – that", "answer": "is what scared people become.", "slow": "is what scared people become.", "grammar": "Repeat aloud: is what scared people become."}, {"type": "dialogue", "text": "--“What are you scared of?”"}, {"type": "narration", "text": "I thought about it. About Nigeria. About my grandmother. About all the years of running."}, {"type": "dialogue", "text": "“I am scared that I am going to wake up one day and realise I do not deserve any"}, {"type": "narration", "text": "of this.” Matei propped himself up on his elbow."}, {"type": "dialogue", "text": "“Yves.”"}, {"type": "dialogue", "text": "“What?”"}, {"type": "dialogue", "text": "“You deserve everything. You deserve a house. You deserve a garden. You deserve"}, {"type": "narration", "text": "children who will never know what it feels like to be unwanted. You deserve a man who shows up every day and chooses you.”"}, {"type": "dialogue", "text": "“Even when I drop cups?”"}, {"type": "dialogue", "text": "“Especially when you drop cups.”"}, {"type": "practice", "prompt": "Now say “to prop up” – aufstützen.", "answer": "Aufstützen. Er stützte sich auf seinen Ellbogen – he propped himself up on his.", "slow": "Aufstützen. Er stützte sich auf seinen Ellbogen – he propped himself up on his.", "grammar": "Er stützte sich auf seinen Ellbogen – he propped himself up on his elbow."}, {"type": "practice", "prompt": "Now say “to choose” – wählen. Ein Mann, der dich jeden Tag wählt – a man who", "answer": "chooses you every day.", "slow": "chooses you every day.", "grammar": "Repeat aloud: chooses you every day."}, {"type": "narration", "text": "--I laughed. It was shaky."}, {"type": "dialogue", "text": "“That is a lot of pressure,” I said."}, {"type": "dialogue", "text": "“It is not pressure. It is patience. Pressure is what you put on yourself."}, {"type": "narration", "text": "Patience is what I am giving you.”"}, {"type": "dialogue", "text": "“You have said that before.”"}, {"type": "dialogue", "text": "“Because you keep needing to hear it.”"}, {"type": "narration", "text": "I reached up. Touched his face. His jaw was rough with stubble."}, {"type": "dialogue", "text": "“I love you,” I said."}, {"type": "dialogue", "text": "“I love you too.”"}, {"type": "narration", "text": "He kissed me. Soft. Slow. Then we lay back down and stared at the ceiling some more."}, {"type": "practice", "prompt": "Now say “pressure” – der Druck. Review.", "answer": "Der Druck. Das ist kein Druck – that is not pressure.", "slow": "Der Druck. Das ist kein Druck – that is not pressure.", "grammar": "Das ist kein Druck – that is not pressure."}, {"type": "practice", "prompt": "Now say “patience” – die Geduld. Review.", "answer": "Die Geduld. Geduld ist das, was ich dir gebe – patience is what I am giving you.", "slow": "Die Geduld. Geduld ist das, was ich dir gebe – patience is what I am giving you.", "grammar": "Geduld ist das, was ich dir gebe – patience is what I am giving you."}], "bg": "apartment", "location": "Matei's Apartment — 3AM"}];

// ── Vocab ──────────────────────────────────────────────────────
function buildVocab(){
  const m=new Map();
  for(const ch of CHAPTERS)for(const s of ch.segments){
    if(s.type==='practice'&&s.answer){
      const de=s.answer.replace(/\.$/,'').trim();
      const pm=s.prompt.match(/"([^"\u201c\u201d]+)"/);
      if(pm&&de&&de.length<60)m.set(de,pm[1]);
    }
  }
  return[...m.entries()].map(([de,en])=>({de,en}));
}

// ── Screen mgmt ────────────────────────────────────────────────
function hide(...ids){ids.forEach(id=>{const el=document.getElementById(id);if(el){el.style.display='none';}})}
function show(id,disp='block'){document.getElementById(id).style.display=disp;}
function showTitle(){hide('game-screen','chapter-screen','vocab-screen','practice-modal');show('title-screen','flex');stopRec();}
function showChapters(){hide('title-screen','game-screen','vocab-screen');show('chapter-screen');buildCHGrid();}
function showVocab(){hide('title-screen','game-screen','chapter-screen');show('vocab-screen');buildVGrid();}
function showGame(){hide('title-screen','chapter-screen','vocab-screen');show('game-screen','flex');renderSeg();}
function startGame(){S.chIdx=0;S.segIdx=0;showGame();}
function gotoChapter(idx){
  S.chIdx=idx;const sv=S.prog[idx];
  S.segIdx=sv?Math.min(sv.si,CHAPTERS[idx].segments.length-1):0;
  showGame();
}

// ── Chapter grid ───────────────────────────────────────────────
function buildCHGrid(){
  const g=document.getElementById('ch-grid');g.innerHTML='';
  CHAPTERS.forEach((ch,idx)=>{
    const sv=S.prog[idx]||{};
    const done=sv.done;
    const unlocked=idx===0||!!S.prog[idx-1];
    const prog=sv.si?Math.round((sv.si/ch.segments.length)*100):0;
    const d=document.createElement('div');
    d.className=`ch-card${done?' completed':''}${!unlocked?' locked':''}`;
    d.innerHTML=`<div class="ch-num">Chapter ${ch.id} · ${done?'✓ ':''}</div><div class="ch-name">${ch.title}</div><div class="ch-level">${ch.level}</div><div class="ch-prog"><div class="ch-prog-fill" style="width:${prog}%"></div></div>`;
    if(unlocked)d.onclick=()=>gotoChapter(idx);
    g.appendChild(d);
  });
}

// ── Vocab grid ─────────────────────────────────────────────────
function buildVGrid(){
  const g=document.getElementById('vocab-grid');g.innerHTML='';
  buildVocab().slice(0,220).forEach((v,i)=>{
    const d=document.createElement('div');
    d.className=`vocab-card${_vocabFlip[i]?' flipped':''}`;
    d.innerHTML=_vocabFlip[i]?`<span class="vocab-card-en">${v.en}</span>`:`<span class="vocab-card-de">${v.de}</span>`;
    d.onclick=()=>{_vocabFlip[i]=!_vocabFlip[i];buildVGrid();};
    g.appendChild(d);
  });
}

// ── Render segment ─────────────────────────────────────────────
function renderSeg(){
  const ch=CHAPTERS[S.chIdx];
  const seg=ch.segments[S.segIdx];
  if(!seg){advChapter();return;}

  document.getElementById('scene-bg').innerHTML=getBG(ch.bg);
  document.getElementById('loc-tag').textContent=ch.location;
  document.getElementById('ch-info').textContent=`Ch.${ch.id} · ${ch.level} · ${S.segIdx+1}/${ch.segments.length}`;
  document.getElementById('prog-fill').style.width=`${((S.segIdx+1)/ch.segments.length)*100}%`;

  // Determine active character
  let ac=null;
  if(seg.type==='dialogue'){
    const t=(seg.text||'').toLowerCase();
    // Heuristic: if line includes common Matei identifiers
    const mateiSpeaking=t.includes('"you ')&&!t.includes('i said')||t.startsWith('"matei')||t.startsWith('\u201cmatei');
    ac=mateiSpeaking?'matei':'yves';
  }else if(seg.type==='practice')ac='yves';

  const cy=document.getElementById('cy');
  const cm=document.getElementById('cm');
  const showY=seg.type==='narration'||ac==='yves'||!ac;
  const showM=seg.type==='narration'||ac==='matei';
  cy.className=`char-slot${!showY?' hidden':ac==='yves'?' active':ac==='matei'?' inactive':''}`;
  cm.className=`char-slot${!showM?' hidden':ac==='matei'?' active':ac==='yves'?' inactive':''}`;
  cy.innerHTML=yvesSVG(ac==='yves'?(seg.emotion||'neutral'):'neutral',ac==='yves');
  cm.innerHTML=mateiSVG(ac==='matei'?(seg.emotion||'neutral'):'neutral',ac==='matei');

  // Labels
  const st=document.getElementById('stype');
  const sp=document.getElementById('spk');
  if(seg.type==='narration'){st.className='seg-type narr';st.textContent='✦ Narration';sp.style.display='none';}
  else if(seg.type==='dialogue'){st.className='seg-type dial';st.textContent='';sp.style.display='block';sp.className=`speaker ${ac||'other'}`;sp.textContent=ac==='yves'?'Yves':ac==='matei'?'Matei':'—';}
  else{st.className='seg-type prac';st.textContent='◆ Practice Pause';sp.style.display='none';}

  // Text
  const tx=document.getElementById('stxt');
  tx.className=`seg-text hide${seg.type==='narration'?' italic':''}`;
  tx.textContent=seg.text||seg.prompt||'';
  setTimeout(()=>tx.classList.remove('hide'),60);

  // Action
  const ab=document.getElementById('actbtn');
  const last=S.segIdx>=ch.segments.length-1;
  const lastCh=S.chIdx>=CHAPTERS.length-1;
  if(seg.type==='practice'){
    ab.innerHTML=`<button class="btn-practice" onclick="openPractice()">Practice Now ◆</button>`;
  }else{
    const lbl=last?(lastCh?'The End ✓':'Next Chapter ▶'):'Continue ▶';
    ab.innerHTML=`<button class="btn-continue" onclick="advance()">${lbl}</button>`;
  }
  saveProg();
}

function advance(){
  const ch=CHAPTERS[S.chIdx];
  if(S.segIdx<ch.segments.length-1){S.segIdx++;renderSeg();}
  else advChapter();
}
function advChapter(){
  if(S.chIdx<CHAPTERS.length-1){S.chIdx++;S.segIdx=0;renderSeg();}else showTitle();
}

// ── Practice ───────────────────────────────────────────────────
let curP=null;
function openPractice(){
  curP=CHAPTERS[S.chIdx].segments[S.segIdx];
  document.getElementById('pp').textContent=curP.prompt;
  document.getElementById('pinput').value='';
  document.getElementById('pres').style.display='none';
  document.getElementById('sresult').textContent='';
  show('ph-input');hide('ph-revealed','ph-gram');
  setSBtn(false);_speechAns=null;
  show('practice-modal','flex');
  setTimeout(()=>document.getElementById('pinput').focus(),120);
}
function checkAns(){
  const val=document.getElementById('pinput').value.trim();
  if(!val&&!_speechAns)return;
  const given=(val||_speechAns||'').toLowerCase().replace(/[.,!?;]/g,'').trim();
  const exp=(curP.answer||'').toLowerCase().replace(/[.,!?;]/g,'').trim();
  const ok=given===exp||(given.length>3&&exp.includes(given))||(exp.length>3&&given.includes(exp));
  const r=document.getElementById('pres');
  r.style.display='block';r.className=`res-box ${ok?'ok':'no'}`;
  r.textContent=ok?'✓ Correct!':'✗ You said: "'+(val||_speechAns)+'"';
  doReveal();
}
function doReveal(){
  stopRec();
  document.getElementById('pans').textContent=curP.answer||'';
  document.getElementById('pslow').textContent=curP.slow?`slowly: ${curP.slow}`:'';
  hide('ph-input');show('ph-revealed');
}
function showGram(){
  document.getElementById('pgram').textContent=curP.grammar||'Practice the phrase aloud until it feels natural.';
  hide('ph-revealed');show('ph-gram');
}
function closePractice(){
  stopRec();_speechAns=null;
  hide('practice-modal');
  advance();
}

// ── Speech ─────────────────────────────────────────────────────
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null;
function setSBtn(on){
  const b=document.getElementById('sbtn'),t=document.getElementById('sbtn-txt');
  b.className=`speech-btn${on?' on':''}`;
  t.textContent=on?'● Listening... tap to stop':'🎙 Speak your answer in German';
}
function toggleSpeech(){if(!SR){document.getElementById('sresult').textContent='Not available — try Chrome or Edge.';return;}S.listening?stopRec():startRec();}
function startRec(){
  stopRec();
  rec=new SR();rec.lang='de-DE';rec.continuous=false;rec.interimResults=true;rec.maxAlternatives=3;
  rec.onstart=()=>{S.listening=true;setSBtn(true);};
  rec.onend=()=>{S.listening=false;setSBtn(false);};
  rec.onerror=e=>{S.listening=false;setSBtn(false);document.getElementById('sresult').textContent=`Error: ${e.error}. Type instead.`;};
  rec.onresult=e=>{
    let fi='',in2='';
    for(let i=e.resultIndex;i<e.results.length;i++){if(e.results[i].isFinal)fi+=e.results[i][0].transcript;else in2+=e.results[i][0].transcript;}
    const d=fi||in2;
    document.getElementById('sresult').textContent=d?`Heard: "${d}"` :'';
    if(fi){_speechAns=fi.trim();document.getElementById('pinput').value=fi.trim();}
  };
  try{rec.start();}catch(e){document.getElementById('sresult').textContent='Could not start mic. Check permissions.';}
}
function stopRec(){if(rec){try{rec.stop();}catch(e){}rec=null;}S.listening=false;setSBtn(false);}

// ── Title init ─────────────────────────────────────────────────
(function init(){
  const sb=document.getElementById('stars-bg');
  for(let i=0;i<55;i++){const s=document.createElement('div');s.className='star';s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;width:${Math.random()*3+1}px;height:${Math.random()*3+1}px;--d:${(Math.random()*3+2).toFixed(1)}s;animation-delay:${(Math.random()*2).toFixed(1)}s`;sb.appendChild(s);}
  document.getElementById('t-yves').innerHTML=yvesSVG('neutral',true);
  document.getElementById('t-matei').innerHTML=mateiSVG('warm',true);
})();
</script>
