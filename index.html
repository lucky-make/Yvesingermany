: "We walked back to the apartment together. Not touching. But close. Close enough that our shoulders almost brushed. Close enough that I could feel the heat from his arm through both our coats. The stairs were thirty-seven steps. The key still stuck. The apartment was dark when we opened the door. \u201cGood night, Yves.\u201d \u201cGood night, Matei.\u201d I lay down in the bed. He lay down on the sofa. I listened to him breathe until I fell asleep. Now say \u201cto listen\u201d zuh\u00f6ren. Review", "lang": "en"}], [{"text": "Zuh\u00f6ren. Ich h\u00f6re zu", "lang": "de"}, {"text": "\u2013 I listen --Dual-layer vocabulary review \u2013 Chapter 4 Layer 1 \u2013 Words", "lang": "en"}, {"text": "Aufwachen", "lang": "de"}, {"text": "\u2013 to wake up. <break time=\"2s\"/> Aufwachen. Ich wache um 7 Uhr auf", "lang": "en"}, {"text": "Die Dusche", "lang": "de"}, {"text": "\u2013 the shower. <break time=\"2s\"/> Die Dusche", "lang": "en"}, {"text": "Schlafen", "lang": "de"}, {"text": "\u2013 to sleep. <break time=\"2s\"/> Schlafen. Er schl\u00e4ft", "lang": "en"}, {"text": "Trinken", "lang": "de"}, {"text": "\u2013 to drink. <break time=\"2s\"/> Trinken. Ich trinke Kaffee", "lang": "en"}, {"text": "Der Mantel", "lang": "de"}, {"text": "\u2013 the coat. <break time=\"2s\"/> Der Mantel Ge\u00f6ffnet \u2013 open. <break time=\"2s\"/> Ge\u00f6ffnet. Heute ge\u00f6ffnet. Geschlossen \u2013 closed. <break time=\"2s\"/> Geschlossen. Heute geschlossen. Was m\u00f6chten Sie? \u2013 What would you like? (formal) <break time=\"2s\"/> Was m\u00f6chten", "lang": "en"}, {"text": "Sie? Ich m\u00f6chte einen Kaffee", "lang": "de"}, {"text": "\u2013 I would like a coffee. <break time=\"2s\"/> Ich m\u00f6chte einen Kaffee.", "lang": "en"}, {"text": "Die Tasse", "lang": "de"}, {"text": "\u2013 the cup. <break time=\"2s\"/> Die Tasse", "lang": "en"}, {"text": "Bitte sch\u00f6n", "lang": "de"}, {"text": "\u2013 here you go / you're welcome. <break time=\"2s\"/> Bitte sch\u00f6n", "lang": "en"}, {"text": "Tsch\u00fcss", "lang": "de"}, {"text": "\u2013 goodbye (casual). <break time=\"2s\"/> Tsch\u00fcss", "lang": "en"}, {"text": "Das Geb\u00e4ck", "lang": "de"}, {"text": "\u2013 the pastry. <break time=\"2s\"/> Das Geb\u00e4ck", "lang": "en"}, {"text": "Die Arbeit", "lang": "de"}, {"text": "\u2013 the work. <break time=\"2s\"/> Die Arbeit", "lang": "en"}, {"text": "Das Geld", "lang": "de"}, {"text": "\u2013 the money. <break time=\"2s\"/> Das Geld", "lang": "en"}, {"text": "Der Apfel", "lang": "de"}, {"text": "\u2013 the apple. <break time=\"2s\"/> Der Apfel", "lang": "en"}, {"text": "Die Wand", "lang": "de"}, {"text": "\u2013 the wall. <break time=\"2s\"/> Die Wand", "lang": "en"}, {"text": "Das st\u00f6rt mich", "lang": "de"}, {"text": "\u2013 that bothers me. <break time=\"2s\"/> Das st\u00f6rt mich", "lang": "en"}, {"text": "Der Park", "lang": "de"}, {"text": "\u2013 the park. <break time=\"2s\"/> Der Park", "lang": "en"}, {"text": "Die Br\u00fccke", "lang": "de"}, {"text": "\u2013 the bridge. <break time=\"2s\"/> Die Br\u00fccke", "lang": "en"}, {"text": "Die Ente", "lang": "de"}, {"text": "\u2013 the duck. <break time=\"2s\"/> Die Ente", "lang": "en"}, {"text": "Die Stadt", "lang": "de"}, {"text": "\u2013 the city. <break time=\"2s\"/> Die Stadt", "lang": "en"}, {"text": "Das Handy", "lang": "de"}, {"text": "\u2013 the mobile phone. <break time=\"2s\"/> Das Handy", "lang": "en"}, {"text": "Essen", "lang": "de"}, {"text": "\u2013 to eat / the food. <break time=\"2s\"/> Essen. Ich esse", "lang": "en"}, {"text": "Der Spiegel", "lang": "de"}, {"text": "\u2013 the mirror. <break time=\"2s\"/> Der Spiegel", "lang": "en"}, {"text": "Die Buchhandlung", "lang": "de"}, {"text": "\u2013 the bookstore. <break time=\"2s\"/> Die Buchhandlung", "lang": "en"}, {"text": "Das Buch", "lang": "de"}, {"text": "\u2013 the book. <break time=\"2s\"/> Das Buch", "lang": "en"}, {"text": "Die Geschichte", "lang": "de"}, {"text": "\u2013 the story. <break time=\"2s\"/> Die Geschichte", "lang": "en"}, {"text": "Vergessen", "lang": "de"}, {"text": "\u2013 to forget. <break time=\"2s\"/> Vergessen. Ich habe vergessen", "lang": "en"}, {"text": "Die Rechnung", "lang": "de"}, {"text": "\u2013 the bill. <break time=\"2s\"/> Die Rechnung. Die Rechnung, bitte Zahlen \u2013 to pay. <break time=\"2s\"/> Zahlen. Ich m\u00f6chte zahlen.", "lang": "en"}, {"text": "Zuh\u00f6ren", "lang": "de"}, {"text": "\u2013 to listen. <break time=\"2s\"/> Zuh\u00f6ren. Ich h\u00f6re zu Layer 2 \u2013 Story phrases \"Ich wache um 7 Uhr auf.\" \u2013 I wake up at 7. <break time=\"2s\"/> Ich wache um 7 Uhr auf. \"Was m\u00f6chten Sie?\" \u2013 What would you like? <break time=\"2s\"/> Was m\u00f6chten Sie? \"Bitte sch\u00f6n, Ihre Tasse Kaffee.\" \u2013 Here you go, your cup of coffee. <break time=\"2s\"/> Bitte sch\u00f6n. \"Das st\u00f6rt mich.\" \u2013 That bothers me. <break time=\"2s\"/> Das st\u00f6rt mich. \"Die Rechnung, bitte.\" \u2013 The bill, please. <break time=\"2s\"/> Die Rechnung, bitte. \"Ich h\u00f6re zu.\" \u2013 I'm listening. <break time=\"2s\"/> Ich h\u00f6re zu. --End of Chapter 4. --Chapter 5 \u2013 The Space Between (A1-A2) (Narrator voice, calm, clear. Ambient: soft rain against window, occasional rumble of distant traffic.) The second week was harder than the first. Not because of the work \u2013 I was getting better at the espresso machine, and Frau Schmidt had stopped watching me like I might accidentally burn down the caf\u00e9. Not because of the language \u2013 I had learned a dozen new words, including Milch (milk), Zucker (sugar), and Rechnung (the bill), which I said wrong every time but people understood anyway. It was harder because Matei had started to feel like something I could lose. Now say \u201cthe milk\u201d die Milch. Review", "lang": "en"}], [{"text": "Die Milch.", "lang": "de"}, {"text": "Now say \u201cthe sugar\u201d", "lang": "en"}, {"text": "der Zucker", "lang": "de"}], [{"text": "Der Zucker. Masculine.", "lang": "de"}, {"text": "Now say \u201cthe bill\u201d die Rechnung. Review", "lang": "en"}], [{"text": "Die Rechnung.", "lang": "de"}, {"text": "That sounds dramatic. I know. But here is the thing: when you have spent your whole life waiting for people to leave, you start seeing exits everywhere. A closed door. A missed text. A silence that lasts a few hours too long. Your brain fills in the gaps with the worst possible story, and then you are already grieving before anyone has even gone. Matei did not leave. He went to work. He came home. He made coffee in the morning and left mine on the table. He cooked sometimes \u2013 simple things, eggs and bread, a soup that tasted like Romania. He sat on the plastic chair and read his books while I wrote in my notebook. But he did not touch me again. Not after that night at the bookstore. Not after his hand had covered mine on the sofa. He was close \u2013 physically, always close \u2013 but there was a space between us that felt like a held breath. Like we were both waiting for something. Now say \u201cto leave\u201d", "lang": "en"}, {"text": "verlassen", "lang": "de"}], [{"text": "Verlassen. Now say \u201che leaves\u201d", "lang": "en"}, {"text": "er verl\u00e4sst", "lang": "de"}], [{"text": "Er verl\u00e4sst.", "lang": "de"}, {"text": "Now say \u201cto touch\u201d", "lang": "en"}, {"text": "ber\u00fchren", "lang": "de"}], [{"text": "Ber\u00fchren. Er ber\u00fchrt mich nicht \u2013 he does not touch me. --On my eighth day at Morgenlicht, Frau Schmidt taught me how to close the caf\u00e9. It was a ritual. Wipe down the counters. Count the register. Take out the trash. Lock the door. Turn off the lights. The last part was my favourite \u2013 standing in the dark caf\u00e9, the streetlight coming through the window, the smell of coffee and sugar still hanging in the air. It felt like being inside a memory. Now say \u201cto close\u201d", "lang": "en"}, {"text": "schlie\u00dfen", "lang": "de"}], [{"text": "Schlie\u00dfen. Now say \u201cto lock\u201d abschlie\u00dfen (separable)", "lang": "en"}], [{"text": "Abschlie\u00dfen. Ich schlie\u00dfe die T\u00fcr ab \u2013 I lock the door. \u201cYou are doing good,\u201d Frau Schmidt said, putting on her coat. \u201cI dropped a cup yesterday.\u201d \u201cOnly one. Yesterday you dropped one. The day before you dropped two. This is improvement.\u201d She patted my cheek \u2013 actually patted my cheek, like I was five years old \u2013 and left me to lock up. Now say \u201cto drop\u201d fallen lassen. Review", "lang": "en"}], [{"text": "Fallen lassen. Ich habe eine Tasse fallen lassen. Now say \u201cthe improvement\u201d", "lang": "en"}, {"text": "die Verbesserung", "lang": "de"}], [{"text": "Die Verbesserung. Feminine", "lang": "de"}, {"text": "\u2013 -ung ending --I stood in the dark for a minute. The bell above the door was silent. The street outside was quiet. Somewhere down the block, someone was playing music \u2013 something slow, something sad, something that made me think of Matei. I locked the door and walked home. (ambient: footsteps on wet pavement, soft rain) He was already there when I got back. Sitting on the sofa. His laptop open on the table. He was typing something, his brow furrowed, his fingers moving fast. \u201cYou are home early,\u201d I said. \u201cThe library closed.\u201d \u201cYou work at the library?\u201d \u201cI work at the bookstore. The library is where I go to write when I do not want to be at home.\u201d Now say \u201cthe library\u201d", "lang": "en"}, {"text": "die Bibliothek", "lang": "de"}], [{"text": "Die Bibliothek. Feminine. Also die B\u00fccherei.", "lang": "de"}, {"text": "Now say \u201cto write\u201d", "lang": "en"}, {"text": "schreiben", "lang": "de"}], [{"text": "Schreiben. Ich schreibe \u2013 I write. --\u201cYou do not want to be at home?\u201d I asked. He looked up. His eyes were tired. \u201cI did not say that.\u201d \u201cYou implied it.\u201d \u201cI said I go to the library to write. That is not the same as not wanting to be here.\u201d I sat on the wooden chair. The plastic one was still empty. It was always empty, now. He sat on the sofa. I sat on the chair. The space between us was two metres and a lifetime. \u201cWhat are you writing?\u201d I asked. He closed the laptop. \u201cNothing.\u201d \u201cYou are a bad liar.\u201d \u201cI am an excellent liar. I just do not want to lie to you.\u201d Now say \u201cto lie\u201d", "lang": "en"}, {"text": "l\u00fcgen", "lang": "de"}], [{"text": "L\u00fcgen. Du l\u00fcgst \u2013 you lie. Ich l\u00fcge nicht \u2013 I do not lie. Now say \u201cthe truth\u201d", "lang": "en"}, {"text": "die Wahrheit", "lang": "de"}], [{"text": "Die Wahrheit. Ich sage die Wahrheit", "lang": "de"}, {"text": "\u2013 I tell the truth --That shut me up. He went back to staring at the wall. I went back to watching him. \u201cMatei.\u201d \u201cWhat?\u201d \u201cWhy do you never sit in the other chair?\u201d He turned to look at me. The lamp light caught the side of his face. \u201cBecause I want to sit where you sat.\u201d I blinked. \u201cWhat?\u201d \u201cThe first night. When you made pasta. You sat on the sofa. I sat on the wooden chair.\u201d He paused. \u201cI have been sitting on the sofa ever since.\u201d \u201cThat does not make any sense.\u201d \u201cIt makes perfect sense.\u201d He leaned back into the cushions. \u201cI wanted to know what it felt like. Where you had been.\u201d Now say \u201cthe first night\u201d", "lang": "en"}, {"text": "die erste Nacht", "lang": "de"}], [{"text": "Die erste Nacht.", "lang": "de"}, {"text": "Now say \u201cto sit\u201d", "lang": "en"}, {"text": "sitzen", "lang": "de"}], [{"text": "Sitzen. Ich sitze \u2013 I sit. Du sitzt \u2013 you sit. --My chest did something complicated. A twist. A squeeze. A feeling I did not have a name for. \u201cThat is the weirdest thing anyone has ever said to me.\u201d \u201cProbably.\u201d \u201cAnd also the nicest.\u201d He almost smiled. Almost. \u201cI am a nice person.\u201d \u201cYou are a strange person.\u201d \u201cSame thing.\u201d Now say \u201cstrange\u201d", "lang": "en"}, {"text": "seltsam or komisch", "lang": "de"}], [{"text": "Seltsam. Du bist seltsam \u2013 you are strange. Now say \u201cnice\u201d", "lang": "en"}, {"text": "nett", "lang": "de"}], [{"text": "Nett. Du bist nett \u2013 you are nice. Nett is for people. --I laughed. He did not. But his hand was on the cushion again, resting where mine had rested that first night. The same spot. The same distance. I wanted to reach out. I wanted to close the two metres. I wanted to do something other than sit here and pretend I was not terrified. Instead, I stood up. \u201cI am going to bed.\u201d \u201cIt is eight o'clock.\u201d \u201cI am tired.\u201d He did not stop me. He just nodded and turned back to his laptop. Now say \u201cthe bed\u201d", "lang": "en"}, {"text": "das Bett", "lang": "de"}], [{"text": "Das Bett. Ich gehe ins Bett", "lang": "de"}, {"text": "\u2013 I go to bed. Ins is in das Now say \u201ctired\u201d m\u00fcde. Review", "lang": "en"}], [{"text": "M\u00fcde. Ich bin m\u00fcde. --- I lay in the dark, listening to him type. The keys clicked softly. A rhythm. A heartbeat. Something I could almost fall asleep to. The next morning, he was gone before I woke up. But there was coffee on the table. And a note. Yves \u2013 There is bread in the freezer. Do not just eat cheese for breakfast. \u2013 M. I stared at the note for a long time. His handwriting was small and neat. The kind of handwriting that belonged to someone who thought before they wrote. I folded the note and put it in my pocket. Next to the key. Now say \u201cthe note\u201d", "lang": "en"}, {"text": "der Zettel", "lang": "de"}], [{"text": "Der Zettel. Masculine.", "lang": "de"}, {"text": "Now say \u201cthe freezer\u201d", "lang": "en"}, {"text": "das Gefrierfach", "lang": "de"}], [{"text": "Das Gefrierfach. Neuter.", "lang": "de"}, {"text": "Work was slow that day. Frau Schmidt sent me home early \u2013 something about a doctor's appointment, something I did not fully understand because she said it in German and I only caught every third word. She patted my cheek again and told me to rest. I did not want to rest. I wanted to walk. Berlin was grey again. The sky was low and heavy, like it was thinking about rain but had not committed yet. I walked without a destination. Past the park. Past the bridge with the duck \u2013 the duck was not there today. Past a church with a bell tower that looked like it had not been used in years. Now say \u201cthe doctor\u201d", "lang": "en"}, {"text": "der Arzt", "lang": "de"}], [{"text": "Der Arzt. Masculine. Female: die \u00c4rztin.", "lang": "de"}, {"text": "Now say \u201cthe appointment\u201d", "lang": "en"}, {"text": "der Termin", "lang": "de"}], [{"text": "Der Termin. Ich habe einen Termin", "lang": "de"}, {"text": "\u2013 I have an appointment --I ended up at the bookstore. B\u00fccher & Co. Matei was there. He was standing behind the counter, talking to a customer. An older woman with a stack of books in her arms. He was explaining something \u2013 in German, fast, too fast for me to follow \u2013 and the woman was nodding, and his hands were moving, and he looked like he belonged here. Like this was his place. His language. His life. I almost left. I did not want to interrupt. I did not want him to see me watching. But he looked up. His eyes found mine through the crowd. He did not smile. He just nodded, the way he always did, and went back to helping the customer. Now say \u201cthe customer\u201d", "lang": "en"}, {"text": "der Kunde", "lang": "de"}], [{"text": "Der Kunde. Masculine. Female: die Kundin.", "lang": "de"}, {"text": "Now say \u201cto explain\u201d", "lang": "en"}, {"text": "erkl\u00e4ren", "lang": "de"}], [{"text": "Erkl\u00e4ren. Er erkl\u00e4rt etwas", "lang": "de"}, {"text": "\u2013 he explains something --I waited by the English section. Browsing. Not browsing. Reading the same book jacket three times without understanding a word. \u201cYou are staring,\u201d he said. I turned. He was standing behind me. Close. Too close for a bookstore, too close for coworkers, too close for two people who were just sharing an apartment. \u201cI am observing,\u201d I said. \u201cThere is a difference.\u201d \u201cYou have used that line before.\u201d \u201cIt is a good line.\u201d He took a step closer. I took a step back. My shoulders hit the bookshelf. \u201cWhy are you here, Yves?\u201d \u201cI wanted to see you.\u201d Now say \u201cto see\u201d", "lang": "en"}, {"text": "sehen", "lang": "de"}], [{"text": "Sehen. Ich sehe dich", "lang": "de"}, {"text": "\u2013 I see you", "lang": "en"}, {"text": "Sehen is stem-changing. Ich sehe, du siehst, er sieht. Repeat: du siehst.", "lang": "de"}, {"text": "The words came out before I could stop them. Honest. Unfiltered. The kind of thing I usually swallowed. Matei's expression did not change. But his hand \u2013 his right hand \u2013 came up and rested on the bookshelf next to my shoulder. Not touching me. Close. \u201cYou see me every day,\u201d he said. \u201cThat is not the same.\u201d \u201cWhat is the difference?\u201d I looked at his hand. The veins. The scar on his thumb. The way his fingers curled against the shelf. \u201cSeeing someone is passive. It just happens. Looking is active. You choose.\u201d \u201cAnd you chose to look at me?\u201d \u201cI chose to come here. The looking just happened.\u201d Now say \u201cto look at\u201d anschauen or angucken (separable)", "lang": "en"}], [{"text": "Anschauen. Ich schaue dich an \u2013 I look at you. --He was quiet for a moment. The bookstore was noisy around us \u2013 people talking, pages turning, a child laughing somewhere in the children's section. But in the space between us, there was only silence. \u201cYves.\u201d \u201cWhat?\u201d \u201cYou are doing it again.\u201d \u201cDoing what?\u201d \u201cTalking without saying anything.\u201d I opened my mouth. Closed it. Opened it again. \u201cI do not know how to say what I want to say,\u201d I admitted. \u201cThen do not say it.\u201d He leaned closer. His breath was warm on my cheek. \u201cShow me.\u201d Now say \u201cto show\u201d", "lang": "en"}, {"text": "zeigen", "lang": "de"}], [{"text": "Zeigen. Zeig mir", "lang": "de"}, {"text": "\u2013 show me. Mir is dative (to me) Now say \u201cto admit\u201d zugeben (separable)", "lang": "en"}], [{"text": "Zugeben. Ich gebe zu \u2013 I admit. --My heart was a disaster. A mess. A stuttering, skipping, out-of-control thing that had no business being this loud. \u201cI do not know how to do that either,\u201d I whispered. \u201cThen we will figure it out together.\u201d He pulled back. His hand left the shelf. He walked back to the counter like nothing had happened. I stood there for a full minute, my back against the books, my heart trying to escape my chest. Then I left the bookstore. Did not buy anything. Did not say goodbye. Now say \u201ctogether\u201d", "lang": "en"}, {"text": "zusammen", "lang": "de"}], [{"text": "Zusammen. Wir sind zusammen", "lang": "de"}, {"text": "\u2013 we are together Now say \u201cto escape\u201d", "lang": "en"}, {"text": "entkommen", "lang": "de"}], [{"text": "Entkommen. Mein Herz entkommt nicht \u2013 my heart does not escape. --I walked home in the grey afternoon, and I did not feel the cold at all. That night, he came home late. I was already in bed \u2013 the bed, his bed, the one he had given up for me \u2013 but I was not asleep. I was staring at the ceiling, replaying the bookstore over and over in my head. The door opened. His footsteps. He did not turn on the light. \u201cYou are awake,\u201d he said. \u201cHow do you know?\u201d \u201cBecause you are breathing like you are thinking.\u201d I turned over. He was standing by the door, a dark shape against the darker room. Now say \u201cto breathe\u201d", "lang": "en"}, {"text": "atmen", "lang": "de"}], [{"text": "Atmen. Du atmest \u2013 you breathe. Ich atme \u2013 I breathe. Now say \u201cto think\u201d", "lang": "en"}, {"text": "denken", "lang": "de"}], [{"text": "Denken. Ich denke", "lang": "de"}, {"text": "\u2013 I think. Was denkst du? \u2013 What do you think? --\u201cMatei.\u201d \u201cWhat?\u201d \u201cWhat did you mean? \u2018Show me.\u2019 What did you want me to show you?\u201d He was quiet for so long I thought he was not going to answer. Then he walked to the sofa. Sat down. I heard the cushions sigh under his weight. \u201cI wanted you to show me that you wanted to stay,\u201d he said. \u201cNot because you had to. Because you chose to.\u201d I sat up. The sheet fell to my waist. The room was cold, but I did not care. \u201cI am still here,\u201d I said. \u201cYou are.\u201d \u201cI have not run away.\u201d \u201cNo.\u201d \u201cIs that not enough?\u201d Now say \u201cenough\u201d", "lang": "en"}, {"text": "genug", "lang": "de"}], [{"text": "Genug. Ist das nicht genug?", "lang": "de"}, {"text": "\u2013 Is that not enough? Now say \u201cto choose\u201d", "lang": "en"}, {"text": "w\u00e4hlen or sich entscheiden", "lang": "de"}], [{"text": "Sich entscheiden. Ich entscheide mich \u2013 I decide. --He turned to look at me. I could just make out his face in the dark \u2013 the curve of his jaw, the shadow of his eyes. \u201cIt is a start,\u201d he said. Then he lay down. Pulled his coat over himself. Turned his back to me. I lay back down. Stared at the ceiling. Listened to him breathe. And for the second time that week, I did not feel like running. I felt like staying. Now say \u201ca start\u201d ein Anfang", "lang": "en"}], [{"text": "Ein Anfang. Das ist ein Anfang \u2013 that is a start Now say \u201cto stay\u201d", "lang": "en"}, {"text": "bleiben. Ich bleibe", "lang": "de"}], [{"text": "Bleiben. Ich bleibe.", "lang": "de"}, {"text": "Dual-layer vocabulary review \u2013 Chapter 5 Layer 1 \u2013 Words", "lang": "en"}, {"text": "Die Milch", "lang": "de"}, {"text": "\u2013 the milk. <break time=\"2s\"/> Die Milch", "lang": "en"}, {"text": "Der Zucker", "lang": "de"}, {"text": "\u2013 the sugar. <break time=\"2s\"/> Der Zucker", "lang": "en"}, {"text": "Die Rechnung", "lang": "de"}, {"text": "\u2013 the bill. <break time=\"2s\"/> Die Rechnung Verlassen \u2013 to leave. <break time=\"2s\"/> Verlassen. Er verl\u00e4sst. Ber\u00fchren \u2013 to touch. <break time=\"2s\"/> Ber\u00fchren. Er ber\u00fchrt mich nicht. Schlie\u00dfen \u2013 to close. <break time=\"2s\"/> Schlie\u00dfen. Abschlie\u00dfen \u2013 to lock. <break time=\"2s\"/> Abschlie\u00dfen. Ich schlie\u00dfe die T\u00fcr ab.", "lang": "en"}, {"text": "Die Verbesserung", "lang": "de"}, {"text": "\u2013 the improvement. <break time=\"2s\"/> Die Verbesserung", "lang": "en"}, {"text": "Die Bibliothek", "lang": "de"}, {"text": "\u2013 the library. <break time=\"2s\"/> Die Bibliothek Schreiben \u2013 to write. <break time=\"2s\"/> Schreiben. Ich schreibe. L\u00fcgen \u2013 to lie. <break time=\"2s\"/> L\u00fcgen. Du l\u00fcgst.", "lang": "en"}, {"text": "Die Wahrheit", "lang": "de"}, {"text": "\u2013 the truth. <break time=\"2s\"/> Die Wahrheit", "lang": "en"}, {"text": "Die erste Nacht", "lang": "de"}, {"text": "\u2013 the first night. <break time=\"2s\"/> Die erste Nacht Sitzen \u2013 to sit. <break time=\"2s\"/> Sitzen. Ich sitze. Seltsam \u2013 strange. <break time=\"2s\"/> Seltsam. Du bist seltsam. Nett \u2013 nice. <break time=\"2s\"/> Nett. Du bist nett.", "lang": "en"}, {"text": "Das Bett", "lang": "de"}, {"text": "\u2013 the bed. <break time=\"2s\"/> Das Bett. Ich gehe ins Bett M\u00fcde \u2013 tired. <break time=\"2s\"/> M\u00fcde. Ich bin m\u00fcde.", "lang": "en"}, {"text": "Der Zettel", "lang": "de"}, {"text": "\u2013 the note. <break time=\"2s\"/> Der Zettel", "lang": "en"}, {"text": "Das Gefrierfach", "lang": "de"}, {"text": "\u2013 the freezer. <break time=\"2s\"/> Das Gefrierfach", "lang": "en"}, {"text": "Der Arzt / die \u00c4rztin", "lang": "de"}, {"text": "\u2013 doctor. <break time=\"2s\"/> Der Arzt", "lang": "en"}, {"text": "Der Termin", "lang": "de"}, {"text": "\u2013 the appointment. <break time=\"2s\"/> Der Termin", "lang": "en"}, {"text": "Der Kunde / die Kundin", "lang": "de"}, {"text": "\u2013 customer. <break time=\"2s\"/> Der Kunde", "lang": "en"}, {"text": "Erkl\u00e4ren", "lang": "de"}, {"text": "\u2013 to explain. <break time=\"2s\"/> Erkl\u00e4ren. Er erkl\u00e4rt", "lang": "en"}, {"text": "Sehen", "lang": "de"}, {"text": "\u2013 to see. <break time=\"2s\"/> Sehen. Ich sehe dich. Du siehst Anschauen \u2013 to look at. <break time=\"2s\"/> Anschauen. Ich schaue dich an.", "lang": "en"}, {"text": "Zeigen", "lang": "de"}, {"text": "\u2013 to show. <break time=\"2s\"/> Zeigen. Zeig mir Zugeben \u2013 to admit. <break time=\"2s\"/> Zugeben. Ich gebe zu.", "lang": "en"}, {"text": "Zusammen", "lang": "de"}, {"text": "\u2013 together. <break time=\"2s\"/> Zusammen Entkommen \u2013 to escape. <break time=\"2s\"/> Entkommen. Atmen \u2013 to breathe. <break time=\"2s\"/> Atmen. Du atmest.", "lang": "en"}, {"text": "Denken", "lang": "de"}, {"text": "\u2013 to think. <break time=\"2s\"/> Denken. Ich denke", "lang": "en"}, {"text": "Genug", "lang": "de"}, {"text": "\u2013 enough. <break time=\"2s\"/> Genug. Ist das nicht genug? Sich entscheiden \u2013 to decide. <break time=\"2s\"/> Sich entscheiden. Ein Anfang \u2013 a start. <break time=\"2s\"/> Ein Anfang. Das ist ein Anfang", "lang": "en"}, {"text": "Bleiben", "lang": "de"}, {"text": "\u2013 to stay. <break time=\"2s\"/> Bleiben. Ich bleibe Layer 2 \u2013 Story phrases \"Er verl\u00e4sst mich nicht.\" \u2013 He doesn't leave me. <break time=\"2s\"/> Er verl\u00e4sst mich nicht. \"Du l\u00fcgst.\" \u2013 You're lying. <break time=\"2s\"/> Du l\u00fcgst. \"Ich sage die Wahrheit.\" \u2013 I tell the truth. <break time=\"2s\"/> Ich sage die Wahrheit. \"Ich bin m\u00fcde.\" \u2013 I'm tired. <break time=\"2s\"/> Ich bin m\u00fcde. \"Ich habe einen Termin.\" \u2013 I have an appointment. <break time=\"2s\"/> Ich habe einen Termin. \"Ich sehe dich.\" \u2013 I see you. <break time=\"2s\"/> Ich sehe dich. \"Zeig mir.\" \u2013 Show me. <break time=\"2s\"/> Zeig mir. \"Wir sind zusammen.\" \u2013 We are together. <break time=\"2s\"/> Wir sind zusammen. \"Ist das nicht genug?\" \u2013 Isn't that enough? <break time=\"2s\"/> Ist das nicht genug? \"Das ist ein Anfang.\" \u2013 That's a start. <break time=\"2s\"/> Das ist ein Anfang. --End of Chapter 5. --Chapter 6 \u2013 The Almost (A1-A2) (Narrator voice, calm, clear. Ambient: soft rain, occasional distant thunder, the hum of a lamp.) Something shifted after the bookstore. Not dramatically. Not the way it happens in movies, with rain and swelling music and a speech that fixes everything. It was smaller than that. Quieter. The way light changes when a cloud moves \u2013 not suddenly, but when you look up, everything is different. Matei started leaving things for me. Now say \u201cto shift\u201d", "lang": "en"}, {"text": "sich ver\u00e4ndern", "lang": "de"}], [{"text": "Sich ver\u00e4ndern. Etwas ver\u00e4ndert sich \u2013 something changes. Now say \u201cthe cloud\u201d", "lang": "en"}, {"text": "die Wolke", "lang": "de"}], [{"text": "Die Wolke. Feminine.", "lang": "de"}, {"text": "A scarf on the back of the wooden chair. \u201cIt is cold,\u201d he said when I asked. \u201cYou do not have a scarf.\u201d He was right. I wore it every morning. A notebook \u2013 a new one, black, with blank pages \u2013 on the table. \u201cYou are filling the other one,\u201d he said. \u201cI saw it at the bookstore.\u201d I did not tell him I had already bought a replacement. I used his instead. A small plant on the windowsill. A succulent, the kind that survived neglect. \u201cEvery apartment needs a plant,\u201d he said. \u201cOtherwise it is just a box.\u201d I named it Matei Jr. He did not laugh, but his mouth twitched. Now say \u201cthe scarf\u201d", "lang": "en"}, {"text": "der Schal", "lang": "de"}], [{"text": "Der Schal. Masculine.", "lang": "de"}, {"text": "Now say \u201cthe plant\u201d", "lang": "en"}, {"text": "die Pflanze", "lang": "de"}], [{"text": "Die Pflanze. Feminine.", "lang": "de"}, {"text": "Now say \u201cthe windowsill\u201d", "lang": "en"}, {"text": "das Fensterbrett", "lang": "de"}], [{"text": "Das Fensterbrett. Neuter.", "lang": "de"}, {"text": "These were not grand gestures. They were not declarations. But they were things. Physical evidence that he was thinking about me when I was not there. And I was collecting them like evidence. Now say \u201cthe gesture\u201d", "lang": "en"}, {"text": "die Geste", "lang": "de"}], [{"text": "Die Geste. Feminine.", "lang": "de"}, {"text": "Now say \u201cthe evidence\u201d", "lang": "en"}, {"text": "der Beweis", "lang": "de"}], [{"text": "Der Beweis. Masculine.", "lang": "de"}, {"text": "On my twelfth day at Morgenlicht, Frau Schmidt asked me a question. \u201cYves,\u201d she said. She was wiping down the counter, her back to me. \u201cYou and Matei. Are you together?\u201d I dropped the cup I was holding. It shattered on the floor. Coffee everywhere. Frau Schmidt did not turn around. \u201cThat is your fourth cup this week,\u201d she said calmly. Now say \u201ctogether\u201d zusammen. Review", "lang": "en"}], [{"text": "Zusammen. Seid ihr zusammen?", "lang": "de"}, {"text": "\u2013 Are you together? Now say \u201cthe question\u201d", "lang": "en"}, {"text": "die Frage", "lang": "de"}], [{"text": "Die Frage. Eine Frage stellen", "lang": "de"}, {"text": "\u2013 to ask a question --- \u201cI am sorry,\u201d I said. \u201cYou are not sorry. You are avoiding the question.\u201d I got the broom. Swept up the pieces. My face was hot. I could feel it burning. \u201cWe are not together,\u201d I said. \u201cAh.\u201d She finally turned. Her grey eyes were kind, but they were also sharp. \u201cSo you are just living in his apartment. Sleeping in his bed. Wearing his scarf.\u201d \u201cIt is not his bed. It is his sofa.\u201d \u201cHis sofa. His apartment. His key.\u201d She raised an eyebrow. \u201cThis is a lot for \u2018not together.\u2019\u201d Now say \u201cto avoid\u201d", "lang": "en"}, {"text": "vermeiden", "lang": "de"}], [{"text": "Vermeiden. Du vermeidest die Frage \u2013 you are avoiding the question. Now say \u201cthe broom\u201d", "lang": "en"}, {"text": "der Besen", "lang": "de"}], [{"text": "Der Besen. Masculine.", "lang": "de"}, {"text": "I did not have an answer. I threw the broken cup in the trash and went back to the espresso machine. \u201cYves.\u201d \u201cWhat?\u201d \u201cHe talks about you.\u201d I stopped. Turned. \u201cWhat?\u201d \u201cWhen he comes in for coffee. He talks about you.\u201d She smiled. It was a small smile, secret. \u201cHe does not say much. He never says much. But he mentions you. \u2018Yves likes the apricot pastries.\u2019 \u2018Yves learned to say Rechnung today.\u2019 \u2018Yves laughed at something I said.\u2019\u201d She shrugged. \u201cA man who remembers the pastries you like is a man who is paying attention.\u201d Now say \u201cto talk about\u201d", "lang": "en"}, {"text": "sprechen \u00fcber", "lang": "de"}], [{"text": "Sprechen \u00fcber. Er spricht \u00fcber dich", "lang": "de"}, {"text": "\u2013 he talks about you Now say \u201cto mention\u201d", "lang": "en"}, {"text": "erw\u00e4hnen", "lang": "de"}], [{"text": "Erw\u00e4hnen. Er erw\u00e4hnt dich", "lang": "de"}, {"text": "\u2013 he mentions you Now say \u201cto pay attention\u201d aufpassen (separable)", "lang": "en"}], [{"text": "Aufpassen. Er passt auf", "lang": "de"}, {"text": "\u2013 he pays attention --I did not know what to say. So I said nothing. I made a cappuccino for a customer who was not there. Frau Schmidt watched me with that sharp, kind look. \u201cYou are both stubborn,\u201d she said. \u201cThis is why nothing has happened yet.\u201d \u201cNothing has not happened because nothing is supposed to happen.\u201d \u201cLie to yourself if you want. But do not lie to me.\u201d She patted my cheek. \u201cNow clean the counter. You got coffee everywhere.\u201d Now say \u201cstubborn\u201d", "lang": "en"}, {"text": "stur", "lang": "de"}], [{"text": "Stur. Ihr seid beide stur \u2013 you are both stubborn. Now say \u201cto lie\u201d l\u00fcgen. Review. L\u00fcg dich nicht an \u2013 do not lie to yourself That night, I walked home slower than usual. The streets were wet. It had rained while I was working, and the streetlights reflected off the pavement in orange pools. The air smelled like wet stone and something green. Spring was coming. I could feel it. I thought about what Frau Schmidt had said. He talks about you. Matei, who spoke in short sentences. Matei, who remembered everything. Matei, who had given me a key and a job and a scarf and a plant. Matei, who had not touched me since that first week. Now say \u201cthe streetlight\u201d", "lang": "en"}, {"text": "die Stra\u00dfenlaterne", "lang": "de"}], [{"text": "Die Stra\u00dfenlaterne. Feminine.", "lang": "de"}, {"text": "Now say \u201cspring\u201d", "lang": "en"}, {"text": "der Fr\u00fchling", "lang": "de"}], [{"text": "Der Fr\u00fchling. Masculine.", "lang": "de"}, {"text": "I stopped at the bridge. The canal was dark. The duck was asleep somewhere, probably. I leaned on the railing and stared at the water. You are both stubborn. She was right. I was stubborn. I was terrified. I had spent my whole life waiting for people to leave, and now someone was staying, and I did not know what to do with that. My body knew what it wanted. My heart knew what it wanted. But my mouth \u2013 my stupid, broken mouth \u2013 could not form the words. Now say \u201cthe bridge\u201d die Br\u00fccke. Review", "lang": "en"}], [{"text": "Die Br\u00fccke.", "lang": "de"}, {"text": "Now say \u201cthe canal\u201d", "lang": "en"}, {"text": "der Kanal", "lang": "de"}], [{"text": "Der Kanal. Masculine.", "lang": "de"}, {"text": "Now say \u201cterrified\u201d ver\u00e4ngstigt. Review", "lang": "en"}], [{"text": "Ver\u00e4ngstigt. Ich bin ver\u00e4ngstigt. --I pulled out my phone. Matei. I typed it. Erased it. Typed it again. Are you home? Three dots appeared. Then disappeared. Then appeared again. Yes. I am on my way. I know. I stared at the screen. I know. How did he know? Was he watching the window? Did he have a sixth sense for when I was standing on bridges, trying to work up the courage to say something? I put my phone away and walked. Now say \u201cthe courage\u201d", "lang": "en"}, {"text": "der Mut", "lang": "de"}], [{"text": "Der Mut. Masculine. Mut haben", "lang": "de"}, {"text": "\u2013 to have courage Now say \u201cthe sixth sense\u201d", "lang": "en"}, {"text": "der sechste Sinn", "lang": "de"}], [{"text": "Der sechste Sinn. Sinn is masculine.", "lang": "de"}, {"text": "The stairs were thirty-seven steps. The key stuck. The door opened. Matei was standing by the window. His back was to me. He was looking out at the street \u2013 the same street I had just walked down. The same orange lights. \u201cYou are late,\u201d he said without turning. \u201cThe caf\u00e9 closed late.\u201d \u201cFrau Schmidt texted me. She said you dropped a cup.\u201d \u201cShe texts you about that?\u201d \u201cShe texts me about a lot of things.\u201d He turned. His face was half in shadow. \u201cShe likes you.\u201d \u201cShe told me you talk about me.\u201d He did not deny it. Now say \u201cthe shadow\u201d", "lang": "en"}, {"text": "der Schatten", "lang": "de"}], [{"text": "Der Schatten. Masculine.", "lang": "de"}, {"text": "Now say \u201cto deny\u201d", "lang": "en"}, {"text": "leugnen or verneinen", "lang": "de"}], [{"text": "Leugnen. Er leugnet es nicht \u2013 he does not deny it. --\u201cYves.\u201d \u201cWhat?\u201d \u201cWhy did you text me?\u201d I walked to the table. Sat on the wooden chair. The scarf \u2013 his scarf \u2013 was still around my neck. I unwrapped it slowly, buying time. \u201cBecause I wanted to know if you were here,\u201d I said. \u201cI am always here.\u201d \u201cNot always. You work. You go to the library. You have a life that does not involve me.\u201d He walked to the plastic chair. Sat down across from me. The lamp was between us, casting a yellow circle on the table. \u201cYou are in every part of my life,\u201d he said quietly. \u201cYou just do not see it.\u201d \u201cThen show me.\u201d Now say \u201cto involve\u201d", "lang": "en"}, {"text": "einbeziehen", "lang": "de"}], [{"text": "Einbeziehen. Mein Leben bezieht dich ein", "lang": "de"}, {"text": "\u2013 my life involves you Now say \u201cto see\u201d sehen. Review", "lang": "en"}], [{"text": "Sehen. Du siehst es nicht", "lang": "de"}, {"text": "\u2013 you do not see it --The words came out before I could stop them. They hung in the air like smoke. Matei's expression did not change. But his hand \u2013 his right hand \u2013 reached across the table. Palm up. An invitation. \u201cCome here,\u201d he said. I did not move. \u201cYves.\u201d \u201cI am scared.\u201d \u201cI know.\u201d \u201cIf I come over there, something is going to happen.\u201d \u201cI know.\u201d \u201cAnd I do not know if I am ready.\u201d He did not pull his hand back. He just waited. His palm was open. His fingers were still. \u201cYou do not have to be ready,\u201d he said. \u201cYou just have to be here.\u201d Now say \u201cready\u201d", "lang": "en"}, {"text": "bereit", "lang": "de"}], [{"text": "Bereit. Ich bin bereit \u2013 I am ready. Ich bin nicht bereit \u2013 I am not ready. Now say \u201cthe invitation\u201d", "lang": "en"}, {"text": "die Einladung", "lang": "de"}], [{"text": "Die Einladung. Feminine", "lang": "de"}, {"text": "\u2013 -ung ending --I stood up. Walked around the table. Sat on the sofa next to him. Close. Close enough that our knees touched. Close enough that I could smell his coat \u2013 cold air, coffee, something underneath that was just him. He did not move. He did not touch me. He just sat there, his hand still on the cushion between us. \u201cMatei.\u201d \u201cWhat?\u201d \u201cWhy have you not kissed me yet?\u201d The question was stupid. It was also the only question that mattered. Now say \u201cto kiss\u201d", "lang": "en"}, {"text": "k\u00fcssen", "lang": "de"}], [{"text": "K\u00fcssen. Warum hast du mich nicht gek\u00fcsst? \u2013 Why have you not kissed me? Now say \u201cthe question\u201d die Frage. Review", "lang": "en"}], [{"text": "Die Frage. Die einzige Frage", "lang": "de"}, {"text": "\u2013 the only question --He turned to look at me. His grey eyes were dark in the lamplight. His face was close. Too close. Not close enough. \u201cBecause I wanted you to want it,\u201d he said. \u201cNot because you felt obligated. Not because I am the only person who has been nice to you. I wanted you to want it.\u201d \u201cI do want it.\u201d \u201cThen why have you not kissed me?\u201d I blinked. \u201cWhat?\u201d \u201cYou asked why I have not kissed you. Why have you not kissed me?\u201d Now say \u201cobligated\u201d", "lang": "en"}, {"text": "verpflichtet", "lang": "de"}], [{"text": "Verpflichtet. Aus Verpflichtung \u2013 out of obligation. Now say \u201cto want\u201d", "lang": "en"}, {"text": "wollen", "lang": "de"}], [{"text": "Wollen. Ich will \u2013 I want. Du willst \u2013 you want. Er will \u2013 he wants. No ending for ich and er. --I opened my mouth. Closed it. Opened it again. \u201cBecause I am a coward,\u201d I said. \u201cYou are not a coward.\u201d \u201cI am. I have been running my whole life. From home, from people, from feelings. I came to Berlin because I was running.\u201d \u201cAnd now?\u201d I looked at his hand. The scar on his thumb. The veins. The way his fingers curled slightly, like he was resisting the urge to reach for me. \u201cNow I do not want to run anymore,\u201d I said. \u201cBut I do not know how to stay.\u201d Now say \u201cthe coward\u201d", "lang": "en"}, {"text": "der Feigling", "lang": "de"}], [{"text": "Der Feigling. Masculine. Ich bin ein Feigling", "lang": "de"}, {"text": "\u2013 I am a coward Now say \u201cto run\u201d laufen or rennen. Review", "lang": "en"}], [{"text": "Laufen. Ich laufe", "lang": "de"}, {"text": "\u2013 I run. Ich will nicht mehr laufen \u2013 I do not want to run anymore. --He turned his hand over. Palm up again. The invitation was still there. \u201cYou stay by staying,\u201d he said. \u201cOne day at a time. One moment at a time. You wake up. You make coffee. You go to work. You come home. And you do not leave.\u201d \u201cThat is it?\u201d \u201cThat is it.\u201d I looked at his palm. The lines. The warmth. \u201cAnd what about you?\u201d I asked. \u201cWhat about me?\u201d \u201cAre you staying?\u201d He did not answer with words. He moved his hand \u2013 slowly, so slowly \u2013 and placed it on top of mine. His fingers curled around my knuckles. His palm was warm. Now say \u201cthe moment\u201d", "lang": "en"}, {"text": "der Moment", "lang": "de"}], [{"text": "Der Moment. Masculine. Moment f\u00fcr Moment", "lang": "de"}, {"text": "\u2013 moment by moment Now say \u201cthe warmth\u201d", "lang": "en"}, {"text": "die W\u00e4rme", "lang": "de"}], [{"text": "Die W\u00e4rme. Feminine.", "lang": "de"}, {"text": "\u201cI have been staying,\u201d he said. \u201cI have been staying since the first message. Two years ago. I have been staying since you got off the plane. I will be staying when you finally figure out that you deserve to be here.\u201d My eyes were wet. I did not know when that had happened. \u201cThat is a lot of pressure,\u201d I whispered. \u201cNo.\u201d He squeezed my hand. \u201cIt is a lot of patience. Pressure is what you put on yourself. Patience is what I am giving you.\u201d Now say \u201cthe pressure\u201d", "lang": "en"}, {"text": "der Druck", "lang": "de"}], [{"text": "Der Druck. Masculine.", "lang": "de"}, {"text": "Now say \u201cthe patience\u201d", "lang": "en"}, {"text": "die Geduld", "lang": "de"}], [{"text": "Die Geduld. Feminine.", "lang": "de"}, {"text": "I turned my hand over. Our palms pressed together. His fingers laced through mine. \u201cMatei.\u201d \u201cYves.\u201d \u201cI still do not know how to say what I want to say.\u201d \u201cThen do not say it.\u201d He leaned in. The space between us disappeared. His forehead touched mine. His breath was warm on my lips. His nose brushed against my cheek. We were so close that I could see the individual lashes of his eyes, the small mole above his eyebrow, the way his mouth was slightly open. He did not kiss me. He just stayed there. Forehead to forehead. Breath to breath. Hands together. \u201cThis is enough,\u201d he said. \u201cFor now.\u201d I closed my eyes. \u201cOkay,\u201d I said. \u201cOkay.\u201d Now say \u201cthe forehead\u201d", "lang": "en"}, {"text": "die Stirn", "lang": "de"}], [{"text": "Die Stirn. Feminine.", "lang": "de"}, {"text": "Now say \u201cthe eyelash\u201d", "lang": "en"}, {"text": "die Wimper", "lang": "de"}], [{"text": "Die Wimper. Feminine.", "lang": "de"}, {"text": "We stayed like that for a long time. The lamp buzzed. The radiator clicked. Somewhere downstairs, someone was playing music \u2013 slow, sad, beautiful. I did not know how long we sat there. Minutes. Maybe hours. Time had stopped meaning anything. Eventually, he pulled back. His hand was still in mine. \u201cYou should sleep,\u201d he said. \u201cSo should you.\u201d \u201cI will. After you.\u201d I laughed. It was small, but it was real. \u201cGood night, Matei.\u201d \u201cGood night, Yves.\u201d Now say \u201cthe music\u201d", "lang": "en"}, {"text": "die Musik", "lang": "de"}], [{"text": "Die Musik. Feminine.", "lang": "de"}, {"text": "Now say \u201cbeautiful\u201d", "lang": "en"}, {"text": "sch\u00f6n", "lang": "de"}], [{"text": "Sch\u00f6n. Die Musik ist sch\u00f6n", "lang": "de"}, {"text": "\u2013 the music is beautiful --- I went to the bed. He went to the sofa. But this time, when I lay down, I did not stare at the ceiling. I closed my eyes and listened to him breathe. And for the first time, the space between us did not feel like a held breath. It felt like a beginning. Now say \u201cthe beginning\u201d der Anfang. Review", "lang": "en"}], [{"text": "Der Anfang. Ein Anfang", "lang": "de"}, {"text": "\u2013 a beginning Now say \u201cto feel like\u201d", "lang": "en"}, {"text": "sich anf\u00fchlen wie", "lang": "de"}], [{"text": "Sich anf\u00fchlen wie. Es f\u00fchlt sich an wie ein Anfang \u2013 it feels like a beginning. --Dual-layer vocabulary review \u2013 Chapter 6 Layer 1 \u2013 Words Sich ver\u00e4ndern \u2013 to change / shift. <break time=\"2s\"/> Sich ver\u00e4ndern. Etwas ver\u00e4ndert sich.", "lang": "en"}, {"text": "Die Wolke", "lang": "de"}, {"text": "\u2013 the cloud. <break time=\"2s\"/> Die Wolke", "lang": "en"}, {"text": "Der Schal", "lang": "de"}, {"text": "\u2013 the scarf. <break time=\"2s\"/> Der Schal", "lang": "en"}, {"text": "Die Pflanze", "lang": "de"}, {"text": "\u2013 the plant. <break time=\"2s\"/> Die Pflanze", "lang": "en"}, {"text": "Das Fensterbrett", "lang": "de"}, {"text": "\u2013 the windowsill. <break time=\"2s\"/> Das Fensterbrett", "lang": "en"}, {"text": "Die Geste", "lang": "de"}, {"text": "\u2013 the gesture. <break time=\"2s\"/> Die Geste", "lang": "en"}, {"text": "Der Beweis", "lang": "de"}, {"text": "\u2013 the evidence. <break time=\"2s\"/> Der Beweis", "lang": "en"}, {"text": "Die Frage", "lang": "de"}, {"text": "\u2013 the question. <break time=\"2s\"/> Die Frage Vermeiden \u2013 to avoid. <break time=\"2s\"/> Vermeiden. Du vermeidest die Frage.", "lang": "en"}, {"text": "Der Besen", "lang": "de"}, {"text": "\u2013 the broom. <break time=\"2s\"/> Der Besen", "lang": "en"}, {"text": "Sprechen \u00fcber", "lang": "de"}, {"text": "\u2013 to talk about. <break time=\"2s\"/> Sprechen \u00fcber. Er spricht \u00fcber dich.", "lang": "en"}, {"text": "Erw\u00e4hnen", "lang": "de"}, {"text": "\u2013 to mention. <break time=\"2s\"/> Erw\u00e4hnen. Er erw\u00e4hnt dich", "lang": "en"}, {"text": "Aufpassen", "lang": "de"}, {"text": "\u2013 to pay attention. <break time=\"2s\"/> Aufpassen. Er passt auf Stur \u2013 stubborn. <break time=\"2s\"/> Stur. Ihr seid beide stur.", "lang": "en"}, {"text": "Die Stra\u00dfenlaterne", "lang": "de"}, {"text": "\u2013 the streetlight. <break time=\"2s\"/> Die Stra\u00dfenlaterne", "lang": "en"}, {"text": "Der Fr\u00fchling", "lang": "de"}, {"text": "\u2013 spring (season). <break time=\"2s\"/> Der Fr\u00fchling", "lang": "en"}, {"text": "Der Kanal", "lang": "de"}, {"text": "\u2013 the canal. <break time=\"2s\"/> Der Kanal", "lang": "en"}, {"text": "Der Mut", "lang": "de"}, {"text": "\u2013 courage. <break time=\"2s\"/> Der Mut. Mut haben", "lang": "en"}, {"text": "Der sechste Sinn", "lang": "de"}, {"text": "\u2013 the sixth sense. <break time=\"2s\"/> Der sechste Sinn", "lang": "en"}, {"text": "Der Schatten", "lang": "de"}, {"text": "\u2013 the shadow. <break time=\"2s\"/> Der Schatten Leugnen \u2013 to deny. <break time=\"2s\"/> Leugnen. Er leugnet es nicht.", "lang": "en"}, {"text": "Einbeziehen", "lang": "de"}, {"text": "\u2013 to involve. <break time=\"2s\"/> Einbeziehen Bereit \u2013 ready. <break time=\"2s\"/> Bereit. Ich bin bereit.", "lang": "en"}, {"text": "Die Einladung", "lang": "de"}, {"text": "\u2013 the invitation. <break time=\"2s\"/> Die Einladung K\u00fcssen \u2013 to kiss. <break time=\"2s\"/> K\u00fcssen. Warum hast du mich nicht gek\u00fcsst? Verpflichtet \u2013 obligated. <break time=\"2s\"/> Verpflichtet. Aus Verpflichtung. Wollen \u2013 to want. <break time=\"2s\"/> Wollen. Ich will.", "lang": "en"}, {"text": "Der Feigling", "lang": "de"}, {"text": "\u2013 the coward. <break time=\"2s\"/> Der Feigling", "lang": "en"}, {"text": "Der Moment", "lang": "de"}, {"text": "\u2013 the moment. <break time=\"2s\"/> Der Moment", "lang": "en"}, {"text": "Die W\u00e4rme", "lang": "de"}, {"text": "\u2013 the warmth. <break time=\"2s\"/> Die W\u00e4rme", "lang": "en"}, {"text": "Der Druck", "lang": "de"}, {"text": "\u2013 pressure. <break time=\"2s\"/> Der Druck", "lang": "en"}, {"text": "Die Geduld", "lang": "de"}, {"text": "\u2013 patience. <break time=\"2s\"/> Die Geduld", "lang": "en"}, {"text": "Die Stirn", "lang": "de"}, {"text": "\u2013 the forehead. <break time=\"2s\"/> Die Stirn", "lang": "en"}, {"text": "Die Wimper", "lang": "de"}, {"text": "\u2013 the eyelash. <break time=\"2s\"/> Die Wimper", "lang": "en"}, {"text": "Die Musik", "lang": "de"}, {"text": "\u2013 the music. <break time=\"2s\"/> Die Musik", "lang": "en"}, {"text": "Sch\u00f6n", "lang": "de"}, {"text": "\u2013 beautiful. <break time=\"2s\"/> Sch\u00f6n. Die Musik ist sch\u00f6n", "lang": "en"}, {"text": "Der Anfang", "lang": "de"}, {"text": "\u2013 the beginning. <break time=\"2s\"/> Der Anfang. Ein Anfang Sich anf\u00fchlen wie \u2013 to feel like. <break time=\"2s\"/> Sich anf\u00fchlen wie. Es f\u00fchlt sich an wie ein Anfang. Layer 2 \u2013 Story phrases \"Etwas ver\u00e4ndert sich.\" \u2013 Something is changing. <break time=\"2s\"/> Etwas ver\u00e4ndert sich. \"Seid ihr zusammen?\" \u2013 Are you together? <break time=\"2s\"/> Seid ihr zusammen? \"Du vermeidest die Frage.\" \u2013 You're avoiding the question. <break time=\"2s\"/> Du vermeidest die Frage. \"Er spricht \u00fcber dich.\" \u2013 He talks about you. <break time=\"2s\"/> Er spricht \u00fcber dich. \"Ihr seid beide stur.\" \u2013 You're both stubborn. <break time=\"2s\"/> Ihr seid beide stur. \"Ich bin bereit.\" \u2013 I'm ready. <break time=\"2s\"/> Ich bin bereit. \"Warum hast du mich nicht gek\u00fcsst?\" \u2013 Why haven't you kissed me? <break time=\"2s\"/> Warum hast du mich nicht gek\u00fcsst? \"Ich will nicht mehr laufen.\" \u2013 I don't want to run anymore. <break time=\"2s\"/>", "lang": "en"}, {"text": "Ich will nicht mehr laufen.", "lang": "de"}, {"text": "\"Das ist genug f\u00fcr jetzt.\" \u2013 That's enough for now. <break time=\"2s\"/> Das ist genug f\u00fcr jetzt. \"Es f\u00fchlt sich an wie ein Anfang.\" \u2013 It feels like a beginning. <break time=\"2s\"/> Es f\u00fchlt sich an wie ein Anfang. End of Chapter 6. Chapters 7, 8, and 9 \u2013 Refined Audio Scripts Here are the next three chapters in the hybrid style: sensory prose, grammar woven into Yves's thoughts, active prompts, dual-layer reviews. --Chapter 7 \u2013 The Crack (A1-A2) (Narrator voice, calm, clear. Ambient: early morning \u2013 single bird, distant tram bell, the hum of a refrigerator.) The next morning, Matei was gone before I woke up. That was not new. He was an early riser. He liked to be out of the apartment before the city got loud, before the bakery downstairs started selling out of the good bread, before I had to drag myself out of bed and pretend to be a functional human being. But this time felt different. The space beside me was cold. No lingering warmth. No dent in the pillow where his head had been. He had gotten up hours ago, and he had not come back. Now say \u201cto wake up\u201d aufwachen. Review", "lang": "en"}], [{"text": "Aufwachen. Ich wache auf.", "lang": "de"}, {"text": "Now say \u201cthe pillow\u201d", "lang": "en"}, {"text": "das Kissen", "lang": "de"}], [{"text": "Das Kissen. Neuter. Das Kissen hat eine Delle", "lang": "de"}, {"text": "\u2013 the pillow has a dent --I sat up. The apartment was quiet. Too quiet. On the table, there was coffee. Black. No sugar. No milk. And a note. Yves \u2013 I need some air. I will be back tonight. \u2013 M. No do not burn the milk. No you have flour in your hair. Just four sentences, written in that small, neat handwriting I had come to recognise. I read the note three times. Then I folded it and put it in my pocket. Next to the key. Now say \u201cthe note\u201d der Zettel. Review", "lang": "en"}], [{"text": "Der Zettel.", "lang": "de"}, {"text": "Now say \u201cthe air\u201d", "lang": "en"}, {"text": "die Luft", "lang": "de"}], [{"text": "Die Luft. Feminine. Ich brauche etwas Luft", "lang": "de"}, {"text": "\u2013 I need some air --Work was a disaster. I dropped two cups before noon. Frau Schmidt did not say anything, but she watched me with those sharp grey eyes, and at 11:30, she pulled me aside. \u201cSit,\u201d she said, pointing at a table. \u201cI have to clean the bathroom.\u201d \u201cThe bathroom can wait. Sit.\u201d I sat. She sat across from me. The caf\u00e9 was empty except for a man in the corner reading a newspaper and ignoring us. Now say \u201cthe disaster\u201d", "lang": "en"}, {"text": "die Katastrophe", "lang": "de"}], [{"text": "Die Katastrophe. Feminine. Die Arbeit war eine Katastrophe", "lang": "de"}, {"text": "\u2013 work was a disaster Now say \u201cthe newspaper\u201d", "lang": "en"}, {"text": "die Zeitung", "lang": "de"}], [{"text": "Die Zeitung. Feminine. Der Mann liest Zeitung", "lang": "de"}, {"text": "\u2013 the man is reading a newspaper --\u201cWhat happened?\u201d she asked. \u201cNothing.\u201d \u201cYou dropped two cups. Last week you dropped four total. This is regression.\u201d \u201cI am tired.\u201d \u201cYou are lying.\u201d She folded her arms. \u201cDid you and Matei fight?\u201d I stared at the table. The wood was scratched. Someone had carved a heart into it, years ago, with two initials inside. T + M. Not Matei. Someone else. \u201cHe is upset,\u201d I said. \u201cBecause I did not tell him about something.\u201d Now say \u201cthe regression\u201d", "lang": "en"}, {"text": "der R\u00fcckschritt", "lang": "de"}], [{"text": "Der R\u00fcckschritt. Masculine. Das ist ein R\u00fcckschritt", "lang": "de"}, {"text": "\u2013 that's regression Now say \u201cto carve\u201d", "lang": "en"}, {"text": "schnitzen. Jemand hat ein Herz geschnitzt \u2013 someone carved a", "lang": "de"}, {"text": "heart. --\u201cWhat something?\u201d \u201cA friend texted me. A coworker of his. It was nothing. But I did not mention it, and he found out, and now he thinks I am hiding things.\u201d Frau Schmidt was quiet for a moment. Then she said, \u201cIs he wrong?\u201d I looked up. \u201cWhat?\u201d \u201cAre you hiding things? Not the texts. Other things.\u201d I opened my mouth. Closed it. Opened it again. \u201cI do not know,\u201d I said. \u201cMaybe. I do not know how to do this.\u201d Now say \u201cto hide\u201d verstecken. Review", "lang": "en"}], [{"text": "Verstecken. Du versteckst etwas \u2013 you are hiding something. Now say \u201cto find out\u201d herausfinden (separable). Er hat es herausgefunden \u2013 he found out. --\u201cDo what?\u201d \u201cThis.\u201d I gestured at the caf\u00e9, at the window, at the grey sky outside. \u201cBeing with someone. Staying. Not running.\u201d She nodded slowly. \u201cMy husband was like you.\u201d \u201cHe ran?\u201d \u201cHe tried. Many times. The first year we were married, he packed a bag three times. Each time, I unpacked it for him.\u201d She smiled. \u201cThe fourth time, he packed the bag, and I packed one too. I told him, \u2018If you go, I go.\u2019 He never packed again.\u201d \u201cThat is not advice.\u201d \u201cIt is not advice. It is a story.\u201d She reached across the table and patted my hand. \u201cYou want advice? Here it is. Stop trying to be perfect. You will make mistakes. You will hurt him. He will hurt you. This is what it means to be with someone. The question is not whether you will make mistakes. The question is whether you will stay after you make them.\u201d Now say \u201cto pack a bag\u201d", "lang": "en"}, {"text": "einen Koffer packen", "lang": "de"}], [{"text": "Einen Koffer packen. Er packte einen Koffer", "lang": "de"}, {"text": "\u2013 he packed a bag Now say \u201cthe mistake\u201d", "lang": "en"}, {"text": "der Fehler", "lang": "de"}], [{"text": "Der Fehler. Masculine. Du wirst Fehler machen", "lang": "de"}, {"text": "\u2013 you will make mistakes --I looked at the heart carved into the table. T + M. \u201cWhat if he leaves first?\u201d I asked. \u201cThen you let him. And you learn. And you try again with someone else.\u201d She squeezed my hand. \u201cBut he has not left yet. Has he?\u201d \u201cNo.\u201d \u201cThen stop planning for a disaster that has not happened.\u201d Now say \u201cto let go\u201d loslassen (separable)", "lang": "en"}], [{"text": "Loslassen. Dann l\u00e4sst du ihn gehen \u2013 then you let him go. Now say \u201cto plan\u201d", "lang": "en"}, {"text": "planen. H\u00f6r auf zu planen \u2013 stop planning", "lang": "de"}, {"text": "I left work early. Frau Schmidt shooed me out the door with a bag of apricot pastries. I walked to the bridge. The duck was there today, paddling in circles like it had nowhere to be and all day to get there. I leaned on the railing and ate a pastry. It was warm. Flaky. Too sweet. I ate another one. My phone buzzed. Matei: Where are you? Now say \u201cto shoo away\u201d", "lang": "en"}, {"text": "wegwinken or fortscheuchen", "lang": "de"}], [{"text": "Fortscheuchen. Frau Schmidt scheuchte mich weg \u2013 Frau Schmidt shooed me away. Now say \u201cthe railing\u201d", "lang": "en"}, {"text": "das Gel\u00e4nder", "lang": "de"}], [{"text": "Das Gel\u00e4nder. Neuter. Auf das Gel\u00e4nder lehnen", "lang": "de"}, {"text": "\u2013 to lean on the railing --I stared at the message. He had not texted me all day. Now he was asking where I was. Bridge, I wrote back. The one with the duck. I know which one. Stay there. I waited. The duck paddled. A family walked past with a dog on a leash. The dog tried to jump into the canal. The family laughed. The dog did not. Twenty minutes later, Matei appeared at the end of the bridge. Now say \u201cthe leash\u201d", "lang": "en"}, {"text": "die Leine", "lang": "de"}], [{"text": "Die Leine. Feminine. Ein Hund an der Leine", "lang": "de"}, {"text": "\u2013 a dog on a leash Now say \u201cto appear\u201d auftauchen (separable)", "lang": "en"}], [{"text": "Auftauchen. Matei tauchte am Ende der Br\u00fccke auf", "lang": "de"}, {"text": "\u2013 Matei appeared at the end of the bridge. --He was wearing the same grey coat. His hands were in his pockets. His hair was messy, like he had been running his hands through it. He walked to me. Stopped a metre away. Did not touch me. \u201cYou came,\u201d I said. \u201cI said I would.\u201d \u201cYou also said you needed air.\u201d \u201cI got air.\u201d He looked at the duck. \u201cA lot of air. I walked halfway across the city.\u201d \u201cDid it help?\u201d \u201cNo.\u201d Now say \u201chalfway\u201d", "lang": "en"}, {"text": "die H\u00e4lfte. Die halbe Stadt \u2013 half the city", "lang": "de"}], [{"text": "Die halbe Stadt. Ich bin die halbe Stadt gelaufen", "lang": "de"}, {"text": "\u2013 I walked halfway across the city. Now say \u201cto help\u201d", "lang": "en"}, {"text": "helfen. Hat es geholfen? \u2013 Did it help?", "lang": "de"}, {"text": "I offered him a pastry. He took it. Ate it in two bites. Wiped his mouth with the back of his hand. \u201cI am not good at this,\u201d he said. \u201cAt what?\u201d \u201cAt being angry.\u201d He turned to look at me. His grey eyes were tired. \u201cWhen I am angry, I shut down. I leave. I do not talk. It is what I learned. From my father. From the ex. From all the people who taught me that anger is dangerous.\u201d \u201cIt is dangerous.\u201d \u201cNot when it is honest.\u201d Now say \u201cto shut down\u201d", "lang": "en"}, {"text": "sich verschlie\u00dfen", "lang": "de"}], [{"text": "Sich verschlie\u00dfen. Ich verschlie\u00dfe mich \u2013 I shut down. Now say \u201cdangerous\u201d", "lang": "en"}, {"text": "gef\u00e4hrlich", "lang": "de"}], [{"text": "Gef\u00e4hrlich. Wut ist gef\u00e4hrlich \u2013 anger is dangerous. --He took a breath. His chest rose and fell slowly. \u201cI was angry last night. Not because of Lukas. Because you did not trust me.\u201d \u201cI do trust you.\u201d \u201cYou hide things. Small things. Things that do not matter. And every time you hide something, I wonder what else you are hiding.\u201d I wanted to argue. I wanted to say I am not hiding anything. But that was not true. I had been hiding my whole life. Now say \u201cto wonder\u201d", "lang": "en"}, {"text": "sich fragen", "lang": "de"}], [{"text": "Sich fragen. Ich frage mich, was du noch versteckst \u2013 I wonder what else you are hiding. Now say \u201cto argue\u201d", "lang": "en"}, {"text": "diskutieren or streiten", "lang": "de"}], [{"text": "Diskutieren. Ich wollte diskutieren \u2013 I wanted to argue. --\u201cI am scared,\u201d I said. \u201cI know.\u201d \u201cI am scared that if you know everything about me, you will leave.\u201d He stepped closer. Close enough that I could smell his coat. Cold air. Coffee. Him. \u201cYves.\u201d \u201cWhat?\u201d \u201cI already know everything about you. Not the facts. The shape of you. The parts that matter.\u201d He reached out. His hand touched my face. His thumb traced my cheekbone. \u201cYou are scared. You are lonely. You want to be loved but you do not know how to ask for it. You make pasta from memory and drink coffee black and laugh when you are uncomfortable. You dropped a cup yesterday and apologised to the floor.\u201d Now say \u201cthe shape\u201d", "lang": "en"}, {"text": "die Form or die Gestalt", "lang": "de"}], [{"text": "Die Gestalt. Feminine. Die Gestalt von dir", "lang": "de"}, {"text": "\u2013 the shape of you Now say \u201cto apologise\u201d", "lang": "en"}, {"text": "sich entschuldigen", "lang": "de"}], [{"text": "Sich entschuldigen. Du hast dich beim Boden entschuldigt \u2013 you apologised to the floor. --\u201cI did not apologise to the floor.\u201d \u201cFrau Schmidt told me.\u201d I laughed. I could not help it. The image of Matei receiving a text about me apologising to inanimate objects was too absurd. \u201cShe tells you everything.\u201d \u201cShe does.\u201d He smiled. A real smile. Small. Tired. Real. \u201cI am not going to leave, Yves. Not because you are perfect. Because you are not. And neither am I.\u201d \u201cThat is a terrible reason to stay.\u201d \u201cIt is the only reason that matters.\u201d Now say \u201cterrible\u201d schrecklich. Review", "lang": "en"}], [{"text": "Schrecklich. Das ist ein schrecklicher Grund \u2013 that is a terrible reason. Now say \u201cto matter\u201d", "lang": "en"}, {"text": "z\u00e4hlen or wichtig sein", "lang": "de"}], [{"text": "Z\u00e4hlen. Der einzige Grund, der z\u00e4hlt \u2013 the only reason that matters. --He kissed me. On the bridge. In front of the duck. In front of the family with the dog, who whistled and said something in German that I did not understand but sounded approving. When he pulled back, his hand was still on my face. \u201cNo more hiding,\u201d he said. \u201cNo more hiding.\u201d \u201cAnd no more running.\u201d \u201cI will try.\u201d \u201cThat is all I ask.\u201d Now say \u201capproving\u201d", "lang": "en"}, {"text": "zustimmend", "lang": "de"}], [{"text": "Zustimmend. Sie klangen zustimmend \u2013 they sounded approving. Now say \u201cto try\u201d", "lang": "en"}, {"text": "versuchen", "lang": "de"}], [{"text": "Versuchen. Ich werde es versuchen \u2013 I will try. --We walked home together. His hand was in mine. The streets were wet from a rain I had not noticed. The streetlights cast orange light on the pavement. \u201cMatei.\u201d \u201cWhat?\u201d \u201cWhat is the German word for duck?\u201d \u201cEnte.\u201d \u201cEnte,\u201d I repeated. \u201cThat is a stupid word for such a good animal.\u201d \u201cGerman is a stupid language.\u201d \u201cYou are German.\u201d \u201cI am Romanian. I just live here.\u201d I squeezed his hand. He squeezed back. Now say \u201cthe duck\u201d die Ente. Review", "lang": "en"}], [{"text": "Die Ente.", "lang": "de"}, {"text": "Now say \u201cRomanian\u201d", "lang": "en"}, {"text": "rum\u00e4nisch", "lang": "de"}], [{"text": "Rum\u00e4nisch. Ich bin Rum\u00e4ne \u2013 I am Romanian (male). Ich bin Rum\u00e4nin \u2013 female. --That night, we made dinner together. Pasta again. My grandmother's recipe. He chopped the onions. I cried. Not from the onions. When we went to bed, he held me. His chest was warm against my back. \u201cYves.\u201d \u201cHm?\u201d \u201cI am glad you came to Berlin.\u201d I turned over. Faced him in the dark. \u201cI am glad I stayed.\u201d He kissed my forehead. \u201cGood night.\u201d \u201cGood night, Matei.\u201d Now say \u201cto chop\u201d", "lang": "en"}, {"text": "hacken or schneiden", "lang": "de"}], [{"text": "Schneiden. Er schnitt die Zwiebeln \u2013 he chopped the onions. Now say \u201cglad\u201d", "lang": "en"}, {"text": "froh", "lang": "de"}], [{"text": "Froh. Ich bin froh, dass du gekommen bist \u2013 I am glad you came. Ich bin froh, dass ich geblieben bin \u2013 I am glad I stayed. --Dual-layer vocabulary review \u2013 Chapter 7 Layer 1 \u2013 Words", "lang": "en"}, {"text": "Das Kissen", "lang": "de"}, {"text": "\u2013 the pillow. <break time=\"2s\"/> Das Kissen", "lang": "en"}, {"text": "Der Zettel", "lang": "de"}, {"text": "\u2013 the note. <break time=\"2s\"/> Der Zettel", "lang": "en"}, {"text": "Die Luft", "lang": "de"}, {"text": "\u2013 the air. <break time=\"2s\"/> Die Luft. Ich brauche etwas Luft", "lang": "en"}, {"text": "Die Katastrophe", "lang": "de"}, {"text": "\u2013 the disaster. <break time=\"2s\"/> Die Katastrophe", "lang": "en"}, {"text": "Die Zeitung", "lang": "de"}, {"text": "\u2013 the newspaper. <break time=\"2s\"/> Die Zeitung", "lang": "en"}, {"text": "Der R\u00fcckschritt", "lang": "de"}, {"text": "\u2013 the regression. <break time=\"2s\"/> Der R\u00fcckschritt. Das ist ein R\u00fcckschritt. Schnitzen \u2013 to carve. <break time=\"2s\"/> Schnitzen. Jemand hat ein Herz geschnitzt. Verstecken \u2013 to hide. <break time=\"2s\"/> Verstecken. Du versteckst etwas. Herausfinden \u2013 to find out. <break time=\"2s\"/> Herausfinden. Er hat es herausgefunden.", "lang": "en"}, {"text": "Einen Koffer packen", "lang": "de"}, {"text": "\u2013 to pack a bag. <break time=\"2s\"/> Einen Koffer packen", "lang": "en"}, {"text": "Der Fehler", "lang": "de"}, {"text": "\u2013 the mistake. <break time=\"2s\"/> Der Fehler Loslassen \u2013 to let go. <break time=\"2s\"/> Loslassen. Dann l\u00e4sst du ihn gehen. Planen \u2013 to plan. <break time=\"2s\"/> Planen. H\u00f6r auf zu planen. Fortscheuchen \u2013 to shoo away. <break time=\"2s\"/> Fortscheuchen.", "lang": "en"}, {"text": "Das Gel\u00e4nder", "lang": "de"}, {"text": "\u2013 the railing. <break time=\"2s\"/> Das Gel\u00e4nder", "lang": "en"}, {"text": "Die Leine", "lang": "de"}, {"text": "\u2013 the leash. <break time=\"2s\"/> Die Leine", "lang": "en"}, {"text": "Auftauchen", "lang": "de"}, {"text": "\u2013 to appear. <break time=\"2s\"/> Auftauchen. Matei tauchte auf", "lang": "en"}, {"text": "Die halbe Stadt", "lang": "de"}, {"text": "\u2013 half the city. <break time=\"2s\"/> Die halbe Stadt", "lang": "en"}, {"text": "Helfen", "lang": "de"}, {"text": "\u2013 to help. <break time=\"2s\"/> Helfen. Hat es geholfen? Sich verschlie\u00dfen \u2013 to shut down. <break time=\"2s\"/> Sich verschlie\u00dfen. Gef\u00e4hrlich \u2013 dangerous. <break time=\"2s\"/> Gef\u00e4hrlich. Sich fragen \u2013 to wonder. <break time=\"2s\"/> Sich fragen. Diskutieren \u2013 to argue. <break time=\"2s\"/> Diskutieren.", "lang": "en"}, {"text": "Die Gestalt", "lang": "de"}, {"text": "\u2013 the shape. <break time=\"2s\"/> Die Gestalt Sich entschuldigen \u2013 to apologise. <break time=\"2s\"/> Sich entschuldigen. Schrecklich \u2013 terrible. <break time=\"2s\"/> Schrecklich. Z\u00e4hlen \u2013 to matter. <break time=\"2s\"/> Z\u00e4hlen. Der einzige Grund, der z\u00e4hlt. Zustimmend \u2013 approving. <break time=\"2s\"/> Zustimmend. Versuchen \u2013 to try. <break time=\"2s\"/> Versuchen. Ich werde es versuchen.", "lang": "en"}, {"text": "Die Ente", "lang": "de"}, {"text": "\u2013 the duck. <break time=\"2s\"/> Die Ente Rum\u00e4nisch \u2013 Romanian. <break time=\"2s\"/> Rum\u00e4nisch. Ich bin Rum\u00e4ne. Schneiden \u2013 to chop. <break time=\"2s\"/> Schneiden. Er schnitt die Zwiebeln. Froh \u2013 glad. <break time=\"2s\"/> Froh. Ich bin froh. Layer 2 \u2013 Story phrases \"Ich brauche etwas Luft.\" \u2013 I need some air. <break time=\"2s\"/> Ich brauche etwas Luft. \"Das ist ein R\u00fcckschritt.\" \u2013 That's a regression. <break time=\"2s\"/> Das ist ein R\u00fcckschritt. \"Du wirst Fehler machen.\" \u2013 You will make mistakes. <break time=\"2s\"/> Du wirst Fehler machen. \"Dann l\u00e4sst du ihn gehen.\" \u2013 Then you let him go. <break time=\"2s\"/> Dann l\u00e4sst du ihn gehen. \"Ich bin die halbe Stadt gelaufen.\" \u2013 I walked halfway across the city. <break time=\"2s\"/> Ich bin die halbe Stadt gelaufen. \"Ich verschlie\u00dfe mich.\" \u2013 I shut down. <break time=\"2s\"/> Ich verschlie\u00dfe mich. \"Ich frage mich, was du noch versteckst.\" \u2013 I wonder what else you are hiding. <break time=\"2s\"/> Ich frage mich, was du noch versteckst. \"Du hast dich beim Boden entschuldigt.\" \u2013 You apologised to the floor. <break time=\"2s\"/> Du hast dich beim Boden entschuldigt. \"Ich werde es versuchen.\" \u2013 I will try. <break time=\"2s\"/> Ich werde es versuchen. \"Ich bin froh, dass du gekommen bist.\" \u2013 I am glad you came. <break time=\"2s\"/>", "lang": "en"}, {"text": "Ich bin froh, dass du gekommen bist.", "lang": "de"}, {"text": "End of Chapter 7. --Chapter 8 \u2013 The Text (A2) (Narrator voice, calm, clear. Ambient: soft rain against window, low continuous, occasional distant thunder.) Things were good for exactly four days. That is not a complaint. Four days of waking up next to Matei, of his arm around my waist, of coffee that he made and left on the table with a note that said things like Do not burn the milk and You have flour in your hair. Four days of coming home to someone who was actually happy to see me. Four days of not running. Then Lukas texted. Now say \u201cthe text message\u201d", "lang": "en"}, {"text": "die SMS or die Nachricht", "lang": "de"}], [{"text": "Die Nachricht. Feminine. Er hat mir eine Nachricht geschickt", "lang": "de"}, {"text": "\u2013 he sent me a message. Now say \u201cto text\u201d", "lang": "en"}, {"text": "texten or eine Nachricht schicken", "lang": "de"}], [{"text": "Texten. Lukas hat mir getextet \u2013 Lukas texted me. --Hey Yves. Matei is being a dick at work today. You should come by the bookstore and witness it. I will buy you a coffee. I read the message three times. It was friendly. Casual. The kind of thing you would send to a friend's roommate. Nothing weird about it. But I did not tell Matei. Now say \u201cto read\u201d", "lang": "en"}, {"text": "lesen", "lang": "de"}], [{"text": "Lesen. Ich lese die Nachricht \u2013 I read the message. Lesen is stem-changing. Ich lese, du liest, er liest. Repeat: du liest. Now say \u201cto tell\u201d", "lang": "en"}, {"text": "erz\u00e4hlen or sagen", "lang": "de"}], [{"text": "Sagen. Ich habe es ihm nicht gesagt", "lang": "de"}, {"text": "\u2013 I did not tell him --That is the thing about trust. It is fragile. And I had spent my whole life learning to keep things to myself. Not because I was dishonest. Because I was scared. Scared that if I showed someone everything, they would use it against me. Or worse \u2013 they would get bored and leave. Now say \u201ctrust\u201d", "lang": "en"}, {"text": "das Vertrauen", "lang": "de"}], [{"text": "Das Vertrauen. Neuter. Vertrauen ist zerbrechlich", "lang": "de"}, {"text": "\u2013 trust is fragile Now say \u201cdishonest\u201d", "lang": "en"}, {"text": "unehrlich", "lang": "de"}], [{"text": "Unehrlich. Ich bin nicht unehrlich \u2013 I am not dishonest. --The next day, Lukas texted again. Seriously, Yves. He just yelled at a customer for pronouncing \u201cGoethe\u201d wrong. It was beautiful. I laughed. I could not help it. The image of Matei losing his cool over a mispronounced dead poet was too good. What did the customer do? I wrote back. Left. But not before calling Matei a \u201cpedantisches Arschloch.\u201d Which is fair, honestly. Now say \u201cto yell\u201d", "lang": "en"}, {"text": "schreien", "lang": "de"}], [{"text": "Schreien. Er hat einen Kunden angeschrien \u2013 he yelled at a customer. Now say \u201cthe poet\u201d", "lang": "en"}, {"text": "der Dichter", "lang": "de"}], [{"text": "Der Dichter. Masculine. Ein toter Dichter", "lang": "de"}, {"text": "\u2013 a dead poet --What does that mean? I wrote. Pedantic asshole. I laughed again. Matei, who remembered everything, who corrected my German gently, who had never once made me feel stupid \u2013 was apparently a terror at work. I will come by after my shift, I wrote. Bring pastries, Lukas replied. Frau Schmidt's apricot ones. Matei will not admit it but he is obsessed. Now say \u201cpedantic\u201d", "lang": "en"}, {"text": "pedantisch", "lang": "de"}], [{"text": "Pedantisch. Ein pedantischer Arschloch \u2013 a pedantic asshole. Now say \u201cto admit\u201d zugeben (separable). Review", "lang": "en"}], [{"text": "Zugeben. Er gibt es nicht zu \u2013 he does not admit it. --I did not bring pastries. I brought two croissants and a guilty conscience. (ambient: soft bell chime, bookstore background murmur) Lukas was behind the counter. He saw me and waved. \u201cYves! You came.\u201d \u201cYou said you would buy me coffee.\u201d Now say \u201cthe croissant\u201d", "lang": "en"}, {"text": "das Croissant", "lang": "de"}], [{"text": "Das Croissant. Neuter. Zwei Croissants", "lang": "de"}, {"text": "\u2013 two croissants Now say \u201cthe conscience\u201d", "lang": "en"}, {"text": "das Gewissen", "lang": "de"}], [{"text": "Das Gewissen. Neuter. Ein schlechtes Gewissen", "lang": "de"}, {"text": "\u2013 a guilty conscience --He poured two cups from a pot behind the counter. Handed me one. \u201cHow is the caf\u00e9?\u201d \u201cGood. Frau Schmidt says I am improving.\u201d \u201cShe texted Matei that you dropped a cup last week.\u201d \u201cShe texts him everything.\u201d \u201cShe is in love with him. We all are.\u201d He leaned on the counter. His smile was easy. \u201cSo. You and Matei.\u201d Now say \u201cto improve\u201d", "lang": "en"}, {"text": "sich verbessern", "lang": "de"}], [{"text": "Sich verbessern. Ich verbessere mich \u2013 I am improving. Now say \u201cin love\u201d", "lang": "en"}, {"text": "verliebt. In jemanden verliebt sein \u2013 to be in love with", "lang": "de"}, {"text": "someone. --I took a sip of coffee. It was terrible. Worse than Frau Schmidt's. \u201cWhat about us?\u201d \u201cAre you together or not? He will not say. You will not say. It is like watching two cats circle each other.\u201d I did not know how to answer. Boyfriend felt too small. Something else \u2013 I did not have a word for it. \u201cWe are figuring it out,\u201d I said. Now say \u201cthe cat\u201d", "lang": "en"}, {"text": "die Katze", "lang": "de"}], [{"text": "Die Katze. Feminine. Zwei Katzen", "lang": "de"}, {"text": "\u2013 two cats Now say \u201cto circle\u201d", "lang": "en"}, {"text": "kreisen", "lang": "de"}], [{"text": "Kreisen. Sie kreisen umeinander \u2013 they circle each other. --Lukas nodded. \u201cThat is what he said.\u201d He paused. \u201cHe is different with you, you know. Softer. It is weird.\u201d \u201cWeird bad or weird good?\u201d \u201cWeird good.\u201d He smiled again. \u201cHe deserves someone who does not run away.\u201d The words hit me like a slap. Not because Lukas meant them badly \u2013 he did not. But because run away was exactly what I had done my whole life. And Matei knew it. And he had stayed anyway. Now say \u201csoft\u201d", "lang": "en"}, {"text": "weich. Weicher \u2013 softer", "lang": "de"}], [{"text": "Weicher. Er ist weicher mit dir \u2013 he is softer with you. Now say \u201cto deserve\u201d", "lang": "en"}, {"text": "verdienen", "lang": "de"}], [{"text": "Verdienen. Er verdient jemanden, der nicht wegl\u00e4uft \u2013 he deserves someone who does not run away. --\u201cWhere is he?\u201d I asked. \u201cBack room. Helping with the reading. He will be out in an hour.\u201d I nodded. Drank the terrible coffee. Made small talk about nothing. Then I left without saying goodbye to Matei. Now say \u201cthe back room\u201d", "lang": "en"}, {"text": "der Hinterraum", "lang": "de"}], [{"text": "Der Hinterraum. Masculine. Im Hinterraum", "lang": "de"}, {"text": "\u2013 in the back room Now say \u201csmall talk\u201d", "lang": "en"}, {"text": "das Smalltalk or die Plauderei", "lang": "de"}], [{"text": "Das Smalltalk. Neuter. Wir machten Smalltalk", "lang": "de"}, {"text": "\u2013 we made small talk --That night, he came home late again. I was on the sofa, pretending to read. The book was the same one from last week. I was still on the same page. \u201cLukas said you stopped by,\u201d Matei said, hanging his coat. \u201cI was in the neighbourhood.\u201d \u201cYou work across town.\u201d \u201cI had errands.\u201d He walked to the kitchen. Poured himself a glass of water. Now say \u201cthe neighbourhood\u201d", "lang": "en"}, {"text": "die Nachbarschaft", "lang": "de"}], [{"text": "Die Nachbarschaft. Feminine. In der Nachbarschaft", "lang": "de"}, {"text": "\u2013 in the neighbourhood Now say \u201cthe errand\u201d", "lang": "en"}, {"text": "die Besorgung", "lang": "de"}], [{"text": "Die Besorgung. Feminine. Besorgungen machen", "lang": "de"}, {"text": "\u2013 to run errands --- \u201cYves.\u201d \u201cWhat?\u201d \u201cWhy did you not come say hi?\u201d I put the book down. \u201cYou were busy.\u201d \u201cI was in the back room. It is not a fortress.\u201d \u201cI did not want to interrupt.\u201d He turned. His face was tired. \u201cYou are never an interruption.\u201d Now say \u201cthe fortress\u201d", "lang": "en"}, {"text": "die Festung", "lang": "de"}], [{"text": "Die Festung. Feminine. Es ist keine Festung", "lang": "de"}, {"text": "\u2013 it is not a fortress Now say \u201cto interrupt\u201d", "lang": "en"}, {"text": "unterbrechen", "lang": "de"}], [{"text": "Unterbrechen. Ich wollte nicht unterbrechen \u2013 I did not want to interrupt. --I wanted to believe him. But I had heard those words before. From my grandmother. From friends. From people who said you are never a burden and then stopped calling. \u201cLukas is nice,\u201d I said, changing the subject. \u201cLukas is a pain in the ass.\u201d \u201cHe said you yelled at a customer.\u201d \u201cThe customer deserved it.\u201d \u201cFor mispronouncing Goethe?\u201d Now say \u201ca pain in the ass\u201d", "lang": "en"}, {"text": "eine Nervens\u00e4ge (literally a nerve saw)", "lang": "de"}], [{"text": "Eine Nervens\u00e4ge. Feminine. Lukas ist eine Nervens\u00e4ge \u2013 Lukas is a pain in the ass Now say \u201cto mispronounce\u201d falsch aussprechen (separable)", "lang": "en"}], [{"text": "Falsch aussprechen. Er hat Goethe falsch ausgesprochen \u2013 he mispronounced Goethe. --Matei's jaw tightened. \u201cHe said Go-eth. Like the word \u2018go\u2019 and then \u2018eth.\u2019 It was offensive.\u201d I laughed. \u201cYou are ridiculous.\u201d \u201cI am principled.\u201d \u201cSame thing.\u201d He almost smiled. Almost. Then he looked at me \u2013 really looked \u2013 and the almost disappeared. \u201cWhy did you really come to the bookstore, Yves?\u201d \u201cI told you. Errands.\u201d \u201cYou are lying.\u201d Now say \u201cridiculous\u201d", "lang": "en"}, {"text": "l\u00e4cherlich", "lang": "de"}], [{"text": "L\u00e4cherlich. Du bist l\u00e4cherlich \u2013 you are ridiculous. Now say \u201cprincipled\u201d", "lang": "en"}, {"text": "prinzipientreu", "lang": "de"}], [{"text": "Prinzipientreu. Ich bin prinzipientreu \u2013 I am principled. --\u201cI am not.\u201d He walked to the sofa. Sat on the other end. \u201cLukas texted you, did he not?\u201d I did not answer. \u201cI saw him typing on his phone. He had that look. The one he gets when he is meddling.\u201d \u201cHe is not meddling. He is being friendly.\u201d \u201cLukas is never just friendly.\u201d Matei's voice was flat. \u201cHe flirts with everyone. Including people who are taken.\u201d Now say \u201cto meddle\u201d", "lang": "en"}, {"text": "sich einmischen", "lang": "de"}], [{"text": "Sich
