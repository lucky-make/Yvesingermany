o the right thing,” she said. “How do you know?” “Because he is not the same person who got left. And neither are you.”"}, {"type": "practice", "prompt": "Now say “sharp” – scharf.", "answer": "Scharf. Ihre scharfen Augen – her sharp eyes.", "slow": "Scharf. Ihre scharfen Augen – her sharp eyes.", "grammar": "Ihre scharfen Augen – her sharp eyes."}, {"type": "practice", "prompt": "Now say “left” – verlassen (past participle). Der, der verlassen wurde – the one", "answer": "who got left.", "slow": "who got left.", "grammar": "Repeat aloud: who got left."}, {"type": "narration", "text": "--That night, Matei came home late. He did not say anything. He just walked to the sofa, sat down, and stared at the wall. I sat next to him. Did not touch him."}, {"type": "dialogue", "text": "“He wants to meet,” Matei said."}, {"type": "dialogue", "text": "“Where?”"}, {"type": "dialogue", "text": "“A café. Not yours. Somewhere neutral.”"}, {"type": "dialogue", "text": "“Are you going to go?”"}, {"type": "narration", "text": "He was quiet for a long time."}, {"type": "dialogue", "text": "“I do not know what he wants.”"}, {"type": "practice", "prompt": "Now say “neutral” – neutral.", "answer": "Neutral. Ein neutraler Ort – a neutral place.", "slow": "Neutral. Ein neutraler Ort – a neutral place.", "grammar": "Ein neutraler Ort – a neutral place."}, {"type": "practice", "prompt": "Now say “to meet” – treffen. Er will sich treffen – he wants to meet.", "answer": "--“Closure, maybe. An apology. A chance to explain.”.", "slow": "--“Closure, maybe. An apology. A chance to explain.”.", "grammar": "An apology. A chance to explain.” “He left a note. That was his explanation.” Matei's voice was flat. “I cannot do this anymore. Seven words. After two years.” “That is not an explanation.” “No. It is not.” I put my hand on his knee. He did not pull away. “You do not have to see him,” I said. “I know.” “But you want to.” He turned to look at me. His grey eyes were tired. “I want to know why,” he said. “Why he left. Why he did not say goodbye. Why he waited until I was at work to pack his things.”"}, {"type": "practice", "prompt": "Now say “closure” – der Abschluss.", "answer": "Der Abschluss. Masculine. Abschluss finden – to find closure.", "slow": "Der Abschluss. Masculine. Abschluss finden – to find closure.", "grammar": "Masculine. Abschluss finden – to find closure."}, {"type": "practice", "prompt": "Now say “to explain” – erklären. Eine Chance zu erklären – a chance to explain.", "answer": "--“Those are fair questions.”.", "slow": "--“Those are fair questions.”.", "grammar": "” “They are pathetic questions. It has been years. I should not care anymore.” “But you do.” “But I do.” He put his hand on top of mine. “I am sorry.” “For what?” “For bringing this into your life. For making you deal with my past.” “You did not make me do anything. I chose to be here.” “You chose to stay.” “Same thing.” He almost smiled."}, {"type": "practice", "prompt": "Now say “fair” – fair.", "answer": "Fair. Faire Fragen – fair questions.", "slow": "Fair. Faire Fragen – fair questions.", "grammar": "Faire Fragen – fair questions."}, {"type": "practice", "prompt": "Now say “pathetic” – erbärmlich.", "answer": "Erbärmlich. Erbärmliche Fragen – pathetic questions.", "slow": "Erbärmlich. Erbärmliche Fragen – pathetic questions.", "grammar": "Erbärmliche Fragen – pathetic questions."}, {"type": "dialogue", "text": "--“I am going to see him,” he said. “Tomorrow. After work.”"}, {"type": "dialogue", "text": "“Do you want me to come?”"}, {"type": "dialogue", "text": "“No.”"}, {"type": "dialogue", "text": "“Are you sure?”"}, {"type": "narration", "text": "He kissed my forehead. “I am sure. This is something I have to do alone.” I wanted to argue. But Frau Schmidt was right. This was not my fight."}, {"type": "dialogue", "text": "“Okay,” I said."}, {"type": "dialogue", "text": "“Okay?”"}, {"type": "dialogue", "text": "“Okay. But text me when it is over.”"}, {"type": "dialogue", "text": "“I will.”"}, {"type": "dialogue", "text": "“And if he tries anything, call me. I will come. I will bring Frau Schmidt.”"}, {"type": "narration", "text": "He laughed. A real laugh. It was small, but it was real."}, {"type": "dialogue", "text": "“Deal,” he said."}, {"type": "practice", "prompt": "Now say “the deal” – die Abmachung or der Deal.", "answer": "Der Deal. Masculine. Abgemacht – deal.", "slow": "Der Deal. Masculine. Abgemacht – deal.", "grammar": "Masculine. Abgemacht – deal."}, {"type": "practice", "prompt": "Now say “to try anything” – etwas versuchen.", "answer": "Etwas versuchen. Wenn er etwas versucht – if he tries anything.", "slow": "Etwas versuchen. Wenn er etwas versucht – if he tries anything.", "grammar": "Wenn er etwas versucht – if he tries anything."}, {"type": "narration", "text": "--We sat on the sofa. The lamp buzzed. The radiator clicked."}, {"type": "dialogue", "text": "“Matei.”"}, {"type": "dialogue", "text": "“What?”"}, {"type": "dialogue", "text": "“I love you.”"}, {"type": "narration", "text": "The words came out before I could stop them. I had never said them before. Not to him. Not to anyone. He turned to look at me. His grey eyes were wide."}, {"type": "dialogue", "text": "“Yves.”"}, {"type": "dialogue", "text": "“You do not have to say it back. I just needed you to know.”"}, {"type": "narration", "text": "He was quiet for a long moment. Then he put his hand on my face. His thumb traced my cheekbone."}, {"type": "dialogue", "text": "“I love you too,” he said. “I have loved you since the first message. Two years"}, {"type": "narration", "text": "ago. I just did not know how to say it.”"}, {"type": "dialogue", "text": "“That is a long time to wait.”"}, {"type": "dialogue", "text": "“You were worth waiting for.”"}, {"type": "practice", "prompt": "Now say “to wait” – warten.", "answer": "Warten. Eine lange Zeit zu warten – a long time to wait.", "slow": "Warten. Eine lange Zeit zu warten – a long time to wait.", "grammar": "Eine lange Zeit zu warten – a long time to wait."}, {"type": "practice", "prompt": "Now say “worth” – wert. Du warst das Warten wert – you were worth waiting for.", "answer": "--He kissed me. Soft. Slow.", "slow": "--He kissed me. Soft. Slow.", "grammar": "Soft. Slow. When he pulled back, his eyes were wet. “Do not run,” he said. “I am not going anywhere.” “Promise?” I thought about it. About all the times I had run. About all the people I had left behind. “I promise,” I said. He held me. I held him. The lamp flickered. The street went quiet. Tomorrow, he would see Sebastian. Tomorrow, he would get answers."}, {"type": "narration", "text": "But tonight, he was here. And I was here."}, {"type": "practice", "prompt": "Now say “to hold” – halten.", "answer": "Halten. Er hielt mich – he held me.", "slow": "Halten. Er hielt mich – he held me.", "grammar": "Er hielt mich – he held me."}, {"type": "practice", "prompt": "Now say “the answer” – die Antwort.", "answer": "Die Antwort. Feminine. Antworten bekommen – to get answers.", "slow": "Die Antwort. Feminine. Antworten bekommen – to get answers.", "grammar": "Feminine. Antworten bekommen – to get answers."}], "bg": "café", "location": "Morgenlicht — Confrontation"}, {"id": 16, "title": "The Meeting", "level": "B1-B2", "segments": [{"type": "narration", "text": "against window, the hum of a refrigerator.) I could not focus at the café. I burned two lattes. Dropped a cup. Forgot to order pastries from the bakery. Frau Schmidt watched me from her table, her good hand wrapped around her tea, her sharp eyes missing nothing."}, {"type": "dialogue", "text": "“You are worse than yesterday,” she said."}, {"type": "dialogue", "text": "“I am fine.”"}, {"type": "dialogue", "text": "“You are burning milk. That is not fine.”"}, {"type": "narration", "text": "I dumped the third burnt latte down the sink. Started over. Watched the thermometer like my life depended on it."}, {"type": "dialogue", "text": "“Matei is meeting Sebastian today,” I said."}, {"type": "dialogue", "text": "“Ah.” She nodded. “That explains it.”"}, {"type": "practice", "prompt": "Now say “to dump” – wegschütten.", "answer": "Wegschütten. Ich schüttete den dritten verbrannten Latte weg – I dumped the third.", "slow": "Wegschütten. Ich schüttete den dritten verbrannten Latte weg – I dumped the third.", "grammar": "Ich schüttete den dritten verbrannten Latte weg – I dumped the third burnt latte."}, {"type": "practice", "prompt": "Now say “to explain” – erklären. Das erklärt es – that explains it.", "answer": "--“What if it goes badly?” I asked.", "slow": "--“What if it goes badly?” I asked.", "grammar": "“Then it goes badly. And you help him pick up the pieces.” “What if he decides he wants Sebastian back?” Frau Schmidt set her cup down. Looked at me. “Do you really believe that?” I did not answer. Because the truth was, I did not know what I believed. I trusted Matei. I did. But trust was new to me. Fragile. Like a cup I had already dropped twice."}, {"type": "practice", "prompt": "Now say “the piece” – das Stück.", "answer": "Das Stück. Neuter. Die Stücke aufheben – to pick up the pieces.", "slow": "Das Stück. Neuter. Die Stücke aufheben – to pick up the pieces.", "grammar": "Neuter. Die Stücke aufheben – to pick up the pieces."}, {"type": "practice", "prompt": "Now say “fragile” – zerbrechlich. Review.", "answer": "Zerbrechlich. Vertrauen ist zerbrechlich – trust is fragile.", "slow": "Zerbrechlich. Vertrauen ist zerbrechlich – trust is fragile.", "grammar": "Vertrauen ist zerbrechlich – trust is fragile."}, {"type": "dialogue", "text": "--“Yves.” Frau Schmidt's voice was gentle. “That man gave you a key. He gave you a"}, {"type": "narration", "text": "job. He gave you his bed. He is not going to throw that away for someone who left him with a seven-word note.”"}, {"type": "dialogue", "text": "“People do stupid things for people who hurt them.”"}, {"type": "dialogue", "text": "“Some people. Not Matei.” She patted the table. “Now make me a cappuccino. A good"}, {"type": "narration", "text": "one. No burnt milk.” I made her a cappuccino. It was perfect. She did not say thank you. She did not have to."}, {"type": "practice", "prompt": "Now say “gentle” – sanft.", "answer": "Sanft. Ihre Stimme war sanft – her voice was gentle.", "slow": "Sanft. Ihre Stimme war sanft – her voice was gentle.", "grammar": "Ihre Stimme war sanft – her voice was gentle."}, {"type": "practice", "prompt": "Now say “to throw away” – wegwerfen (separable).", "answer": "Wegwerfen. Er wird das nicht wegwerfen – he will not throw that away.", "slow": "Wegwerfen. Er wird das nicht wegwerfen – he will not throw that away.", "grammar": "Er wird das nicht wegwerfen – he will not throw that away."}, {"type": "narration", "text": "--Matei texted me at 4 PM. It is done. Coming home. I closed the café early. Frau Schmidt shooed me out the door with a bag of pastries. I walked home fast. The duck was at the bridge. I did not stop. The apartment was dark when I got there. Matei was sitting on the sofa. His coat was still on. His hands were in his lap. I sat next to him. Did not touch him."}, {"type": "dialogue", "text": "“How was it?”"}, {"type": "practice", "prompt": "Now say “to shoo” – fortscheuchen. Review.", "answer": "Fortscheuchen. Frau Schmidt scheuchte mich weg – Frau Schmidt shooed me away.", "slow": "Fortscheuchen. Frau Schmidt scheuchte mich weg – Frau Schmidt shooed me away.", "grammar": "Frau Schmidt scheuchte mich weg – Frau Schmidt shooed me away."}, {"type": "practice", "prompt": "Now say “the lap” – der Schoß.", "answer": "Der Schoß. Masculine. Seine Hände auf dem Schoß – his hands in his lap.", "slow": "Der Schoß. Masculine. Seine Hände auf dem Schoß – his hands in his lap.", "grammar": "Masculine. Seine Hände auf dem Schoß – his hands in his lap."}, {"type": "narration", "text": "--He was quiet for a long time. Then he said, “He apologised.”"}, {"type": "dialogue", "text": "“For leaving?”"}, {"type": "dialogue", "text": "“For the note. For not saying goodbye. For taking the furniture.” Matei's voice"}, {"type": "narration", "text": "was flat. “He said he was scared. Scared of commitment. Scared of being stuck. Scared of waking up in ten years and realising he had settled.”"}, {"type": "dialogue", "text": "“Did you believe him?”"}, {"type": "dialogue", "text": "“I do not know.” He ran a hand through his hair. “He seemed honest. He always"}, {"type": "narration", "text": "seemed honest. That was the problem. He believed everything he said in the moment. He just could not believe it the next day.”"}, {"type": "practice", "prompt": "Now say “commitment” – die Verpflichtung.", "answer": "Die Verpflichtung. Feminine. Angst vor Verpflichtung – scared of commitment.", "slow": "Die Verpflichtung. Feminine. Angst vor Verpflichtung – scared of commitment.", "grammar": "Feminine. Angst vor Verpflichtung – scared of commitment."}, {"type": "practice", "prompt": "Now say “to settle” – sich niederlassen or sich zufriedengeben.", "answer": "Sich niederlassen. Sich niedergelassen haben – to have settled.", "slow": "Sich niederlassen. Sich niedergelassen haben – to have settled.", "grammar": "Sich niedergelassen haben – to have settled."}, {"type": "dialogue", "text": "--“Did he ask for you back?”"}, {"type": "narration", "text": "Matei turned to look at me. His grey eyes were tired."}, {"type": "dialogue", "text": "“He asked if there was a chance. I told him no.”"}, {"type": "narration", "text": "My chest loosened. I had not realised I had been holding my breath."}, {"type": "dialogue", "text": "“What did he say?”"}, {"type": "dialogue", "text": "“He said he understood. Then he asked if we could be friends.” Matei almost"}, {"type": "narration", "text": "smiled. “I told him I would think about it.”"}, {"type": "dialogue", "text": "“Are you going to?”"}, {"type": "dialogue", "text": "“I do not know. Maybe. In a year. In five years. Not now.”"}, {"type": "practice", "prompt": "Now say “the chance” – die Chance. Review.", "answer": "Die Chance. Ob es eine Chance gibt – if there is a chance.", "slow": "Die Chance. Ob es eine Chance gibt – if there is a chance.", "grammar": "Ob es eine Chance gibt – if there is a chance."}, {"type": "practice", "prompt": "Now say “to understand” – verstehen.", "answer": "Verstehen. Er sagte, er verstehe – he said he understood.", "slow": "Verstehen. Er sagte, er verstehe – he said he understood.", "grammar": "Er sagte, er verstehe – he said he understood."}, {"type": "narration", "text": "--I put my hand on his knee. He put his hand on top of mine."}, {"type": "dialogue", "text": "“I am sorry,” I said."}, {"type": "dialogue", "text": "“For what?”"}, {"type": "dialogue", "text": "“For making you do this alone.”"}, {"type": "dialogue", "text": "“You did not make me. I chose.”"}, {"type": "dialogue", "text": "“I know. But I wanted to be there. To hold your hand. To glare at him.”"}, {"type": "narration", "text": "Matei laughed. It was small, but it was real."}, {"type": "dialogue", "text": "“He is not worth your glares.”"}, {"type": "dialogue", "text": "“He is not worth you either.”"}, {"type": "narration", "text": "Matei leaned into me. His head rested on my shoulder."}, {"type": "dialogue", "text": "“I love you,” he said."}, {"type": "dialogue", "text": "“I love you too.”"}, {"type": "practice", "prompt": "Now say “to glare” – böse anstarren.", "answer": "Böse anstarren. Ihn böse anstarren – to glare at him.", "slow": "Böse anstarren. Ihn böse anstarren – to glare at him.", "grammar": "Ihn böse anstarren – to glare at him."}, {"type": "practice", "prompt": "Now say “the shoulder” – die Schulter.", "answer": "Die Schulter. Feminine. Sein Kopf ruhte auf meiner Schulter – his head rested on.", "slow": "Die Schulter. Feminine. Sein Kopf ruhte auf meiner Schulter – his head rested on.", "grammar": "Feminine. Sein Kopf ruhte auf meiner Schulter – his head rested on my shoulder."}, {"type": "narration", "text": "--We sat like that until the room went dark. Neither of us moved to turn on the lamp."}, {"type": "dialogue", "text": "“What did he look like?” I asked eventually."}, {"type": "dialogue", "text": "“Who?”"}, {"type": "dialogue", "text": "“Sebastian. After all these years.”"}, {"type": "narration", "text": "Matei was quiet for a moment. “Older. Softer. Less sure of himself.” He paused."}, {"type": "dialogue", "text": "“He looked like someone who had spent five years regretting a decision he could"}, {"type": "dialogue", "text": "“Do you feel sorry for him?”"}, {"type": "dialogue", "text": "“A little.” He turned his head to look at me. “But not enough to let him back in.”"}, {"type": "practice", "prompt": "Now say “to regret” – bereuen.", "answer": "Bereuen. Eine Entscheidung bereuen – to regret a decision.", "slow": "Bereuen. Eine Entscheidung bereuen – to regret a decision.", "grammar": "Eine Entscheidung bereuen – to regret a decision."}, {"type": "practice", "prompt": "Now say “to take back” – zurücknehmen (separable).", "answer": "Zurücknehmen. Eine Entscheidung, die er nicht zurücknehmen kann – a decision he.", "slow": "Zurücknehmen. Eine Entscheidung, die er nicht zurücknehmen kann – a decision he.", "grammar": "Eine Entscheidung, die er nicht zurücknehmen kann – a decision he cannot take back."}, {"type": "dialogue", "text": "--“You are not him,” I said."}, {"type": "dialogue", "text": "“I know.”"}, {"type": "dialogue", "text": "“You stayed.”"}, {"type": "dialogue", "text": "“I stayed.”"}, {"type": "narration", "text": "I kissed his forehead."}, {"type": "dialogue", "text": "“Good,” I said. “Because I am not going anywhere either.”"}, {"type": "practice", "prompt": "Now say “either” – auch (in negative sentences). Ich gehe auch nirgendwo hin – I", "answer": "am not going anywhere either.", "slow": "am not going anywhere either.", "grammar": "Repeat aloud: am not going anywhere either."}, {"type": "narration", "text": "Auch. Ich gehe auch nirgendwo hin – I am not going anywhere either."}], "bg": "apartment", "location": "Matei's Apartment — Waiting"}, {"id": 17, "title": "The Refusal", "level": "B1-B2", "segments": [{"type": "narration", "text": "traffic, the tick of a clock.) The phone rang at 7 AM. I was still in bed. Matei was already up – I could hear him in the kitchen, the familiar sounds of the French press, the click of the stove. The apartment smelled like coffee. It was supposed to be a good morning. Then I saw the number. Nigerian country code. My grandmother's landline. The same number that had never once called me to ask how I was doing, only to tell me what I was doing wrong. I let it ring. Voicemail picked up. She did not leave a message. The phone rang again thirty seconds later. I answered."}, {"type": "practice", "prompt": "Now say “the landline” – der Festnetzanschluss.", "answer": "Der Festnetzanschluss. Masculine. Die Festnetznummer meiner Großmutter – my.", "slow": "Der Festnetzanschluss. Masculine. Die Festnetznummer meiner Großmutter – my.", "grammar": "Masculine. Die Festnetznummer meiner Großmutter – my grandmother's landline."}, {"type": "practice", "prompt": "Now say “the voicemail” – die Mailbox.", "answer": "Die Mailbox. Feminine. Die Mailbox schaltete sich ein – voicemail picked up.", "slow": "Die Mailbox. Feminine. Die Mailbox schaltete sich ein – voicemail picked up.", "grammar": "Feminine. Die Mailbox schaltete sich ein – voicemail picked up."}, {"type": "dialogue", "text": "--“Hello?”"}, {"type": "dialogue", "text": "“Lucky.” Her voice was dry. Old. The same voice that had scolded me for staying"}, {"type": "narration", "text": "out late, for not eating enough, for being too quiet. “You are alive.”"}, {"type": "dialogue", "text": "“I am alive.”"}, {"type": "dialogue", "text": "“Good. I was not sure. You do not call.”"}, {"type": "dialogue", "text": "“I have been busy.”"}, {"type": "dialogue", "text": "“Busy doing what? Drinking coffee? Running around with that Romanian boy?”"}, {"type": "narration", "text": "My blood went cold. I sat up in bed."}, {"type": "practice", "prompt": "Now say “to scold” – schelten.", "answer": "Schelten. Sie schalt mich – she scolded me.", "slow": "Schelten. Sie schalt mich – she scolded me.", "grammar": "Sie schalt mich – she scolded me."}, {"type": "practice", "prompt": "Now say “the blood” – das Blut.", "answer": "Das Blut. Neuter. Mein Blut gefror – my blood froze.", "slow": "Das Blut. Neuter. Mein Blut gefror – my blood froze.", "grammar": "Neuter. Mein Blut gefror – my blood froze."}, {"type": "dialogue", "text": "“How do you know about Matei?”"}, {"type": "dialogue", "text": "“Ada calls me every week. To check on me. Because her mother raised her right.” A"}, {"type": "narration", "text": "pause. “She told me you have a boyfriend now. A man.”"}, {"type": "dialogue", "text": "“Yes.”"}, {"type": "dialogue", "text": "“You always were different. I knew it. Before you did.”"}, {"type": "narration", "text": "I waited. There was always more."}, {"type": "dialogue", "text": "“I am old, Lucky. I might die soon.” Her voice cracked. “I want you to come home."}, {"type": "narration", "text": "Before it is too late.”"}, {"type": "practice", "prompt": "Now say “to raise” – erziehen.", "answer": "Erziehen. Weil ihre Mutter sie richtig erzogen hat – because her mother raised her.", "slow": "Erziehen. Weil ihre Mutter sie richtig erzogen hat – because her mother raised her.", "grammar": "Weil ihre Mutter sie richtig erzogen hat – because her mother raised her right."}, {"type": "practice", "prompt": "Now say “to crack” – brechen or überschnappen. Ihre Stimme brach – her voice", "answer": "cracked.", "slow": "cracked.", "grammar": "Repeat aloud: cracked."}, {"type": "narration", "text": "--I stared at the wall. The wallpaper was peeling in the corner."}, {"type": "dialogue", "text": "“Come home,” she repeated. “Just for a week. A few days.”"}, {"type": "dialogue", "text": "“No.”"}, {"type": "narration", "text": "The word came out before I could stop it. Flat. Final."}, {"type": "dialogue", "text": "“Lucky –”"}, {"type": "dialogue", "text": "“My name is Yves.”"}, {"type": "dialogue", "text": "“You will always be Lucky to me.”"}, {"type": "dialogue", "text": "“No. You do not get to decide that anymore.”"}, {"type": "practice", "prompt": "Now say “the wallpaper” – die Tapete.", "answer": "Die Tapete. Feminine. Die Tapete blätterte ab – the wallpaper was peeling.", "slow": "Die Tapete. Feminine. Die Tapete blätterte ab – the wallpaper was peeling.", "grammar": "Feminine. Die Tapete blätterte ab – the wallpaper was peeling."}, {"type": "practice", "prompt": "Now say “final” – endgültig.", "answer": "Endgültig. Endgültig – final.", "slow": "Endgültig. Endgültig – final.", "grammar": "Endgültig – final."}, {"type": "narration", "text": "--She was quiet for a moment. I could hear her breathing. Shallow. Ragged."}, {"type": "dialogue", "text": "“I raised you,” she said finally. “I took you in when your mother ran off. I fed"}, {"type": "narration", "text": "you. I clothed you. I kept you out of trouble.”"}, {"type": "dialogue", "text": "“You kept me in a cage.”"}, {"type": "dialogue", "text": "“A cage?”"}, {"type": "dialogue", "text": "“You never asked me what I wanted. Not once. You decided who I was supposed to be,"}, {"type": "narration", "text": "and when I could not be that person, you made me feel like a failure.”"}, {"type": "practice", "prompt": "Now say “shallow” – flach.", "answer": "Flach. Flache Atmung – shallow breathing.", "slow": "Flach. Flache Atmung – shallow breathing.", "grammar": "Flache Atmung – shallow breathing."}, {"type": "practice", "prompt": "Now say “ragged” – unregelmässig or heiser.", "answer": "Heiser. Heiseres Atmen – ragged breathing.", "slow": "Heiser. Heiseres Atmen – ragged breathing.", "grammar": "Heiseres Atmen – ragged breathing."}, {"type": "dialogue", "text": "--“I was protecting you.”"}, {"type": "dialogue", "text": "“From what?”"}, {"type": "dialogue", "text": "“From yourself,” she said. “You were always too soft. Too sensitive. The world"}, {"type": "narration", "text": "would have eaten you alive.”"}, {"type": "dialogue", "text": "“The world did eat me alive. Just not the way you thought.”"}, {"type": "narration", "text": "I got out of bed. Walked to the window. The street below was waking up – a woman walking her dog, a man unlocking his bakery, a child in a bright yellow coat running to catch the bus."}, {"type": "practice", "prompt": "Now say “to protect” – beschützen.", "answer": "Beschützen. Ich habe dich beschützt – I was protecting you.", "slow": "Beschützen. Ich habe dich beschützt – I was protecting you.", "grammar": "Ich habe dich beschützt – I was protecting you."}, {"type": "practice", "prompt": "Now say “sensitive” – empfindlich.", "answer": "Empfindlich. Zu empfindlich – too sensitive.", "slow": "Empfindlich. Zu empfindlich – too sensitive.", "grammar": "Zu empfindlich – too sensitive."}, {"type": "dialogue", "text": "--“I am not coming back,” I said. “Not for a visit. Not for a funeral. Not ever.”"}, {"type": "dialogue", "text": "“Yves –”"}, {"type": "dialogue", "text": "“That country gave me nothing. You gave me nothing but obligation and guilt. I am"}, {"type": "dialogue", "text": "“You are breaking my heart.”"}, {"type": "dialogue", "text": "“You broke mine first. Every day. For years.”"}, {"type": "practice", "prompt": "Now say “the funeral” – die Beerdigung.", "answer": "Die Beerdigung. Feminine. Nicht für eine Beerdigung – not for a funeral.", "slow": "Die Beerdigung. Feminine. Nicht für eine Beerdigung – not for a funeral.", "grammar": "Feminine. Nicht für eine Beerdigung – not for a funeral."}, {"type": "practice", "prompt": "Now say “obligation” – die Verpflichtung. Review.", "answer": "Die Verpflichtung. Nichts als Verpflichtung und Schuld – nothing but obligation.", "slow": "Die Verpflichtung. Nichts als Verpflichtung und Schuld – nothing but obligation.", "grammar": "Nichts als Verpflichtung und Schuld – nothing but obligation and guilt."}, {"type": "narration", "text": "--Matei was standing in the doorway. His face was unreadable. He was holding two mugs of coffee. Black. No sugar. No milk."}, {"type": "dialogue", "text": "“That sounded hard,” he said."}, {"type": "dialogue", "text": "“It was.”"}, {"type": "narration", "text": "He walked to me. Handed me a mug. I took it. The warmth spread through my hands."}, {"type": "dialogue", "text": "“Do you want to talk about it?” he asked."}, {"type": "dialogue", "text": "“No.”"}, {"type": "dialogue", "text": "“Okay.”"}, {"type": "practice", "prompt": "Now say “unreadable” – undurchschaubar.", "answer": "Undurchschaubar. Sein Gesicht war undurchschaubar – his face was unreadable.", "slow": "Undurchschaubar. Sein Gesicht war undurchschaubar – his face was unreadable.", "grammar": "Sein Gesicht war undurchschaubar – his face was unreadable."}, {"type": "practice", "prompt": "Now say “the warmth” – die Wärme. Review.", "answer": "Die Wärme. Die Wärme breitete sich aus – the warmth spread.", "slow": "Die Wärme. Die Wärme breitete sich aus – the warmth spread.", "grammar": "Die Wärme breitete sich aus – the warmth spread."}, {"type": "narration", "text": "--We stood by the window. The radiator clicked. The coffee steamed."}, {"type": "dialogue", "text": "“She wanted me to come home,” I said."}, {"type": "dialogue", "text": "“I heard.”"}, {"type": "dialogue", "text": "“I told her no.”"}, {"type": "dialogue", "text": "“I heard that too.”"}, {"type": "dialogue", "text": "“She said I was breaking her heart.”"}, {"type": "narration", "text": "Matei was quiet for a moment. Then he said, “She broke yours first.”"}, {"type": "dialogue", "text": "“That is what I told her.”"}, {"type": "dialogue", "text": "“Good.”"}, {"type": "practice", "prompt": "Now say “to steam” – dampfen.", "answer": "Dampfen. Der Kaffee dampfte – the coffee steamed.", "slow": "Dampfen. Der Kaffee dampfte – the coffee steamed.", "grammar": "Der Kaffee dampfte – the coffee steamed."}, {"type": "practice", "prompt": "Now say “first” – zuerst. Sie hat deins zuerst gebrochen – she broke yours first.", "answer": "--We drank our coffee. The woman with the dog had disappeared. The bakery was open.", "slow": "--We drank our coffee. The woman with the dog had disappeared. The bakery was open.", "grammar": "The woman with the dog had disappeared. The bakery was open. “Yves.” “What?” “Are you okay?” I thought about it. About my grandmother's voice. About the years of silence. About the weight I had been carrying since I was a child. “I will be,” I said. “That is not what I asked.” “I know.” I turned to look at him. “I am not okay. But I am here. And I am not running. That is something.” He kissed my forehead. “It is everything.”"}, {"type": "practice", "prompt": "Now say “the weight” – das Gewicht.", "answer": "Das Gewicht. Neuter. Das Gewicht, das ich trug – the weight I carried.", "slow": "Das Gewicht. Neuter. Das Gewicht, das ich trug – the weight I carried.", "grammar": "Neuter. Das Gewicht, das ich trug – the weight I carried."}, {"type": "practice", "prompt": "Now say “everything” – alles.", "answer": "Alles. Das ist alles – that is everything.", "slow": "Alles. Das ist alles – that is everything.", "grammar": "Das ist alles – that is everything."}, {"type": "narration", "text": "--I went to work an hour late. Frau Schmidt was already behind the counter. Her good hand was working the espresso machine."}, {"type": "dialogue", "text": "“You are late,” she said."}, {"type": "dialogue", "text": "“I know.”"}, {"type": "dialogue", "text": "“Your eyes are red.”"}, {"type": "dialogue", "text": "“I have been crying.”"}, {"type": "dialogue", "text": "“Good. Crying is healthy.” She handed me an apron. “Now work.”"}, {"type": "practice", "prompt": "Now say “red” – rot.", "answer": "Rot. Deine Augen sind rot – your eyes are red.", "slow": "Rot. Deine Augen sind rot – your eyes are red.", "grammar": "Deine Augen sind rot – your eyes are red."}, {"type": "practice", "prompt": "Now say “healthy” – gesund.", "answer": "Gesund. Weinen ist gesund – crying is healthy.", "slow": "Gesund. Weinen ist gesund – crying is healthy.", "grammar": "Weinen ist gesund – crying is healthy."}, {"type": "narration", "text": "--I made a cappuccino for a woman at table three. Perfect foam. No burnt milk. She smiled. Frau Schmidt was watching me."}, {"type": "dialogue", "text": "“Your grandmother,” she said."}, {"type": "dialogue", "text": "“How did you know?”"}, {"type": "dialogue", "text": "“Matei texted me. He said you might need a distraction.”"}, {"type": "dialogue", "text": "“He texted you?”"}, {"type": "dialogue", "text": "“He texts me every morning. To check on me. He is a good boy.” She patted the"}, {"type": "narration", "text": "counter. “Sit. Take a break. Tell me what happened.”"}, {"type": "practice", "prompt": "Now say “the foam” – der Schaum.", "answer": "Der Schaum. Masculine. Perfekter Schaum – perfect foam.", "slow": "Der Schaum. Masculine. Perfekter Schaum – perfect foam.", "grammar": "Masculine. Perfekter Schaum – perfect foam."}, {"type": "practice", "prompt": "Now say “the distraction” – die Ablenkung.", "answer": "Die Ablenkung. Feminine. Eine Ablenkung – a distraction.", "slow": "Die Ablenkung. Feminine. Eine Ablenkung – a distraction.", "grammar": "Feminine. Eine Ablenkung – a distraction."}, {"type": "narration", "text": "--I sat. The chair was cold."}, {"type": "dialogue", "text": "“She wanted me to come home,” I said. “To Nigeria. She said she is dying.”"}, {"type": "dialogue", "text": "“Are you going?”"}, {"type": "dialogue", "text": "“No.”"}, {"type": "dialogue", "text": "“Why not?”"}, {"type": "narration", "text": "Because I had spent my whole life doing what other people wanted. Because going back would feel like losing. Because I was finally happy."}, {"type": "dialogue", "text": "“Because I am done,” I said. “Done with the guilt. Done with the obligation. Done"}, {"type": "narration", "text": "with being someone I am not.”"}, {"type": "practice", "prompt": "Now say “to die” – sterben.", "answer": "Sterben. Sie sagte, sie würde sterben – she said she was dying.", "slow": "Sterben. Sie sagte, sie würde sterben – she said she was dying.", "grammar": "Sie sagte, sie würde sterben – she said she was dying."}, {"type": "practice", "prompt": "Now say “guilt” – die Schuld.", "answer": "Die Schuld. Feminine. Schuldgefühle – guilt feelings.", "slow": "Die Schuld. Feminine. Schuldgefühle – guilt feelings.", "grammar": "Feminine. Schuldgefühle – guilt feelings."}, {"type": "narration", "text": "--Frau Schmidt nodded slowly."}, {"type": "dialogue", "text": "“Good,” she said. “It took me fifty years to learn that. You are faster than me.”"}, {"type": "dialogue", "text": "“I had good teachers.”"}, {"type": "narration", "text": "She smiled. A small smile. Tired but real."}, {"type": "dialogue", "text": "“Now clean the bathroom,” she said. “You forgot yesterday.”"}, {"type": "practice", "prompt": "Now say “fifty” – fünfzig.", "answer": "Fünfzig. Fünfzig Jahre – fifty years.", "slow": "Fünfzig. Fünfzig Jahre – fifty years.", "grammar": "Fünfzig Jahre – fifty years."}, {"type": "practice", "prompt": "Now say “faster” – schneller. Du bist schneller als ich – you are faster than me.", "answer": "--That night, I sat at the table with a piece of paper and nothing written on it.", "slow": "--That night, I sat at the table with a piece of paper and nothing written on it.", "grammar": "Matei found me there. “I want to write to her,” I said. “To explain. In German.” “That is a good idea.” “But I do not know how to start.” He sat on the plastic chair across from me. “Start with Sehr geehrte,” he said. “That means ‘Dear’ – but formal. Distant.”"}, {"type": "practice", "prompt": "Now say “the paper” – das Papier.", "answer": "Das Papier. Neuter. Ein Stück Papier – a piece of paper.", "slow": "Das Papier. Neuter. Ein Stück Papier – a piece of paper.", "grammar": "Neuter. Ein Stück Papier – a piece of paper."}, {"type": "practice", "prompt": "Now say “distant” – distanziert.", "answer": "Distanziert. Distanziert – distant.", "slow": "Distanziert. Distanziert – distant.", "grammar": "Distanziert – distant."}, {"type": "narration", "text": "--He helped me write the letter. Sehr geehrte Großmutter, I am alive. I am happy. I am engaged to a man named Matei. He is Romanian. He makes coffee and forgets to buy groceries and remembers everything I have ever told him. I am not coming back to Nigeria. Not for a visit. Not for a funeral. That chapter is closed. But I wanted you to know that I am okay. That the boy you raised found a place where he belongs. I do not need your blessing. I do not need your forgiveness. Goodbye, Yves"}, {"type": "practice", "prompt": "Now say “the blessing” – der Segen.", "answer": "Der Segen. Masculine. Deinen Segen – your blessing.", "slow": "Der Segen. Masculine. Deinen Segen – your blessing.", "grammar": "Masculine. Deinen Segen – your blessing."}, {"type": "practice", "prompt": "Now say “the forgiveness” – die Vergebung.", "answer": "Die Vergebung. Feminine. Deine Vergebung – your forgiveness.", "slow": "Die Vergebung. Feminine. Deine Vergebung – your forgiveness.", "grammar": "Feminine. Deine Vergebung – your forgiveness."}, {"type": "narration", "text": "--I folded the letter. Put it in an envelope. Wrote her address. I did not mail it that night. The next morning, I handed it to Matei."}, {"type": "dialogue", "text": "“Mail this for me,” I said."}, {"type": "dialogue", "text": "“Are you sure?”"}, {"type": "dialogue", "text": "“I am sure.”"}, {"type": "narration", "text": "He put the envelope in his coat pocket. Kissed my forehead."}, {"type": "dialogue", "text": "“Okay.”"}, {"type": "practice", "prompt": "Now say “to fold” – falten.", "answer": "Falten. Ich faltete den Brief – I folded the letter.", "slow": "Falten. Ich faltete den Brief – I folded the letter.", "grammar": "Ich faltete den Brief – I folded the letter."}, {"type": "practice", "prompt": "Now say “the envelope” – der Umschlag.", "answer": "Der Umschlag. Masculine. Ein Umschlag – an envelope.", "slow": "Der Umschlag. Masculine. Ein Umschlag – an envelope.", "grammar": "Masculine. Ein Umschlag – an envelope."}], "bg": "apartment", "location": "Matei's Apartment — The Call"}, {"id": 18, "title": "The Weight", "level": "B1-B2", "segments": [{"type": "narration", "text": "espresso machine, distant street sounds.) The days after the phone call were strange. Not bad. Just strange. Like the world had shifted slightly and I had not found my balance yet. I went to work. I made coffee. I dropped a cup – only one – and Frau Schmidt did not say anything. She just swept up the pieces and patted my arm. Matei watched me. I could feel his eyes on me at night, when we sat on the sofa, when we ate dinner, when we lay in bed. He did not ask if I was okay. He knew I was not. He just waited. Ada came by every morning. Same latte. Same table by the window. She did not mention my grandmother. She did not have to. The silence was enough. Then, on the fourth day, something happened."}, {"type": "practice", "prompt": "Now say “to shift” – sich verschieben.", "answer": "Sich verschieben. Die Welt hatte sich leicht verschoben – the world had shifted.", "slow": "Sich verschieben. Die Welt hatte sich leicht verschoben – the world had shifted.", "grammar": "Die Welt hatte sich leicht verschoben – the world had shifted slightly."}, {"type": "practice", "prompt": "Now say “the balance” – das Gleichgewicht.", "answer": "Das Gleichgewicht. Neuter. Mein Gleichgewicht – my balance.", "slow": "Das Gleichgewicht. Neuter. Mein Gleichgewicht – my balance.", "grammar": "Neuter. Mein Gleichgewicht – my balance."}, {"type": "narration", "text": "--I was wiping down the counter when the bell chimed. A woman walked in. She was younger than Frau Schmidt, older than me. Dark hair. A face that looked familiar in a way I could not place. She ordered a tea. Chamomile. In German. Her accent was different – not German, something else. Romanian, maybe."}, {"type": "dialogue", "text": "“You are Yves,” she said when I brought her tea."}, {"type": "dialogue", "text": "“How do you know my name?”"}, {"type": "dialogue", "text": "“Matei talks about you.” She smiled. It was a kind smile. Tired. “I am his sister."}, {"type": "narration", "text": "Andreea.” I stared at her. Matei had a sister. He had never mentioned her."}, {"type": "practice", "prompt": "Now say “chamomile” – die Kamille.", "answer": "Die Kamille. Feminine. Kamillentee – chamomile tea.", "slow": "Die Kamille. Feminine. Kamillentee – chamomile tea.", "grammar": "Feminine. Kamillentee – chamomile tea."}, {"type": "practice", "prompt": "Now say “the sister” – die Schwester.", "answer": "Die Schwester. Feminine. Seine Schwester – his sister.", "slow": "Die Schwester. Feminine. Seine Schwester – his sister.", "grammar": "Feminine. Seine Schwester – his sister."}, {"type": "dialogue", "text": "“He does not talk about family,” I said."}, {"type": "dialogue", "text": "“I know. That is why I am here.”"}, {"type": "narration", "text": "She sat at the table by the window. I sat across from her. Frau Schmidt was in the back, pretending not to listen."}, {"type": "dialogue", "text": "“Is he okay?” Andreea asked."}, {"type": "dialogue", "text": "“He is fine.”"}, {"type": "dialogue", "text": "“He is not fine. He never is. But he is good at pretending.”"}, {"type": "dialogue", "text": "“Why do you not ask him yourself?”"}, {"type": "dialogue", "text": "“Because he will not answer my calls. He has not answered anyone's calls since he"}, {"type": "narration", "text": "moved to Berlin.” She wrapped her hands around her tea. “I came to see him. To make sure he is alive.”"}, {"type": "practice", "prompt": "Now say “to pretend” – vortäuschen. Review.", "answer": "Vortäuschen. Er ist gut darin, vorzutäuschen – he is good at pretending.", "slow": "Vortäuschen. Er ist gut darin, vorzutäuschen – he is good at pretending.", "grammar": "Er ist gut darin, vorzutäuschen – he is good at pretending."}, {"type": "practice", "prompt": "Now say “alive” – lebendig. Review.", "answer": "Lebendig. Um sicherzugehen, dass er lebendig ist – to make sure he is alive.", "slow": "Lebendig. Um sicherzugehen, dass er lebendig ist – to make sure he is alive.", "grammar": "Um sicherzugehen, dass er lebendig ist – to make sure he is alive."}, {"type": "dialogue", "text": "--“He is alive,” I said."}, {"type": "dialogue", "text": "“I can see that. You are living with him.”"}, {"type": "dialogue", "text": "“Yes.”"}, {"type": "dialogue", "text": "“Are you together?”"}, {"type": "dialogue", "text": "“Yes.”"}, {"type": "narration", "text": "She nodded slowly. “Good. He needs someone.”"}, {"type": "dialogue", "text": "“Why will he not talk to you?”"}, {"type": "narration", "text": "She was quiet for a moment. Then she said, “Because I am the one who told him to leave. When Sebastian left. I said, ‘Come home. Forget Berlin. Start over.’ He never forgave me.”"}, {"type": "practice", "prompt": "Now say “to forgive” – vergeben.", "answer": "Vergeben. Er hat mir das nie vergeben – he never forgave me for that.", "slow": "Vergeben. Er hat mir das nie vergeben – he never forgave me for that.", "grammar": "Er hat mir das nie vergeben – he never forgave me for that."}, {"type": "practice", "prompt": "Now say “to start over” – neu anfangen.", "answer": "Neu anfangen. Fang neu an – start over.", "slow": "Neu anfangen. Fang neu an – start over.", "grammar": "Fang neu an – start over."}, {"type": "dialogue", "text": "--“That is not your fault,” I said."}, {"type": "dialogue", "text": "“I know. But he was hurt. And I was the one he could be angry at.” She took a sip"}, {"type": "narration", "text": "of tea. “I do not want to be angry anymore. I just want my brother back.” I looked at her. At the tired eyes, the way her hands shook a little when she held the cup. She was scared. The same way I had been scared, standing in the airport, holding a key from a man I did not know."}, {"type": "dialogue", "text": "“He works at the bookstore on Karl-Marx-Allee,” I said. “He is there until six.”"}, {"type": "dialogue", "text": "“Will he talk to me?”"}, {"type": "dialogue", "text": "“I do not know. But he will listen. That is something.”"}, {"type": "practice", "prompt": "Now say “the fault” – die Schuld.", "answer": "Die Schuld. Feminine. Das ist nicht deine Schuld – that is not your fault.", "slow": "Die Schuld. Feminine. Das ist nicht deine Schuld – that is not your fault.", "grammar": "Feminine. Das ist nicht deine Schuld – that is not your fault."}, {"type": "practice", "prompt": "Now say “to listen” – zuhören. Review.", "answer": "Zuhören. Aber er wird zuhören – but he will listen.", "slow": "Zuhören. Aber er wird zuhören – but he will listen.", "grammar": "Aber er wird zuhören – but he will listen."}, {"type": "narration", "text": "--- She finished her tea. Stood up."}, {"type": "dialogue", "text": "“Thank you, Yves.”"}, {"type": "dialogue", "text": "“Do not thank me. Just go.”"}, {"type": "narration", "text": "She left. The bell chimed. The door closed. Frau Schmidt came out from the back."}, {"type": "dialogue", "text": "“That was Matei's sister,” she said."}, {"type": "dialogue", "text": "“I know.”"}, {"type": "dialogue", "text": "“She has been trying to reach him for years.”"}, {"type": "dialogue", "text": "“I know.”"}, {"type": "dialogue", "text": "“He is stubborn.”"}, {"type": "dialogue", "text": "“I know.”"}, {"type": "narration", "text": "She patted my arm. “So are you. That is why you work.”"}, {"type": "practice", "prompt": "Now say “stubborn” – stur. Review.", "answer": "Stur. Er ist stur – he is stubborn.", "slow": "Stur. Er ist stur – he is stubborn.", "grammar": "Er ist stur – he is stubborn."}, {"type": "practice", "prompt": "Now say “to work” – funktionieren. Deshalb funktioniert ihr – that is why you work", "answer": "(as a couple).", "slow": "(as a couple).", "grammar": "Repeat aloud: (as a couple)."}, {"type": "narration", "text": "--I closed the café early. Walked to the bookstore. Matei was behind the counter, stacking shelves. He did not see me at first. His back was to the door."}, {"type": "dialogue", "text": "“Your sister came by the café,” I said."}, {"type": "dialogue", "text": "“What did she want?”"}, {"type": "dialogue", "text": "“To see you. To apologise. To make sure you are alive.”"}, {"type": "dialogue", "text": "“I am alive.”"}, {"type": "dialogue", "text": "“She knows. She saw you. Through me.”"}, {"type": "narration", "text": "He put the book down. Walked to the door. Locked it."}, {"type": "practice", "prompt": "Now say “to stack” – stapeln.", "answer": "Stapeln. Er stapelte Bücher – he was stacking books.", "slow": "Stapeln. Er stapelte Bücher – he was stacking books.", "grammar": "Er stapelte Bücher – he was stacking books."}, {"type": "practice", "prompt": "Now say “to freeze” – erstarren.", "answer": "Erstarren. Er erstarrte – he froze.", "slow": "Erstarren. Er erstarrte – he froze.", "grammar": "Er erstarrte – he froze."}, {"type": "dialogue", "text": "--“I do not want to see her,” he said."}, {"type": "dialogue", "text": "“Why not?”"}, {"type": "dialogue", "text": "“Because I am not ready.”"}, {"type": "dialogue", "text": "“When will you be ready?”"}, {"type": "dialogue", "text": "“Matei.” I walked to him. Put my hand on his arm. “She is your sister. She came"}, {"type": "narration", "text": "all the way from Romania. She is scared.”"}, {"type": "dialogue", "text": "“She should have thought about that before she told me to leave.”"}, {"type": "dialogue", "text": "“She was trying to protect you.”"}, {"type": "dialogue", "text": "“She was trying to control me.”"}, {"type": "practice", "prompt": "Now say “to control” – kontrollieren.", "answer": "Kontrollieren. Sie versuchte, mich zu kontrollieren – she was trying to control.", "slow": "Kontrollieren. Sie versuchte, mich zu kontrollieren – she was trying to control.", "grammar": "Sie versuchte, mich zu kontrollieren – she was trying to control me."}, {"type": "practice", "prompt": "Now say “all the way” – den ganzen Weg.", "answer": "Den ganzen Weg. Sie kam den ganzen Weg aus Rumänien – she came all the way from.", "slow": "Den ganzen Weg. Sie kam den ganzen Weg aus Rumänien – she came all the way from.", "grammar": "Sie kam den ganzen Weg aus Rumänien – she came all the way from Romania."}, {"type": "dialogue", "text": "--“Maybe. But she is here now. And she is not leaving until you talk to her.”"}, {"type": "narration", "text": "He pulled his arm away. Walked to the window."}, {"type": "dialogue", "text": "“I do not know how,” he said."}, {"type": "dialogue", "text": "“How to talk to her?”"}, {"type": "dialogue", "text": "“How to forgive her.”"}, {"type": "narration", "text": "I stood next to him. Did not touch him."}, {"type": "dialogue", "text": "“You do not have to forgive her today,” I said. “You just have to listen.”"}, {"type": "dialogue", "text": "“That is the same thing.”"}, {"type": "dialogue", "text": "“No. Listening is easy. Forgiveness takes time.”"}, {"type": "practice", "prompt": "Now say “to forgive” – vergeben. Review.", "answer": "Vergeben. Wie man ihr vergibt – how to forgive her.", "slow": "Vergeben. Wie man ihr vergibt – how to forgive her.", "grammar": "Wie man ihr vergibt – how to forgive her."}, {"type": "practice", "prompt": "Now say “easy” – einfach.", "answer": "Einfach. Zuhören ist einfach – listening is easy.", "slow": "Einfach. Zuhören ist einfach – listening is easy.", "grammar": "Zuhören ist einfach – listening is easy."}, {"type": "narration", "text": "--He was quiet for a long moment."}, {"type": "dialogue", "text": "“When did you get so wise?” he asked."}, {"type": "dialogue", "text": "“I have always been wise. You just were not listening.”"}, {"type": "dialogue", "text": "“Okay,” he said."}, {"type": "dialogue", "text": "“Okay?”"}, {"type": "dialogue", "text": "“Okay. I will see her. Tomorrow. Not today.”"}, {"type": "dialogue", "text": "“That is enough.”"}, {"type": "narration", "text": "He pulled me into his arms. I rested my head on his chest."}, {"type": "dialogue", "text": "“Thank you,” he said."}, {"type": "dialogue", "text": "“Do not thank me. Just listen to her.”"}, {"type": "practice", "prompt": "Now say “wise” – weise.", "answer": "Weise. Du bist weise – you are wise.", "slow": "Weise. Du bist weise – you are wise.", "grammar": "Du bist weise – you are wise."}, {"type": "practice", "prompt": "Now say “to rest” – ruhen. Mein Kopf ruhte auf seiner Brust – my head rested on", "answer": "his chest.", "slow": "his chest.", "grammar": "Repeat aloud: his chest."}, {"type": "narration", "text": "--The next day, Andreea came to the café at noon. Matei was waiting. He had taken the day off work. He was sitting at the table by the window. I made coffee. Black. Two cups. Set them on the table."}, {"type": "dialogue", "text": "“You do not have to stay,” Matei said."}, {"type": "dialogue", "text": "“I know.”"}, {"type": "dialogue", "text": "“But you are going to.”"}, {"type": "dialogue", "text": "“I am going to be in the back. Cleaning. Pretending not to listen.”"}, {"type": "dialogue", "text": "“That is the same as staying.”"}, {"type": "dialogue", "text": "“Same thing.”"}, {"type": "practice", "prompt": "Now say “the day off” – der freie Tag.", "answer": "Der freie Tag. Er hatte sich freigenommen – he had taken the day off.", "slow": "Der freie Tag. Er hatte sich freigenommen – he had taken the day off.", "grammar": "Er hatte sich freigenommen – he had taken the day off."}, {"type": "practice", "prompt": "Now say “to clean” – putzen or reinigen. Ich putze – I am cleaning.", "answer": "--I walked to the back. Frau Schmidt was already there, pretending to count cups.", "slow": "--I walked to the back. Frau Schmidt was already there, pretending to count cups.", "grammar": "Frau Schmidt was already there, pretending to count cups. “You are nosy,” I said. “I am curious. There is a difference.” The bell chimed. Andreea walked in. I watched through the crack in the door. She sat across from Matei. They did not touch. They did not speak for a long time. Then Andreea said something in Romanian. Matei answered. Her voice cracked. His did not."}, {"type": "practice", "prompt": "Now say “nosy” – neugierig.", "answer": "Neugierig. Du bist neugierig – you are nosy.", "slow": "Neugierig. Du bist neugierig – you are nosy.", "grammar": "Du bist neugierig – you are nosy."}, {"type": "practice", "prompt": "Now say “the crack” – der Spalt.", "answer": "Der Spalt. Masculine. Durch den Spalt in der Tür – through the crack in the door.", "slow": "Der Spalt. Masculine. Durch den Spalt in der Tür – through the crack in the door.", "grammar": "Masculine. Durch den Spalt in der Tür – through the crack in the door."}, {"type": "narration", "text": "--They talked for an hour. I cleaned the same counter three times. Frau Schmidt counted the same stack of cups twice. Neither of us said anything. When Andreea stood up, she hugged Matei. He did not hug back at first. Then his arms went around her. His face was hidden in her shoulder. She left. The bell chimed. The door closed. Matei sat back down. Stared at the table. I walked out of the back. Sat across from him."}, {"type": "practice", "prompt": "Now say “to hide” – verstecken. Sein Gesicht war in ihrer Schulter versteckt – his", "answer": "face was hidden in her shoulder.", "slow": "face was hidden in her shoulder.", "grammar": "Repeat aloud: face was hidden in her shoulder."}, {"type": "practice", "prompt": "Now say “the counter” – die Theke.", "answer": "Die Theke. Feminine. Ich putzte die Theke – I cleaned the counter.", "slow": "Die Theke. Feminine. Ich putzte die Theke – I cleaned the counter.", "grammar": "Feminine. Ich putzte die Theke – I cleaned the counter."}, {"type": "dialogue", "text": "--“How was it?” I asked."}, {"type": "dialogue", "text": "“Hard.”"}, {"type": "dialogue", "text": "“Did you forgive her?”"}, {"type": "dialogue", "text": "“Not yet. But I listened.”"}, {"type": "dialogue", "text": "“That is enough.”"}, {"type": "narration", "text": "He looked at me. His eyes were red."}, {"type": "dialogue", "text": "“She said she is proud of me.”"}, {"type": "dialogue", "text": "“She should be.”"}, {"type": "dialogue", "text": "“She said she is sorry. For telling me to leave. For not coming sooner.”"}, {"type": "dialogue", "text": "“She meant it.”"}, {"type": "dialogue", "text": "“I know.” He reached across the table. Took my hand. “I am tired.”"}, {"type": "dialogue", "text": "“Then go home. I will close the café.”"}, {"type": "practice", "prompt": "Now say “proud” – stolz.", "answer": "Stolz. Sie sagte, sie sei stolz auf mich – she said she was proud of me.", "slow": "Stolz. Sie sagte, sie sei stolz auf mich – she said she was proud of me.", "grammar": "Sie sagte, sie sei stolz auf mich – she said she was proud of me."}, {"type": "practice", "prompt": "Now say “to mean it” – es ernst meinen.", "answer": "Es ernst meinen. Sie meinte es ernst – she meant it.", "slow": "Es ernst meinen. Sie meinte es ernst – she meant it.", "grammar": "Sie meinte es ernst – she meant it."}, {"type": "dialogue", "text": "--“You have to clean the bathroom,” he said."}, {"type": "dialogue", "text": "“I will clean it tomorrow.”"}, {"type": "dialogue", "text": "“Frau Schmidt will notice.”"}, {"type": "dialogue", "text": "“Frau Schmidt is in the back pretending not to listen.”"}, {"type": "narration", "text": "He almost smiled. Almost."}, {"type": "dialogue", "text": "“Okay,” he said. “I will go home.”"}, {"type": "dialogue", "text": "“I will be there soon.”"}, {"type": "narration", "text": "He stood up. Kissed my forehead. Walked to the door."}, {"type": "dialogue", "text": "“Yves.”"}, {"type": "dialogue", "text": "“What?”"}, {"type": "dialogue", "text": "“Thank you.”"}, {"type": "dialogue", "text": "“Do not thank me. Just be there when I get home.”"}, {"type": "dialogue", "text": "“I will.”"}, {"type": "practice", "prompt": "Now say “to notice” – bemerken. Review.", "answer": "Bemerken. Frau Schmidt wird es bemerken – Frau Schmidt will notice.", "slow": "Bemerken. Frau Schmidt wird es bemerken – Frau Schmidt will notice.", "grammar": "Frau Schmidt wird es bemerken – Frau Schmidt will notice."}, {"type": "practice", "prompt": "Now say “soon” – bald.", "answer": "Bald. Ich werde bald da sein – I will be there soon.", "slow": "Bald. Ich werde bald da sein – I will be there soon.", "grammar": "Ich werde bald da sein – I will be there soon."}, {"type": "narration", "text": "--He left. The bell chimed. The door closed. Frau Schmidt came out of the back."}, {"type": "dialogue", "text": "“You are a good boyfriend,” she said."}, {"type": "dialogue", "text": "“I am trying.”"}, {"type": "dialogue", "text": "“That is the same thing.”"}, {"type": "narration", "text": "I laughed. It was small, but it was real."}, {"type": "dialogue", "text": "“Clean the bathroom,” she said. “You forgot yesterday.”"}, {"type": "practice", "prompt": "Now say “to try” – versuchen. Review.", "answer": "Versuchen. Ich versuche es – I am trying.", "slow": "Versuchen. Ich versuche es – I am trying.", "grammar": "Ich versuche es – I am trying."}, {"type": "practice", "prompt": "Now say “to forget” – vergessen. Review.", "answer": "Vergessen. Du hast gestern vergessen – you forgot yesterday.", "slow": "Vergessen. Du hast gestern vergessen – you forgot yesterday.", "grammar": "Du hast gestern vergessen – you forgot yesterday."}, {"type": "narration", "text": "--That night, Matei was on the sofa. The lamp was on. The radiator clicked. The plant was still alive. I sat next to him. He leaned into me."}, {"type": "dialogue", "text": "“Andreea is staying in Berlin for a week,” he said."}, {"type": "dialogue", "text": "“That is good.”"}, {"type": "dialogue", "text": "“She wants to have dinner. The three of us.”"}, {"type": "dialogue", "text": "“That is also good.”"}, {"type": "dialogue", "text": "“Are you nervous?”"}, {"type": "dialogue", "text": "“A little.”"}, {"type": "dialogue", "text": "“Me too.”"}, {"type": "narration", "text": "I put my arm around him."}, {"type": "dialogue", "text": "“We will be nervous together,” I said."}, {"type": "dialogue", "text": "“Same thing.”"}, {"type": "dialogue", "text": "“Same thing.”"}, {"type": "practice", "prompt": "Now say “to stay” – bleiben. Sie bleibt eine Woche in Berlin – she is staying in", "answer": "Berlin for a week.", "slow": "Berlin for a week.", "grammar": "Repeat aloud: Berlin for a week."}, {"type": "narration", "text": "Bleiben. Sie bleibt eine Woche – she is staying for a week."}, {"type": "practice", "prompt": "Now say “nervous” – nervös. Review.", "answer": "Nervös. Bist du nervös? – are you nervous?.", "slow": "Nervös. Bist du nervös? – are you nervous?.", "grammar": "Bist du nervös? – are you nervous?"}, {"type": "narration", "text": "--He kissed my shoulder."}, {"type": "dialogue", "text": "“I love you,” he said."}, {"type": "dialogue", "text": "“I love you too.”"}, {"type": "narration", "text": "We sat like that until the lamp flickered and the street went quiet. Tomorrow, there would be dinner. And questions. And the slow work of forgiveness. But tonight, we were here. And that was enough."}, {"type": "practice", "prompt": "Now say “the shoulder” – die Schulter. Review.", "answer": "Die Schulter. Er küsste meine Schulter – he kissed my shoulder.", "slow": "Die Schulter. Er küsste meine Schulter – he kissed my shoulder.", "grammar": "Er küsste meine Schulter – he kissed my shoulder."}, {"type": "practice", "prompt": "Now say “the work” – die Arbeit. Die langsame Arbeit der Vergebung – the slow work", "answer": "of forgiveness.", "slow": "of forgiveness.", "grammar": "Repeat aloud: of forgiveness."}], "bg": "café", "location": "Morgenlicht — The Weight"}, {"id": 19, "title": "The Sister", "level": "B1-B2", "segments": [{"type": "narration", "text": "kettle, soft evening light.) The dinner was at Andreea's hotel. Not a hotel, really. A guesthouse in Prenzlauer Berg, the kind with creaky floors and a shared bathroom at the end of the hall. She had been staying there for three days, waiting for Matei to be ready. Now he was ready. Or ready enough."}, {"type": "dialogue", "text": "“You do not have to come,” Matei said for the fifth time. We were standing outside"}, {"type": "narration", "text": "the building. The street was quiet. A cat watched us from a windowsill."}, {"type": "dialogue", "text": "“I know.”"}, {"type": "dialogue", "text": "“She is going to ask a lot of questions.”"}, {"type": "dialogue", "text": "“I know.”"}, {"type": "dialogue", "text": "“Some of them will be about you. Your past. Your family.”"}, {"type": "dialogue", "text": "“I know.”"}, {"type": "narration", "text": "He turned to look at me. “Are you sure?”"}, {"type": "practice", "prompt": "Now say “the guesthouse” – die Pension.", "answer": "Die Pension. Feminine. Eine Pension in Prenzlauer Berg – a guesthouse in.", "slow": "Die Pension. Feminine. Eine Pension in Prenzlauer Berg – a guesthouse in.", "grammar": "Feminine. Eine Pension in Prenzlauer Berg – a guesthouse in Prenzlauer Berg."}, {"type": "practice", "prompt": "Now say “creaky” – knarrend.", "answer": "Knarrend. Knarrende Böden – creaky floors.", "slow": "Knarrend. Knarrende Böden – creaky floors.", "grammar": "Knarrende Böden – creaky floors."}, {"type": "narration", "text": "--I thought about it. About my grandmother. About Nigeria. About all the things I had spent my life hiding."}, {"type": "dialogue", "text": "“I am sure,” I said. “She is your sister. I want her to know me.”"}, {"type": "narration", "text": "He kissed my forehead. “Okay.” We walked inside."}, {"type": "practice", "prompt": "Now say “to hide” – verstecken. Review.", "answer": "Verstecken. Die Dinge, die ich versteckt hatte – the things I had hidden.", "slow": "Verstecken. Die Dinge, die ich versteckt hatte – the things I had hidden.", "grammar": "Die Dinge, die ich versteckt hatte – the things I had hidden."}, {"type": "practice", "prompt": "Now say “inside” – hinein or herein. Wir gingen hinein – we walked inside.", "answer": "--Andreea's room was small. A bed, a table, two chairs, a kettle. She had ordered.", "slow": "--Andreea's room was small. A bed, a table, two chairs, a kettle. She had ordered.", "grammar": "A bed, a table, two chairs, a kettle. She had ordered food from a Romanian restaurant down the street – containers of something that smelled like paprika and garlic and home, even though I had never been to Romania. “You came,” she said, opening the door. “We said we would.” “Matei says a lot of things.” She hugged him. He let her. “Come in. Sit. Eat.” We sat. The chairs were wooden and uncomfortable."}, {"type": "practice", "prompt": "Now say “the kettle” – der Wasserkocher.", "answer": "Der Wasserkocher. Masculine. Ein Wasserkocher – a kettle.", "slow": "Der Wasserkocher. Masculine. Ein Wasserkocher – a kettle.", "grammar": "Masculine. Ein Wasserkocher – a kettle."}, {"type": "practice", "prompt": "Now say “the container” – der Behälter.", "answer": "Der Behälter. Masculine. Behälter mit Essen – containers of food.", "slow": "Der Behälter. Masculine. Behälter mit Essen – containers of food.", "grammar": "Masculine. Behälter mit Essen – containers of food."}, {"type": "dialogue", "text": "--“Yves,” Andreea said, handing me a fork. “Matei tells me you run a café.”"}, {"type": "dialogue", "text": "“I work at a café. Frau Schmidt owns it.”"}, {"type": "dialogue", "text": "“He tells me you are going to take over when she retires.”"}, {"type": "narration", "text": "I looked at Matei. He was studying the ceiling."}, {"type": "dialogue", "text": "“We have not talked about that,” I said."}, {"type": "dialogue", "text": "“Matei talks about everything. Just not to the people he should.” She smiled. It"}, {"type": "narration", "text": "was Matei's smile – the same shape, the same hesitation. “Eat. Before it gets cold.”"}, {"type": "practice", "prompt": "Now say “to retire” – in Rente gehen.", "answer": "In Rente gehen. Wenn sie in Rente geht – when she retires.", "slow": "In Rente gehen. Wenn sie in Rente geht – when she retires.", "grammar": "Wenn sie in Rente geht – when she retires."}, {"type": "practice", "prompt": "Now say “the ceiling” – die Decke. Review.", "answer": "Die Decke. Er studierte die Decke – he was studying the ceiling.", "slow": "Die Decke. Er studierte die Decke – he was studying the ceiling.", "grammar": "Er studierte die Decke – he was studying the ceiling."}, {"type": "narration", "text": "--We ate. The food was good. Better than good. I did not know the names of half the dishes, but I ate everything on my plate and reached for more."}, {"type": "dialogue", "text": "“You cook?” Andreea asked."}, {"type": "dialogue", "text": "“Pasta. My grandmother's recipe.”"}, {"type": "dialogue", "text": "“She taught you?”"}, {"type": "dialogue", "text": "“I watched her. She did not teach. She just did.”"}, {"type": "narration", "text": "Andreea nodded. “That is how Matei learned. Watching. Not asking.” Matei did not look up from his plate."}, {"type": "dialogue", "text": "“I asked questions,” he said."}, {"type": "dialogue", "text": "“You asked yourself. Not me.”"}, {"type": "practice", "prompt": "Now say “the recipe” – das Rezept.", "answer": "Das Rezept. Neuter. Das Rezept meiner Großmutter – my grandmother's recipe.", "slow": "Das Rezept. Neuter. Das Rezept meiner Großmutter – my grandmother's recipe.", "grammar": "Neuter. Das Rezept meiner Großmutter – my grandmother's recipe."}, {"type": "practice", "prompt": "Now say “to watch” – beobachten. Ich habe sie beobachtet – I watched her.", "answer": "--“You were busy,” Matei said.", "slow": "--“You were busy,” Matei said.", "grammar": "“I was always busy. That is not an excuse.” She set her fork down. “I should have been there. After Sebastian. I should have come to Berlin. Instead, I told you to come home.” “You were trying to protect me.”"}, {"type": "dialogue", "text": "“I was trying to control you. There is a difference.”"}, {"type": "narration", "text": "Matei finally looked up. His grey eyes met hers."}, {"type": "dialogue", "text": "“I know,” he said. “I have had a lot of practice with people who confuse the two.”"}, {"type": "practice", "prompt": "Now say “the excuse” – die Ausrede.", "answer": "Die Ausrede. Feminine. Das ist keine Ausrede – that is not an excuse.", "slow": "Die Ausrede. Feminine. Das ist keine Ausrede – that is not an excuse.", "grammar": "Feminine. Das ist keine Ausrede – that is not an excuse."}, {"type": "practice", "prompt": "Now say “to confuse” – verwechseln.", "answer": "Verwechseln. Menschen, die die beiden verwechseln – people who confuse the two.", "slow": "Verwechseln. Menschen, die die beiden verwechseln – people who confuse the two.", "grammar": "Menschen, die die beiden verwechseln – people who confuse the two."}, {"type": "narration", "text": "--The room was quiet. The kettle clicked as it cooled."}, {"type": "dialogue", "text": "“I am sorry,” Andreea said."}, {"type": "dialogue", "text": "“I know.”"}, {"type": "dialogue", "text": "“I am not going to say it again.”"}, {"type": "dialogue", "text": "“I would not believe you if you did.”"}, {"type": "narration", "text": "She almost smiled. “You are still angry.”"}, {"type": "dialogue", "text": "“I am not angry. I am tired.”"}, {"type": "dialogue", "text": "“Same thing.”"}, {"type": "dialogue", "text": "“No.” He reached for my hand under the table. “Angry is what I was. Tired is what"}, {"type": "narration", "text": "I am now. And tired is better.”"}, {"type": "practice", "prompt": "Now say “to cool” – abkühlen.", "answer": "Abkühlen. Der Wasserkocher kühlte ab – the kettle cooled down.", "slow": "Abkühlen. Der Wasserkocher kühlte ab – the kettle cooled down.", "grammar": "Der Wasserkocher kühlte ab – the kettle cooled down."}, {"type": "practice", "prompt": "Now say “to reach” – greifen. Er griff nach meiner Hand – he reached for my hand.", "answer": "--Andreea looked at our hands. Then at me.", "slow": "--Andreea looked at our hands. Then at me.", "grammar": "Then at me. “Take care of him,” she said. “I am trying.” “Try harder.” I laughed. She did not. “I am serious,” she said. “He does not ask for help. He does not tell you when he is hurting. He just disappears into himself and waits for it to pass.” “I know.” “Then you know it is not easy.” “Nothing easy is worth doing.” She stared at me for a long moment. Then she laughed. A surprised laugh. “Matei,” she said. “I like him.” “I know,” Matei said. “That is why I kept him.”"}, {"type": "practice", "prompt": "Now say “to disappear” – verschwinden.", "answer": "Verschwinden. Er verschwindet in sich selbst – he disappears into himself.", "slow": "Verschwinden. Er verschwindet in sich selbst – he disappears into himself.", "grammar": "Er verschwindet in sich selbst – he disappears into himself."}, {"type": "practice", "prompt": "Now say “surprised” – überrascht.", "answer": "Überrascht. Ein überraschtes Lachen – a surprised laugh.", "slow": "Überrascht. Ein überraschtes Lachen – a surprised laugh.", "grammar": "Ein überraschtes Lachen – a surprised laugh."}, {"type": "narration", "text": "--After dinner, we walked Andreea to the U-Bahn. She was leaving tomorrow. Back to Romania. Back to her life."}, {"type": "dialogue", "text": "“You will come visit?” she asked Matei."}, {"type": "dialogue", "text": "“Maybe.”"}, {"type": "dialogue", "text": "“That is not yes.”"}, {"type": "dialogue", "text": "“It is not no.”"}, {"type": "narration", "text": "She hugged him. Held on."}, {"type": "dialogue", "text": "“I am proud of you,” she whispered."}, {"type": "dialogue", "text": "“I know.”"}, {"type": "narration", "text": "She pulled back. Looked at me."}, {"type": "dialogue", "text": "“You too, Yves. Come visit. Bring the café.”"}, {"type": "dialogue", "text": "“I will bring coffee.”"}, {"type": "dialogue", "text": "“Good enough.”"}, {"type": "practice", "prompt": "Now say “to whisper” – flüstern. Review.", "answer": "Flüstern. Sie flüsterte – she whispered.", "slow": "Flüstern. Sie flüsterte – she whispered.", "grammar": "Sie flüsterte – she whispered."}, {"type": "practice", "prompt": "Now say “good enough” – gut genug.", "answer": "Gut genug. Gut genug – good enough.", "slow": "Gut genug. Gut genug – good enough.", "grammar": "Gut genug – good enough."}, {"type": "narration", "text": "--She walked down the stairs. Disappeared into the station. Matei stood there for a long moment, staring at the empty staircase."}, {"type": "dialogue", "text": "“You okay?” I asked."}, {"type": "dialogue", "text": "“I will be.”"}, {"type": "dialogue", "text": "“That is not what I asked.”"}, {"type": "narration", "text": "He turned to me. His eyes were wet."}, {"type": "dialogue", "text": "“She said she is proud of me.”"}, {"type": "dialogue", "text": "“I heard.”"}, {"type": "dialogue", "text": "“No one has ever said that before. Not like that.”"}, {"type": "narration", "text": "I put my hand on his face."}, {"type": "dialogue", "text": "“I am proud of you too.”"}, {"type": "dialogue", "text": "“You have to say that. You are my boyfriend.”"}, {"type": "dialogue", "text": "“I do not have to say anything. I choose to.”"}, {"type": "practice", "prompt": "Now say “the staircase” – das Treppenhaus.", "answer": "Das Treppenhaus. Neuter. Das leere Treppenhaus – the empty staircase.", "slow": "Das Treppenhaus. Neuter. Das leere Treppenhaus – the empty staircase.", "grammar": "Neuter. Das leere Treppenhaus – the empty staircase."}, {"type": "practice", "prompt": "Now say “to choose” – wählen or sich entscheiden. Ich entscheide mich dazu – I", "answer": "choose to.", "slow": "choose to.", "grammar": "Repeat aloud: choose to."}, {"type": "narration", "text": "--He kissed me. On the street. In front of the U-Bahn station."}, {"type": "dialogue", "text": "“Let us go home,” he said."}, {"type": "dialogue", "text": "“Okay.”"}, {"type": "narration", "text": "We walked. The streets were dark. The streetlights cast orange light on the pavement. His hand was in mine."}, {"type": "dialogue", "text": "“Matei.”"}, {"type": "dialogue", "text": "“What?”"}, {"type": "dialogue", "text": "“What did Andreea mean? About me taking over the café?”"}, {"type": "narration", "text": "He was quiet for a moment."}, {"type": "dialogue", "text": "“Frau Schmidt is getting old. Her hand is not getting better. She is going to need"}, {"type": "narration", "text": "to sell it eventually.”"}, {"type": "dialogue", "text": "“And you think I should buy it?”"}, {"type": "dialogue", "text": "“I think you should think about it.”"}, {"type": "practice", "prompt": "Now say “to sell” – verkaufen.", "answer": "Verkaufen. Sie wird es irgendwann verkaufen müssen – she will have to sell it.", "slow": "Verkaufen. Sie wird es irgendwann verkaufen müssen – she will have to sell it.", "grammar": "Sie wird es irgendwann verkaufen müssen – she will have to sell it eventually."}, {"type": "practice", "prompt": "Now say “to buy” – kaufen. Soll ich es kaufen? – should I buy it?", "answer": "--“I do not have money.”.", "slow": "--“I do not have money.”.", "grammar": "” “You have time. The café is not going anywhere.” I thought about it. About the green awning. The chalkboard sign. The espresso machine that hissed like a cat. The blue notebook with all the passwords. “I will think about it,” I said. “That is all I ask.”"}, {"type": "practice", "prompt": "Now say “the awning” – die Markise. Review.", "answer": "Die Markise. Die grüne Markise – the green awning.", "slow": "Die Markise. Die grüne Markise – the green awning.", "grammar": "Die grüne Markise – the green awning."}, {"type": "practice", "prompt": "Now say “the password” – das Passwort.", "answer": "Das Passwort. Neuter. Die Passwörter – the passwords.", "slow": "Das Passwort. Neuter. Die Passwörter – the passwords.", "grammar": "Neuter. Die Passwörter – the passwords."}, {"type": "narration", "text": "--That night, I lay in bed and stared at the ceiling. Matei was asleep next to me. His arm was around my waist. His breathing was slow and even. I thought about Nigeria. About my grandmother. About the life I had left behind. I thought about Berlin. About the café. About Matei. I thought about the word home and what it actually meant."}, {"type": "practice", "prompt": "Now say “the waist” – die Taille.", "answer": "Die Taille. Feminine. Sein Arm um meine Taille – his arm around my waist.", "slow": "Die Taille. Feminine. Sein Arm um meine Taille – his arm around my waist.", "grammar": "Feminine. Sein Arm um meine Taille – his arm around my waist."}, {"type": "practice", "prompt": "Now say “even” – gleichmässig.", "answer": "Gleichmässig. Gleichmässiges Atmen – even breathing.", "slow": "Gleichmässig. Gleichmässiges Atmen – even breathing.", "grammar": "Gleichmässiges Atmen – even breathing."}, {"type": "narration", "text": "--My phone buzzed. Ada. How was dinner? Good. Weird. Good. Are you okay? I think so. That is not a yes. It is not no either. Go to sleep, Yves. You too, Ada. I put the phone away. Turned over. Pressed my face into Matei's shoulder. He made a sound. Not a word. Just a sound. A sleepy, contented sound. I closed my eyes. Tomorrow, there would be work. And coffee. And dropped cups. But tonight, I was here."}, {"type": "practice", "prompt": "Now say “contented” – zufrieden.", "answer": "Zufrieden. Ein zufriedener Laut – a contented sound.", "slow": "Zufrieden. Ein zufriedener Laut – a contented sound.", "grammar": "Ein zufriedener Laut – a contented sound."}, {"type": "practice", "prompt": "Now say “to press” – drücken. Ich drückte mein Gesicht in seine Schulter – I", "answer": "pressed my face into his shoulder.", "slow": "pressed my face into his shoulder.", "grammar": "Repeat aloud: pressed my face into his shoulder."}], "bg": "guesthouse", "location": "Andreea's Guesthouse"}, {"id": 20, "title": "The Question", "level": "B1-B2", "segments": [{"type": "narration", "text": "distant traffic.) The café was quiet. It was a Tuesday in late March. The grey sky had finally cracked open, and a thin, watery sun was coming through the window. Frau Schmidt was at her usual table, her good hand wrapped around a cup of tea, her bad hand resting in her lap. She was getting stronger. But she was also getting older. I could see it in the way she moved – slower, more careful, like she was saving her energy for something."}, {"type": "dialogue", "text": "“You are staring,” she said without looking up."}, {"type": "dialogue", "text": "“I am observing.”"}, {"type": "dialogue", "text": "“Same thing.” She set her cup down. “What is on your mind?”"}, {"type": "practice", "prompt": "Now say “watery” – wässrig.", "answer": "Wässrig. Eine wässrige Sonne – a watery sun.", "slow": "Wässrig. Eine wässrige Sonne – a watery sun.", "grammar": "Eine wässrige Sonne – a watery sun."}, {"type": "practice", "prompt": "Now say “to crack open” – aufbrechen. Der graue Himmel war aufgebrochen – the grey", "answer": "sky had cracked open.", "slow": "sky had cracked open.", "grammar": "Repeat aloud: sky had cracked open."}, {"type": "narration", "text": "--I wiped the counter. The rag was damp."}, {"type": "dialogue", "text": "“Matei has been weird lately.”"}, {"type": "dialogue", "text": "“Weird how?”"}, {"type": "dialogue", "text": "“Quiet. More than usual. He comes home, makes dinner, sits on the sofa, and"}, {"type": "narration", "text": "just... stares at me.”"}, {"type": "dialogue", "text": "“Maybe he is admiring you.”"}, {"type": "dialogue", "text": "“He is planning something.”"}, {"type": "narration", "text": "Frau Schmidt smiled. It was a small smile. Secret."}, {"type": "dialogue", "text": "“Men plan,” she said. “Women execute. That is the difference.”"}, {"type": "dialogue", "text": "“That is sexist.”"}, {"type": "dialogue", "text": "“That is true.” She stood up. Walked to the counter. “Yves, do you love him?”"}, {"type": "dialogue", "text": "“You know I do.”"}, {"type": "dialogue", "text": "“Then stop worrying and let him plan.”"}, {"type": "practice", "prompt": "Now say “to admire” – bewundern.", "answer": "Bewundern. Vielleicht bewundert er dich – maybe he is admiring you.", "slow": "Bewundern. Vielleicht bewundert er dich – maybe he is admiring you.", "grammar": "Vielleicht bewundert er dich – maybe he is admiring you."}, {"type": "practice", "prompt": "Now say “sexist” – sexistisch.", "answer": "Sexistisch. Das ist sexistisch – that is sexist.", "slow": "Sexistisch. Das ist sexistisch – that is sexist.", "grammar": "Das ist sexistisch – that is sexist."}, {"type": "narration", "text": "--I wanted to argue. But she was right. I had spent my whole life waiting for the other shoe to drop. Waiting for people to leave. Waiting for happiness to be snatched away. Maybe Matei was not planning an exit. Maybe he was planning something else."}, {"type": "dialogue", "text": "“Clean the bathroom,” Frau Schmidt said. “You forgot yesterday.”"}, {"type": "practice", "prompt": "Now say “the shoe” – der Schuh. Review.", "answer": "Der Schuh. Der andere Schuh – the other shoe.", "slow": "Der Schuh. Der andere Schuh – the other shoe.", "grammar": "Der andere Schuh – the other shoe."}, {"type": "practice", "prompt": "Now say “to snatch away” – wegreißen.", "answer": "Wegreißen. Das Glück wird weggerissen – happiness is snatched away.", "slow": "Wegreißen. Das Glück wird weggerissen – happiness is snatched away.", "grammar": "Das Glück wird weggerissen – happiness is snatched away."}, {"type": "narration", "text": "--I walked home that evening with a bag of groceries. Matei had texted me: I am cooking. Buy pasta. When I opened the apartment door, the lights were off. Candles were on the table. Not romantic candles – the emergency ones from the drawer, the ones that smelled like nothing and flickered unevenly. But it was the thought that counted."}, {"type": "dialogue", "text": "“Matei?”"}, {"type": "dialogue", "text": "“In the kitchen.”"}, {"type": "narration", "text": "I set the groceries down. Walked to the kitchen. He was standing at the stove, stirring something in a pot. His back was to me."}, {"type": "practice", "prompt": "Now say “the candle” – die Kerze.", "answer": "Die Kerze. Feminine. Kerzen auf dem Tisch – candles on the table.", "slow": "Die Kerze. Feminine. Kerzen auf dem Tisch – candles on the table.", "grammar": "Feminine. Kerzen auf dem Tisch – candles on the table."}, {"type": "practice", "prompt": "Now say “to flicker” – flackern. Die Kerzen flackerten – the candles flickered.", "answer": "--“What is all this?” I asked.", "slow": "--“What is all this?” I asked.", "grammar": "“Dinner.” “I see that. Why the candles?” He did not turn around. “Because I wanted to.” “Matei.” “Yves.” “You are scaring me.” He finally turned. His face was calm. His grey eyes were steady. “Do not be scared,” he said. “Sit down. I will explain.”"}, {"type": "practice", "prompt": "Now say “to scare” – erschrecken. Du machst mir Angst – you are scaring me.", "answer": "Erschrecken. Du erschreckst mich – you are scaring me.", "slow": "Erschrecken. Du erschreckst mich – you are scaring me.", "grammar": "Du erschreckst mich – you are scaring me."}, {"type": "practice", "prompt": "Now say “to explain” – erklären. Ich werde es erklären – I will explain.", "answer": "--I sat at the table. The wooden chair. The plastic one was still empty. The candles.", "slow": "--I sat at the table. The wooden chair. The plastic one was still empty. The candles.", "grammar": "The wooden chair. The plastic one was still empty. The candles flickered. The apartment smelled like garlic and something else – something nervous. He brought two plates. Pasta. My grandmother's recipe. He had learned it. He had been watching me for months, and now he made it better than I did. “This is good,” I said after the first bite. “I have had practi
