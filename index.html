const SEGMENTS = [[{"text": "Chapter 1 \u2013 The Key (A1) (Narrator voice, calm, clear. Ambient: soft airplane cabin hum, then fade to terminal ambience \u2013 footsteps, distant announcements.) Welcome to Chapter 1 of Love in Germany. This audiobook teaches you German through a story. You will hear the story in English. German words and sentences are spoken twice \u2013 first slowly, then at normal speed. When you hear \u201cNow say\u2026\u201d, repeat the German out loud or in your head. A four-second pause follows, then the correct answer. Do not worry about mistakes. Mistakes are how you learn. Let us begin. --The plane landed twelve minutes early. That should have been my first warning. Nothing in my life had ever been early. Not my birth \u2013 two weeks late, according to my grandmother \u2013 not my flights, not my feelings. But Berlin wanted me to arrive before I was ready. I grabbed my suitcase. One battered bag. I had learned to travel exactly how I had learned to love: light enough to leave fast. I stepped onto the terminal floor, my boots echoing against the polished concrete, feeling utterly untethered. Now say \u201cI am Yves\u201d in German.", "lang": "en"}], [{"text": "Ich bin Yves. Slowly: Ich bin Yves. Normal speed: Ich bin Yves.", "lang": "de"}, {"text": "The verb bin comes from sein \u2013 to be. In a main clause, the verb is always in the second position. Ich (position one), bin (position two), Yves (position three). This is the backbone of every German sentence. Now say \u201cI have a suitcase.\u201d", "lang": "en"}], [{"text": "Ich habe einen Koffer. Slowly: Ich habe einen Koffer. Normal speed: Ich habe einen", "lang": "de"}, {"text": "Koffer. Notice einen instead of ein. Koffer is masculine. When a masculine noun is the object of the sentence, ein changes to einen. You will see this shift often. Now say \u201cI am tired.\u201d", "lang": "en"}], [{"text": "Ich bin m\u00fcde. Slowly: Ich bin m\u00fcde. Normal speed: Ich bin m\u00fcde.", "lang": "de"}, {"text": "M\u00fcde means tired. Listen to the umlaut \u00fc. Repeat: m\u00fcde. --The terminal was cavernous and quiet for a Tuesday afternoon. A few families hugged tightly at the arrivals gate. A woman wept softly into her phone near the glass barrier. Across the hall, a man in a too-thin coat leaned against a concrete pillar, scrolling through his phone with a stillness that made him look like he had all the time in the world. He was the one who called my name. \u201cYves!\u201d I turned. The man from the pillar was moving toward me. He was not exceptionally tall. He was not smiling. His coat was a faded charcoal grey, his hair dark and slightly windblown, and his eyes were the exact colour of the February sky outside \u2013 grey, but holding a hidden warmth that somehow made me defensive. Why was he looking at me with that kind of warmth? I did not even know him. \u201cYou are Matei,\u201d I said, my voice catching slightly. Now say \u201cHello, Matei\u201d in German.", "lang": "en"}], [{"text": "Hallo, Matei. Slowly: Hallo, Matei. Normal speed: Hallo, Matei. Hallo works in any situation \u2013 casual or professional. Later we will learn Guten Tag for formal greetings. --\u201cYou are late,\u201d he said, his voice lower than it had sounded through headphones. I glanced up at the digital clock. \u201cThe plane arrived early. That is mathematically the opposite of late.\u201d He did not laugh, but the tension in his shoulders dropped. \u201cMy train was late.\u201d \u201cSo we are both starting this disappointed.\u201d The corner of his mouth twitched \u2013 a tiny crack in his stoic expression, as if he had caught himself wanting to smile. Then, without asking for permission, without even looking at me, he reached down, picked up my heavy suitcase, and walked toward the automatic exit doors. I followed. That is how the ink dried on our first page. Me, tracking the stride of a man who never asked for permission. Now say \u201cthank you\u201d in German. t the grey buildings sliding past in the mist. I could have lied. I had built a mental catalogue of polite fictions. For work. To see the city. A fresh start. All true enough to pass. But the cold air had drained me, and when he turned his head, his eyes were too steady to lie to. \u201cI wanted to leave,\u201d I whispered. \u201cLeave from where?\u201d \u201cHome.\u201d He didn't offer a hollow I'm sorry or a rehearsed that must be hard. He didn't use the empty phrases people deploy to buffer themselves from someone else's pain. Instead, he simply rested his palm flat over the back of my hand. His skin was incredibly warm. We stayed exactly like that for the remainder of the ride. Neither of us spoke another word. Neither of us pulled away. Now say \u201cthe key\u201d in German.", "lang": "en"}], [{"text": "Der Schl\u00fcssel. Slowly: Der Schl\u00fcssel. Normal speed: Der Schl\u00fcssel. Der is the masculine article. Every German noun has a gender: der (masculine), die", "lang": "de"}, {"text": "(feminine), das (neuter). Learn the article with the noun. Der Schl\u00fcssel \u2013 the key. Now say \u201cthe apartment.\u201d", "lang": "en"}], [{"text": "Die Wohnung. Slowly: Die Wohnung. Normal speed: Die Wohnung.", "lang": "de"}, {"text": "Notice the ending -ung. Nouns ending in -ung are almost always feminine, so they take die. Die Wohnung \u2013 the apartment. --When the bus hissed to a stop, he lifted his hand from mine without apology. He pointed across the asphalt toward a building \u2013 five storeys, faded mustard-yellow stucco, a heavy door painted so many times the wood looked thick. A small bakery occupied the ground floor, its lights dark for the night. \u201cThat is my apartment,\u201d Matei said. \u201cYou sleep on the sofa.\u201d I stared at the weathered facade, then at him. \u201cOnly for one night,\u201d I said. \u201cOnly for one night,\u201d he agreed. We both knew it was a lie. Something in the freezing air between us had already decided that twent ysical album. That is more than just okay.\u201d \u201cMy ex left it behind.\u201d His voice was flat, devoid of emotion. But his jaw tightened for a fraction of a second. I decided not to press. Not tonight. He retreated into the kitchen. I listened to the rush of tap water, the clatter of cabinet doors, the clink of ceramic mugs. When he walked back, he wasn't holding tea. He was holding a key. Small. Silver. Unremarkable. \u201cHere,\u201d he said. I took it from his palm. The metal was intensely warm \u2013 retaining the heat of his pocket, his skin, and whatever strange gravity he carried. \u201cFor the door?\u201d I asked. He looked at me. Really looked. His grey eyes held mine. The lamp flickered. The street outside was silent. \u201cFor you,\u201d he said. Now say \u201cfor you\u201d in German informal, because they are already close", "lang": "en"}], [{"text": "F\u00fcr dich. Slowly: F\u00fcr dich. Normal speed: F\u00fcr dich. If this were formal \u2013 a stranger, a boss \u2013 we would say f\u00fcr Sie. But here, it is f\u00fcr dich. Now say \u201cfor me.\u201d", "lang": "en"}], [{"text": "F\u00fcr mich. Good. --He emerged with two mugs of black tea \u2013 no sugar, no milk. Handed me one without asking. I took a sip. Perfect. I hated that it was perfect. \u201cHow did you know how I take my tea?\u201d I asked. \u201cYou told me,\u201d he said. \u201cTwo years ago. In a message.\u201d Two years ago. Late-night messages, time zones, confessions that felt safe because they weren't real. A throwaway line. And he had filed it away. \u201cI remember things,\u201d he said. Now say \u201cI remember\u201d in German.", "lang": "en"}], [{"text": "Ich erinnere mich. Slowly: Ich erinnere mich. Normal speed: Ich erinnere mich.", "lang": "de"}, {"text": "This is a reflexive verb \u2013 you say \u201cI remember myself.\u201d English used to do this (\u201cI remember me\u201d). German still does. Now say \u201cyou remember\u201d to one person, informal", "lang": "en"}], y\u201d in German.", "lang": "en"}], [{"text": "Die Geschichte. Slowly: Die Geschichte. Normal speed: Die Geschichte.", "lang": "de"}, {"text": "Geschichte ends in -e, often feminine. Die Geschichte \u2013 the story. --Dual-layer vocabulary review \u2013 Chapter 1 Layer 1 \u2013 Words", "lang": "en"}, {"text": "Ich bin", "lang": "de"}, {"text": "\u2013 I am. <break time=\"2s\"/> Ich bin", "lang": "en"}, {"text": "Danke", "lang": "de"}, {"text": "\u2013 thank you. <break time=\"2s\"/> Danke", "lang": "en"}, {"text": "Danke sch\u00f6n", "lang": "de"}, {"text": "\u2013 thank you very much. <break time=\"2s\"/> Danke sch\u00f6n", "lang": "en"}, {"text": "Bitte", "lang": "de"}, {"text": "\u2013 please / you're welcome. <break time=\"2s\"/> Bitte", "lang": "en"}, {"text": "Entschuldigung", "lang": "de"}, {"text": "\u2013 excuse me / sorry. <break time=\"2s\"/> Entschuldigung", "lang": "en"}, {"text": "Tsch\u00fcss", "lang": "de"}, {"text": "\u2013 goodbye (casual). <break time=\"2s\"/> Tsch\u00fcss", "lang": "en"}, {"text": "Guten Morgen", "lang": "de"}, {"text": "\u2013 good morning. <break time=\"2s\"/> Guten Morgen", "lang": "en"}, {"text": "Guten Abend", "lang": "de"}, {"text": "\u2013 good evening. <break time=\"2s\"/> Guten Abend", "lang": "en"}, {"text": "Gute Nacht", "lang": "de"}, {"text": "\u2013 good night. <break time=\"2s\"/> Gute Nacht", "lang": "en"}, {"text": "Der Schl\u00fcssel", "lang": "de"}, {"text": "\u2013 the key. <break time=\"2s\"/> Der Schl\u00fcssel", "lang": "en"}, {"text": "Die Wohnung", "lang": "de"}, {"text": "\u2013 the apartment. <break time=\"2s\"/> Die Wohnung F\u00fcr dich \u2013 for you (informal). <break time=\"2s\"/> F\u00fcr dich. F\u00fcr mich \u2013 for me. <break time=\"2s\"/> F\u00fcr mich.", "lang": "en"}, {"text": "Ich erinnere mich", "lang": "de"}, {"text": "\u2013 I remember. <break time=\"2s\"/> Ich erinnere mich", "lang": "en"}, {"text": "Ja", "lang": "de"}, {"text": "\u2013 yes. <break time=\"2s\"/> Ja", "lang": "en"}, {"text": "Nein", "lang": "de"}, {"text": "\u2013 no. <break time=\"2s\"/> Nein", "lang": "en"}, {"text": "Die Geschichte", "lang": "de"}, {"text": "\u2013 the story. <break time=\"2s\"/> Die Geschichte Layer 2 \u2013 Story phrases \"Ich bin Yves.\" \u2013 I am Yves. <break time=\"2s\"/> Ich bin Yves. \"Danke sch\u00f6n.\" \u2013 Thank you very much. <break time=\"2s\"/> Danke sch\u00f6n. \"Der Schl\u00fcssel f\u00fcr dich.\" \u2013 The key for you. <break time=\"2s\"/> Der Schl\u00fcssel f\u00fcr dich. \"Ich erinnere mich.\" \u2013 I remember. <break time=\"2s\"/> Ich erinnere mich. \"Gute Nacht.\" \u2013 Good night. <break time=\"2s\"/> Gute Nacht. --End of Chapter 1. --Chapter 2 \u2013 The First Morning (A1) (Narrator voice, calm, clear. Ambient: early morning city sounds \u2013 distant bird, single car passing, soft radiator hiss.) I did not sleep. Not because the bed was uncomfortable \u2013 it was actually better than any bed I had slept in for the last six months. Not because of jet lag \u2013 my body had given up on time zones somewhere over the Atlantic. I did not sleep because I could hear Matei breathing on the sofa. It was a quiet sound. Steady. The kind of breathing that said I have no problem falling asleep anywhere, anytime, because I am a normal person who does not overthink everything. I hated him for it. I also wanted to lie on the floor next to the sofa and listen to it all night. Now say \u201cI am tired\u201d in German.", "lang": "en"}], [{"text": "Ich bin m\u00fcde.", "lang": "de"}, {"text": "Now say \u201cI am hungry\u201d", "lang": "en"}, {"text": "because my stomach started growling", "lang": "de"}], [{"text": "Ich bin hungrig.", "lang": "de"}, {"text": "Hungrig means hungry. The -ig ending sounds like \u201cish\u201d. Repeat: hungrig. --Around 3 AM, I gave up. I stared at the ceiling. The building made noises \u2013 pipes groaning, floorboards settling, someone upstairs walking to their bathroom in the dark. Berlin sounds. Not the sounds of Lagos, where the night was never truly quiet. Here, the silence was so loud it felt like pressure. I must have fallen asleep eventually, because the next thing I knew, light was hitting my face through the window, and I could smell coffee. Matei was in the kitchen. His back was to me. He wore the same grey shirt from yesterday \u2013 or maybe a different grey shirt, I could not tell \u2013 and he was pouring water into a French press with the concentration of a surgeon. I watched him for a minute. He moved slowly, deliberately, like he had done this a thousand mornings and would do it a thousand more. \u201cYou are staring,\u201d he said without turning around. \u201cI am observing,\u201d I said. \u201cThere is a difference.\u201d \u201cWhat is the difference?\u201d \u201cStaring is creepy. Observing is scientific.\u201d He almost smiled again. Almost. Now say \u201cgood morning\u201d in German.", "lang": "en"}], [{"text": "Guten Morgen.", "lang": "de"}, {"text": "He poured the coffee into two plain white mugs. Handed me one. Black. No sugar. No milk. Perfect. \u201cYou remembered,\u201d I said. \u201cI told you. I remember things.\u201d Now say \u201cthe coffee\u201d", "lang": "en"}, {"text": "pay attention to the article", "lang": "de"}], [{"text": "Der Kaffee. Masculine", "lang": "de"}, {"text": "\u2013 der Kaffee Now say \u201cthe milk\u201d.", "lang": "en"}], [{"text": "Die Milch. Feminine", "lang": "de"}, {"text": "\u2013 die Milch Now say \u201cthe water\u201d.", "lang": "en"}], [{"text": "Das Wasser. Neuter", "lang": "de"}, {"text": "\u2013 das Wasser One example of each gender. You will see them everywhere. --\u201cSo,\u201d I said. \u201cWhat is the plan?\u201d \u201cPlan?\u201d \u201cFor today. For the week. For me not sleeping on your sofa forever.\u201d He sat on the wooden chair across from me. The plastic one was still empty. \u201cYou need a job,\u201d he said. \u201cI need a lot of things.\u201d \u201cA job first. Money. Then you can find your own place.\u201d Now say \u201cthe job\u201d", "lang": "en"}, {"text": "die Arbeit", "lang": "de"}], [{"text": "Die Arbeit. Feminine.", "lang": "de"}, {"text": "Now say \u201cthe money\u201d", "lang": "en"}, {"text": "das Geld", "lang": "de"}], [{"text": "Das Geld. Neuter.", "lang": "de"}, {"text": "\u201cI did not come here to be a burden,\u201d I said. \u201cYou are not.\u201d \u201cI am sleeping on your sofa.\u201d \u201cYou are sleeping on my sofa because I offered. That is not a burden. That is a choice.\u201d Now say \u201cthe sofa\u201d", "lang": "en"}, {"text": "das Sofa", "lang": "de"}], [{"text": "Das Sofa. Neuter.", "lang": "de"}, {"text": "\u201cWhat kind of job?\u201d I asked. He shrugged. \u201cThere is a caf\u00e9 around the corner. The owner is old. She needs help in the mornings.\u201d \u201cI do not speak German.\u201d \u201cYou do not need to. You just need to carry plates and say bitte and danke. You can learn the rest.\u201d I stared at him. \u201cYou already asked her.\u201d He did not confirm or deny. He just drank his coffee. \u201cYou already asked her, did you not?\u201d He set his mug down. \u201cShe needs someone starting tomorrow. I told her I knew a person.\u201d \u201cYou told her before I even arrived.\u201d \u201cI was optimistic.\u201d Now say \u201cthe caf\u00e9\u201d", "lang": "en"}, {"text": "das Caf\u00e9", "lang": "de"}], [{"text": "Das Caf\u00e9. Neuter. Many borrowed words are neuter.", "lang": "de"}, {"text": "Now say \u201cthe owner\u201d", "lang": "en"}, {"text": "female owner is die Besitzerin", "lang": "de"}], [{"text": "Die Besitzerin. The -in ending marks a female person.", "lang": "de"}, {"text": "I laughed. \u201cYou are insane.\u201d \u201cProbably.\u201d \u201cWhat if I had said no?\u201d \u201cYou did not.\u201d \u201cWhat if I am terrible at carrying plates?\u201d \u201cThen you learn to be less terrible.\u201d Now say \u201cto learn\u201d", "lang": "en"}, {"text": "lernen", "lang": "de"}], [{"text": "Lernen.", "lang": "de"}, {"text": "Now say \u201cI learn German\u201d", "lang": "en"}, {"text": "ich lerne Deutsch", "lang": "de"}], [{"text": "Ich lerne Deutsch.", "lang": "de"}, {"text": "Regular verb conjugation: remove -en, add -e for ich. Ich lerne. Du lernst. Er lernt. --He stood up, rinsed his mug, and came back with a piece of paper \u2013 a handwritten note with an address and a time. \u201cTomorrow,\u201d he said, handing it to me. \u201cNine AM. Do not be late.\u201d I took the paper. His handwriting was small and neat. \u201cYou really do not know me,\u201d I said quietly. He looked at me for a long moment. Then he said something I would replay in my head for weeks. \u201cI know you drink your coffee black. I know you laugh when you are uncomfortable. I know you left home because staying hurt more than leaving. And I know you are still here.\u201d He paused. \u201cThat is enough to start.\u201d Now say \u201cto stay\u201d", "lang": "en"}, {"text": "bleiben", "lang": "de"}], [{"text": "Bleiben.", "lang": "de"}, {"text": "Now say \u201cI stay\u201d", "lang": "en"}, {"text": "ich bleibe", "lang": "de"}], [{"text": "Ich bleibe.", "lang": "de"}, {"text": "Now say \u201cyou stay\u201d", "lang": "en"}, {"text": "du bleibst", "lang": "de"}], [{"text": "Du bleibst.", "lang": "de"}, {"text": "I just held the paper and watched him put on his coat. \u201cThe caf\u00e9 is called Morgenlicht,\u201d he said. \u201cMorning Light. Tell the owner Matei sent you.\u201d \u201cWhat if she asks who I am?\u201d He opened the door. Cold air rushed in. \u201cTell her you are the friend I mentioned.\u201d Then he was gone. Now say \u201cthe morning light\u201d", "lang": "en"}, {"text": "das Morgenlicht", "lang": "de"}], [{"text": "Das Morgenlicht. Morgen (morning) + Licht (light), neuter.", "lang": "de"}, {"text": "Now say \u201cthe friend\u201d", "lang": "en"}, {"text": "der Freund", "lang": "de"}], [{"text": "Der Freund. Masculine. A female friend is die Freundin.", "lang": "de"}, {"text": "I sat in the grey morning light, holding a job offer from a man who called me a friend after knowing me for twelve hours. I drank my coffee. It was cold now. I drank it anyway. The apartment felt different without him. Bigger. Emptier. Now say \u201cthe door\u201d", "lang": "en"}, {"text": "die T\u00fcr", "lang": "de"}], [{"text": "Die T\u00fcr. Feminine.", "lang": "de"}, {"text": "I looked at the key on the table. For you. I picked it up, walked to the door, locked it, unlocked it, locked it again. The mechanism was old \u2013 it stuck a little, required a gentle tug. I memorised the feel of it. Now say \u201cthe key\u201d der Schl\u00fcssel. Review", "lang": "en"}], [{"text": "Der Schl\u00fcssel.", "lang": "de"}, {"text": "At noon, I finally got up. I took a shower. The water pressure was terrible \u2013 a weak stream that took forever to rinse the shampoo out \u2013 but the water was hot, and the bathroom smelled like Matei's soap. Something clean and neutral. Not floral. Just clean. Now say \u201cthe bathroom\u201d", "lang": "en"}, {"text": "das Badezimmer", "lang": "de"}], [{"text": "Das Badezimmer. Bad (bath) + Zimmer (room).", "lang": "de"}, {"text": "Now say \u201cthe soap\u201d", "lang": "en"}, {"text": "die Seife", "lang": "de"}], [{"text": "Die Seife. Feminine.", "lang": "de"}, {"text": "I left the apartment. The stairs were narrower in the daylight. I counted them \u2013 thirty-seven from the fourth floor to the ground. Now say \u201cthe street\u201d", "lang": "en"}, {"text": "die Stra\u00dfe", "lang": "de"}], [{"text": "Die Stra\u00dfe. Feminine. Note the \u00df, a sharp s sound.", "lang": "de"}, {"text": "Now say \u201cthe bakery\u201d", "lang": "en"}, {"text": "die B\u00e4ckerei", "lang": "de"}], [{"text": "Die B\u00e4ckerei. The -ei ending is often feminine.", "lang": "de"}, {"text": "I found the caf\u00e9. Morgenlicht. Three blocks away. A green awning. Chalkboard signs. Through the window, I could see a woman behind the counter. Grey hair. Kind eyes. I stood across the street for a full minute, pretending I was not terrified. Then I crossed. Now say \u201cthe cake\u201d", "lang": "en"}, {"text": "der Kuchen", "lang": "de"}], [{"text": "Der Kuchen. Masculine.", "lang": "de"}, {"text": "The door made a chiming sound. A little bell. \u201cGuten Morgen,\u201d the woman said. I opened my mouth. Closed it. Opened it again. \u201cUm. Matei sent me.\u201d Her face broke into a smile. \u201cAh! Der Freund.\u201d She wiped her hands on her apron and came around the counter. She was shorter than me \u2013 a lot shorter \u2013 and she moved like someone who had been standing behind this counter for decades. \u201cI am sorry,\u201d I said. \u201cI do not speak German. Not really.\u201d She waved a hand. \u201cKein Problem. You speak English. I speak a little. We manage.\u201d \u201cYou are the owner?\u201d \u201cI am Frau Schmidt. And you are Yves.\u201d She said it Eevs, with a soft V. \u201cMatei told me about you.\u201d \u201cWhat did he tell you?\u201d She smiled again. \u201cThat you need work. That you are serious. That you make good coffee.\u201d Now say \u201cno problem\u201d", "lang": "en"}, {"text": "kein Problem", "lang": "de"}], [{"text": "Kein Problem.", "lang": "de"}, {"text": "Now say \u201cgood\u201d", "lang": "en"}, {"text": "gut. Sehr gut \u2013 very good", "lang": "de"}], [{"text": "Gut. Sehr gut.", "lang": "de"}, {"text": "\u201cI can learn,\u201d I said. \u201cI learn fast.\u201d \u201cGut.\u201d She nodded. \u201cThen you start now.\u201d (ambient: espresso machine hiss \u2013 soft, continuous) The next four hours were a blur. Frau Schmidt showed me everything. How to work the espresso machine \u2013 a brass monster that hissed like an angry cat. How to arrange pastries so they looked like art. How to say \u201cWhat would you like?\u201d in German. \u201cWas m\u00f6chten Sie?\u201d she said. I repeated: \u201cWas m\u00f6chten Sie?\u201d Now say \u201cWhat would you like?\u201d formal, to a customer", "lang": "en"}], [{"text": "Was m\u00f6chten Sie? M\u00f6chten is the polite form of wollen (to want). Sie with a capital S is formal \u201cyou\u201d. Now say \u201cI would like a coffee\u201d", "lang": "en"}, {"text": "ich m\u00f6chte einen Kaffee", "lang": "de"}], [{"text": "Ich m\u00f6chte einen Kaffee. Einen because Kaffee is masculine accusative.", "lang": "de"}, {"text": "I dropped a cup. Only one. It shattered on the floor. Frau Schmidt swept it up without comment. \u201cFirst time?\u201d she asked. \u201cFirst day.\u201d \u201cYou will drop more. It is okay.\u201d Now say \u201cthe cup\u201d", "lang": "en"}, {"text": "die Tasse", "lang": "de"}], [{"text": "Die Tasse. Feminine.", "lang": "de"}, {"text": "Now say \u201chere you go\u201d", "lang": "en"}, {"text": "bitte sch\u00f6n", "lang": "de"}], [{"text": "Bitte sch\u00f6n.", "lang": "de"}, {"text": "Now say \u201cthank you very much\u201d", "lang": "en"}, {"text": "danke sch\u00f6n", "lang": "de"}], [{"text": "Danke sch\u00f6n.", "lang": "de"}, {"text": "Now say \u201cexcuse me / sorry\u201d", "lang": "en"}, {"text": "entschuldigung", "lang": "de"}], [{"text": "Entschuldigung.", "lang": "de"}, {"text": "Now say \u201cgoodbye\u201d (casual)", "lang": "en"}, {"text": "tsch\u00fcss", "lang": "de"}], [{"text": "Tsch\u00fcss.", "lang": "de"}, {"text": "By noon, I was exhausted. My feet hurt, my back hurt, my face hurt from smiling. But I had served twelve customers. I had made eight cappuccinos, three lattes, one hot chocolate. Frau Schmidt made me sit down and eat a pastry. Apricot. Warm. Flaky. The best thing I had tasted since I arrived. Now say \u201cthe pastry\u201d", "lang": "en"}, {"text": "das Geb\u00e4ck", "lang": "de"}], [{"text": "Das Geb\u00e4ck. Neuter.", "lang": "de"}, {"text": "Now say \u201cthe apricot\u201d", "lang": "en"}, {"text": "die Aprikose", "lang": "de"}], [{"text": "Die Aprikose.", "lang": "de"}, {"text": "\u201cYou did good,\u201d Frau Schmidt said, sitting across from me. \u201cI dropped a cup.\u201d \u201cI dropped ten my first day. You will drop more. This is the way.\u201d I ate another bite. \u201cFrau Schmidt?\u201d \u201cJa?\u201d \u201cWhat did Matei actually say about me?\u201d She tilted her head. \u201cHe said you were a friend. That you came from far away. That you needed a chance.\u201d \u201cThat is all?\u201d \u201cThat is enough.\u201d She reached across the table and patted my hand. \u201cYou are here now. The rest is just work.\u201d Now say \u201cthe chance\u201d", "lang": "en"}, {"text": "die Chance", "lang": "de"}], [{"text": "Die Chance. Feminine.", "lang": "de"}, {"text": "Now say \u201cthe work\u201d die Arbeit. Review", "lang": "en"}], [{"text": "Die Arbeit.", "lang": "de"}, {"text": "I walked back to the apartment at 1 PM. The sun was actually out \u2013 pale, watery, but out. I had money in my pocket. Thirty euros in crumpled bills that smelled like coffee. The first money I had earned in a new country. Now say \u201cthe money\u201d das Geld. Review", "lang": "en"}], [{"text": "Das Geld.", "lang": "de"}, {"text": "Now say \u201cthirty euros\u201d", "lang": "en"}, {"text": "drei\u00dfig Euro", "lang": "de"}], [{"text": "Drei\u00dfig Euro. --The stairs were still thirty-seven steps. The key still stuck. The apartment was empty when I opened the door. Matei was not there. Of course he was not. He had a job, a life. But the silence felt louder than it had yesterday. I put the groceries away. Made a sandwich. Sat on the wooden chair and ate it while staring at the wall. Now say \u201cthe sandwich\u201d", "lang": "en"}, {"text": "das Sandwich", "lang": "de"}], [{"text": "Das Sandwich. Neuter.", "lang": "de"}, {"text": "Now say \u201cthe wall\u201d", "lang": "en"}, {"text": "die Wand", "lang": "de"}], [{"text": "Die Wand. Feminine.", "lang": "de"}, {"text": "I pulled out my notebook. Day 2. First day at Morgenlicht. I dropped one cup. Frau Schmidt did not fire me. I learned: Bitte sch\u00f6n, Danke sch\u00f6n, Entschuldigung, Tsch\u00fcss. Matei was not here when I got back. I do not know why that bothers me. Now say \u201cto bother me\u201d", "lang": "en"}, {"text": "mich st\u00f6ren", "lang": "de"}], [{"text": "Mich st\u00f6ren. Das st\u00f6rt mich", "lang": "de"}, {"text": "\u2013 that bothers me --At 2 PM, I put on my coat and went out again. Berlin was different in the afternoon. Less grey. More alive. I walked without a destination. Past a park where kids were playing soccer. Past a bookstore with a display of books in the window \u2013 all German, all incomprehensible, all beautiful. Past a man playing guitar on a corner. Now say \u201cthe park\u201d", "lang": "en"}, {"text": "der Park", "lang": "de"}], [{"text": "Der Park. Masculine.", "lang": "de"}, {"text": "Now say \u201cthe bookstore\u201d", "lang": "en"}, {"text": "die Buchhandlung", "lang": "de"}], [{"text": "Die Buchhandlung. Buch (book) + Handlung (shop).", "lang": "de"}, {"text": "I found myself at a bridge. A small one, over a canal. The water was greenish-brown and moved slowly. I leaned on the railing and watched a duck paddle in circles. Now say \u201cthe bridge\u201d", "lang": "en"}, {"text": "die Br\u00fccke", "lang": "de"}], [{"text": "Die Br\u00fccke. Feminine.", "lang": "de"}, {"text": "Now say \u201cthe duck\u201d", "lang": "en"}, {"text": "die Ente", "lang": "de"}], [{"text": "Die Ente. Feminine.", "lang": "de"}, {"text": "This was my city now. My bridge. My duck. It felt fake \u2013 like playing a role in a movie about someone else's life. But I was here. And I had not run away yet. Now say \u201cthe city\u201d", "lang": "en"}, {"text": "die Stadt", "lang": "de"}], [{"text": "Die Stadt. Feminine.", "lang": "de"}, {"text": "My phone buzzed. Unknown number. How was the first day? I stared. No one had my number. No one except \u2013 I scrolled up. The last message was from Matei, two years ago. But this number was different. German. Matei? I typed. Who else? How did you get my number? You gave it to me. Two years ago. In a message. I laughed. The duck looked at me. Now say \u201cthe phone\u201d", "lang": "en"}, {"text": "das Handy", "lang": "de"}], [{"text": "Das Handy. Neuter.", "lang": "de"}, {"text": "Now say \u201cthe number\u201d", "lang": "en"}, {"text": "die Nummer", "lang": "de"}], [{"text": "Die Nummer. Feminine.", "lang": "de"}, {"text": "You remember everything, I typed. I told you. I remember things. Did you eat? I made a sandwich. That is not food. It was bread and cheese. That is food. Come to the bookstore at 7. I will buy you dinner. Okay. Do not be late. I am never late. You were late at the airport. The plane was early. That is different. Now say \u201cto eat\u201d", "lang": "en"}, {"text": "essen", "lang": "de"}], [{"text": "Essen.", "lang": "de"}, {"text": "Now say \u201cI eat\u201d", "lang": "en"}, {"text": "ich esse", "lang": "de"}], [{"text": "Ich esse.", "lang": "de"}, {"text": "Now say \u201cyou eat\u201d", "lang": "en"}, {"text": "du isst. (Stem change: essen \u2192 isst for du and er/sie/es.)", "lang": "de"}], [{"text": "Du isst.", "lang": "de"}, {"text": "At 6:30, I started getting ready. I put on the other sweater \u2013 dark grey, no holes yet \u2013 and tried to do something with my hair. It looked the same. It always looked the same. I looked at myself in the bathroom mirror. You are going to dinner with a man who gave you a key and a job and said you were not alone. That is not a date, I told my reflection. Then why are you nervous? Now say \u201cthe mirror\u201d", "lang": "en"}, {"text": "der Spiegel", "lang": "de"}], [{"text": "Der Spiegel. Masculine.", "lang": "de"}, {"text": "Now say \u201cnervous\u201d", "lang": "en"}, {"text": "nerv\u00f6s", "lang": "de"}], [{"text": "Nerv\u00f6s. Ich bin nerv\u00f6s. --The bookstore was on the corner. B\u00fccher & Co. A sign in the window said Englische B\u00fccher \u2013 English books. Matei was standing outside. Hands in his pockets. When he saw me, he did not wave. He just nodded. \u201cYou are not late,\u201d he said. \u201cI told you.\u201d \u201cYou also told me you made a sandwich for lunch. I am still judging you for that.\u201d Now say \u201cthe bookstore\u201d die Buchhandlung. Review", "lang": "en"}], [{"text": "Die Buchhandlung.", "lang": "de"}, {"text": "We walked inside. It was warm. Smelled like paper and coffee \u2013 a small caf\u00e9 in the back. \u201cYou work here?\u201d I asked. \u201cSometimes. Poetry readings, book launches. Nothing exciting.\u201d \u201cIt is a bookstore. It is automatically exciting.\u201d He looked at me. \u201cYou like books?\u201d \u201cI like stories.\u201d \u201cSame thing.\u201d \u201cNo.\u201d I sat down. \u201cBooks are the containers. Stories are what fill them.\u201d Now say \u201cthe book\u201d", "lang": "en"}, {"text": "das Buch", "lang": "de"}], [{"text": "Das Buch. Plural: die B\u00fccher.", "lang": "de"}, {"text": "Now say \u201cthe story\u201d die Geschichte. Review", "lang": "en"}], [{"text": "Die Geschichte.", "lang": "de"}, {"text": "A woman came to the table. Matei ordered in German. She left. \u201cI ordered for you,\u201d he said. \u201cBold.\u201d \u201cYou do not know the words for the food yet. I saved you the embarrassment.\u201d Now say \u201cthe food\u201d das Essen. Review", "lang": "en"}], [{"text": "Das Essen.", "lang": "de"}, {"text": "The food came. Potatoes, sausage, a dark sauce that tasted like winter. I ate slowly, watching him watch the street through the window. \u201cMatei.\u201d \u201cWhat?\u201d \u201cWhy do you remember everything?\u201d He was quiet for a moment. \u201cBecause most people do not,\u201d he said. \u201cThey forget. But the small things \u2013 the things people think do not matter \u2013 those are the things that tell you who they are.\u201d \u201cAnd you want to know who people are.\u201d \u201cI want to know who you are.\u201d Now say \u201cto remember\u201d sich erinnern. Review", "lang": "en"}], [{"text": "Sich erinnern. Ich erinnere mich. Now say \u201cto forget\u201d", "lang": "en"}, {"text": "vergessen", "lang": "de"}], [{"text": "Vergessen. Ich habe vergessen.", "lang": "de"}, {"text": "We finished dinner. He paid before I could reach for my pocket. \u201cTomorrow, you work again.\u201d \u201c9 AM.\u201d \u201cI will be gone before you wake up.\u201d \u201cI noticed.\u201d \u201cDoes that bother you?\u201d I considered lying. Decided not to. \u201cA little,\u201d I said. He nodded. \u201cGood.\u201d \u201cWhy is that good?\u201d \u201cBecause I would be bothered if you were not bothered.\u201d Now say \u201cthe bill\u201d", "lang": "en"}, {"text": "die Rechnung", "lang": "de"}], [{"text": "Die Rechnung. Die Rechnung, bitte", "lang": "de"}, {"text": "\u2013 the bill, please Now say \u201cto pay\u201d", "lang": "en"}, {"text": "zahlen. Ich m\u00f6chte zahlen \u2013 I would like to pay", "lang": "de"}, {"text": "We walked back together. Not touching. But close. Close enough that our shoulders almost brushed. The stairs were thirty-seven steps. The key stuck. The apartment was dark. \u201cGood night, Yves.\u201d \u201cGood night, Matei.\u201d I lay down in the bed. He lay down on the sofa. I listened to him breathe until I fell asleep. Now say \u201cto listen\u201d", "lang": "en"}, {"text": "zuh\u00f6ren", "lang": "de"}], [{"text": "Zuh\u00f6ren. Ich h\u00f6re zu", "lang": "de"}, {"text": "\u2013 I listen --Dual-layer vocabulary review \u2013 Chapter 2 Layer 1 \u2013 Words", "lang": "en"}, {"text": "Ich bin m\u00fcde", "lang": "de"}, {"text": "\u2013 I am tired. <break time=\"2s\"/> Ich bin m\u00fcde", "lang": "en"}, {"text": "Ich bin hungrig", "lang": "de"}, {"text": "\u2013 I am hungry. <break time=\"2s\"/> Ich bin hungrig", "lang": "en"}, {"text": "Guten Morgen", "lang": "de"}, {"text": "\u2013 good morning. <break time=\"2s\"/> Guten Morgen", "lang": "en"}, {"text": "Der Kaffee", "lang": "de"}, {"text": "\u2013 the coffee. <break time=\"2s\"/> Der Kaffee", "lang": "en"}, {"text": "Die Milch", "lang": "de"}, {"text": "\u2013 the milk. <break time=\"2s\"/> Die Milch", "lang": "en"}, {"text": "Das Wasser", "lang": "de"}, {"text": "\u2013 the water. <break time=\"2s\"/> Das Wasser", "lang": "en"}, {"text": "Die Arbeit", "lang": "de"}, {"text": "\u2013 the job / work. <break time=\"2s\"/> Die Arbeit", "lang": "en"}, {"text": "Das Geld", "lang": "de"}, {"text": "\u2013 the money. <break time=\"2s\"/> Das Geld", "lang": "en"}, {"text": "Das Sofa", "lang": "de"}, {"text": "\u2013 the sofa. <break time=\"2s\"/> Das Sofa", "lang": "en"}, {"text": "Das Caf\u00e9", "lang": "de"}, {"text": "\u2013 the caf\u00e9. <break time=\"2s\"/> Das Caf\u00e9", "lang": "en"}, {"text": "Lernen", "lang": "de"}, {"text": "\u2013 to learn. <break time=\"2s\"/> Lernen", "lang": "en"}, {"text": "Ich lerne Deutsch", "lang": "de"}, {"text": "\u2013 I learn German. <break time=\"2s\"/> Ich lerne Deutsch", "lang": "en"}, {"text": "Bleiben", "lang": "de"}, {"text": "\u2013 to stay. <break time=\"2s\"/> Bleiben", "lang": "en"}, {"text": "Ich bleibe", "lang": "de"}, {"text": "\u2013 I stay. <break time=\"2s\"/> Ich bleibe", "lang": "en"}, {"text": "Der Freund / die Freundin", "lang": "de"}, {"text": "\u2013 friend (male/female). <break time=\"2s\"/> Der Freund", "lang": "en"}, {"text": "Die T\u00fcr", "lang": "de"}, {"text": "\u2013 the door. <break time=\"2s\"/> Die T\u00fcr", "lang": "en"}, {"text": "Das Badezimmer", "lang": "de"}, {"text": "\u2013 the bathroom. <break time=\"2s\"/> Das Badezimmer", "lang": "en"}, {"text": "Die Stra\u00dfe", "lang": "de"}, {"text": "\u2013 the street. <break time=\"2s\"/> Die Stra\u00dfe", "lang": "en"}, {"text": "Die B\u00e4ckerei", "lang": "de"}, {"text": "\u2013 the bakery. <break time=\"2s\"/> Die B\u00e4ckerei", "lang": "en"}, {"text": "Der Kuchen", "lang": "de"}, {"text": "\u2013 the cake. <break time=\"2s\"/> Der Kuchen Nerv\u00f6s \u2013 nervous. <break time=\"2s\"/> Nerv\u00f6s. Ich bin nerv\u00f6s.", "lang": "en"}, {"text": "Das Licht", "lang": "de"}, {"text": "\u2013 the light. <break time=\"2s\"/> Das Licht", "lang": "en"}, {"text": "Heute", "lang": "de"}, {"text": "\u2013 today. <break time=\"2s\"/> Heute", "lang": "en"}, {"text": "Heute lerne ich Deutsch", "lang": "de"}, {"text": "\u2013 today I learn German. <break time=\"2s\"/> Heute lerne ich Deutsch.", "lang": "en"}, {"text": "Die Br\u00fccke", "lang": "de"}, {"text": "\u2013 the bridge. <break time=\"2s\"/> Die Br\u00fccke", "lang": "en"}, {"text": "Die Ente", "lang": "de"}, {"text": "\u2013 the duck. <break time=\"2s\"/> Die Ente", "lang": "en"}, {"text": "Die Stadt", "lang": "de"}, {"text": "\u2013 the city. <break time=\"2s\"/> Die Stadt", "lang": "en"}, {"text": "Das Handy", "lang": "de"}, {"text": "\u2013 the mobile phone. <break time=\"2s\"/> Das Handy", "lang": "en"}, {"text": "Die Nummer", "lang": "de"}, {"text": "\u2013 the number. <break time=\"2s\"/> Die Nummer", "lang": "en"}, {"text": "Essen", "lang": "de"}, {"text": "\u2013 to eat / the food. <break time=\"2s\"/> Essen. Ich esse", "lang": "en"}, {"text": "Der Spiegel", "lang": "de"}, {"text": "\u2013 the mirror. <break time=\"2s\"/> Der Spiegel", "lang": "en"}, {"text": "Die Buchhandlung", "lang": "de"}, {"text": "\u2013 the bookstore. <break time=\"2s\"/> Die Buchhandlung", "lang": "en"}, {"text": "Das Buch", "lang": "de"}, {"text": "\u2013 the book. <break time=\"2s\"/> Das Buch", "lang": "en"}, {"text": "Die Geschichte", "lang": "de"}, {"text": "\u2013 the story. <break time=\"2s\"/> Die Geschichte", "lang": "en"}, {"text": "Vergessen", "lang": "de"}, {"text": "\u2013 to forget. <break time=\"2s\"/> Vergessen. Ich habe vergessen", "lang": "en"}, {"text": "Die Rechnung", "lang": "de"}, {"text": "\u2013 the bill. <break time=\"2s\"/> Die Rechnung. Die Rechnung, bitte Zahlen \u2013 to pay. <break time=\"2s\"/> Zahlen. Ich m\u00f6chte zahlen.", "lang": "en"}, {"text": "Zuh\u00f6ren", "lang": "de"}, {"text": "\u2013 to listen. <break time=\"2s\"/> Zuh\u00f6ren. Ich h\u00f6re zu Layer 2 \u2013 Story phrases \"Ich bin m\u00fcde.\" \u2013 I am tired. <break time=\"2s\"/> Ich bin m\u00fcde. \"Ich lerne Deutsch.\" \u2013 I learn German. <break time=\"2s\"/> Ich lerne Deutsch. \"Bleibst du?\" \u2013 Are you staying? <break time=\"2s\"/> Bleibst du? \"Das Caf\u00e9 hei\u00dft Morgenlicht.\" \u2013 The caf\u00e9 is called Morning Light. <break time=\"2s\"/> Das Caf\u00e9 hei\u00dft Morgenlicht. \"Ich bin nerv\u00f6s.\" \u2013 I am nervous. <break time=\"2s\"/> Ich bin nerv\u00f6s. \"Heute lerne ich Deutsch.\" \u2013 Today I learn German. <break time=\"2s\"/> Heute lerne ich Deutsch. \"Die Rechnung, bitte.\" \u2013 The bill, please. <break time=\"2s\"/> Die Rechnung, bitte. \"Ich h\u00f6re zu.\" \u2013 I am listening. <break time=\"2s\"/> Ich h\u00f6re zu. --End of Chapter 2. --Chapter 3 \u2013 Six O'Clock (A1-A2) (Narrator voice, calm, clear. Ambient: soft footsteps on stairs, distant door creak, rain against window.) I spent the afternoon trying not to watch the door. The apartment was small. The door was right there, three metres from the sofa. Every time a neighbour walked up the stairs, I looked up. Every time someone laughed in the hallway, I held my breath. By five thirty, I had given up pretending and was just openly staring at the brass handle. At 5:47, the stairs creaked. Footsteps. Slow, deliberate. I recognised them. Which was insane, because I had only heard him walk once last night. But I recognised them anyway. The key turned. The door opened. Matei stepped inside, bringing a gust of cold air and the smell of the street \u2013 diesel, rain, something baking from the bakery downstairs. Now say \u201cthe door\u201d die T\u00fcr. Review", "lang": "en"}], [{"text": "Die T\u00fcr.", "lang": "de"}, {"text": "Now say \u201cthe key\u201d der Schl\u00fcssel. Review", "lang": "en"}], [{"text": "Der Schl\u00fcssel.", "lang": "de"}, {"text": "\u201cYou are still here,\u201d he said. \u201cYou sound surprised.\u201d \u201cI am not surprised. I am just... noticing.\u201d He walked to the kitchen. I heard him open the fridge. Then the freezer. Then the fridge again. \u201cI did not buy food,\u201d he said. \u201cI noticed.\u201d \u201cI was going to buy food.\u201d \u201cBut you did not.\u201d He turned around. His expression was almost embarrassed \u2013 a faint flush at the tops of his cheeks. \u201cI forgot.\u201d Now say \u201cto forget\u201d", "lang": "en"}, {"text": "vergessen", "lang": "de"}], [{"text": "Vergessen.", "lang": "de"}, {"text": "Now say \u201cI forgot\u201d", "lang": "en"}, {"text": "ich habe vergessen", "lang": "de"}], [{"text": "Ich habe vergessen. Haben + past participle", "lang": "de"}, {"text": "\u2013 this is the Perfekt tense, the spoken past. You will see it more as the story goes on. Now say \u201cyou forgot\u201d", "lang": "en"}, {"text": "du hast vergessen", "lang": "de"}], [{"text": "Du hast vergessen.", "lang": "de"}, {"text": "\u201cThere is a supermarket around the corner,\u201d I said. \u201cI saw it when I went out.\u201d \u201cYou went out?\u201d \u201cTo find the caf\u00e9. The one you got me the job at.\u201d \u201cAh.\u201d He nodded slowly. \u201cAnd?\u201d \u201cIt exists. Green awning. Smells like bread from three blocks away.\u201d \u201cThat is the one.\u201d Now say \u201cthe supermarket\u201d", "lang": "en"}, {"text": "der Supermarkt", "lang": "de"}], [{"text": "Der Supermarkt. Masculine.", "lang": "de"}, {"text": "Now say \u201cthe bread\u201d das Brot. Review", "lang": "en"}], [{"text": "Das Brot.", "lang": "de"}, {"text": "\u201cI can cook,\u201d I said. \u201cIf you buy the food.\u201d He raised an eyebrow. \u201cYou can cook?\u201d \u201cI can cook. Do not look so surprised.\u201d \u201cYou just arrived in a country where you do not speak the language, you are sleeping on a stranger's sofa, and you are telling me you can cook.\u201d \u201cI am full of surprises.\u201d He almost smiled again. He grabbed his coat. \u201cCome on.\u201d Now say \u201cto cook\u201d", "lang": "en"}, {"text": "kochen", "lang": "de"}], [{"text": "Kochen. Now say \u201cI cook\u201d", "lang": "en"}, {"text": "ich koche", "lang": "de"}], [{"text": "Ich koche.", "lang": "de"}, {"text": "Now say \u201cyou cook\u201d", "lang": "en"}, {"text": "du kochst", "lang": "de"}], [{"text": "Du kochst.", "lang": "de"}, {"text": "The supermarket was called Netto. Fluorescent lights, linoleum floors, shopping carts with wonky wheels. But it was warm, and it had food, and Matei walked through the aisles like a man on a mission. I followed with a basket. He threw things in without looking at prices. Pasta. Tomatoes. A tube of tomato paste. Onions. Garlic. A block of parmesan that cost more than my entire outfit. Now say \u201cthe pasta\u201d die Nudeln (plural)", "lang": "en"}], [{"text": "Die Nudeln.", "lang": "de"}, {"text": "Now say \u201cthe tomato\u201d", "lang": "en"}, {"text": "die Tomate", "lang": "de"}], [{"text": "Die Tomate. Plural: die Tomaten.", "lang": "de"}, {"text": "Now say \u201cthe onion\u201d", "lang": "en"}, {"text": "die Zwiebel", "lang": "de"}], [{"text": "Die Zwiebel. Plural: die Zwiebeln.", "lang": "de"}, {"text": "Now say \u201cthe garlic\u201d", "lang": "en"}, {"text": "der Knoblauch", "lang": "de"}], [{"text": "Der Knoblauch. Masculine.", "lang": "de"}, {"text": "Now say \u201cthe cheese\u201d der K\u00e4se. Review", "lang": "en"}], [{"text": "Der K\u00e4se.", "lang": "de"}, {"text": "At the register, the cashier said something fast in German. Matei answered. She looked at me. \u201cShe is asking if you have a loyalty card,\u201d Matei said. \u201cSay Nein, danke.\u201d I looked at the cashier. \u201cNein, danke,\u201d I said. She nodded. I exhaled. Now say \u201cno, thank you\u201d", "lang": "en"}, {"text": "nein, danke", "lang": "de"}], [{"text": "Nein, danke.", "lang": "de"}, {"text": "Now say \u201cyes, please\u201d", "lang": "en"}, {"text": "ja, bitte", "lang": "de"}], [{"text": "Ja, bitte.", "lang": "de"}, {"text": "Back at the apartment, I took over the kitchen. It was not much of a kitchen \u2013 two burners, a sink, a mini-fridge. But the knife was sharp, and the pot was the right size, and I had made this sauce a hundred times in a dozen different kitchens. My grandmother's recipe. Matei sat on the plastic chair and watched me chop onions. \u201cYou are staring,\u201d I said, not looking up. \u201cI am observing. There is a difference.\u201d \u201cThat is my line.\u201d \u201cI know.\u201d His voice was quiet. \u201cI liked it.\u201d Now say \u201cthe kitchen\u201d", "lang": "en"}, {"text": "die K\u00fcche", "lang": "de"}], [{"text": "Die K\u00fcche. Feminine.", "lang": "de"}, {"text": "Now say \u201cthe knife\u201d", "lang": "en"}, {"text": "das Messer", "lang": "de"}], [{"text": "Das Messer. Neuter.", "lang": "de"}, {"text": "Now say \u201cthe pot\u201d", "lang": "en"}, {"text": "der Topf", "lang": "de"}], [{"text": "Der Topf. Masculine.", "lang": "de"}, {"text": "The sauce came together the way it always did \u2013 onions first, until soft and golden, then garlic, then the tomatoes, then a long, slow simmer while the pasta water boiled. The kitchen got hot and steamy. The whole apartment started to smell like my childhood, which was a strange thing to experience in Berlin, in a stranger's kitchen, with a man watching me from a plastic chair. \u201cYou have done this before,\u201d Matei said. \u201cOnce or twice.\u201d \u201cMore than once or twice.\u201d I stirred the sauce. \u201cMy grandmother taught me. She said a man who can cook will never starve and will never be alone.\u201d \u201cShe sounds wise.\u201d \u201cShe sounds like she wanted me to get married.\u201d He made a sound \u2013 not quite a laugh, but close. \u201cDid it work?\u201d \u201cI am here, am I not? Alone. Cooking for a stranger.\u201d The word alone hung in the air. Now say \u201calone\u201d", "lang": "en"}, {"text": "allein", "lang": "de"}], [{"text": "Allein. Ich bin allein \u2013 I am alone Now say \u201cnot alone\u201d", "lang": "en"}, {"text": "nicht allein", "lang": "de"}], [{"text": "Nicht allein.", "lang": "de"}, {"text": "Matei stood up. He walked to the kitchen \u2013 the three steps it took \u2013 and stood next to me at the counter. Close enough that I could feel the heat from his arm. \u201cYou are not alone right now,\u201d he said. I did not look at him. I stared at the sauce. It was bubbling, which meant I should turn down the heat, but my hand would not move. \u201cYou do not know me,\u201d I said again. \u201cI know enough.\u201d \u201cThat is not the same as knowing someone.\u201d He was quiet for a moment. Then he said, \u201cNo. It is not. But it is a start.\u201d Now say \u201cto know (a person)\u201d", "lang": "en"}, {"text": "kennen", "lang": "de"}], [{"text": "Kennen.", "lang": "de"}, {"text": "Now say \u201cI know you\u201d", "lang": "en"}, {"text": "ich kenne dich", "lang": "de"}], [{"text": "Ich kenne dich. Dich is the accusative form of du. When you know someone, they are the object.", "lang": "de"}, {"text": "We ate at the table. The two mismatched chairs \u2013 me on the wooden one, him on the plastic one. The lamp cast a yellow circle of light over our plates. The pasta was good \u2013 not great, but good. The sauce had simmered long enough. The cheese was expensive enough to taste like actual cheese instead of sawdust. Matei ate slowly. Methodically. He twirled the pasta around his fork like he had been taught to do it properly, which was more than I could say for myself. \u201cThis is good,\u201d he said. \u201cYou sound surprised.\u201d \u201cI am not surprised. I am... acknowledging.\u201d \u201cSame thing.\u201d \u201cNo.\u201d He set his fork down. \u201cSurprised means I did not expect it. Acknowledging means I knew you could do it, and now I am saying thank you.\u201d Now say \u201cthank you for the meal\u201d", "lang": "en"}, {"text": "danke f\u00fcr das Essen", "lang": "de"}], [{"text": "Danke f\u00fcr das Essen. Essen means food or meal. It is also the verb \u201cto eat\u201d.", "lang": "de"}, {"text": "Now say \u201cthe table\u201d", "lang": "en"}, {"text": "der Tisch", "lang": "de"}], [{"text": "Der Tisch. Masculine.", "lang": "de"}, {"text": "\u201cI do not remember telling you about my grandmother's pasta,\u201d I said. \u201cYou did. Two years ago. You said her pasta was the only thing that made you feel like you had a home.\u201d The fork in my hand stopped halfway to my mouth. \u201cI said that?\u201d \u201cYou said a lot of things.\u201d I set the fork down. My appetite was gone. Not because the food was bad \u2013 it was not \u2013 but because I was realising, slowly and painfully, that Matei had been paying attention. To everything. To throwaway lines from two years ago. To the way I drank my coffee. To the fact that I was sad at the airport even though I was smiling. Now say \u201chome\u201d", "lang": "en"}, {"text": "das Zuhause", "lang": "de"}], [{"text": "Das Zuhause. Neuter.", "lang": "de"}, {"text": "Now say \u201cI have no home\u201d", "lang": "en"}, {"text": "ich habe kein Zuhause", "lang": "de"}], [{"text": "Ich habe kein Zuhause. Kein negates nouns. Here, Zuhause is neuter, so kein stays kein. For masculine, it", "lang": "de"}, {"text": "would be keinen. --\u201cWhy do you remember all of that?\u201d I asked. He chewed. Swallowed. Took a sip of water. Then he looked at me, and for the first time, he did not look calm. He looked uncertain. \u201cBecause no one had ever told me anything like that before,\u201d he said. \u201cAnd I wanted to know why.\u201d \u201cWhy what?\u201d \u201cWhy you sounded so lonely.\u201d The word hit me like a door slamming. Lonely. Not sad. Not tired. Lonely. Now say \u201clonely\u201d", "lang": "en"}, {"text": "einsam", "lang": "de"}], [{"text": "Einsam. Ich bin einsam", "lang": "de"}, {"text": "\u2013 I am lonely Now say \u201csad\u201d", "lang": "en"}, {"text": "traurig", "lang": "de"}], [{"text": "Traurig. Ich bin traurig", "lang": "de"}, {"text": "\u2013 I am sad --\u201cI am not lonely,\u201d I said. Matei did not call me out. He just nodded, finished his pasta, and took his plate to the sink. \u201cThank you for dinner,\u201d he said. \u201cIt was the best meal I have had in months.\u201d \u201cThat is sad.\u201d \u201cProbably. But true.\u201d Now say \u201cto know (a fact)\u201d", "lang": "en"}, {"text": "wissen", "lang": "de"}], [{"text": "Wissen.", "lang": "de"}, {"text": "Now say \u201cI do not know\u201d", "lang": "en"}, {"text": "ich wei\u00df nicht", "lang": "de"}], [{"text": "Ich wei\u00df nicht.", "lang": "de"}, {"text": "Wei\u00df is the first-person form of wissen. It is irregular. Just memorise: ich wei\u00df, ich wei\u00df nicht. --I sat at the table for a long time after he had gone to the bathroom. The lamp buzzed. The radiator clicked. Somewhere downstairs, the bakery was closing \u2013 the metal grate scraping down. I had come to Berlin to get away from people who knew me. I had come to be anonymous, to start over. But Matei already knew me. Not the facts \u2013 the surface things. He knew the shape of me. The lonely parts. The parts that drank black coffee and made pasta from memory. I did not know if that was a good thing or a terrible thing. Now say \u201cto know (a fact)\u201d again", "lang": "en"}, {"text": "wissen. Ich wei\u00df nicht", "lang": "de"}], [{"text": "Ich wei\u00df nicht.", "lang": "de"}, {"text": "I picked up my plate. Walked it to the sink. Rinsed it. Dried it. Put it in the cabinet. Then I went back to the sofa. He did not go back to the plastic chair. He sat on the other end of the sofa \u2013 the end that was not stained, the end that faced the window. The cushion sank under his weight. \u201cTomorrow,\u201d he said, \u201cyou start at the caf\u00e9.\u201d \u201cTomorrow,\u201d I agreed. \u201cAre you nervous?\u201d \u201cTerrified.\u201d He nodded like that was the right answer. \u201cGood. Terror means you care.\u201d \u201cOr it means I have anxiety.\u201d \u201cSame thing.\u201d Now say \u201cscared\u201d", "lang": "en"}, {"text": "ver\u00e4ngstigt", "lang": "de"}], [{"text": "Ver\u00e4ngstigt. Ich bin ver\u00e4ngstigt \u2013 I am scared. --I laughed. He did not. But his hand was on the cushion between us, close enough that I could see the veins on the back of it, the small scar on his thumb. \u201cMatei.\u201d \u201cWhat?\u201d \u201cWhy did you really give me the key?\u201d He did not answer right away. The room was dark except for the lamp. His profile was sharp against the window. \u201cBecause I wanted you to come back,\u201d he said finally. \u201cCome back from where?\u201d \u201cFrom wherever you were going to go after you left my apartment.\u201d \u201cI was not going anywhere.\u201d \u201cYou were.\u201d He turned to look at me. \u201cYou have that look. The look of someone who is always planning their exit. I wanted to give you a reason to stay.\u201d Now say \u201cthe reason\u201d", "lang": "en"}, {"text": "der Grund", "lang": "de"}], [{"text": "Der Grund. Masculine.", "lang": "de"}, {"text": "Now say \u201cto stay\u201d", "lang": "en"}, {"text": "bleiben. Ich bleibe", "lang": "de"}], [{"text": "Bleiben. Ich bleibe.", "lang": "de"}, {"text": "My heart was doing something stupid in my chest. \u201cYou do not even know me,\u201d I said for the third time. He reached out. His hand covered mine. Warm. Calloused. \u201cI know you drink your coffee black. I know you laugh when you are uncomfortable. I know you left home because staying hurt more than leaving. I know you make pasta like someone who learned from a grandmother who loved you. And I know you are still here.\u201d He paused. \u201cThat is enough to start.\u201d I did not pull my hand away. I should have. But I was tired of retreating. Tired of planning my exit. \u201cOkay,\u201d I said. \u201cOkay?\u201d \u201cOkay. That is enough to start.\u201d His thumb moved across my knuckles. Once. Twice. Then he let go and stood up. \u201cGood night, Yves.\u201d \u201cGood night, Matei.\u201d Now say \u201cto run\u201d", "lang": "en"}, {"text": "laufen", "lang": "de"}], [{"text": "Laufen.", "lang": "de"}, {"text": "Now say \u201cI do not run\u201d", "lang": "en"}, {"text": "ich laufe nicht", "lang": "de"}], [{"text": "Ich laufe nicht.", "lang": "de"}, {"text": "He walked to the sofa. Lay down with his back to the room. I lay down in the bed. The sheets still smelled like his detergent. The pillow still held the shape of his head. I stared at the ceiling and listened to him breathe. Steady. Quiet. And for the first time in years, I did not feel like running. I felt like staying. Now say \u201cto stay\u201d one more time", "lang": "en"}, {"text": "bleiben. Ich bleibe", "lang": "de"}], [{"text": "Bleiben. Ich bleibe.", "lang": "de"}, {"text": "Dual-layer vocabulary review \u2013 Chapter 3 Layer 1 \u2013 Words", "lang": "en"}, {"text": "Vergessen", "lang": "de"}, {"text": "\u2013 to forget. <break time=\"2s\"/> Vergessen. Ich habe vergessen", "lang": "en"}, {"text": "Der Supermarkt", "lang": "de"}, {"text": "\u2013 the supermarket. <break time=\"2s\"/> Der Supermarkt", "lang": "en"}, {"text": "Das Brot", "lang": "de"}, {"text": "\u2013 the bread. <break time=\"2s\"/> Das Brot Kochen \u2013 to cook. <break time=\"2s\"/> Kochen. Ich koche.", "lang": "en"}, {"text": "Die Nudeln", "lang": "de"}, {"text": "\u2013 the pasta (plural). <break time=\"2s\"/> Die Nudeln", "lang": "en"}, {"text": "Die Tomate", "lang": "de"}, {"text": "\u2013 the tomato. <break time=\"2s\"/> Die Tomate", "lang": "en"}, {"text": "Die Zwiebel", "lang": "de"}, {"text": "\u2013 the onion. <break time=\"2s\"/> Die Zwiebel", "lang": "en"}, {"text": "Der Knoblauch", "lang": "de"}, {"text": "\u2013 the garlic. <break time=\"2s\"/> Der Knoblauch", "lang": "en"}, {"text": "Der K\u00e4se", "lang": "de"}, {"text": "\u2013 the cheese. <break time=\"2s\"/> Der K\u00e4se", "lang": "en"}, {"text": "Nein, danke", "lang": "de"}, {"text": "\u2013 no, thank you. <break time=\"2s\"/> Nein, danke", "lang": "en"}, {"text": "Ja, bitte", "lang": "de"}, {"text": "\u2013 yes, please. <break time=\"2s\"/> Ja, bitte", "lang": "en"}, {"text": "Die K\u00fcche", "lang": "de"}, {"text": "\u2013 the kitchen. <break time=\"2s\"/> Die K\u00fcche", "lang": "en"}, {"text": "Das Messer", "lang": "de"}, {"text": "\u2013 the knife. <break time=\"2s\"/> Das Messer", "lang": "en"}, {"text": "Der Topf", "lang": "de"}, {"text": "\u2013 the pot. <break time=\"2s\"/> Der Topf", "lang": "en"}, {"text": "Allein", "lang": "de"}, {"text": "\u2013 alone. <break time=\"2s\"/> Allein. Ich bin allein", "lang": "en"}, {"text": "Kennen", "lang": "de"}, {"text": "\u2013 to know (a person). <break time=\"2s\"/> Kennen. Ich kenne dich", "lang": "en"}, {"text": "Wissen", "lang": "de"}, {"text": "\u2013 to know (a fact). <break time=\"2s\"/> Wissen. Ich wei\u00df nicht", "lang": "en"}, {"text": "Der Tisch", "lang": "de"}, {"text": "\u2013 the table. <break time=\"2s\"/> Der Tisch", "lang": "en"}, {"text": "Das Zuhause", "lang": "de"}, {"text": "\u2013 home. <break time=\"2s\"/> Das Zuhause", "lang": "en"}, {"text": "Einsam", "lang": "de"}, {"text": "\u2013 lonely. <break time=\"2s\"/> Einsam. Ich bin einsam", "lang": "en"}, {"text": "Traurig", "lang": "de"}, {"text": "\u2013 sad. <break time=\"2s\"/> Traurig. Ich bin traurig", "lang": "en"}, {"text": "Der Grund", "lang": "de"}, {"text": "\u2013 the reason. <break time=\"2s\"/> Der Grund", "lang": "en"}, {"text": "Laufen", "lang": "de"}, {"text": "\u2013 to run. <break time=\"2s\"/> Laufen. Ich laufe nicht Layer 2 \u2013 Story phrases \"Ich habe vergessen.\" \u2013 I forgot. <break time=\"2s\"/> Ich habe vergessen. \"Wir kochen zusammen.\" \u2013 We cook together. <break time=\"2s\"/> Wir kochen zusammen. \"Nein, danke, ich brauche nichts.\" \u2013 No, thank you, I don't need anything. <break time=\"2s\"/> Nein, danke. \"Ich bin allein.\" \u2013 I am alone. <break time=\"2s\"/> Ich bin allein. \"Ich kenne dich.\" \u2013 I know you. <break time=\"2s\"/> Ich kenne dich. \"Ich wei\u00df nicht.\" \u2013 I do not know. <break time=\"2s\"/> Ich wei\u00df nicht. \"Ich bleibe.\" \u2013 I am staying. <break time=\"2s\"/> Ich bleibe. --End of Chapter 3. Chapters 4, 5, and 6 \u2013 Refined Audio Scripts Here are the next three chapters in the hybrid style: sensory prose, grammar woven into Yves's thoughts, active prompts, dual-layer reviews. --Chapter 4 \u2013 Morning Light (A1) (Narrator voice, calm, clear. Ambient: early morning \u2013 soft birdsong, distant traffic, a dog barking once.) I woke up before my alarm. That never happened. I was the kind of person who hit snooze three times, who negotiated with myself about five more minutes, who treated mornings like an enemy to be defeated through sheer stubbornness. But at 7:15 AM, my eyes opened, and I was fully awake. My first thought was: Matei is still asleep on the sofa. I lay there for a minute, listening. His breathing was slow and deep. He had fallen asleep on his back \u2013 soft rhythm, occasional pause, the way his breath caught when he turned over. The sofa creaked. Then silence again. Now say \u201cto wake up\u201d", "lang": "en"}, {"text": "aufwachen", "lang": "de"}], [{"text": "Aufwachen. This is a separable verb. In a main clause, the prefix auf goes to the end: Ich wache um 7 Uhr auf \u2013 I wake up at 7 o'clock. Now say \u201cI wake up at 7\u201d", "lang": "en"}, {"text": "ich wache um 7 Uhr auf", "lang": "de"}], [{"text": "Ich wache um 7 Uhr auf. Good. The auf is at the end.", "lang": "de"}, {"text": "I got up quietly. The floorboards were cold under my bare feet. I stepped around the creaky spots \u2013 I had mapped them last night, because that was the kind of person I was now \u2013 and made my way to the bathroom. The shower was terrible again. Low pressure, lukewarm water, a curtain that tried to attack me every time I moved. But I was getting used to it. That was the thing about terrible things. You learned to live with them. Now say \u201cthe bathroom\u201d", "lang": "en"}, {"text": "das Badezimmer", "lang": "de"}], [{"text": "Das Badezimmer. Bad (bath) + Zimmer (room).", "lang": "de"}, {"text": "Now say \u201cthe shower\u201d", "lang": "en"}, {"text": "die Dusche", "lang": "de"}], [{"text": "Die Dusche. Feminine.", "lang": "de"}, {"text": "I dressed in my only clean clothes. Dark jeans. A black sweater that had a small hole in the sleeve. The same boots I had worn on the plane. Now say \u201cthe clothes\u201d", "lang": "en"}, {"text": "die Kleidung", "lang": "de"}], [{"text": "Die Kleidung. Feminine, usually singular.", "lang": "de"}, {"text": "Matei was still asleep when I came out of the bathroom. I stood over him for a second \u2013 not creepy, just observational \u2013 and took in the details I had not noticed before. The way his dark hair curled at the ends. The small scar on his chin, like he had fallen as a child. The way his hand rested on his chest, fingers curled loosely. He looked younger when he slept. Less guarded. Less like a man who remembered everything and more like a boy who had not learned to build walls yet. I turned away before I could do something stupid, like touch his face. Now say \u201cto sleep\u201d", "lang": "en"}, {"text": "schlafen", "lang": "de"}], [{"text": "Schlafen.", "lang": "de"}, {"text": "Now say \u201che sleeps\u201d", "lang": "en"}, {"text": "er schl\u00e4ft", "lang": "de"}], [{"text": "Er schl\u00e4ft. Schlafen is stem-changing. The a becomes \u00e4 in du and er/sie/es forms. Er schl\u00e4ft \u2013", "lang": "de"}, {"text": "he sleeps. --In the kitchen, I found coffee beans, a grinder, and the French press. I had watched him make coffee yesterday. I replicated the movements \u2013 scoop, grind, pour, wait. The coffee smelled like hope. Or maybe I was just hungry. I poured two mugs. Black. No sugar. No milk. I set one on the table next to the sofa, within reaching distance of his hand. Now say \u201cto drink\u201d", "lang": "en"}, {"text": "trinken", "lang": "de"}], [{"text": "Trinken.", "lang": "de"}, {"text": "Now say \u201cI drink coffee\u201d", "lang": "en"}, {"text": "ich trinke Kaffee", "lang": "de"}], [{"text": "Ich trinke Kaffee.", "lang": "de"}, {"text": "Now say \u201cyou drink coffee\u201d", "lang": "en"}, {"text": "du trinkst Kaffee", "lang": "de"}], [{"text": "Du trinkst Kaffee.", "lang": "de"}, {"text": "Then I put on my coat, grabbed the key \u2013 my key, the one he had given me \u2013 and left. The street was different at 8 AM. Brighter. Busier. People walked with purpose, carrying coffee cups and briefcases and the tired expressions of people who had not slept enough. A man ran past me in workout clothes, headphones blaring music I could hear from three metres away. The bakery on the ground floor was already open, and the smell of fresh bread made my stomach growl. Now say \u201cthe coat\u201d", "lang": "en"}, {"text": "der Mantel", "lang": "de"}], [{"text": "Der Mantel. Masculine.", "lang": "de"}, {"text": "Now say \u201cthe street\u201d die Stra\u00dfe. Review", "lang": "en"}], [{"text": "Die Stra\u00dfe.", "lang": "de"}, {"text": "I walked to Morgenlicht. Three blocks. Past the playground with the screaming toddler \u2013 she was there again, same pink coat, same joyful shriek. Past the bench where an old woman fed pigeons. Past the tree with the crooked branch that looked like it was pointing at the caf\u00e9. The green awning was out. The chalkboard sign said Heute ge\u00f6ffnet \u2013 open today. I knew those words now. Now say \u201copen\u201d", "lang": "en"}, {"text": "ge\u00f6ffnet", "lang": "de"}], [{"text": "Ge\u00f6ffnet. Now say \u201cclosed\u201d", "lang": "en"}, {"text": "geschlossen", "lang": "de"}], [{"text": "Geschlossen. Heute ge\u00f6ffnet \u2013 open today. Heute geschlossen \u2013 closed today. Through the window, I could see the woman behind the counter. Grey hair. Kind eyes. The same woman I had seen yesterday through the window. I stood across the street for a full minute, pretending I was not terrified. Then I crossed. Now say \u201cto cross the street\u201d", "lang": "en"}, {"text": "die Stra\u00dfe \u00fcberqueren", "lang": "de"}], [{"text": "Die Stra\u00dfe \u00fcberqueren. \u00dcberqueren", "lang": "de"}, {"text": "\u2013 to cross --The door made a chiming sound when I opened it. A little bell, the kind you saw in old movies. \u201cGuten Morgen,\u201d the woman said. I opened my mouth. Closed it. Opened it again. \u201cUm. Matei sent me.\u201d Her face broke into a smile. \u201cAh! Der Freund.\u201d She wiped her hands on her apron and came around the counter. She was shorter than me \u2013 a lot shorter \u2013 and she moved like someone who had been standing behind this counter for decades. Her hands were covered in flour. \u201cI am sorry,\u201d I said. \u201cI do not speak German. Not really. A few words. Almost none.\u201d She waved a hand. \u201cKein Problem. You speak English. I speak a little. We manage.\u201d \u201cYou are the owner?\u201d \u201cI am Frau Schmidt. And you are Yves.\u201d She said it Eevs, with a soft V, like she was trying to taste the word. \u201cMatei told me about you.\u201d \u201cWhat did he tell you?\u201d She smiled again. \u201cThat you need work. That you are serious. That you make good coffee.\u201d I had not made him coffee. He had made me coffee. Twice. But I did not correct her. Now say \u201cno problem\u201d kein Problem. Review", "lang": "en"}], [{"text": "Kein Problem.", "lang": "de"}, {"text": "Now say \u201cgood\u201d", "lang": "en"}, {"text": "gut. Sehr gut \u2013 very good", "lang": "de"}], [{"text": "Gut. Sehr gut.", "lang": "de"}, {"text": "\u201cI can learn,\u201d I said. \u201cI learn fast.\u201d \u201cGut.\u201d She nodded. \u201cThen you start now.\u201d (ambient: espresso machine hiss \u2013 soft, rhythmic, like a sleeping animal) The next four hours were a blur of coffee cups, plates, and the word bitte. Frau Schmidt showed me everything. How to work the espresso machine \u2013 a brass monster that hissed like an angry cat. How to arrange the pastries in the display case so they looked like art instead of food. How to say \u201cWhat would you like?\u201d in German. \u201cWas m\u00f6chten Sie?\u201d she said. I repeated: \u201cWas m\u00f6chten Sie?\u201d Now say \u201cWhat would you like?\u201d formal, to a customer", "lang": "en"}], [{"text": "Was m\u00f6chten Sie? M\u00f6chten is the polite form of wollen (to want). Sie with a capital S is formal \u201cyou\u201d. So Was m\u00f6chten Sie? \u2013 What would you like? Now say \u201cI would like a coffee\u201d", "lang": "en"}, {"text": "polite", "lang": "de"}], [{"text": "Ich m\u00f6chte einen Kaffee. Einen because Kaffee is masculine accusative. You will hear this phrase a hundred", "lang": "de"}, {"text": "times. --I dropped a cup. Only one. It shattered on the floor. Coffee everywhere. Frau Schmidt swept it up without comment. I wanted to die. \u201cFirst time?\u201d she asked. \u201cFirst day.\u201d \u201cYou will drop more. It is okay.\u201d Now say \u201cthe cup\u201d die Tasse. Review", "lang": "en"}], [{"text": "Die Tasse.", "lang": "de"}, {"text": "Now say \u201cto drop\u201d", "lang": "en"}, {"text": "fallen lassen", "lang": "de"}], [{"text": "Fallen lassen. Ich habe eine Tasse fallen lassen \u2013 I dropped a cup. Now say \u201chere you go\u201d", "lang": "en"}, {"text": "bitte sch\u00f6n", "lang": "de"}], [{"text": "Bitte sch\u00f6n.", "lang": "de"}, {"text": "Now say \u201cthank you very much\u201d", "lang": "en"}, {"text": "danke sch\u00f6n", "lang": "de"}], [{"text": "Danke sch\u00f6n.", "lang": "de"}, {"text": "Now say \u201cexcuse me / sorry\u201d", "lang": "en"}, {"text": "entschuldigung", "lang": "de"}], [{"text": "Entschuldigung.", "lang": "de"}, {"text": "Now say \u201cgoodbye\u201d (casual)", "lang": "en"}, {"text": "tsch\u00fcss", "lang": "de"}], [{"text": "Tsch\u00fcss.", "lang": "de"}, {"text": "By noon, I was exhausted. My feet hurt. My back hurt. My face hurt from smiling at strangers. But I had served twelve customers. I had made eight cappuccinos, three lattes, and one hot chocolate that the customer said was \u201cperfect\u201d in English, which was probably a lie but I took it anyway. Frau Schmidt made me sit down at a table and eat a pastry. Apricot. Warm. Flaky. The best thing I had tasted since I had arrived. Now say \u201cthe pastry\u201d", "lang": "en"}, {"text": "das Geb\u00e4ck", "lang": "de"}], [{"text": "Das Geb\u00e4ck. Neuter.", "lang": "de"}, {"text": "Now say \u201cthe apricot\u201d", "lang": "en"}, {"text": "die Aprikose", "lang": "de"}], [{"text": "Die Aprikose. Feminine.", "lang": "de"}, {"text": "\u201cYou did good,\u201d Frau Schmidt said, sitting across from me. \u201cI dropped a cup.\u201d \u201cI dropped ten my first day. You will drop more. This is the way.\u201d I ate another bite of the pastry. It was so good I almost forgot to be anxious. \u201cFrau Schmidt?\u201d \u201cJa?\u201d \u201cWhat did Matei actually say about me? When he told you I needed a job.\u201d She tilted her head. Her grey hair caught the light. \u201cHe said you were a friend. That you came from far away. That you needed a chance.\u201d \u201cThat is all?\u201d \u201cThat is enough.\u201d She reached across the table and patted my hand. \u201cYou are here now. The rest is just work.\u201d Now say \u201cthe chance\u201d", "lang": "en"}, {"text": "die Chance", "lang": "de"}], [{"text": "Die Chance. Feminine.", "lang": "de"}, {"text": "Now say \u201cthe work\u201d die Arbeit. Review", "lang": "en"}], [{"text": "Die Arbeit.", "lang": "de"}, {"text": "I walked back to the apartment at 1 PM. The sun was actually out \u2013 a pale, watery sun that did not warm anything but looked nice anyway. The streets were quieter now. Lunchtime. People eating inside, behind windows, their faces blurred by steam. I had money in my pocket. Not much \u2013 Frau Schmidt had paid me cash for the half day, thirty euros in crumpled bills that smelled like coffee. It was the first money I had earned in a new country. Now say \u201cthe money\u201d das Geld. Review", "lang": "en"}], [{"text": "Das Geld.", "lang": "de"}, {"text": "Now say \u201cthirty euros\u201d", "lang": "en"}, {"text": "drei\u00dfig Euro", "lang": "de"}], [{"text": "Drei\u00dfig Euro. I stopped at the supermarket. Netto again. Same fluorescent lights, same wonky carts. I bought bread. Cheese. A bag of apples. A bottle of water. I spent seven euros and felt rich. Now say \u201cthe bread\u201d das Brot. Review", "lang": "en"}], [{"text": "Das Brot.", "lang": "de"}, {"text": "Now say \u201cthe cheese\u201d der K\u00e4se. Review", "lang": "en"}], [{"text": "Der K\u00e4se.", "lang": "de"}, {"text": "Now say \u201cthe apple\u201d", "lang": "en"}, {"text": "der Apfel", "lang": "de"}], [{"text": "Der Apfel. Plural: die \u00c4pfel.", "lang": "de"}, {"text": "The stairs were still thirty-seven steps. The key still stuck a little. The apartment was empty when I opened the door. Matei was not there. Of course he was not. He had a job. A life. Things to do that did not involve sitting on the sofa waiting for me to come back. But still. The silence felt louder than it had yesterday. I put the groceries away. Made myself a sandwich. Sat on the wooden chair and ate it while staring at the wall. Now say \u201cthe sandwich\u201d", "lang": "en"}, {"text": "das Sandwich", "lang": "de"}], [{"text": "Das Sandwich. Neuter.", "lang": "de"}, {"text": "Now say \u201cthe wall\u201d", "lang": "en"}, {"text": "die Wand", "lang": "de"}], [{"text": "Die Wand. Feminine.", "lang": "de"}, {"text": "I pulled out my notebook. Day 2. First day at Morgenlicht. I dropped one cup. Frau Schmidt did not fire me. I learned: Bitte sch\u00f6n, Danke sch\u00f6n, Entschuldigung, Tsch\u00fcss. Matei was not here when I got back. I do not know why that bothers me. Now say \u201cto bother me\u201d", "lang": "en"}, {"text": "mich st\u00f6ren", "lang": "de"}], [{"text": "Mich st\u00f6ren. Das st\u00f6rt mich", "lang": "de"}, {"text": "\u2013 that bothers me --At 2 PM, I could not take it anymore. I put on my coat and went out again. Berlin was different in the afternoon. Less grey. More alive. I walked without a destination, just moving, just seeing. Past a park where kids were playing soccer. Past a bookstore with a display of books in the window \u2013 all German, all incomprehensible, all beautiful. Past a man playing guitar on the corner, singing something slow that I almost recognised. Now say \u201cthe park\u201d", "lang": "en"}, {"text": "der Park", "lang": "de"}], [{"text": "Der Park. Masculine.", "lang": "de"}, {"text": "Now say \u201cthe bookstore\u201d", "lang": "en"}, {"text": "die Buchhandlung", "lang": "de"}], [{"text": "Die Buchhandlung. Buch (book) + Handlung (shop).", "lang": "de"}, {"text": "I found myself at a bridge. A small one, over a canal. The water was greenish-brown and moved slowly. I leaned on the railing and watched a duck paddle in circles. Now say \u201cthe bridge\u201d", "lang": "en"}, {"text": "die Br\u00fccke", "lang": "de"}], [{"text": "Die Br\u00fccke. Feminine.", "lang": "de"}, {"text": "Now say \u201cthe duck\u201d", "lang": "en"}, {"text": "die Ente", "lang": "de"}], [{"text": "Die Ente.", "lang": "de"}, {"text": "This was my city now. My bridge. My duck. It felt fake. Like I was playing a role in a movie about someone else's life. But I was here. I was really here. And I had not run away yet. Now say \u201cthe city\u201d die Stadt. Review", "lang": "en"}], [{"text": "Die Stadt.", "lang": "de"}, {"text": "My phone buzzed. Unknown number. How was the first day? I stared at it. No one had my number. No one except \u2013 I scrolled up. The last message was from Matei, two years ago. But this number was different. This was a German number. Matei? I typed back. Who else? How did you get my number? You gave it to me. Two years ago. In a message. I laughed out loud. The duck looked at me. Now say \u201cthe phone\u201d", "lang": "en"}, {"text": "das Handy", "lang": "de"}], [{"text": "Das Handy. Neuter.", "lang": "de"}, {"text": "Now say \u201cthe number\u201d", "lang": "en"}, {"text": "die Nummer", "lang": "de"}], [{"text": "Die Nummer. Feminine.", "lang": "de"}, {"text": "You remember everything, I typed. I told you. I remember things. A pause. Then another message. Did you eat? I made a sandwich. That is not food. It was bread and cheese. That is food. Come to the bookstore on Karl-Marx-Allee at 7. I will buy you dinner. I stared at the message. Okay. Do not be late. I am never late. You were late at the airport. The plane was early. That is different. Now say \u201cto eat\u201d essen. Review", "lang": "en"}], [{"text": "Essen.", "lang": "de"}, {"text": "Now say \u201cI eat\u201d", "lang": "en"}, {"text": "ich esse", "lang": "de"}], [{"text": "Ich esse.", "lang": "de"}, {"text": "Now say \u201cyou eat\u201d", "lang": "en"}, {"text": "du isst. (Stem change: essen \u2192 isst for du and er/sie/es.)", "lang": "de"}], [{"text": "Du isst.", "lang": "de"}, {"text": "At 6:30, I started getting ready. Which was ridiculous, because I had exactly two outfits and neither of them was impressive. I put on the other sweater \u2013 the dark grey one, no holes yet \u2013 and tried to do something with my hair. It looked the same. It always looked the same. I looked at myself in the bathroom mirror. You are going to dinner with a man who gave you a key and a job and said you were not alone. That is not a date, I told my reflection. Then why are you nervous? Now say \u201cthe mirror\u201d der Spiegel. Review", "lang": "en"}], [{"text": "Der Spiegel.", "lang": "de"}, {"text": "Now say \u201cnervous\u201d nerv\u00f6s. Review", "lang": "en"}], [{"text": "Nerv\u00f6s. Ich bin nerv\u00f6s. --Karl-Marx-Allee was wider than any street I had seen in Berlin. Big buildings on both sides, old and grand, the kind of architecture that looked like it belonged to a different century. There were shops and restaurants and people everywhere, even at 7 PM on a Sunday. The bookstore was on the corner. B\u00fccher & Co. A sign in the window said Englische B\u00fccher \u2013 English books \u2013 and I felt a small wave of relief. Matei was standing outside. He was not looking at his phone. He was just standing there, hands in his coat pockets, watching the street. When he saw me, he did not wave. He just nodded, like he had been expecting me exactly at this moment. \u201cYou are not late,\u201d he said. \u201cI told you.\u201d \u201cYou also told me you made a sandwich for lunch. I am still judging you for that.\u201d Now say \u201cthe bookstore\u201d die Buchhandlung. Review", "lang": "en"}], [{"text": "Die Buchhandlung.", "lang": "de"}, {"text": "We walked into the bookstore. It was warm inside, and it smelled like paper and coffee \u2013 there was a small caf\u00e9 in the back. He led me past the shelves, past a table where someone was reading to a child, to a corner table by the window. \u201cYou work here?\u201d I asked. \u201cSometimes. I help with the events. Poetry readings, book launches. Nothing exciting.\u201d \u201cIt is a bookstore. It is automatically exciting.\u201d He looked at me. \u201cYou like books?\u201d \u201cI like stories.\u201d \u201cSame thing.\u201d \u201cNo.\u201d I sat down across from him. The chair was comfortable. The light was soft. \u201cBooks are the containers. Stories are what fill them. You can have a story without a book. You cannot have a book without a story.\u201d Now say \u201cthe book\u201d", "lang": "en"}, {"text": "das Buch", "lang": "de"}], [{"text": "Das Buch. Plural: die B\u00fccher.", "lang": "de"}, {"text": "Now say \u201cthe story\u201d die Geschichte. Review", "lang": "en"}], [{"text": "Die Geschichte.", "lang": "de"}, {"text": "A woman came to the table. She asked something in German. Matei answered. She left. \u201cI ordered for you,\u201d he said. \u201cBold.\u201d \u201cYou do not know the words for the food yet. I saved you the embarrassment.\u201d \u201cHow considerate.\u201d \u201cI am a considerate person.\u201d Now say \u201cthe food\u201d das Essen. Review", "lang": "en"}], [{"text": "Das Essen.", "lang": "de"}, {"text": "The food came. Something with potatoes and sausage and a dark sauce that tasted like winter. I ate it slowly, watching him watch the street through the window. \u201cMatei.\u201d \u201cWhat?\u201d \u201cWhy do you remember everything?\u201d He did not answer right away. His fingers traced the edge of his plate. \u201cBecause most people do not,\u201d he said finally. \u201cThey forget. They say things and then they move on and they do not think about it again. But the things people say \u2013 the small things, the things they think do not matter \u2013 those are the things that tell you who they are.\u201d \u201cAnd you want to know who people are.\u201d \u201cI want to know who you are.\u201d Now say \u201cto remember\u201d sich erinnern. Review", "lang": "en"}], [{"text": "Sich erinnern. Ich erinnere mich. Now say \u201cto forget\u201d vergessen. Review", "lang": "en"}], [{"text": "Vergessen. Ich habe vergessen.", "lang": "de"}, {"text": "We finished dinner in silence. Not uncomfortable \u2013 the good kind, the kind that felt like breathing. When the bill came, he paid before I could even reach for my pocket. \u201cTomorrow,\u201d he said, \u201cyou work again.\u201d \u201c9 AM.\u201d \u201cI will be gone before you wake up.\u201d \u201cI noticed.\u201d He tilted his head. \u201cDoes that bother you?\u201d I considered lying. Decided not to. \u201cA little,\u201d I said. He nodded. \u201cGood.\u201d \u201cWhy is that good?\u201d \u201cBecause I would be bothered if you were not bothered.\u201d Now say \u201cthe bill\u201d die Rechnung. Review", "lang": "en"}], [{"text": "Die Rechnung. Die Rechnung, bitte", "lang": "de"}, {"text": "\u2013 the bill, please Now say \u201cto pay\u201d", "lang": "en"}, {"text": "zahlen. Ich m\u00f6chte zahlen \u2013 I would like to pay", "lang": "de"}, {"text"
