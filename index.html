slow": "Die Dusche. Feminine.", "grammar": "Feminine. I dressed in my only clean clothes. Dark jeans. A black sweater that had a small hole in the sleeve. The same boots I had worn on the plane."}, {"type": "practice", "prompt": "Now say “the clothes” – die Kleidung.", "answer": "Die Kleidung. Feminine, usually singular.", "slow": "Die Kleidung. Feminine, usually singular.", "grammar": "Feminine, usually singular."}, {"type": "narration", "text": "--Matei was still asleep when I came out of the bathroom. I stood over him for a second – not creepy, just observational – and took in the details I had not noticed before. The way his dark hair curled at the ends. The small scar on his chin, like he had fallen as a child. The way his hand rested on his chest, fingers curled loosely. He looked younger when he slept. Less guarded. Less like a man who remembered everything and more like a boy who had not learned to build walls yet. I turned away before I could do something stupid, like touch his face."}, {"type": "practice", "prompt": "Now say “to sleep” – schlafen.", "answer": "Schlafen.", "slow": "Schlafen.", "grammar": "Repeat aloud: Schlafen."}, {"type": "practice", "prompt": "Now say “he sleeps” – er schläft.", "answer": "Er schläft.", "slow": "Er schläft.", "grammar": "Schlafen is stem-changing. The a becomes ä in du and er/sie/es forms. Er schläft – he sleeps."}, {"type": "narration", "text": "--In the kitchen, I found coffee beans, a grinder, and the French press. I had watched him make coffee yesterday. I replicated the movements – scoop, grind, pour, wait. The coffee smelled like hope. Or maybe I was just hungry. I poured two mugs. Black. No sugar. No milk. I set one on the table next to the sofa, within reaching distance of his hand."}, {"type": "practice", "prompt": "Now say “to drink” – trinken.", "answer": "Trinken.", "slow": "Trinken.", "grammar": "Repeat aloud: Trinken."}, {"type": "practice", "prompt": "Now say “I drink coffee” – ich trinke Kaffee.", "answer": "Ich trinke Kaffee.", "slow": "Ich trinke Kaffee.", "grammar": "Repeat aloud: Ich trinke Kaffee."}, {"type": "practice", "prompt": "Now say “you drink coffee” – du trinkst Kaffee.", "answer": "Du trinkst Kaffee.", "slow": "Du trinkst Kaffee.", "grammar": "Repeat aloud: Du trinkst Kaffee."}, {"type": "narration", "text": "--Then I put on my coat, grabbed the key – my key, the one he had given me – and left. The street was different at 8 AM. Brighter. Busier. People walked with purpose, carrying coffee cups and briefcases and the tired expressions of people who had not slept enough. A man ran past me in workout clothes, headphones blaring music I could hear from three metres away. The bakery on the ground floor was already open, and the smell of fresh bread made my stomach growl."}, {"type": "practice", "prompt": "Now say “the coat” – der Mantel.", "answer": "Der Mantel. Masculine.", "slow": "Der Mantel. Masculine.", "grammar": "Masculine."}, {"type": "practice", "prompt": "Now say “the street” – die Straße. Review.", "answer": "Die Straße.", "slow": "Die Straße.", "grammar": "Repeat aloud: Die Straße."}, {"type": "narration", "text": "--I walked to Morgenlicht. Three blocks. Past the playground with the screaming toddler – she was there again, same pink coat, same joyful shriek. Past the bench where an old woman fed pigeons. Past the tree with the crooked branch that looked like it was pointing at the café. The green awning was out. The chalkboard sign said Heute geöffnet – open today. I knew those words now."}, {"type": "practice", "prompt": "Now say “open” – geöffnet.", "answer": "Geöffnet.", "slow": "Geöffnet.", "grammar": "Repeat aloud: Geöffnet."}, {"type": "practice", "prompt": "Now say “closed” – geschlossen.", "answer": "Geschlossen. Heute geöffnet – open today. Heute geschlossen – closed today.", "slow": "Geschlossen. Heute geöffnet – open today. Heute geschlossen – closed today.", "grammar": "Heute geöffnet – open today. Heute geschlossen – closed today. Through the window, I could see the woman behind the counter. Grey hair. Kind eyes. The same woman I had seen yesterday through the window. I stood across the street for a full minute, pretending I was not terrified. Then I crossed."}, {"type": "practice", "prompt": "Now say “to cross the street” – die Straße überqueren.", "answer": "Die Straße überqueren. Überqueren – to cross.", "slow": "Die Straße überqueren. Überqueren – to cross.", "grammar": "Überqueren – to cross."}, {"type": "narration", "text": "--The door made a chiming sound when I opened it. A little bell, the kind you saw in old movies."}, {"type": "dialogue", "text": "“Guten Morgen,” the woman said."}, {"type": "narration", "text": "I opened my mouth. Closed it. Opened it again."}, {"type": "dialogue", "text": "“Um. Matei sent me.”"}, {"type": "narration", "text": "Her face broke into a smile. “Ah! Der Freund.” She wiped her hands on her apron and came around the counter. She was shorter than me – a lot shorter – and she moved like someone who had been standing behind this counter for decades. Her hands were covered in flour."}, {"type": "dialogue", "text": "“I am sorry,” I said. “I do not speak German. Not really. A few words. Almost"}, {"type": "narration", "text": "none.” She waved a hand. “Kein Problem. You speak English. I speak a little. We manage.”"}, {"type": "dialogue", "text": "“You are the owner?”"}, {"type": "dialogue", "text": "“I am Frau Schmidt. And you are Yves.” She said it Eevs, with a soft V, like she"}, {"type": "narration", "text": "was trying to taste the word. “Matei told me about you.”"}, {"type": "dialogue", "text": "“What did he tell you?”"}, {"type": "narration", "text": "She smiled again. “That you need work. That you are serious. That you make good coffee.” I had not made him coffee. He had made me coffee. Twice. But I did not correct her."}, {"type": "practice", "prompt": "Now say “no problem” – kein Problem. Review.", "answer": "Kein Problem.", "slow": "Kein Problem.", "grammar": "Repeat aloud: Kein Problem."}, {"type": "practice", "prompt": "Now say “good” – gut. Sehr gut – very good.", "answer": "Gut. Sehr gut.", "slow": "Gut. Sehr gut.", "grammar": "Sehr gut."}, {"type": "dialogue", "text": "--“I can learn,” I said. “I learn fast.”"}, {"type": "dialogue", "text": "“Gut.” She nodded. “Then you start now.”"}, {"type": "narration", "text": "The next four hours were a blur of coffee cups, plates, and the word bitte. Frau Schmidt showed me everything. How to work the espresso machine – a brass monster that hissed like an angry cat. How to arrange the pastries in the display case so they looked like art instead of food. How to say “What would you like?” in German."}, {"type": "dialogue", "text": "“Was möchten Sie?” she said."}, {"type": "narration", "text": "I repeated: “Was möchten Sie?”"}, {"type": "practice", "prompt": "Now say “What would you like?” – formal, to a customer.", "answer": "Was möchten Sie?.", "slow": "Was möchten Sie?.", "grammar": "Was möchten Sie? Möchten is the polite form of wollen (to want). Sie with a capital S is formal “you”. So Was möchten Sie? – What would you like?"}, {"type": "practice", "prompt": "Now say “I would like a coffee” – polite.", "answer": "Ich möchte einen Kaffee.", "slow": "Ich möchte einen Kaffee.", "grammar": "Einen because Kaffee is masculine accusative. You will hear this phrase a hundred times."}, {"type": "narration", "text": "--I dropped a cup. Only one. It shattered on the floor. Coffee everywhere. Frau Schmidt swept it up without comment. I wanted to die."}, {"type": "dialogue", "text": "“First time?” she asked."}, {"type": "dialogue", "text": "“First day.”"}, {"type": "dialogue", "text": "“You will drop more. It is okay.”"}, {"type": "practice", "prompt": "Now say “the cup” – die Tasse. Review.", "answer": "Die Tasse.", "slow": "Die Tasse.", "grammar": "Repeat aloud: Die Tasse."}, {"type": "practice", "prompt": "Now say “to drop” – fallen lassen.", "answer": "Fallen lassen. Ich habe eine Tasse fallen lassen – I dropped a cup.", "slow": "Fallen lassen. Ich habe eine Tasse fallen lassen – I dropped a cup.", "grammar": "Ich habe eine Tasse fallen lassen – I dropped a cup."}, {"type": "practice", "prompt": "Now say “here you go” – bitte schön.", "answer": "Bitte schön.", "slow": "Bitte schön.", "grammar": "Repeat aloud: Bitte schön."}, {"type": "practice", "prompt": "Now say “thank you very much” – danke schön.", "answer": "Danke schön.", "slow": "Danke schön.", "grammar": "Repeat aloud: Danke schön."}, {"type": "practice", "prompt": "Now say “excuse me / sorry” – entschuldigung.", "answer": "Entschuldigung.", "slow": "Entschuldigung.", "grammar": "Repeat aloud: Entschuldigung."}, {"type": "practice", "prompt": "Now say “goodbye” (casual) – tschüss.", "answer": "Tschüss.", "slow": "Tschüss.", "grammar": "Repeat aloud: Tschüss."}, {"type": "narration", "text": "--By noon, I was exhausted. My feet hurt. My back hurt. My face hurt from smiling at strangers. But I had served twelve customers. I had made eight cappuccinos, three lattes, and one hot chocolate that the customer said was “perfect” in English, which was probably a lie but I took it anyway. Frau Schmidt made me sit down at a table and eat a pastry. Apricot. Warm. Flaky. The best thing I had tasted since I had arrived."}, {"type": "practice", "prompt": "Now say “the pastry” – das Gebäck.", "answer": "Das Gebäck. Neuter.", "slow": "Das Gebäck. Neuter.", "grammar": "Neuter."}, {"type": "practice", "prompt": "Now say “the apricot” – die Aprikose.", "answer": "Die Aprikose. Feminine.", "slow": "Die Aprikose. Feminine.", "grammar": "Feminine. “You did good,” Frau Schmidt said, sitting across from me. “I dropped a cup.” “I dropped ten my first day. You will drop more. This is the way.” I ate another bite of the pastry. It was so good I almost forgot to be anxious. “Frau Schmidt?” “Ja?” “What did Matei actually say about me? When he told you I needed a job.” She tilted her head. Her grey hair caught the light. “He said you were a friend. That you came from far away. That you needed a chance.” “That is all?”"}, {"type": "dialogue", "text": "“That is enough.” She reached across the table and patted my hand. “You are here"}, {"type": "narration", "text": "now. The rest is just work.”"}, {"type": "practice", "prompt": "Now say “the chance” – die Chance.", "answer": "Die Chance. Feminine.", "slow": "Die Chance. Feminine.", "grammar": "Feminine."}, {"type": "practice", "prompt": "Now say “the work” – die Arbeit. Review.", "answer": "Die Arbeit.", "slow": "Die Arbeit.", "grammar": "Repeat aloud: Die Arbeit."}, {"type": "narration", "text": "--I walked back to the apartment at 1 PM. The sun was actually out – a pale, watery sun that did not warm anything but looked nice anyway. The streets were quieter now. Lunchtime. People eating inside, behind windows, their faces blurred by steam. I had money in my pocket. Not much – Frau Schmidt had paid me cash for the half day, thirty euros in crumpled bills that smelled like coffee. It was the first money I had earned in a new country."}, {"type": "practice", "prompt": "Now say “the money” – das Geld. Review.", "answer": "Das Geld.", "slow": "Das Geld.", "grammar": "Repeat aloud: Das Geld."}, {"type": "practice", "prompt": "Now say “thirty euros” – dreißig Euro.", "answer": "Dreißig Euro.", "slow": "Dreißig Euro.", "grammar": "I stopped at the supermarket. Netto again. Same fluorescent lights, same wonky carts. I bought bread. Cheese. A bag of apples. A bottle of water. I spent seven euros and felt rich."}, {"type": "practice", "prompt": "Now say “the bread” – das Brot. Review.", "answer": "Das Brot.", "slow": "Das Brot.", "grammar": "Repeat aloud: Das Brot."}, {"type": "practice", "prompt": "Now say “the cheese” – der Käse. Review.", "answer": "Der Käse.", "slow": "Der Käse.", "grammar": "Repeat aloud: Der Käse."}, {"type": "practice", "prompt": "Now say “the apple” – der Apfel.", "answer": "Der Apfel. Plural: die Äpfel.", "slow": "Der Apfel. Plural: die Äpfel.", "grammar": "Plural: die Äpfel."}, {"type": "narration", "text": "--The stairs were still thirty-seven steps. The key still stuck a little. The apartment was empty when I opened the door. Matei was not there. Of course he was not. He had a job. A life. Things to do that did not involve sitting on the sofa waiting for me to come back. But still. The silence felt louder than it had yesterday. I put the groceries away. Made myself a sandwich. Sat on the wooden chair and ate it while staring at the wall."}, {"type": "practice", "prompt": "Now say “the sandwich” – das Sandwich.", "answer": "Das Sandwich. Neuter.", "slow": "Das Sandwich. Neuter.", "grammar": "Neuter."}, {"type": "practice", "prompt": "Now say “the wall” – die Wand.", "answer": "Die Wand. Feminine.", "slow": "Die Wand. Feminine.", "grammar": "Feminine. I pulled out my notebook. Day 2. First day at Morgenlicht. I dropped one cup. Frau Schmidt did not fire me. I learned: Bitte schön, Danke schön, Entschuldigung, Tschüss. Matei was not here when I got back."}, {"type": "narration", "text": "I do not know why that bothers me."}, {"type": "practice", "prompt": "Now say “to bother me” – mich stören.", "answer": "Mich stören. Das stört mich – that bothers me.", "slow": "Mich stören. Das stört mich – that bothers me.", "grammar": "Das stört mich – that bothers me."}, {"type": "narration", "text": "--At 2 PM, I could not take it anymore. I put on my coat and went out again. Berlin was different in the afternoon. Less grey. More alive. I walked without a destination, just moving, just seeing. Past a park where kids were playing soccer. Past a bookstore with a display of books in the window – all German, all incomprehensible, all beautiful. Past a man playing guitar on the corner, singing something slow that I almost recognised."}, {"type": "practice", "prompt": "Now say “the park” – der Park.", "answer": "Der Park. Masculine.", "slow": "Der Park. Masculine.", "grammar": "Masculine."}, {"type": "practice", "prompt": "Now say “the bookstore” – die Buchhandlung.", "answer": "Die Buchhandlung. Buch (book) + Handlung (shop).", "slow": "Die Buchhandlung. Buch (book) + Handlung (shop).", "grammar": "Buch (book) + Handlung (shop). I found myself at a bridge. A small one, over a canal. The water was greenish-brown and moved slowly. I leaned on the railing and watched a duck paddle in circles."}, {"type": "practice", "prompt": "Now say “the bridge” – die Brücke.", "answer": "Die Brücke. Feminine.", "slow": "Die Brücke. Feminine.", "grammar": "Feminine."}, {"type": "practice", "prompt": "Now say “the duck” – die Ente.", "answer": "Die Ente.", "slow": "Die Ente.", "grammar": "This was my city now. My bridge. My duck. It felt fake. Like I was playing a role"}, {"type": "narration", "text": "in a movie about someone else's life. But I was here. I was really here. And I had not run away yet."}, {"type": "practice", "prompt": "Now say “the city” – die Stadt. Review.", "answer": "Die Stadt.", "slow": "Die Stadt.", "grammar": "Repeat aloud: Die Stadt."}, {"type": "narration", "text": "--My phone buzzed. Unknown number. How was the first day? I stared at it. No one had my number. No one except – I scrolled up. The last message was from Matei, two years ago. But this number was different. This was a German number. Matei? I typed back. Who else? How did you get my number? You gave it to me. Two years ago. In a message. I laughed out loud. The duck looked at me."}, {"type": "practice", "prompt": "Now say “the phone” – das Handy.", "answer": "Das Handy. Neuter.", "slow": "Das Handy. Neuter.", "grammar": "Neuter."}, {"type": "practice", "prompt": "Now say “the number” – die Nummer.", "answer": "Die Nummer. Feminine.", "slow": "Die Nummer. Feminine.", "grammar": "Feminine."}, {"type": "narration", "text": "--You remember everything, I typed. I told you. I remember things. A pause. Then another message. Did you eat? I made a sandwich. That is not food. It was bread and cheese. That is food. Come to the bookstore on Karl-Marx-Allee at 7. I will buy you dinner. I stared at the message. Okay. Do not be late. I am never late. You were late at the airport. The plane was early. That is different."}, {"type": "practice", "prompt": "Now say “to eat” – essen. Review.", "answer": "Essen.", "slow": "Essen.", "grammar": "Repeat aloud: Essen."}, {"type": "practice", "prompt": "Now say “I eat” – ich esse.", "answer": "Ich esse.", "slow": "Ich esse.", "grammar": "Repeat aloud: Ich esse."}, {"type": "practice", "prompt": "Now say “you eat” – du isst. (Stem change: essen → isst for du and er/sie/es.)", "answer": "Du isst.", "slow": "Du isst.", "grammar": "Repeat aloud: Du isst."}, {"type": "narration", "text": "--At 6:30, I started getting ready. Which was ridiculous, because I had exactly two outfits and neither of them was impressive. I put on the other sweater – the dark grey one, no holes yet – and tried to do something with my hair. It looked the same. It always looked the same. I looked at myself in the bathroom mirror. You are going to dinner with a man who gave you a key and a job and said you were not alone. That is not a date, I told my reflection. Then why are you nervous?"}, {"type": "practice", "prompt": "Now say “the mirror” – der Spiegel. Review.", "answer": "Der Spiegel.", "slow": "Der Spiegel.", "grammar": "Repeat aloud: Der Spiegel."}, {"type": "practice", "prompt": "Now say “nervous” – nervös. Review.", "answer": "Nervös. Ich bin nervös.", "slow": "Nervös. Ich bin nervös.", "grammar": "Ich bin nervös."}, {"type": "narration", "text": "--Karl-Marx-Allee was wider than any street I had seen in Berlin. Big buildings on both sides, old and grand, the kind of architecture that looked like it belonged to a different century. There were shops and restaurants and people everywhere, even at 7 PM on a Sunday. The bookstore was on the corner. Bücher & Co. A sign in the window said Englische Bücher – English books – and I felt a small wave of relief. Matei was standing outside. He was not looking at his phone. He was just standing there, hands in his coat pockets, watching the street. When he saw me, he did not wave. He just nodded, like he had been expecting me exactly at this moment."}, {"type": "dialogue", "text": "“You are not late,” he said."}, {"type": "dialogue", "text": "“I told you.”"}, {"type": "dialogue", "text": "“You also told me you made a sandwich for lunch. I am still judging you for that.”"}, {"type": "practice", "prompt": "Now say “the bookstore” – die Buchhandlung. Review.", "answer": "Die Buchhandlung.", "slow": "Die Buchhandlung.", "grammar": "Repeat aloud: Die Buchhandlung."}, {"type": "narration", "text": "--We walked into the bookstore. It was warm inside, and it smelled like paper and coffee – there was a small café in the back. He led me past the shelves, past a table where someone was reading to a child, to a corner table by the window."}, {"type": "dialogue", "text": "“You work here?” I asked."}, {"type": "dialogue", "text": "“Sometimes. I help with the events. Poetry readings, book launches. Nothing"}, {"type": "dialogue", "text": "“It is a bookstore. It is automatically exciting.”"}, {"type": "narration", "text": "He looked at me. “You like books?”"}, {"type": "dialogue", "text": "“I like stories.”"}, {"type": "dialogue", "text": "“Same thing.”"}, {"type": "dialogue", "text": "“No.” I sat down across from him. The chair was comfortable. The light was soft."}, {"type": "dialogue", "text": "“Books are the containers. Stories are what fill them. You can have a story"}, {"type": "narration", "text": "without a book. You cannot have a book without a story.”"}, {"type": "practice", "prompt": "Now say “the book” – das Buch.", "answer": "Das Buch. Plural: die Bücher.", "slow": "Das Buch. Plural: die Bücher.", "grammar": "Plural: die Bücher."}, {"type": "practice", "prompt": "Now say “the story” – die Geschichte. Review.", "answer": "Die Geschichte.", "slow": "Die Geschichte.", "grammar": "Repeat aloud: Die Geschichte."}, {"type": "narration", "text": "--A woman came to the table. She asked something in German. Matei answered. She left."}, {"type": "dialogue", "text": "“I ordered for you,” he said."}, {"type": "dialogue", "text": "“Bold.”"}, {"type": "dialogue", "text": "“You do not know the words for the food yet. I saved you the embarrassment.”"}, {"type": "dialogue", "text": "“How considerate.”"}, {"type": "dialogue", "text": "“I am a considerate person.”"}, {"type": "practice", "prompt": "Now say “the food” – das Essen. Review.", "answer": "Das Essen.", "slow": "Das Essen.", "grammar": "The food came. Something with potatoes and sausage and a dark sauce that tasted like winter. I ate it slowly, watching him watch the street through the window. “Matei.” “What?” “Why do you remember everything?” He did not answer right away. His fingers traced the edge of his plate. “Because most people do not,” he said finally. “They forget. They say things and then they move on and they do not think about it again. But the things people say – the small things, the things they think do not matter – those are the things that tell you who they are.” “And you want to know who people are.” “I want"}, {"type": "practice", "prompt": "Now say “to remember” – sich erinnern. Review.", "answer": "Sich erinnern. Ich erinnere mich.", "slow": "Sich erinnern. Ich erinnere mich.", "grammar": "Ich erinnere mich."}, {"type": "practice", "prompt": "Now say “to forget” – vergessen. Review.", "answer": "Vergessen. Ich habe vergessen.", "slow": "Vergessen. Ich habe vergessen.", "grammar": "Ich habe vergessen."}, {"type": "narration", "text": "--We finished dinner in silence. Not uncomfortable – the good kind, the kind that felt like breathing. When the bill came, he paid before I could even reach for my pocket."}, {"type": "dialogue", "text": "“Tomorrow,” he said, “you work again.”"}, {"type": "dialogue", "text": "“9 AM.”"}, {"type": "dialogue", "text": "“I will be gone before you wake up.”"}, {"type": "dialogue", "text": "“I noticed.”"}, {"type": "narration", "text": "He tilted his head. “Does that bother you?” I considered lying. Decided not to."}, {"type": "dialogue", "text": "“A little,” I said."}, {"type": "dialogue", "text": "“Why is that good?”"}, {"type": "dialogue", "text": "“Because I would be bothered if you were not bothered.”"}, {"type": "practice", "prompt": "Now say “the bill” – die Rechnung. Review.", "answer": "Die Rechnung. Die Rechnung, bitte – the bill, please.", "slow": "Die Rechnung. Die Rechnung, bitte – the bill, please.", "grammar": "Die Rechnung, bitte – the bill, please."}, {"type": "practice", "prompt": "Now say “to pay” – zahlen. Ich möchte zahlen – I would like to pay.", "answer": "--We walked back to the apartment together. Not touching. But close. Close enough.", "slow": "--We walked back to the apartment together. Not touching. But close. Close enough.", "grammar": "Not touching. But close. Close enough that our shoulders almost brushed. Close enough that I could feel the heat from his arm through both our coats. The stairs were thirty-seven steps. The key still stuck. The apartment was dark when we opened the door. “Good night, Yves.” “Good night, Matei.” I lay down in the bed. He lay down on the sofa. I listened to him breathe until I fell asleep."}, {"type": "practice", "prompt": "Now say “to listen” – zuhören. Review.", "answer": "Zuhören. Ich höre zu – I listen.", "slow": "Zuhören. Ich höre zu – I listen.", "grammar": "Ich höre zu – I listen."}], "bg": "café", "location": "Morgenlicht Café"}, {"id": 5, "title": "The Space Between", "level": "A1-A2", "segments": [{"type": "narration", "text": "of distant traffic.) The second week was harder than the first. Not because of the work – I was getting better at the espresso machine, and Frau Schmidt had stopped watching me like I might accidentally burn down the café. Not because of the language – I had learned a dozen new words, including Milch (milk), Zucker (sugar), and Rechnung (the bill), which I said wrong every time but people understood anyway. It was harder because Matei had started to feel like something I could lose."}, {"type": "practice", "prompt": "Now say “the milk” – die Milch. Review.", "answer": "Die Milch.", "slow": "Die Milch.", "grammar": "Repeat aloud: Die Milch."}, {"type": "practice", "prompt": "Now say “the sugar” – der Zucker.", "answer": "Der Zucker. Masculine.", "slow": "Der Zucker. Masculine.", "grammar": "Masculine."}, {"type": "practice", "prompt": "Now say “the bill” – die Rechnung. Review.", "answer": "Die Rechnung.", "slow": "Die Rechnung.", "grammar": "Repeat aloud: Die Rechnung."}, {"type": "narration", "text": "--That sounds dramatic. I know. But here is the thing: when you have spent your whole life waiting for people to leave, you start seeing exits everywhere. A closed door. A missed text. A silence that lasts a few hours too long. Your brain fills in the gaps with the worst possible story, and then you are already grieving before anyone has even gone. Matei did not leave. He went to work. He came home. He made coffee in the morning and left mine on the table. He cooked sometimes – simple things, eggs and bread, a soup that tasted like Romania. He sat on the plastic chair and read his books while I wrote in my notebook. But he did not touch me again. Not after that night at the bookstore. Not after his hand had covered mine on the sofa. He was close – physically, always close – but there was a space between us that felt like a held breath. Like we were both waiting for something."}, {"type": "practice", "prompt": "Now say “to leave” – verlassen.", "answer": "Verlassen.", "slow": "Verlassen.", "grammar": "Repeat aloud: Verlassen."}, {"type": "practice", "prompt": "Now say “he leaves” – er verlässt.", "answer": "Er verlässt.", "slow": "Er verlässt.", "grammar": "Repeat aloud: Er verlässt."}, {"type": "practice", "prompt": "Now say “to touch” – berühren.", "answer": "Berühren. Er berührt mich nicht – he does not touch me.", "slow": "Berühren. Er berührt mich nicht – he does not touch me.", "grammar": "Er berührt mich nicht – he does not touch me."}, {"type": "narration", "text": "--On my eighth day at Morgenlicht, Frau Schmidt taught me how to close the café. It was a ritual. Wipe down the counters. Count the register. Take out the trash. Lock the door. Turn off the lights. The last part was my favourite – standing in the dark café, the streetlight coming through the window, the smell of coffee and sugar still hanging in the air. It felt like being inside a memory."}, {"type": "practice", "prompt": "Now say “to close” – schließen.", "answer": "Schließen.", "slow": "Schließen.", "grammar": "Repeat aloud: Schließen."}, {"type": "practice", "prompt": "Now say “to lock” – abschließen (separable).", "answer": "Abschließen. Ich schließe die Tür ab – I lock the door.", "slow": "Abschließen. Ich schließe die Tür ab – I lock the door.", "grammar": "Ich schließe die Tür ab – I lock the door. “You are doing good,” Frau Schmidt said, putting on her coat. “I dropped a cup yesterday.” “Only one. Yesterday you dropped one. The day before you dropped two. This is improvement.” She patted my cheek – actually patted my cheek, like I was five years old – and left me to lock up."}, {"type": "practice", "prompt": "Now say “to drop” – fallen lassen. Review.", "answer": "Fallen lassen. Ich habe eine Tasse fallen lassen.", "slow": "Fallen lassen. Ich habe eine Tasse fallen lassen.", "grammar": "Ich habe eine Tasse fallen lassen."}, {"type": "practice", "prompt": "Now say “the improvement” – die Verbesserung.", "answer": "Die Verbesserung. Feminine – -ung ending.", "slow": "Die Verbesserung. Feminine – -ung ending.", "grammar": "Feminine – -ung ending."}, {"type": "narration", "text": "--I stood in the dark for a minute. The bell above the door was silent. The street outside was quiet. Somewhere down the block, someone was playing music – something slow, something sad, something that made me think of Matei. I locked the door and walked home. He was already there when I got back. Sitting on the sofa. His laptop open on the table. He was typing something, his brow furrowed, his fingers moving fast."}, {"type": "dialogue", "text": "“You are home early,” I said."}, {"type": "dialogue", "text": "“The library closed.”"}, {"type": "dialogue", "text": "“You work at the library?”"}, {"type": "dialogue", "text": "“I work at the bookstore. The library is where I go to write when I do not want to"}, {"type": "practice", "prompt": "Now say “the library” – die Bibliothek.", "answer": "Die Bibliothek. Feminine. Also die Bücherei.", "slow": "Die Bibliothek. Feminine. Also die Bücherei.", "grammar": "Feminine. Also die Bücherei."}, {"type": "practice", "prompt": "Now say “to write” – schreiben.", "answer": "Schreiben. Ich schreibe – I write.", "slow": "Schreiben. Ich schreibe – I write.", "grammar": "Ich schreibe – I write."}, {"type": "dialogue", "text": "--“You do not want to be at home?” I asked."}, {"type": "narration", "text": "He looked up. His eyes were tired. “I did not say that.”"}, {"type": "dialogue", "text": "“You implied it.”"}, {"type": "dialogue", "text": "“I said I go to the library to write. That is not the same as not wanting to be"}, {"type": "narration", "text": "here.” I sat on the wooden chair. The plastic one was still empty. It was always empty, now. He sat on the sofa. I sat on the chair. The space between us was two metres and a lifetime."}, {"type": "dialogue", "text": "“What are you writing?” I asked."}, {"type": "narration", "text": "He closed the laptop. “Nothing.”"}, {"type": "dialogue", "text": "“You are a bad liar.”"}, {"type": "dialogue", "text": "“I am an excellent liar. I just do not want to lie to you.”"}, {"type": "practice", "prompt": "Now say “to lie” – lügen.", "answer": "Lügen. Du lügst – you lie. Ich lüge nicht – I do not lie.", "slow": "Lügen. Du lügst – you lie. Ich lüge nicht – I do not lie.", "grammar": "Du lügst – you lie. Ich lüge nicht – I do not lie."}, {"type": "practice", "prompt": "Now say “the truth” – die Wahrheit.", "answer": "Die Wahrheit. Ich sage die Wahrheit – I tell the truth.", "slow": "Die Wahrheit. Ich sage die Wahrheit – I tell the truth.", "grammar": "Ich sage die Wahrheit – I tell the truth."}, {"type": "narration", "text": "--That shut me up. He went back to staring at the wall. I went back to watching him."}, {"type": "dialogue", "text": "“Matei.”"}, {"type": "dialogue", "text": "“What?”"}, {"type": "dialogue", "text": "“Why do you never sit in the other chair?”"}, {"type": "narration", "text": "He turned to look at me. The lamp light caught the side of his face."}, {"type": "dialogue", "text": "“Because I want to sit where you sat.”"}, {"type": "dialogue", "text": "“The first night. When you made pasta. You sat on the sofa. I sat on the wooden"}, {"type": "narration", "text": "chair.” He paused. “I have been sitting on the sofa ever since.”"}, {"type": "dialogue", "text": "“That does not make any sense.”"}, {"type": "dialogue", "text": "“It makes perfect sense.” He leaned back into the cushions. “I wanted to know what"}, {"type": "narration", "text": "it felt like. Where you had been.”"}, {"type": "practice", "prompt": "Now say “the first night” – die erste Nacht.", "answer": "Die erste Nacht.", "slow": "Die erste Nacht.", "grammar": "Repeat aloud: Die erste Nacht."}, {"type": "practice", "prompt": "Now say “to sit” – sitzen.", "answer": "Sitzen. Ich sitze – I sit. Du sitzt – you sit.", "slow": "Sitzen. Ich sitze – I sit. Du sitzt – you sit.", "grammar": "Ich sitze – I sit. Du sitzt – you sit."}, {"type": "narration", "text": "--My chest did something complicated. A twist. A squeeze. A feeling I did not have a name for."}, {"type": "dialogue", "text": "“That is the weirdest thing anyone has ever said to me.”"}, {"type": "dialogue", "text": "“Probably.”"}, {"type": "dialogue", "text": "“And also the nicest.”"}, {"type": "narration", "text": "He almost smiled. Almost. “I am a nice person.”"}, {"type": "dialogue", "text": "“You are a strange person.”"}, {"type": "dialogue", "text": "“Same thing.”"}, {"type": "practice", "prompt": "Now say “strange” – seltsam or komisch.", "answer": "Seltsam. Du bist seltsam – you are strange.", "slow": "Seltsam. Du bist seltsam – you are strange.", "grammar": "Du bist seltsam – you are strange."}, {"type": "practice", "prompt": "Now say “nice” – nett.", "answer": "Nett. Du bist nett – you are nice. Nett is for people.", "slow": "Nett. Du bist nett – you are nice. Nett is for people.", "grammar": "Du bist nett – you are nice. Nett is for people."}, {"type": "narration", "text": "--I laughed. He did not. But his hand was on the cushion again, resting where mine had rested that first night. The same spot. The same distance. I wanted to reach out. I wanted to close the two metres. I wanted to do something other than sit here and pretend I was not terrified. Instead, I stood up. “I am going to bed.”"}, {"type": "dialogue", "text": "“It is eight o'clock.”"}, {"type": "dialogue", "text": "“I am tired.”"}, {"type": "narration", "text": "He did not stop me. He just nodded and turned back to his laptop."}, {"type": "practice", "prompt": "Now say “the bed” – das Bett.", "answer": "Das Bett. Ich gehe ins Bett – I go to bed. Ins is in das.", "slow": "Das Bett. Ich gehe ins Bett – I go to bed. Ins is in das.", "grammar": "Ich gehe ins Bett – I go to bed. Ins is in das."}, {"type": "practice", "prompt": "Now say “tired” – müde. Review.", "answer": "Müde. Ich bin müde.", "slow": "Müde. Ich bin müde.", "grammar": "Ich bin müde."}, {"type": "narration", "text": "--- I lay in the dark, listening to him type. The keys clicked softly. A rhythm. A heartbeat. Something I could almost fall asleep to. The next morning, he was gone before I woke up. But there was coffee on the table. And a note. Yves – There is bread in the freezer. Do not just eat cheese for breakfast. – M. I stared at the note for a long time. His handwriting was small and neat. The kind of handwriting that belonged to someone who thought before they wrote. I folded the note and put it in my pocket. Next to the key."}, {"type": "practice", "prompt": "Now say “the note” – der Zettel.", "answer": "Der Zettel. Masculine.", "slow": "Der Zettel. Masculine.", "grammar": "Masculine."}, {"type": "practice", "prompt": "Now say “the freezer” – das Gefrierfach.", "answer": "Das Gefrierfach. Neuter.", "slow": "Das Gefrierfach. Neuter.", "grammar": "Neuter."}, {"type": "narration", "text": "--Work was slow that day. Frau Schmidt sent me home early – something about a doctor's appointment, something I did not fully understand because she said it in German and I only caught every third word. She patted my cheek again and told me to rest. I did not want to rest. I wanted to walk. Berlin was grey again. The sky was low and heavy, like it was thinking about rain but had not committed yet. I walked without a destination. Past the park. Past the bridge with the duck – the duck was not there today. Past a church with a bell tower that looked like it had not been used in years."}, {"type": "practice", "prompt": "Now say “the doctor” – der Arzt.", "answer": "Der Arzt. Masculine. Female: die Ärztin.", "slow": "Der Arzt. Masculine. Female: die Ärztin.", "grammar": "Masculine. Female: die Ärztin."}, {"type": "practice", "prompt": "Now say “the appointment” – der Termin.", "answer": "Der Termin. Ich habe einen Termin – I have an appointment.", "slow": "Der Termin. Ich habe einen Termin – I have an appointment.", "grammar": "Ich habe einen Termin – I have an appointment."}, {"type": "narration", "text": "--I ended up at the bookstore. Bücher & Co. Matei was there. He was standing behind the counter, talking to a customer. An older woman with a stack of books in her arms. He was explaining something – in German, fast, too fast for me to follow – and the woman was nodding, and his hands were moving, and he looked like he belonged here. Like this was his place. His language. His life. I almost left. I did not want to interrupt. I did not want him to see me watching. But he looked up. His eyes found mine through the crowd. He did not smile. He just nodded, the way he always did, and went back to helping the customer."}, {"type": "practice", "prompt": "Now say “the customer” – der Kunde.", "answer": "Der Kunde. Masculine. Female: die Kundin.", "slow": "Der Kunde. Masculine. Female: die Kundin.", "grammar": "Masculine. Female: die Kundin."}, {"type": "practice", "prompt": "Now say “to explain” – erklären.", "answer": "Erklären. Er erklärt etwas – he explains something.", "slow": "Erklären. Er erklärt etwas – he explains something.", "grammar": "Er erklärt etwas – he explains something."}, {"type": "narration", "text": "--I waited by the English section. Browsing. Not browsing. Reading the same book jacket three times without understanding a word."}, {"type": "dialogue", "text": "“You are staring,” he said."}, {"type": "narration", "text": "I turned. He was standing behind me. Close. Too close for a bookstore, too close for coworkers, too close for two people who were just sharing an apartment."}, {"type": "dialogue", "text": "“I am observing,” I said. “There is a difference.”"}, {"type": "dialogue", "text": "“You have used that line before.”"}, {"type": "dialogue", "text": "“It is a good line.”"}, {"type": "narration", "text": "He took a step closer. I took a step back. My shoulders hit the bookshelf."}, {"type": "dialogue", "text": "“Why are you here, Yves?”"}, {"type": "dialogue", "text": "“I wanted to see you.”"}, {"type": "practice", "prompt": "Now say “to see” – sehen.", "answer": "Sehen. Ich sehe dich – I see you.", "slow": "Sehen. Ich sehe dich – I see you.", "grammar": "Ich sehe dich – I see you. Sehen is stem-changing. Ich sehe, du siehst, er sieht. Repeat: du siehst."}, {"type": "narration", "text": "--The words came out before I could stop them. Honest. Unfiltered. The kind of thing I usually swallowed. Matei's expression did not change. But his hand – his right hand – came up and rested on the bookshelf next to my shoulder. Not touching me. Close."}, {"type": "dialogue", "text": "“You see me every day,” he said."}, {"type": "dialogue", "text": "“That is not the same.”"}, {"type": "dialogue", "text": "“What is the difference?”"}, {"type": "narration", "text": "I looked at his hand. The veins. The scar on his thumb. The way his fingers curled against the shelf."}, {"type": "dialogue", "text": "“Seeing someone is passive. It just happens. Looking is active. You choose.”"}, {"type": "dialogue", "text": "“And you chose to look at me?”"}, {"type": "dialogue", "text": "“I chose to come here. The looking just happened.”"}, {"type": "practice", "prompt": "Now say “to look at” – anschauen or angucken (separable).", "answer": "Anschauen. Ich schaue dich an – I look at you.", "slow": "Anschauen. Ich schaue dich an – I look at you.", "grammar": "Ich schaue dich an – I look at you."}, {"type": "narration", "text": "--He was quiet for a moment. The bookstore was noisy around us – people talking, pages turning, a child laughing somewhere in the children's section. But in the space between us, there was only silence."}, {"type": "dialogue", "text": "“Yves.”"}, {"type": "dialogue", "text": "“What?”"}, {"type": "dialogue", "text": "“You are doing it again.”"}, {"type": "dialogue", "text": "“Doing what?”"}, {"type": "dialogue", "text": "“Talking without saying anything.”"}, {"type": "narration", "text": "I opened my mouth. Closed it. Opened it again."}, {"type": "dialogue", "text": "“I do not know how to say what I want to say,” I admitted."}, {"type": "dialogue", "text": "“Then do not say it.” He leaned closer. His breath was warm on my cheek. “Show"}, {"type": "practice", "prompt": "Now say “to show” – zeigen.", "answer": "Zeigen. Zeig mir – show me. Mir is dative (to me).", "slow": "Zeigen. Zeig mir – show me. Mir is dative (to me).", "grammar": "Zeig mir – show me. Mir is dative (to me)."}, {"type": "practice", "prompt": "Now say “to admit” – zugeben (separable).", "answer": "Zugeben. Ich gebe zu – I admit.", "slow": "Zugeben. Ich gebe zu – I admit.", "grammar": "Ich gebe zu – I admit."}, {"type": "narration", "text": "--My heart was a disaster. A mess. A stuttering, skipping, out-of-control thing that had no business being this loud."}, {"type": "dialogue", "text": "“I do not know how to do that either,” I whispered."}, {"type": "dialogue", "text": "“Then we will figure it out together.”"}, {"type": "narration", "text": "He pulled back. His hand left the shelf. He walked back to the counter like nothing had happened. I stood there for a full minute, my back against the books, my heart trying to escape my chest. Then I left the bookstore. Did not buy anything. Did not say goodbye."}, {"type": "practice", "prompt": "Now say “together” – zusammen.", "answer": "Zusammen. Wir sind zusammen – we are together.", "slow": "Zusammen. Wir sind zusammen – we are together.", "grammar": "Wir sind zusammen – we are together."}, {"type": "practice", "prompt": "Now say “to escape” – entkommen.", "answer": "Entkommen. Mein Herz entkommt nicht – my heart does not escape.", "slow": "Entkommen. Mein Herz entkommt nicht – my heart does not escape.", "grammar": "Mein Herz entkommt nicht – my heart does not escape."}, {"type": "narration", "text": "--I walked home in the grey afternoon, and I did not feel the cold at all. That night, he came home late. I was already in bed – the bed, his bed, the one he had given up for me – but I was not asleep. I was staring at the ceiling, replaying the bookstore over and over in my head. The door opened. His footsteps. He did not turn on the light."}, {"type": "dialogue", "text": "“You are awake,” he said."}, {"type": "dialogue", "text": "“How do you know?”"}, {"type": "dialogue", "text": "“Because you are breathing like you are thinking.”"}, {"type": "narration", "text": "I turned over. He was standing by the door, a dark shape against the darker room."}, {"type": "practice", "prompt": "Now say “to breathe” – atmen.", "answer": "Atmen. Du atmest – you breathe. Ich atme – I breathe.", "slow": "Atmen. Du atmest – you breathe. Ich atme – I breathe.", "grammar": "Du atmest – you breathe. Ich atme – I breathe."}, {"type": "practice", "prompt": "Now say “to think” – denken.", "answer": "Denken. Ich denke – I think. Was denkst du? – What do you think?.", "slow": "Denken. Ich denke – I think. Was denkst du? – What do you think?.", "grammar": "Ich denke – I think. Was denkst du? – What do you think?"}, {"type": "dialogue", "text": "--“Matei.”"}, {"type": "dialogue", "text": "“What?”"}, {"type": "dialogue", "text": "“What did you mean? ‘Show me.’ What did you want me to show you?”"}, {"type": "narration", "text": "He was quiet for so long I thought he was not going to answer. Then he walked to the sofa. Sat down. I heard the cushions sigh under his weight."}, {"type": "dialogue", "text": "“I wanted you to show me that you wanted to stay,” he said. “Not because you had"}, {"type": "narration", "text": "to. Because you chose to.” I sat up. The sheet fell to my waist. The room was cold, but I did not care."}, {"type": "dialogue", "text": "“I am still here,” I said."}, {"type": "dialogue", "text": "“You are.”"}, {"type": "dialogue", "text": "“I have not run away.”"}, {"type": "dialogue", "text": "“No.”"}, {"type": "dialogue", "text": "“Is that not enough?”"}, {"type": "practice", "prompt": "Now say “enough” – genug.", "answer": "Genug. Ist das nicht genug? – Is that not enough?.", "slow": "Genug. Ist das nicht genug? – Is that not enough?.", "grammar": "Ist das nicht genug? – Is that not enough?"}, {"type": "practice", "prompt": "Now say “to choose” – wählen or sich entscheiden.", "answer": "Sich entscheiden. Ich entscheide mich – I decide.", "slow": "Sich entscheiden. Ich entscheide mich – I decide.", "grammar": "Ich entscheide mich – I decide."}, {"type": "narration", "text": "--He turned to look at me. I could just make out his face in the dark – the curve of his jaw, the shadow of his eyes."}, {"type": "dialogue", "text": "“It is a start,” he said."}, {"type": "narration", "text": "Then he lay down. Pulled his coat over himself. Turned his back to me. I lay back down. Stared at the ceiling. Listened to him breathe. And for the second time that week, I did not feel like running. I felt like staying."}, {"type": "practice", "prompt": "Now say “a start” – ein Anfang.", "answer": "Ein Anfang. Das ist ein Anfang – that is a start.", "slow": "Ein Anfang. Das ist ein Anfang – that is a start.", "grammar": "Das ist ein Anfang – that is a start."}, {"type": "practice", "prompt": "Now say “to stay” – bleiben. Ich bleibe.", "answer": "Bleiben. Ich bleibe.", "slow": "Bleiben. Ich bleibe.", "grammar": "Ich bleibe."}], "bg": "café", "location": "Morgenlicht & Bookstore"}, {"id": 6, "title": "The Almost", "level": "A1-A2", "segments": [{"type": "narration", "text": "hum of a lamp.) Something shifted after the bookstore. Not dramatically. Not the way it happens in movies, with rain and swelling music and a speech that fixes everything. It was smaller than that. Quieter. The way light changes when a cloud moves – not suddenly, but when you look up, everything is different. Matei started leaving things for me."}, {"type": "practice", "prompt": "Now say “to shift” – sich verändern.", "answer": "Sich verändern. Etwas verändert sich – something changes.", "slow": "Sich verändern. Etwas verändert sich – something changes.", "grammar": "Etwas verändert sich – something changes."}, {"type": "practice", "prompt": "Now say “the cloud” – die Wolke.", "answer": "Die Wolke. Feminine.", "slow": "Die Wolke. Feminine.", "grammar": "Feminine."}, {"type": "narration", "text": "--A scarf on the back of the wooden chair. “It is cold,” he said when I asked. “You do not have a scarf.” He was right. I wore it every morning. A notebook – a new one, black, with blank pages – on the table. “You are filling the other one,” he said. “I saw it at the bookstore.” I did not tell him I had already bought a replacement. I used his instead. A small plant on the windowsill. A succulent, the kind that survived neglect."}, {"type": "dialogue", "text": "“Every apartment needs a plant,” he said. “Otherwise it is just a box.” I named it"}, {"type": "narration", "text": "Matei Jr. He did not laugh, but his mouth twitched."}, {"type": "practice", "prompt": "Now say “the scarf” – der Schal.", "answer": "Der Schal. Masculine.", "slow": "Der Schal. Masculine.", "grammar": "Masculine."}, {"type": "practice", "prompt": "Now say “the plant” – die Pflanze.", "answer": "Die Pflanze. Feminine.", "slow": "Die Pflanze. Feminine.", "grammar": "Feminine."}, {"type": "practice", "prompt": "Now say “the windowsill” – das Fensterbrett.", "answer": "Das Fensterbrett. Neuter.", "slow": "Das Fensterbrett. Neuter.", "grammar": "Neuter."}, {"type": "narration", "text": "--These were not grand gestures. They were not declarations. But they were things. Physical evidence that he was thinking about me when I was not there. And I was collecting them like evidence."}, {"type": "practice", "prompt": "Now say “the gesture” – die Geste.", "answer": "Die Geste. Feminine.", "slow": "Die Geste. Feminine.", "grammar": "Feminine."}, {"type": "practice", "prompt": "Now say “the evidence” – der Beweis.", "answer": "Der Beweis. Masculine.", "slow": "Der Beweis. Masculine.", "grammar": "Masculine."}, {"type": "narration", "text": "--On my twelfth day at Morgenlicht, Frau Schmidt asked me a question."}, {"type": "dialogue", "text": "“Yves,” she said. She was wiping down the counter, her back to me. “You and Matei."}, {"type": "narration", "text": "Are you together?” I dropped the cup I was holding. It shattered on the floor. Coffee everywhere. Frau Schmidt did not turn around."}, {"type": "dialogue", "text": "“That is your fourth cup this week,” she said calmly."}, {"type": "practice", "prompt": "Now say “together” – zusammen. Review.", "answer": "Zusammen. Seid ihr zusammen? – Are you together?.", "slow": "Zusammen. Seid ihr zusammen? – Are you together?.", "grammar": "Seid ihr zusammen? – Are you together?"}, {"type": "practice", "prompt": "Now say “the question” – die Frage.", "answer": "Die Frage. Eine Frage stellen – to ask a question.", "slow": "Die Frage. Eine Frage stellen – to ask a question.", "grammar": "Eine Frage stellen – to ask a question."}, {"type": "dialogue", "text": "“I am sorry,” I said."}, {"type": "dialogue", "text": "“You are not sorry. You are avoiding the question.”"}, {"type": "narration", "text": "I got the broom. Swept up the pieces. My face was hot. I could feel it burning."}, {"type": "dialogue", "text": "“We are not together,” I said."}, {"type": "dialogue", "text": "“Ah.” She finally turned. Her grey eyes were kind, but they were also sharp. “So"}, {"type": "narration", "text": "you are just living in his apartment. Sleeping in his bed. Wearing his scarf.”"}, {"type": "dialogue", "text": "“It is not his bed. It is his sofa.”"}, {"type": "dialogue", "text": "“His sofa. His apartment. His key.” She raised an eyebrow. “This is a lot for ‘not"}, {"type": "practice", "prompt": "Now say “to avoid” – vermeiden.", "answer": "Vermeiden. Du vermeidest die Frage – you are avoiding the question.", "slow": "Vermeiden. Du vermeidest die Frage – you are avoiding the question.", "grammar": "Du vermeidest die Frage – you are avoiding the question."}, {"type": "practice", "prompt": "Now say “the broom” – der Besen.", "answer": "Der Besen. Masculine.", "slow": "Der Besen. Masculine.", "grammar": "Masculine."}, {"type": "narration", "text": "--I did not have an answer. I threw the broken cup in the trash and went back to the espresso machine."}, {"type": "dialogue", "text": "“Yves.”"}, {"type": "dialogue", "text": "“What?”"}, {"type": "dialogue", "text": "“He talks about you.”"}, {"type": "dialogue", "text": "“What?”"}, {"type": "dialogue", "text": "“When he comes in for coffee. He talks about you.” She smiled. It was a small"}, {"type": "narration", "text": "smile, secret. “He does not say much. He never says much. But he mentions you."}, {"type": "dialogue", "text": "‘Yves likes the apricot pastries.’ ‘Yves learned to say Rechnung today.’ ‘Yves"}, {"type": "narration", "text": "laughed at something I said.’” She shrugged. “A man who remembers the pastries you like is a man who is paying attention.”"}, {"type": "practice", "prompt": "Now say “to talk about” – sprechen über.", "answer": "Sprechen über. Er spricht über dich – he talks about you.", "slow": "Sprechen über. Er spricht über dich – he talks about you.", "grammar": "Er spricht über dich – he talks about you."}, {"type": "practice", "prompt": "Now say “to mention” – erwähnen.", "answer": "Erwähnen. Er erwähnt dich – he mentions you.", "slow": "Erwähnen. Er erwähnt dich – he mentions you.", "grammar": "Er erwähnt dich – he mentions you."}, {"type": "practice", "prompt": "Now say “to pay attention” – aufpassen (separable).", "answer": "Aufpassen. Er passt auf – he pays attention.", "slow": "Aufpassen. Er passt auf – he pays attention.", "grammar": "Er passt auf – he pays attention."}, {"type": "narration", "text": "--I did not know what to say. So I said nothing. I made a cappuccino for a customer who was not there. Frau Schmidt watched me with that sharp, kind look."}, {"type": "dialogue", "text": "“You are both stubborn,” she said. “This is why nothing has happened yet.”"}, {"type": "dialogue", "text": "“Nothing has not happened because nothing is supposed to happen.”"}, {"type": "dialogue", "text": "“Lie to yourself if you want. But do not lie to me.” She patted my cheek. “Now"}, {"type": "narration", "text": "clean the counter. You got coffee everywhere.”"}, {"type": "practice", "prompt": "Now say “stubborn” – stur.", "answer": "Stur. Ihr seid beide stur – you are both stubborn.", "slow": "Stur. Ihr seid beide stur – you are both stubborn.", "grammar": "Ihr seid beide stur – you are both stubborn."}, {"type": "practice", "prompt": "Now say “to lie” – lügen. Review. Lüg dich nicht an – do not lie to yourself.", "answer": "--That night, I walked home slower than usual.", "slow": "--That night, I walked home slower than usual.", "grammar": "The streets were wet. It had rained while I was working, and the streetlights reflected off the pavement in orange pools. The air smelled like wet stone and something green. Spring was coming. I could feel it."}, {"type": "narration", "text": "I thought about what Frau Schmidt had said. He talks about you. Matei, who spoke in short sentences. Matei, who remembered everything. Matei, who had given me a key and a job and a scarf and a plant. Matei, who had not touched me since that first week."}, {"type": "practice", "prompt": "Now say “the streetlight” – die Straßenlaterne.", "answer": "Die Straßenlaterne. Feminine.", "slow": "Die Straßenlaterne. Feminine.", "grammar": "Feminine."}, {"type": "practice", "prompt": "Now say “spring” – der Frühling.", "answer": "Der Frühling. Masculine.", "slow": "Der Frühling. Masculine.", "grammar": "Masculine."}, {"type": "narration", "text": "--I stopped at the bridge. The canal was dark. The duck was asleep somewhere, probably. I leaned on the railing and stared at the water. You are both stubborn. She was right. I was stubborn. I was terrified. I had spent my whole life waiting for people to leave, and now someone was staying, and I did not know what to do with that. My body knew what it wanted. My heart knew what it wanted. But my mouth – my stupid, broken mouth – could not form the words."}, {"type": "practice", "prompt": "Now say “the bridge” – die Brücke. Review.", "answer": "Die Brücke.", "slow": "Die Brücke.", "grammar": "Repeat aloud: Die Brücke."}, {"type": "practice", "prompt": "Now say “the canal” – der Kanal.", "answer": "Der Kanal. Masculine.", "slow": "Der Kanal. Masculine.", "grammar": "Masculine."}, {"type": "practice", "prompt": "Now say “terrified” – verängstigt. Review.", "answer": "Verängstigt. Ich bin verängstigt.", "slow": "Verängstigt. Ich bin verängstigt.", "grammar": "Ich bin verängstigt."}, {"type": "narration", "text": "--I pulled out my phone. Matei. I typed it. Erased it. Typed it again. Are you home? Three dots appeared. Then disappeared. Then appeared again. Yes. I am on my way. I know. I stared at the screen. I know. How did he know? Was he watching the window? Did he have a sixth sense for when I was standing on bridges, trying to work up the courage to say something? I put my phone away and walked."}, {"type": "practice", "prompt": "Now say “the courage” – der Mut.", "answer": "Der Mut. Masculine. Mut haben – to have courage.", "slow": "Der Mut. Masculine. Mut haben – to have courage.", "grammar": "Masculine. Mut haben – to have courage."}, {"type": "practice", "prompt": "Now say “the sixth sense” – der sechste Sinn.", "answer": "Der sechste Sinn. Sinn is masculine.", "slow": "Der sechste Sinn. Sinn is masculine.", "grammar": "Sinn is masculine."}, {"type": "narration", "text": "--The stairs were thirty-seven steps. The key stuck. The door opened. Matei was standing by the window. His back was to me. He was looking out at the street – the same street I had just walked down. The same orange lights."}, {"type": "dialogue", "text": "“You are late,” he said without turning."}, {"type": "dialogue", "text": "“The café closed late.”"}, {"type": "dialogue", "text": "“Frau Schmidt texted me. She said you dropped a cup.”"}, {"type": "dialogue", "text": "“She texts you about that?”"}, {"type": "dialogue", "text": "“She texts me about a lot of things.” He turned. His face was half in shadow. “She"}, {"type": "dialogue", "text": "“She told me you talk about me.”"}, {"type": "practice", "prompt": "Now say “the shadow” – der Schatten.", "answer": "Der Schatten. Masculine.", "slow": "Der Schatten. Masculine.", "grammar": "Masculine."}, {"type": "practice", "prompt": "Now say “to deny” – leugnen or verneinen.", "answer": "Leugnen. Er leugnet es nicht – he does not deny it.", "slow": "Leugnen. Er leugnet es nicht – he does not deny it.", "grammar": "Er leugnet es nicht – he does not deny it."}, {"type": "dialogue", "text": "--“Yves.”"}, {"type": "dialogue", "text": "“What?”"}, {"type": "dialogue", "text": "“Why did you text me?”"}, {"type": "narration", "text": "I walked to the table. Sat on the wooden chair. The scarf – his scarf – was still around my neck. I unwrapped it slowly, buying time."}, {"type": "dialogue", "text": "“Because I wanted to know if you were here,” I said."}, {"type": "dialogue", "text": "“I am always here.”"}, {"type": "dialogue", "text": "“Not always. You work. You go to the library. You have a life that does not"}, {"type": "narration", "text": "involve me.” He walked to the plastic chair. Sat down across from me. The lamp was between us, casting a yellow circle on the table."}, {"type": "dialogue", "text": "“You are in every part of my life,” he said quietly. “You just do not see it.”"}, {"type": "dialogue", "text": "“Then show me.”"}, {"type": "practice", "prompt": "Now say “to involve” – einbeziehen.", "answer": "Einbeziehen. Mein Leben bezieht dich ein – my life involves you.", "slow": "Einbeziehen. Mein Leben bezieht dich ein – my life involves you.", "grammar": "Mein Leben bezieht dich ein – my life involves you."}, {"type": "practice", "prompt": "Now say “to see” – sehen. Review.", "answer": "Sehen. Du siehst es nicht – you do not see it.", "slow": "Sehen. Du siehst es nicht – you do not see it.", "grammar": "Du siehst es nicht – you do not see it."}, {"type": "narration", "text": "--The words came out before I could stop them. They hung in the air like smoke. Matei's expression did not change. But his hand – his right hand – reached across the table. Palm up. An invitation."}, {"type": "dialogue", "text": "“Come here,” he said."}, {"type": "dialogue", "text": "“Yves.”"}, {"type": "dialogue", "text": "“I am scared.”"}, {"type": "dialogue", "text": "“I know.”"}, {"type": "dialogue", "text": "“If I come over there, something is going to happen.”"}, {"type": "dialogue", "text": "“I know.”"}, {"type": "dialogue", "text": "“And I do not know if I am ready.”"}, {"type": "narration", "text": "He did not pull his hand back. He just waited. His palm was open. His fingers were still."}, {"type": "dialogue", "text": "“You do not have to be ready,” he said. “You just have to be here.”"}, {"type": "practice", "prompt": "Now say “ready” – bereit.", "answer": "Bereit. Ich bin bereit – I am ready. Ich bin nicht bereit – I am not ready.", "slow": "Bereit. Ich bin bereit – I am ready. Ich bin nicht bereit – I am not ready.", "grammar": "Ich bin bereit – I am ready. Ich bin nicht bereit – I am not ready."}, {"type": "practice", "prompt": "Now say “the invitation” – die Einladung.", "answer": "Die Einladung. Feminine – -ung ending.", "slow": "Die Einladung. Feminine – -ung ending.", "grammar": "Feminine – -ung ending."}, {"type": "narration", "text": "--I stood up. Walked around the table. Sat on the sofa next to him. Close. Close enough that our knees touched. Close enough that I could smell his coat – cold air, coffee, something underneath that was just him. He did not move. He did not touch me. He just sat there, his hand still on the cushion between us."}, {"type": "dialogue", "text": "“Matei.”"}, {"type": "dialogue", "text": "“What?”"}, {"type": "dialogue", "text": "“Why have you not kissed me yet?”"}, {"type": "narration", "text": "The question was stupid. It was also the only question that mattered."}, {"type": "practice", "prompt": "Now say “to kiss” – küssen.", "answer": "Küssen. Warum hast du mich nicht geküsst? – Why have you not kissed me?.", "slow": "Küssen. Warum hast du mich nicht geküsst? – Why have you not kissed me?.", "grammar": "Warum hast du mich nicht geküsst? – Why have you not kissed me?"}, {"type": "practice", "prompt": "Now say “the question” – die Frage. Review.", "answer": "Die Frage. Die einzige Frage – the only question.", "slow": "Die Frage. Die einzige Frage – the only question.", "grammar": "Die einzige Frage – the only question."}, {"type": "narration", "text": "--He turned to look at me. His grey eyes were dark in the lamplight. His face was close. Too close. Not close enough."}, {"type": "dialogue", "text": "“Because I wanted you to want it,” he said. “Not because you felt obligated. Not"}, {"type": "narration", "text": "because I am the only person who has been nice to you. I wanted you to want it.”"}, {"type": "dialogue", "text": "“I do want it.”"}, {"type": "dialogue", "text": "“Then why have you not kissed me?”"}, {"type": "dialogue", "text": "“You asked why I have not kissed you. Why have you not kissed me?”"}, {"type": "practice", "prompt": "Now say “obligated” – verpflichtet.", "answer": "Verpflichtet. Aus Verpflichtung – out of obligation.", "slow": "Verpflichtet. Aus Verpflichtung – out of obligation.", "grammar": "Aus Verpflichtung – out of obligation."}, {"type": "practice", "prompt": "Now say “to want” – wollen.", "answer": "Wollen. Ich will – I want. Du willst – you want. Er will – he wants. No ending for.", "slow": "Wollen. Ich will – I want. Du willst – you want. Er will – he wants. No ending for.", "grammar": "Ich will – I want. Du willst – you want. Er will – he wants. No ending for ich and er."}, {"type": "narration", "text": "--I opened my mouth. Closed it. Opened it again."}, {"type": "dialogue", "text": "“Because I am a coward,” I said."}, {"type": "dialogue", "text": "“You are not a coward.”"}, {"type": "dialogue", "text": "“I am. I have been running my whole life. From home, from people, from feelings. I"}, {"type": "narration", "text": "came to Berlin because I was running.”"}, {"type": "dialogue", "text": "“And now?”"}, {"type": "narration", "text": "I looked at his hand. The scar on his thumb. The veins. The way his fingers curled slightly, like he was resisting the urge to reach for me."}, {"type": "dialogue", "text": "“Now I do not want to run anymore,” I said. “But I do not know how to stay.”"}, {"type": "practice", "prompt": "Now say “the coward” – der Feigling.", "answer": "Der Feigling. Masculine. Ich bin ein Feigling – I am a coward.", "slow": "Der Feigling. Masculine. Ich bin ein Feigling – I am a coward.", "grammar": "Masculine. Ich bin ein Feigling – I am a coward."}, {"type": "practice", "prompt": "Now say “to run” – laufen or rennen. Review.", "answer": "Laufen. Ich laufe – I run. Ich will nicht mehr laufen – I do not want to run.", "slow": "Laufen. Ich laufe – I run. Ich will nicht mehr laufen – I do not want to run.", "grammar": "Ich laufe – I run. Ich will nicht mehr laufen – I do not want to run anymore."}, {"type": "narration", "text": "--He turned his hand over. Palm up again. The invitation was still there."}, {"type": "dialogue", "text": "“You stay by staying,” he said. “One day at a time. One moment at a time. You wake"}, {"type": "narration", "text": "up. You make coffee. You go to work. You come home. And you do not leave.”"}, {"type": "dialogue", "text": "“That is it?”"}, {"type": "dialogue", "text": "“That is it.”"}, {"type": "narration", "text": "I looked at his palm. The lines. The warmth."}, {"type": "dialogue", "text": "“And what about you?” I asked."}, {"type": "dialogue", "text": "“What about me?”"}, {"type": "dialogue", "text": "“Are you staying?”"}, {"type": "narration", "text": "He did not answer with words. He moved his hand – slowly, so slowly – and placed it on top of mine. His fingers curled around my knuckles. His palm was warm."}, {"type": "practice", "prompt": "Now say “the moment” – der Moment.", "answer": "Der Moment. Masculine. Moment für Moment – moment by moment.", "slow": "Der Moment. Masculine. Moment für Moment – moment by moment.", "grammar": "Masculine. Moment für Moment – moment by moment."}, {"type": "practice", "prompt": "Now say “the warmth” – die Wärme.", "answer": "Die Wärme. Feminine.", "slow": "Die Wärme. Feminine.", "grammar": "Feminine."}, {"type": "dialogue", "text": "--“I have been staying,” he said. “I have been staying since the first message. Two"}, {"type": "narration", "text": "years ago. I have been staying since you got off the plane. I will be staying when you finally figure out that you deserve to be here.” My eyes were wet. I did not know when that had happened."}, {"type": "dialogue", "text": "“That is a lot of pressure,” I whispered."}, {"type": "dialogue", "text": "“No.” He squeezed my hand. “It is a lot of patience. Pressure is what you put on"}, {"type": "narration", "text": "yourself. Patience is what I am giving you.”"}, {"type": "practice", "prompt": "Now say “the pressure” – der Druck.", "answer": "Der Druck. Masculine.", "slow": "Der Druck. Masculine.", "grammar": "Masculine."}, {"type": "practice", "prompt": "Now say “the patience” – die Geduld.", "answer": "Die Geduld. Feminine.", "slow": "Die Geduld. Feminine.", "grammar": "Feminine."}, {"type": "narration", "text": "--I turned my hand over. Our palms pressed together. His fingers laced through mine."}, {"type": "dialogue", "text": "“Matei.”"}, {"type": "dialogue", "text": "“Yves.”"}, {"type": "dialogue", "text": "“I still do not know how to say what I want to say.”"}, {"type": "dialogue", "text": "“Then do not say it.”"}, {"type": "narration", "text": "He leaned in. The space between us disappeared. His forehead touched mine. His breath was warm on my lips. His nose brushed against my cheek. We were so close that I could see the individual lashes of his eyes, the small mole above his eyebrow, the way his mouth was slightly open. He did not kiss me. He just stayed there. Forehead to forehead. Breath to breath. Hands together."}, {"type": "dialogue", "text": "“This is enough,” he said. “For now.”"}, {"type": "dialogue", "text": "“Okay,” I said."}, {"type": "dialogue", "text": "“Okay.”"}, {"type": "practice", "prompt": "Now say “the forehead” – die Stirn.", "answer": "Die Stirn. Feminine.", "slow": "Die Stirn. Feminine.", "grammar": "Feminine."}, {"type": "practice", "prompt": "Now say “the eyelash” – die Wimper.", "answer": "Die Wimper. Feminine.", "slow": "Die Wimper. Feminine.", "grammar": "Feminine."}, {"type": "narration", "text": "--We stayed like that for a long time. The lamp buzzed. The radiator clicked. Somewhere downstairs, someone was playing music – slow, sad, beautiful. I did not know how long we sat there. Minutes. Maybe hours. Time had stopped meaning anything. Eventually, he pulled back. His hand was still in mine."}, {"type": "dialogue", "text": "“You should sleep,” he said."}, {"type": "dialogue", "text": "“So should you.”"}, {"type": "dialogue", "text": "“I will. After you.”"}, {"type": "narration", "text": "I laughed. It was small, but it was real."}, {"type": "dialogue", "text": "“Good night, Matei.”"}, {"type": "dialogue", "text": "“Good night, Yves.”"}, {"type": "practice", "prompt": "Now say “the music” – die Musik.", "answer": "Die Musik. Feminine.", "slow": "Die Musik. Feminine.", "grammar": "Feminine."}, {"type": "practice", "prompt": "Now say “beautiful” – schön.", "answer": "Schön. Die Musik ist schön – the music is beautiful.", "slow": "Schön. Die Musik ist schön – the music is beautiful.", "grammar": "Die Musik ist schön – the music is beautiful."}, {"type": "narration", "text": "--- I went to the bed. He went to the sofa. But this time, when I lay down, I did not stare at the ceiling. I closed my eyes and listened to him breathe. And for the first time, the space between us did not feel like a held breath. It felt like a beginning."}, {"type": "practice", "prompt": "Now say “the beginning” – der Anfang. Review.", "answer": "Der Anfang. Ein Anfang – a beginning.", "slow": "Der Anfang. Ein Anfang – a beginning.", "grammar": "Ein Anfang – a beginning."}, {"type": "practice", "prompt": "Now say “to feel like” – sich anfühlen wie.", "answer": "Sich anfühlen wie. Es fühlt sich an wie ein Anfang – it feels like a beginning.", "slow": "Sich anfühlen wie. Es fühlt sich an wie ein Anfang – it feels like a beginning.", "grammar": "Es fühlt sich an wie ein Anfang – it feels like a beginning."}], "bg": "bookstore", "location": "Bücher & Co — Corner Table"}, {"id": 7, "title": "The Crack", "level": "A1-A2", "segments": [{"type": "narration", "text": "bell, the hum of a refrigerator.) The next morning, Matei was gone before I woke up. That was not new. He was an early riser. He liked to be out of the apartment before the city got loud, before the bakery downstairs started selling out of the good bread, before I had to drag myself out of bed and pretend to be a functional human being. But this time felt different. The space beside me was cold. No lingering warmth. No dent in the pillow where his head had been. He had gotten up hours ago, and he had not come back."}, {"type": "practice", "prompt": "Now say “to wake up” – aufwachen. Review.", "answer": "Aufwachen. Ich wache auf.", "slow": "Aufwachen. Ich wache auf.", "grammar": "Ich wache auf."}, {"type": "practice", "prompt": "Now say “the pillow” – das Kissen.", "answer": "Das Kissen. Neuter. Das Kissen hat eine Delle – the pillow has a dent.", "slow": "Das Kissen. Neuter. Das Kissen hat eine Delle – the pillow has a dent.", "grammar": "Neuter. Das Kissen hat eine Delle – the pillow has a dent."}, {"type": "narration", "text": "--I sat up. The apartment was quiet. Too quiet. On the table, there was coffee. Black. No sugar. No milk. And a note. Yves – I need some air. I will be back tonight. – M. No do not burn the milk. No you have flour in your hair. Just four sentences, written in that small, neat handwriting I had come to recognise. I read the note three times. Then I folded it and put it in my pocket. Next to the key."}, {"type": "practice", "prompt": "Now say “the note” – der Zettel. Review.", "answer": "Der Zettel.", "slow": "Der Zettel.", "grammar": "Repeat aloud: Der Zettel."}, {"type": "practice", "prompt": "Now say “the air” – die Luft.", "answer": "Die Luft. Feminine. Ich brauche etwas Luft – I need some air.", "slow": "Die Luft. Feminine. Ich brauche etwas Luft – I need some air.", "grammar": "Feminine. Ich brauche etwas Luft – I need some air."}, {"type": "narration", "text": "--Work was a disaster. I dropped two cups before noon. Frau Schmidt did not say anything, but she watched me with those sharp grey eyes, and at 11:30, she pulled me aside."}, {"type": "dialogue", "text": "“Sit,” she said, pointing at a table."}, {"type": "dialogue", "text": "“I have to clean the bathroom.”"}, {"type": "dialogue", "text": "“The bathroom can wait. Sit.”"}, {"type": "narration", "text": "I sat. She sat across from me. The café was empty except for a man in the corner reading a newspaper and ignoring us."}, {"type": "practice", "prompt": "Now say “the disaster” – die Katastrophe.", "answer": "Die Katastrophe. Feminine. Die Arbeit war eine Katastrophe – work was a disaster.", "slow": "Die Katastrophe. Feminine. Die Arbeit war eine Katastrophe – work was a disaster.", "grammar": "Feminine. Die Arbeit war eine Katastrophe – work was a disaster."}, {"type": "practice", "prompt": "Now say “the newspaper” – die Zeitung.", "answer": "Die Zeitung. Feminine. Der Mann liest Zeitung – the man is reading a newspaper.", "slow": "Die Zeitung. Feminine. Der Mann liest Zeitung – the man is reading a newspaper.", "grammar": "Feminine. Der Mann liest Zeitung – the man is reading a newspaper."}, {"type": "dialogue", "text": "--“What happened?” she asked."}, {"type": "dialogue", "text": "“Nothing.”"}, {"type": "dialogue", "text": "“You dropped two cups. Last week you dropped four total. This is regression.”"}, {"type": "dialogue", "text": "“I am tired.”"}, {"type": "dialogue", "text": "“You are lying.” She folded her arms. “Did you and Matei fight?”"}, {"type": "narration", "text": "I stared at the table. The wood was scratched. Someone had carved a heart into it, years ago, with two initials inside. T + M. Not Matei. Someone else."}, {"type": "dialogue", "text": "“He is upset,” I said. “Because I did not tell him about something.”"}, {"type": "practice", "prompt": "Now say “the regression” – der Rückschritt.", "answer": "Der Rückschritt. Masculine. Das ist ein Rückschritt – that's regression.", "slow": "Der Rückschritt. Masculine. Das ist ein Rückschritt – that's regression.", "grammar": "Masculine. Das ist ein Rückschritt – that's regression."}, {"type": "practice", "prompt": "Now say “to carve” – schnitzen. Jemand hat ein Herz geschnitzt – someone carved a", "answer": "heart.", "slow": "heart.", "grammar": "Repeat aloud: heart."}, {"type": "dialogue", "text": "--“What something?”"}, {"type": "dialogue", "text": "“A friend texted me. A coworker of his. It was nothing. But I did not mention it,"}, {"type": "narration", "text": "and he found out, and now he thinks I am hiding things.” Frau Schmidt was quiet for a moment. Then she said, “Is he wrong?” I looked up. “What?”"}, {"type": "dialogue", "text": "“Are you hiding things? Not the texts. Other things.”"}, {"type": "narration", "text": "I opened my mouth. Closed it. Opened it again."}, {"type": "dialogue", "text": "“I do not know,” I said. “Maybe. I do not know how to do this.”"}, {"type": "practice", "prompt": "Now say “to hide” – verstecken. Review.", "answer": "Verstecken. Du versteckst etwas – you are hiding something.", "slow": "Verstecken. Du versteckst etwas – you are hiding something.", "grammar": "Du versteckst etwas – you are hiding something."}, {"type": "practice", "prompt": "Now say “to find out” – herausfinden (separable). Er hat es herausgefunden – he", "answer": "found out.", "slow": "found out.", "grammar": "Repeat aloud: found out."}, {"type": "dialogue", "text": "--“Do what?”"}, {"type": "dialogue", "text": "“This.” I gestured at the café, at the window, at the grey sky outside. “Being"}, {"type": "narration", "text": "with someone. Staying. Not running.” She nodded slowly. “My husband was like you.”"}, {"type": "dialogue", "text": "“He ran?”"}, {"type": "dialogue", "text": "“He tried. Many times. The first year we were married, he packed a bag three"}, {"type": "narration", "text": "times. Each time, I unpacked it for him.” She smiled. “The fourth time, he packed the bag, and I packed one too. I told him, ‘If you go, I go.’ He never packed again.”"}, {"type": "dialogue", "text": "“That is not advice.”"}, {"type": "dialogue", "text": "“It is not advice. It is a story.” She reached across the table and patted my"}, {"type": "narration", "text": "hand. “You want advice? Here it is. Stop trying to be perfect. You will make mistakes. You will hurt him. He will hurt you. This is what it means to be with someone. The question is not whether you will make mistakes. The question is whether you will stay after you make them.”"}, {"type": "practice", "prompt": "Now say “to pack a bag” – einen Koffer packen.", "answer": "Einen Koffer packen. Er packte einen Koffer – he packed a bag.", "slow": "Einen Koffer packen. Er packte einen Koffer – he packed a bag.", "grammar": "Er packte einen Koffer – he packed a bag."}, {"type": "practice", "prompt": "Now say “the mistake” – der Fehler.", "answer": "Der Fehler. Masculine. Du wirst Fehler machen – you will make mistakes.", "slow": "Der Fehler. Masculine. Du wirst Fehler machen – you will make mistakes.", "grammar": "Masculine. Du wirst Fehler machen – you will make mistakes."}, {"type": "narration", "text": "--I looked at the heart carved into the table. T + M."}, {"type": "dialogue", "text": "“What if he leaves first?” I asked."}, {"type": "dialogue", "text": "“Then you let him. And you learn. And you try again with someone else.” She"}, {"type": "narration", "text": "squeezed my hand. “But he has not left yet. Has he?”"}, {"type": "dialogue", "text": "“No.”"}, {"type": "dialogue", "text": "“Then stop planning for a disaster that has not happened.”"}, {"type": "practice", "prompt": "Now say “to let go” – loslassen (separable).", "answer": "Loslassen. Dann lässt du ihn gehen – then you let him go.", "slow": "Loslassen. Dann lässt du ihn gehen – then you let him go.", "grammar": "Dann lässt du ihn gehen – then you let him go."}, {"type": "practice", "prompt": "Now say “to plan” – planen. Hör auf zu planen – stop planning.", "answer": "--I left work early. Frau Schmidt shooed me out the door with a bag of apricot.", "slow": "--I left work early. Frau Schmidt shooed me out the door with a bag of apricot.", "grammar": "Frau Schmidt shooed me out the door with a bag of apricot pastries. I walked to the bridge. The duck was there today, paddling in circles like it had nowhere to be and all day to get there. I leaned on the railing and ate a pastry. It was warm. Flaky. Too sweet. I ate another one. My phone buzzed. Matei: Where are you?"}, {"type": "practice", "prompt": "Now say “to shoo away” – wegwinken or fortscheuchen.", "answer": "Fortscheuchen. Frau Schmidt scheuchte mich weg – Frau Schmidt shooed me away.", "slow": "Fortscheuchen. Frau Schmidt scheuchte mich weg – Frau Schmidt shooed me away.", "grammar": "Frau Schmidt scheuchte mich weg – Frau Schmidt shooed me away."}, {"type": "practice", "prompt": "Now say “the railing” – das Geländer.", "answer": "Das Geländer. Neuter. Auf das Geländer lehnen – to lean on the railing.", "slow": "Das Geländer. Neuter. Auf das Geländer lehnen – to lean on the railing.", "grammar": "Neuter. Auf das Geländer lehnen – to lean on the railing."}, {"type": "narration", "text": "--I stared at the message. He had not texted me all day. Now he was asking where I was. Bridge, I wrote back. The one with the duck. I know which one. Stay there. I waited. The duck paddled. A family walked past with a dog on a leash. The dog tried to jump into the canal. The family laughed. The dog did not. Twenty minutes later, Matei appeared at the end of the bridge."}, {"type": "practice", "prompt": "Now say “the leash” – die Leine.", "answer": "Die Leine. Feminine. Ein Hund an der Leine – a dog on a leash.", "slow": "Die Leine. Feminine. Ein Hund an der Leine – a dog on a leash.", "grammar": "Feminine. Ein Hund an der Leine – a dog on a leash."}, {"type": "practice", "prompt": "Now say “to appear” – auftauchen (separable).", "answer": "Auftauchen. Matei tauchte am Ende der Brücke auf – Matei appeared at the end of.", "slow": "Auftauchen. Matei tauchte am Ende der Brücke auf – Matei appeared at the end of.", "grammar": "Matei tauchte am Ende der Brücke auf – Matei appeared at the end of the bridge."}, {"type": "narration", "text": "--He was wearing the same grey coat. His hands were in his pockets. His hair was messy, like he had been running his hands through it. He walked to me. Stopped a metre away. Did not touch me."}, {"type": "dialogue", "text": "“You came,” I said."}, {"type": "dialogue", "text": "“I said I would.”"}, {"type": "dialogue", "text": "“You also said you needed air.”"}, {"type": "dialogue", "text": "“I got air.” He looked at the duck. “A lot of air. I walked halfway across the"}, {"type": "dialogue", "text": "“Did it help?”"}, {"type": "dialogue", "text": "“No.”"}, {"type": "practice", "prompt": "Now say “halfway” – die Hälfte. Die halbe Stadt – half the city.", "answer": "Die halbe Stadt. Ich bin die halbe Stadt gelaufen – I walked halfway across the.", "slow": "Die halbe Stadt. Ich bin die halbe Stadt gelaufen – I walked halfway across the.", "grammar": "Ich bin die halbe Stadt gelaufen – I walked halfway across the"}, {"type": "practice", "prompt": "Now say “to help” – helfen. Hat es geholfen? – Did it help?", "answer": "--I offered him a pastry. He took it. Ate it in two bites. Wiped his mouth with the.", "slow": "--I offered him a pastry. He took it. Ate it in two bites. Wiped his mouth with the.", "grammar": "He took it. Ate it in two bites. Wiped his mouth with the back of his hand. “I am not good at this,” he said. “At what?” “At being angry.” He turned to look at me. His grey eyes were tired. “
