<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yves in Germany — Learn German</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--gold:#c8a96e;--gold2:#8b6914;--dark:#0d0d1a;--dark2:#111128;--text:#f0e8d8;--muted:#8888aa;--blue:#90b8d0;--green:#4a9a4a;--red:#9a4a4a;--purple:#7a7aff}
body{background:var(--dark);color:var(--text);font-family:'Lora',serif;min-height:100vh;overflow-x:hidden}
#title-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;padding:20px}
.stars{position:absolute;inset:0;pointer-events:none}
.star{position:absolute;border-radius:50%;background:var(--gold);animation:twinkle var(--d,3s) ease-in-out infinite alternate;opacity:.2}
@keyframes twinkle{to{opacity:.7}}
.title-chars{display:flex;gap:40px;margin-bottom:28px;align-items:flex-end}
.title-text{text-align:center;position:relative;z-index:1}
.title-tag{font-size:11px;letter-spacing:6px;color:var(--gold);text-transform:uppercase;margin-bottom:10px}
h1{font-family:'Playfair Display',serif;font-size:clamp(34px,6vw,58px);font-weight:400;background:linear-gradient(135deg,#f0e8d8,#c8a96e);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
.title-sub{color:var(--muted);font-size:14px;margin-bottom:36px}
.title-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn-primary{padding:14px 36px;border-radius:50px;background:linear-gradient(135deg,#c8a96e,#8b6914);color:#1a1a2e;border:none;cursor:pointer;font-size:17px;font-weight:bold;font-family:'Lora',serif;box-shadow:0 4px 20px rgba(200,169,110,.3);transition:transform .15s}
.btn-primary:hover{transform:scale(1.05)}
.btn-sec{padding:12px 24px;border-radius:50px;background:transparent;color:var(--gold);border:2px solid var(--gold);cursor:pointer;font-size:14px;font-family:'Lora',serif;transition:all .2s}
.btn-sec:hover{background:rgba(200,169,110,.1)}
#chapter-screen{min-height:100vh;padding:20px;max-width:800px;margin:0 auto;display:none}
.ch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-top:18px}
.ch-card{background:rgba(26,26,46,.9);border:2px solid #3a3a5a;border-radius:12px;padding:14px;cursor:pointer;transition:all .2s;display:flex;flex-direction:column;gap:5px}
.ch-card:hover{border-color:var(--gold);transform:translateY(-2px)}
.ch-card.locked{opacity:.4;cursor:not-allowed;pointer-events:none}
.ch-card.completed{border-color:#4a9a4a}
.ch-num{font-size:11px;color:var(--muted);letter-spacing:2px;text-transform:uppercase}
.ch-name{color:var(--text);font-size:14px}
.ch-level{font-size:11px;padding:3px 8px;border-radius:20px;background:rgba(200,169,110,.12);color:var(--gold);display:inline-block;width:fit-content}
.ch-prog{height:3px;background:#1a1a2e;border-radius:2px;margin-top:4px}
.ch-prog-fill{height:100%;background:var(--gold);border-radius:2px;transition:width .3s}
#vocab-screen{min-height:100vh;padding:20px;max-width:680px;margin:0 auto;display:none}
.vocab-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.vocab-card{background:rgba(26,26,46,.9);border:2px solid #3a3a5a;border-radius:10px;padding:14px;cursor:pointer;min-height:66px;display:flex;align-items:center;justify-content:center;text-align:center;transition:all .2s}
.vocab-card.flipped{background:rgba(200,169,110,.1);border-color:var(--gold)}
.vocab-card-de{color:var(--gold);font-size:15px;font-weight:bold}
.vocab-card-en{color:#d0d0f0;font-size:13px}
#game-screen{min-height:100vh;display:none;flex-direction:column}
.scene{position:relative;height:340px;overflow:hidden;flex-shrink:0}
.scene-bg{position:absolute;inset:0}
.char-stage{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-end;padding:0 6%}
.char-slot{transition:all .35s;transform-origin:bottom center}
.char-slot.active{transform:scale(1.07)}
.char-slot.inactive{filter:brightness(.6) saturate(.7);transform:scale(.9)}
.char-slot.hidden{opacity:0;pointer-events:none}
.loc-tag{position:absolute;top:12px;left:12px;background:rgba(0,0,0,.65);border:1px solid rgba(200,169,110,.4);border-radius:6px;padding:5px 11px;color:var(--gold);font-size:11px;letter-spacing:2px;text-transform:uppercase}
.ch-info-tag{position:absolute;top:12px;right:12px;background:rgba(0,0,0,.65);border:1px solid rgba(200,169,110,.4);border-radius:6px;padding:5px 11px;color:var(--gold);font-size:11px}
.dialogue-box{flex:1;background:linear-gradient(180deg,#0d0d1a,#111128);padding:18px 22px 12px;display:flex;flex-direction:column;border-top:2px solid rgba(200,169,110,.25)}
.seg-type{font-size:11px;letter-spacing:2px;text-transform:uppercase;margin-bottom:7px}
.seg-type.narr{color:var(--muted)}.seg-type.dial{color:var(--blue)}.seg-type.prac{color:var(--purple)}
.speaker{font-size:12px;letter-spacing:3px;text-transform:uppercase;margin-bottom:7px;font-weight:600}
.speaker.yves{color:var(--gold)}.speaker.matei{color:var(--blue)}.speaker.other{color:#d0d0f0}
.seg-text{color:var(--text);font-size:clamp(14px,2.4vw,17px);line-height:1.85;flex:1;transition:opacity .35s,transform .35s}
.seg-text.hide{opacity:0;transform:translateY(8px)}
.seg-text.italic{font-style:italic}
.controls{display:flex;gap:7px;align-items:center;margin-top:11px;flex-wrap:wrap}
.btn-sm{padding:7px 13px;border-radius:7px;background:transparent;color:#555;border:1px solid #222;cursor:pointer;font-size:12px;font-family:'Lora',serif}
.btn-sm:hover{color:#888;border-color:#444}
.btn-continue{padding:11px 26px;border-radius:10px;background:linear-gradient(135deg,#c8a96e,#8b6914);color:#1a1a2e;border:none;cursor:pointer;font-size:14px;font-weight:bold;font-family:'Lora',serif;box-shadow:0 4px 14px rgba(200,169,110,.22);margin-left:auto}
.btn-practice{padding:11px 22px;border-radius:10px;background:linear-gradient(135deg,#7a7aff,#4a4aaa);color:#fff;border:none;cursor:pointer;font-size:14px;font-weight:bold;font-family:'Lora',serif;margin-left:auto;animation:pulse-btn 1.6s ease-in-out infinite}
@keyframes pulse-btn{0%,100%{box-shadow:0 4px 14px rgba(122,122,255,.3)}50%{box-shadow:0 4px 26px rgba(122,122,255,.6)}}
.prog-bar{height:3px;background:#1a1a2e;border-radius:2px;margin-top:9px}
.prog-fill{height:100%;background:var(--gold);border-radius:2px;transition:width .4s}
#practice-modal{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;align-items:center;justify-content:center;z-index:200;padding:16px}
.pbox{background:linear-gradient(135deg,#1a1a2e,#16213e);border:2px solid var(--gold);border-radius:16px;padding:26px;max-width:540px;width:100%;box-shadow:0 24px 60px rgba(0,0,0,.55);max-height:90vh;overflow-y:auto}
.pheader{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.pbadge{background:var(--gold);color:#1a1a2e;border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:15px;flex-shrink:0}
.ptag{color:var(--gold);font-size:11px;letter-spacing:2px;text-transform:uppercase}
.pprompt{color:var(--text);font-size:16px;line-height:1.6;margin-bottom:18px}
.ans-box{padding:14px;border-radius:8px;background:rgba(200,169,110,.07);border:2px solid rgba(200,169,110,.22);margin-bottom:12px}
.ans-label{color:var(--muted);font-size:11px;letter-spacing:2px;text-transform:uppercase;margin-bottom:5px}
.ans-de{color:var(--gold);font-size:21px;font-weight:bold}
.ans-slow{color:var(--muted);font-size:12px;margin-top:4px}
.gram-box{padding:14px;border-radius:8px;background:rgba(100,100,200,.07);border:2px solid rgba(100,100,200,.22);margin-bottom:12px}
.gram-label{color:var(--muted);font-size:11px;letter-spacing:2px;text-transform:uppercase;margin-bottom:7px}
.gram-text{color:#d0d0f0;font-size:13px;line-height:1.75}
.pinput{width:100%;padding:11px 15px;border-radius:8px;border:2px solid #4a4a6a;background:#0d0d1a;color:var(--text);font-size:15px;margin-bottom:10px;outline:none;font-family:'Lora',serif;transition:border-color .2s}
.pinput:focus{border-color:var(--gold)}
.res-box{padding:9px 14px;border-radius:8px;margin-bottom:10px;font-size:13px}
.res-box.ok{background:rgba(50,180,50,.1);border:2px solid #4a9a4a;color:#7afa7a}
.res-box.no{background:rgba(180,50,50,.1);border:2px solid #9a4a4a;color:#fa7a7a}
.speech-btn{display:flex;align-items:center;gap:8px;padding:11px 18px;border-radius:10px;background:rgba(122,122,255,.1);border:2px solid rgba(122,122,255,.35);color:#a0a0ff;cursor:pointer;font-family:'Lora',serif;font-size:13px;transition:all .2s;width:100%;margin-bottom:8px}
.speech-btn:hover{background:rgba(122,122,255,.18)}
.speech-btn.on{background:rgba(255,80,80,.13);border-color:rgba(255,80,80,.5);color:#ff8080;animation:pred 1s ease-in-out infinite}
@keyframes pred{0%,100%{box-shadow:0 0 0 0 rgba(255,80,80,.3)}50%{box-shadow:0 0 0 8px rgba(255,80,80,0)}}
.sdot{width:9px;height:9px;border-radius:50%;background:currentColor;flex-shrink:0}
.sresult{color:var(--muted);font-size:12px;min-height:18px;margin-bottom:8px}
.btn-row{display:flex;gap:8px;margin-bottom:10px}
.bcheck{flex:1;padding:11px;border-radius:8px;background:var(--gold);color:#1a1a2e;font-weight:bold;border:none;cursor:pointer;font-family:'Lora',serif;font-size:13px}
.bcheck:disabled{background:#444;color:#777;cursor:default}
.breveal{flex:1;padding:11px;border-radius:8px;background:transparent;color:var(--muted);border:2px solid #3a3a5a;cursor:pointer;font-family:'Lora',serif;font-size:13px}
.bnext{width:100%;padding:12px;border-radius:8px;background:var(--gold);color:#1a1a2e;border:none;cursor:pointer;font-weight:bold;font-size:14px;font-family:'Lora',serif}
.bgram{width:100%;padding:12px;border-radius:8px;background:transparent;color:var(--gold);border:2px solid var(--gold);cursor:pointer;font-size:13px;font-family:'Lora',serif;margin-bottom:8px}
@keyframes bob1{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes bob2{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.aby{animation:bob1 2s ease-in-out infinite}
.abm{animation:bob2 2.4s ease-in-out infinite}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:#0d0d1a}::-webkit-scrollbar-thumb{background:#3a3a5a;border-radius:3px}
</style>
</head>
<body>

<div id="title-screen">
  <div class="stars" id="stars-bg"></div>
  <div class="title-chars">
    <div id="t-yves"></div>
    <div id="t-matei"></div>
  </div>
  <div class="title-text">
    <div class="title-tag">An Interactive German Story</div>
    <h1>Yves in Germany</h1>
    <div class="title-sub">21 Chapters &nbsp;·&nbsp; 735 Practice Pauses &nbsp;·&nbsp; A1 → B2 &nbsp;·&nbsp; Speech Recognition</div>
    <div class="title-btns">
      <button class="btn-primary" onclick="startGame()">Begin the Story</button>
      <button class="btn-sec" onclick="showChapters()">Chapters</button>
      <button class="btn-sec" onclick="showVocab()">Vocabulary</button>
    </div>
  </div>
</div>

<div id="chapter-screen">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:8px">
    <h2 style="font-family:'Playfair Display',serif;color:var(--gold);font-weight:400">All 21 Chapters</h2>
    <button class="btn-sec" onclick="showTitle()" style="padding:8px 16px;font-size:12px">← Back</button>
  </div>
  <div class="ch-grid" id="ch-grid"></div>
</div>

<div id="vocab-screen">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
    <h2 style="font-family:'Playfair Display',serif;color:var(--gold);font-weight:400">Vocabulary</h2>
    <button class="btn-sec" onclick="showTitle()" style="padding:8px 16px;font-size:12px">← Back</button>
  </div>
  <p style="color:var(--muted);margin-bottom:14px;font-size:13px">Tap a card to flip. Extracted from all 21 chapters.</p>
  <div class="vocab-grid" id="vocab-grid"></div>
</div>

<div id="game-screen">
  <div class="scene" id="scene">
    <div class="scene-bg" id="scene-bg"></div>
    <div class="char-stage">
      <div class="char-slot hidden" id="cy"></div>
      <div class="char-slot hidden" id="cm"></div>
    </div>
    <div class="loc-tag" id="loc-tag">Berlin</div>
    <div class="ch-info-tag" id="ch-info"></div>
  </div>
  <div class="dialogue-box">
    <div class="seg-type" id="stype"></div>
    <div class="speaker" id="spk" style="display:none"></div>
    <div class="seg-text" id="stxt"></div>
    <div class="controls">
      <button class="btn-sm" onclick="showTitle()">☰ Menu</button>
      <button class="btn-sm" onclick="showChapters()">Chapters</button>
      <button class="btn-sm" onclick="showVocab()">📖 Vocab</button>
      <div id="actbtn" style="margin-left:auto"></div>
    </div>
    <div class="prog-bar"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
  </div>
</div>

<div id="practice-modal">
  <div class="pbox">
    <div class="pheader"><div class="pbadge">DE</div><span class="ptag">Practice Pause</span></div>
    <div class="pprompt" id="pp"></div>
    <div id="ph-input">
      <button class="speech-btn" id="sbtn" onclick="toggleSpeech()">
        <div class="sdot"></div><span id="sbtn-txt">🎙 Speak your answer in German</span>
      </button>
      <div class="sresult" id="sresult"></div>
      <input class="pinput" id="pinput" placeholder="Or type your answer..." onkeydown="if(event.key==='Enter')checkAns()">
      <div class="btn-row">
        <button class="bcheck" id="bcheck" onclick="checkAns()">Check</button>
        <button class="breveal" onclick="doReveal()">Show Answer</button>
      </div>
    </div>
    <div id="ph-revealed" style="display:none">
      <div id="pres" class="res-box" style="display:none"></div>
      <div class="ans-box">
        <div class="ans-label">Answer</div>
        <div class="ans-de" id="pans"></div>
        <div class="ans-slow" id="pslow"></div>
      </div>
      <button class="bgram" onclick="showGram()">Grammar Note →</button>
    </div>
    <div id="ph-gram" style="display:none">
      <div class="gram-box"><div class="gram-label">Grammar Note</div><div class="gram-text" id="pgram"></div></div>
      <button class="bnext" onclick="closePractice()">Continue Story →</button>
    </div>
  </div>
</div>

<script>
const CHAPTERS=[{"id": 1, "title": "The Key", "level": "A1", "segments": [{"type": "narration", "text": "terminal ambience – footsteps, distant announcements.) Welcome to Chapter 1 of Love in Germany. This audiobook teaches you German through a story. You will hear the story in English. German words and sentences are spoken twice – first slowly, then at normal speed. When you hear “Now say…”, repeat the German out loud or in your head. A four-second pause follows, then the correct answer. Do not worry about mistakes. Mistakes are how you learn. Let us begin. --The plane landed twelve minutes early. That should have been my first warning. Nothing in my life had ever been early. Not my birth – two weeks late, according to my grandmother – not my flights, not my feelings. But Berlin wanted me to arrive before I was ready. I grabbed my suitcase. One battered bag. I had learned to travel exactly how I had learned to love: light enough to leave fast. I stepped onto the terminal floor, my boots echoing against the polished concrete, feeling utterly untethered."}, {"type": "practice", "prompt": "Now say “I am Yves” in German.", "answer": "Ich bin Yves.", "slow": "Ich bin Yves.", "grammar": "The verb bin comes from sein – to be. In a main clause, the verb is always in the second position. Ich (position one), bin (position two), Yves (position three). This is the backbone of every German sentence."}, {"type": "practice", "prompt": "Now say “I have a suitcase.”", "answer": "Ich habe einen Koffer.", "slow": "Ich habe einen Koffer.", "grammar": "Normal speed: Ich habe einen Koffer. Notice einen instead of ein. Koffer is masculine. When a masculine noun is the object of the sentence, ein changes to einen. You will see this shift often."}, {"type": "practice", "prompt": "Now say “I am tired.”", "answer": "Ich bin müde.", "slow": "Ich bin müde.", "grammar": "Müde means tired. Listen to the umlaut ü. Repeat: müde."}, {"type": "narration", "text": "--The terminal was cavernous and quiet for a Tuesday afternoon. A few families hugged tightly at the arrivals gate. A woman wept softly into her phone near the glass barrier. Across the hall, a man in a too-thin coat leaned against a concrete pillar, scrolling through his phone with a stillness that made him look like he had all the time in the world. He was the one who called my name."}, {"type": "dialogue", "text": "“Yves!”"}, {"type": "narration", "text": "I turned. The man from the pillar was moving toward me. He was not exceptionally tall. He was not smiling. His coat was a faded charcoal grey, his hair dark and slightly windblown, and his eyes were the exact colour of the February sky outside – grey, but holding a hidden warmth that somehow made me defensive. Why was he looking at me with that kind of warmth? I did not even know him."}, {"type": "dialogue", "text": "“You are Matei,” I said, my voice catching slightly."}, {"type": "practice", "prompt": "Now say “Hello, Matei” in German.", "answer": "Hallo, Matei.", "slow": "Hallo, Matei.", "grammar": "Hallo works in any situation – casual or professional. Later we will learn Guten Tag for formal greetings."}, {"type": "dialogue", "text": "--“You are late,” he said, his voice lower than it had sounded through headphones."}, {"type": "narration", "text": "I glanced up at the digital clock. “The plane arrived early. That is mathematically the opposite of late.” He did not laugh, but the tension in his shoulders dropped. “My train was late.”"}, {"type": "dialogue", "text": "“So we are both starting this disappointed.”"}, {"type": "narration", "text": "The corner of his mouth twitched – a tiny crack in his stoic expression, as if he had caught himself wanting to smile. Then, without asking for permission, without even looking at me, he reached down, picked up my heavy suitcase, and walked toward the automatic exit doors. I followed. That is how the ink dried on our first page. Me, tracking the stride of a man who never asked for permission."}, {"type": "practice", "prompt": "Now say “thank you” in German.", "answer": "Danke.", "slow": "Danke.", "grammar": "Repeat aloud: Danke."}, {"type": "practice", "prompt": "Now say “thank you very much” – more polite.", "answer": "Danke schön.", "slow": "Danke schön.", "grammar": "Danke schön literally means “thank you beautifully.” Use it with strangers or when someone does you an unexpected kindness."}, {"type": "narration", "text": "--Outside, Berlin opened up before us – grey, industrial, and exactly as cold and unforgiving as I needed it to be. The wind cut through the seams of my jacket like a blade with something to prove."}, {"type": "dialogue", "text": "“Do you like it?” Matei asked, his breath misting in the freezing air."}, {"type": "dialogue", "text": "“I do not know yet,” I said, pulling my collar up."}, {"type": "dialogue", "text": "“You will.”"}, {"type": "narration", "text": "He stated it as an absolute fact, not a hopeful prediction. I wanted to be annoyed. I was annoyed. But also – and I deeply resented myself for it – I desperately wanted to believe him."}, {"type": "practice", "prompt": "Now say “good morning” in German. It is still morning in our journey.", "answer": "Guten Morgen.", "slow": "Guten Morgen.", "grammar": "If it were evening, we would say Guten Abend. We will practice both."}, {"type": "narration", "text": "--We boarded the waiting city bus. Before I could pull out my wallet, he scanned his own transit card for my fare. I opened my mouth to protest, but he simply locked his grey eyes onto mine."}, {"type": "dialogue", "text": "“You do not have euros yet,” he said flatly. He was entirely right. I closed my"}, {"type": "narration", "text": "mouth. We moved to the very back row. The bus was nearly empty, smelling of wet floor mats and cold diesel. Matei sat beside me, radiating a scent of strong espresso and cold smoke – not the stale smell of cheap cigarettes, but something richer, like seasoned birch logs in a fireplace that had just been snuffed out."}, {"type": "dialogue", "text": "“Why are you here, Yves?” Matei asked. He wasn't looking at me. He was staring out"}, {"type": "narration", "text": "the scratched window at the grey buildings sliding past in the mist. I could have lied. I had built a mental catalogue of polite fictions. For work. To see the city. A fresh start. All true enough to pass. But the cold air had drained me, and when he turned his head, his eyes were too steady to lie to."}, {"type": "dialogue", "text": "“I wanted to leave,” I whispered."}, {"type": "dialogue", "text": "“Leave from where?”"}, {"type": "dialogue", "text": "“Home.”"}, {"type": "narration", "text": "He didn't offer a hollow I'm sorry or a rehearsed that must be hard. He didn't use the empty phrases people deploy to buffer themselves from someone else's pain. Instead, he simply rested his palm flat over the back of my hand. His skin was incredibly warm. We stayed exactly like that for the remainder of the ride. Neither of us spoke another word. Neither of us pulled away."}, {"type": "practice", "prompt": "Now say “the key” in German.", "answer": "Der Schlüssel.", "slow": "Der Schlüssel.", "grammar": "Der is the masculine article. Every German noun has a gender: der (masculine), die (feminine), das (neuter). Learn the article with the noun. Der Schlüssel – the key."}, {"type": "practice", "prompt": "Now say “the apartment.”", "answer": "Die Wohnung.", "slow": "Die Wohnung.", "grammar": "Notice the ending -ung. Nouns ending in -ung are almost always feminine, so they take die. Die Wohnung – the apartment."}, {"type": "narration", "text": "--When the bus hissed to a stop, he lifted his hand from mine without apology. He pointed across the asphalt toward a building – five storeys, faded mustard-yellow stucco, a heavy door painted so many times the wood looked thick. A small bakery occupied the ground floor, its lights dark for the night."}, {"type": "dialogue", "text": "“That is my apartment,” Matei said. “You sleep on the sofa.”"}, {"type": "narration", "text": "I stared at the weathered facade, then at him. “Only for one night,” I said."}, {"type": "dialogue", "text": "“Only for one night,” he agreed."}, {"type": "narration", "text": "We both knew it was a lie. Something in the freezing air between us had already decided that twenty-four hours would never be enough."}, {"type": "practice", "prompt": "Now say “please” in German.", "answer": "Bitte.", "slow": "Bitte.", "grammar": "Bitte also means “you are welcome” and “here you go.” One word, three jobs."}, {"type": "practice", "prompt": "Now say “excuse me / sorry” – for crowded sidewalks.", "answer": "Entschuldigung.", "slow": "Entschuldigung.", "grammar": "Keep this one ready."}, {"type": "narration", "text": "--The interior stairs were narrow, uncarpeted wood that creaked beneath our weight. His apartment was on the fourth floor. No elevator. By the time we reached his landing, my lungs were burning. Matei wasn't even breathing hard. He slid his key into the old lock and stepped aside, holding the door open for me. The apartment was small. One room designed to function as living room, bedroom, and dining area all at once. A galley kitchen in the corner. Two mismatched chairs – one oak, one plastic. And a dark green sofa that had seen better decades."}, {"type": "dialogue", "text": "“It is not much,” Matei said."}, {"type": "dialogue", "text": "“It is enough,” I said, and meant it."}, {"type": "practice", "prompt": "Now say “good evening” in German. Darkness has fallen.", "answer": "Guten Abend.", "slow": "Guten Abend.", "grammar": "Repeat aloud: Guten Abend."}, {"type": "practice", "prompt": "Now say “goodbye” – casual form.", "answer": "Tschüss.", "slow": "Tschüss.", "grammar": "The formal version is Auf Wiedersehen. We will practice later."}, {"type": "narration", "text": "--I walked the perimeter. A particle-board bookshelf crammed with paperbacks in German, Romanian, English. A calendar with a black-and-white photograph of the Alps. A vintage stereo next to a stack of CDs. I spotted the spine of a Frank Ocean album and felt a sudden knot loosen in my chest."}, {"type": "dialogue", "text": "“You listen to Frank Ocean?” I asked."}, {"type": "narration", "text": "Matei stared at the CD as if he had forgotten its existence. “He is okay.”"}, {"type": "dialogue", "text": "“You bought the physical album. That is more than just okay.”"}, {"type": "dialogue", "text": "“My ex left it behind.” His voice was flat, devoid of emotion. But his jaw"}, {"type": "narration", "text": "tightened for a fraction of a second. I decided not to press. Not tonight. He retreated into the kitchen. I listened to the rush of tap water, the clatter of cabinet doors, the clink of ceramic mugs. When he walked back, he wasn't holding tea. He was holding a key. Small. Silver. Unremarkable."}, {"type": "dialogue", "text": "“Here,” he said."}, {"type": "narration", "text": "I took it from his palm. The metal was intensely warm – retaining the heat of his pocket, his skin, and whatever strange gravity he carried."}, {"type": "dialogue", "text": "“For the door?” I asked."}, {"type": "narration", "text": "He looked at me. Really looked. His grey eyes held mine. The lamp flickered. The street outside was silent."}, {"type": "dialogue", "text": "“For you,” he said."}, {"type": "practice", "prompt": "Now say “for you” in German – informal, because they are already close.", "answer": "Für dich.", "slow": "Für dich.", "grammar": "If this were formal – a stranger, a boss – we would say für Sie. But here, it is für dich."}, {"type": "practice", "prompt": "Now say “for me.”", "answer": "Für mich. Good.", "slow": "Für mich. Good.", "grammar": "Good."}, {"type": "narration", "text": "--He emerged with two mugs of black tea – no sugar, no milk. Handed me one without asking. I took a sip. Perfect. I hated that it was perfect."}, {"type": "dialogue", "text": "“How did you know how I take my tea?” I asked."}, {"type": "dialogue", "text": "“You told me,” he said. “Two years ago. In a message.”"}, {"type": "narration", "text": "Two years ago. Late-night messages, time zones, confessions that felt safe because they weren't real. A throwaway line. And he had filed it away."}, {"type": "dialogue", "text": "“I remember things,” he said."}, {"type": "practice", "prompt": "Now say “I remember” in German.", "answer": "Ich erinnere mich.", "slow": "Ich erinnere mich.", "grammar": "This is a reflexive verb – you say “I remember myself.” English used to do this (“I remember me”). German still does."}, {"type": "practice", "prompt": "Now say “you remember” – to one person, informal.", "answer": "Du erinnerst dich.", "slow": "Du erinnerst dich.", "grammar": "Repeat aloud: Du erinnerst dich."}, {"type": "narration", "text": "--He sat on the oak chair. I stayed on the sofa. Steam rose between us. I let out a short, involuntary laugh."}, {"type": "dialogue", "text": "“You laugh,” he said softly. “That is good.”"}, {"type": "dialogue", "text": "“Why is that good?”"}, {"type": "dialogue", "text": "“You looked entirely sad at the airport.”"}, {"type": "narration", "text": "I had no answer. Because he was right. I had carried that specific, heavy sadness for years. Yet this man had seen through the armor within ten minutes."}, {"type": "dialogue", "text": "“I am not sad,” I lied."}, {"type": "dialogue", "text": "“Okay,” he said. He didn't push. He just drank his tea."}, {"type": "practice", "prompt": "Now say “yes” and “no” in German.", "answer": "Ja. Nein.", "slow": "Ja. Nein.", "grammar": "Nein."}, {"type": "narration", "text": "--We sat in the quiet. The lamp buzzed. The radiator clicked. Somewhere downstairs, a neighbor played music – slow, bass-heavy, sounding like Frank Ocean."}, {"type": "dialogue", "text": "“You can take the bed,” Matei said."}, {"type": "dialogue", "text": "“You said I sleep on the sofa.”"}, {"type": "dialogue", "text": "“I changed my mind.”"}, {"type": "dialogue", "text": "“Why?”"}, {"type": "narration", "text": "He stood up. “You are exhausted. The sofa is old. Take the bed.” I should have argued. But my limbs were leaden, and his voice left no room for negotiation."}, {"type": "dialogue", "text": "“Okay,” I said. “Thank you.”"}, {"type": "narration", "text": "He nodded. He pulled a clean sheet and a wool blanket from the closet. He made the bed – not neatly, but carefully, like a ritual he had done a thousand times before. When he finished, he stepped back."}, {"type": "practice", "prompt": "Now say “good night” in German.", "answer": "Gute Nacht.", "slow": "Gute Nacht.", "grammar": "“Good night, Yves.” “Good night, Matei.” He walked to the sofa. I lay down in the bed. The sheets smelled of laundry detergent and something else – something woody, warm, distinct. I closed my fingers around the key. The metal had cooled. But I could still feel the phantom warmth of his palm inside it."}, {"type": "narration", "text": "That is how I inherited a key to a city I had never walked, a man I did not understand, and a story I had never agreed to join. Typical."}, {"type": "practice", "prompt": "Now say “the story” in German.", "answer": "Die Geschichte.", "slow": "Die Geschichte.", "grammar": "Geschichte ends in -e, often feminine. Die Geschichte – the story."}], "bg": "airport", "location": "Berlin Tegel Airport"}, {"id": 2, "title": "The First Morning", "level": "A1", "segments": [{"type": "narration", "text": "single car passing, soft radiator hiss.) I did not sleep. Not because the bed was uncomfortable – it was actually better than any bed I had slept in for the last six months. Not because of jet lag – my body had given up on time zones somewhere over the Atlantic. I did not sleep because I could hear Matei breathing on the sofa. It was a quiet sound. Steady. The kind of breathing that said I have no problem falling asleep anywhere, anytime, because I am a normal person who does not overthink everything. I hated him for it. I also wanted to lie on the floor next to the sofa and listen to it all night."}, {"type": "practice", "prompt": "Now say “I am tired” in German.", "answer": "Ich bin müde.", "slow": "Ich bin müde.", "grammar": "Repeat aloud: Ich bin müde."}, {"type": "practice", "prompt": "Now say “I am hungry” – because my stomach started growling.", "answer": "Ich bin hungrig.", "slow": "Ich bin hungrig.", "grammar": "Hungrig means hungry. The -ig ending sounds like “ish”. Repeat: hungrig."}, {"type": "narration", "text": "--Around 3 AM, I gave up. I stared at the ceiling. The building made noises – pipes groaning, floorboards settling, someone upstairs walking to their bathroom in the dark. Berlin sounds. Not the sounds of Lagos, where the night was never truly quiet. Here, the silence was so loud it felt like pressure. I must have fallen asleep eventually, because the next thing I knew, light was hitting my face through the window, and I could smell coffee. Matei was in the kitchen. His back was to me. He wore the same grey shirt from yesterday – or maybe a different grey shirt, I could not tell – and he was pouring water into a French press with the concentration of a surgeon. I watched him for a minute. He moved slowly, deliberately, like he had done this a thousand mornings and would do it a thousand more."}, {"type": "dialogue", "text": "“You are staring,” he said without turning around."}, {"type": "dialogue", "text": "“I am observing,” I said. “There is a difference.”"}, {"type": "dialogue", "text": "“What is the difference?”"}, {"type": "dialogue", "text": "“Staring is creepy. Observing is scientific.”"}, {"type": "narration", "text": "He almost smiled again. Almost."}, {"type": "practice", "prompt": "Now say “good morning” in German.", "answer": "Guten Morgen.", "slow": "Guten Morgen.", "grammar": "Repeat aloud: Guten Morgen."}, {"type": "narration", "text": "--He poured the coffee into two plain white mugs. Handed me one. Black. No sugar. No milk. Perfect."}, {"type": "dialogue", "text": "“You remembered,” I said."}, {"type": "dialogue", "text": "“I told you. I remember things.”"}, {"type": "practice", "prompt": "Now say “the coffee” – pay attention to the article.", "answer": "Der Kaffee. Masculine – der Kaffee.", "slow": "Der Kaffee. Masculine – der Kaffee.", "grammar": "Masculine – der Kaffee."}, {"type": "practice", "prompt": "Now say “the milk”.", "answer": "Die Milch. Feminine – die Milch.", "slow": "Die Milch. Feminine – die Milch.", "grammar": "Feminine – die Milch."}, {"type": "practice", "prompt": "Now say “the water”.", "answer": "Das Wasser. Neuter – das Wasser.", "slow": "Das Wasser. Neuter – das Wasser.", "grammar": "Neuter – das Wasser. One example of each gender. You will see them everywhere."}, {"type": "dialogue", "text": "--“So,” I said. “What is the plan?”"}, {"type": "dialogue", "text": "“Plan?”"}, {"type": "dialogue", "text": "“For today. For the week. For me not sleeping on your sofa forever.”"}, {"type": "narration", "text": "He sat on the wooden chair across from me. The plastic one was still empty."}, {"type": "dialogue", "text": "“You need a job,” he said."}, {"type": "dialogue", "text": "“I need a lot of things.”"}, {"type": "dialogue", "text": "“A job first. Money. Then you can find your own place.”"}, {"type": "practice", "prompt": "Now say “the job” – die Arbeit.", "answer": "Die Arbeit. Feminine.", "slow": "Die Arbeit. Feminine.", "grammar": "Feminine."}, {"type": "practice", "prompt": "Now say “the money” – das Geld.", "answer": "Das Geld. Neuter.", "slow": "Das Geld. Neuter.", "grammar": "Neuter."}, {"type": "dialogue", "text": "--“I did not come here to be a burden,” I said."}, {"type": "dialogue", "text": "“You are not.”"}, {"type": "dialogue", "text": "“I am sleeping on your sofa.”"}, {"type": "dialogue", "text": "“You are sleeping on my sofa because I offered. That is not a burden. That is a"}, {"type": "practice", "prompt": "Now say “the sofa” – das Sofa.", "answer": "Das Sofa. Neuter.", "slow": "Das Sofa. Neuter.", "grammar": "Neuter. “What kind of job?” I asked. He shrugged. “There is a café around the corner. The owner is old. She needs help in the mornings.” “I do not speak German.” “You do not need to. You just need to carry plates and say bitte and danke. You can learn the rest.” I stared at him. “You already asked her.” He did not confirm or deny. He just drank his coffee. “You already asked her, did you not?” He set his mug down. “She needs someone starting tomorrow. I told her I knew a person.” “You told her before I even arrived.” “I was optimistic.”"}, {"type": "practice", "prompt": "Now say “the café” – das Café.", "answer": "Das Café. Neuter. Many borrowed words are neuter.", "slow": "Das Café. Neuter. Many borrowed words are neuter.", "grammar": "Neuter. Many borrowed words are neuter."}, {"type": "practice", "prompt": "Now say “the owner” – female owner is die Besitzerin.", "answer": "Die Besitzerin. The -in ending marks a female person.", "slow": "Die Besitzerin. The -in ending marks a female person.", "grammar": "The -in ending marks a female person."}, {"type": "narration", "text": "--I laughed. “You are insane.”"}, {"type": "dialogue", "text": "“Probably.”"}, {"type": "dialogue", "text": "“What if I had said no?”"}, {"type": "dialogue", "text": "“You did not.”"}, {"type": "dialogue", "text": "“What if I am terrible at carrying plates?”"}, {"type": "dialogue", "text": "“Then you learn to be less terrible.”"}, {"type": "practice", "prompt": "Now say “to learn” – lernen.", "answer": "Lernen.", "slow": "Lernen.", "grammar": "Repeat aloud: Lernen."}, {"type": "practice", "prompt": "Now say “I learn German” – ich lerne Deutsch.", "answer": "Ich lerne Deutsch.", "slow": "Ich lerne Deutsch.", "grammar": "Regular verb conjugation: remove -en, add -e for ich. Ich lerne. Du lernst. Er lernt."}, {"type": "narration", "text": "--He stood up, rinsed his mug, and came back with a piece of paper – a handwritten note with an address and a time."}, {"type": "dialogue", "text": "“Tomorrow,” he said, handing it to me. “Nine AM. Do not be late.”"}, {"type": "narration", "text": "I took the paper. His handwriting was small and neat."}, {"type": "dialogue", "text": "“You really do not know me,” I said quietly."}, {"type": "narration", "text": "He looked at me for a long moment. Then he said something I would replay in my head for weeks."}, {"type": "dialogue", "text": "“I know you drink your coffee black. I know you laugh when you are uncomfortable."}, {"type": "narration", "text": "I know you left home because staying hurt more than leaving. And I know you are still here.” He paused."}, {"type": "dialogue", "text": "“That is enough to start.”"}, {"type": "practice", "prompt": "Now say “to stay” – bleiben.", "answer": "Bleiben.", "slow": "Bleiben.", "grammar": "Repeat aloud: Bleiben."}, {"type": "practice", "prompt": "Now say “I stay” – ich bleibe.", "answer": "Ich bleibe.", "slow": "Ich bleibe.", "grammar": "Repeat aloud: Ich bleibe."}, {"type": "practice", "prompt": "Now say “you stay” – du bleibst.", "answer": "Du bleibst.", "slow": "Du bleibst.", "grammar": "Repeat aloud: Du bleibst."}, {"type": "narration", "text": "--I just held the paper and watched him put on his coat."}, {"type": "dialogue", "text": "“The café is called Morgenlicht,” he said. “Morning Light. Tell the owner Matei"}, {"type": "dialogue", "text": "“What if she asks who I am?”"}, {"type": "narration", "text": "He opened the door. Cold air rushed in."}, {"type": "dialogue", "text": "“Tell her you are the friend I mentioned.”"}, {"type": "practice", "prompt": "Now say “the morning light” – das Morgenlicht.", "answer": "Das Morgenlicht. Morgen (morning) + Licht (light), neuter.", "slow": "Das Morgenlicht. Morgen (morning) + Licht (light), neuter.", "grammar": "Morgen (morning) + Licht (light), neuter."}, {"type": "practice", "prompt": "Now say “the friend” – der Freund.", "answer": "Der Freund. Masculine. A female friend is die Freundin.", "slow": "Der Freund. Masculine. A female friend is die Freundin.", "grammar": "Masculine. A female friend is die Freundin."}, {"type": "narration", "text": "--I sat in the grey morning light, holding a job offer from a man who called me a friend after knowing me for twelve hours. I drank my coffee. It was cold now. I drank it anyway. The apartment felt different without him. Bigger. Emptier."}, {"type": "practice", "prompt": "Now say “the door” – die Tür.", "answer": "Die Tür. Feminine.", "slow": "Die Tür. Feminine.", "grammar": "Feminine. I looked at the key on the table. For you. I picked it up, walked to the door, locked it, unlocked it, locked it again. The mechanism was old – it stuck a little, required a gentle tug. I memorised the feel of it."}, {"type": "practice", "prompt": "Now say “the key” – der Schlüssel. Review.", "answer": "Der Schlüssel.", "slow": "Der Schlüssel.", "grammar": "Repeat aloud: Der Schlüssel."}, {"type": "narration", "text": "--At noon, I finally got up. I took a shower. The water pressure was terrible – a weak stream that took forever to rinse the shampoo out – but the water was hot, and the bathroom smelled like Matei's soap. Something clean and neutral. Not floral. Just clean."}, {"type": "practice", "prompt": "Now say “the bathroom” – das Badezimmer.", "answer": "Das Badezimmer. Bad (bath) + Zimmer (room).", "slow": "Das Badezimmer. Bad (bath) + Zimmer (room).", "grammar": "Bad (bath) + Zimmer (room)."}, {"type": "practice", "prompt": "Now say “the soap” – die Seife.", "answer": "Die Seife. Feminine.", "slow": "Die Seife. Feminine.", "grammar": "Feminine."}, {"type": "narration", "text": "--I left the apartment. The stairs were narrower in the daylight. I counted them – thirty-seven from the fourth floor to the ground."}, {"type": "practice", "prompt": "Now say “the street” – die Straße.", "answer": "Die Straße. Feminine. Note the ß, a sharp s sound.", "slow": "Die Straße. Feminine. Note the ß, a sharp s sound.", "grammar": "Feminine. Note the ß, a sharp s sound."}, {"type": "practice", "prompt": "Now say “the bakery” – die Bäckerei.", "answer": "Die Bäckerei. The -ei ending is often feminine.", "slow": "Die Bäckerei. The -ei ending is often feminine.", "grammar": "The -ei ending is often feminine. I found the café. Morgenlicht. Three blocks away. A green awning. Chalkboard signs. Through the window, I could see a woman behind the counter. Grey hair. Kind eyes. I stood across the street for a full minute, pretending I was not terrified. Then I crossed."}, {"type": "practice", "prompt": "Now say “the cake” – der Kuchen.", "answer": "Der Kuchen. Masculine.", "slow": "Der Kuchen. Masculine.", "grammar": "Masculine."}, {"type": "narration", "text": "--The door made a chiming sound. A little bell."}, {"type": "dialogue", "text": "“Guten Morgen,” the woman said."}, {"type": "narration", "text": "I opened my mouth. Closed it. Opened it again."}, {"type": "dialogue", "text": "“Um. Matei sent me.”"}, {"type": "narration", "text": "Her face broke into a smile. “Ah! Der Freund.” She wiped her hands on her apron and came around the counter. She was shorter than me – a lot shorter – and she moved like someone who had been standing behind this counter for decades."}, {"type": "dialogue", "text": "“I am sorry,” I said. “I do not speak German. Not really.”"}, {"type": "narration", "text": "She waved a hand. “Kein Problem. You speak English. I speak a little. We manage.”"}, {"type": "dialogue", "text": "“You are the owner?”"}, {"type": "dialogue", "text": "“I am Frau Schmidt. And you are Yves.” She said it Eevs, with a soft V. “Matei"}, {"type": "dialogue", "text": "“What did he tell you?”"}, {"type": "narration", "text": "She smiled again. “That you need work. That you are serious. That you make good coffee.”"}, {"type": "practice", "prompt": "Now say “no problem” – kein Problem.", "answer": "Kein Problem.", "slow": "Kein Problem.", "grammar": "Repeat aloud: Kein Problem."}, {"type": "practice", "prompt": "Now say “good” – gut. Sehr gut – very good.", "answer": "Gut. Sehr gut.", "slow": "Gut. Sehr gut.", "grammar": "Sehr gut."}, {"type": "dialogue", "text": "--“I can learn,” I said. “I learn fast.”"}, {"type": "dialogue", "text": "“Gut.” She nodded. “Then you start now.”"}, {"type": "narration", "text": "The next four hours were a blur. Frau Schmidt showed me everything. How to work the espresso machine – a brass monster that hissed like an angry cat. How to arrange pastries so they looked like art. How to say “What would you like?” in German."}, {"type": "dialogue", "text": "“Was möchten Sie?” she said."}, {"type": "narration", "text": "I repeated: “Was möchten Sie?”"}, {"type": "practice", "prompt": "Now say “What would you like?” – formal, to a customer.", "answer": "Was möchten Sie?.", "slow": "Was möchten Sie?.", "grammar": "Was möchten Sie? Möchten is the polite form of wollen (to want). Sie with a capital S is formal “you”."}, {"type": "practice", "prompt": "Now say “I would like a coffee” – ich möchte einen Kaffee.", "answer": "Ich möchte einen Kaffee.", "slow": "Ich möchte einen Kaffee.", "grammar": "Einen because Kaffee is masculine accusative."}, {"type": "narration", "text": "--I dropped a cup. Only one. It shattered on the floor. Frau Schmidt swept it up without comment."}, {"type": "dialogue", "text": "“First time?” she asked."}, {"type": "dialogue", "text": "“First day.”"}, {"type": "dialogue", "text": "“You will drop more. It is okay.”"}, {"type": "practice", "prompt": "Now say “the cup” – die Tasse.", "answer": "Die Tasse. Feminine.", "slow": "Die Tasse. Feminine.", "grammar": "Feminine."}, {"type": "practice", "prompt": "Now say “here you go” – bitte schön.", "answer": "Bitte schön.", "slow": "Bitte schön.", "grammar": "Repeat aloud: Bitte schön."}, {"type": "practice", "prompt": "Now say “thank you very much” – danke schön.", "answer": "Danke schön.", "slow": "Danke schön.", "grammar": "Repeat aloud: Danke schön."}, {"type": "practice", "prompt": "Now say “excuse me / sorry” – entschuldigung.", "answer": "Entschuldigung.", "slow": "Entschuldigung.", "grammar": "Repeat aloud: Entschuldigung."}, {"type": "practice", "prompt": "Now say “goodbye” (casual) – tschüss.", "answer": "Tschüss.", "slow": "Tschüss.", "grammar": "Repeat aloud: Tschüss."}, {"type": "narration", "text": "--By noon, I was exhausted. My feet hurt, my back hurt, my face hurt from smiling. But I had served twelve customers. I had made eight cappuccinos, three lattes, one hot chocolate. Frau Schmidt made me sit down and eat a pastry. Apricot. Warm. Flaky. The best thing I had tasted since I arrived."}, {"type": "practice", "prompt": "Now say “the pastry” – das Gebäck.", "answer": "Das Gebäck. Neuter.", "slow": "Das Gebäck. Neuter.", "grammar": "Neuter."}, {"type": "practice", "prompt": "Now say “the apricot” – die Aprikose.", "answer": "Die Aprikose.", "slow": "Die Aprikose.", "grammar": "“You did good,” Frau Schmidt said, sitting across from me. “I dropped a cup.” “I dropped ten my first day. You will drop more. This is the way.” I ate another bite."}, {"type": "dialogue", "text": "“Frau Schmidt?”"}, {"type": "dialogue", "text": "“Ja?”"}, {"type": "dialogue", "text": "“What did Matei actually say about me?”"}, {"type": "narration", "text": "She tilted her head. “He said you were a friend. That you came from far away. That you needed a chance.”"}, {"type": "dialogue", "text": "“That is all?”"}, {"type": "dialogue", "text": "“That is enough.” She reached across the table and patted my hand. “You are here"}, {"type": "narration", "text": "now. The rest is just work.”"}, {"type": "practice", "prompt": "Now say “the chance” – die Chance.", "answer": "Die Chance. Feminine.", "slow": "Die Chance. Feminine.", "grammar": "Feminine."}, {"type": "practice", "prompt": "Now say “the work” – die Arbeit. Review.", "answer": "Die Arbeit.", "slow": "Die Arbeit.", "grammar": "Repeat aloud: Die Arbeit."}, {"type": "narration", "text": "--I walked back to the apartment at 1 PM. The sun was actually out – pale, watery, but out. I had money in my pocket. Thirty euros in crumpled bills that smelled like coffee. The first money I had earned in a new country."}, {"type": "practice", "prompt": "Now say “the money” – das Geld. Review.", "answer": "Das Geld.", "slow": "Das Geld.", "grammar": "Repeat aloud: Das Geld."}, {"type": "practice", "prompt": "Now say “thirty euros” – dreißig Euro.", "answer": "Dreißig Euro.", "slow": "Dreißig Euro.", "grammar": "Repeat aloud: Dreißig Euro."}, {"type": "narration", "text": "--The stairs were still thirty-seven steps. The key still stuck. The apartment was empty when I opened the door. Matei was not there. Of course he was not. He had a job, a life. But the silence felt louder than it had yesterday. I put the groceries away. Made a sandwich. Sat on the wooden chair and ate it while staring at the wall."}, {"type": "practice", "prompt": "Now say “the sandwich” – das Sandwich.", "answer": "Das Sandwich. Neuter.", "slow": "Das Sandwich. Neuter.", "grammar": "Neuter."}, {"type": "practice", "prompt": "Now say “the wall” – die Wand.", "answer": "Die Wand. Feminine.", "slow": "Die Wand. Feminine.", "grammar": "Feminine. I pulled out my notebook. Day 2. First day at Morgenlicht. I dropped one cup. Frau Schmidt did not fire me. I learned: Bitte schön, Danke schön, Entschuldigung, Tschüss. Matei was not here when I got back. I do not know why that bothers me."}, {"type": "practice", "prompt": "Now say “to bother me” – mich stören.", "answer": "Mich stören. Das stört mich – that bothers me.", "slow": "Mich stören. Das stört mich – that bothers me.", "grammar": "Das stört mich – that bothers me."}, {"type": "narration", "text": "--At 2 PM, I put on my coat and went out again. Berlin was different in the afternoon. Less grey. More alive. I walked without a destination. Past a park where kids were playing soccer. Past a bookstore with a display of books in the window – all German, all incomprehensible, all beautiful. Past a man playing guitar on a corner."}, {"type": "practice", "prompt": "Now say “the park” – der Park.", "answer": "Der Park. Masculine.", "slow": "Der Park. Masculine.", "grammar": "Masculine."}, {"type": "practice", "prompt": "Now say “the bookstore” – die Buchhandlung.", "answer": "Die Buchhandlung. Buch (book) + Handlung (shop).", "slow": "Die Buchhandlung. Buch (book) + Handlung (shop).", "grammar": "Buch (book) + Handlung (shop). I found myself at a bridge. A small one, over a canal. The water was greenish-brown and moved slowly. I leaned on the railing and watched a duck paddle in circles."}, {"type": "practice", "prompt": "Now say “the bridge” – die Brücke.", "answer": "Die Brücke. Feminine.", "slow": "Die Brücke. Feminine.", "grammar": "Feminine."}, {"type": "practice", "prompt": "Now say “the duck” – die Ente.", "answer": "Die Ente. Feminine.", "slow": "Die Ente. Feminine.", "grammar": "Feminine. This was my city now. My bridge. My duck. It felt fake – like playing a role in a movie about someone else's life. But I was here. And I had not run away yet."}, {"type": "practice", "prompt": "Now say “the city” – die Stadt.", "answer": "Die Stadt. Feminine.", "slow": "Die Stadt. Feminine.", "grammar": "Feminine."}, {"type": "narration", "text": "--My phone buzzed. Unknown number. How was the first day? I stared. No one had my number. No one except – I scrolled up. The last message was from Matei, two years ago. But this number was different. German. Matei? I typed. Who else? How did you get my number? You gave it to me. Two years ago. In a message. I laughed. The duck looked at me."}, {"type": "practice", "prompt": "Now say “the phone” – das Handy.", "answer": "Das Handy. Neuter.", "slow": "Das Handy. Neuter.", "grammar": "Neuter."}, {"type": "practice", "prompt": "Now say “the number” – die Nummer.", "answer": "Die Nummer. Feminine.", "slow": "Die Nummer. Feminine.", "grammar": "Feminine."}, {"type": "narration", "text": "--You remember everything, I typed. I told you. I remember things. Did you eat? I made a sandwich. That is not food. It was bread and cheese. That is food. Come to the bookstore at 7. I will buy you dinner. Okay. Do not be late. I am never late. You were late at the airport. The plane was early. That is different."}, {"type": "practice", "prompt": "Now say “to eat” – essen.", "answer": "Essen.", "slow": "Essen.", "grammar": "Repeat aloud: Essen."}, {"type": "practice", "prompt": "Now say “I eat” – ich esse.", "answer": "Ich esse.", "slow": "Ich esse.", "grammar": "Repeat aloud: Ich esse."}, {"type": "practice", "prompt": "Now say “you eat” – du isst. (Stem change: essen → isst for du and er/sie/es.)", "answer": "Du isst.", "slow": "Du isst.", "grammar": "Repeat aloud: Du isst."}, {"type": "narration", "text": "--At 6:30, I started getting ready. I put on the other sweater – dark grey, no holes yet – and tried to do something with my hair. It looked the same. It always looked the same. I looked at myself in the bathroom mirror. You are going to dinner with a man who gave you a key and a job and said you were not alone. That is not a date, I told my reflection. Then why are you nervous?"}, {"type": "practice", "prompt": "Now say “the mirror” – der Spiegel.", "answer": "Der Spiegel. Masculine.", "slow": "Der Spiegel. Masculine.", "grammar": "Masculine."}, {"type": "practice", "prompt": "Now say “nervous” – nervös.", "answer": "Nervös. Ich bin nervös.", "slow": "Nervös. Ich bin nervös.", "grammar": "Ich bin nervös."}, {"type": "narration", "text": "--The bookstore was on the corner. Bücher & Co. A sign in the window said Englische Bücher – English books. Matei was standing outside. Hands in his pockets. When he saw me, he did not wave. He just nodded."}, {"type": "dialogue", "text": "“You are not late,” he said."}, {"type": "dialogue", "text": "“I told you.”"}, {"type": "dialogue", "text": "“You also told me you made a sandwich for lunch. I am still judging you for that.”"}, {"type": "practice", "prompt": "Now say “the bookstore” – die Buchhandlung. Review.", "answer": "Die Buchhandlung.", "slow": "Die Buchhandlung.", "grammar": "Repeat aloud: Die Buchhandlung."}, {"type": "narration", "text": "--We walked inside. It was warm. Smelled like paper and coffee – a small café in the back."}, {"type": "dialogue", "text": "“You work here?” I asked."}, {"type": "dialogue", "text": "“Sometimes. Poetry readings, book launches. Nothing exciting.”"}, {"type": "dialogue", "text": "“It is a bookstore. It is automatically exciting.”"}, {"type": "narration", "text": "He looked at me. “You like books?”"}, {"type": "dialogue", "text": "“I like stories.”"}, {"type": "dialogue", "text": "“Same thing.”"}, {"type": "dialogue", "text": "“No.” I sat down. “Books are the containers. Stories are what fill them.”"}, {"type": "practice", "prompt": "Now say “the book” – das Buch.", "answer": "Das Buch. Plural: die Bücher.", "slow": "Das Buch. Plural: die Bücher.", "grammar": "Plural: die Bücher."}, {"type": "practice", "prompt": "Now say “the story” – die Geschichte. Review.", "answer": "Die Geschichte.", "slow": "Die Geschichte.", "grammar": "Repeat aloud: Die Geschichte."}, {"type": "narration", "text": "--A woman came to the table. Matei ordered in German. She left."}, {"type": "dialogue", "text": "“I ordered for you,” he said."}, {"type": "dialogue", "text": "“Bold.”"}, {"type": "dialogue", "text": "“You do not know the words for the food yet. I saved you the embarrassment.”"}, {"type": "practice", "prompt": "Now say “the food” – das Essen. Review.", "answer": "Das Essen.", "slow": "Das Essen.", "grammar": "The food came. Potatoes, sausage, a dark sauce that tasted like winter. I ate slowly, watching him watch the street through the window. “Matei.” “What?” “Why do you remember everything?” He was quiet for a moment. “Because most people do not,” he said. “They forget. But the small things – the things people think do not matter – those are the things that tell you who they are.” “And you want to know who people are.” “I want to know who you are.”"}, {"type": "practice", "prompt": "Now say “to remember” – sich erinnern. Review.", "answer": "Sich erinnern. Ich erinnere mich.", "slow": "Sich erinnern. Ich erinnere mich.", "grammar": "Ich erinnere mich."}, {"type": "practice", "prompt": "Now say “to forget” – vergessen.", "answer": "Vergessen. Ich habe vergessen.", "slow": "Vergessen. Ich habe vergessen.", "grammar": "Ich habe vergessen."}, {"type": "narration", "text": "--We finished dinner. He paid before I could reach for my pocket."}, {"type": "dialogue", "text": "“Tomorrow, you work again.”"}, {"type": "dialogue", "text": "“9 AM.”"}, {"type": "dialogue", "text": "“I will be gone before you wake up.”"}, {"type": "dialogue", "text": "“I noticed.”"}, {"type": "dialogue", "text": "“Does that bother you?”"}, {"type": "narration", "text": "I considered lying. Decided not to."}, {"type": "dialogue", "text": "“A little,” I said."}, {"type": "dialogue", "text": "“Why is that good?”"}, {"type": "dialogue", "text": "“Because I would be bothered if you were not bothered.”"}, {"type": "practice", "prompt": "Now say “the bill” – die Rechnung.", "answer": "Die Rechnung. Die Rechnung, bitte – the bill, please.", "slow": "Die Rechnung. Die Rechnung, bitte – the bill, please.", "grammar": "Die Rechnung, bitte – the bill, please."}, {"type": "practice", "prompt": "Now say “to pay” – zahlen. Ich möchte zahlen – I would like to pay.", "answer": "--We walked back together. Not touching. But close. Close enough that our shoulders.", "slow": "--We walked back together. Not touching. But close. Close enough that our shoulders.", "grammar": "Not touching. But close. Close enough that our shoulders almost brushed. The stairs were thirty-seven steps. The key stuck. The apartment was dark. “Good night, Yves.” “Good night, Matei.” I lay down in the bed. He lay down on the sofa."}, {"type": "narration", "text": "I listened to him breathe until I fell asleep."}, {"type": "practice", "prompt": "Now say “to listen” – zuhören.", "answer": "Zuhören. Ich höre zu – I listen.", "slow": "Zuhören. Ich höre zu – I listen.", "grammar": "Ich höre zu – I listen."}], "bg": "apartment", "location": "Matei's Apartment"}, {"id": 3, "title": "Six O'Clock", "level": "A1-A2", "segments": [{"type": "narration", "text": "creak, rain against window.) I spent the afternoon trying not to watch the door. The apartment was small. The door was right there, three metres from the sofa. Every time a neighbour walked up the stairs, I looked up. Every time someone laughed in the hallway, I held my breath. By five thirty, I had given up pretending and was just openly staring at the brass handle. At 5:47, the stairs creaked. Footsteps. Slow, deliberate. I recognised them. Which was insane, because I had only heard him walk once last night. But I recognised them anyway. The key turned. The door opened. Matei stepped inside, bringing a gust of cold air and the smell of the street – diesel, rain, something baking from the bakery downstairs."}, {"type": "practice", "prompt": "Now say “the door” – die Tür. Review.", "answer": "Die Tür.", "slow": "Die Tür.", "grammar": "Repeat aloud: Die Tür."}, {"type": "practice", "prompt": "Now say “the key” – der Schlüssel. Review.", "answer": "Der Schlüssel.", "slow": "Der Schlüssel.", "grammar": "Repeat aloud: Der Schlüssel."}, {"type": "dialogue", "text": "--“You are still here,” he said."}, {"type": "dialogue", "text": "“You sound surprised.”"}, {"type": "dialogue", "text": "“I am not surprised. I am just... noticing.”"}, {"type": "narration", "text": "He walked to the kitchen. I heard him open the fridge. Then the freezer. Then the fridge again."}, {"type": "dialogue", "text": "“I did not buy food,” he said."}, {"type": "dialogue", "text": "“I noticed.”"}, {"type": "dialogue", "text": "“I was going to buy food.”"}, {"type": "dialogue", "text": "“But you did not.”"}, {"type": "narration", "text": "He turned around. His expression was almost embarrassed – a faint flush at the tops of his cheeks."}, {"type": "dialogue", "text": "“I forgot.”"}, {"type": "practice", "prompt": "Now say “to forget” – vergessen.", "answer": "Vergessen.", "slow": "Vergessen.", "grammar": "Repeat aloud: Vergessen."}, {"type": "practice", "prompt": "Now say “I forgot” – ich habe vergessen.", "answer": "Ich habe vergessen.", "slow": "Ich habe vergessen.", "grammar": "Haben + past participle – this is the Perfekt tense, the spoken past. You will see it more as the story goes on."}, {"type": "practice", "prompt": "Now say “you forgot” – du hast vergessen.", "answer": "Du hast vergessen.", "slow": "Du hast vergessen.", "grammar": "Repeat aloud: Du hast vergessen."}, {"type": "dialogue", "text": "--“There is a supermarket around the corner,” I said. “I saw it when I went out.”"}, {"type": "dialogue", "text": "“You went out?”"}, {"type": "dialogue", "text": "“To find the café. The one you got me the job at.”"}, {"type": "dialogue", "text": "“Ah.” He nodded slowly. “And?”"}, {"type": "dialogue", "text": "“It exists. Green awning. Smells like bread from three blocks away.”"}, {"type": "dialogue", "text": "“That is the one.”"}, {"type": "practice", "prompt": "Now say “the supermarket” – der Supermarkt.", "answer": "Der Supermarkt. Masculine.", "slow": "Der Supermarkt. Masculine.", "grammar": "Masculine."}, {"type": "practice", "prompt": "Now say “the bread” – das Brot. Review.", "answer": "Das Brot.", "slow": "Das Brot.", "grammar": "Repeat aloud: Das Brot."}, {"type": "dialogue", "text": "--“I can cook,” I said. “If you buy the food.”"}, {"type": "narration", "text": "He raised an eyebrow. “You can cook?”"}, {"type": "dialogue", "text": "“I can cook. Do not look so surprised.”"}, {"type": "dialogue", "text": "“You just arrived in a country where you do not speak the language, you are"}, {"type": "narration", "text": "sleeping on a stranger's sofa, and you are telling me you can cook.”"}, {"type": "dialogue", "text": "“I am full of surprises.”"}, {"type": "narration", "text": "He almost smiled again. He grabbed his coat. “Come on.”"}, {"type": "practice", "prompt": "Now say “to cook” – kochen.", "answer": "Kochen.", "slow": "Kochen.", "grammar": "Repeat aloud: Kochen."}, {"type": "practice", "prompt": "Now say “I cook” – ich koche.", "answer": "Ich koche.", "slow": "Ich koche.", "grammar": "Repeat aloud: Ich koche."}, {"type": "practice", "prompt": "Now say “you cook” – du kochst.", "answer": "Du kochst.", "slow": "Du kochst.", "grammar": "Repeat aloud: Du kochst."}, {"type": "narration", "text": "--The supermarket was called Netto. Fluorescent lights, linoleum floors, shopping carts with wonky wheels. But it was warm, and it had food, and Matei walked through the aisles like a man on a mission. I followed with a basket. He threw things in without looking at prices. Pasta. Tomatoes. A tube of tomato paste. Onions. Garlic. A block of parmesan that cost more than my entire outfit."}, {"type": "practice", "prompt": "Now say “the pasta” – die Nudeln (plural).", "answer": "Die Nudeln.", "slow": "Die Nudeln.", "grammar": "Repeat aloud: Die Nudeln."}, {"type": "practice", "prompt": "Now say “the tomato” – die Tomate.", "answer": "Die Tomate. Plural: die Tomaten.", "slow": "Die Tomate. Plural: die Tomaten.", "grammar": "Plural: die Tomaten."}, {"type": "practice", "prompt": "Now say “the onion” – die Zwiebel.", "answer": "Die Zwiebel. Plural: die Zwiebeln.", "slow": "Die Zwiebel. Plural: die Zwiebeln.", "grammar": "Plural: die Zwiebeln."}, {"type": "practice", "prompt": "Now say “the garlic” – der Knoblauch.", "answer": "Der Knoblauch. Masculine.", "slow": "Der Knoblauch. Masculine.", "grammar": "Masculine."}, {"type": "practice", "prompt": "Now say “the cheese” – der Käse. Review.", "answer": "Der Käse.", "slow": "Der Käse.", "grammar": "Repeat aloud: Der Käse."}, {"type": "narration", "text": "--At the register, the cashier said something fast in German. Matei answered. She looked at me."}, {"type": "dialogue", "text": "“She is asking if you have a loyalty card,” Matei said. “Say Nein, danke.”"}, {"type": "narration", "text": "I looked at the cashier."}, {"type": "dialogue", "text": "“Nein, danke,” I said."}, {"type": "narration", "text": "She nodded. I exhaled."}, {"type": "practice", "prompt": "Now say “no, thank you” – nein, danke.", "answer": "Nein, danke.", "slow": "Nein, danke.", "grammar": "Repeat aloud: Nein, danke."}, {"type": "practice", "prompt": "Now say “yes, please” – ja, bitte.", "answer": "Ja, bitte.", "slow": "Ja, bitte.", "grammar": "Repeat aloud: Ja, bitte."}, {"type": "narration", "text": "--Back at the apartment, I took over the kitchen. It was not much of a kitchen – two burners, a sink, a mini-fridge. But the knife was sharp, and the pot was the right size, and I had made this sauce a hundred times in a dozen different kitchens. My grandmother's recipe. Matei sat on the plastic chair and watched me chop onions."}, {"type": "dialogue", "text": "“You are staring,” I said, not looking up."}, {"type": "dialogue", "text": "“I am observing. There is a difference.”"}, {"type": "dialogue", "text": "“That is my line.”"}, {"type": "dialogue", "text": "“I know.” His voice was quiet. “I liked it.”"}, {"type": "practice", "prompt": "Now say “the kitchen” – die Küche.", "answer": "Die Küche. Feminine.", "slow": "Die Küche. Feminine.", "grammar": "Feminine."}, {"type": "practice", "prompt": "Now say “the knife” – das Messer.", "answer": "Das Messer. Neuter.", "slow": "Das Messer. Neuter.", "grammar": "Neuter."}, {"type": "practice", "prompt": "Now say “the pot” – der Topf.", "answer": "Der Topf. Masculine.", "slow": "Der Topf. Masculine.", "grammar": "Masculine."}, {"type": "narration", "text": "--The sauce came together the way it always did – onions first, until soft and golden, then garlic, then the tomatoes, then a long, slow simmer while the pasta water boiled. The kitchen got hot and steamy. The whole apartment started to smell like my childhood, which was a strange thing to experience in Berlin, in a stranger's kitchen, with a man watching me from a plastic chair."}, {"type": "dialogue", "text": "“You have done this before,” Matei said."}, {"type": "dialogue", "text": "“Once or twice.”"}, {"type": "dialogue", "text": "“More than once or twice.”"}, {"type": "narration", "text": "I stirred the sauce. “My grandmother taught me. She said a man who can cook will never starve and will never be alone.”"}, {"type": "dialogue", "text": "“She sounds wise.”"}, {"type": "dialogue", "text": "“She sounds like she wanted me to get married.”"}, {"type": "narration", "text": "He made a sound – not quite a laugh, but close. “Did it work?”"}, {"type": "dialogue", "text": "“I am here, am I not? Alone. Cooking for a stranger.”"}, {"type": "narration", "text": "The word alone hung in the air."}, {"type": "practice", "prompt": "Now say “alone” – allein.", "answer": "Allein. Ich bin allein – I am alone.", "slow": "Allein. Ich bin allein – I am alone.", "grammar": "Ich bin allein – I am alone."}, {"type": "practice", "prompt": "Now say “not alone” – nicht allein.", "answer": "Nicht allein.", "slow": "Nicht allein.", "grammar": "Repeat aloud: Nicht allein."}, {"type": "narration", "text": "--Matei stood up. He walked to the kitchen – the three steps it took – and stood next to me at the counter. Close enough that I could feel the heat from his arm."}, {"type": "dialogue", "text": "“You are not alone right now,” he said."}, {"type": "narration", "text": "I did not look at him. I stared at the sauce. It was bubbling, which meant I should turn down the heat, but my hand would not move."}, {"type": "dialogue", "text": "“You do not know me,” I said again."}, {"type": "dialogue", "text": "“I know enough.”"}, {"type": "dialogue", "text": "“That is not the same as knowing someone.”"}, {"type": "narration", "text": "He was quiet for a moment. Then he said, “No. It is not. But it is a start.”"}, {"type": "practice", "prompt": "Now say “to know (a person)” – kennen.", "answer": "Kennen.", "slow": "Kennen.", "grammar": "Repeat aloud: Kennen."}, {"type": "practice", "prompt": "Now say “I know you” – ich kenne dich.", "answer": "Ich kenne dich.", "slow": "Ich kenne dich.", "grammar": "Repeat aloud: Ich kenne dich."}, {"type": "narration", "text": "Dich is the accusative form of du. When you know someone, they are the object. --We ate at the table. The two mismatched chairs – me on the wooden one, him on the plastic one. The lamp cast a yellow circle of light over our plates. The pasta was good – not great, but good. The sauce had simmered long enough. The cheese was expensive enough to taste like actual cheese instead of sawdust. Matei ate slowly. Methodically. He twirled the pasta around his fork like he had been taught to do it properly, which was more than I could say for myself."}, {"type": "dialogue", "text": "“This is good,” he said."}, {"type": "dialogue", "text": "“You sound surprised.”"}, {"type": "dialogue", "text": "“I am not surprised. I am... acknowledging.”"}, {"type": "dialogue", "text": "“Same thing.”"}, {"type": "dialogue", "text": "“No.” He set his fork down. “Surprised means I did not expect it. Acknowledging"}, {"type": "narration", "text": "means I knew you could do it, and now I am saying thank you.”"}, {"type": "practice", "prompt": "Now say “thank you for the meal” – danke für das Essen.", "answer": "Danke für das Essen.", "slow": "Danke für das Essen.", "grammar": "Essen means food or meal. It is also the verb “to eat”."}, {"type": "practice", "prompt": "Now say “the table” – der Tisch.", "answer": "Der Tisch. Masculine.", "slow": "Der Tisch. Masculine.", "grammar": "Masculine."}, {"type": "dialogue", "text": "--“I do not remember telling you about my grandmother's pasta,” I said."}, {"type": "dialogue", "text": "“You did. Two years ago. You said her pasta was the only thing that made you feel"}, {"type": "narration", "text": "like you had a home.” The fork in my hand stopped halfway to my mouth."}, {"type": "dialogue", "text": "“I said that?”"}, {"type": "dialogue", "text": "“You said a lot of things.”"}, {"type": "narration", "text": "I set the fork down. My appetite was gone. Not because the food was bad – it was not – but because I was realising, slowly and painfully, that Matei had been paying attention. To everything. To throwaway lines from two years ago. To the way I drank my coffee. To the fact that I was sad at the airport even though I was smiling."}, {"type": "practice", "prompt": "Now say “home” – das Zuhause.", "answer": "Das Zuhause. Neuter.", "slow": "Das Zuhause. Neuter.", "grammar": "Neuter."}, {"type": "practice", "prompt": "Now say “I have no home” – ich habe kein Zuhause.", "answer": "Ich habe kein Zuhause.", "slow": "Ich habe kein Zuhause.", "grammar": "Kein negates nouns. Here, Zuhause is neuter, so kein stays kein. For masculine, it would be keinen."}, {"type": "dialogue", "text": "--“Why do you remember all of that?” I asked."}, {"type": "narration", "text": "He chewed. Swallowed. Took a sip of water. Then he looked at me, and for the first time, he did not look calm. He looked uncertain."}, {"type": "dialogue", "text": "“Because no one had ever told me anything like that before,” he said. “And I"}, {"type": "dialogue", "text": "“Why what?”"}, {"type": "dialogue", "text": "“Why you sounded so lonely.”"}, {"type": "narration", "text": "The word hit me like a door slamming. Lonely. Not sad. Not tired. Lonely."}, {"type": "practice", "prompt": "Now say “lonely” – einsam.", "answer": "Einsam. Ich bin einsam – I am lonely.", "slow": "Einsam. Ich bin einsam – I am lonely.", "grammar": "Ich bin einsam – I am lonely."}, {"type": "practice", "prompt": "Now say “sad” – traurig.", "answer": "Traurig. Ich bin traurig – I am sad.", "slow": "Traurig. Ich bin traurig – I am sad.", "grammar": "Ich bin traurig – I am sad."}, {"type": "dialogue", "text": "--“I am not lonely,” I said."}, {"type": "narration", "text": "Matei did not call me out. He just nodded, finished his pasta, and took his plate to the sink."}, {"type": "dialogue", "text": "“Thank you for dinner,” he said. “It was the best meal I have had in months.”"}, {"type": "dialogue", "text": "“That is sad.”"}, {"type": "dialogue", "text": "“Probably. But true.”"}, {"type": "practice", "prompt": "Now say “to know (a fact)” – wissen.", "answer": "Wissen.", "slow": "Wissen.", "grammar": "Repeat aloud: Wissen."}, {"type": "practice", "prompt": "Now say “I do not know” – ich weiß nicht.", "answer": "Ich weiß nicht.", "slow": "Ich weiß nicht.", "grammar": "Weiß is the first-person form of wissen. It is irregular. Just memorise: ich weiß, ich weiß nicht."}, {"type": "narration", "text": "--I sat at the table for a long time after he had gone to the bathroom. The lamp buzzed. The radiator clicked. Somewhere downstairs, the bakery was closing – the metal grate scraping down. I had come to Berlin to get away from people who knew me. I had come to be anonymous, to start over. But Matei already knew me. Not the facts – the surface things. He knew the shape of me. The lonely parts. The parts that drank black coffee and made pasta from memory. I did not know if that was a good thing or a terrible thing."}, {"type": "practice", "prompt": "Now say “to know (a fact)” again – wissen. Ich weiß nicht.", "answer": "Ich weiß nicht.", "slow": "Ich weiß nicht.", "grammar": "Repeat aloud: Ich weiß nicht."}, {"type": "narration", "text": "--I picked up my plate. Walked it to the sink. Rinsed it. Dried it. Put it in the cabinet. Then I went back to the sofa. He did not go back to the plastic chair. He sat on the other end of the sofa – the end that was not stained, the end that faced the window. The cushion sank under his weight."}, {"type": "dialogue", "text": "“Tomorrow,” he said, “you start at the café.”"}, {"type": "dialogue", "text": "“Tomorrow,” I agreed."}, {"type": "dialogue", "text": "“Are you nervous?”"}, {"type": "dialogue", "text": "“Terrified.”"}, {"type": "narration", "text": "He nodded like that was the right answer. “Good. Terror means you care.”"}, {"type": "dialogue", "text": "“Or it means I have anxiety.”"}, {"type": "dialogue", "text": "“Same thing.”"}, {"type": "practice", "prompt": "Now say “scared” – verängstigt.", "answer": "Verängstigt. Ich bin verängstigt – I am scared.", "slow": "Verängstigt. Ich bin verängstigt – I am scared.", "grammar": "Ich bin verängstigt – I am scared."}, {"type": "narration", "text": "--I laughed. He did not. But his hand was on the cushion between us, close enough that I could see the veins on the back of it, the small scar on his thumb."}, {"type": "dialogue", "text": "“Matei.”"}, {"type": "dialogue", "text": "“What?”"}, {"type": "dialogue", "text": "“Why did you really give me the key?”"}, {"type": "narration", "text": "He did not answer right away. The room was dark except for the lamp. His profile was sharp against the window."}, {"type": "dialogue", "text": "“Because I wanted you to come back,” he said finally."}, {"type": "dialogue", "text": "“Come back from where?”"}, {"type": "dialogue", "text": "“From wherever you were going to go after you left my apartment.”"}, {"type": "dialogue", "text": "“I was not going anywhere.”"}, {"type": "dialogue", "text": "“You were.” He turned to look at me. “You have that look. The look of someone who"}, {"type": "narration", "text": "is always planning their exit. I wanted to give you a reason to stay.”"}, {"type": "practice", "prompt": "Now say “the reason” – der Grund.", "answer": "Der Grund. Masculine.", "slow": "Der Grund. Masculine.", "grammar": "Masculine."}, {"type": "practice", "prompt": "Now say “to stay” – bleiben. Ich bleibe.", "answer": "Bleiben. Ich bleibe.", "slow": "Bleiben. Ich bleibe.", "grammar": "Ich bleibe."}, {"type": "narration", "text": "--My heart was doing something stupid in my chest."}, {"type": "dialogue", "text": "“You do not even know me,” I said for the third time."}, {"type": "narration", "text": "He reached out. His hand covered mine. Warm. Calloused."}, {"type": "dialogue", "text": "“I know you drink your coffee black. I know you laugh when you are uncomfortable."}, {"type": "narration", "text": "I know you left home because staying hurt more than leaving. I know you make pasta like someone who learned from a grandmother who loved you. And I know you are still here.” He paused."}, {"type": "dialogue", "text": "“That is enough to start.”"}, {"type": "narration", "text": "I did not pull my hand away. I should have. But I was tired of retreating. Tired of planning my exit."}, {"type": "dialogue", "text": "“Okay,” I said."}, {"type": "dialogue", "text": "“Okay?”"}, {"type": "dialogue", "text": "“Okay. That is enough to start.”"}, {"type": "narration", "text": "His thumb moved across my knuckles. Once. Twice. Then he let go and stood up."}, {"type": "dialogue", "text": "“Good night, Yves.”"}, {"type": "dialogue", "text": "“Good night, Matei.”"}, {"type": "practice", "prompt": "Now say “to run” – laufen.", "answer": "Laufen.", "slow": "Laufen.", "grammar": "Repeat aloud: Laufen."}, {"type": "practice", "prompt": "Now say “I do not run” – ich laufe nicht.", "answer": "Ich laufe nicht.", "slow": "Ich laufe nicht.", "grammar": "Repeat aloud: Ich laufe nicht."}, {"type": "narration", "text": "--He walked to the sofa. Lay down with his back to the room. I lay down in the bed. The sheets still smelled like his detergent. The pillow still held the shape of his head. I stared at the ceiling and listened to him breathe. Steady. Quiet. And for the first time in years, I did not feel like running. I felt like staying."}, {"type": "practice", "prompt": "Now say “to stay” one more time – bleiben. Ich bleibe.", "answer": "Bleiben. Ich bleibe.", "slow": "Bleiben. Ich bleibe.", "grammar": "Ich bleibe."}], "bg": "apartment", "location": "Matei's Apartment — Evening"}, {"id": 4, "title": "Morning Light", "level": "A1", "segments": [{"type": "narration", "text": "traffic, a dog barking once.) I woke up before my alarm. That never happened. I was the kind of person who hit snooze three times, who negotiated with myself about five more minutes, who treated mornings like an enemy to be defeated through sheer stubbornness. But at 7:15 AM, my eyes opened, and I was fully awake. My first thought was: Matei is still asleep on the sofa. I lay there for a minute, listening. His breathing was slow and deep. He had fallen asleep on his back – soft rhythm, occasional pause, the way his breath caught when he turned over. The sofa creaked. Then silence again."}, {"type": "practice", "prompt": "Now say “to wake up” – aufwachen.", "answer": "Aufwachen. This is a separable verb. In a main clause, the prefix auf goes to the.", "slow": "Aufwachen. This is a separable verb. In a main clause, the prefix auf goes to the.", "grammar": "This is a separable verb. In a main clause, the prefix auf goes to the end: Ich wache um 7 Uhr auf – I wake up at 7 o'clock."}, {"type": "practice", "prompt": "Now say “I wake up at 7” – ich wache um 7 Uhr auf.", "answer": "Ich wache um 7 Uhr auf. Good. The auf is at the end.", "slow": "Ich wache um 7 Uhr auf. Good. The auf is at the end.", "grammar": "Good. The auf is at the end."}, {"type": "narration", "text": "--I got up quietly. The floorboards were cold under my bare feet. I stepped around the creaky spots – I had mapped them last night, because that was the kind of person I was now – and made my way to the bathroom. The shower was terrible again. Low pressure, lukewarm water, a curtain that tried to attack me every time I moved. But I was getting used to it. That was the thing about terrible things. You learned to live with them."}, {"type": "practice", "prompt": "Now say “the bathroom” – das Badezimmer.", "answer": "Das Badezimmer. Bad (bath) + Zimmer (room).", "slow": "Das Badezimmer. Bad (bath) + Zimmer (room).", "grammar": "Bad (bath) + Zimmer (room)."}, {"type": "practice", "prompt": "Now say “the shower” – die Dusche.", "answer": "Die Dusche. Feminine.", "
