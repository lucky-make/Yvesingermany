: "dialogue", "text": "“I do not know.”"}, {"type": "dialogue", "text": "“She knew your name.”"}, {"type": "dialogue", "text": "“I noticed.”"}, {"type": "narration", "text": "The woman finished her latte. Walked to the counter."}, {"type": "dialogue", "text": "“Same time tomorrow?” she asked."}, {"type": "dialogue", "text": "“I do not even know your name.”"}, {"type": "dialogue", "text": "“No.” She smiled. “You do not.”"}, {"type": "narration", "text": "She left. The bell chimed."}, {"type": "practice", "prompt": "Now say “to respond” – antworten.", "answer": "Antworten. Ich antwortete nicht – I did not respond.", "slow": "Antworten. Ich antwortete nicht – I did not respond.", "grammar": "Ich antwortete nicht – I did not respond."}, {"type": "practice", "prompt": "Now say “to notice” – bemerken.", "answer": "Bemerken. Das habe ich bemerkt – I noticed that.", "slow": "Bemerken. Das habe ich bemerkt – I noticed that.", "grammar": "Das habe ich bemerkt – I noticed that."}, {"type": "dialogue", "text": "--“Yves,” Matei said."}, {"type": "dialogue", "text": "“What?”"}, {"type": "dialogue", "text": "“That was weird.”"}, {"type": "dialogue", "text": "“I know.”"}, {"type": "dialogue", "text": "“Do you have any idea who she is?”"}, {"type": "narration", "text": "I thought about it. The dark hair. The red coat. The way she said my name."}, {"type": "dialogue", "text": "“No,” I said. “But I think she knows me.”"}, {"type": "practice", "prompt": "Now say “weird” – komisch or seltsam. Review.", "answer": "Seltsam. Das war seltsam – that was weird.", "slow": "Seltsam. Das war seltsam – that was weird.", "grammar": "Das war seltsam – that was weird."}, {"type": "practice", "prompt": "Now say “the idea” – die Idee.", "answer": "Die Idee. Feminine. Hast du eine Idee? – Do you have an idea?.", "slow": "Die Idee. Feminine. Hast du eine Idee? – Do you have an idea?.", "grammar": "Feminine. Hast du eine Idee? – Do you have an idea?"}, {"type": "narration", "text": "--The rest of the day was a blur. More customers. More coffee. More dropped cups – two more, because my hands were shaking and I could not stop thinking about the woman in the red coat. At 3 PM, Matei left for his shift at the bookstore. He kissed my forehead and told me to lock the door behind me."}, {"type": "dialogue", "text": "“Text me if she comes back,” he said."}, {"type": "dialogue", "text": "“She will not.”"}, {"type": "dialogue", "text": "“How do you know?”"}, {"type": "dialogue", "text": "“Because she said ‘same time tomorrow.’ That means she is planning something.”"}, {"type": "practice", "prompt": "Now say “the blur” – der Schleier or die Unschärfe. Ein Blur – but English word", "answer": "used. Better: Ein Wirbel – a whirl.", "slow": "used. Better: Ein Wirbel – a whirl.", "grammar": "Better: Ein Wirbel – a whirl."}, {"type": "narration", "text": "Ein Wirbel. Der Rest des Tages war ein Wirbel – the rest of the day was a whirl."}, {"type": "practice", "prompt": "Now say “to shake” – zittern. Meine Hände zitterten – my hands were shaking.", "answer": "Zittern. Meine Hände zitterten – my hands were shaking.", "slow": "Zittern. Meine Hände zitterten – my hands were shaking.", "grammar": "Meine Hände zitterten – my hands were shaking."}, {"type": "narration", "text": "--He looked at me. His grey eyes were worried."}, {"type": "dialogue", "text": "“Be careful,” he said."}, {"type": "dialogue", "text": "“I am always careful.”"}, {"type": "dialogue", "text": "“You are not. But I am asking anyway.”"}, {"type": "narration", "text": "He left. I locked the door. Cleaned the counters. Counted the register. Turned off the lights. At 4 PM, I walked home. The streets were grey. The duck was not at the bridge. My phone buzzed again. Unknown number: You are wondering who I am. That is cute. See you tomorrow, Yves. I blocked the number."}, {"type": "practice", "prompt": "Now say “careful” – vorsichtig.", "answer": "Vorsichtig. Sei vorsichtig – be careful.", "slow": "Vorsichtig. Sei vorsichtig – be careful.", "grammar": "Sei vorsichtig – be careful."}, {"type": "practice", "prompt": "Now say “to block” – blockieren. Ich habe die Nummer blockiert – I blocked the", "answer": "number.", "slow": "number.", "grammar": "Repeat aloud: number."}, {"type": "narration", "text": "Blockieren. Ich blockierte die Nummer – I blocked the number. --Matei was already home when I got there. He was sitting on the sofa, his laptop open, not typing."}, {"type": "dialogue", "text": "“You are home early,” I said."}, {"type": "dialogue", "text": "“The bookstore was slow.”"}, {"type": "dialogue", "text": "“You are lying.”"}, {"type": "dialogue", "text": "“I am worried.” He closed the laptop. “Who was that woman?”"}, {"type": "dialogue", "text": "“I do not know.”"}, {"type": "dialogue", "text": "“You do not know, or you do not want to tell me?”"}, {"type": "narration", "text": "I sat on the wooden chair. The plastic one was still empty."}, {"type": "practice", "prompt": "Now say “worried” – besorgt.", "answer": "Besorgt. Ich bin besorgt – I am worried.", "slow": "Besorgt. Ich bin besorgt – I am worried.", "grammar": "Ich bin besorgt – I am worried."}, {"type": "practice", "prompt": "Now say “to lie” – lügen. Review. Du lügst – you are lying.", "answer": "Lügen. Du lügst – you are lying.", "slow": "Lügen. Du lügst – you are lying.", "grammar": "Du lügst – you are lying."}, {"type": "dialogue", "text": "--“I do not know,” I said. “I have never seen her before. But she knew my name. And"}, {"type": "narration", "text": "she knew I was in Berlin. And she knew I worked at the café.”"}, {"type": "dialogue", "text": "“That is not nothing.”"}, {"type": "dialogue", "text": "“I know.”"}, {"type": "dialogue", "text": "“Yves.” He leaned forward. “Did you leave behind something in Nigeria? Someone? A"}, {"type": "narration", "text": "situation?” I thought about it. My grandmother. The friends who had stopped calling."}, {"type": "dialogue", "text": "“No,” I said. “Nothing like that.”"}, {"type": "dialogue", "text": "“Then why is she here?”"}, {"type": "dialogue", "text": "“I do not know.”"}, {"type": "practice", "prompt": "Now say “the situation” – die Situation.", "answer": "Die Situation. Feminine. Eine Situation hinterlassen – to leave behind a.", "slow": "Die Situation. Feminine. Eine Situation hinterlassen – to leave behind a.", "grammar": "Feminine. Eine Situation hinterlassen – to leave behind a situation."}, {"type": "practice", "prompt": "Now say “to leave behind” – zurücklassen (separable).", "answer": "Zurücklassen. Hast du etwas zurückgelassen? – Did you leave something behind?.", "slow": "Zurücklassen. Hast du etwas zurückgelassen? – Did you leave something behind?.", "grammar": "Hast du etwas zurückgelassen? – Did you leave something behind?"}, {"type": "narration", "text": "--He stood up. Walked to the window. Stared out at the street."}, {"type": "dialogue", "text": "“I do not like this,” he said."}, {"type": "dialogue", "text": "“Neither do I.”"}, {"type": "dialogue", "text": "“What are we going to do?”"}, {"type": "narration", "text": "I stood up. Walked to him. Put my hand on his back."}, {"type": "dialogue", "text": "“We are going to open the café tomorrow,” I said. “And if she comes back, we are"}, {"type": "narration", "text": "going to ask her who she is and what she wants.”"}, {"type": "dialogue", "text": "“And if she does not tell us?”"}, {"type": "dialogue", "text": "“Then we call the police.”"}, {"type": "practice", "prompt": "Now say “the police” – die Polizei.", "answer": "Die Polizei. Feminine. Die Polizei rufen – to call the police.", "slow": "Die Polizei. Feminine. Die Polizei rufen – to call the police.", "grammar": "Feminine. Die Polizei rufen – to call the police."}, {"type": "practice", "prompt": "Now say “to ask” – fragen. Wir werden sie fragen – we will ask her.", "answer": "--He turned. His face was close to mine.", "slow": "--He turned. His face was close to mine.", "grammar": "His face was close to mine."}, {"type": "dialogue", "text": "“You are taking this very calmly.”"}, {"type": "dialogue", "text": "“I am not calm. I am pretending to be calm. There is a difference.”"}, {"type": "dialogue", "text": "“You have said that before.”"}, {"type": "dialogue", "text": "“It is still true.”"}, {"type": "narration", "text": "He kissed me. Hard. Brief."}, {"type": "dialogue", "text": "“Okay,” he said. “Tomorrow. We figure it out.”"}, {"type": "dialogue", "text": "“Together.”"}, {"type": "dialogue", "text": "“Together.”"}, {"type": "practice", "prompt": "Now say “calm” – ruhig.", "answer": "Ruhig. Du bist sehr ruhig – you are very calm.", "slow": "Ruhig. Du bist sehr ruhig – you are very calm.", "grammar": "Du bist sehr ruhig – you are very calm."}, {"type": "practice", "prompt": "Now say “to pretend” – vortäuschen or so tun als ob. Ich tue so, als ob ich ruhig", "answer": "bin – I pretend to be calm.", "slow": "bin – I pretend to be calm.", "grammar": "Repeat aloud: bin – I pretend to be calm."}, {"type": "narration", "text": "So tun als ob. Ich tue so, als ob ich ruhig bin – I pretend to be calm. --That night, I did not sleep. I lay in bed, staring at the ceiling, listening to Matei breathe. His arm was around my waist. His chest was warm against my back. I thought about the woman in the red coat. The way she had said my name. The way she had smiled. I had spent my whole life running from people who knew me. People who reminded me of who I used to be. But I did not know who I used to be anymore. I was Yves. Berlin. Coffee. Matei. That was supposed to be enough."}, {"type": "practice", "prompt": "Now say “the ceiling” – die Decke.", "answer": "Die Decke. Feminine. An die Decke starren – to stare at the ceiling.", "slow": "Die Decke. Feminine. An die Decke starren – to stare at the ceiling.", "grammar": "Feminine. An die Decke starren – to stare at the ceiling."}, {"type": "practice", "prompt": "Now say “to suppose” – annehmen or sollen. Das sollte genug sein – that is", "answer": "supposed to be enough.", "slow": "supposed to be enough.", "grammar": "Repeat aloud: supposed to be enough."}, {"type": "narration", "text": "Sollen. Das sollte genug sein – that is supposed to be enough. --My phone buzzed. I had forgotten to block the number again. Unknown number: I know you blocked me. That is fine. I will see you tomorrow anyway. Sleep well, Yves. I deleted the message. Turned off my phone. Closed my eyes. Matei's arm tightened around me."}, {"type": "dialogue", "text": "“You are thinking too loud,” he murmured."}, {"type": "dialogue", "text": "“Sorry.”"}, {"type": "dialogue", "text": "“Do not be sorry. Just sleep.”"}, {"type": "narration", "text": "I tried. I really did. But somewhere in the city, a woman in a red coat was walking through the dark, and she knew my name, and she was not finished with me yet."}, {"type": "practice", "prompt": "Now say “to delete” – löschen.", "answer": "Löschen. Ich löschte die Nachricht – I deleted the message.", "slow": "Löschen. Ich löschte die Nachricht – I deleted the message.", "grammar": "Ich löschte die Nachricht – I deleted the message."}, {"type": "practice", "prompt": "Now say “to murmur” – murmeln. Er murmelte – he murmured.", "answer": "Murmeln. „Du denkst zu laut“, murmelte er – “You are thinking too loud,” he.", "slow": "Murmeln. „Du denkst zu laut“, murmelte er – “You are thinking too loud,” he.", "grammar": "„Du denkst zu laut“, murmelte er – “You are thinking too loud,” he murmured."}], "bg": "café", "location": "Morgenlicht — Opening Day"}, {"id": 12, "title": "Lucky", "level": "A2", "segments": [{"type": "narration", "text": "machine, clink of cups, quiet chatter.) She came back the next day. Same red coat. Same leather bag. Same smile that was not warm or cold but something in between. She ordered the same thing – latte, oat milk, extra hot – and paid with the same crisp euros. I made her drink. My hands were steady. I was proud of that."}, {"type": "dialogue", "text": "“You did not sleep well,” she said. Not a question."}, {"type": "dialogue", "text": "“How would you know?”"}, {"type": "dialogue", "text": "“Your eyes. They are tired.” She took a sip of her latte. “You used to sleep like"}, {"type": "narration", "text": "a rock. Nothing woke you up. Not the church bells, not the dogs, not your grandmother yelling at the television.”"}, {"type": "practice", "prompt": "Now say “the leather bag” – die Ledertasche.", "answer": "Die Ledertasche. Feminine. Eine Ledertasche – a leather bag.", "slow": "Die Ledertasche. Feminine. Eine Ledertasche – a leather bag.", "grammar": "Feminine. Eine Ledertasche – a leather bag."}, {"type": "practice", "prompt": "Now say “crisp” – knackig or neu. Knackige Euros – crisp euros.", "answer": "Knackig. Knackige Euros – crisp euros.", "slow": "Knackig. Knackige Euros – crisp euros.", "grammar": "Knackige Euros – crisp euros."}, {"type": "narration", "text": "--I stopped wiping the counter."}, {"type": "dialogue", "text": "“Who are you?”"}, {"type": "narration", "text": "She set her cup down. Looked at me. Really looked."}, {"type": "dialogue", "text": "“You do not recognise me, do you?”"}, {"type": "dialogue", "text": "“I told you. No.”"}, {"type": "narration", "text": "She laughed. It was a familiar laugh. Something from a long time ago, buried under years of forgetting."}, {"type": "dialogue", "text": "“I am Adaeze,” she said. “But you knew me as Ada.”"}, {"type": "practice", "prompt": "Now say “to recognise” – erkennen.", "answer": "Erkennen. Du erkennst mich nicht – you do not recognise me.", "slow": "Erkennen. Du erkennst mich nicht – you do not recognise me.", "grammar": "Du erkennst mich nicht – you do not recognise me."}, {"type": "practice", "prompt": "Now say “buried” – vergraben. Unter Jahren des Vergessens vergraben – buried under", "answer": "years of forgetting.", "slow": "years of forgetting.", "grammar": "Repeat aloud: years of forgetting."}, {"type": "narration", "text": "Vergraben. Unter Jahren des Vergessens vergraben – buried under years of forgetting. --The name hit me like a door slamming. Ada. Ada with the braids. Ada who lived down the street. Ada who used to sneak me food from her mother's kitchen when my grandmother forgot to cook. Ada who I had kissed once, behind the church, just to see what it felt like. Ada who I had stopped talking to when I realised I was kissing boys in secret and could not look her in the eye anymore."}, {"type": "dialogue", "text": "“Ada,” I said."}, {"type": "dialogue", "text": "“You remember now.”"}, {"type": "dialogue", "text": "“That was ten years ago.”"}, {"type": "dialogue", "text": "“Twelve. You were eight. I was nine.” She smiled. The warm kind this time. “You"}, {"type": "narration", "text": "kissed me behind the church and then you ran away. You have always been good at running, Lucky.”"}, {"type": "practice", "prompt": "Now say “the braids” – die Zöpfe (plural).", "answer": "Die Zöpfe. Plural. Ada mit den Zöpfen – Ada with the braids.", "slow": "Die Zöpfe. Plural. Ada mit den Zöpfen – Ada with the braids.", "grammar": "Plural. Ada mit den Zöpfen – Ada with the braids."}, {"type": "practice", "prompt": "Now say “to sneak” – schmuggeln or heimlich geben. Sie schmuggelte mir Essen zu –", "answer": "she snuck me food.", "slow": "she snuck me food.", "grammar": "Repeat aloud: she snuck me food."}, {"type": "narration", "text": "Schmuggeln. Sie schmuggelte mir Essen zu – she snuck me food. --Lucky. That was my name before Yves. The name my grandmother called me. The name I had buried when I left Nigeria. The name I never wanted to hear again."}, {"type": "dialogue", "text": "“Do not call me that,” I said."}, {"type": "dialogue", "text": "“Why not? It is your name.”"}, {"type": "dialogue", "text": "“It is not my name anymore.”"}, {"type": "narration", "text": "She tilted her head. “What is your name now?”"}, {"type": "dialogue", "text": "“Yves.”"}, {"type": "dialogue", "text": "“Yves,” she repeated. “French. Fancy. You always wanted to be somewhere else.”"}, {"type": "practice", "prompt": "Now say “fancy” – schick or elegant.", "answer": "Schick. Französisch. Schick. – French. Fancy.", "slow": "Schick. Französisch. Schick. – French. Fancy.", "grammar": "Französisch. Schick. – French. Fancy."}, {"type": "practice", "prompt": "Now say “somewhere else” – irgendwo anders.", "answer": "Irgendwo anders. Du wolltest immer irgendwo anders sein – you always wanted to be.", "slow": "Irgendwo anders. Du wolltest immer irgendwo anders sein – you always wanted to be.", "grammar": "Du wolltest immer irgendwo anders sein – you always wanted to be somewhere else."}, {"type": "narration", "text": "--The café was empty except for us. The bell above the door was silent. The espresso machine hissed."}, {"type": "dialogue", "text": "“What are you doing here, Ada?”"}, {"type": "dialogue", "text": "“I live here now. Moved to Berlin last month. For work.” She took another sip. “I"}, {"type": "narration", "text": "saw you through the window. I could not believe it. Lucky, in Berlin, making coffee. I had to come in.”"}, {"type": "dialogue", "text": "“You could have just said hello. You did not have to text me from an unknown"}, {"type": "narration", "text": "number and act like a spy.”"}, {"type": "dialogue", "text": "“I wanted to see if you would recognise me. You did not.” She shrugged. “That is"}, {"type": "narration", "text": "okay. It has been a long time.”"}, {"type": "practice", "prompt": "Now say “the spy” – der Spion.", "answer": "Der Spion. Masculine. Wie ein Spion – like a spy.", "slow": "Der Spion. Masculine. Wie ein Spion – like a spy.", "grammar": "Masculine. Wie ein Spion – like a spy."}, {"type": "practice", "prompt": "Now say “to shrug” – mit den Schultern zucken.", "answer": "Mit den Schultern zucken. Sie zuckte mit den Schultern – she shrugged.", "slow": "Mit den Schultern zucken. Sie zuckte mit den Schultern – she shrugged.", "grammar": "Sie zuckte mit den Schultern – she shrugged."}, {"type": "dialogue", "text": "--“How did you get my number?”"}, {"type": "dialogue", "text": "“Your grandmother. She said you had changed your name and moved to Germany. She"}, {"type": "narration", "text": "did not know the city. I had to find that on my own.” My grandmother. Of course. She had never understood why I left. She probably thought Ada could talk sense into me."}, {"type": "dialogue", "text": "“You should not have come,” I said."}, {"type": "dialogue", "text": "“Too late. I am here.”"}, {"type": "narration", "text": "The bell chimed. Matei walked in."}, {"type": "practice", "prompt": "Now say “the grandmother” – die Großmutter.", "answer": "Die Großmutter. Feminine. Deine Großmutter – your grandmother.", "slow": "Die Großmutter. Feminine. Deine Großmutter – your grandmother.", "grammar": "Feminine. Deine Großmutter – your grandmother."}, {"type": "practice", "prompt": "Now say “of course” – natürlich.", "answer": "Natürlich. Natürlich – of course.", "slow": "Natürlich. Natürlich – of course.", "grammar": "Natürlich – of course."}, {"type": "narration", "text": "--He was wearing his grey coat. His hair was messy. His eyes went straight to Ada, then to me, then back to Ada."}, {"type": "dialogue", "text": "“Yves,” he said. “Who is this?”"}, {"type": "narration", "text": "I opened my mouth. The words did not come. This was the moment. I could introduce her as Ada, an old friend from Nigeria. I could tell the truth – that she was someone I had kissed once, someone who knew me before I knew myself. I could be honest, the way Matei had asked me to be. But I was scared. Scared of what Matei would think. Scared of the questions he would ask. Scared of the boy I used to be."}, {"type": "dialogue", "text": "“An old friend,” I said. “Ada.”"}, {"type": "practice", "prompt": "Now say “the moment” – der Moment. Review.", "answer": "Der Moment. Dies war der Moment – this was the moment.", "slow": "Der Moment. Dies war der Moment – this was the moment.", "grammar": "Dies war der Moment – this was the moment."}, {"type": "practice", "prompt": "Now say “honest” – ehrlich.", "answer": "Ehrlich. Ehrlich sein – to be honest.", "slow": "Ehrlich. Ehrlich sein – to be honest.", "grammar": "Ehrlich sein – to be honest."}, {"type": "narration", "text": "--Matei looked at her. Then at me."}, {"type": "dialogue", "text": "“Nice to meet you,” he said. His voice was flat."}, {"type": "dialogue", "text": "“You too.” Ada smiled at him. Then at me. “And you are?”"}, {"type": "dialogue", "text": "“Matei. I work at the bookstore down the street.”"}, {"type": "dialogue", "text": "“Ah. Yves's coworker?”"}, {"type": "narration", "text": "I should have corrected her. I should have said he is my boyfriend or he is the man I am sleeping with or he is the reason I am still in this city. But the words would not come. My mouth was dry. My hands were shaking."}, {"type": "dialogue", "text": "“We share an apartment,” I said. “He is my roommate.”"}, {"type": "practice", "prompt": "Now say “the roommate” – der Mitbewohner.", "answer": "Der Mitbewohner. Masculine. Mein Mitbewohner – my roommate.", "slow": "Der Mitbewohner. Masculine. Mein Mitbewohner – my roommate.", "grammar": "Masculine. Mein Mitbewohner – my roommate."}, {"type": "practice", "prompt": "Now say “to correct” – korrigieren.", "answer": "Korrigieren. Ich hätte sie korrigieren sollen – I should have corrected her.", "slow": "Korrigieren. Ich hätte sie korrigieren sollen – I should have corrected her.", "grammar": "Ich hätte sie korrigieren sollen – I should have corrected her."}, {"type": "narration", "text": "--Matei's expression did not change. But his hands – his hands curled into fists at his sides."}, {"type": "dialogue", "text": "“That is nice,” Ada said. “It is hard to find good roommates in Berlin.”"}, {"type": "dialogue", "text": "“Hard to find good ones anywhere,” Matei said. He walked behind the counter. Did"}, {"type": "narration", "text": "not touch me. Did not look at me. Started cleaning the espresso machine. The silence was loud. Ada finished her latte. Stood up. Sling her bag over her shoulder."}, {"type": "dialogue", "text": "“I will be around, Lucky,” she said. “We should catch up properly. Maybe dinner?”"}, {"type": "dialogue", "text": "“Maybe,” I said."}, {"type": "practice", "prompt": "Now say “to catch up” – sich unterhalten or aufholen. Wir sollten uns unterhalten", "answer": "– we should catch up.", "slow": "– we should catch up.", "grammar": "Repeat aloud: – we should catch up."}, {"type": "narration", "text": "Sich unterhalten. Wir sollten uns unterhalten – we should catch up."}, {"type": "practice", "prompt": "Now say “properly” – richtig or ordentlich.", "answer": "Richtig. Richtig unterhalten – catch up properly.", "slow": "Richtig. Richtig unterhalten – catch up properly.", "grammar": "Richtig unterhalten – catch up properly."}, {"type": "narration", "text": "--She left. The bell chimed. The door closed. Matei did not look up from the espresso machine."}, {"type": "dialogue", "text": "“Roommate,” he said."}, {"type": "dialogue", "text": "“Matei –”"}, {"type": "dialogue", "text": "“Roommate. That is what I am. A roommate.”"}, {"type": "dialogue", "text": "“You do not understand.”"}, {"type": "dialogue", "text": "“Then explain it to me.”"}, {"type": "narration", "text": "I walked to him. Put my hand on his arm. He did not pull away, but he did not lean in either."}, {"type": "practice", "prompt": "Now say “to explain” – erklären. Review.", "answer": "Erklären. Dann erkläre es mir – then explain it to me.", "slow": "Erklären. Dann erkläre es mir – then explain it to me.", "grammar": "Dann erkläre es mir – then explain it to me."}, {"type": "practice", "prompt": "Now say “to pull away” – wegziehen (separable).", "answer": "Wegziehen. Er zog sich nicht weg – he did not pull away.", "slow": "Wegziehen. Er zog sich nicht weg – he did not pull away.", "grammar": "Er zog sich nicht weg – he did not pull away."}, {"type": "dialogue", "text": "--“That is Ada,” I said. “I knew her when I was a kid. In Nigeria. She called me"}, {"type": "narration", "text": "Lucky. That was my name before Yves.”"}, {"type": "dialogue", "text": "“I do not care what your name was.”"}, {"type": "dialogue", "text": "“I kissed her once. Behind a church. I was eight. She was nine. I did not know"}, {"type": "dialogue", "text": "“I do not care about that either.”"}, {"type": "dialogue", "text": "“Then what do you care about?”"}, {"type": "narration", "text": "He finally looked at me. His grey eyes were hard."}, {"type": "dialogue", "text": "“I care that you introduced me as your roommate. I care that you lied. I care that"}, {"type": "narration", "text": "you are still hiding.”"}, {"type": "practice", "prompt": "Now say “to care” – kümmern. Es kümmert mich – I care.", "answer": "Kümmern. Es kümmert mich, dass du gelogen hast – I care that you lied.", "slow": "Kümmern. Es kümmert mich, dass du gelogen hast – I care that you lied.", "grammar": "Es kümmert mich, dass du gelogen hast – I care that you lied."}, {"type": "practice", "prompt": "Now say “to hide” – verstecken. Review.", "answer": "Verstecken. Dass du dich immer noch versteckst – that you are still hiding.", "slow": "Verstecken. Dass du dich immer noch versteckst – that you are still hiding.", "grammar": "Dass du dich immer noch versteckst – that you are still hiding."}, {"type": "dialogue", "text": "--“I am not hiding.”"}, {"type": "dialogue", "text": "“You just hid me.”"}, {"type": "narration", "text": "The words hit like a punch."}, {"type": "dialogue", "text": "“I was scared,” I said."}, {"type": "dialogue", "text": "“Of what?”"}, {"type": "dialogue", "text": "“Of her. Of what she would think. Of what she would say. She knew me before."}, {"type": "narration", "text": "Before I knew myself. She thought I was straight. She thought I was going to grow up and marry her or someone like her. And I could not – I could not just –”"}, {"type": "dialogue", "text": "“You could not tell her the truth.”"}, {"type": "dialogue", "text": "“I could not.”"}, {"type": "practice", "prompt": "Now say “straight” – heterosexuell.", "answer": "Heterosexuell. Sie dachte, ich sei hetero – she thought I was straight.", "slow": "Heterosexuell. Sie dachte, ich sei hetero – she thought I was straight.", "grammar": "Sie dachte, ich sei hetero – she thought I was straight."}, {"type": "practice", "prompt": "Now say “the truth” – die Wahrheit. Review.", "answer": "Die Wahrheit. Du konntest ihr nicht die Wahrheit sagen – you could not tell her.", "slow": "Die Wahrheit. Du konntest ihr nicht die Wahrheit sagen – you could not tell her.", "grammar": "Du konntest ihr nicht die Wahrheit sagen – you could not tell her the truth."}, {"type": "narration", "text": "--He pulled his arm away. Walked to the window. Stared out at the street."}, {"type": "dialogue", "text": "“I am not asking you to come out to everyone, Yves. I am asking you not to hide"}, {"type": "dialogue", "text": "“I was not hiding you.”"}, {"type": "dialogue", "text": "“You called me your roommate. In my own apartment. The apartment where you sleep"}, {"type": "narration", "text": "in my bed.” I did not have an answer. Because he was right. I had hid him. I had panicked. I had reverted to the person I used to be – the one who lied, who ran, who kept everyone at arm's length."}, {"type": "dialogue", "text": "“I am sorry,” I said."}, {"type": "dialogue", "text": "“Sorry does not fix it.”"}, {"type": "dialogue", "text": "“What does?”"}, {"type": "practice", "prompt": "Now say “to come out” – sich outen.", "answer": "Sich outen. Ich bitte dich nicht, dich vor allen zu outen – I am not asking you to.", "slow": "Sich outen. Ich bitte dich nicht, dich vor allen zu outen – I am not asking you to.", "grammar": "Ich bitte dich nicht, dich vor allen zu outen – I am not asking you to come out to everyone."}, {"type": "practice", "prompt": "Now say “to fix” – reparieren or in Ordnung bringen.", "answer": "Reparieren. Entschuldigung repariert es nicht – sorry does not fix it.", "slow": "Reparieren. Entschuldigung repariert es nicht – sorry does not fix it.", "grammar": "Entschuldigung repariert es nicht – sorry does not fix it."}, {"type": "narration", "text": "--He turned. His face was tired."}, {"type": "dialogue", "text": "“I do not know,” he said. “I will let you know when I figure it out.”"}, {"type": "narration", "text": "He walked to the back door. The one that led to the alley."}, {"type": "dialogue", "text": "“Where are you going?”"}, {"type": "dialogue", "text": "“To work. I have a shift.”"}, {"type": "dialogue", "text": "“It is 9 AM.”"}, {"type": "dialogue", "text": "“I am late.”"}, {"type": "narration", "text": "He left. The metal door clanged shut. I stood behind the counter, alone in the café, with the espresso machine hissing and the bell above the door silent."}, {"type": "practice", "prompt": "Now say “the shift” – die Schicht. Review.", "answer": "Die Schicht. Ich habe eine Schicht – I have a shift.", "slow": "Die Schicht. Ich habe eine Schicht – I have a shift.", "grammar": "Ich habe eine Schicht – I have a shift."}, {"type": "practice", "prompt": "Now say “to clang” – klirren.", "answer": "Klirren. Die Metalltür klirrte zu – the metal door clanged shut.", "slow": "Klirren. Die Metalltür klirrte zu – the metal door clanged shut.", "grammar": "Die Metalltür klirrte zu – the metal door clanged shut."}, {"type": "narration", "text": "--My phone buzzed. Ada: He is cute. Is he really your roommate? I did not answer. The day was long. I made coffee. Dropped two cups. Apologised to the floor. I could not focus. I kept thinking about Matei's face. The way he had said roommate. The way he had walked out."}, {"type": "practice", "prompt": "Now say “cute” – süß.", "answer": "Süß. Er ist süß – he is cute.", "slow": "Süß. Er ist süß – he is cute.", "grammar": "Er ist süß – he is cute."}, {"type": "practice", "prompt": "Now say “to focus” – konzentrieren.", "answer": "Konzentrieren. Ich konnte mich nicht konzentrieren – I could not focus.", "slow": "Konzentrieren. Ich konnte mich nicht konzentrieren – I could not focus.", "grammar": "Ich konnte mich nicht konzentrieren – I could not focus."}, {"type": "narration", "text": "--At 2 PM, I closed the café early. Locked the door. Lowered the awning. Walked home. The apartment was empty. Matei was not there. His laptop was gone. His coat was gone. The plant on the windowsill – Matei Jr. – was still there, still alive, still judging me. I sat on the sofa. Stared at the wall. My phone buzzed again. Ada: Dinner tonight? There is a place near my work. I will send you the address. I typed back: I am busy. Tomorrow, then. Maybe. You have not changed, Lucky. Still running."}, {"type": "practice", "prompt": "Now say “to lower” – senken or herunterlassen.", "answer": "Herunterlassen. Ich ließ die Markise herunter – I lowered the awning.", "slow": "Herunterlassen. Ich ließ die Markise herunter – I lowered the awning.", "grammar": "Ich ließ die Markise herunter – I lowered the awning."}, {"type": "practice", "prompt": "Now say “still” – immer noch.", "answer": "Immer noch. Du rennst immer noch – you are still running.", "slow": "Immer noch. Du rennst immer noch – you are still running.", "grammar": "Du rennst immer noch – you are still running."}, {"type": "narration", "text": "--I put the phone down. Picked it up again. Called Matei. He did not answer. I texted: I am sorry. Please come home. Three dots appeared. Then disappeared. Then nothing. At 8 PM, the door opened. Matei walked in. He looked tired. His hair was a mess. He was carrying a bag of groceries – bread, cheese, a bottle of wine."}, {"type": "dialogue", "text": "“I bought food,” he said."}, {"type": "dialogue", "text": "“I see that.”"}, {"type": "practice", "prompt": "Now say “the wine” – der Wein.", "answer": "Der Wein. Masculine. Eine Flasche Wein – a bottle of wine.", "slow": "Der Wein. Masculine. Eine Flasche Wein – a bottle of wine.", "grammar": "Masculine. Eine Flasche Wein – a bottle of wine."}, {"type": "practice", "prompt": "Now say “a mess” – ein Durcheinander.", "answer": "Ein Durcheinander. Seine Haare waren ein Durcheinander – his hair was a mess.", "slow": "Ein Durcheinander. Seine Haare waren ein Durcheinander – his hair was a mess.", "grammar": "Seine Haare waren ein Durcheinander – his hair was a mess."}, {"type": "dialogue", "text": "--“I was going to cook. But I am tired.”"}, {"type": "dialogue", "text": "“I can cook.”"}, {"type": "narration", "text": "He set the bag on the table. Did not look at me."}, {"type": "dialogue", "text": "“Matei.”"}, {"type": "dialogue", "text": "“What?”"}, {"type": "dialogue", "text": "“I am sorry. I know I keep saying it. But I am.”"}, {"type": "dialogue", "text": "“You keep apologising and then you keep doing the same thing.”"}, {"type": "dialogue", "text": "“I know.”"}, {"type": "dialogue", "text": "“So what is going to change?”"}, {"type": "practice", "prompt": "Now say “to apologise” – sich entschuldigen. Review.", "answer": "Sich entschuldigen. Ich entschuldige mich – I apologise.", "slow": "Sich entschuldigen. Ich entschuldige mich – I apologise.", "grammar": "Ich entschuldige mich – I apologise."}, {"type": "practice", "prompt": "Now say “to change” – ändern or sich verändern.", "answer": "Ändern. Was wird sich ändern? – What is going to change?.", "slow": "Ändern. Was wird sich ändern? – What is going to change?.", "grammar": "Was wird sich ändern? – What is going to change?"}, {"type": "narration", "text": "--I stood up. Walked to him. Stopped a metre away."}, {"type": "dialogue", "text": "“I do not know,” I said. “But I want to try. I want to be better. I want to stop"}, {"type": "narration", "text": "hiding. I just do not know how.” He finally looked at me. His grey eyes were wet."}, {"type": "dialogue", "text": "“Start small,” he said. “Tell me one thing you have never told anyone.”"}, {"type": "narration", "text": "I thought about it. My grandmother. My mother. The years of pretending."}, {"type": "dialogue", "text": "“I kissed Ada because I was trying to be normal,” I said. “I thought if I kissed a"}, {"type": "narration", "text": "girl, I would not want to kiss boys anymore. But I still wanted to kiss boys. And I hated myself for it.”"}, {"type": "practice", "prompt": "Now say “normal” – normal.", "answer": "Normal. Ich versuchte, normal zu sein – I was trying to be normal.", "slow": "Normal. Ich versuchte, normal zu sein – I was trying to be normal.", "grammar": "Ich versuchte, normal zu sein – I was trying to be normal."}, {"type": "practice", "prompt": "Now say “to hate” – hassen.", "answer": "Hassen. Ich hasste mich dafür – I hated myself for it.", "slow": "Hassen. Ich hasste mich dafür – I hated myself for it.", "grammar": "Ich hasste mich dafür – I hated myself for it."}, {"type": "narration", "text": "--Matei did not speak. He just listened."}, {"type": "dialogue", "text": "“I hated myself for a long time,” I said. “For wanting things I was not supposed"}, {"type": "narration", "text": "to want. For being the way I am. For not being able to fit into the life everyone planned for me.”"}, {"type": "dialogue", "text": "“And now?”"}, {"type": "dialogue", "text": "“I do not hate myself anymore. Not as much. But I am still scared. Of what people"}, {"type": "narration", "text": "will think. Of what they will say. Of losing the people I care about.” He stepped closer. His hand touched my face."}, {"type": "dialogue", "text": "“You are not going to lose me,” he said. “Not by telling the truth. You will lose"}, {"type": "dialogue", "text": "“I know.”"}, {"type": "dialogue", "text": "“So stop hiding.”"}, {"type": "practice", "prompt": "Now say “to lose” – verlieren. Review.", "answer": "Verlieren. Du wirst mich nicht verlieren – you will not lose me.", "slow": "Verlieren. Du wirst mich nicht verlieren – you will not lose me.", "grammar": "Du wirst mich nicht verlieren – you will not lose me."}, {"type": "practice", "prompt": "Now say “to step closer” – näher treten.", "answer": "Näher treten. Er trat näher – he stepped closer.", "slow": "Näher treten. Er trat näher – he stepped closer.", "grammar": "Er trat näher – he stepped closer."}, {"type": "dialogue", "text": "--“I will tell her,” I said. “Ada. I will tell her the truth. About you. About us.”"}, {"type": "dialogue", "text": "“When?”"}, {"type": "dialogue", "text": "“Tomorrow. She wants dinner.”"}, {"type": "narration", "text": "He nodded slowly. “I will come with you.”"}, {"type": "dialogue", "text": "“You do not have to.”"}, {"type": "dialogue", "text": "“I know.” He kissed my forehead. “But I want to.”"}, {"type": "narration", "text": "We stood there for a moment, his hand on my face, my hand on his chest."}, {"type": "dialogue", "text": "“Matei.”"}, {"type": "dialogue", "text": "“What?”"}, {"type": "dialogue", "text": "“I am glad you came back.”"}, {"type": "dialogue", "text": "“I am not going anywhere.”"}, {"type": "practice", "prompt": "Now say “the truth” – die Wahrheit. Review.", "answer": "Die Wahrheit. Ich werde ihr die Wahrheit sagen – I will tell her the truth.", "slow": "Die Wahrheit. Ich werde ihr die Wahrheit sagen – I will tell her the truth.", "grammar": "Ich werde ihr die Wahrheit sagen – I will tell her the truth."}, {"type": "practice", "prompt": "Now say “to nod” – nicken.", "answer": "Nicken. Er nickte langsam – he nodded slowly.", "slow": "Nicken. Er nickte langsam – he nodded slowly.", "grammar": "Er nickte langsam – he nodded slowly."}, {"type": "narration", "text": "--He unpacked the groceries, and I made pasta, and we ate at the table with the two mismatched chairs, and we did not talk about Ada or running or hiding. We just ate."}, {"type": "practice", "prompt": "Now say “to unpack” – auspacken (separable).", "answer": "Auspacken. Er packte die Lebensmittel aus – he unpacked the groceries.", "slow": "Auspacken. Er packte die Lebensmittel aus – he unpacked the groceries.", "grammar": "Er packte die Lebensmittel aus – he unpacked the groceries."}, {"type": "practice", "prompt": "Now say “mismatched” – zusammengewürfelt or nicht zusammenpassend.", "answer": "Nicht zusammenpassend. Die zwei nicht zusammenpassenden Stühle – the two.", "slow": "Nicht zusammenpassend. Die zwei nicht zusammenpassenden Stühle – the two.", "grammar": "Die zwei nicht zusammenpassenden Stühle – the two mismatched chairs."}], "bg": "café", "location": "Morgenlicht — A Visitor"}, {"id": 13, "title": "The Dinner", "level": "A2-B1", "segments": [{"type": "narration", "text": "music, distant laughter.) Ada picked a restaurant in Neukölln. Something trendy with exposed brick and candles in wine bottles and a menu written in German that I could not read. She was already there when we arrived, sitting at a table by the window, her red coat draped over the back of her chair. She stood up when she saw us. Hugged me. Held on too long."}, {"type": "dialogue", "text": "“You came,” she said."}, {"type": "dialogue", "text": "“I said I would.”"}, {"type": "dialogue", "text": "“You also said you would write me when you left Nigeria.” She pulled back. Smiled."}, {"type": "dialogue", "text": "“You did not.”"}, {"type": "dialogue", "text": "“I am not good at goodbyes.”"}, {"type": "dialogue", "text": "“You never were.”"}, {"type": "practice", "prompt": "Now say “the menu” – die Speisekarte.", "answer": "Die Speisekarte. Feminine. Die Speisekarte war auf Deutsch – the menu was in.", "slow": "Die Speisekarte. Feminine. Die Speisekarte war auf Deutsch – the menu was in.", "grammar": "Feminine. Die Speisekarte war auf Deutsch – the menu was in German."}, {"type": "practice", "prompt": "Now say “draped” – gelegt or gehängt. Ihr roter Mantel hing über der Stuhllehne –", "answer": "her red coat was draped over the back of the chair.", "slow": "her red coat was draped over the back of the chair.", "grammar": "Repeat aloud: her red coat was draped over the back of the chair."}, {"type": "narration", "text": "--She looked at Matei. He was standing behind me, hands in his coat pockets."}, {"type": "dialogue", "text": "“You brought your roommate,” she said."}, {"type": "dialogue", "text": "“He is not my roommate.”"}, {"type": "narration", "text": "Her eyebrows went up. “No?” I took a breath. Matei's hand found the small of my back. A touch. A reminder."}, {"type": "dialogue", "text": "“This is Matei,” I said. “He is my boyfriend.”"}, {"type": "narration", "text": "The word hung in the air. Boyfriend. I had never said it out loud before. It felt strange in my mouth. Foreign."}, {"type": "practice", "prompt": "Now say “the boyfriend” – der Freund (same as friend – context tells you). Mein", "answer": "Freund – my boyfriend.", "slow": "Freund – my boyfriend.", "grammar": "Repeat aloud: Freund – my boyfriend."}, {"type": "narration", "text": "Der Freund. Das ist mein Freund – this is my boyfriend."}, {"type": "practice", "prompt": "Now say “foreign” – fremd.", "answer": "Fremd. Es fühlte sich fremd an – it felt foreign.", "slow": "Fremd. Es fühlte sich fremd an – it felt foreign.", "grammar": "Es fühlte sich fremd an – it felt foreign."}, {"type": "narration", "text": "--Ada's expression did not change. She looked at Matei. Then at me. Then back at Matei."}, {"type": "dialogue", "text": "“Okay,” she said."}, {"type": "dialogue", "text": "“Okay?”"}, {"type": "dialogue", "text": "“Okay.” She sat back down. Picked up her wine glass. “Sit. I ordered for us"}, {"type": "narration", "text": "already. I hope you still like spicy food.” I looked at Matei. He looked at me. We sat."}, {"type": "practice", "prompt": "Now say “spicy” – scharf.", "answer": "Scharf. Scharfes Essen – spicy food.", "slow": "Scharf. Scharfes Essen – spicy food.", "grammar": "Scharfes Essen – spicy food."}, {"type": "practice", "prompt": "Now say “the wine glass” – das Weinglas.", "answer": "Das Weinglas. Neuter. Sie nahm ihr Weinglas – she picked up her wine glass.", "slow": "Das Weinglas. Neuter. Sie nahm ihr Weinglas – she picked up her wine glass.", "grammar": "Neuter. Sie nahm ihr Weinglas – she picked up her wine glass."}, {"type": "narration", "text": "--The food came. It was good. Spicy, like Ada remembered. I ate without tasting."}, {"type": "dialogue", "text": "“So,” Ada said, twirling noodles around her fork. “Boyfriend.”"}, {"type": "dialogue", "text": "“Yes.”"}, {"type": "dialogue", "text": "“How long?”"}, {"type": "dialogue", "text": "“A few weeks,” I said. “But we have known each other longer.”"}, {"type": "dialogue", "text": "“How much longer?”"}, {"type": "dialogue", "text": "“Two years. Online.”"}, {"type": "narration", "text": "She nodded slowly. “And you moved to Berlin for him?”"}, {"type": "dialogue", "text": "“I moved because I needed to leave. He was part of it. Not all of it.”"}, {"type": "practice", "prompt": "Now say “the noodle” – die Nudel.", "answer": "Die Nudel. Feminine. Nudeln um die Gabel wirbeln – to twirl noodles around the.", "slow": "Die Nudel. Feminine. Nudeln um die Gabel wirbeln – to twirl noodles around the.", "grammar": "Feminine. Nudeln um die Gabel wirbeln – to twirl noodles around the fork."}, {"type": "practice", "prompt": "Now say “to taste” – schmecken. Ich aß ohne zu schmecken – I ate without tasting.", "answer": "--Matei's hand was on the table. I put mine on top of his.", "slow": "--Matei's hand was on the table. I put mine on top of his.", "grammar": "I put mine on top of his. Ada watched our hands. Then she looked at me. “You kissed me once,” she said. The table went quiet. “I was eight,” I said. “You were eight. I was nine. I thought about that kiss for years.” She set her fork down. “I thought you liked me.” “I did like you.” “Not the way I liked you.”"}, {"type": "practice", "prompt": "Now say “to kiss” – küssen. Review.", "answer": "Küssen. Du hast mich einmal geküsst – you kissed me once.", "slow": "Küssen. Du hast mich einmal geküsst – you kissed me once.", "grammar": "Du hast mich einmal geküsst – you kissed me once."}, {"type": "practice", "prompt": "Now say “to think about” – nachdenken über. Review.", "answer": "Nachdenken über. Ich habe jahrelang über diesen Kuss nachgedacht – I thought about.", "slow": "Nachdenken über. Ich habe jahrelang über diesen Kuss nachgedacht – I thought about.", "grammar": "Ich habe jahrelang über diesen Kuss nachgedacht – I thought about that kiss for years."}, {"type": "narration", "text": "--I did not know what to say. Matei's hand turned over. His fingers laced through mine."}, {"type": "dialogue", "text": "“Ada,” I said. “I did not know who I was back then. I barely know now.”"}, {"type": "dialogue", "text": "“So you kissed me to figure it out?”"}, {"type": "dialogue", "text": "“I kissed you because I was trying to be someone I was not.”"}, {"type": "narration", "text": "She was quiet for a long moment. The restaurant was loud around us – people laughing, glasses clinking, a waitress shouting orders in rapid German."}, {"type": "dialogue", "text": "“I am not angry,” she said finally. “I was. For a long time. When you stopped"}, {"type": "narration", "text": "talking to me, I thought I had done something wrong.”"}, {"type": "practice", "prompt": "Now say “to figure out” – herausfinden. Review.", "answer": "Herausfinden. Um herauszufinden, wer ich bin – to figure out who I am.", "slow": "Herausfinden. Um herauszufinden, wer ich bin – to figure out who I am.", "grammar": "Um herauszufinden, wer ich bin – to figure out who I am."}, {"type": "practice", "prompt": "Now say “angry” – wütend.", "answer": "Wütend. Ich war wütend – I was angry.", "slow": "Wütend. Ich war wütend – I was angry.", "grammar": "Ich war wütend – I was angry."}, {"type": "dialogue", "text": "--“I did not hate you,” I said."}, {"type": "dialogue", "text": "“I know that now.” She looked at Matei. “You are lucky. He is handsome.”"}, {"type": "narration", "text": "Matei almost smiled. Almost."}, {"type": "dialogue", "text": "“I know,” he said."}, {"type": "dialogue", "text": "“Take care of him. He runs.”"}, {"type": "dialogue", "text": "“I have noticed.”"}, {"type": "narration", "text": "She laughed. It was the same laugh from twelve years ago, the one that used to make me feel safe."}, {"type": "dialogue", "text": "“Okay,” she said. “Okay. We are good.”"}, {"type": "dialogue", "text": "“We are good?”"}, {"type": "dialogue", "text": "“We are good.” She picked up her fork. “Now eat. You are too skinny. Berlin is not"}, {"type": "practice", "prompt": "Now say “handsome” – gutaussehend.", "answer": "Gutaussehend. Er ist gutaussehend – he is handsome.", "slow": "Gutaussehend. Er ist gutaussehend – he is handsome.", "grammar": "Er ist gutaussehend – he is handsome."}, {"type": "practice", "prompt": "Now say “skinny” – dünn.", "answer": "Dünn. Du bist zu dünn – you are too skinny.", "slow": "Dünn. Du bist zu dünn – you are too skinny.", "grammar": "Du bist zu dünn – you are too skinny."}, {"type": "narration", "text": "--I ate. The food was better now. Less spicy. Or maybe I was just breathing. After dinner, we walked Ada to the U-Bahn station. She hugged me again. Held on."}, {"type": "dialogue", "text": "“I am glad you found someone,” she whispered."}, {"type": "dialogue", "text": "“I am glad you found Berlin.”"}, {"type": "dialogue", "text": "“I am not going anywhere.” She pulled back. Looked at Matei. “You too. Do not let"}, {"type": "dialogue", "text": "“I will not.”"}, {"type": "narration", "text": "She waved. Walked down the stairs. Disappeared into the station."}, {"type": "practice", "prompt": "Now say “the station” – der Bahnhof (for trains) or die U-Bahn-Station.", "answer": "Die U-Bahn-Station. Feminine. Zur U-Bahn-Station gehen – to walk to the station.", "slow": "Die U-Bahn-Station. Feminine. Zur U-Bahn-Station gehen – to walk to the station.", "grammar": "Feminine. Zur U-Bahn-Station gehen – to walk to the station."}, {"type": "practice", "prompt": "Now say “to whisper” – flüstern.", "answer": "Flüstern. Sie flüsterte – she whispered.", "slow": "Flüstern. Sie flüsterte – she whispered.", "grammar": "Sie flüsterte – she whispered."}, {"type": "narration", "text": "--Matei put his arm around my shoulders."}, {"type": "dialogue", "text": "“That was not so bad,” he said."}, {"type": "dialogue", "text": "“I thought she was going to cry.”"}, {"type": "dialogue", "text": "“She almost did.”"}, {"type": "dialogue", "text": "“So did I.”"}, {"type": "narration", "text": "He kissed my temple. “You did good.” We walked home through the dark streets. The streetlights cast orange light on the pavement. My hand was in his."}, {"type": "practice", "prompt": "Now say “the temple” – die Schläfe.", "answer": "Die Schläfe. Feminine. Er küsste mich auf die Schläfe – he kissed my temple.", "slow": "Die Schläfe. Feminine. Er küsste mich auf die Schläfe – he kissed my temple.", "grammar": "Feminine. Er küsste mich auf die Schläfe – he kissed my temple."}, {"type": "practice", "prompt": "Now say “the pavement” – der Bürgersteig or der Gehweg.", "answer": "Der Bürgersteig. Masculine. Der Bürgersteig – the pavement.", "slow": "Der Bürgersteig. Masculine. Der Bürgersteig – the pavement.", "grammar": "Masculine. Der Bürgersteig – the pavement."}, {"type": "dialogue", "text": "--“Matei.”"}, {"type": "dialogue", "text": "“What?”"}, {"type": "dialogue", "text": "“Thank you for coming.”"}, {"type": "dialogue", "text": "“Where else would I be?”"}, {"type": "dialogue", "text": "“I do not know. Somewhere else. Angry.”"}, {"type": "dialogue", "text": "“I am still angry,” he said. “A little. About the roommate thing.”"}, {"type": "dialogue", "text": "“I know.”"}, {"type": "dialogue", "text": "“But I am not going to leave over it.”"}, {"type": "dialogue", "text": "“That is good. Because I do not know how to do this without you.”"}, {"type": "narration", "text": "He squeezed my hand. “You are learning.”"}, {"type": "practice", "prompt": "Now say “to squeeze” – drücken.", "answer": "Drücken. Er drückte meine Hand – he squeezed my hand.", "slow": "Drücken. Er drückte meine Hand – he squeezed my hand.", "grammar": "Er drückte meine Hand – he squeezed my hand."}, {"type": "practice", "prompt": "Now say “to learn” – lernen. Du lernst – you are learning.", "answer": "--Dual-layer vocabulary review – Chapter 13.", "slow": "--Dual-layer vocabulary review – Chapter 13.", "grammar": "--Dual-layer vocabulary review – Chapter 13 Layer 1 – Words Die Speisekarte – the menu.  Die Speisekarte. Die Speisekarte war auf Deutsch. Gelegt / gehängt – draped.  Gelegt. Ihr roter Mantel hing über der Stuhllehne. Der Freund – the boyfriend.  Der Freund. Das ist mein Freund. Fremd – foreign.  Fremd. Es fühlte sich fremd an. Scharf – spicy.  Scharf. Scharfes Essen. Das Weinglas – the wine glass.  Das Weinglas. Sie nahm ihr Weinglas. Die Nudel – the noodle.  Die Nudel. Nudeln um die Gabel wirbeln. Schmecken – to taste.  Schmecken. Ich aß ohne zu schmecken. Wütend – angry.  Wütend. Ich war wü"}, {"type": "narration", "text": "Gutaussehend – handsome. Gutaussehend. Er ist gutaussehend. Dünn – skinny. Dünn. Du bist zu dünn. Die U-Bahn-Station – the subway station. Die U-Bahn-Station. Zur U-Bahn-Station gehen. Flüstern – to whisper. Flüstern. Sie flüsterte. Die Schläfe – the temple (on head). Die Schläfe. Er küsste mich auf die Schläfe. Der Bürgersteig – the pavement. Der Bürgersteig. Drücken – to squeeze. Drücken. Er drückte meine Hand."}], "bg": "restaurant", "location": "Neukölln Restaurant"}, {"id": 14, "title": "The Ex", "level": "B1", "segments": [{"type": "narration", "text": "bell chime.) Things were fine for exactly one week. Then the ex showed up. I was closing the café. Wiping down the counter. Counting the register. The usual routine. Frau Schmidt had come by earlier that morning – her first day back, just for two hours, just to sit at the table and drink coffee and tell customers she was fine. She was not fine. Her left hand shook when she held the cup. But she was here. That was something. The bell above the door chimed."}, {"type": "dialogue", "text": "“We are closed,” I said without turning around."}, {"type": "dialogue", "text": "“Then why is the door open?”"}, {"type": "practice", "prompt": "Now say “the ex” – der Ex.", "answer": "Der Ex. Der Ex-Freund – the ex-boyfriend.", "slow": "Der Ex. Der Ex-Freund – the ex-boyfriend.", "grammar": "Der Ex-Freund – the ex-boyfriend."}, {"type": "practice", "prompt": "Now say “to shake” – zittern. Review. Ihre linke Hand zitterte – her left hand", "answer": "shook.", "slow": "shook.", "grammar": "Repeat aloud: shook."}, {"type": "narration", "text": "--I turned. A man was standing in the doorway. Tall. Blonde. Expensive coat. The kind of smile that said he knew he was handsome and had been told so many times."}, {"type": "dialogue", "text": "“I am looking for Matei,” he said."}, {"type": "dialogue", "text": "“He is not here.”"}, {"type": "dialogue", "text": "“I know. His apartment is empty. I tried there first.”"}, {"type": "narration", "text": "I stopped wiping the counter."}, {"type": "dialogue", "text": "“Who are you?”"}, {"type": "narration", "text": "He walked inside. Looked around the café like he was appraising it. His eyes landed on the blue notebook, the espresso machine, the heart carved into the table."}, {"type": "dialogue", "text": "“I am Sebastian,” he said. “Matei's ex.”"}, {"type": "practice", "prompt": "Now say “blonde” – blond.", "answer": "Blond. Ein blonder Mann – a blonde man.", "slow": "Blond. Ein blonder Mann – a blonde man.", "grammar": "Ein blonder Mann – a blonde man."}, {"type": "practice", "prompt": "Now say “expensive” – teuer.", "answer": "Teuer. Ein teurer Mantel – an expensive coat.", "slow": "Teuer. Ein teurer Mantel – an expensive coat.", "grammar": "Ein teurer Mantel – an expensive coat."}, {"type": "narration", "text": "--The words hit like cold water."}, {"type": "dialogue", "text": "“Sebastian,” I repeated."}, {"type": "dialogue", "text": "“You must be Yves.” He smiled. “Matei mentioned you. The Nigerian boy who does not"}, {"type": "dialogue", "text": "“I speak German.”"}, {"type": "dialogue", "text": "“Sure you do.”"}, {"type": "narration", "text": "He walked to the counter. Leaned on it. Close enough that I could smell his cologne – expensive, too strong."}, {"type": "dialogue", "text": "“What do you want?”"}, {"type": "dialogue", "text": "“To talk to Matei. I have been trying to reach him for weeks. He will not answer"}, {"type": "practice", "prompt": "Now say “the cologne” – das Kölnisch Wasser or das Parfüm. Sein Parfüm war zu", "answer": "stark – his cologne was too strong.", "slow": "stark – his cologne was too strong.", "grammar": "Repeat aloud: stark – his cologne was too strong."}, {"type": "narration", "text": "Das Parfüm. Neuter. Sein Parfüm war zu stark – his cologne was too strong."}, {"type": "practice", "prompt": "Now say “to reach” – erreichen. Ich versuche, ihn zu erreichen – I am trying to", "answer": "reach him.", "slow": "reach him.", "grammar": "Repeat aloud: reach him."}, {"type": "dialogue", "text": "--“Maybe there is a reason for that.”"}, {"type": "narration", "text": "His smile did not waver. “Maybe. Or maybe he is just being dramatic. He was always dramatic.” I did not know what to say. My hands were shaking. I put them behind my back."}, {"type": "dialogue", "text": "“Tell him I stopped by,” Sebastian said. He pulled a card out of his pocket – a"}, {"type": "narration", "text": "business card, white with black text – and set it on the counter. “He knows where to find me.” He walked to the door. Stopped. Turned."}, {"type": "dialogue", "text": "“You are different than I expected,” he said."}, {"type": "dialogue", "text": "“What did you expect?”"}, {"type": "dialogue", "text": "“Someone prettier.”"}, {"type": "narration", "text": "He left. The bell chimed. The door closed."}, {"type": "practice", "prompt": "Now say “dramatic” – dramatisch.", "answer": "Dramatisch. Er war immer dramatisch – he was always dramatic.", "slow": "Dramatisch. Er war immer dramatisch – he was always dramatic.", "grammar": "Er war immer dramatisch – he was always dramatic."}, {"type": "practice", "prompt": "Now say “the business card” – die Visitenkarte.", "answer": "Die Visitenkarte. Feminine. Eine Visitenkarte – a business card.", "slow": "Die Visitenkarte. Feminine. Eine Visitenkarte – a business card.", "grammar": "Feminine. Eine Visitenkarte – a business card."}, {"type": "narration", "text": "--I stood there for a long time, staring at the business card. Sebastian Bauer. Architect. I picked it up. Turned it over. Nothing on the back. My phone buzzed. Matei: Where are you? I did not answer."}, {"type": "practice", "prompt": "Now say “the architect” – der Architekt.", "answer": "Der Architekt. Masculine. Sebastian Bauer, Architekt – Sebastian Bauer, architect.", "slow": "Der Architekt. Masculine. Sebastian Bauer, Architekt – Sebastian Bauer, architect.", "grammar": "Masculine. Sebastian Bauer, Architekt – Sebastian Bauer, architect."}, {"type": "practice", "prompt": "Now say “to turn over” – umdrehen. Ich drehte die Karte um – I turned the card", "answer": "over.", "slow": "over.", "grammar": "Repeat aloud: over."}, {"type": "narration", "text": "--I walked home slowly. The streets were dark. The duck was not at the bridge. The bakery downstairs was closed. The stairs were thirty-seven steps. The key stuck. Matei was on the sofa. His laptop was open. He was typing something."}, {"type": "dialogue", "text": "“You are late,” he said without looking up."}, {"type": "dialogue", "text": "“A customer came in after close.”"}, {"type": "dialogue", "text": "“I thought you locked the door.”"}, {"type": "dialogue", "text": "“I forgot.”"}, {"type": "narration", "text": "He looked up. His grey eyes narrowed."}, {"type": "dialogue", "text": "“You never forget to lock the door.”"}, {"type": "dialogue", "text": "“I did today.”"}, {"type": "practice", "prompt": "Now say “to narrow” – verengen or zusammenziehen. Seine Augen verengten sich – his", "answer": "eyes narrowed.", "slow": "eyes narrowed.", "grammar": "Repeat aloud: eyes narrowed."}, {"type": "narration", "text": "Verengen. Seine Augen verengten sich – his eyes narrowed."}, {"type": "practice", "prompt": "Now say “to forget” – vergessen. Review. Du vergisst nie abzuschließen – you never", "answer": "forget to lock.", "slow": "forget to lock.", "grammar": "Repeat aloud: forget to lock."}, {"type": "narration", "text": "--He closed the laptop. Stood up."}, {"type": "dialogue", "text": "“What is wrong?”"}, {"type": "dialogue", "text": "“Nothing.”"}, {"type": "dialogue", "text": "“You are lying.”"}, {"type": "dialogue", "text": "“I am not.”"}, {"type": "narration", "text": "He walked to me. Put his hand on my face. His thumb traced my cheekbone."}, {"type": "dialogue", "text": "“Yves. Tell me.”"}, {"type": "narration", "text": "I pulled away. Walked to the window. Stared out at the dark street."}, {"type": "dialogue", "text": "“Sebastian came to the café,” I said."}, {"type": "practice", "prompt": "Now say “the cheekbone” – das Wangenknochen.", "answer": "Das Wangenknochen. Neuter. Er berührte mein Wangenknochen – he touched my.", "slow": "Das Wangenknochen. Neuter. Er berührte mein Wangenknochen – he touched my.", "grammar": "Neuter. Er berührte mein Wangenknochen – he touched my cheekbone."}, {"type": "practice", "prompt": "Now say “to pull away” – wegziehen. Review.", "answer": "Wegziehen. Ich zog mich weg – I pulled away.", "slow": "Wegziehen. Ich zog mich weg – I pulled away.", "grammar": "Ich zog mich weg – I pulled away."}, {"type": "narration", "text": "--The room went silent."}, {"type": "dialogue", "text": "“What did he want?”"}, {"type": "dialogue", "text": "“To talk to you. He said you have been ignoring him.”"}, {"type": "narration", "text": "Matei did not speak for a long moment. When he did, his voice was low."}, {"type": "dialogue", "text": "“I told you about him.”"}, {"type": "dialogue", "text": "“You said he left. You did not say he was blonde and handsome and drove a car that"}, {"type": "narration", "text": "costs more than this building.”"}, {"type": "dialogue", "text": "“He is not handsome.”"}, {"type": "dialogue", "text": "“He is. You know he is.”"}, {"type": "practice", "prompt": "Now say “to ignore” – ignorieren.", "answer": "Ignorieren. Du hast ihn ignoriert – you have been ignoring him.", "slow": "Ignorieren. Du hast ihn ignoriert – you have been ignoring him.", "grammar": "Du hast ihn ignoriert – you have been ignoring him."}, {"type": "practice", "prompt": "Now say “the building” – das Gebäude.", "answer": "Das Gebäude. Neuter. Dieses Gebäude – this building.", "slow": "Das Gebäude. Neuter. Dieses Gebäude – this building.", "grammar": "Neuter. Dieses Gebäude – this building."}, {"type": "narration", "text": "--Matei walked to me. Stopped behind me. Did not touch."}, {"type": "dialogue", "text": "“I do not care what he looks like,” he said. “He left. He wrote me a note and"}, {"type": "narration", "text": "left. I have not spoken to him since.”"}, {"type": "dialogue", "text": "“He wants to talk to you.”"}, {"type": "dialogue", "text": "“I do not want to talk to him.”"}, {"type": "dialogue", "text": "“He said you were dramatic.”"}, {"type": "dialogue", "text": "“Sebastian thinks anyone who has feelings is dramatic.”"}, {"type": "narration", "text": "I turned. His face was close to mine."}, {"type": "practice", "prompt": "Now say “feelings” – die Gefühle (plural).", "answer": "Die Gefühle. Plural. Jeder, der Gefühle hat – anyone who has feelings.", "slow": "Die Gefühle. Plural. Jeder, der Gefühle hat – anyone who has feelings.", "grammar": "Plural. Jeder, der Gefühle hat – anyone who has feelings."}, {"type": "practice", "prompt": "Now say “close” – nah. Sein Gesicht war nah an meinem – his face was close to", "answer": "mine.", "slow": "mine.", "grammar": "Repeat aloud: mine."}, {"type": "dialogue", "text": "--“Matei.”"}, {"type": "dialogue", "text": "“What?”"}, {"type": "dialogue", "text": "“Are you going to see him?”"}, {"type": "dialogue", "text": "“No.”"}, {"type": "dialogue", "text": "“Are you sure?”"}, {"type": "narration", "text": "He put his hands on my shoulders. Squeezed."}, {"type": "dialogue", "text": "“I am sure. I chose you. I keep choosing you. That is not going to change because"}, {"type": "narration", "text": "Sebastian showed up with his expensive coat and his architect business card.”"}, {"type": "dialogue", "text": "“How did you know about the card?”"}, {"type": "dialogue", "text": "“Because he always leaves cards. He thinks it makes him memorable.”"}, {"type": "dialogue", "text": "“It does.”"}, {"type": "dialogue", "text": "“It makes him predictable.”"}, {"type": "practice", "prompt": "Now say “predictable” – vorhersehbar.", "answer": "Vorhersehbar. Es macht ihn vorhersehbar – it makes him predictable.", "slow": "Vorhersehbar. Es macht ihn vorhersehbar – it makes him predictable.", "grammar": "Es macht ihn vorhersehbar – it makes him predictable."}, {"type": "practice", "prompt": "Now say “memorable” – einprägsam.", "answer": "Einprägsam. Er denkt, es macht ihn einprägsam – he thinks it makes him memorable.", "slow": "Einprägsam. Er denkt, es macht ihn einprägsam – he thinks it makes him memorable.", "grammar": "Er denkt, es macht ihn einprägsam – he thinks it makes him memorable."}, {"type": "narration", "text": "--Matei kissed my forehead."}, {"type": "dialogue", "text": "“I am not going anywhere, Yves.”"}, {"type": "dialogue", "text": "“You keep saying that.”"}, {"type": "dialogue", "text": "“Because you keep needing to hear it.”"}, {"type": "narration", "text": "I leaned into him. His arms went around me."}, {"type": "dialogue", "text": "“I am scared,” I said."}, {"type": "dialogue", "text": "“I know.”"}, {"type": "dialogue", "text": "“I am scared that one day you will wake up and realise I am not worth the"}, {"type": "narration", "text": "trouble.” He pulled back. Looked at me."}, {"type": "practice", "prompt": "Now say “the trouble” – der Ärger or die Mühe.", "answer": "Die Mühe. Feminine. Die Mühe wert sein – to be worth the trouble.", "slow": "Die Mühe. Feminine. Die Mühe wert sein – to be worth the trouble.", "grammar": "Feminine. Die Mühe wert sein – to be worth the trouble."}, {"type": "practice", "prompt": "Now say “to realise” – merken or erkennen.", "answer": "Merken. Du wirst merken, dass ich die Mühe nicht wert bin – you will realise I am.", "slow": "Merken. Du wirst merken, dass ich die Mühe nicht wert bin – you will realise I am.", "grammar": "Du wirst merken, dass ich die Mühe nicht wert bin – you will realise I am not worth the trouble."}, {"type": "dialogue", "text": "--“You are worth every trouble. And more.” He paused. “But you need to stop waiting"}, {"type": "narration", "text": "for me to leave. I am not Sebastian. I am not your grandmother. I am not anyone who has ever left you. I am Matei. I make coffee and forget to buy groceries and remember everything you have ever told me. And I am staying.”"}, {"type": "dialogue", "text": "“Promise?”"}, {"type": "dialogue", "text": "“I do not make promises.”"}, {"type": "dialogue", "text": "“Then what do you make?”"}, {"type": "narration", "text": "He kissed me. Hard. Brief."}, {"type": "dialogue", "text": "“Dinner,” he said. “I bought pasta.”"}, {"type": "practice", "prompt": "Now say “the promise” – das Versprechen.", "answer": "Das Versprechen. Neuter. Ich mache keine Versprechen – I do not make promises.", "slow": "Das Versprechen. Neuter. Ich mache keine Versprechen – I do not make promises.", "grammar": "Neuter. Ich mache keine Versprechen – I do not make promises."}, {"type": "practice", "prompt": "Now say “to buy” – kaufen. Ich habe Nudeln gekauft – I bought pasta.", "answer": "--We made dinner together. The same pasta. My grandmother's recipe. He chopped the.", "slow": "--We made dinner together. The same pasta. My grandmother's recipe. He chopped the.", "grammar": "The same pasta. My grandmother's recipe. He chopped the onions. I cried. Not from the onions. Afterwards, we sat on the sofa. The lamp was on. The radiator clicked. “Matei.” “What?”"}, {"type": "dialogue", "text": "“What are you going to do about Sebastian?”"}, {"type": "dialogue", "text": "“Nothing.”"}, {"type": "dialogue", "text": "“He is going to come back.”"}, {"type": "dialogue", "text": "“Then I will tell him to leave.”"}, {"type": "dialogue", "text": "“What if he does not?”"}, {"type": "narration", "text": "Matei turned to look at me."}, {"type": "dialogue", "text": "“Then you tell him to leave. In your bad German.”"}, {"type": "practice", "prompt": "Now say “to click” – klicken. Der Heizkörper klickte – the radiator clicked.", "answer": "Klicken. Der Heizkörper klickte – the radiator clicked.", "slow": "Klicken. Der Heizkörper klickte – the radiator clicked.", "grammar": "Der Heizkörper klickte – the radiator clicked."}, {"type": "practice", "prompt": "Now say “bad German” – schlechtes Deutsch.", "answer": "Schlechtes Deutsch. Auf deinem schlechten Deutsch – in your bad German.", "slow": "Schlechtes Deutsch. Auf deinem schlechten Deutsch – in your bad German.", "grammar": "Auf deinem schlechten Deutsch – in your bad German."}, {"type": "dialogue", "text": "--“My German is not bad.”"}, {"type": "dialogue", "text": "“It is improving.”"}, {"type": "narration", "text": "I laughed. He almost smiled."}, {"type": "dialogue", "text": "“I am serious,” I said."}, {"type": "dialogue", "text": "“So am I. Sebastian is not a problem. He is a memory. And memories do not get to"}, {"type": "narration", "text": "decide who I am now.” I leaned my head on his shoulder."}, {"type": "dialogue", "text": "“I wish I believed that.”"}, {"type": "dialogue", "text": "“You will. Give it time.”"}, {"type": "narration", "text": "We sat like that until the lamp flickered and the street went quiet."}, {"type": "practice", "prompt": "Now say “the memory” – die Erinnerung.", "answer": "Die Erinnerung. Feminine. Eine Erinnerung – a memory.", "slow": "Die Erinnerung. Feminine. Eine Erinnerung – a memory.", "grammar": "Feminine. Eine Erinnerung – a memory."}, {"type": "practice", "prompt": "Now say “to decide” – entscheiden. Erinnerungen entscheiden nicht – memories do", "answer": "not decide.", "slow": "not decide.", "grammar": "Repeat aloud: not decide."}, {"type": "narration", "text": "--My phone buzzed. Ada. How is the boyfriend? I typed back: Good. How is Berlin? Cold. But I am learning to like it. Same. Good night, Lucky. Good night, Ada. I put the phone away. Matei's arm was around me."}, {"type": "dialogue", "text": "“Who was that?”"}, {"type": "dialogue", "text": "“Ada.”"}, {"type": "dialogue", "text": "“What did she want?”"}, {"type": "dialogue", "text": "“To check on me.”"}, {"type": "dialogue", "text": "“She does that a lot.”"}, {"type": "dialogue", "text": "“She is worried.”"}, {"type": "dialogue", "text": "“About what?”"}, {"type": "narration", "text": "I thought about it. About Sebastian. About the café. About the key in my pocket."}, {"type": "dialogue", "text": "“About me running,” I said."}, {"type": "narration", "text": "Matei's arm tightened."}, {"type": "dialogue", "text": "“Are you?”"}, {"type": "dialogue", "text": "“No,” I said. “Not tonight.”"}, {"type": "dialogue", "text": "“Good.”"}, {"type": "practice", "prompt": "Now say “to tighten” – festziehen or fester drücken.", "answer": "Festziehen. Sein Arm zog sich fester um mich – his arm tightened around me.", "slow": "Festziehen. Sein Arm zog sich fester um mich – his arm tightened around me.", "grammar": "Sein Arm zog sich fester um mich – his arm tightened around me."}, {"type": "practice", "prompt": "Now say “the hair” – das Haar or die Haare. Er küsste mein Haar – he kissed my", "answer": "hair.", "slow": "hair.", "grammar": "Repeat aloud: hair."}], "bg": "café", "location": "Morgenlicht — After Hours"}, {"id": 15, "title": "The Architect", "level": "B1-B2", "segments": [{"type": "narration", "text": "machine, bell chime.) Sebastian came back three days later. I saw him through the café window. Same expensive coat. Same blonde hair. Same smile that did not reach his eyes. He was standing across the street, looking at the green awning like he was calculating its square footage. I ducked behind the espresso machine."}, {"type": "dialogue", "text": "“Yves?” Frau Schmidt was sitting at the table, her good hand wrapped around a cup"}, {"type": "narration", "text": "of tea. “What is wrong?”"}, {"type": "dialogue", "text": "“Nothing.”"}, {"type": "dialogue", "text": "“You are hiding.”"}, {"type": "dialogue", "text": "“I am crouching. There is a difference.”"}, {"type": "practice", "prompt": "Now say “to calculate” – berechnen.", "answer": "Berechnen. Er berechnete die Quadratmeterzahl – he was calculating the square.", "slow": "Berechnen. Er berechnete die Quadratmeterzahl – he was calculating the square.", "grammar": "Er berechnete die Quadratmeterzahl – he was calculating the square footage."}, {"type": "practice", "prompt": "Now say “to duck” – sich ducken.", "answer": "Sich ducken. Ich duckte mich hinter die Maschine – I ducked behind the machine.", "slow": "Sich ducken. Ich duckte mich hinter die Maschine – I ducked behind the machine.", "grammar": "Ich duckte mich hinter die Maschine – I ducked behind the machine."}, {"type": "narration", "text": "--She craned her neck. Looked out the window. “Ah. The blonde one.”"}, {"type": "dialogue", "text": "“You know him?”"}, {"type": "dialogue", "text": "“He came by yesterday. Asked for Matei. I told him Matei does not work here.” She"}, {"type": "narration", "text": "took a sip of tea. “He did not believe me.”"}, {"type": "dialogue", "text": "“He is Matei's ex.”"}, {"type": "dialogue", "text": "“I know.” She set her cup down. “Matei told me. Years ago. When it happened.”"}, {"type": "dialogue", "text": "“What did he tell you?”"}, {"type": "narration", "text": "She was quiet for a moment. “That he came home one day and the apartment was empty. No furniture. No books. No note. Just a key on the table.” She looked at me. “The same key he gave you.”"}, {"type": "practice", "prompt": "Now say “to crane one's neck” – den Hals recken.", "answer": "Den Hals recken. Sie reckte den Hals – she craned her neck.", "slow": "Den Hals recken. Sie reckte den Hals – she craned her neck.", "grammar": "Sie reckte den Hals – she craned her neck."}, {"type": "practice", "prompt": "Now say “the furniture” – die Möbel (plural).", "answer": "Die Möbel. Plural. Keine Möbel – no furniture.", "slow": "Die Möbel. Plural. Keine Möbel – no furniture.", "grammar": "Plural. Keine Möbel – no furniture."}, {"type": "dialogue", "text": "“He left without saying goodbye,” I said."}, {"type": "dialogue", "text": "“Yes.”"}, {"type": "dialogue", "text": "“And now he is back.”"}, {"type": "dialogue", "text": "“Now he is back.” She patted the table. “Sit. You are making me nervous.”"}, {"type": "narration", "text": "I sat. The chair was cold. The café was empty."}, {"type": "dialogue", "text": "“What do I do?” I asked."}, {"type": "dialogue", "text": "“You do nothing. This is not your fight.”"}, {"type": "dialogue", "text": "“He is my boyfriend. It is my fight.”"}, {"type": "dialogue", "text": "“No.” Frau Schmidt's voice was firm. “This is Matei's past. He must handle it. You"}, {"type": "narration", "text": "can support him. You cannot fight for him.”"}, {"type": "practice", "prompt": "Now say “sick” – krank or übel. Mir war übel – I felt sick.", "answer": "Übel. Mir war übel – I felt sick.", "slow": "Übel. Mir war übel – I felt sick.", "grammar": "Mir war übel – I felt sick."}, {"type": "practice", "prompt": "Now say “firm” – fest or bestimmt.", "answer": "Bestimmt. Ihre Stimme war bestimmt – her voice was firm.", "slow": "Bestimmt. Ihre Stimme war bestimmt – her voice was firm.", "grammar": "Ihre Stimme war bestimmt – her voice was firm."}, {"type": "narration", "text": "--I wanted to argue. But she was right."}, {"type": "dialogue", "text": "“He is outside,” I said."}, {"type": "dialogue", "text": "“I know.”"}, {"type": "dialogue", "text": "“He is going to come in.”"}, {"type": "dialogue", "text": "“Probably.”"}, {"type": "dialogue", "text": "“What do I say?”"}, {"type": "narration", "text": "She smiled. “Say 'Guten Morgen. Was möchten Sie?' And then make him pay for his coffee. Expensive coffee. The most expensive coffee we have.” I laughed. I could not help it."}, {"type": "dialogue", "text": "“You are evil,” I said."}, {"type": "dialogue", "text": "“I am practical.” She patted my hand. “Now stand up. He is crossing the street.”"}, {"type": "practice", "prompt": "Now say “evil” – böse.", "answer": "Böse. Du bist böse – you are evil.", "slow": "Böse. Du bist böse – you are evil.", "grammar": "Du bist böse – you are evil."}, {"type": "practice", "prompt": "Now say “practical” – praktisch.", "answer": "Praktisch. Ich bin praktisch – I am practical.", "slow": "Praktisch. Ich bin praktisch – I am practical.", "grammar": "Ich bin praktisch – I am practical."}, {"type": "narration", "text": "--The bell chimed. Sebastian walked in. He was even taller up close. His coat was dark grey, not black. His shoes were leather. His smile was the same."}, {"type": "dialogue", "text": "“Guten Morgen,” he said."}, {"type": "dialogue", "text": "“Guten Morgen,” I said. “Was möchten Sie?”"}, {"type": "narration", "text": "He raised an eyebrow. “You speak German.”"}, {"type": "dialogue", "text": "“A little.”"}, {"type": "dialogue", "text": "“Matei said you did not.”"}, {"type": "dialogue", "text": "“Matei says a lot of things.”"}, {"type": "narration", "text": "He laughed. It was a nice laugh. I hated that it was nice."}, {"type": "practice", "prompt": "Now say “the shoe” – der Schuh.", "answer": "Der Schuh. Masculine. Lederschuhe – leather shoes.", "slow": "Der Schuh. Masculine. Lederschuhe – leather shoes.", "grammar": "Masculine. Lederschuhe – leather shoes."}, {"type": "practice", "prompt": "Now say “the eyebrow” – die Augenbraue.", "answer": "Die Augenbraue. Feminine. Eine Augenbraue hochziehen – to raise an eyebrow.", "slow": "Die Augenbraue. Feminine. Eine Augenbraue hochziehen – to raise an eyebrow.", "grammar": "Feminine. Eine Augenbraue hochziehen – to raise an eyebrow."}, {"type": "dialogue", "text": "--“I will have a latte,” he said. “Oat milk. Extra hot.”"}, {"type": "dialogue", "text": "“That will be four fifty.”"}, {"type": "narration", "text": "He paid. Did not blink at the price. I made his latte. My hands were steady."}, {"type": "dialogue", "text": "“You are Yves,” he said while I worked."}, {"type": "dialogue", "text": "“You knew that.”"}, {"type": "dialogue", "text": "“I wanted to hear you say it.”"}, {"type": "dialogue", "text": "“Why?”"}, {"type": "narration", "text": "He leaned on the counter. “Because I wanted to see if you sounded the way Matei described.”"}, {"type": "dialogue", "text": "“How did he describe me?”"}, {"type": "dialogue", "text": "“Different.” He smiled. “He said you were quiet. Shy. You do not seem shy.”"}, {"type": "dialogue", "text": "“I am not shy. I am selective.”"}, {"type": "practice", "prompt": "Now say “selective” – wählerisch.", "answer": "Wählerisch. Ich bin wählerisch – I am selective.", "slow": "Wählerisch. Ich bin wählerisch – I am selective.", "grammar": "Ich bin wählerisch – I am selective."}, {"type": "practice", "prompt": "Now say “to blink” – blinzeln. Er blinzelte nicht – he did not blink.", "answer": "--He laughed again. Took his latte. Did not sit. Just stood by the counter,.", "slow": "--He laughed again. Took his latte. Did not sit. Just stood by the counter,.", "grammar": "Took his latte. Did not sit. Just stood by the counter, drinking, watching me. “Is Matei coming by today?” he asked. “I do not know his schedule.” “You live with him.” “I sleep on his sofa.”"}, {"type": "narration", "text": "Sebastian's smile flickered. “Is that what you call it?” I did not answer. The espresso machine hissed."}, {"type": "dialogue", "text": "“Tell him I stopped by,” Sebastian said. He set his empty cup on the counter."}, {"type": "dialogue", "text": "“Again.”"}, {"type": "dialogue", "text": "“I will tell him.”"}, {"type": "dialogue", "text": "“No, you will not.”"}, {"type": "narration", "text": "He left. The bell chimed. The door closed."}, {"type": "practice", "prompt": "Now say “the schedule” – der Zeitplan.", "answer": "Der Zeitplan. Masculine. Sein Zeitplan – his schedule.", "slow": "Der Zeitplan. Masculine. Sein Zeitplan – his schedule.", "grammar": "Masculine. Sein Zeitplan – his schedule."}, {"type": "practice", "prompt": "Now say “to flicker” – flackern. Sein Lächeln flackerte – his smile flickered.", "answer": "--Frau Schmidt was watching me.", "slow": "--Frau Schmidt was watching me.", "grammar": "“You did good,” she said. “I want to punch him.” “That is normal. Punching is not allowed in the café. Outside is fine.” I laughed. It was shaky. “He is going to keep coming back,” I said. “Yes.” “Until Matei talks to him.” “Probably.” I pulled out my phone. Texted Matei. Sebastian was here again. Three dots appeared. Then: I know. He texted me."}, {"type": "narration", "text": "What did he say? That you make good coffee. That is it? That is it. Are you going to see him? A long pause. Then: I do not know."}, {"type": "practice", "prompt": "Now say “shaky” – zittrig.", "answer": "Zittrig. Mein Lachen war zittrig – my laugh was shaky.", "slow": "Zittrig. Mein Lachen war zittrig – my laugh was shaky.", "grammar": "Mein Lachen war zittrig – my laugh was shaky."}, {"type": "practice", "prompt": "Now say “to text” – texten. Er hat mir getextet – he texted me.", "answer": "--I put my phone away. Made another coffee for a customer who was not there. Frau.", "slow": "--I put my phone away. Made another coffee for a customer who was not there. Frau.", "grammar": "Made another coffee for a customer who was not there. Frau Schmidt watched me with her sharp grey eyes. “He will d
