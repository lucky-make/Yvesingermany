 dachte, ich sei hetero \u2013 she thought I was straight. Now say \u201cthe truth\u201d die Wahrheit. Review", "lang": "en"}], [{"text": "Die Wahrheit. Du konntest ihr nicht die Wahrheit sagen", "lang": "de"}, {"text": "\u2013 you could not tell her the truth. --He pulled his arm away. Walked to the window. Stared out at the street. \u201cI am not asking you to come out to everyone, Yves. I am asking you not to hide me.\u201d \u201cI was not hiding you.\u201d \u201cYou called me your roommate. In my own apartment. The apartment where you sleep in my bed.\u201d I did not have an answer. Because he was right. I had hid him. I had panicked. I had reverted to the person I used to be \u2013 the one who lied, who ran, who kept everyone at arm's length. \u201cI am sorry,\u201d I said. \u201cSorry does not fix it.\u201d \u201cWhat does?\u201d Now say \u201cto come out\u201d", "lang": "en"}, {"text": "sich outen", "lang": "de"}], [{"text": "Sich outen. Ich bitte dich nicht, dich vor allen zu outen \u2013 I am not asking you to come out to everyone. Now say \u201cto fix\u201d", "lang": "en"}, {"text": "reparieren or in Ordnung bringen", "lang": "de"}], [{"text": "Reparieren. Entschuldigung repariert es nicht \u2013 sorry does not fix it. --He turned. His face was tired. \u201cI do not know,\u201d he said. \u201cI will let you know when I figure it out.\u201d He walked to the back door. The one that led to the alley. \u201cWhere are you going?\u201d \u201cTo work. I have a shift.\u201d \u201cIt is 9 AM.\u201d \u201cI am late.\u201d He left. The metal door clanged shut. I stood behind the counter, alone in the caf\u00e9, with the espresso machine hissing and the bell above the door silent. Now say \u201cthe shift\u201d die Schicht. Review", "lang": "en"}], [{"text": "Die Schicht. Ich habe eine Schicht", "lang": "de"}, {"text": "\u2013 I have a shift Now say \u201cto clang\u201d", "lang": "en"}, {"text": "klirren", "lang": "de"}], [{"text": "Klirren. Die Metallt\u00fcr klirrte zu \u2013 the metal door clanged shut. --My phone buzzed. Ada: He is cute. Is he really your roommate? I did not answer. The day was long. I made coffee. Dropped two cups. Apologised to the floor. I could not focus. I kept thinking about Matei's face. The way he had said roommate. The way he had walked out. Now say \u201ccute\u201d", "lang": "en"}, {"text": "s\u00fc\u00df", "lang": "de"}], [{"text": "S\u00fc\u00df. Er ist s\u00fc\u00df \u2013 he is cute. Now say \u201cto focus\u201d", "lang": "en"}, {"text": "konzentrieren", "lang": "de"}], [{"text": "Konzentrieren. Ich konnte mich nicht konzentrieren \u2013 I could not focus. --At 2 PM, I closed the caf\u00e9 early. Locked the door. Lowered the awning. Walked home. The apartment was empty. Matei was not there. His laptop was gone. His coat was gone. The plant on the windowsill \u2013 Matei Jr. \u2013 was still there, still alive, still judging me. I sat on the sofa. Stared at the wall. My phone buzzed again. Ada: Dinner tonight? There is a place near my work. I will send you the address. I typed back: I am busy. Tomorrow, then. Maybe. You have not changed, Lucky. Still running. Now say \u201cto lower\u201d", "lang": "en"}, {"text": "senken or herunterlassen", "lang": "de"}], [{"text": "Herunterlassen. Ich lie\u00df die Markise herunter \u2013 I lowered the awning. Now say \u201cstill\u201d", "lang": "en"}, {"text": "immer noch", "lang": "de"}], [{"text": "Immer noch. Du rennst immer noch", "lang": "de"}, {"text": "\u2013 you are still running --I put the phone down. Picked it up again. Called Matei. He did not answer. I texted: I am sorry. Please come home. Three dots appeared. Then disappeared. Then nothing. At 8 PM, the door opened. Matei walked in. He looked tired. His hair was a mess. He was carrying a bag of groceries \u2013 bread, cheese, a bottle of wine. \u201cI bought food,\u201d he said. \u201cI see that.\u201d Now say \u201cthe wine\u201d", "lang": "en"}, {"text": "der Wein", "lang": "de"}], [{"text": "Der Wein. Masculine. Eine Flasche Wein", "lang": "de"}, {"text": "\u2013 a bottle of wine Now say \u201ca mess\u201d", "lang": "en"}, {"text": "ein Durcheinander", "lang": "de"}], [{"text": "Ein Durcheinander. Seine Haare waren ein Durcheinander", "lang": "de"}, {"text": "\u2013 his hair was a mess --\u201cI was going to cook. But I am tired.\u201d \u201cI can cook.\u201d He set the bag on the table. Did not look at me. \u201cMatei.\u201d \u201cWhat?\u201d \u201cI am sorry. I know I keep saying it. But I am.\u201d \u201cYou keep apologising and then you keep doing the same thing.\u201d \u201cI know.\u201d \u201cSo what is going to change?\u201d Now say \u201cto apologise\u201d sich entschuldigen. Review", "lang": "en"}], [{"text": "Sich entschuldigen. Ich entschuldige mich \u2013 I apologise. Now say \u201cto change\u201d", "lang": "en"}, {"text": "\u00e4ndern or sich ver\u00e4ndern", "lang": "de"}], [{"text": "\u00c4ndern. Was wird sich \u00e4ndern? \u2013 What is going to change? --I stood up. Walked to him. Stopped a metre away. \u201cI do not know,\u201d I said. \u201cBut I want to try. I want to be better. I want to stop hiding. I just do not know how.\u201d He finally looked at me. His grey eyes were wet. \u201cStart small,\u201d he said. \u201cTell me one thing you have never told anyone.\u201d I thought about it. My grandmother. My mother. The years of pretending. \u201cI kissed Ada because I was trying to be normal,\u201d I said. \u201cI thought if I kissed a girl, I would not want to kiss boys anymore. But I still wanted to kiss boys. And I hated myself for it.\u201d Now say \u201cnormal\u201d", "lang": "en"}, {"text": "normal", "lang": "de"}], [{"text": "Normal. Ich versuchte, normal zu sein \u2013 I was trying to be normal. Now say \u201cto hate\u201d", "lang": "en"}, {"text": "hassen", "lang": "de"}], [{"text": "Hassen. Ich hasste mich daf\u00fcr \u2013 I hated myself for it. --Matei did not speak. He just listened. \u201cI hated myself for a long time,\u201d I said. \u201cFor wanting things I was not supposed to want. For being the way I am. For not being able to fit into the life everyone planned for me.\u201d \u201cAnd now?\u201d \u201cI do not hate myself anymore. Not as much. But I am still scared. Of what people will think. Of what they will say. Of losing the people I care about.\u201d He stepped closer. His hand touched my face. \u201cYou are not going to lose me,\u201d he said. \u201cNot by telling the truth. You will lose me by hiding it.\u201d \u201cI know.\u201d \u201cSo stop hiding.\u201d Now say \u201cto lose\u201d verlieren. Review", "lang": "en"}], [{"text": "Verlieren. Du wirst mich nicht verlieren \u2013 you will not lose me. Now say \u201cto step closer\u201d", "lang": "en"}, {"text": "n\u00e4her treten", "lang": "de"}], [{"text": "N\u00e4her treten. Er trat n\u00e4her \u2013 he stepped closer. --\u201cI will tell her,\u201d I said. \u201cAda. I will tell her the truth. About you. About us.\u201d \u201cWhen?\u201d \u201cTomorrow. She wants dinner.\u201d He nodded slowly. \u201cI will come with you.\u201d \u201cYou do not have to.\u201d \u201cI know.\u201d He kissed my forehead. \u201cBut I want to.\u201d We stood there for a moment, his hand on my face, my hand on his chest. \u201cMatei.\u201d \u201cWhat?\u201d \u201cI am glad you came back.\u201d \u201cI am not going anywhere.\u201d Now say \u201cthe truth\u201d die Wahrheit. Review", "lang": "en"}], [{"text": "Die Wahrheit. Ich werde ihr die Wahrheit sagen", "lang": "de"}, {"text": "\u2013 I will tell her the truth Now say \u201cto nod\u201d", "lang": "en"}, {"text": "nicken", "lang": "de"}], [{"text": "Nicken. Er nickte langsam \u2013 he nodded slowly. --He unpacked the groceries, and I made pasta, and we ate at the table with the two mismatched chairs, and we did not talk about Ada or running or hiding. We just ate. Now say \u201cto unpack\u201d auspacken (separable)", "lang": "en"}], [{"text": "Auspacken. Er packte die Lebensmittel aus \u2013 he unpacked the groceries. Now say \u201cmismatched\u201d", "lang": "en"}, {"text": "zusammengew\u00fcrfelt or nicht zusammenpassend", "lang": "de"}], [{"text": "Nicht zusammenpassend. Die zwei nicht zusammenpassenden St\u00fchle", "lang": "de"}, {"text": "\u2013 the two mismatched chairs. --- Dual-layer vocabulary review \u2013 Chapter 12 Layer 1 \u2013 Words", "lang": "en"}, {"text": "Die Ledertasche", "lang": "de"}, {"text": "\u2013 the leather bag. <break time=\"2s\"/> Die Ledertasche. Eine Ledertasche. Knackig \u2013 crisp. <break time=\"2s\"/> Knackig. Knackige Euros.", "lang": "en"}, {"text": "Erkennen", "lang": "de"}, {"text": "\u2013 to recognise. <break time=\"2s\"/> Erkennen. Du erkennst mich nicht Vergraben \u2013 buried. <break time=\"2s\"/> Vergraben. Unter Jahren des Vergessens vergraben.", "lang": "en"}, {"text": "Die Z\u00f6pfe", "lang": "de"}, {"text": "\u2013 the braids. <break time=\"2s\"/> Die Z\u00f6pfe. Ada mit den Z\u00f6pfen Schmuggeln \u2013 to sneak. <break time=\"2s\"/> Schmuggeln. Sie schmuggelte mir Essen zu. Schick \u2013 fancy. <break time=\"2s\"/> Schick. Franz\u00f6sisch. Schick. Irgendwo anders \u2013 somewhere else. <break time=\"2s\"/> Irgendwo anders. Du wolltest immer irgendwo anders sein.", "lang": "en"}, {"text": "Der Spion", "lang": "de"}, {"text": "\u2013 the spy. <break time=\"2s\"/> Der Spion. Wie ein Spion Mit den Schultern zucken \u2013 to shrug. <break time=\"2s\"/> Mit den Schultern zucken.", "lang": "en"}, {"text": "Sie zuckte mit den Schultern. Die Gro\u00dfmutter", "lang": "de"}, {"text": "\u2013 the grandmother. <break time=\"2s\"/> Die Gro\u00dfmutter. Deine Gro\u00dfmutter. Nat\u00fcrlich \u2013 of course. <break time=\"2s\"/> Nat\u00fcrlich. Nat\u00fcrlich.", "lang": "en"}, {"text": "Der Moment", "lang": "de"}, {"text": "\u2013 the moment. <break time=\"2s\"/> Der Moment. Dies war der Moment Ehrlich \u2013 honest. <break time=\"2s\"/> Ehrlich. Ehrlich sein.", "lang": "en"}, {"text": "Der Mitbewohner", "lang": "de"}, {"text": "\u2013 the roommate. <break time=\"2s\"/> Der Mitbewohner. Mein Mitbewohner. Korrigieren \u2013 to correct. <break time=\"2s\"/> Korrigieren. Ich h\u00e4tte sie korrigieren sollen. K\u00fcmmern \u2013 to care. <break time=\"2s\"/> K\u00fcmmern. Es k\u00fcmmert mich. Sich unterhalten \u2013 to catch up (talk). <break time=\"2s\"/> Sich unterhalten. Wir sollten uns unterhalten. Richtig \u2013 properly. <break time=\"2s\"/> Richtig. Richtig unterhalten. Heterosexuell \u2013 straight. <break time=\"2s\"/> Heterosexuell. Sie dachte, ich sei hetero.", "lang": "en"}, {"text": "Die Wahrheit", "lang": "de"}, {"text": "\u2013 the truth. <break time=\"2s\"/> Die Wahrheit. Du konntest ihr nicht die Wahrheit sagen. Sich outen \u2013 to come out. <break time=\"2s\"/> Sich outen. Sich outen. Reparieren \u2013 to fix. <break time=\"2s\"/> Reparieren. Entschuldigung repariert es nicht.", "lang": "en"}, {"text": "Die Schicht", "lang": "de"}, {"text": "\u2013 the shift. <break time=\"2s\"/> Die Schicht. Ich habe eine Schicht Klirren \u2013 to clang. <break time=\"2s\"/> Klirren. Die Metallt\u00fcr klirrte zu. S\u00fc\u00df \u2013 cute. <break time=\"2s\"/> S\u00fc\u00df. Er ist s\u00fc\u00df. Konzentrieren \u2013 to focus. <break time=\"2s\"/> Konzentrieren. Ich konnte mich nicht konzentrieren. Herunterlassen \u2013 to lower. <break time=\"2s\"/> Herunterlassen. Ich lie\u00df die Markise herunter.", "lang": "en"}, {"text": "Immer noch", "lang": "de"}, {"text": "\u2013 still. <break time=\"2s\"/> Immer noch. Du rennst immer noch", "lang": "en"}, {"text": "Der Wein", "lang": "de"}, {"text": "\u2013 the wine. <break time=\"2s\"/> Der Wein. Eine Flasche Wein", "lang": "en"}, {"text": "Ein Durcheinander", "lang": "de"}, {"text": "\u2013 a mess. <break time=\"2s\"/> Ein Durcheinander. Seine Haare waren ein Durcheinander. Sich entschuldigen \u2013 to apologise. <break time=\"2s\"/> Sich entschuldigen. Ich entschuldige mich. \u00c4ndern \u2013 to change. <break time=\"2s\"/> \u00c4ndern. Was wird sich \u00e4ndern? Normal \u2013 normal. <break time=\"2s\"/> Normal. Ich versuchte, normal zu sein. Hassen \u2013 to hate. <break time=\"2s\"/> Hassen. Ich hasste mich daf\u00fcr. N\u00e4her treten \u2013 to step closer. <break time=\"2s\"/> N\u00e4her treten. Er trat n\u00e4her. Nicken \u2013 to nod. <break time=\"2s\"/> Nicken. Er nickte. Auspacken \u2013 to unpack. <break time=\"2s\"/> Auspacken. Er packte die Lebensmittel aus.", "lang": "en"}, {"text": "Nicht zusammenpassend", "lang": "de"}, {"text": "\u2013 mismatched. <break time=\"2s\"/> Nicht zusammenpassend. Die zwei nicht zusammenpassenden St\u00fchle. Layer 2 \u2013 Story phrases \"Du erkennst mich nicht.\" \u2013 You don't recognise me. <break time=\"2s\"/> Du erkennst mich nicht. \"Sie schmuggelte mir Essen zu.\" \u2013 She snuck me food. <break time=\"2s\"/> Sie schmuggelte mir Essen zu. \"Du wolltest immer irgendwo anders sein.\" \u2013 You always wanted to be somewhere else. <break time=\"2s\"/> Du wolltest immer irgendwo anders sein. \"Wir sollten uns unterhalten.\" \u2013 We should catch up. <break time=\"2s\"/> Wir sollten uns unterhalten. \"Mein Mitbewohner.\" \u2013 My roommate. <break time=\"2s\"/> Mein Mitbewohner. \"Es k\u00fcmmert mich, dass du gelogen hast.\" \u2013 I care that you lied. <break time=\"2s\"/> Es k\u00fcmmert mich, dass du gelogen hast. \"Ich hasste mich daf\u00fcr.\" \u2013 I hated myself for it. <break time=\"2s\"/> Ich hasste mich daf\u00fcr. \"Was wird sich \u00e4ndern?\" \u2013 What is going to change? <break time=\"2s\"/> Was wird sich \u00e4ndern? \"Ich werde ihr die Wahrheit sagen.\" \u2013 I will tell her the truth. <break time=\"2s\"/> Ich werde ihr die Wahrheit sagen. --End of Chapter 12. Chapters 13, 14, and 15 \u2013 Refined Audio Scripts Here are the next three chapters in the hybrid style: sensory prose, grammar woven into Yves's thoughts, active prompts, dual-layer reviews. --Chapter 13 \u2013 The Dinner (A2-B1) (Narrator voice, calm, clear. Ambient: restaurant chatter \u2013 clinking glasses, soft music, distant laughter.) Ada picked a restaurant in Neuk\u00f6lln. Something trendy with exposed brick and candles in wine bottles and a menu written in German that I could not read. She was already there when we arrived, sitting at a table by the window, her red coat draped over the back of her chair. She stood up when she saw us. Hugged me. Held on too long. \u201cYou came,\u201d she said. \u201cI said I would.\u201d \u201cYou also said you would write me when you left Nigeria.\u201d She pulled back. Smiled. \u201cYou did not.\u201d \u201cI am not good at goodbyes.\u201d \u201cYou never were.\u201d Now say \u201cthe menu\u201d", "lang": "en"}, {"text": "die Speisekarte", "lang": "de"}], [{"text": "Die Speisekarte. Feminine. Die Speisekarte war auf Deutsch", "lang": "de"}, {"text": "\u2013 the menu was in German. Now say \u201cdraped\u201d", "lang": "en"}, {"text": "gelegt or geh\u00e4ngt. Ihr roter Mantel hing \u00fcber der Stuhllehne \u2013", "lang": "de"}, {"text": "her red coat was draped over the back of the chair. --She looked at Matei. He was standing behind me, hands in his coat pockets. \u201cYou brought your roommate,\u201d she said. \u201cHe is not my roommate.\u201d Her eyebrows went up. \u201cNo?\u201d I took a breath. Matei's hand found the small of my back. A touch. A reminder. \u201cThis is Matei,\u201d I said. \u201cHe is my boyfriend.\u201d The word hung in the air. Boyfriend. I had never said it out loud before. It felt strange in my mouth. Foreign. Now say \u201cthe boyfriend\u201d", "lang": "en"}, {"text": "der Freund (same as friend \u2013 context tells you). Mein", "lang": "de"}, {"text": "Freund \u2013 my boyfriend.", "lang": "en"}], [{"text": "Der Freund. Das ist mein Freund", "lang": "de"}, {"text": "\u2013 this is my boyfriend Now say \u201cforeign\u201d", "lang": "en"}, {"text": "fremd", "lang": "de"}], [{"text": "Fremd. Es f\u00fchlte sich fremd an \u2013 it felt foreign. --Ada's expression did not change. She looked at Matei. Then at me. Then back at Matei. \u201cOkay,\u201d she said. \u201cOkay?\u201d \u201cOkay.\u201d She sat back down. Picked up her wine glass. \u201cSit. I ordered for us already. I hope you still like spicy food.\u201d I looked at Matei. He looked at me. We sat. Now say \u201cspicy\u201d", "lang": "en"}, {"text": "scharf", "lang": "de"}], [{"text": "Scharf. Scharfes Essen \u2013 spicy food. Now say \u201cthe wine glass\u201d", "lang": "en"}, {"text": "das Weinglas", "lang": "de"}], [{"text": "Das Weinglas. Neuter. Sie nahm ihr Weinglas", "lang": "de"}, {"text": "\u2013 she picked up her wine glass --The food came. It was good. Spicy, like Ada remembered. I ate without tasting. \u201cSo,\u201d Ada said, twirling noodles around her fork. \u201cBoyfriend.\u201d \u201cYes.\u201d \u201cHow long?\u201d \u201cA few weeks,\u201d I said. \u201cBut we have known each other longer.\u201d \u201cHow much longer?\u201d \u201cTwo years. Online.\u201d She nodded slowly. \u201cAnd you moved to Berlin for him?\u201d \u201cI moved because I needed to leave. He was part of it. Not all of it.\u201d Now say \u201cthe noodle\u201d", "lang": "en"}, {"text": "die Nudel", "lang": "de"}], [{"text": "Die Nudel. Feminine. Nudeln um die Gabel wirbeln", "lang": "de"}, {"text": "\u2013 to twirl noodles around the fork. Now say \u201cto taste\u201d", "lang": "en"}, {"text": "schmecken. Ich a\u00df ohne zu schmecken \u2013 I ate without tasting", "lang": "de"}, {"text": "Matei's hand was on the table. I put mine on top of his. Ada watched our hands. Then she looked at me. \u201cYou kissed me once,\u201d she said. The table went quiet. \u201cI was eight,\u201d I said. \u201cYou were eight. I was nine. I thought about that kiss for years.\u201d She set her fork down. \u201cI thought you liked me.\u201d \u201cI did like you.\u201d \u201cNot the way I liked you.\u201d Now say \u201cto kiss\u201d k\u00fcssen. Review", "lang": "en"}], [{"text": "K\u00fcssen. Du hast mich einmal gek\u00fcsst \u2013 you kissed me once. Now say \u201cto think about\u201d nachdenken \u00fcber. Review", "lang": "en"}], [{"text": "Nachdenken \u00fcber. Ich habe jahrelang \u00fcber diesen Kuss nachgedacht \u2013 I thought about that kiss for years. --I did not know what to say. Matei's hand turned over. His fingers laced through mine. \u201cAda,\u201d I said. \u201cI did not know who I was back then. I barely know now.\u201d \u201cSo you kissed me to figure it out?\u201d \u201cI kissed you because I was trying to be someone I was not.\u201d She was quiet for a long moment. The restaurant was loud around us \u2013 people laughing, glasses clinking, a waitress shouting orders in rapid German. \u201cI am not angry,\u201d she said finally. \u201cI was. For a long time. When you stopped talking to me, I thought I had done something wrong.\u201d Now say \u201cto figure out\u201d herausfinden. Review", "lang": "en"}], [{"text": "Herausfinden. Um herauszufinden, wer ich bin \u2013 to figure out who I am. Now say \u201cangry\u201d", "lang": "en"}, {"text": "w\u00fctend", "lang": "de"}], [{"text": "W\u00fctend. Ich war w\u00fctend \u2013 I was angry. --\u201cI did not hate you,\u201d I said. \u201cI know that now.\u201d She looked at Matei. \u201cYou are lucky. He is handsome.\u201d Matei almost smiled. Almost. \u201cI know,\u201d he said. \u201cTake care of him. He runs.\u201d \u201cI have noticed.\u201d She laughed. It was the same laugh from twelve years ago, the one that used to make me feel safe. \u201cOkay,\u201d she said. \u201cOkay. We are good.\u201d \u201cWe are good?\u201d \u201cWe are good.\u201d She picked up her fork. \u201cNow eat. You are too skinny. Berlin is not feeding you.\u201d Now say \u201chandsome\u201d", "lang": "en"}, {"text": "gutaussehend", "lang": "de"}], [{"text": "Gutaussehend. Er ist gutaussehend", "lang": "de"}, {"text": "\u2013 he is handsome Now say \u201cskinny\u201d", "lang": "en"}, {"text": "d\u00fcnn", "lang": "de"}], [{"text": "D\u00fcnn. Du bist zu d\u00fcnn \u2013 you are too skinny. --I ate. The food was better now. Less spicy. Or maybe I was just breathing. After dinner, we walked Ada to the U-Bahn station. She hugged me again. Held on. \u201cI am glad you found someone,\u201d she whispered. \u201cI am glad you found Berlin.\u201d \u201cI am not going anywhere.\u201d She pulled back. Looked at Matei. \u201cYou too. Do not let him run.\u201d \u201cI will not.\u201d She waved. Walked down the stairs. Disappeared into the station. Now say \u201cthe station\u201d", "lang": "en"}, {"text": "der Bahnhof (for trains) or die U-Bahn-Station", "lang": "de"}], [{"text": "Die U-Bahn-Station. Feminine. Zur U-Bahn-Station gehen \u2013 to walk to the station.", "lang": "de"}, {"text": "Now say \u201cto whisper\u201d", "lang": "en"}, {"text": "fl\u00fcstern", "lang": "de"}], [{"text": "Fl\u00fcstern. Sie fl\u00fcsterte \u2013 she whispered. --Matei put his arm around my shoulders. \u201cThat was not so bad,\u201d he said. \u201cI thought she was going to cry.\u201d \u201cShe almost did.\u201d \u201cSo did I.\u201d He kissed my temple. \u201cYou did good.\u201d We walked home through the dark streets. The streetlights cast orange light on the pavement. My hand was in his. Now say \u201cthe temple\u201d", "lang": "en"}, {"text": "die Schl\u00e4fe", "lang": "de"}], [{"text": "Die Schl\u00e4fe. Feminine. Er k\u00fcsste mich auf die Schl\u00e4fe", "lang": "de"}, {"text": "\u2013 he kissed my temple Now say \u201cthe pavement\u201d", "lang": "en"}, {"text": "der B\u00fcrgersteig or der Gehweg", "lang": "de"}], [{"text": "Der B\u00fcrgersteig. Masculine. Der B\u00fcrgersteig", "lang": "de"}, {"text": "\u2013 the pavement --\u201cMatei.\u201d \u201cWhat?\u201d \u201cThank you for coming.\u201d \u201cWhere else would I be?\u201d \u201cI do not know. Somewhere else. Angry.\u201d \u201cI am still angry,\u201d he said. \u201cA little. About the roommate thing.\u201d \u201cI know.\u201d \u201cBut I am not going to leave over it.\u201d \u201cThat is good. Because I do not know how to do this without you.\u201d He squeezed my hand. \u201cYou are learning.\u201d Now say \u201cto squeeze\u201d", "lang": "en"}, {"text": "dr\u00fccken", "lang": "de"}], [{"text": "Dr\u00fccken. Er dr\u00fcckte meine Hand \u2013 he squeezed my hand. Now say \u201cto learn\u201d", "lang": "en"}, {"text": "lernen. Du lernst \u2013 you are learning", "lang": "de"}, {"text": "Dual-layer vocabulary review \u2013 Chapter 13 Layer 1 \u2013 Words", "lang": "en"}, {"text": "Die Speisekarte", "lang": "de"}, {"text": "\u2013 the menu. <break time=\"2s\"/> Die Speisekarte. Die Speisekarte war auf Deutsch. Gelegt / geh\u00e4ngt \u2013 draped. <break time=\"2s\"/> Gelegt. Ihr roter Mantel hing \u00fcber der Stuhllehne.", "lang": "en"}, {"text": "Der Freund", "lang": "de"}, {"text": "\u2013 the boyfriend. <break time=\"2s\"/> Der Freund. Das ist mein Freund Fremd \u2013 foreign. <break time=\"2s\"/> Fremd. Es f\u00fchlte sich fremd an. Scharf \u2013 spicy. <break time=\"2s\"/> Scharf. Scharfes Essen.", "lang": "en"}, {"text": "Das Weinglas", "lang": "de"}, {"text": "\u2013 the wine glass. <break time=\"2s\"/> Das Weinglas. Sie nahm ihr Weinglas.", "lang": "en"}, {"text": "Die Nudel", "lang": "de"}, {"text": "\u2013 the noodle. <break time=\"2s\"/> Die Nudel. Nudeln um die Gabel wirbeln Schmecken \u2013 to taste. <break time=\"2s\"/> Schmecken. Ich a\u00df ohne zu schmecken. W\u00fctend \u2013 angry. <break time=\"2s\"/> W\u00fctend. Ich war w\u00fctend.", "lang": "en"}, {"text": "Gutaussehend", "lang": "de"}, {"text": "\u2013 handsome. <break time=\"2s\"/> Gutaussehend. Er ist gutaussehend D\u00fcnn \u2013 skinny. <break time=\"2s\"/> D\u00fcnn. Du bist zu d\u00fcnn.", "lang": "en"}, {"text": "Die U-Bahn-Station \u2013 the subway station. <break time=\"2s\"/> Die U-Bahn-Station.", "lang": "de"}, {"text": "Zur U-Bahn-Station gehen. Fl\u00fcstern \u2013 to whisper. <break time=\"2s\"/> Fl\u00fcstern. Sie fl\u00fcsterte.", "lang": "en"}, {"text": "Die Schl\u00e4fe", "lang": "de"}, {"text": "\u2013 the temple (on head). <break time=\"2s\"/> Die Schl\u00e4fe. Er k\u00fcsste mich auf die Schl\u00e4fe.", "lang": "en"}, {"text": "Der B\u00fcrgersteig", "lang": "de"}, {"text": "\u2013 the pavement. <break time=\"2s\"/> Der B\u00fcrgersteig Dr\u00fccken \u2013 to squeeze. <break time=\"2s\"/> Dr\u00fccken. Er dr\u00fcckte meine Hand. Layer 2 \u2013 Story phrases \"Die Speisekarte war auf Deutsch.\" \u2013 The menu was in German. <break time=\"2s\"/>", "lang": "en"}, {"text": "Die Speisekarte war auf Deutsch.", "lang": "de"}, {"text": "\"Das ist mein Freund.\" \u2013 This is my boyfriend. <break time=\"2s\"/> Das ist mein Freund. \"Scharfes Essen.\" \u2013 Spicy food. <break time=\"2s\"/> Scharfes Essen. \"Ich war w\u00fctend.\" \u2013 I was angry. <break time=\"2s\"/> Ich war w\u00fctend. \"Er ist gutaussehend.\" \u2013 He is handsome. <break time=\"2s\"/> Er ist gutaussehend. \"Du bist zu d\u00fcnn.\" \u2013 You are too skinny. <break time=\"2s\"/> Du bist zu d\u00fcnn. \"Sie fl\u00fcsterte.\" \u2013 She whispered. <break time=\"2s\"/> Sie fl\u00fcsterte. \"Er dr\u00fcckte meine Hand.\" \u2013 He squeezed my hand. <break time=\"2s\"/> Er dr\u00fcckte meine Hand. --End of Chapter 13. --Chapter 14 \u2013 The Ex (B1) (Narrator voice, calm, clear. Ambient: caf\u00e9 ambience \u2013 espresso machine hiss, soft bell chime.) Things were fine for exactly one week. Then the ex showed up. I was closing the caf\u00e9. Wiping down the counter. Counting the register. The usual routine. Frau Schmidt had come by earlier that morning \u2013 her first day back, just for two hours, just to sit at the table and drink coffee and tell customers she was fine. She was not fine. Her left hand shook when she held the cup. But she was here. That was something. The bell above the door chimed. \u201cWe are closed,\u201d I said without turning around. \u201cThen why is the door open?\u201d Now say \u201cthe ex\u201d", "lang": "en"}, {"text": "der Ex", "lang": "de"}], [{"text": "Der Ex. Der Ex-Freund \u2013 the ex-boyfriend.", "lang": "de"}, {"text": "Now say \u201cto shake\u201d zittern. Review. Ihre linke Hand zitterte \u2013 her left hand shook. --I turned. A man was standing in the doorway. Tall. Blonde. Expensive coat. The kind of smile that said he knew he was handsome and had been told so many times. \u201cI am looking for Matei,\u201d he said. \u201cHe is not here.\u201d \u201cI know. His apartment is empty. I tried there first.\u201d I stopped wiping the counter. \u201cWho are you?\u201d He walked inside. Looked around the caf\u00e9 like he was appraising it. His eyes landed on the blue notebook, the espresso machine, the heart carved into the table. \u201cI am Sebastian,\u201d he said. \u201cMatei's ex.\u201d Now say \u201cblonde\u201d", "lang": "en"}, {"text": "blond", "lang": "de"}], [{"text": "Blond. Ein blonder Mann \u2013 a blonde man. Now say \u201cexpensive\u201d", "lang": "en"}, {"text": "teuer", "lang": "de"}], [{"text": "Teuer. Ein teurer Mantel \u2013 an expensive coat. --The words hit like cold water. \u201cSebastian,\u201d I repeated. \u201cYou must be Yves.\u201d He smiled. \u201cMatei mentioned you. The Nigerian boy who does not speak German.\u201d \u201cI speak German.\u201d \u201cSure you do.\u201d He walked to the counter. Leaned on it. Close enough that I could smell his cologne \u2013 expensive, too strong. \u201cWhat do you want?\u201d \u201cTo talk to Matei. I have been trying to reach him for weeks. He will not answer my calls.\u201d Now say \u201cthe cologne\u201d", "lang": "en"}, {"text": "das K\u00f6lnisch Wasser or das Parf\u00fcm. Sein Parf\u00fcm war zu", "lang": "de"}, {"text": "stark \u2013 his cologne was too strong.", "lang": "en"}], [{"text": "Das Parf\u00fcm. Neuter. Sein Parf\u00fcm war zu stark", "lang": "de"}, {"text": "\u2013 his cologne was too strong Now say \u201cto reach\u201d", "lang": "en"}, {"text": "erreichen. Ich versuche, ihn zu erreichen \u2013 I am trying to", "lang": "de"}, {"text": "reach him. --\u201cMaybe there is a reason for that.\u201d His smile did not waver. \u201cMaybe. Or maybe he is just being dramatic. He was always dramatic.\u201d I did not know what to say. My hands were shaking. I put them behind my back. \u201cTell him I stopped by,\u201d Sebastian said. He pulled a card out of his pocket \u2013 a business card, white with black text \u2013 and set it on the counter. \u201cHe knows where to find me.\u201d He walked to the door. Stopped. Turned. \u201cYou are different than I expected,\u201d he said. \u201cWhat did you expect?\u201d \u201cSomeone prettier.\u201d He left. The bell chimed. The door closed. Now say \u201cdramatic\u201d", "lang": "en"}, {"text": "dramatisch", "lang": "de"}], [{"text": "Dramatisch. Er war immer dramatisch \u2013 he was always dramatic. Now say \u201cthe business card\u201d", "lang": "en"}, {"text": "die Visitenkarte", "lang": "de"}], [{"text": "Die Visitenkarte. Feminine. Eine Visitenkarte", "lang": "de"}, {"text": "\u2013 a business card --I stood there for a long time, staring at the business card. Sebastian Bauer. Architect. I picked it up. Turned it over. Nothing on the back. My phone buzzed. Matei: Where are you? I did not answer. Now say \u201cthe architect\u201d", "lang": "en"}, {"text": "der Architekt", "lang": "de"}], [{"text": "Der Architekt. Masculine. Sebastian Bauer, Architekt", "lang": "de"}, {"text": "\u2013 Sebastian Bauer, architect Now say \u201cto turn over\u201d", "lang": "en"}, {"text": "umdrehen. Ich drehte die Karte um \u2013 I turned the card", "lang": "de"}, {"text": "over. --I walked home slowly. The streets were dark. The duck was not at the bridge. The bakery downstairs was closed. The stairs were thirty-seven steps. The key stuck. Matei was on the sofa. His laptop was open. He was typing something. \u201cYou are late,\u201d he said without looking up. \u201cA customer came in after close.\u201d \u201cI thought you locked the door.\u201d \u201cI forgot.\u201d He looked up. His grey eyes narrowed. \u201cYou never forget to lock the door.\u201d \u201cI did today.\u201d Now say \u201cto narrow\u201d", "lang": "en"}, {"text": "verengen or zusammenziehen. Seine Augen verengten sich \u2013 his", "lang": "de"}, {"text": "eyes narrowed.", "lang": "en"}], [{"text": "Verengen. Seine Augen verengten sich \u2013 his eyes narrowed. Now say \u201cto forget\u201d vergessen. Review. Du vergisst nie abzuschlie\u00dfen \u2013 you never forget to lock. --He closed the laptop. Stood up. \u201cWhat is wrong?\u201d \u201cNothing.\u201d \u201cYou are lying.\u201d \u201cI am not.\u201d He walked to me. Put his hand on my face. His thumb traced my cheekbone. \u201cYves. Tell me.\u201d I pulled away. Walked to the window. Stared out at the dark street. \u201cSebastian came to the caf\u00e9,\u201d I said. Now say \u201cthe cheekbone\u201d", "lang": "en"}, {"text": "das Wangenknochen", "lang": "de"}], [{"text": "Das Wangenknochen. Neuter. Er ber\u00fchrte mein Wangenknochen", "lang": "de"}, {"text": "\u2013 he touched my cheekbone. Now say \u201cto pull away\u201d wegziehen. Review", "lang": "en"}], [{"text": "Wegziehen. Ich zog mich weg \u2013 I pulled away. --The room went silent. \u201cWhat did he want?\u201d \u201cTo talk to you. He said you have been ignoring him.\u201d Matei did not speak for a long moment. When he did, his voice was low. \u201cI told you about him.\u201d \u201cYou said he left. You did not say he was blonde and handsome and drove a car that costs more than this building.\u201d \u201cHe is not handsome.\u201d \u201cHe is. You know he is.\u201d Now say \u201cto ignore\u201d", "lang": "en"}, {"text": "ignorieren", "lang": "de"}], [{"text": "Ignorieren. Du hast ihn ignoriert \u2013 you have been ignoring him. Now say \u201cthe building\u201d", "lang": "en"}, {"text": "das Geb\u00e4ude", "lang": "de"}], [{"text": "Das Geb\u00e4ude. Neuter. Dieses Geb\u00e4ude", "lang": "de"}, {"text": "\u2013 this building --Matei walked to me. Stopped behind me. Did not touch. \u201cI do not care what he looks like,\u201d he said. \u201cHe left. He wrote me a note and left. I have not spoken to him since.\u201d \u201cHe wants to talk to you.\u201d \u201cI do not want to talk to him.\u201d \u201cHe said you were dramatic.\u201d \u201cSebastian thinks anyone who has feelings is dramatic.\u201d I turned. His face was close to mine. Now say \u201cfeelings\u201d die Gef\u00fchle (plural)", "lang": "en"}], [{"text": "Die Gef\u00fchle. Plural. Jeder, der Gef\u00fchle hat", "lang": "de"}, {"text": "\u2013 anyone who has feelings Now say \u201cclose\u201d", "lang": "en"}, {"text": "nah. Sein Gesicht war nah an meinem \u2013 his face was close to", "lang": "de"}, {"text": "mine. --\u201cMatei.\u201d \u201cWhat?\u201d \u201cAre you going to see him?\u201d \u201cNo.\u201d \u201cAre you sure?\u201d He put his hands on my shoulders. Squeezed. \u201cI am sure. I chose you. I keep choosing you. That is not going to change because Sebastian showed up with his expensive coat and his architect business card.\u201d \u201cHow did you know about the card?\u201d \u201cBecause he always leaves cards. He thinks it makes him memorable.\u201d \u201cIt does.\u201d \u201cIt makes him predictable.\u201d Now say \u201cpredictable\u201d", "lang": "en"}, {"text": "vorhersehbar", "lang": "de"}], [{"text": "Vorhersehbar. Es macht ihn vorhersehbar \u2013 it makes him predictable. Now say \u201cmemorable\u201d", "lang": "en"}, {"text": "einpr\u00e4gsam", "lang": "de"}], [{"text": "Einpr\u00e4gsam. Er denkt, es macht ihn einpr\u00e4gsam", "lang": "de"}, {"text": "\u2013 he thinks it makes him memorable --Matei kissed my forehead. \u201cI am not going anywhere, Yves.\u201d \u201cYou keep saying that.\u201d \u201cBecause you keep needing to hear it.\u201d I leaned into him. His arms went around me. \u201cI am scared,\u201d I said. \u201cI know.\u201d \u201cI am scared that one day you will wake up and realise I am not worth the trouble.\u201d He pulled back. Looked at me. Now say \u201cthe trouble\u201d", "lang": "en"}, {"text": "der \u00c4rger or die M\u00fche", "lang": "de"}], [{"text": "Die M\u00fche. Feminine. Die M\u00fche wert sein", "lang": "de"}, {"text": "\u2013 to be worth the trouble Now say \u201cto realise\u201d", "lang": "en"}, {"text": "merken or erkennen", "lang": "de"}], [{"text": "Merken. Du wirst merken, dass ich die M\u00fche nicht wert bin \u2013 you will realise I am not worth the trouble. --\u201cYou are worth every trouble. And more.\u201d He paused. \u201cBut you need to stop waiting for me to leave. I am not Sebastian. I am not your grandmother. I am not anyone who has ever left you. I am Matei. I make coffee and forget to buy groceries and remember everything you have ever told me. And I am staying.\u201d \u201cPromise?\u201d \u201cI do not make promises.\u201d \u201cThen what do you make?\u201d He kissed me. Hard. Brief. \u201cDinner,\u201d he said. \u201cI bought pasta.\u201d Now say \u201cthe promise\u201d", "lang": "en"}, {"text": "das Versprechen", "lang": "de"}], [{"text": "Das Versprechen. Neuter. Ich mache keine Versprechen", "lang": "de"}, {"text": "\u2013 I do not make promises Now say \u201cto buy\u201d", "lang": "en"}, {"text": "kaufen. Ich habe Nudeln gekauft \u2013 I bought pasta", "lang": "de"}, {"text": "We made dinner together. The same pasta. My grandmother's recipe. He chopped the onions. I cried. Not from the onions. Afterwards, we sat on the sofa. The lamp was on. The radiator clicked. \u201cMatei.\u201d \u201cWhat?\u201d \u201cWhat are you going to do about Sebastian?\u201d \u201cNothing.\u201d \u201cHe is going to come back.\u201d \u201cThen I will tell him to leave.\u201d \u201cWhat if he does not?\u201d Matei turned to look at me. \u201cThen you tell him to leave. In your bad German.\u201d Now say \u201cto click\u201d", "lang": "en"}, {"text": "klicken. Der Heizk\u00f6rper klickte \u2013 the radiator clicked", "lang": "de"}], [{"text": "Klicken. Der Heizk\u00f6rper klickte \u2013 the radiator clicked. Now say \u201cbad German\u201d", "lang": "en"}, {"text": "schlechtes Deutsch", "lang": "de"}], [{"text": "Schlechtes Deutsch. Auf deinem schlechten Deutsch \u2013 in your bad German. --\u201cMy German is not bad.\u201d \u201cIt is improving.\u201d I laughed. He almost smiled. \u201cI am serious,\u201d I said. \u201cSo am I. Sebastian is not a problem. He is a memory. And memories do not get to decide who I am now.\u201d I leaned my head on his shoulder. \u201cI wish I believed that.\u201d \u201cYou will. Give it time.\u201d We sat like that until the lamp flickered and the street went quiet. Now say \u201cthe memory\u201d", "lang": "en"}, {"text": "die Erinnerung", "lang": "de"}], [{"text": "Die Erinnerung. Feminine. Eine Erinnerung", "lang": "de"}, {"text": "\u2013 a memory Now say \u201cto decide\u201d", "lang": "en"}, {"text": "entscheiden. Erinnerungen entscheiden nicht \u2013 memories do", "lang": "de"}, {"text": "not decide. --My phone buzzed. Ada. How is the boyfriend? I typed back: Good. How is Berlin? Cold. But I am learning to like it. Same. Good night, Lucky. Good night, Ada. I put the phone away. Matei's arm was around me. \u201cWho was that?\u201d \u201cAda.\u201d \u201cWhat did she want?\u201d \u201cTo check on me.\u201d \u201cShe does that a lot.\u201d \u201cShe is worried.\u201d \u201cAbout what?\u201d I thought about it. About Sebastian. About the caf\u00e9. About the key in my pocket. \u201cAbout me running,\u201d I said. Matei's arm tightened. \u201cAre you?\u201d \u201cNo,\u201d I said. \u201cNot tonight.\u201d He kissed my hair. \u201cGood.\u201d Now say \u201cto tighten\u201d", "lang": "en"}, {"text": "festziehen or fester dr\u00fccken", "lang": "de"}], [{"text": "Festziehen. Sein Arm zog sich fester um mich \u2013 his arm tightened around me. Now say \u201cthe hair\u201d", "lang": "en"}, {"text": "das Haar or die Haare. Er k\u00fcsste mein Haar \u2013 he kissed my", "lang": "de"}, {"text": "hair. --Dual-layer vocabulary review \u2013 Chapter 14 Layer 1 \u2013 Words", "lang": "en"}, {"text": "Der Ex", "lang": "de"}, {"text": "\u2013 the ex. <break time=\"2s\"/> Der Ex. Der Ex-Freund Zittern \u2013 to shake. <break time=\"2s\"/> Zittern. Ihre linke Hand zitterte. Blond \u2013 blonde. <break time=\"2s\"/> Blond. Ein blonder Mann. Teuer \u2013 expensive. <break time=\"2s\"/> Teuer. Ein teurer Mantel.", "lang": "en"}, {"text": "Das Parf\u00fcm", "lang": "de"}, {"text": "\u2013 the cologne. <break time=\"2s\"/> Das Parf\u00fcm. Sein Parf\u00fcm war zu stark", "lang": "en"}, {"text": "Erreichen", "lang": "de"}, {"text": "\u2013 to reach. <break time=\"2s\"/> Erreichen. Ich versuche, ihn zu erreichen. Dramatisch \u2013 dramatic. <break time=\"2s\"/> Dramatisch. Er war immer dramatisch.", "lang": "en"}, {"text": "Die Visitenkarte", "lang": "de"}, {"text": "\u2013 the business card. <break time=\"2s\"/> Die Visitenkarte. Eine Visitenkarte.", "lang": "en"}, {"text": "Der Architekt", "lang": "de"}, {"text": "\u2013 the architect. <break time=\"2s\"/> Der Architekt. Sebastian Bauer, Architekt. Umdrehen \u2013 to turn over. <break time=\"2s\"/> Umdrehen. Ich drehte die Karte um. Verengen \u2013 to narrow. <break time=\"2s\"/> Verengen. Seine Augen verengten sich.", "lang": "en"}, {"text": "Das Wangenknochen", "lang": "de"}, {"text": "\u2013 the cheekbone. <break time=\"2s\"/> Das Wangenknochen. Er ber\u00fchrte mein Wangenknochen. Ignorieren \u2013 to ignore. <break time=\"2s\"/> Ignorieren. Du hast ihn ignoriert.", "lang": "en"}, {"text": "Das Geb\u00e4ude", "lang": "de"}, {"text": "\u2013 the building. <break time=\"2s\"/> Das Geb\u00e4ude. Dieses Geb\u00e4ude", "lang": "en"}, {"text": "Die Gef\u00fchle", "lang": "de"}, {"text": "\u2013 feelings. <break time=\"2s\"/> Die Gef\u00fchle. Jeder, der Gef\u00fchle hat Nah \u2013 close. <break time=\"2s\"/> Nah. Sein Gesicht war nah an meinem. Vorhersehbar \u2013 predictable. <break time=\"2s\"/> Vorhersehbar. Es macht ihn vorhersehbar.", "lang": "en"}, {"text": "Einpr\u00e4gsam", "lang": "de"}, {"text": "\u2013 memorable. <break time=\"2s\"/> Einpr\u00e4gsam. Er denkt, es macht ihn einpr\u00e4gsam.", "lang": "en"}, {"text": "Die M\u00fche", "lang": "de"}, {"text": "\u2013 the trouble / effort. <break time=\"2s\"/> Die M\u00fche. Die M\u00fche wert sein Merken \u2013 to realise. <break time=\"2s\"/> Merken. Du wirst merken.", "lang": "en"}, {"text": "Das Versprechen", "lang": "de"}, {"text": "\u2013 the promise. <break time=\"2s\"/> Das Versprechen. Ich mache keine Versprechen. Klicken \u2013 to click. <break time=\"2s\"/> Klicken. Der Heizk\u00f6rper klickte. Schlechtes Deutsch \u2013 bad German. <break time=\"2s\"/> Schlechtes Deutsch. Auf deinem schlechten Deutsch.", "lang": "en"}, {"text": "Die Erinnerung", "lang": "de"}, {"text": "\u2013 the memory. <break time=\"2s\"/> Die Erinnerung. Eine Erinnerung Entscheiden \u2013 to decide. <break time=\"2s\"/> Entscheiden. Erinnerungen entscheiden nicht. Festziehen \u2013 to tighten. <break time=\"2s\"/> Festziehen. Sein Arm zog sich fester um mich. Layer 2 \u2013 Story phrases \"Ein blonder Mann.\" \u2013 A blonde man. <break time=\"2s\"/> Ein blonder Mann. \"Sein Parf\u00fcm war zu stark.\" \u2013 His cologne was too strong. <break time=\"2s\"/> Sein Parf\u00fcm war zu stark. \"Er war immer dramatisch.\" \u2013 He was always dramatic. <break time=\"2s\"/> Er war immer dramatisch. \"Sebastian Bauer, Architekt.\" \u2013 Sebastian Bauer, architect. <break time=\"2s\"/> Sebastian Bauer, Architekt. \"Jeder, der Gef\u00fchle hat.\" \u2013 Anyone who has feelings. <break time=\"2s\"/> Jeder, der Gef\u00fchle hat. \"Ich mache keine Versprechen.\" \u2013 I don't make promises. <break time=\"2s\"/> Ich mache keine Versprechen. \"Auf deinem schlechten Deutsch.\" \u2013 In your bad German. <break time=\"2s\"/> Auf deinem schlechten Deutsch. \"Eine Erinnerung.\" \u2013 A memory. <break time=\"2s\"/> Eine Erinnerung. --End of Chapter 14. --Chapter 15 \u2013 The Architect (B1-B2) (Narrator voice, calm, clear. Ambient: caf\u00e9 ambience \u2013 soft chatter, espresso machine, bell chime.) Sebastian came back three days later. I saw him through the caf\u00e9 window. Same expensive coat. Same blonde hair. Same smile that did not reach his eyes. He was standing across the street, looking at the green awning like he was calculating its square footage. I ducked behind the espresso machine. \u201cYves?\u201d Frau Schmidt was sitting at the table, her good hand wrapped around a cup of tea. \u201cWhat is wrong?\u201d \u201cNothing.\u201d \u201cYou are hiding.\u201d \u201cI am crouching. There is a difference.\u201d Now say \u201cto calculate\u201d", "lang": "en"}, {"text": "berechnen", "lang": "de"}], [{"text": "Berechnen. Er berechnete die Quadratmeterzahl \u2013 he was calculating the square footage. Now say \u201cto duck\u201d", "lang": "en"}, {"text": "sich ducken", "lang": "de"}], [{"text": "Sich ducken. Ich duckte mich hinter die Maschine \u2013 I ducked behind the machine. --She craned her neck. Looked out the window. \u201cAh. The blonde one.\u201d \u201cYou know him?\u201d \u201cHe came by yesterday. Asked for Matei. I told him Matei does not work here.\u201d She took a sip of tea. \u201cHe did not believe me.\u201d \u201cHe is Matei's ex.\u201d \u201cI know.\u201d She set her cup down. \u201cMatei told me. Years ago. When it happened.\u201d \u201cWhat did he tell you?\u201d She was quiet for a moment. \u201cThat he came home one day and the apartment was empty. No furniture. No books. No note. Just a key on the table.\u201d She looked at me. \u201cThe same key he gave you.\u201d Now say \u201cto crane one's neck\u201d", "lang": "en"}, {"text": "den Hals recken", "lang": "de"}], [{"text": "Den Hals recken. Sie reckte den Hals \u2013 she craned her neck. Now say \u201cthe furniture\u201d die M\u00f6bel (plural)", "lang": "en"}], [{"text": "Die M\u00f6bel. Plural. Keine M\u00f6bel", "lang": "de"}, {"text": "\u2013 no furniture --I felt sick. \u201cHe left without saying goodbye,\u201d I said. \u201cYes.\u201d \u201cAnd now he is back.\u201d \u201cNow he is back.\u201d She patted the table. \u201cSit. You are making me nervous.\u201d I sat. The chair was cold. The caf\u00e9 was empty. \u201cWhat do I do?\u201d I asked. \u201cYou do nothing. This is not your fight.\u201d \u201cHe is my boyfriend. It is my fight.\u201d \u201cNo.\u201d Frau Schmidt's voice was firm. \u201cThis is Matei's past. He must handle it. You can support him. You cannot fight for him.\u201d Now say \u201csick\u201d", "lang": "en"}, {"text": "krank or \u00fcbel. Mir war \u00fcbel \u2013 I felt sick", "lang": "de"}], [{"text": "\u00dcbel. Mir war \u00fcbel \u2013 I felt sick. Now say \u201cfirm\u201d", "lang": "en"}, {"text": "fest or bestimmt", "lang": "de"}], [{"text": "Bestimmt. Ihre Stimme war bestimmt \u2013 her voice was firm. --I wanted to argue. But she was right. \u201cHe is outside,\u201d I said. \u201cI know.\u201d \u201cHe is going to come in.\u201d \u201cProbably.\u201d \u201cWhat do I say?\u201d She smiled. \u201cSay 'Guten Morgen. Was m\u00f6chten Sie?' And then make him pay for his coffee. Expensive coffee. The most expensive coffee we have.\u201d I laughed. I could not help it. \u201cYou are evil,\u201d I said. \u201cI am practical.\u201d She patted my hand. \u201cNow stand up. He is crossing the street.\u201d Now say \u201cevil\u201d", "lang": "en"}, {"text": "b\u00f6se", "lang": "de"}], [{"text": "B\u00f6se. Du bist b\u00f6se \u2013 you are evil. Now say \u201cpractical\u201d", "lang": "en"}, {"text": "praktisch", "lang": "de"}], [{"text": "Praktisch. Ich bin praktisch \u2013 I am practical. --The bell chimed. Sebastian walked in. He was even taller up close. His coat was dark grey, not black. His shoes were leather. His smile was the same. \u201cGuten Morgen,\u201d he said. \u201cGuten Morgen,\u201d I said. \u201cWas m\u00f6chten Sie?\u201d He raised an eyebrow. \u201cYou speak German.\u201d \u201cA little.\u201d \u201cMatei said you did not.\u201d \u201cMatei says a lot of things.\u201d He laughed. It was a nice laugh. I hated that it was nice. Now say \u201cthe shoe\u201d", "lang": "en"}, {"text": "der Schuh", "lang": "de"}], [{"text": "Der Schuh. Masculine. Lederschuhe", "lang": "de"}, {"text": "\u2013 leather shoes Now say \u201cthe eyebrow\u201d", "lang": "en"}, {"text": "die Augenbraue", "lang": "de"}], [{"text": "Die Augenbraue. Feminine. Eine Augenbraue hochziehen", "lang": "de"}, {"text": "\u2013 to raise an eyebrow --\u201cI will have a latte,\u201d he said. \u201cOat milk. Extra hot.\u201d \u201cThat will be four fifty.\u201d He paid. Did not blink at the price. I made his latte. My hands were steady. \u201cYou are Yves,\u201d he said while I worked. \u201cYou knew that.\u201d \u201cI wanted to hear you say it.\u201d \u201cWhy?\u201d He leaned on the counter. \u201cBecause I wanted to see if you sounded the way Matei described.\u201d \u201cHow did he describe me?\u201d \u201cDifferent.\u201d He smiled. \u201cHe said you were quiet. Shy. You do not seem shy.\u201d \u201cI am not shy. I am selective.\u201d Now say \u201cselective\u201d", "lang": "en"}, {"text": "w\u00e4hlerisch", "lang": "de"}], [{"text": "W\u00e4hlerisch. Ich bin w\u00e4hlerisch \u2013 I am selective. Now say \u201cto blink\u201d", "lang": "en"}, {"text": "blinzeln. Er blinzelte nicht \u2013 he did not blink", "lang": "de"}, {"text": "He laughed again. Took his latte. Did not sit. Just stood by the counter, drinking, watching me. \u201cIs Matei coming by today?\u201d he asked. \u201cI do not know his schedule.\u201d \u201cYou live with him.\u201d \u201cI sleep on his sofa.\u201d Sebastian's smile flickered. \u201cIs that what you call it?\u201d I did not answer. The espresso machine hissed. \u201cTell him I stopped by,\u201d Sebastian said. He set his empty cup on the counter. \u201cAgain.\u201d \u201cI will tell him.\u201d \u201cNo, you will not.\u201d He left. The bell chimed. The door closed. Now say \u201cthe schedule\u201d", "lang": "en"}, {"text": "der Zeitplan", "lang": "de"}], [{"text": "Der Zeitplan. Masculine. Sein Zeitplan", "lang": "de"}, {"text": "\u2013 his schedule Now say \u201cto flicker\u201d", "lang": "en"}, {"text": "flackern. Sein L\u00e4cheln flackerte \u2013 his smile flickered", "lang": "de"}, {"text": "Frau Schmidt was watching me. \u201cYou did good,\u201d she said. \u201cI want to punch him.\u201d \u201cThat is normal. Punching is not allowed in the caf\u00e9. Outside is fine.\u201d I laughed. It was shaky. \u201cHe is going to keep coming back,\u201d I said. \u201cYes.\u201d \u201cUntil Matei talks to him.\u201d \u201cProbably.\u201d I pulled out my phone. Texted Matei. Sebastian was here again. Three dots appeared. Then: I know. He texted me. What did he say? That you make good coffee. That is it? That is it. Are you going to see him? A long pause. Then: I do not know. Now say \u201cshaky\u201d", "lang": "en"}, {"text": "zittrig", "lang": "de"}], [{"text": "Zittrig. Mein Lachen war zittrig \u2013 my laugh was shaky. Now say \u201cto text\u201d", "lang": "en"}, {"text": "texten. Er hat mir getextet \u2013 he texted me", "lang": "de"}, {"text": "I put my phone away. Made another coffee for a customer who was not there. Frau Schmidt watched me with her sharp grey eyes. \u201cHe will do the right thing,\u201d she said. \u201cHow do you know?\u201d \u201cBecause he is not the same person who got left. And neither are you.\u201d Now say \u201csharp\u201d", "lang": "en"}, {"text": "scharf", "lang": "de"}], [{"text": "Scharf. Ihre scharfen Augen \u2013 her sharp eyes. Now say \u201cleft\u201d", "lang": "en"}, {"text": "verlassen (past participle). Der, der verlassen wurde \u2013 the one", "lang": "de"}, {"text": "who got left. --That night, Matei came home late. He did not say anything. He just walked to the sofa, sat down, and stared at the wall. I sat next to him. Did not touch him. \u201cHe wants to meet,\u201d Matei said. \u201cWhere?\u201d \u201cA caf\u00e9. Not yours. Somewhere neutral.\u201d \u201cAre you going to go?\u201d He was quiet for a long time. \u201cI do not know what he wants.\u201d Now say \u201cneutral\u201d", "lang": "en"}, {"text": "neutral", "lang": "de"}], [{"text": "Neutral. Ein neutraler Ort \u2013 a neutral place. Now say \u201cto meet\u201d", "lang": "en"}, {"text": "treffen. Er will sich treffen \u2013 he wants to meet", "lang": "de"}, {"text": "\u201cClosure, maybe. An apology. A chance to explain.\u201d \u201cHe left a note. That was his explanation.\u201d Matei's voice was flat. \u201cI cannot do this anymore. Seven words. After two years.\u201d \u201cThat is not an explanation.\u201d \u201cNo. It is not.\u201d I put my hand on his knee. He did not pull away. \u201cYou do not have to see him,\u201d I said. \u201cI know.\u201d \u201cBut you want to.\u201d He turned to look at me. His grey eyes were tired. \u201cI want to know why,\u201d he said. \u201cWhy he left. Why he did not say goodbye. Why he waited until I was at work to pack his things.\u201d Now say \u201cclosure\u201d", "lang": "en"}, {"text": "der Abschluss", "lang": "de"}], [{"text": "Der Abschluss. Masculine. Abschluss finden", "lang": "de"}, {"text": "\u2013 to find closure Now say \u201cto explain\u201d", "lang": "en"}, {"text": "erkl\u00e4ren. Eine Chance zu erkl\u00e4ren \u2013 a chance to explain", "lang": "de"}, {"text": "\u201cThose are fair questions.\u201d \u201cThey are pathetic questions. It has been years. I should not care anymore.\u201d \u201cBut you do.\u201d \u201cBut I do.\u201d He put his hand on top of mine. \u201cI am sorry.\u201d \u201cFor what?\u201d \u201cFor bringing this into your life. For making you deal with my past.\u201d \u201cYou did not make me do anything. I chose to be here.\u201d \u201cYou chose to stay.\u201d \u201cSame thing.\u201d He almost smiled. Now say \u201cfair\u201d", "lang": "en"}, {"text": "fair", "lang": "de"}], [{"text": "Fair. Faire Fragen \u2013 fair questions. Now say \u201cpathetic\u201d", "lang": "en"}, {"text": "erb\u00e4rmlich", "lang": "de"}], [{"text": "Erb\u00e4rmlich. Erb\u00e4rmliche Fragen", "lang": "de"}, {"text": "\u2013 pathetic questions --\u201cI am going to see him,\u201d he said. \u201cTomorrow. After work.\u201d \u201cDo you want me to come?\u201d \u201cNo.\u201d \u201cAre you sure?\u201d He kissed my forehead. \u201cI am sure. This is something I have to do alone.\u201d I wanted to argue. But Frau Schmidt was right. This was not my fight. \u201cOkay,\u201d I said. \u201cOkay?\u201d \u201cOkay. But text me when it is over.\u201d \u201cI will.\u201d \u201cAnd if he tries anything, call me. I will come. I will bring Frau Schmidt.\u201d He laughed. A real laugh. It was small, but it was real. \u201cDeal,\u201d he said. Now say \u201cthe deal\u201d", "lang": "en"}, {"text": "die Abmachung or der Deal", "lang": "de"}], [{"text": "Der Deal. Masculine. Abgemacht", "lang": "de"}, {"text": "\u2013 deal Now say \u201cto try anything\u201d", "lang": "en"}, {"text": "etwas versuchen", "lang": "de"}], [{"text": "Etwas versuchen. Wenn er etwas versucht \u2013 if he tries anything. --We sat on the sofa. The lamp buzzed. The radiator clicked. \u201cMatei.\u201d \u201cWhat?\u201d \u201cI love you.\u201d The words came out before I could stop them. I had never said them before. Not to him. Not to anyone. He turned to look at me. His grey eyes were wide. \u201cYves.\u201d \u201cYou do not have to say it back. I just needed you to know.\u201d He was quiet for a long moment. Then he put his hand on my face. His thumb traced my cheekbone. \u201cI love you too,\u201d he said. \u201cI have loved you since the first message. Two years ago. I just did not know how to say it.\u201d \u201cThat is a long time to wait.\u201d \u201cYou were worth waiting for.\u201d Now say \u201cto wait\u201d", "lang": "en"}, {"text": "warten", "lang": "de"}], [{"text": "Warten. Eine lange Zeit zu warten \u2013 a long time to wait. Now say \u201cworth\u201d", "lang": "en"}, {"text": "wert. Du warst das Warten wert \u2013 you were worth waiting for", "lang": "de"}, {"text": "He kissed me. Soft. Slow. When he pulled back, his eyes were wet. \u201cDo not run,\u201d he said. \u201cI am not going anywhere.\u201d \u201cPromise?\u201d I thought about it. About all the times I had run. About all the people I had left behind. \u201cI promise,\u201d I said. He held me. I held him. The lamp flickered. The street went quiet. Tomorrow, he would see Sebastian. Tomorrow, he would get answers. But tonight, he was here. And I was here. Now say \u201cto hold\u201d", "lang": "en"}, {"text": "halten", "lang": "de"}], [{"text": "Halten. Er hielt mich \u2013 he held me. Now say \u201cthe answer\u201d", "lang": "en"}, {"text": "die Antwort", "lang": "de"}], [{"text": "Die Antwort. Feminine. Antworten bekommen", "lang": "de"}, {"text": "\u2013 to get answers --Dual-layer vocabulary review \u2013 Chapter 15 Layer 1 \u2013 Words Berechnen \u2013 to calculate. <break time=\"2s\"/> Berechnen. Er berechnete die Quadratmeterzahl. Sich ducken \u2013 to duck. <break time=\"2s\"/> Sich ducken. Ich duckte mich. Den Hals recken \u2013 to crane one's neck. <break time=\"2s\"/> Den Hals recken. Sie reckte den Hals.", "lang": "en"}, {"text": "Die M\u00f6bel", "lang": "de"}, {"text": "\u2013 furniture. <break time=\"2s\"/> Die M\u00f6bel. Keine M\u00f6bel \u00dcbel \u2013 sick (feeling). <break time=\"2s\"/> \u00dcbel. Mir war \u00fcbel. Bestimmt \u2013 firm. <break time=\"2s\"/> Bestimmt. Ihre Stimme war bestimmt. B\u00f6se \u2013 evil. <break time=\"2s\"/> B\u00f6se. Du bist b\u00f6se. Praktisch \u2013 practical. <break time=\"2s\"/> Praktisch. Ich bin praktisch.", "lang": "en"}, {"text": "Der Schuh", "lang": "de"}, {"text": "\u2013 the shoe. <break time=\"2s\"/> Der Schuh. Lederschuhe", "lang": "en"}, {"text": "Die Augenbraue", "lang": "de"}, {"text": "\u2013 the eyebrow. <break time=\"2s\"/> Die Augenbraue. Eine Augenbraue hochziehen. W\u00e4hlerisch \u2013 selective. <break time=\"2s\"/> W\u00e4hlerisch. Ich bin w\u00e4hlerisch. Blinzeln \u2013 to blink. <break time=\"2s\"/> Blinzeln. Er blinzelte nicht.", "lang": "en"}, {"text": "Der Zeitplan", "lang": "de"}, {"text": "\u2013 the schedule. <break time=\"2s\"/> Der Zeitplan. Sein Zeitplan Flackern \u2013 to flicker. <break time=\"2s\"/> Flackern. Sein L\u00e4cheln flackerte. Zittrig \u2013 shaky. <break time=\"2s\"/> Zittrig. Mein Lachen war zittrig. Scharf \u2013 sharp. <break time=\"2s\"/> Scharf. Ihre scharfen Augen. Verlassen \u2013 left (past participle). <break time=\"2s\"/> Verlassen. Der, der verlassen wurde. Neutral \u2013 neutral. <break time=\"2s\"/> Neutral. Ein neutraler Ort. Treffen \u2013 to meet. <break time=\"2s\"/> Treffen. Er will sich treffen.", "lang": "en"}, {"text": "Der Abschluss", "lang": "de"}, {"text": "\u2013 closure. <break time=\"2s\"/> Der Abschluss. Abschluss finden", "lang": "en"}, {"text": "Erb\u00e4rmlich", "lang": "de"}, {"text": "\u2013 pathetic. <break time=\"2s\"/> Erb\u00e4rmlich. Erb\u00e4rmliche Fragen", "lang": "en"}, {"text": "Die Abmachung / der Deal", "lang": "de"}, {"text": "\u2013 the deal. <break time=\"2s\"/> Der Deal. Abgemacht Etwas versuchen \u2013 to try anything. <break time=\"2s\"/> Etwas versuchen. Wenn er etwas versucht. Warten \u2013 to wait. <break time=\"2s\"/> Warten. Eine lange Zeit zu warten. Wert \u2013 worth. <break time=\"2s\"/> Wert. Du warst das Warten wert. Halten \u2013 to hold. <break time=\"2s\"/> Halten. Er hielt mich.", "lang": "en"}, {"text": "Die Antwort", "lang": "de"}, {"text": "\u2013 the answer. <break time=\"2s\"/> Die Antwort. Antworten bekommen Layer 2 \u2013 Story phrases \"Er berechnete die Quadratmeterzahl.\" \u2013 He calculated the square footage. <break time=\"2s\"/> Er berechnete die Quadratmeterzahl. \"Mir war \u00fcbel.\" \u2013 I felt sick. <break time=\"2s\"/> Mir war \u00fcbel. \"Ihre Stimme war bestimmt.\" \u2013 Her voice was firm. <break time=\"2s\"/> Ihre Stimme war bestimmt. \"Du bist b\u00f6se.\" \u2013 You are evil. <break time=\"2s\"/> Du bist b\u00f6se. \"Ich bin praktisch.\" \u2013 I am practical. <break time=\"2s\"/> Ich bin praktisch. \"Sein L\u00e4cheln flackerte.\" \u2013 His smile flickered. <break time=\"2s\"/> Sein L\u00e4cheln flackerte. \"Ein neutraler Ort.\" \u2013 A neutral place. <break time=\"2s\"/> Ein neutraler Ort. \"Abschluss finden.\" \u2013 To find closure. <break time=\"2s\"/> Abschluss finden. \"Abgemacht.\" \u2013 Deal. <break time=\"2s\"/> Abgemacht. \"Du warst das Warten wert.\" \u2013 You were worth waiting for. <break time=\"2s\"/> Du warst das Warten wert. --End of Chapter 15. Chapters 16, 17, and 18 \u2013 Refined Audio Scripts Here are the next three chapters in the hybrid style: sensory prose, grammar woven into Yves's thoughts, active prompts, dual-layer reviews. Grammar focus includes Konjunktiv II (would, could, should), formal Sie, and infinitive constructions with zu. --Chapter 16 \u2013 The Meeting (B1-B2) (Narrator voice, calm, clear. Ambient: late evening \u2013 distant traffic, soft rain against window, the hum of a refrigerator.) I could not focus at the caf\u00e9. I burned two lattes. Dropped a cup. Forgot to order pastries from the bakery. Frau Schmidt watched me from her table, her good hand wrapped around her tea, her sharp eyes missing nothing. \u201cYou are worse than yesterday,\u201d she said. \u201cI am fine.\u201d \u201cYou are burning milk. That is not fine.\u201d I dumped the third burnt latte down the sink. Started over. Watched the thermometer like my life depended on it. \u201cMatei is meeting Sebastian today,\u201d I said. \u201cAh.\u201d She nodded. \u201cThat explains it.\u201d Now say \u201cto dump\u201d", "lang": "en"}, {"text": "wegsch\u00fctten", "lang": "de"}], [{"text": "Wegsch\u00fctten. Ich sch\u00fcttete den dritten verbrannten Latte weg \u2013 I dumped the third burnt latte. Now say \u201cto explain\u201d", "lang": "en"}, {"text": "erkl\u00e4ren. Das erkl\u00e4rt es \u2013 that explains it", "lang": "de"}, {"text": "\u201cWhat if it goes badly?\u201d I asked. \u201cThen it goes badly. And you help him pick up the pieces.\u201d \u201cWhat if he decides he wants Sebastian back?\u201d Frau Schmidt set her cup down. Looked at me. \u201cDo you really believe that?\u201d I did not answer. Because the truth was, I did not know what I believed. I trusted Matei. I did. But trust was new to me. Fragile. Like a cup I had already dropped twice. Now say \u201cthe piece\u201d", "lang": "en"}, {"text": "das St\u00fcck", "lang": "de"}], [{"text": "Das St\u00fcck. Neuter. Die St\u00fccke aufheben", "lang": "de"}, {"text": "\u2013 to pick up the pieces Now say \u201cfragile\u201d zerbrechlich. Review", "lang": "en"}], [{"text": "Zerbrechlich. Vertrauen ist zerbrechlich \u2013 trust is fragile. --\u201cYves.\u201d Frau Schmidt's voice was gentle. \u201cThat man gave you a key. He gave you a job. He gave you his bed. He is not going to throw that away for someone who left him with a seven-word note.\u201d \u201cPeople do stupid things for people who hurt them.\u201d \u201cSome people. Not Matei.\u201d She patted the table. \u201cNow make me a cappuccino. A good one. No burnt milk.\u201d I made her a cappuccino. It was perfect. She did not say thank you. She did not have to. Now say \u201cgentle\u201d", "lang": "en"}, {"text": "sanft", "lang": "de"}], [{"text": "Sanft. Ihre Stimme war sanft \u2013 her voice was gentle. Now say \u201cto throw away\u201d wegwerfen (separable)", "lang": "en"}], [{"text": "Wegwerfen. Er wird das nicht wegwerfen \u2013 he will not throw that away. --Matei texted me at 4 PM. It is done. Coming home. I closed the caf\u00e9 early. Frau Schmidt shooed me out the door with a bag of pastries. I walked home fast. The duck was at the bridge. I did not stop. The apartment was dark when I got there. Matei was sitting on the sofa. His coat was still on. His hands were in his lap. I sat next to him. Did not touch him. \u201cHow was it?\u201d Now say \u201cto shoo\u201d fortscheuchen. Review", "lang": "en"}], [{"text": "Fortscheuchen. Frau Schmidt scheuchte mich weg \u2013 Frau Schmidt shooed me away. Now say \u201cthe lap\u201d", "lang": "en"}, {"text": "der Scho\u00df", "lang": "de"}], [{"text": "Der Scho\u00df. Masculine. Seine H\u00e4nde auf dem Scho\u00df", "lang": "de"}, {"text": "\u2013 his hands in his lap --He was quiet for a long time. Then he said, \u201cHe apologised.\u201d \u201cFor leaving?\u201d \u201cFor the note. For not saying goodbye. For taking the furniture.\u201d Matei's voice was flat. \u201cHe said he was scared. Scared of commitment. Scared of being stuck. Scared of waking up in ten years and realising he had settled.\u201d \u201cDid you believe him?\u201d \u201cI do not know.\u201d He ran a hand through his hair. \u201cHe seemed honest. He always seemed honest. That was the problem. He believed everything he said in the moment. He just could not believe it the next day.\u201d Now say \u201ccommitment\u201d", "lang": "en"}, {"text": "die Verpflichtung", "lang": "de"}], [{"text": "Die Verpflichtung. Feminine. Angst vor Verpflichtung", "lang": "de"}, {"text": "\u2013 scared of commitment Now say \u201cto settle\u201d", "lang": "en"}, {"text": "sich niederlassen or sich zufriedengeben", "lang": "de"}], [{"text": "Sich niederlassen. Sich niedergelassen haben \u2013 to have settled. --\u201cDid he ask for you back?\u201d Matei turned to look at me. His grey eyes were tired. \u201cHe asked if there was a chance. I told him no.\u201d My chest loosened. I had not realised I had been holding my breath. \u201cWhat did he say?\u201d \u201cHe said he understood. Then he asked if we could be friends.\u201d Matei almost smiled. \u201cI told him I would think about it.\u201d \u201cAre you going to?\u201d \u201cI do not know. Maybe. In a year. In five years. Not now.\u201d Now say \u201cthe chance\u201d die Chance. Review", "lang": "en"}], [{"text": "Die Chance. Ob es eine Chance gibt", "lang": "de"}, {"text": "\u2013 if there is a chance Now say \u201cto understand\u201d", "lang": "en"}, {"text": "verstehen", "lang": "de"}], [{"text": "Verstehen. Er sagte, er verstehe", "lang": "de"}, {"text": "\u2013 he said he understood --I put my hand on his knee. He put his hand on top of mine. \u201cI am sorry,\u201d I said. \u201cFor what?\u201d \u201cFor making you do this alone.\u201d \u201cYou did not make me. I chose.\u201d \u201cI know. But I wanted to be there. To hold your hand. To glare at him.\u201d Matei laughed. It was small, but it was real. \u201cHe is not worth your glares.\u201d \u201cHe is not worth you either.\u201d Matei leaned into me. His head rested on my shoulder. \u201cI love you,\u201d he said. \u201cI love you too.\u201d Now say \u201cto glare\u201d", "lang": "en"}, {"text": "b\u00f6se anstarren", "lang": "de"}], [{"text": "B\u00f6se anstarren. Ihn b\u00f6se anstarren \u2013 to glare at him. Now say \u201cthe shoulder\u201d", "lang": "en"}, {"text": "die Schulter", "lang": "de"}], [{"text": "Die Schulter. Feminine. Sein Kopf ruhte auf meiner Schulter", "lang": "de"}, {"text": "\u2013 his head rested on my shoulder. --We sat like that until the room went dark. Neither of us moved to turn on the lamp. \u201cWhat did he look like?\u201d I asked eventually. \u201cWho?\u201d \u201cSebastian. After all these years.\u201d Matei was quiet for a moment. \u201cOlder. Softer. Less sure of himself.\u201d He paused. \u201cHe looked like someone who had spent five years regretting a decision he could not take back.\u201d \u201cDo you feel sorry for him?\u201d \u201cA little.\u201d He turned his head to look at me. \u201cBut not enough to let him back in.\u201d Now say \u201cto regret\u201d", "lang": "en"}, {"text": "bereuen", "lang": "de"}], [{"text": "Bereuen. Eine Entscheidung bereuen \u2013 to regret a decision. Now say \u201cto take back\u201d zur\u00fccknehmen (separable)", "lang": "en"}], [{"text": "Zur\u00fccknehmen. Eine Entscheidung, die er nicht zur\u00fccknehmen kann \u2013 a decision he cannot take back. --\u201cYou are not him,\u201d I said. \u201cI know.\u201d \u201cYou stayed.\u201d \u201cI stayed.\u201d I kissed his forehead. \u201cGood,\u201d I said. \u201cBecause I am not going anywhere either.\u201d Now say \u201ceither\u201d", "lang": "en"}, {"text": "auch (in negative sentences). Ich gehe auch nirgendwo hin \u2013 I", "lang": "de"}, {"text": "am not going anywhere either.", "lang": "en"}], [{"text": "Auch. Ich gehe auch nirgendwo hin", "lang": "de"}, {"text": "\u2013 I am not going anywhere either --Dual-layer vocabulary review \u2013 Chapter 16 Layer 1 \u2013 Words Wegsch\u00fctten \u2013 to dump. <break time=\"2s\"/> Wegsch\u00fctten. Ich sch\u00fcttete den Latte weg.", "lang": "en"}, {"text": "Das St\u00fcck", "lang": "de"}, {"text": "\u2013 the piece. <break time=\"2s\"/> Das St\u00fcck. Die St\u00fccke aufheben Wegwerfen \u2013 to throw away. <break time=\"2s\"/> Wegwerfen. Er wird das nicht wegwerfen.", "lang": "en"}, {"text": "Der Scho\u00df", "lang": "de"}, {"text": "\u2013 the lap. <break time=\"2s\"/> Der Scho\u00df. Seine H\u00e4nde auf dem Scho\u00df", "lang": "en"}, {"text": "Die Verpflichtung", "lang": "de"}, {"text": "\u2013 commitment. <break time=\"2s\"/> Die Verpflichtung. Angst vor Verpflichtung. Sich niederlassen \u2013 to settle. <break time=\"2s\"/> Sich niederlassen. Sich niedergelassen haben.", "lang": "en"}, {"text": "Verstehen", "lang": "de"}, {"text": "\u2013 to understand. <break time=\"2s\"/> Verstehen. Er sagte, er verstehe B\u00f6se anstarren \u2013 to glare at. <break time=\"2s\"/> B\u00f6se anstarren. Ihn b\u00f6se anstarren.", "lang": "en"}, {"text": "Die Schulter", "lang": "de"}, {"text": "\u2013 the shoulder. <break time=\"2s\"/> Die Schulter. Seine Schulter Bereuen \u2013 to regret. <break time=\"2s\"/> Bereuen. Eine Entscheidung bereuen. Zur\u00fccknehmen \u2013 to take back. <break time=\"2s\"/> Zur\u00fccknehmen. Eine Entscheidung zur\u00fccknehmen.", "lang": "en"}, {"text": "Auch", "lang": "de"}, {"text": "\u2013 either (in negative). <break time=\"2s\"/> Auch. Ich gehe auch nirgendwo hin Layer 2 \u2013 Story phrases \"Die St\u00fccke aufheben.\" \u2013 To pick up the pieces. <break time=\"2s\"/> Die St\u00fccke aufheben. \"Vertrauen ist zerbrechlich.\" \u2013 Trust is fragile. <break time=\"2s\"/> Vertrauen ist zerbrechlich. \"Angst vor Verpflichtung.\" \u2013 Fear of commitment. <break time=\"2s\"/> Angst vor Verpflichtung. \"Er sagte, er verstehe.\" \u2013 He said he understood. <break time=\"2s\"/> Er sagte, er verstehe. \"Ihn b\u00f6se anstarren.\" \u2013 To glare at him. <break time=\"2s\"/> Ihn b\u00f6se anstarren. \"Eine Entscheidung bereuen.\" \u2013 To regret a decision. <break time=\"2s\"/> Eine Entscheidung bereuen. \"Ich gehe auch nirgendwo hin.\" \u2013 I'm not going anywhere either. <break time=\"2s\"/>", "lang": "en"}, {"text": "Ich gehe auch nirgendwo hin.", "lang": "de"}, {"text": "End of Chapter 16. --Chapter 17 \u2013 The Refusal (B1-B2) (Narrator voice, calm, clear. Ambient: early morning \u2013 phone ringing, distant traffic, the tick of a clock.) The phone rang at 7 AM. I was still in bed. Matei was already up \u2013 I could hear him in the kitchen, the familiar sounds of the French press, the click of the stove. The apartment smelled like coffee. It was supposed to be a good morning. Then I saw the number. Nigerian country code. My grandmother's landline. The same number that had never once called me to ask how I was doing, only to tell me what I was doing wrong. I let it ring. Voicemail picked up. She did not leave a message. The phone rang again thirty seconds later. I answered. Now say \u201cthe landline\u201d", "lang": "en"}, {"text": "der Festnetzanschluss", "lang": "de"}], [{"text": "Der Festnetzanschluss. Masculine. Die Festnetznummer meiner Gro\u00dfmutter", "lang": "de"}, {"text": "\u2013 my grandmother's landline. Now say \u201cthe voicemail\u201d", "lang": "en"}, {"text": "die Mailbox", "lang": "de"}], [{"text": "Die Mailbox. Feminine. Die Mailbox schaltete sich ein", "lang": "de"}, {"text": "\u2013 voicemail picked up --\u201cHello?\u201d \u201cLucky.\u201d Her voice was dry. Old. The same voice that had scolded me for staying out late, for not eating enough, for being too quiet. \u201cYou are alive.\u201d \u201cI am alive.\u201d \u201cGood. I was not sure. You do not call.\u201d \u201cI have been busy.\u201d \u201cBusy doing what? Drinking coffee? Running around with that Romanian boy?\u201d My blood went cold. I sat up in bed. Now say \u201cto scold\u201d", "lang": "en"}, {"text": "schelten", "lang": "de"}], [{"text": "Schelten. Sie schalt mich \u2013 she scolded me. Now say \u201cthe blood\u201d", "lang": "en"}, {"text": "das Blut", "lang": "de"}], [{"text": "Das Blut. Neuter. Mein Blut gefror", "lang": "de"}, {"text": "\u2013 my blood froze --- \u201cHow do you know about Matei?\u201d \u201cAda calls me every week. To check on me. Because her mother raised her right.\u201d A pause. \u201cShe told me you have a boyfriend now. A man.\u201d \u201cYes.\u201d \u201cYou always were different. I knew it. Before you did.\u201d I waited. There was always more. \u201cI am old, Lucky. I might die soon.\u201d Her voice cracked. \u201cI want you to come home. Before it is too late.\u201d Now say \u201cto raise\u201d", "lang": "en"}, {"text": "erziehen", "lang": "de"}], [{"text": "Erziehen. Weil ihre Mutter sie richtig erzogen hat", "lang": "de"}, {"text": "\u2013 because her mother raised her right. Now say \u201cto crack\u201d", "lang": "en"}, {"text": "brechen or \u00fcberschnappen. Ihre Stimme brach \u2013 her voice", "lang": "de"}, {"text": "cracked. --I stared at the wall. The wallpaper was peeling in the corner. \u201cCome home,\u201d she repeated. \u201cJust for a week. A few days.\u201d \u201cNo.\u201d The word came out before I could stop it. Flat. Final. \u201cLucky \u2013\u201d \u201cMy name is Yves.\u201d \u201cYou will always be Lucky to me.\u201d \u201cNo. You do not get to decide that anymore.\u201d Now say \u201cthe wallpaper\u201d", "lang": "en"}, {"text": "die Tapete", "lang": "de"}], [{"text": "Die Tapete. Feminine. Die Tapete bl\u00e4tterte ab", "lang": "de"}, {"text": "\u2013 the wallpaper was peeling Now say \u201cfinal\u201d", "lang": "en"}, {"text": "endg\u00fcltig", "lang": "de"}], [{"text": "Endg\u00fcltig. Endg\u00fcltig \u2013 final. --She was quiet for a moment. I could hear her breathing. Shallow. Ragged. \u201cI raised you,\u201d she said finally. \u201cI took you in when your mother ran off. I fed you. I clothed you. I kept you out of trouble.\u201d \u201cYou kept me in a cage.\u201d \u201cA cage?\u201d \u201cYou never asked me what I wanted. Not once. You decided who I was supposed to be, and when I could not be that person, you made me feel like a failure.\u201d Now say \u201cshallow\u201d", "lang": "en"}, {"text": "flach", "lang": "de"}], [{"text": "Flach. Flache Atmung \u2013 shallow breathing. Now say \u201cragged\u201d", "lang": "en"}, {"text": "unregelm\u00e4ssig or heiser", "lang": "de"}], [{"text": "Heiser. Heiseres Atmen \u2013 ragged breathing. --\u201cI was protecting you.\u201d \u201cFrom what?\u201d Silence. \u201cFrom yourself,\u201d she said. \u201cYou were always too soft. Too sensitive. The world would have eaten you alive.\u201d \u201cThe world did eat me alive. Just not the way you thought.\u201d I got out of bed. Walked to the window. The street below was waking up \u2013 a woman walking her dog, a man unlocking his bakery, a child in a bright yellow coat running to catch the bus. Now say \u201cto protect\u201d", "lang": "en"}, {"text": "besch\u00fctzen", "lang": "de"}], [{"text": "Besch\u00fctzen. Ich habe dich besch\u00fctzt \u2013 I was protecting you. Now say \u201csensitive\u201d", "lang": "en"}, {"text": "empfindlich", "lang": "de"}], [{"text": "Empfindlich. Zu empfindlich \u2013 too sensitive. --\u201cI am not coming back,\u201d I said. \u201cNot for a visit. Not for a funeral. Not ever.\u201d \u201cYves \u2013\u201d \u201cThat country gave me nothing. You gave me nothing but obligation and guilt. I am done.\u201d \u201cYou are breaking my heart.\u201d \u201cYou broke mine first. Every day. For years.\u201d I hung up. Now say \u201cthe funeral\u201d", "lang": "en"}, {"text": "die Beerdigung", "lang": "de"}], [{"text": "Die Beerdigung. Feminine. Nicht f\u00fcr eine Beerdigung", "lang": "de"}, {"text": "\u2013 not for a funeral Now say \u201cobligation\u201d die Verpflichtung. Review", "lang": "en"}], [{"text": "Die Verpflichtung. Nichts als Verpflichtung und Schuld", "lang": "de"}, {"text": "\u2013 nothing but obligation and guilt. --Matei was standing in the doorway. His face was unreadable. He was holding two mugs of coffee. Black. No sugar. No milk. \u201cThat sounded hard,\u201d he said. \u201cIt was.\u201d He walked to me. Handed me a mug. I took it. The warmth spread through my hands. \u201cDo you want to talk about it?\u201d he asked. \u201cNo.\u201d \u201cOkay.\u201d Now say \u201cunreadable\u201d", "lang": "en"}, {"text": "undurchschaubar", "lang": "de"}], [{"text": "Undurchschaubar. Sein Gesicht war undurchschaubar \u2013 his face was unreadable. Now say \u201cthe warmth\u201d die W\u00e4rme. Review", "lang": "en"}], [{"text": "Die W\u00e4rme. Die W\u00e4rme breitete sich aus", "lang": "de"}, {"text": "\u2013 the warmth spread --We stood by the window. The radiator clicked. The coffee steamed. \u201cShe wanted me to come home,\u201d I said. \u201cI heard.\u201d \u201cI told her no.\u201d \u201cI heard that too.\u201d \u201cShe said I was breaking her heart.\u201d Matei was quiet for a moment. Then he said, \u201cShe broke yours first.\u201d \u201cThat is what I told her.\u201d \u201cGood.\u201d Now say \u201cto steam\u201d", "lang": "en"}, {"text": "dampfen", "lang": "de"}], [{"text": "Dampfen. Der Kaffee dampfte \u2013 the coffee steamed. Now say \u201cfirst\u201d", "lang": "en"}, {"text": "zuerst. Sie hat deins zuerst gebrochen \u2013 she broke yours first", "lang": "de"}, {"text": "We drank our coffee. The woman with the dog had disappeared. The bakery was open. \u201cYves.\u201d \u201cWhat?\u201d \u201cAre you okay?\u201d I thought about it. About my grandmother's voice. About the years of silence. About the weight I had been carrying since I was a child. \u201cI will be,\u201d I said. \u201cThat is not what I asked.\u201d \u201cI know.\u201d I turned to look at him. \u201cI am not okay. But I am here. And I am not running. That is something.\u201d He kissed my forehead. \u201cIt is everything.\u201d Now say \u201cthe weight\u201d", "lang": "en"}, {"text": "das Gewicht", "lang": "de"}], [{"text": "Das Gewicht. Neuter. Das Gewicht, das ich trug", "lang": "de"}, {"text": "\u2013 the weight I carried Now say \u201ceverything\u201d", "lang": "en"}, {"text": "alles", "lang": "de"}], [{"text": "Alles. Das ist alles \u2013 that is everything. --I went to work an hour late. Frau Schmidt was already behind the counter. Her good hand was working the espresso machine. \u201cYou are late,\u201d she said. \u201cI know.\u201d \u201cYour eyes are red.\u201d \u201cI have been crying.\u201d \u201cGood. Crying is healthy.\u201d She handed me an apron. \u201cNow work.\u201d Now say \u201cred\u201d", "lang": "en"}, {"text": "rot", "lang": "de"}], [{"text": "Rot. Deine Augen sind rot \u2013 your eyes are red. Now say \u201chealthy\u201d", "lang": "en"}, {"text": "gesund", "lang": "de"}], [{"text": "Gesund. Weinen ist gesund \u2013 crying is healthy. --I made a cappuccino for a woman at table three. Perfect foam. No burnt milk. She smiled. Frau Schmidt was watching me. \u201cYour grandmother,\u201d she said. \u201cHow did you know?\u201d \u201cMatei texted me. He said you might need a distraction.\u201d \u201cHe texted you?\u201d \u201cHe texts me every morning. To check on me. He is a good boy.\u201d She patted the counter. \u201cSit. Take a break. Tell me what happened.\u201d Now say \u201cthe foam\u201d", "lang": "en"}, {"text": "der Schaum", "lang": "de"}], [{"text": "Der Schaum. Masculine. Perfekter Schaum", "lang": "de"}, {"text": "\u2013 perfect foam Now say \u201cthe distraction\u201d", "lang": "en"}, {"text": "die Ablenkung", "lang": "de"}], [{"text": "Die Ablenkung. Feminine. Eine Ablenkung", "lang": "de"}, {"text": "\u2013 a distraction --I sat. The chair was cold. \u201cShe wanted me to come home,\u201d I said. \u201cTo Nigeria. She said she is dying.\u201d \u201cAre you going?\u201d \u201cNo.\u201d \u201cWhy not?\u201d Because I had spent my whole life doing what other people wanted. Because going back would feel like losing. Because I was finally happy. \u201cBecause I am done,\u201d I said. \u201cDone with the guilt. Done with the obligation. Done with being someone I am not.\u201d Now say \u201cto die\u201d", "lang": "en"}, {"text": "sterben", "lang": "de"}], [{"text": "Sterben. Sie sagte, sie w\u00fcrde sterben \u2013 she said she was dying. Now say \u201cguilt\u201d", "lang": "en"}, {"text": "die Schuld", "lang": "de"}], [{"text": "Die Schuld. Feminine. Schuldgef\u00fchle", "lang": "de"}, {"text": "\u2013 guilt feelings --Frau Schmidt nodded slowly. \u201cGood,\u201d she said. \u201cIt took me fifty years to learn that. You are faster than me.\u201d \u201cI had good teachers.\u201d She smiled. A small smile. Tired but real. \u201cNow clean the bathroom,\u201d she said. \u201cYou forgot yesterday.\u201d Now say \u201cfifty\u201d", "lang": "en"}, {"text": "f\u00fcnfzig", "lang": "de"}], [{"text": "F\u00fcnfzig. F\u00fcnfzig Jahre \u2013 fifty years. Now say \u201cfaster\u201d", "lang": "en"}, {"text": "schneller. Du bist schneller als ich \u2013 you are faster than me", "lang": "de"}, {"text": "That night, I sat at the table with a piece of paper and nothing written on it. Matei found me
