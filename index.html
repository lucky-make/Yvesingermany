 there. \u201cI want to write to her,\u201d I said. \u201cTo explain. In German.\u201d \u201cThat is a good idea.\u201d \u201cBut I do not know how to start.\u201d He sat on the plastic chair across from me. \u201cStart with Sehr geehrte,\u201d he said. \u201cThat means \u2018Dear\u2019 \u2013 but formal. Distant.\u201d Now say \u201cthe paper\u201d", "lang": "en"}, {"text": "das Papier", "lang": "de"}], [{"text": "Das Papier. Neuter. Ein St\u00fcck Papier", "lang": "de"}, {"text": "\u2013 a piece of paper Now say \u201cdistant\u201d", "lang": "en"}, {"text": "distanziert", "lang": "de"}], [{"text": "Distanziert. Distanziert \u2013 distant. --He helped me write the letter.", "lang": "en"}, {"text": "Sehr geehrte Gro\u00dfmutter,", "lang": "de"}, {"text": "I am alive. I am happy. I am engaged to a man named Matei. He is Romanian. He makes coffee and forgets to buy groceries and remembers everything I have ever told him. I am not coming back to Nigeria. Not for a visit. Not for a funeral. That chapter is closed. But I wanted you to know that I am okay. That the boy you raised found a place where he belongs. I do not need your blessing. I do not need your forgiveness. Goodbye, Yves Now say \u201cthe blessing\u201d", "lang": "en"}, {"text": "der Segen", "lang": "de"}], [{"text": "Der Segen. Masculine. Deinen Segen", "lang": "de"}, {"text": "\u2013 your blessing Now say \u201cthe forgiveness\u201d", "lang": "en"}, {"text": "die Vergebung", "lang": "de"}], [{"text": "Die Vergebung. Feminine. Deine Vergebung", "lang": "de"}, {"text": "\u2013 your forgiveness --I folded the letter. Put it in an envelope. Wrote her address. I did not mail it that night. The next morning, I handed it to Matei. \u201cMail this for me,\u201d I said. \u201cAre you sure?\u201d \u201cI am sure.\u201d He put the envelope in his coat pocket. Kissed my forehead. \u201cOkay.\u201d Now say \u201cto fold\u201d", "lang": "en"}, {"text": "falten", "lang": "de"}], [{"text": "Falten. Ich faltete den Brief \u2013 I folded the letter. Now say \u201cthe envelope\u201d", "lang": "en"}, {"text": "der Umschlag", "lang": "de"}], [{"text": "Der Umschlag. Masculine. Ein Umschlag", "lang": "de"}, {"text": "\u2013 an envelope --Dual-layer vocabulary review \u2013 Chapter 17 Layer 1 \u2013 Words", "lang": "en"}, {"text": "Der Festnetzanschluss", "lang": "de"}, {"text": "\u2013 the landline. <break time=\"2s\"/> Der Festnetzanschluss", "lang": "en"}, {"text": "Die Festnetznummer meiner Gro\u00dfmutter. Die Mailbox", "lang": "de"}, {"text": "\u2013 the voicemail. <break time=\"2s\"/> Die Mailbox. Die Mailbox schaltete sich ein. Schelten \u2013 to scold. <break time=\"2s\"/> Schelten. Sie schalt mich.", "lang": "en"}, {"text": "Das Blut", "lang": "de"}, {"text": "\u2013 the blood. <break time=\"2s\"/> Das Blut. Mein Blut gefror", "lang": "en"}, {"text": "Erziehen", "lang": "de"}, {"text": "\u2013 to raise (a child). <break time=\"2s\"/> Erziehen. Weil ihre Mutter sie richtig erzogen hat. Brechen \u2013 to crack (voice). <break time=\"2s\"/> Brechen. Ihre Stimme brach.", "lang": "en"}, {"text": "Die Tapete", "lang": "de"}, {"text": "\u2013 the wallpaper. <break time=\"2s\"/> Die Tapete. Die Tapete bl\u00e4tterte ab. Endg\u00fcltig \u2013 final. <break time=\"2s\"/> Endg\u00fcltig. Flach \u2013 shallow. <break time=\"2s\"/> Flach. Flache Atmung. Heiser \u2013 ragged (breathing). <break time=\"2s\"/> Heiser. Heiseres Atmen. Besch\u00fctzen \u2013 to protect. <break time=\"2s\"/> Besch\u00fctzen. Ich habe dich besch\u00fctzt. Empfindlich \u2013 sensitive. <break time=\"2s\"/> Empfindlich. Zu empfindlich.", "lang": "en"}, {"text": "Die Beerdigung", "lang": "de"}, {"text": "\u2013 the funeral. <break time=\"2s\"/> Die Beerdigung. Nicht f\u00fcr eine Beerdigung. Undurchschaubar \u2013 unreadable. <break time=\"2s\"/> Undurchschaubar. Sein Gesicht war undurchschaubar. Dampfen \u2013 to steam. <break time=\"2s\"/> Dampfen. Der Kaffee dampfte. Zuerst \u2013 first. <break time=\"2s\"/> Zuerst. Sie hat deins zuerst gebrochen.", "lang": "en"}, {"text": "Das Gewicht", "lang": "de"}, {"text": "\u2013 the weight. <break time=\"2s\"/> Das Gewicht. Das Gewicht, das ich trug. Alles \u2013 everything. <break time=\"2s\"/> Alles. Das ist alles. Rot \u2013 red. <break time=\"2s\"/> Rot. Deine Augen sind rot. Gesund \u2013 healthy. <break time=\"2s\"/> Gesund. Weinen ist gesund.", "lang": "en"}, {"text": "Der Schaum", "lang": "de"}, {"text": "\u2013 the foam. <break time=\"2s\"/> Der Schaum. Perfekter Schaum", "lang": "en"}, {"text": "Die Ablenkung", "lang": "de"}, {"text": "\u2013 the distraction. <break time=\"2s\"/> Die Ablenkung. Eine Ablenkung Sterben \u2013 to die. <break time=\"2s\"/> Sterben. Sie sagte, sie w\u00fcrde sterben.", "lang": "en"}, {"text": "Die Schuld", "lang": "de"}, {"text": "\u2013 guilt. <break time=\"2s\"/> Die Schuld. Schuldgef\u00fchle F\u00fcnfzig \u2013 fifty. <break time=\"2s\"/> F\u00fcnfzig. F\u00fcnfzig Jahre. Schneller \u2013 faster. <break time=\"2s\"/> Schneller. Du bist schneller als ich.", "lang": "en"}, {"text": "Das Papier", "lang": "de"}, {"text": "\u2013 the paper. <break time=\"2s\"/> Das Papier. Ein St\u00fcck Papier Distanziert \u2013 distant. <break time=\"2s\"/> Distanziert.", "lang": "en"}, {"text": "Der Segen", "lang": "de"}, {"text": "\u2013 the blessing. <break time=\"2s\"/> Der Segen. Deinen Segen", "lang": "en"}, {"text": "Die Vergebung", "lang": "de"}, {"text": "\u2013 the forgiveness. <break time=\"2s\"/> Die Vergebung. Deine Vergebung. Falten \u2013 to fold. <break time=\"2s\"/> Falten. Ich faltete den Brief.", "lang": "en"}, {"text": "Der Umschlag", "lang": "de"}, {"text": "\u2013 the envelope. <break time=\"2s\"/> Der Umschlag. Ein Umschlag Layer 2 \u2013 Story phrases \"Die Tapete bl\u00e4tterte ab.\" \u2013 The wallpaper was peeling. <break time=\"2s\"/> Die Tapete bl\u00e4tterte ab. \"Flache Atmung.\" \u2013 Shallow breathing. <break time=\"2s\"/> Flache Atmung. \"Ich habe dich besch\u00fctzt.\" \u2013 I was protecting you. <break time=\"2s\"/> Ich habe dich besch\u00fctzt. \"Nicht f\u00fcr eine Beerdigung.\" \u2013 Not for a funeral. <break time=\"2s\"/> Nicht f\u00fcr eine Beerdigung. \"Sein Gesicht war undurchschaubar.\" \u2013 His face was unreadable. <break time=\"2s\"/>", "lang": "en"}, {"text": "Sein Gesicht war undurchschaubar.", "lang": "de"}, {"text": "\"Das Gewicht, das ich trug.\" \u2013 The weight I carried. <break time=\"2s\"/> Das Gewicht, das ich trug. \"Deine Augen sind rot.\" \u2013 Your eyes are red. <break time=\"2s\"/> Deine Augen sind rot. \"Perfekter Schaum.\" \u2013 Perfect foam. <break time=\"2s\"/> Perfekter Schaum. \"Eine Ablenkung.\" \u2013 A distraction. <break time=\"2s\"/> Eine Ablenkung. \"Du bist schneller als ich.\" \u2013 You are faster than me. <break time=\"2s\"/> Du bist schneller als ich. --End of Chapter 17. --Chapter 18 \u2013 The Weight (B1-B2) (Narrator voice, calm, clear. Ambient: afternoon \u2013 caf\u00e9 ambience, soft chatter, espresso machine, distant street sounds.) The days after the phone call were strange. Not bad. Just strange. Like the world had shifted slightly and I had not found my balance yet. I went to work. I made coffee. I dropped a cup \u2013 only one \u2013 and Frau Schmidt did not say anything. She just swept up the pieces and patted my arm. Matei watched me. I could feel his eyes on me at night, when we sat on the sofa, when we ate dinner, when we lay in bed. He did not ask if I was okay. He knew I was not. He just waited. Ada came by every morning. Same latte. Same table by the window. She did not mention my grandmother. She did not have to. The silence was enough. Then, on the fourth day, something happened. Now say \u201cto shift\u201d", "lang": "en"}, {"text": "sich verschieben", "lang": "de"}], [{"text": "Sich verschieben. Die Welt hatte sich leicht verschoben \u2013 the world had shifted slightly. Now say \u201cthe balance\u201d", "lang": "en"}, {"text": "das Gleichgewicht", "lang": "de"}], [{"text": "Das Gleichgewicht. Neuter. Mein Gleichgewicht", "lang": "de"}, {"text": "\u2013 my balance --I was wiping down the counter when the bell chimed. A woman walked in. She was younger than Frau Schmidt, older than me. Dark hair. A face that looked familiar in a way I could not place. She ordered a tea. Chamomile. In German. Her accent was different \u2013 not German, something else. Romanian, maybe. \u201cYou are Yves,\u201d she said when I brought her tea. \u201cHow do you know my name?\u201d \u201cMatei talks about you.\u201d She smiled. It was a kind smile. Tired. \u201cI am his sister. Andreea.\u201d I stared at her. Matei had a sister. He had never mentioned her. Now say \u201cchamomile\u201d", "lang": "en"}, {"text": "die Kamille", "lang": "de"}], [{"text": "Die Kamille. Feminine. Kamillentee", "lang": "de"}, {"text": "\u2013 chamomile tea Now say \u201cthe sister\u201d", "lang": "en"}, {"text": "die Schwester", "lang": "de"}], [{"text": "Die Schwester. Feminine. Seine Schwester", "lang": "de"}, {"text": "\u2013 his sister --- \u201cHe does not talk about family,\u201d I said. \u201cI know. That is why I am here.\u201d She sat at the table by the window. I sat across from her. Frau Schmidt was in the back, pretending not to listen. \u201cIs he okay?\u201d Andreea asked. \u201cHe is fine.\u201d \u201cHe is not fine. He never is. But he is good at pretending.\u201d \u201cWhy do you not ask him yourself?\u201d \u201cBecause he will not answer my calls. He has not answered anyone's calls since he moved to Berlin.\u201d She wrapped her hands around her tea. \u201cI came to see him. To make sure he is alive.\u201d Now say \u201cto pretend\u201d vort\u00e4uschen. Review", "lang": "en"}], [{"text": "Vort\u00e4uschen. Er ist gut darin, vorzut\u00e4uschen \u2013 he is good at pretending. Now say \u201calive\u201d lebendig. Review", "lang": "en"}], [{"text": "Lebendig. Um sicherzugehen, dass er lebendig ist \u2013 to make sure he is alive. --\u201cHe is alive,\u201d I said. \u201cI can see that. You are living with him.\u201d \u201cYes.\u201d \u201cAre you together?\u201d \u201cYes.\u201d She nodded slowly. \u201cGood. He needs someone.\u201d \u201cWhy will he not talk to you?\u201d She was quiet for a moment. Then she said, \u201cBecause I am the one who told him to leave. When Sebastian left. I said, \u2018Come home. Forget Berlin. Start over.\u2019 He never forgave me.\u201d Now say \u201cto forgive\u201d", "lang": "en"}, {"text": "vergeben", "lang": "de"}], [{"text": "Vergeben. Er hat mir das nie vergeben \u2013 he never forgave me for that. Now say \u201cto start over\u201d", "lang": "en"}, {"text": "neu anfangen", "lang": "de"}], [{"text": "Neu anfangen. Fang neu an \u2013 start over. --\u201cThat is not your fault,\u201d I said. \u201cI know. But he was hurt. And I was the one he could be angry at.\u201d She took a sip of tea. \u201cI do not want to be angry anymore. I just want my brother back.\u201d I looked at her. At the tired eyes, the way her hands shook a little when she held the cup. She was scared. The same way I had been scared, standing in the airport, holding a key from a man I did not know. \u201cHe works at the bookstore on Karl-Marx-Allee,\u201d I said. \u201cHe is there until six.\u201d \u201cWill he talk to me?\u201d \u201cI do not know. But he will listen. That is something.\u201d Now say \u201cthe fault\u201d", "lang": "en"}, {"text": "die Schuld", "lang": "de"}], [{"text": "Die Schuld. Feminine. Das ist nicht deine Schuld", "lang": "de"}, {"text": "\u2013 that is not your fault Now say \u201cto listen\u201d zuh\u00f6ren. Review", "lang": "en"}], [{"text": "Zuh\u00f6ren. Aber er wird zuh\u00f6ren", "lang": "de"}, {"text": "\u2013 but he will listen --- She finished her tea. Stood up. \u201cThank you, Yves.\u201d \u201cDo not thank me. Just go.\u201d She left. The bell chimed. The door closed. Frau Schmidt came out from the back. \u201cThat was Matei's sister,\u201d she said. \u201cI know.\u201d \u201cShe has been trying to reach him for years.\u201d \u201cI know.\u201d \u201cHe is stubborn.\u201d \u201cI know.\u201d She patted my arm. \u201cSo are you. That is why you work.\u201d Now say \u201cstubborn\u201d stur. Review", "lang": "en"}], [{"text": "Stur. Er ist stur \u2013 he is stubborn. Now say \u201cto work\u201d", "lang": "en"}, {"text": "funktionieren. Deshalb funktioniert ihr \u2013 that is why you work", "lang": "de"}, {"text": "(as a couple). --I closed the caf\u00e9 early. Walked to the bookstore. Matei was behind the counter, stacking shelves. He did not see me at first. His back was to the door. \u201cYour sister came by the caf\u00e9,\u201d I said. He froze. Turned. \u201cWhat did she want?\u201d \u201cTo see you. To apologise. To make sure you are alive.\u201d \u201cI am alive.\u201d \u201cShe knows. She saw you. Through me.\u201d He put the book down. Walked to the door. Locked it. Now say \u201cto stack\u201d", "lang": "en"}, {"text": "stapeln", "lang": "de"}], [{"text": "Stapeln. Er stapelte B\u00fccher \u2013 he was stacking books. Now say \u201cto freeze\u201d", "lang": "en"}, {"text": "erstarren", "lang": "de"}], [{"text": "Erstarren. Er erstarrte", "lang": "de"}, {"text": "\u2013 he froze --\u201cI do not want to see her,\u201d he said. \u201cWhy not?\u201d \u201cBecause I am not ready.\u201d \u201cWhen will you be ready?\u201d He did not answer. \u201cMatei.\u201d I walked to him. Put my hand on his arm. \u201cShe is your sister. She came all the way from Romania. She is scared.\u201d \u201cShe should have thought about that before she told me to leave.\u201d \u201cShe was trying to protect you.\u201d \u201cShe was trying to control me.\u201d Now say \u201cto control\u201d", "lang": "en"}, {"text": "kontrollieren", "lang": "de"}], [{"text": "Kontrollieren. Sie versuchte, mich zu kontrollieren \u2013 she was trying to control me. Now say \u201call the way\u201d", "lang": "en"}, {"text": "den ganzen Weg", "lang": "de"}], [{"text": "Den ganzen Weg. Sie kam den ganzen Weg aus Rum\u00e4nien \u2013 she came all the way from Romania. --\u201cMaybe. But she is here now. And she is not leaving until you talk to her.\u201d He pulled his arm away. Walked to the window. \u201cI do not know how,\u201d he said. \u201cHow to talk to her?\u201d \u201cHow to forgive her.\u201d I stood next to him. Did not touch him. \u201cYou do not have to forgive her today,\u201d I said. \u201cYou just have to listen.\u201d \u201cThat is the same thing.\u201d \u201cNo. Listening is easy. Forgiveness takes time.\u201d Now say \u201cto forgive\u201d vergeben. Review", "lang": "en"}], [{"text": "Vergeben. Wie man ihr vergibt \u2013 how to forgive her. Now say \u201ceasy\u201d", "lang": "en"}, {"text": "einfach", "lang": "de"}], [{"text": "Einfach. Zuh\u00f6ren ist einfach", "lang": "de"}, {"text": "\u2013 listening is easy --He was quiet for a long moment. \u201cWhen did you get so wise?\u201d he asked. \u201cI have always been wise. You just were not listening.\u201d He almost smiled. \u201cOkay,\u201d he said. \u201cOkay?\u201d \u201cOkay. I will see her. Tomorrow. Not today.\u201d \u201cThat is enough.\u201d He pulled me into his arms. I rested my head on his chest. \u201cThank you,\u201d he said. \u201cDo not thank me. Just listen to her.\u201d Now say \u201cwise\u201d", "lang": "en"}, {"text": "weise", "lang": "de"}], [{"text": "Weise. Du bist weise \u2013 you are wise. Now say \u201cto rest\u201d", "lang": "en"}, {"text": "ruhen. Mein Kopf ruhte auf seiner Brust \u2013 my head rested on", "lang": "de"}, {"text": "his chest. --The next day, Andreea came to the caf\u00e9 at noon. Matei was waiting. He had taken the day off work. He was sitting at the table by the window. I made coffee. Black. Two cups. Set them on the table. \u201cYou do not have to stay,\u201d Matei said. \u201cI know.\u201d \u201cBut you are going to.\u201d \u201cI am going to be in the back. Cleaning. Pretending not to listen.\u201d \u201cThat is the same as staying.\u201d \u201cSame thing.\u201d Now say \u201cthe day off\u201d", "lang": "en"}, {"text": "der freie Tag", "lang": "de"}], [{"text": "Der freie Tag. Er hatte sich freigenommen", "lang": "de"}, {"text": "\u2013 he had taken the day off Now say \u201cto clean\u201d", "lang": "en"}, {"text": "putzen or reinigen. Ich putze \u2013 I am cleaning", "lang": "de"}, {"text": "I walked to the back. Frau Schmidt was already there, pretending to count cups. \u201cYou are nosy,\u201d I said. \u201cI am curious. There is a difference.\u201d The bell chimed. Andreea walked in. I watched through the crack in the door. She sat across from Matei. They did not touch. They did not speak for a long time. Then Andreea said something in Romanian. Matei answered. Her voice cracked. His did not. Now say \u201cnosy\u201d", "lang": "en"}, {"text": "neugierig", "lang": "de"}], [{"text": "Neugierig. Du bist neugierig \u2013 you are nosy. Now say \u201cthe crack\u201d", "lang": "en"}, {"text": "der Spalt", "lang": "de"}], [{"text": "Der Spalt. Masculine. Durch den Spalt in der T\u00fcr", "lang": "de"}, {"text": "\u2013 through the crack in the door --They talked for an hour. I cleaned the same counter three times. Frau Schmidt counted the same stack of cups twice. Neither of us said anything. When Andreea stood up, she hugged Matei. He did not hug back at first. Then his arms went around her. His face was hidden in her shoulder. She left. The bell chimed. The door closed. Matei sat back down. Stared at the table. I walked out of the back. Sat across from him. Now say \u201cto hide\u201d", "lang": "en"}, {"text": "verstecken. Sein Gesicht war in ihrer Schulter versteckt \u2013 his", "lang": "de"}, {"text": "face was hidden in her shoulder. Now say \u201cthe counter\u201d", "lang": "en"}, {"text": "die Theke", "lang": "de"}], [{"text": "Die Theke. Feminine. Ich putzte die Theke", "lang": "de"}, {"text": "\u2013 I cleaned the counter --\u201cHow was it?\u201d I asked. \u201cHard.\u201d \u201cDid you forgive her?\u201d \u201cNot yet. But I listened.\u201d \u201cThat is enough.\u201d He looked at me. His eyes were red. \u201cShe said she is proud of me.\u201d \u201cShe should be.\u201d \u201cShe said she is sorry. For telling me to leave. For not coming sooner.\u201d \u201cShe meant it.\u201d \u201cI know.\u201d He reached across the table. Took my hand. \u201cI am tired.\u201d \u201cThen go home. I will close the caf\u00e9.\u201d Now say \u201cproud\u201d", "lang": "en"}, {"text": "stolz", "lang": "de"}], [{"text": "Stolz. Sie sagte, sie sei stolz auf mich \u2013 she said she was proud of me. Now say \u201cto mean it\u201d", "lang": "en"}, {"text": "es ernst meinen", "lang": "de"}], [{"text": "Es ernst meinen. Sie meinte es ernst", "lang": "de"}, {"text": "\u2013 she meant it --\u201cYou have to clean the bathroom,\u201d he said. \u201cI will clean it tomorrow.\u201d \u201cFrau Schmidt will notice.\u201d \u201cFrau Schmidt is in the back pretending not to listen.\u201d He almost smiled. Almost. \u201cOkay,\u201d he said. \u201cI will go home.\u201d \u201cI will be there soon.\u201d He stood up. Kissed my forehead. Walked to the door. \u201cYves.\u201d \u201cWhat?\u201d \u201cThank you.\u201d \u201cDo not thank me. Just be there when I get home.\u201d \u201cI will.\u201d Now say \u201cto notice\u201d bemerken. Review", "lang": "en"}], [{"text": "Bemerken. Frau Schmidt wird es bemerken \u2013 Frau Schmidt will notice. Now say \u201csoon\u201d", "lang": "en"}, {"text": "bald", "lang": "de"}], [{"text": "Bald. Ich werde bald da sein \u2013 I will be there soon. --He left. The bell chimed. The door closed. Frau Schmidt came out of the back. \u201cYou are a good boyfriend,\u201d she said. \u201cI am trying.\u201d \u201cThat is the same thing.\u201d I laughed. It was small, but it was real. \u201cClean the bathroom,\u201d she said. \u201cYou forgot yesterday.\u201d Now say \u201cto try\u201d versuchen. Review", "lang": "en"}], [{"text": "Versuchen. Ich versuche es \u2013 I am trying. Now say \u201cto forget\u201d vergessen. Review", "lang": "en"}], [{"text": "Vergessen. Du hast gestern vergessen", "lang": "de"}, {"text": "\u2013 you forgot yesterday --That night, Matei was on the sofa. The lamp was on. The radiator clicked. The plant was still alive. I sat next to him. He leaned into me. \u201cAndreea is staying in Berlin for a week,\u201d he said. \u201cThat is good.\u201d \u201cShe wants to have dinner. The three of us.\u201d \u201cThat is also good.\u201d \u201cAre you nervous?\u201d \u201cA little.\u201d \u201cMe too.\u201d I put my arm around him. \u201cWe will be nervous together,\u201d I said. \u201cSame thing.\u201d \u201cSame thing.\u201d Now say \u201cto stay\u201d", "lang": "en"}, {"text": "bleiben. Sie bleibt eine Woche in Berlin \u2013 she is staying in", "lang": "de"}, {"text": "Berlin for a week.", "lang": "en"}], [{"text": "Bleiben. Sie bleibt eine Woche", "lang": "de"}, {"text": "\u2013 she is staying for a week Now say \u201cnervous\u201d nerv\u00f6s. Review", "lang": "en"}], [{"text": "Nerv\u00f6s. Bist du nerv\u00f6s? \u2013 are you nervous? --He kissed my shoulder. \u201cI love you,\u201d he said. \u201cI love you too.\u201d We sat like that until the lamp flickered and the street went quiet. Tomorrow, there would be dinner. And questions. And the slow work of forgiveness. But tonight, we were here. And that was enough. Now say \u201cthe shoulder\u201d die Schulter. Review", "lang": "en"}], [{"text": "Die Schulter. Er k\u00fcsste meine Schulter", "lang": "de"}, {"text": "\u2013 he kissed my shoulder Now say \u201cthe work\u201d", "lang": "en"}, {"text": "die Arbeit. Die langsame Arbeit der Vergebung \u2013 the slow work", "lang": "de"}, {"text": "of forgiveness. --- Dual-layer vocabulary review \u2013 Chapter 18 Layer 1 \u2013 Words Sich verschieben \u2013 to shift. <break time=\"2s\"/> Sich verschieben. Die Welt hatte sich verschoben.", "lang": "en"}, {"text": "Das Gleichgewicht", "lang": "de"}, {"text": "\u2013 the balance. <break time=\"2s\"/> Das Gleichgewicht. Mein Gleichgewicht.", "lang": "en"}, {"text": "Die Kamille", "lang": "de"}, {"text": "\u2013 chamomile. <break time=\"2s\"/> Die Kamille. Kamillentee", "lang": "en"}, {"text": "Die Schwester", "lang": "de"}, {"text": "\u2013 the sister. <break time=\"2s\"/> Die Schwester. Seine Schwester Neu anfangen \u2013 to start over. <break time=\"2s\"/> Neu anfangen. Fang neu an.", "lang": "en"}, {"text": "Zuh\u00f6ren", "lang": "de"}, {"text": "\u2013 to listen. <break time=\"2s\"/> Zuh\u00f6ren. Er wird zuh\u00f6ren Stapeln \u2013 to stack. <break time=\"2s\"/> Stapeln. Er stapelte B\u00fccher.", "lang": "en"}, {"text": "Erstarren", "lang": "de"}, {"text": "\u2013 to freeze. <break time=\"2s\"/> Erstarren. Er erstarrte Kontrollieren \u2013 to control. <break time=\"2s\"/> Kontrollieren. Sie versuchte, mich zu kontrollieren. Den ganzen Weg \u2013 all the way. <break time=\"2s\"/> Den ganzen Weg. Den ganzen Weg aus Rum\u00e4nien.", "lang": "en"}, {"text": "Einfach", "lang": "de"}, {"text": "\u2013 easy. <break time=\"2s\"/> Einfach. Zuh\u00f6ren ist einfach Weise \u2013 wise. <break time=\"2s\"/> Weise. Du bist weise. Ruhen \u2013 to rest. <break time=\"2s\"/> Ruhen. Mein Kopf ruhte auf seiner Brust.", "lang": "en"}, {"text": "Der freie Tag", "lang": "de"}, {"text": "\u2013 the day off. <break time=\"2s\"/> Der freie Tag. Er hatte sich freigenommen. Neugierig \u2013 nosy. <break time=\"2s\"/> Neugierig. Du bist neugierig.", "lang": "en"}, {"text": "Der Spalt", "lang": "de"}, {"text": "\u2013 the crack. <break time=\"2s\"/> Der Spalt. Durch den Spalt in der T\u00fcr", "lang": "en"}, {"text": "Die Theke", "lang": "de"}, {"text": "\u2013 the counter. <break time=\"2s\"/> Die Theke. Ich putzte die Theke Stolz \u2013 proud. <break time=\"2s\"/> Stolz. Sie sagte, sie sei stolz auf mich.", "lang": "en"}, {"text": "Es ernst meinen", "lang": "de"}, {"text": "\u2013 to mean it. <break time=\"2s\"/> Es ernst meinen. Sie meinte es ernst. Bald \u2013 soon. <break time=\"2s\"/> Bald. Ich werde bald da sein. Layer 2 \u2013 Story phrases \"Die Welt hatte sich verschoben.\" \u2013 The world had shifted. <break time=\"2s\"/> Die Welt hatte sich verschoben. \"Ich bin neugierig.\" \u2013 I am nosy. <break time=\"2s\"/> Ich bin neugierig. \"Fang neu an.\" \u2013 Start over. <break time=\"2s\"/> Fang neu an. \"Er wird zuh\u00f6ren.\" \u2013 He will listen. <break time=\"2s\"/> Er wird zuh\u00f6ren. \"Er erstarrte.\" \u2013 He froze. <break time=\"2s\"/> Er erstarrte. \"Zuh\u00f6ren ist einfach.\" \u2013 Listening is easy. <break time=\"2s\"/> Zuh\u00f6ren ist einfach. \"Du bist weise.\" \u2013 You are wise. <break time=\"2s\"/> Du bist weise. \"Ich werde bald da sein.\" \u2013 I will be there soon. <break time=\"2s\"/> Ich werde bald da sein. --End of Chapter 18. Chapters 19, 20, and 21 \u2013 Refined Audio Scripts Here are the final three chapters in the hybrid style. Chapter 19 focuses on formal register (Sie) and Konjunktiv II for polite requests. Chapter 20 introduces the proposal and future tense. Chapter 21 consolidates with subordinate clauses and infinitive constructions. --Chapter 19 \u2013 The Sister (B1-B2) (Narrator voice, calm, clear. Ambient: guesthouse \u2013 creaking floorboards, distant kettle, soft evening light.) The dinner was at Andreea's hotel. Not a hotel, really. A guesthouse in Prenzlauer Berg, the kind with creaky floors and a shared bathroom at the end of the hall. She had been staying there for three days, waiting for Matei to be ready. Now he was ready. Or ready enough. \u201cYou do not have to come,\u201d Matei said for the fifth time. We were standing outside the building. The street was quiet. A cat watched us from a windowsill. \u201cI know.\u201d \u201cShe is going to ask a lot of questions.\u201d \u201cI know.\u201d \u201cSome of them will be about you. Your past. Your family.\u201d \u201cI know.\u201d He turned to look at me. \u201cAre you sure?\u201d Now say \u201cthe guesthouse\u201d", "lang": "en"}, {"text": "die Pension", "lang": "de"}], [{"text": "Die Pension. Feminine. Eine Pension in Prenzlauer Berg", "lang": "de"}, {"text": "\u2013 a guesthouse in Prenzlauer Berg. Now say \u201ccreaky\u201d", "lang": "en"}, {"text": "knarrend", "lang": "de"}], [{"text": "Knarrend. Knarrende B\u00f6den \u2013 creaky floors. --I thought about it. About my grandmother. About Nigeria. About all the things I had spent my life hiding. \u201cI am sure,\u201d I said. \u201cShe is your sister. I want her to know me.\u201d He kissed my forehead. \u201cOkay.\u201d We walked inside. Now say \u201cto hide\u201d verstecken. Review", "lang": "en"}], [{"text": "Verstecken. Die Dinge, die ich versteckt hatte \u2013 the things I had hidden. Now say \u201cinside\u201d", "lang": "en"}, {"text": "hinein or herein. Wir gingen hinein \u2013 we walked inside", "lang": "de"}, {"text": "Andreea's room was small. A bed, a table, two chairs, a kettle. She had ordered food from a Romanian restaurant down the street \u2013 containers of something that smelled like paprika and garlic and home, even though I had never been to Romania. \u201cYou came,\u201d she said, opening the door. \u201cWe said we would.\u201d \u201cMatei says a lot of things.\u201d She hugged him. He let her. \u201cCome in. Sit. Eat.\u201d We sat. The chairs were wooden and uncomfortable. Now say \u201cthe kettle\u201d", "lang": "en"}, {"text": "der Wasserkocher", "lang": "de"}], [{"text": "Der Wasserkocher. Masculine. Ein Wasserkocher", "lang": "de"}, {"text": "\u2013 a kettle Now say \u201cthe container\u201d", "lang": "en"}, {"text": "der Beh\u00e4lter", "lang": "de"}], [{"text": "Der Beh\u00e4lter. Masculine. Beh\u00e4lter mit Essen", "lang": "de"}, {"text": "\u2013 containers of food --\u201cYves,\u201d Andreea said, handing me a fork. \u201cMatei tells me you run a caf\u00e9.\u201d \u201cI work at a caf\u00e9. Frau Schmidt owns it.\u201d \u201cHe tells me you are going to take over when she retires.\u201d I looked at Matei. He was studying the ceiling. \u201cWe have not talked about that,\u201d I said. \u201cMatei talks about everything. Just not to the people he should.\u201d She smiled. It was Matei's smile \u2013 the same shape, the same hesitation. \u201cEat. Before it gets cold.\u201d Now say \u201cto retire\u201d", "lang": "en"}, {"text": "in Rente gehen", "lang": "de"}], [{"text": "In Rente gehen. Wenn sie in Rente geht \u2013 when she retires. Now say \u201cthe ceiling\u201d die Decke. Review", "lang": "en"}], [{"text": "Die Decke. Er studierte die Decke", "lang": "de"}, {"text": "\u2013 he was studying the ceiling --We ate. The food was good. Better than good. I did not know the names of half the dishes, but I ate everything on my plate and reached for more. \u201cYou cook?\u201d Andreea asked. \u201cPasta. My grandmother's recipe.\u201d \u201cShe taught you?\u201d \u201cI watched her. She did not teach. She just did.\u201d Andreea nodded. \u201cThat is how Matei learned. Watching. Not asking.\u201d Matei did not look up from his plate. \u201cI asked questions,\u201d he said. \u201cYou asked yourself. Not me.\u201d Now say \u201cthe recipe\u201d", "lang": "en"}, {"text": "das Rezept", "lang": "de"}], [{"text": "Das Rezept. Neuter. Das Rezept meiner Gro\u00dfmutter", "lang": "de"}, {"text": "\u2013 my grandmother's recipe Now say \u201cto watch\u201d", "lang": "en"}, {"text": "beobachten. Ich habe sie beobachtet \u2013 I watched her", "lang": "de"}, {"text": "\u201cYou were busy,\u201d Matei said. \u201cI was always busy. That is not an excuse.\u201d She set her fork down. \u201cI should have been there. After Sebastian. I should have come to Berlin. Instead, I told you to come home.\u201d \u201cYou were trying to protect me.\u201d \u201cI was trying to control you. There is a difference.\u201d Matei finally looked up. His grey eyes met hers. \u201cI know,\u201d he said. \u201cI have had a lot of practice with people who confuse the two.\u201d Now say \u201cthe excuse\u201d", "lang": "en"}, {"text": "die Ausrede", "lang": "de"}], [{"text": "Die Ausrede. Feminine. Das ist keine Ausrede", "lang": "de"}, {"text": "\u2013 that is not an excuse Now say \u201cto confuse\u201d", "lang": "en"}, {"text": "verwechseln", "lang": "de"}], [{"text": "Verwechseln. Menschen, die die beiden verwechseln \u2013 people who confuse the two. --The room was quiet. The kettle clicked as it cooled. \u201cI am sorry,\u201d Andreea said. \u201cI know.\u201d \u201cI am not going to say it again.\u201d \u201cI would not believe you if you did.\u201d She almost smiled. \u201cYou are still angry.\u201d \u201cI am not angry. I am tired.\u201d \u201cSame thing.\u201d \u201cNo.\u201d He reached for my hand under the table. \u201cAngry is what I was. Tired is what I am now. And tired is better.\u201d Now say \u201cto cool\u201d", "lang": "en"}, {"text": "abk\u00fchlen", "lang": "de"}], [{"text": "Abk\u00fchlen. Der Wasserkocher k\u00fchlte ab \u2013 the kettle cooled down. Now say \u201cto reach\u201d", "lang": "en"}, {"text": "greifen. Er griff nach meiner Hand \u2013 he reached for my hand", "lang": "de"}, {"text": "Andreea looked at our hands. Then at me. \u201cTake care of him,\u201d she said. \u201cI am trying.\u201d \u201cTry harder.\u201d I laughed. She did not. \u201cI am serious,\u201d she said. \u201cHe does not ask for help. He does not tell you when he is hurting. He just disappears into himself and waits for it to pass.\u201d \u201cI know.\u201d \u201cThen you know it is not easy.\u201d \u201cNothing easy is worth doing.\u201d She stared at me for a long moment. Then she laughed. A surprised laugh. \u201cMatei,\u201d she said. \u201cI like him.\u201d \u201cI know,\u201d Matei said. \u201cThat is why I kept him.\u201d Now say \u201cto disappear\u201d", "lang": "en"}, {"text": "verschwinden", "lang": "de"}], [{"text": "Verschwinden. Er verschwindet in sich selbst \u2013 he disappears into himself. Now say \u201csurprised\u201d", "lang": "en"}, {"text": "\u00fcberrascht", "lang": "de"}], [{"text": "\u00dcberrascht. Ein \u00fcberraschtes Lachen \u2013 a surprised laugh. --After dinner, we walked Andreea to the U-Bahn. She was leaving tomorrow. Back to Romania. Back to her life. \u201cYou will come visit?\u201d she asked Matei. \u201cMaybe.\u201d \u201cThat is not yes.\u201d \u201cIt is not no.\u201d She hugged him. Held on. \u201cI am proud of you,\u201d she whispered. \u201cI know.\u201d She pulled back. Looked at me. \u201cYou too, Yves. Come visit. Bring the caf\u00e9.\u201d \u201cI will bring coffee.\u201d \u201cGood enough.\u201d Now say \u201cto whisper\u201d fl\u00fcstern. Review", "lang": "en"}], [{"text": "Fl\u00fcstern. Sie fl\u00fcsterte \u2013 she whispered. Now say \u201cgood enough\u201d", "lang": "en"}, {"text": "gut genug", "lang": "de"}], [{"text": "Gut genug. Gut genug", "lang": "de"}, {"text": "\u2013 good enough --She walked down the stairs. Disappeared into the station. Matei stood there for a long moment, staring at the empty staircase. \u201cYou okay?\u201d I asked. \u201cI will be.\u201d \u201cThat is not what I asked.\u201d He turned to me. His eyes were wet. \u201cShe said she is proud of me.\u201d \u201cI heard.\u201d \u201cNo one has ever said that before. Not like that.\u201d I put my hand on his face. \u201cI am proud of you too.\u201d \u201cYou have to say that. You are my boyfriend.\u201d \u201cI do not have to say anything. I choose to.\u201d Now say \u201cthe staircase\u201d", "lang": "en"}, {"text": "das Treppenhaus", "lang": "de"}], [{"text": "Das Treppenhaus. Neuter. Das leere Treppenhaus", "lang": "de"}, {"text": "\u2013 the empty staircase Now say \u201cto choose\u201d", "lang": "en"}, {"text": "w\u00e4hlen or sich entscheiden. Ich entscheide mich dazu \u2013 I", "lang": "de"}, {"text": "choose to. --He kissed me. On the street. In front of the U-Bahn station. \u201cLet us go home,\u201d he said. \u201cOkay.\u201d We walked. The streets were dark. The streetlights cast orange light on the pavement. His hand was in mine. \u201cMatei.\u201d \u201cWhat?\u201d \u201cWhat did Andreea mean? About me taking over the caf\u00e9?\u201d He was quiet for a moment. \u201cFrau Schmidt is getting old. Her hand is not getting better. She is going to need to sell it eventually.\u201d \u201cAnd you think I should buy it?\u201d \u201cI think you should think about it.\u201d Now say \u201cto sell\u201d", "lang": "en"}, {"text": "verkaufen", "lang": "de"}], [{"text": "Verkaufen. Sie wird es irgendwann verkaufen m\u00fcssen \u2013 she will have to sell it eventually. Now say \u201cto buy\u201d", "lang": "en"}, {"text": "kaufen. Soll ich es kaufen? \u2013 should I buy it?", "lang": "de"}, {"text": "\u201cI do not have money.\u201d \u201cYou have time. The caf\u00e9 is not going anywhere.\u201d I thought about it. About the green awning. The chalkboard sign. The espresso machine that hissed like a cat. The blue notebook with all the passwords. \u201cI will think about it,\u201d I said. \u201cThat is all I ask.\u201d Now say \u201cthe awning\u201d die Markise. Review", "lang": "en"}], [{"text": "Die Markise. Die gr\u00fcne Markise", "lang": "de"}, {"text": "\u2013 the green awning Now say \u201cthe password\u201d", "lang": "en"}, {"text": "das Passwort", "lang": "de"}], [{"text": "Das Passwort. Neuter. Die Passw\u00f6rter", "lang": "de"}, {"text": "\u2013 the passwords --That night, I lay in bed and stared at the ceiling. Matei was asleep next to me. His arm was around my waist. His breathing was slow and even. I thought about Nigeria. About my grandmother. About the life I had left behind. I thought about Berlin. About the caf\u00e9. About Matei. I thought about the word home and what it actually meant. Now say \u201cthe waist\u201d", "lang": "en"}, {"text": "die Taille", "lang": "de"}], [{"text": "Die Taille. Feminine. Sein Arm um meine Taille", "lang": "de"}, {"text": "\u2013 his arm around my waist Now say \u201ceven\u201d", "lang": "en"}, {"text": "gleichm\u00e4ssig", "lang": "de"}], [{"text": "Gleichm\u00e4ssig. Gleichm\u00e4ssiges Atmen \u2013 even breathing. --My phone buzzed. Ada. How was dinner? Good. Weird. Good. Are you okay? I think so. That is not a yes. It is not no either. Go to sleep, Yves. You too, Ada. I put the phone away. Turned over. Pressed my face into Matei's shoulder. He made a sound. Not a word. Just a sound. A sleepy, contented sound. I closed my eyes. Tomorrow, there would be work. And coffee. And dropped cups. But tonight, I was here. Now say \u201ccontented\u201d", "lang": "en"}, {"text": "zufrieden", "lang": "de"}], [{"text": "Zufrieden. Ein zufriedener Laut \u2013 a contented sound. Now say \u201cto press\u201d", "lang": "en"}, {"text": "dr\u00fccken. Ich dr\u00fcckte mein Gesicht in seine Schulter \u2013 I", "lang": "de"}, {"text": "pressed my face into his shoulder. --Dual-layer vocabulary review \u2013 Chapter 19 Layer 1 \u2013 Words", "lang": "en"}, {"text": "Die Pension", "lang": "de"}, {"text": "\u2013 the guesthouse. <break time=\"2s\"/> Die Pension. Eine Pension in Prenzlauer Berg. Knarrend \u2013 creaky. <break time=\"2s\"/> Knarrend. Knarrende B\u00f6den.", "lang": "en"}, {"text": "Der Wasserkocher", "lang": "de"}, {"text": "\u2013 the kettle. <break time=\"2s\"/> Der Wasserkocher. Ein Wasserkocher.", "lang": "en"}, {"text": "Der Beh\u00e4lter", "lang": "de"}, {"text": "\u2013 the container. <break time=\"2s\"/> Der Beh\u00e4lter. Beh\u00e4lter mit Essen In Rente gehen \u2013 to retire. <break time=\"2s\"/> In Rente gehen. Wenn sie in Rente geht.", "lang": "en"}, {"text": "Das Rezept", "lang": "de"}, {"text": "\u2013 the recipe. <break time=\"2s\"/> Das Rezept. Das Rezept meiner Gro\u00dfmutter.", "lang": "en"}, {"text": "Die Ausrede", "lang": "de"}, {"text": "\u2013 the excuse. <break time=\"2s\"/> Die Ausrede. Das ist keine Ausrede Verwechseln \u2013 to confuse. <break time=\"2s\"/> Verwechseln. Menschen, die die beiden verwechseln. Abk\u00fchlen \u2013 to cool down. <break time=\"2s\"/> Abk\u00fchlen. Der Wasserkocher k\u00fchlte ab. Greifen \u2013 to reach. <break time=\"2s\"/> Greifen. Er griff nach meiner Hand. Verschwinden \u2013 to disappear. <break time=\"2s\"/> Verschwinden. Er verschwindet in sich selbst. \u00dcberrascht \u2013 surprised. <break time=\"2s\"/> \u00dcberrascht. Ein \u00fcberraschtes Lachen.", "lang": "en"}, {"text": "Gut genug", "lang": "de"}, {"text": "\u2013 good enough. <break time=\"2s\"/> Gut genug", "lang": "en"}, {"text": "Das Treppenhaus", "lang": "de"}, {"text": "\u2013 the staircase. <break time=\"2s\"/> Das Treppenhaus. Das leere Treppenhaus. Sich entscheiden \u2013 to choose. <break time=\"2s\"/> Sich entscheiden. Ich entscheide mich dazu. Verkaufen \u2013 to sell. <break time=\"2s\"/> Verkaufen. Sie wird es verkaufen m\u00fcssen.", "lang": "en"}, {"text": "Die Markise", "lang": "de"}, {"text": "\u2013 the awning. <break time=\"2s\"/> Die Markise. Die gr\u00fcne Markise", "lang": "en"}, {"text": "Das Passwort", "lang": "de"}, {"text": "\u2013 the password. <break time=\"2s\"/> Das Passwort. Die Passw\u00f6rter", "lang": "en"}, {"text": "Die Taille", "lang": "de"}, {"text": "\u2013 the waist. <break time=\"2s\"/> Die Taille. Sein Arm um meine Taille Gleichm\u00e4ssig \u2013 even (breathing). <break time=\"2s\"/> Gleichm\u00e4ssig. Gleichm\u00e4ssiges Atmen. Zufrieden \u2013 contented. <break time=\"2s\"/> Zufrieden. Ein zufriedener Laut. Dr\u00fccken \u2013 to press. <break time=\"2s\"/> Dr\u00fccken. Ich dr\u00fcckte mein Gesicht in seine Schulter. Layer 2 \u2013 Story phrases \"Eine Pension in Prenzlauer Berg.\" \u2013 A guesthouse in Prenzlauer Berg. <break time=\"2s\"/> Eine Pension in Prenzlauer Berg. \"Das Rezept meiner Gro\u00dfmutter.\" \u2013 My grandmother's recipe. <break time=\"2s\"/> Das Rezept meiner Gro\u00dfmutter. \"Das ist keine Ausrede.\" \u2013 That's not an excuse. <break time=\"2s\"/> Das ist keine Ausrede. \"Er verschwindet in sich selbst.\" \u2013 He disappears into himself. <break time=\"2s\"/>", "lang": "en"}, {"text": "Er verschwindet in sich selbst.", "lang": "de"}, {"text": "\"Ein \u00fcberraschtes Lachen.\" \u2013 A surprised laugh. <break time=\"2s\"/> Ein \u00fcberraschtes Lachen. \"Gut genug.\" \u2013 Good enough. <break time=\"2s\"/> Gut genug. \"Ich entscheide mich dazu.\" \u2013 I choose to. <break time=\"2s\"/> Ich entscheide mich dazu. \"Die gr\u00fcne Markise.\" \u2013 The green awning. <break time=\"2s\"/> Die gr\u00fcne Markise. --End of Chapter 19. --- Chapter 20 \u2013 The Question (B1-B2) (Narrator voice, calm, clear. Ambient: evening \u2013 soft rain, candle flicker, distant traffic.) The caf\u00e9 was quiet. It was a Tuesday in late March. The grey sky had finally cracked open, and a thin, watery sun was coming through the window. Frau Schmidt was at her usual table, her good hand wrapped around a cup of tea, her bad hand resting in her lap. She was getting stronger. But she was also getting older. I could see it in the way she moved \u2013 slower, more careful, like she was saving her energy for something. \u201cYou are staring,\u201d she said without looking up. \u201cI am observing.\u201d \u201cSame thing.\u201d She set her cup down. \u201cWhat is on your mind?\u201d Now say \u201cwatery\u201d", "lang": "en"}, {"text": "w\u00e4ssrig", "lang": "de"}], [{"text": "W\u00e4ssrig. Eine w\u00e4ssrige Sonne \u2013 a watery sun. Now say \u201cto crack open\u201d", "lang": "en"}, {"text": "aufbrechen. Der graue Himmel war aufgebrochen \u2013 the grey", "lang": "de"}, {"text": "sky had cracked open. --I wiped the counter. The rag was damp. \u201cMatei has been weird lately.\u201d \u201cWeird how?\u201d \u201cQuiet. More than usual. He comes home, makes dinner, sits on the sofa, and just... stares at me.\u201d \u201cMaybe he is admiring you.\u201d \u201cHe is planning something.\u201d Frau Schmidt smiled. It was a small smile. Secret. \u201cMen plan,\u201d she said. \u201cWomen execute. That is the difference.\u201d \u201cThat is sexist.\u201d \u201cThat is true.\u201d She stood up. Walked to the counter. \u201cYves, do you love him?\u201d \u201cYou know I do.\u201d \u201cThen stop worrying and let him plan.\u201d Now say \u201cto admire\u201d", "lang": "en"}, {"text": "bewundern", "lang": "de"}], [{"text": "Bewundern. Vielleicht bewundert er dich \u2013 maybe he is admiring you. Now say \u201csexist\u201d", "lang": "en"}, {"text": "sexistisch", "lang": "de"}], [{"text": "Sexistisch. Das ist sexistisch \u2013 that is sexist. --I wanted to argue. But she was right. I had spent my whole life waiting for the other shoe to drop. Waiting for people to leave. Waiting for happiness to be snatched away. Maybe Matei was not planning an exit. Maybe he was planning something else. \u201cClean the bathroom,\u201d Frau Schmidt said. \u201cYou forgot yesterday.\u201d Now say \u201cthe shoe\u201d der Schuh. Review", "lang": "en"}], [{"text": "Der Schuh. Der andere Schuh", "lang": "de"}, {"text": "\u2013 the other shoe Now say \u201cto snatch away\u201d", "lang": "en"}, {"text": "wegrei\u00dfen", "lang": "de"}], [{"text": "Wegrei\u00dfen. Das Gl\u00fcck wird weggerissen \u2013 happiness is snatched away. --I walked home that evening with a bag of groceries. Matei had texted me: I am cooking. Buy pasta. When I opened the apartment door, the lights were off. Candles were on the table. Not romantic candles \u2013 the emergency ones from the drawer, the ones that smelled like nothing and flickered unevenly. But it was the thought that counted. \u201cMatei?\u201d \u201cIn the kitchen.\u201d I set the groceries down. Walked to the kitchen. He was standing at the stove, stirring something in a pot. His back was to me. Now say \u201cthe candle\u201d", "lang": "en"}, {"text": "die Kerze", "lang": "de"}], [{"text": "Die Kerze. Feminine. Kerzen auf dem Tisch", "lang": "de"}, {"text": "\u2013 candles on the table Now say \u201cto flicker\u201d", "lang": "en"}, {"text": "flackern. Die Kerzen flackerten \u2013 the candles flickered", "lang": "de"}, {"text": "\u201cWhat is all this?\u201d I asked. \u201cDinner.\u201d \u201cI see that. Why the candles?\u201d He did not turn around. \u201cBecause I wanted to.\u201d \u201cMatei.\u201d \u201cYves.\u201d \u201cYou are scaring me.\u201d He finally turned. His face was calm. His grey eyes were steady. \u201cDo not be scared,\u201d he said. \u201cSit down. I will explain.\u201d Now say \u201cto scare\u201d", "lang": "en"}, {"text": "erschrecken. Du machst mir Angst \u2013 you are scaring me", "lang": "de"}], [{"text": "Erschrecken. Du erschreckst mich", "lang": "de"}, {"text": "\u2013 you are scaring me Now say \u201cto explain\u201d", "lang": "en"}, {"text": "erkl\u00e4ren. Ich werde es erkl\u00e4ren \u2013 I will explain", "lang": "de"}, {"text": "I sat at the table. The wooden chair. The plastic one was still empty. The candles flickered. The apartment smelled like garlic and something else \u2013 something nervous. He brought two plates. Pasta. My grandmother's recipe. He had learned it. He had been watching me for months, and now he made it better than I did. \u201cThis is good,\u201d I said after the first bite. \u201cI have had practice.\u201d \u201cYou have been practicing?\u201d \u201cEvery time you were not home.\u201d I set my fork down. \u201cMatei. What is going on?\u201d Now say \u201cpractice\u201d", "lang": "en"}, {"text": "die \u00dcbung", "lang": "de"}], [{"text": "Die \u00dcbung. Ich habe \u00dcbung", "lang": "de"}, {"text": "\u2013 I have practice Now say \u201cthe fork\u201d", "lang": "en"}, {"text": "die Gabel", "lang": "de"}], [{"text": "Die Gabel. Feminine. Ich legte die Gabel hin", "lang": "de"}, {"text": "\u2013 I set the fork down --He ate a bite of his pasta. Chewed. Swallowed. Took a breath. \u201cI have been thinking about the future,\u201d he said. \u201cThat is vague.\u201d \u201cI have been thinking about us. About what comes next.\u201d My chest tightened. \u201cAre you breaking up with me?\u201d \u201cNo.\u201d He reached across the table. Took my hand. \u201cI am asking you something.\u201d \u201cOkay.\u201d \u201cNot yet. Eat first. I do not want you to say yes on an empty stomach.\u201d Now say \u201cvague\u201d", "lang": "en"}, {"text": "vage", "lang": "de"}], [{"text": "Vage. Das ist vage \u2013 that is vague. Now say \u201cto break up\u201d", "lang": "en"}, {"text": "Schluss machen", "lang": "de"}], [{"text": "Schluss machen. Machst du Schluss mit mir? \u2013 are you breaking up with me? --I laughed. It was shaky. \u201cYou are insane.\u201d \u201cProbably.\u201d We ate. The pasta was perfect. The candles flickered. The radiator clicked. When our plates were empty, he stood up. Walked to the window. Turned back to face me. \u201cYves.\u201d \u201cMatei.\u201d \u201cI am not good with words. You know that. I remember things. I show up. I make coffee. But I do not say the big things.\u201d \u201cYou are saying them now.\u201d \u201cI am trying.\u201d Now say \u201cempty\u201d", "lang": "en"}, {"text": "leer", "lang": "de"}], [{"text": "Leer. Unsere Teller waren leer \u2013 our plates were empty. Now say \u201cthe big things\u201d", "lang": "en"}, {"text": "die gro\u00dfen Dinge", "lang": "de"}], [{"text": "Die gro\u00dfen Dinge. Ich sage die gro\u00dfen Dinge nicht", "lang": "de"}, {"text": "\u2013 I do not say the big things --He walked to me. Knelt down. Not on one knee \u2013 just knelt, so his face was level with mine. \u201cI love you,\u201d he said. \u201cI have loved you since the first message. Two years ago. Before I knew your face. Before I knew your laugh. Before I knew that you drop cups and apologise to the floor.\u201d \u201cI do not apologise to the floor.\u201d \u201cYou do. I have seen it.\u201d I laughed. He did not. Now say \u201cto kneel\u201d", "lang": "en"}, {"text": "knien", "lang": "de"}], [{"text": "Knien. Er kniete sich hin \u2013 he knelt down. Now say \u201clevel with\u201d", "lang": "en"}, {"text": "auf gleicher H\u00f6he mit", "lang": "de"}], [{"text": "Auf gleicher H\u00f6he. Sein Gesicht war auf gleicher H\u00f6he mit meinem", "lang": "de"}, {"text": "\u2013 his face was level with mine. --\u201cYves. I want to build something with you. Something that lasts. Something that is ours.\u201d \u201cWhat are you saying?\u201d He reached into his pocket. Pulled out a small box. Black velvet. \u201cI am saying I do not want you to be my roommate anymore. Or my boyfriend. Or the man who sleeps in my bed.\u201d He opened the box. Inside was a ring. Silver. Simple. A thin band with a small etching \u2013 a line that looked like a wave, or a bridge, or the curve of a duck's neck. \u201cI want you to be my family,\u201d he said. Now say \u201cthe velvet\u201d", "lang": "en"}, {"text": "der Samt", "lang": "de"}], [{"text": "Der Samt. Masculine. Schwarzer Samt", "lang": "de"}, {"text": "\u2013 black velvet Now say \u201cthe ring\u201d", "lang": "en"}, {"text": "der Ring", "lang": "de"}], [{"text": "Der Ring. Masculine. Ein silberner Ring", "lang": "de"}, {"text": "\u2013 a silver ring --I stared at the ring. My vision blurred. \u201cMatei.\u201d \u201cYves.\u201d \u201cAre you proposing?\u201d \u201cI am asking.\u201d His voice was steady. \u201cWill you marry me?\u201d The room was silent. The candles flickered. The radiator clicked. Somewhere downstairs, the bakery was closing \u2013 the metal grate scraping down. \u201cYes,\u201d I said. He blinked. \u201cYes?\u201d \u201cYes. Yes, I will marry you. Yes, I will be your family. Yes, I will stop running.\u201d Now say \u201cto propose\u201d", "lang": "en"}, {"text": "einen Heiratsantrag machen", "lang": "de"}], [{"text": "Einen Heiratsantrag machen. Machst du mir einen Antrag?", "lang": "de"}, {"text": "\u2013 are you proposing to me? Now say \u201cto blur\u201d", "lang": "en"}, {"text": "verschwimmen. Meine Sicht verschwamm \u2013 my vision blurred", "lang": "de"}, {"text": "He took the ring out of the box. Slipped it onto my finger. It was warm from being in his pocket. It fit perfectly. \u201cHow did you know my size?\u201d I asked. \u201cI measured your finger while you were sleeping.\u201d \u201cThat is creepy.\u201d \u201cThat is practical.\u201d I laughed. He kissed me. The candles flickered. The pasta cooled on the table. Now say \u201cto measure\u201d", "lang": "en"}, {"text": "messen", "lang": "de"}], [{"text": "Messen. Ich habe deinen Finger gemessen \u2013 I measured your finger. Now say \u201ccreepy\u201d", "lang": "en"}, {"text": "gruselig", "lang": "de"}], [{"text": "Gruselig. Das ist gruselig \u2013 that is creepy. --\u201cMatei.\u201d \u201cWhat?\u201d \u201cI love you.\u201d \u201cI love you too.\u201d We sat on the sofa. His arm was around me. My hand was in his. The ring caught the candlelight. \u201cWe are getting married,\u201d I said. \u201cWe are getting married.\u201d \u201cIn Berlin?\u201d \u201cIn Berlin.\u201d \u201cWith Frau Schmidt as a witness?\u201d \u201cWith Frau Schmidt as a witness.\u201d \u201cAnd Ada?\u201d \u201cAnd Ada. And Andreea, if she will come.\u201d Now say \u201cthe witness\u201d", "lang": "en"}, {"text": "der Zeuge / die Zeugin", "lang": "de"}], [{"text": "Der Zeuge. Masculine. Als Zeugin", "lang": "de"}, {"text": "\u2013 as a witness Now say \u201cto catch the light\u201d", "lang": "en"}, {"text": "das Licht einfangen", "lang": "de"}], [{"text": "Das Licht einfangen. Der Ring fing das Kerzenlicht ein", "lang": "de"}, {"text": "\u2013 the ring caught the candlelight. --I leaned into him. \u201cOkay,\u201d I said. \u201cOkay.\u201d We sat like that until the candles burned out and the street went quiet. Tomorrow, we would tell everyone. Tomorrow, we would start planning. But tonight, we were just here. Engaged. Together. And that was everything. Now say \u201cto burn out\u201d", "lang": "en"}, {"text": "ausbrennen", "lang": "de"}], [{"text": "Ausbrennen. Die Kerzen brannten aus \u2013 the candles burned out. Now say \u201cengaged\u201d", "lang": "en"}, {"text": "verlobt", "lang": "de"}], [{"text": "Verlobt. Wir sind verlobt \u2013 we are engaged. --- Dual-layer vocabulary review \u2013 Chapter 20 Layer 1 \u2013 Words W\u00e4ssrig \u2013 watery. <break time=\"2s\"/> W\u00e4ssrig. Eine w\u00e4ssrige Sonne.", "lang": "en"}, {"text": "Aufbrechen", "lang": "de"}, {"text": "\u2013 to crack open. <break time=\"2s\"/> Aufbrechen. Der Himmel war aufgebrochen. Bewundern \u2013 to admire. <break time=\"2s\"/> Bewundern. Vielleicht bewundert er dich. Sexistisch \u2013 sexist. <break time=\"2s\"/> Sexistisch. Das ist sexistisch. Wegrei\u00dfen \u2013 to snatch away. <break time=\"2s\"/> Wegrei\u00dfen. Das Gl\u00fcck wird weggerissen.", "lang": "en"}, {"text": "Die Kerze", "lang": "de"}, {"text": "\u2013 the candle. <break time=\"2s\"/> Die Kerze. Kerzen auf dem Tisch Flackern \u2013 to flicker. <break time=\"2s\"/> Flackern. Die Kerzen flackerten.", "lang": "en"}, {"text": "Erschrecken", "lang": "de"}, {"text": "\u2013 to scare. <break time=\"2s\"/> Erschrecken. Du erschreckst mich", "lang": "en"}, {"text": "Die \u00dcbung", "lang": "de"}, {"text": "\u2013 practice. <break time=\"2s\"/> Die \u00dcbung. Ich habe \u00dcbung", "lang": "en"}, {"text": "Die Gabel", "lang": "de"}, {"text": "\u2013 the fork. <break time=\"2s\"/> Die Gabel. Ich legte die Gabel hin Vage \u2013 vague. <break time=\"2s\"/> Vage. Das ist vage. Schluss machen \u2013 to break up. <break time=\"2s\"/> Schluss machen. Machst du Schluss mit mir? Leer \u2013 empty. <break time=\"2s\"/> Leer. Unsere Teller waren leer. Knien \u2013 to kneel. <break time=\"2s\"/> Knien. Er kniete sich hin.", "lang": "en"}, {"text": "Auf gleicher H\u00f6he", "lang": "de"}, {"text": "\u2013 level with. <break time=\"2s\"/> Auf gleicher H\u00f6he. Auf gleicher H\u00f6he mit meinem.", "lang": "en"}, {"text": "Der Samt", "lang": "de"}, {"text": "\u2013 the velvet. <break time=\"2s\"/> Der Samt. Schwarzer Samt", "lang": "en"}, {"text": "Der Ring", "lang": "de"}, {"text": "\u2013 the ring. <break time=\"2s\"/> Der Ring. Ein silberner Ring", "lang": "en"}, {"text": "Einen Heiratsantrag machen", "lang": "de"}, {"text": "\u2013 to propose. <break time=\"2s\"/> Einen Heiratsantrag machen. Machst du mir einen Antrag? Verschwimmen \u2013 to blur. <break time=\"2s\"/> Verschwimmen. Meine Sicht verschwamm. Messen \u2013 to measure. <break time=\"2s\"/> Messen. Ich habe deinen Finger gemessen. Gruselig \u2013 creepy. <break time=\"2s\"/> Gruselig. Das ist gruselig.", "lang": "en"}, {"text": "Der Zeuge / die Zeugin", "lang": "de"}, {"text": "\u2013 the witness. <break time=\"2s\"/> Der Zeuge. Als Zeugin", "lang": "en"}, {"text": "Das Licht einfangen", "lang": "de"}, {"text": "\u2013 to catch the light. <break time=\"2s\"/> Das Licht einfangen", "lang": "en"}, {"text": "Der Ring fing das Licht ein.", "lang": "de"}, {"text": "Ausbrennen \u2013 to burn out. <break time=\"2s\"/> Ausbrennen. Die Kerzen brannten aus. Verlobt \u2013 engaged. <break time=\"2s\"/> Verlobt. Wir sind verlobt. Layer 2 \u2013 Story phrases \"Eine w\u00e4ssrige Sonne.\" \u2013 A watery sun. <break time=\"2s\"/> Eine w\u00e4ssrige Sonne. \"Der graue Himmel war aufgebrochen.\" \u2013 The grey sky had cracked open. <break time=\"2s\"/> Der graue Himmel war aufgebrochen. \"Das ist sexistisch.\" \u2013 That is sexist. <break time=\"2s\"/> Das ist sexistisch. \"Der andere Schuh.\" \u2013 The other shoe. <break time=\"2s\"/> Der andere Schuh. \"Kerzen auf dem Tisch.\" \u2013 Candles on the table. <break time=\"2s\"/> Kerzen auf dem Tisch. \"Machst du Schluss mit mir?\" \u2013 Are you breaking up with me? <break time=\"2s\"/> Machst du Schluss mit mir? \"Unsere Teller waren leer.\" \u2013 Our plates were empty. <break time=\"2s\"/> Unsere Teller waren leer. \"Sein Gesicht war auf gleicher H\u00f6he mit meinem.\" \u2013 His face was level with mine. <break time=\"2s\"/> Sein Gesicht war auf gleicher H\u00f6he mit meinem. \"Ein silberner Ring.\" \u2013 A silver ring. <break time=\"2s\"/> Ein silberner Ring. \"Machst du mir einen Antrag?\" \u2013 Are you proposing to me? <break time=\"2s\"/> Machst du mir einen Antrag? \"Das ist gruselig.\" \u2013 That's creepy. <break time=\"2s\"/> Das ist gruselig. \"Als Zeugin.\" \u2013 As a witness. <break time=\"2s\"/> Als Zeugin. \"Wir sind verlobt.\" \u2013 We are engaged. <break time=\"2s\"/> Wir sind verlobt. --End of Chapter 20. --Chapter 21 \u2013 The Plan (B1-B2) (Narrator voice, calm, clear. Ambient: late night \u2013 silence, occasional distant train, soft breathing.) We did not sleep that night. It was past 2 AM. The candles on the table had burned out hours ago. The apartment was quiet except for the radiator's occasional click and the distant sound of a train somewhere across the city. We were still on the sofa. Matei's arm was around me. The ring was still on my finger. Every few minutes, I would look at it again, just to make sure it was real. \u201cWe should talk,\u201d I said. \u201cAbout what?\u201d \u201cAbout everything. About what comes next.\u201d Now say \u201cthe train\u201d", "lang": "en"}, {"text": "der Zug", "lang": "de"}], [{"text": "Der Zug. Masculine. Ein Zug in der Ferne", "lang": "de"}, {"text": "\u2013 a train in the distance Now say \u201cto make sure\u201d", "lang": "en"}, {"text": "sicherstellen. Um sicherzustellen, dass es echt ist \u2013 to", "lang": "de"}, {"text": "make sure it is real. --He was quiet for a moment. Then he said, \u201cI thought you would want to sleep on it first.\u201d \u201cSleep on an engagement? That is not how it works.\u201d \u201cHow does it work?\u201d \u201cI do not know. I have never been engaged before.\u201d I looked at him. \u201cNeither have you.\u201d \u201cFair point.\u201d I sat up. Turned to face him. The sofa creaked. Now say \u201cthe engagement\u201d", "lang": "en"}, {"text": "die Verlobung", "lang": "de"}], [{"text": "Die Verlobung. Feminine. \u00dcber eine Verlobung schlafen", "lang": "de"}, {"text": "\u2013 to sleep on an engagement Now say \u201cfair point\u201d", "lang": "en"}, {"text": "das ist ein fairer Punkt", "lang": "de"}], [{"text": "Das ist ein fairer Punkt. Fairer Punkt", "lang": "de"}, {"text": "\u2013 fair point --\u201cMatei. I need to know what you want. Not just the proposal. The real things. The house, the kids, the money, the work. All of it.\u201d He ran a hand through his hair. \u201cThat is a lot for 2 AM.\u201d \u201cWe are not going to sleep anyway.\u201d He sighed. \u201cOkay. What do you want to know first?\u201d \u201cWhere are we going to live?\u201d He blinked. \u201cHere? In Berlin?\u201d \u201cFor now. But eventually. Do we stay in this apartment forever? Do we find something bigger?\u201d \u201cYou want to be a boring adult?\u201d \u201cI want a garden.\u201d Now say \u201cthe garden\u201d", "lang": "en"}, {"text": "der Garten", "lang": "de"}], [{"text": "Der Garten. Masculine. Ich m\u00f6chte einen Garten", "lang": "de"}, {"text": "\u2013 I want a garden Now say \u201cboring\u201d", "lang": "en"}, {"text": "langweilig", "lang": "de"}], [{"text": "Langweilig. Ein langweiliger Erwachsener \u2013 a boring adult. --He stared at me. \u201cA garden.\u201d \u201cFor the kids. And the duck.\u201d \u201cThe duck does not live with us.\u201d \u201cThe duck can visit.\u201d \u201cYou are not going to let that go, are you?\u201d \u201cNever.\u201d He laughed. It was tired, but real. \u201cOkay,\u201d he said. \u201cA garden. Eventually. But first, we save money. The caf\u00e9 does not pay much.\u201d \u201cI have the IT Ausbildung coming up. If I get it, the salary will be better.\u201d \u201cYou keep saying \u2018if.\u2019\u201d \u201cBecause I am scared.\u201d Now say \u201cto save money\u201d", "lang": "en"}, {"text": "Geld sparen", "lang": "de"}], [{"text": "Geld sparen. Wir m\u00fcssen Geld sparen \u2013 we have to save money. Now say \u201cthe salary\u201d", "lang": "en"}, {"text": "das Gehalt", "lang": "de"}], [{"text": "Das Gehalt. Neuter. Das Gehalt wird besser sein", "lang": "de"}, {"text": "\u2013 the salary will be better --\u201cDo not be scared,\u201d he said. \u201cTelling me not to be scared does not make me less scared.\u201d He took my hand. \u201cThen let me help you study. Let me practice the interview questions with you. Let me be useful.\u201d \u201cYou are already useful.\u201d \u201cI want to be more useful.\u201d I leaned into him. \u201cOkay. You can help me study.\u201d \u201cGood.\u201d We were quiet for a moment. Now say \u201cuseful\u201d", "lang": "en"}, {"text": "n\u00fctzlich", "lang": "de"}], [{"text": "N\u00fctzlich. Du bist schon n\u00fctzlich \u2013 you are already useful. Now say \u201cto study\u201d", "lang": "en"}, {"text": "lernen or studieren. Du kannst mir helfen zu lernen \u2013 you can", "lang": "de"}, {"text": "help me study. --\u201cKids,\u201d I said. \u201cHow do you want to do it?\u201d \u201cAdoption,\u201d he said without hesitation. \u201cReally?\u201d \u201cI have thought about it. For a long time. Even before you.\u201d \u201cHow long?\u201d \u201cSince I was a kid. My parents were not great. My father drank. My mother pretended everything was fine.\u201d He paused. \u201cI always thought that if I ever had children, I would want to give them something different. A home that did not hurt.\u201d Now say \u201cadoption\u201d", "lang": "en"}, {"text": "die Adoption", "lang": "de"}], [{"text": "Die Adoption. Feminine. Adoption", "lang": "de"}, {"text": "\u2013 adoption Now say \u201cto pretend\u201d", "lang": "en"}, {"text": "vort\u00e4uschen. Meine Mutter tat so, als ob alles in Ordnung", "lang": "de"}, {"text": "w\u00e4re \u2013 my mother pretended everything was fine. --I looked at him. His grey eyes were wet. \u201cI did not know that about you,\u201d I said. \u201cI do not talk about it.\u201d \u201cWhy not?\u201d \u201cBecause it is done. It is in the past. I do not need to fix it. I just need to not repeat it.\u201d I held his hand tighter. \u201cThen we adopt,\u201d I said. \u201cTwo kids. Maybe three.\u201d \u201cTwo to start.\u201d \u201cTwo to start. And we give them everything we did not have.\u201d \u201cEverything.\u201d Now say \u201cto repeat\u201d", "lang": "en"}, {"text": "wiederholen", "lang": "de"}], [{"text": "Wiederholen. Ich will es nicht wiederholen \u2013 I do not want to repeat it. Now say \u201ctighter\u201d", "lang": "en"}, {"text": "fester. Ich hielt seine Hand fester \u2013 I held his hand tighter", "lang": "de"}, {"text": "We sat with that for a while. The weight of it. The promise. \u201cWhat about the caf\u00e9?\u201d I asked. \u201cWhat about it?\u201d \u201cFrau Schmidt wants us to take over. Do you want to?\u201d \u201cIt is your caf\u00e9.\u201d \u201cI run it. But you help. It is ours.\u201d He shook his head. \u201cIt is not mine. I just carry pastries.\u201d \u201cYou do more than that.\u201d \u201cI make moral support.\u201d \u201cThat is not nothing.\u201d Now say \u201cmoral support\u201d", "lang": "en"}, {"text": "moralische Unterst\u00fctzung", "lang": "de"}], [{"text": "Moralische Unterst\u00fctzung. Moralische Unterst\u00fctzung leisten \u2013 to provide moral support. Now say \u201cto carry\u201d", "lang": "en"}, {"text": "tragen. Ich trage nur Geb\u00e4ck \u2013 I just carry pastries", "lang": "de"}, {"text": "He was quiet for a long moment. Then he said, \u201cYou really mean that.\u201d \u201cI really do.\u201d \u201cOkay. Then we take over the caf\u00e9. Not now. In a year. Two years. Whenever Frau Schmidt is ready.\u201d \u201cAnd we learn the business side together.\u201d \u201cI hate numbers.\u201d \u201cYou will learn to tolerate them.\u201d He sighed. \u201cFine.\u201d Now say \u201cthe business side\u201d", "lang": "en"}, {"text": "die gesch\u00e4ftliche Seite", "lang": "de"}], [{"text": "Die gesch\u00e4ftliche Seite. Die gesch\u00e4ftliche Seite lernen", "lang": "de"}, {"text": "\u2013 to learn the business side. Now say \u201cto tolerate\u201d", "lang": "en"}, {"text": "tolerieren or ertragen. Du wirst lernen, sie zu ertragen \u2013", "lang": "de"}, {"text": "you will learn to tolerate them. --Around 3 AM, we moved to the bed. Not to sleep \u2013 just to lie down. The ceiling was cracked in the corner. Matei had been saying he would fix it for months. He never did. \u201cWe need a bigger apartment,\u201d I said. \u201cAfter the wedding.\u201d \u201cThere is no wedding yet. We are just engaged.\u201d \u201cEngaged people can look for apartments.\u201d \u201cEngaged people save money first.\u201d He turned his head to look at me. \u201cYou are very practical,\u201d he said. \u201cI am very scared. Practical is what scared people become.\u201d Now say \u201cpractical\u201d praktisch. Review", "lang": "en"}], [{"text": "Praktisch. Du bist sehr praktisch \u2013 you are very practical. Now say \u201cscared\u201d", "lang": "en"}, {"text": "ver\u00e4ngstigt. Das ist, was ver\u00e4ngstigte Menschen werden \u2013 that", "lang": "de"}, {"text": "is what scared people become. --\u201cWhat are you scared of?\u201d I thought about it. About Nigeria. About my grandmother. About all the years of running. \u201cI am scared that I am going to wake up one day and realise I do not deserve any of this.\u201d Matei propped himself up on his elbow. \u201cYves.\u201d \u201cWhat?\u201d \u201cYou deserve everything. You deserve a house. You deserve a garden. You deserve children who will never know what it feels like to be unwanted. You deserve a man who shows up every day and chooses you.\u201d \u201cEven when I drop cups?\u201d \u201cEspecially when you drop cups.\u201d Now say \u201cto prop up\u201d", "lang": "en"}, {"text": "aufst\u00fctzen", "lang": "de"}], [{"text": "Aufst\u00fctzen. Er st\u00fctzte sich auf seinen Ellbogen", "lang": "de"}, {"text": "\u2013 he propped himself up on his elbow. Now say \u201cto choose\u201d", "lang": "en"}, {"text": "w\u00e4hlen. Ein Mann, der dich jeden Tag w\u00e4hlt \u2013 a man who", "lang": "de"}, {"text": "chooses you every day. --I laughed. It was shaky. \u201cThat is a lot of pressure,\u201d I said. \u201cIt is not pressure. It is patience. Pressure is what you put on yourself. Patience is what I am giving you.\u201d \u201cYou have said that before.\u201d \u201cBecause you keep needing to hear it.\u201d I reached up. Touched his face. His jaw was rough with stubble. \u201cI love you,\u201d I said. \u201cI love you too.\u201d He kissed me. Soft. Slow. Then we lay back down and stared at the ceiling some more. Now say \u201cpressure\u201d der Druck. Review", "lang": "en"}], [{"text": "Der Druck. Das ist kein Druck", "lang": "de"}, {"text": "\u2013 that is not pressure Now say \u201cpatience\u201d die Geduld. Review", "lang": "en"}], [{"text": "Die Geduld. Geduld ist das, was ich dir gebe", "lang": "de"}, {"text": "\u2013 patience is what I am giving you --Dual-layer vocabulary review \u2013 Chapter 21 Layer 1 \u2013 Words", "lang": "en"}, {"text": "Der Zug", "lang": "de"}, {"text": "\u2013 the train. <break time=\"2s\"/> Der Zug. Ein Zug in der Ferne Sicherstellen \u2013 to make sure. <break time=\"2s\"/> Sicherstellen. Um sicherzustellen, dass es echt ist.", "lang": "en"}, {"text": "Die Verlobung", "lang": "de"}, {"text": "\u2013 the engagement. <break time=\"2s\"/> Die Verlobung. \u00dcber eine Verlobung schlafen.", "lang": "en"}, {"text": "Das ist ein fairer Punkt", "lang": "de"}, {"text": "\u2013 fair point. <break time=\"2s\"/> Das ist ein fairer Punkt. Fairer Punkt.", "lang": "en"}, {"text": "Der Garten", "lang": "de"}, {"text": "\u2013 the garden. <break time=\"2s\"/> Der Garten. Ich m\u00f6chte einen Garten Langweilig \u2013 boring. <break time=\"2s\"/> Langweilig. Ein langweiliger Erwachsener. Geld sparen \u2013 to save money. <break time=\"2s\"/> Geld sparen. Wir m\u00fcssen Geld sparen.", "lang": "en"}, {"text": "Das Gehalt", "lang": "de"}, {"text": "\u2013 the salary. <break time=\"2s\"/> Das Gehalt. Das Gehalt wird besser sein. N\u00fctzlich \u2013 useful. <break time=\"2s\"/> N\u00fctzlich. Du bist schon n\u00fctzlich.", "lang": "en"}, {"text": "Die Adoption", "lang": "de"}, {"text": "\u2013 adoption. <break time=\"2s\"/> Die Adoption. Adoption Vort\u00e4uschen \u2013 to pretend. <break time=\"2s\"/> Vort\u00e4uschen. Meine Mutter tat so, als ob alles in Ordnung w\u00e4re. Wiederholen \u2013 to repeat. <break time=\"2s\"/> Wiederholen. Ich will es nicht wiederholen. Fester \u2013 tighter. <break time=\"2s\"/> Fester. Ich hielt seine Hand fester. Moralische Unterst\u00fctzung \u2013 moral support. <break time=\"2s\"/> Moralische Unterst\u00fctzung. Moralische Unterst\u00fctzung leisten. Tragen \u2013 to carry. <break time=\"2s\"/> Tragen. Ich trage nur Geb\u00e4ck.", "lang": "en"}, {"text": "Die gesch\u00e4ftliche Seite", "lang": "de"}, {"text": "\u2013 the business side. <break time=\"2s\"/> Die gesch\u00e4ftliche Seite. Die gesch\u00e4ftliche Seite lernen.", "lang": "en"}, {"text": "Ertragen", "lang": "de"}, {"text": "\u2013 to tolerate. <break time=\"2s\"/> Ertragen. Du wirst lernen, sie zu ertragen.", "lang": "en"}, {"text": "Aufst\u00fctzen", "lang": "de"}, {"text": "\u2013 to prop up. <break time=\"2s\"/> Aufst\u00fctzen. Er st\u00fctzte sich auf seinen Ellbogen. Layer 2 \u2013 Story phrases \"Ein Zug in der Ferne.\" \u2013 A train in the distance. <break time=\"2s\"/> Ein Zug in der Ferne. \"\u00dcber eine Verlobung schlafen.\" \u2013 To sleep on an engagement. <break time=\"2s\"/> \u00dcber eine Verlobung schlafen. \"Ich m\u00f6chte einen Garten.\" \u2013 I want a garden. <break time=\"2s\"/> Ich m\u00f6chte einen Garten. \"Ein langweiliger Erwachsener.\" \u2013 A boring adult. <break time=\"2s\"/> Ein langweiliger Erwachsener. \"Das Gehalt wird besser sein.\" \u2013 The salary will be better. <break time=\"2s\"/> Das Gehalt wird besser sein. \"Ich will es nicht wiederholen.\" \u2013 I don't want to repeat it. <break time=\"2s\"/>", "lang": "en"}, {"text": "Ich will es nicht wiederholen.", "lang": "de"}, {"text": "\"Moralische Unterst\u00fctzung leisten.\" \u2013 To provide moral support. <break time=\"2s\"/> Moralische Unterst\u00fctzung leisten. \"Die gesch\u00e4ftliche Seite lernen.\" \u2013 To learn the business side. <break time=\"2s\"/>", "lang": "en"}, {"text": "Die gesch\u00e4ftliche Seite lernen.", "lang": "de"}, {"text": "\"Er st\u00fctzte sich auf seinen Ellbogen.\" \u2013 He propped himself up on his elbow. <break time=\"2s\"/> Er st\u00fctzte sich auf seinen Ellbogen. --End of Chapter 21.", "lang": "en"}]];

const selEN        = document.getElementById('sel-en');
const selDE        = document.getElementById('sel-de');

// ── Voice loading ─────────────────────────────────────────────
function loadVoices() {
  voices = speechSynthesis.getVoices();
  if (!voices.length) return;

  selEN.innerHTML = '';
  selDE.innerHTML = '';

  voices.forEach((v, i) => {
    const label = v.name + (v.localService ? ' ✓' : '') + ' [' + v.lang + ']';
    const optEN = new Option(label, i);
    const optDE = new Option(label, i);
    selEN.appendChild(optEN);
    selDE.appendChild(optDE);
  });

  // Auto-select best voices
  const enPref = ['Daniel', 'Arthur', 'James', 'George', 'Oliver'];
  const dePref = ['Markus', 'Stefan', 'Hans', 'Klaus'];

  let enIdx = 0, deIdx = 0;
  voices.forEach((v, i) => {
    if (enPref.some(n => v.name.includes(n)) && !voiceEN) { enIdx = i; voiceEN = v; }
    if (dePref.some(n => v.name.includes(n)) && !voiceDE) { deIdx = i; voiceDE = v; }
  });
  // Fallback
  if (!voiceEN) { voiceEN = voices[0]; enIdx = 0; }
  if (!voiceDE) {
    const deVoice = voices.find(v => v.lang && v.lang.startsWith('de'));
    if (deVoice) { voiceDE = deVoice; deIdx = voices.indexOf(deVoice); }
    else { voiceDE = voices[0]; deIdx = 0; }
  }

  selEN.value = enIdx;
  selDE.value = deIdx;
  updateVoiceStatus();
}

function updateVoiceStatus() {
  voiceStatus.innerHTML =
    'EN: <span class="en-name">' + (voiceEN ? voiceEN.name : '—') + '</span>' +
    '&emsp;DE: <span class="de-name">' + (voiceDE ? voiceDE.name : '—') + '</span>';
}

if (speechSynthesis.onvoiceschanged !== undefined) {
  speechSynthesis.onvoiceschanged = loadVoices;
}
loadVoices();
setTimeout(loadVoices, 500);

// ── Display segment ───────────────────────────────────────────
function renderSegment(i) {
  idx = i;
  const seg = SEGMENTS[i] || [];
  progBar.style.width = (SEGMENTS.length > 1 ? i / (SEGMENTS.length - 1) * 100 : 0) + '%';
  segCur.textContent = i + 1;
  textDisplay.classList.remove('pause-active');
  pauseCount.textContent = '';

  // Build HTML
  let html = '';
  seg.forEach((chunk, ci) => {
    const cls = 'chunk-' + chunk.lang;
    html += '<span class="' + cls + '" data-ci="' + ci + '">' +
              escapeHtml(chunk.text) + ' </span>';
  });
  textContent.innerHTML = html || '<em style="color:#555">—</em>';
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function highlightChunk(ci, on) {
  const el = textContent.querySelector('[data-ci="' + ci + '"]');
  if (el) { if (on) el.classList.add('speaking'); else el.classList.remove('speaking'); }
}

// ── Speak a segment ───────────────────────────────────────────
function speakSegment(i) {
  if (i >= SEGMENTS.length) { stopAll(); return; }
  renderSegment(i);
  chunkQueue = SEGMENTS[i] || [];
  chunkIdx = 0;
  speakNextChunk();
}

function speakNextChunk() {
  if (!playing) return;
  if (chunkIdx >= chunkQueue.length) {
    // Segment done — is this a "Now say" segment? Check if next has German answer
    const isPrompt = chunkQueue.some(c =>
      /now say/i.test(c.text) || /\(4 second pause\)/i.test(c.text)
    );
    if (isPrompt) {
      doPause();
    } else {
      pauseTimerId = setTimeout(() => { if (playing) speakSegment(idx + 1); }, 420);
    }
    return;
  }

  const chunk = chunkQueue[chunkIdx];
  highlightChunk(chunkIdx, true);

  const utt = new SpeechSynthesisUtterance(chunk.text);
  const rate = parseFloat(speedInput.value);

  if (chunk.lang === 'de') {
    utt.voice = voiceDE;
    utt.lang = 'de-DE';
    utt.rate = rate * 0.88;   // German a touch slower for clarity
    utt.pitch = 0.92;
  } else {
    utt.voice = voiceEN;
    utt.lang = 'en-GB';
    utt.rate = rate;
    utt.pitch = 1.0;
  }

  utt.onend = () => {
    highlightChunk(chunkIdx, false);
    chunkIdx++;
    if (playing) speakNextChunk();
  };
  utt.onerror = e => {
    if (e.error !== 'canceled') {
      highlightChunk(chunkIdx, false);
      chunkIdx++;
      if (playing) speakNextChunk();
    }
  };

  speechSynthesis.speak(utt);
}

// ── 4-second pause ────────────────────────────────────────────
function doPause() {
  pausing = true;
  textDisplay.classList.add('pause-active');
  let count = PAUSE_SECS;
  pauseCount.textContent = count + 's';

  pauseTimerId = setInterval(() => {
    count--;
    if (count > 0) {
      pauseCount.textContent = count + 's';
    } else {
      clearInterval(pauseTimerId);
      pausing = false;
      textDisplay.classList.remove('pause-active');
      pauseCount.textContent = '';
      if (playing) speakSegment(idx + 1);
    }
  }, 1000);
}

// ── Stop all ──────────────────────────────────────────────────
function stopAll() {
  playing = false;
  pausing = false;
  speechSynthesis.cancel();
  if (pauseTimerId) { clearInterval(pauseTimerId); clearTimeout(pauseTimerId); pauseTimerId = null; }
  textDisplay.classList.remove('pause-active');
  pauseCount.textContent = '';
  btnPlay.innerHTML = '&#9654;&nbsp; Play';
}

// ── Button handlers ───────────────────────────────────────────
btnPlay.addEventListener('click', () => {
  if (playing) {
    stopAll();
  } else {
    playing = true;
    btnPlay.innerHTML = '&#9646;&#9646;&nbsp; Pause';
    speakSegment(idx);
  }
});

btnPrev.addEventListener('click', () => {
  stopAll();
  renderSegment(Math.max(0, idx - 1));
});

btnNext.addEventListener('click', () => {
  stopAll();
  renderSegment(Math.min(SEGMENTS.length - 1, idx + 1));
});

speedInput.addEventListener('input', () => {
  speedVal.textContent = parseFloat(speedInput.value).toFixed(2) + '×';
});

// Progress bar click
document.getElementById('prog-wrap').addEventListener('click', e => {
  const r = e.currentTarget.getBoundingClientRect();
  const pct = (e.clientX - r.left) / r.width;
  stopAll();
  renderSegment(Math.round(pct * (SEGMENTS.length - 1)));
});

// ── Voice modal ───────────────────────────────────────────────
document.getElementById('btn-voices').addEventListener('click', () => {
  voiceModal.classList.add('open');
});
document.getElementById('btn-close-modal').addEventListener('click', () => {
  voiceEN = voices[parseInt(selEN.value)];
  voiceDE = voices[parseInt(selDE.value)];
  updateVoiceStatus();
  voiceModal.classList.remove('open');
});
voiceModal.addEventListener('click', e => {
  if (e.target === voiceModal) voiceModal.classList.remove('open');
});

// ── iOS Safari keep-alive hack ────────────────────────────────
// Safari pauses TTS after ~15s unless we poke it
setInterval(() => {
  if (playing && !speechSynthesis.speaking && !pausing) {
    // It stalled - restart current chunk
    speakNextChunk();
  }
}, 5000);

// ── Init ──────────────────────────────────────────────────────
renderSegment(0);
</script>

</body>
</html>
