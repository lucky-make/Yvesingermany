When I am angry, I shut down. I leave. I do not talk. It is what I learned. From my father. From the ex. From all the people who taught me that anger is dangerous.” “It is dangerous.” “Not when it is honest.”"}, {"type": "practice", "prompt": "Now say “to shut down” – sich verschließen.", "answer": "Sich verschließen. Ich verschließe mich – I shut down.", "slow": "Sich verschließen. Ich verschließe mich – I shut down.", "grammar": "Ich verschließe mich – I shut down."}, {"type": "practice", "prompt": "Now say “dangerous” – gefährlich.", "answer": "Gefährlich. Wut ist gefährlich – anger is dangerous.", "slow": "Gefährlich. Wut ist gefährlich – anger is dangerous.", "grammar": "Wut ist gefährlich – anger is dangerous."}, {"type": "narration", "text": "--He took a breath. His chest rose and fell slowly."}, {"type": "dialogue", "text": "“I was angry last night. Not because of Lukas. Because you did not trust me.”"}, {"type": "dialogue", "text": "“I do trust you.”"}, {"type": "dialogue", "text": "“You hide things. Small things. Things that do not matter. And every time you hide"}, {"type": "narration", "text": "something, I wonder what else you are hiding.” I wanted to argue. I wanted to say I am not hiding anything. But that was not true. I had been hiding my whole life."}, {"type": "practice", "prompt": "Now say “to wonder” – sich fragen.", "answer": "Sich fragen. Ich frage mich, was du noch versteckst – I wonder what else you are.", "slow": "Sich fragen. Ich frage mich, was du noch versteckst – I wonder what else you are.", "grammar": "Ich frage mich, was du noch versteckst – I wonder what else you are hiding."}, {"type": "practice", "prompt": "Now say “to argue” – diskutieren or streiten.", "answer": "Diskutieren. Ich wollte diskutieren – I wanted to argue.", "slow": "Diskutieren. Ich wollte diskutieren – I wanted to argue.", "grammar": "Ich wollte diskutieren – I wanted to argue."}, {"type": "dialogue", "text": "--“I am scared,” I said."}, {"type": "dialogue", "text": "“I know.”"}, {"type": "dialogue", "text": "“I am scared that if you know everything about me, you will leave.”"}, {"type": "narration", "text": "He stepped closer. Close enough that I could smell his coat. Cold air. Coffee. Him."}, {"type": "dialogue", "text": "“Yves.”"}, {"type": "dialogue", "text": "“What?”"}, {"type": "dialogue", "text": "“I already know everything about you. Not the facts. The shape of you. The parts"}, {"type": "narration", "text": "that matter.” He reached out. His hand touched my face. His thumb traced my cheekbone. “You are scared. You are lonely. You want to be loved but you do not know how to ask for it. You make pasta from memory and drink coffee black and laugh when you are uncomfortable. You dropped a cup yesterday and apologised to the floor.”"}, {"type": "practice", "prompt": "Now say “the shape” – die Form or die Gestalt.", "answer": "Die Gestalt. Feminine. Die Gestalt von dir – the shape of you.", "slow": "Die Gestalt. Feminine. Die Gestalt von dir – the shape of you.", "grammar": "Feminine. Die Gestalt von dir – the shape of you."}, {"type": "practice", "prompt": "Now say “to apologise” – sich entschuldigen.", "answer": "Sich entschuldigen. Du hast dich beim Boden entschuldigt – you apologised to the.", "slow": "Sich entschuldigen. Du hast dich beim Boden entschuldigt – you apologised to the.", "grammar": "Du hast dich beim Boden entschuldigt – you apologised to the floor."}, {"type": "dialogue", "text": "--“I did not apologise to the floor.”"}, {"type": "dialogue", "text": "“Frau Schmidt told me.”"}, {"type": "narration", "text": "I laughed. I could not help it. The image of Matei receiving a text about me apologising to inanimate objects was too absurd."}, {"type": "dialogue", "text": "“She tells you everything.”"}, {"type": "dialogue", "text": "“She does.” He smiled. A real smile. Small. Tired. Real. “I am not going to leave,"}, {"type": "narration", "text": "Yves. Not because you are perfect. Because you are not. And neither am I.”"}, {"type": "dialogue", "text": "“That is a terrible reason to stay.”"}, {"type": "dialogue", "text": "“It is the only reason that matters.”"}, {"type": "practice", "prompt": "Now say “terrible” – schrecklich. Review.", "answer": "Schrecklich. Das ist ein schrecklicher Grund – that is a terrible reason.", "slow": "Schrecklich. Das ist ein schrecklicher Grund – that is a terrible reason.", "grammar": "Das ist ein schrecklicher Grund – that is a terrible reason."}, {"type": "practice", "prompt": "Now say “to matter” – zählen or wichtig sein.", "answer": "Zählen. Der einzige Grund, der zählt – the only reason that matters.", "slow": "Zählen. Der einzige Grund, der zählt – the only reason that matters.", "grammar": "Der einzige Grund, der zählt – the only reason that matters."}, {"type": "narration", "text": "--He kissed me. On the bridge. In front of the duck. In front of the family with the dog, who whistled and said something in German that I did not understand but sounded approving. When he pulled back, his hand was still on my face."}, {"type": "dialogue", "text": "“No more hiding,” he said."}, {"type": "dialogue", "text": "“No more hiding.”"}, {"type": "dialogue", "text": "“And no more running.”"}, {"type": "dialogue", "text": "“I will try.”"}, {"type": "dialogue", "text": "“That is all I ask.”"}, {"type": "practice", "prompt": "Now say “approving” – zustimmend.", "answer": "Zustimmend. Sie klangen zustimmend – they sounded approving.", "slow": "Zustimmend. Sie klangen zustimmend – they sounded approving.", "grammar": "Sie klangen zustimmend – they sounded approving."}, {"type": "practice", "prompt": "Now say “to try” – versuchen.", "answer": "Versuchen. Ich werde es versuchen – I will try.", "slow": "Versuchen. Ich werde es versuchen – I will try.", "grammar": "Ich werde es versuchen – I will try."}, {"type": "narration", "text": "--We walked home together. His hand was in mine. The streets were wet from a rain I had not noticed. The streetlights cast orange light on the pavement."}, {"type": "dialogue", "text": "“Matei.”"}, {"type": "dialogue", "text": "“What?”"}, {"type": "dialogue", "text": "“What is the German word for duck?”"}, {"type": "dialogue", "text": "“Ente.”"}, {"type": "dialogue", "text": "“Ente,” I repeated. “That is a stupid word for such a good animal.”"}, {"type": "dialogue", "text": "“German is a stupid language.”"}, {"type": "dialogue", "text": "“You are German.”"}, {"type": "dialogue", "text": "“I am Romanian. I just live here.”"}, {"type": "narration", "text": "I squeezed his hand. He squeezed back."}, {"type": "practice", "prompt": "Now say “the duck” – die Ente. Review.", "answer": "Die Ente.", "slow": "Die Ente.", "grammar": "Repeat aloud: Die Ente."}, {"type": "practice", "prompt": "Now say “Romanian” – rumänisch.", "answer": "Rumänisch. Ich bin Rumäne – I am Romanian (male). Ich bin Rumänin – female.", "slow": "Rumänisch. Ich bin Rumäne – I am Romanian (male). Ich bin Rumänin – female.", "grammar": "Ich bin Rumäne – I am Romanian (male). Ich bin Rumänin – female."}, {"type": "narration", "text": "--That night, we made dinner together. Pasta again. My grandmother's recipe. He chopped the onions. I cried. Not from the onions. When we went to bed, he held me. His chest was warm against my back."}, {"type": "dialogue", "text": "“Yves.”"}, {"type": "dialogue", "text": "“Hm?”"}, {"type": "dialogue", "text": "“I am glad you came to Berlin.”"}, {"type": "narration", "text": "I turned over. Faced him in the dark."}, {"type": "dialogue", "text": "“I am glad I stayed.”"}, {"type": "narration", "text": "He kissed my forehead."}, {"type": "dialogue", "text": "“Good night.”"}, {"type": "dialogue", "text": "“Good night, Matei.”"}, {"type": "practice", "prompt": "Now say “to chop” – hacken or schneiden.", "answer": "Schneiden. Er schnitt die Zwiebeln – he chopped the onions.", "slow": "Schneiden. Er schnitt die Zwiebeln – he chopped the onions.", "grammar": "Er schnitt die Zwiebeln – he chopped the onions."}, {"type": "practice", "prompt": "Now say “glad” – froh.", "answer": "Froh. Ich bin froh, dass du gekommen bist – I am glad you came. Ich bin froh, dass.", "slow": "Froh. Ich bin froh, dass du gekommen bist – I am glad you came. Ich bin froh, dass.", "grammar": "Ich bin froh, dass du gekommen bist – I am glad you came. Ich bin froh, dass ich geblieben bin – I am glad I stayed."}], "bg": "bridge", "location": "The Canal Bridge"}, {"id": 8, "title": "The Text", "level": "A2", "segments": [{"type": "narration", "text": "occasional distant thunder.) Things were good for exactly four days. That is not a complaint. Four days of waking up next to Matei, of his arm around my waist, of coffee that he made and left on the table with a note that said things like Do not burn the milk and You have flour in your hair. Four days of coming home to someone who was actually happy to see me. Four days of not running. Then Lukas texted."}, {"type": "practice", "prompt": "Now say “the text message” – die SMS or die Nachricht.", "answer": "Die Nachricht. Feminine. Er hat mir eine Nachricht geschickt – he sent me a.", "slow": "Die Nachricht. Feminine. Er hat mir eine Nachricht geschickt – he sent me a.", "grammar": "Feminine. Er hat mir eine Nachricht geschickt – he sent me a message."}, {"type": "practice", "prompt": "Now say “to text” – texten or eine Nachricht schicken.", "answer": "Texten. Lukas hat mir getextet – Lukas texted me.", "slow": "Texten. Lukas hat mir getextet – Lukas texted me.", "grammar": "Lukas hat mir getextet – Lukas texted me."}, {"type": "narration", "text": "--Hey Yves. Matei is being a dick at work today. You should come by the bookstore and witness it. I will buy you a coffee. I read the message three times. It was friendly. Casual. The kind of thing you would send to a friend's roommate. Nothing weird about it. But I did not tell Matei."}, {"type": "practice", "prompt": "Now say “to read” – lesen.", "answer": "Lesen. Ich lese die Nachricht – I read the message.", "slow": "Lesen. Ich lese die Nachricht – I read the message.", "grammar": "Ich lese die Nachricht – I read the message. Lesen is stem-changing. Ich lese, du liest, er liest. Repeat: du liest."}, {"type": "practice", "prompt": "Now say “to tell” – erzählen or sagen.", "answer": "Sagen. Ich habe es ihm nicht gesagt – I did not tell him.", "slow": "Sagen. Ich habe es ihm nicht gesagt – I did not tell him.", "grammar": "Ich habe es ihm nicht gesagt – I did not tell him."}, {"type": "narration", "text": "--That is the thing about trust. It is fragile. And I had spent my whole life learning to keep things to myself. Not because I was dishonest. Because I was scared. Scared that if I showed someone everything, they would use it against me. Or worse – they would get bored and leave."}, {"type": "practice", "prompt": "Now say “trust” – das Vertrauen.", "answer": "Das Vertrauen. Neuter. Vertrauen ist zerbrechlich – trust is fragile.", "slow": "Das Vertrauen. Neuter. Vertrauen ist zerbrechlich – trust is fragile.", "grammar": "Neuter. Vertrauen ist zerbrechlich – trust is fragile."}, {"type": "practice", "prompt": "Now say “dishonest” – unehrlich.", "answer": "Unehrlich. Ich bin nicht unehrlich – I am not dishonest.", "slow": "Unehrlich. Ich bin nicht unehrlich – I am not dishonest.", "grammar": "Ich bin nicht unehrlich – I am not dishonest."}, {"type": "narration", "text": "--The next day, Lukas texted again. Seriously, Yves. He just yelled at a customer for pronouncing “Goethe” wrong. It was beautiful. I laughed. I could not help it. The image of Matei losing his cool over a mispronounced dead poet was too good. What did the customer do? I wrote back. Left. But not before calling Matei a “pedantisches Arschloch.” Which is fair, honestly."}, {"type": "practice", "prompt": "Now say “to yell” – schreien.", "answer": "Schreien. Er hat einen Kunden angeschrien – he yelled at a customer.", "slow": "Schreien. Er hat einen Kunden angeschrien – he yelled at a customer.", "grammar": "Er hat einen Kunden angeschrien – he yelled at a customer."}, {"type": "practice", "prompt": "Now say “the poet” – der Dichter.", "answer": "Der Dichter. Masculine. Ein toter Dichter – a dead poet.", "slow": "Der Dichter. Masculine. Ein toter Dichter – a dead poet.", "grammar": "Masculine. Ein toter Dichter – a dead poet."}, {"type": "narration", "text": "--What does that mean? I wrote. Pedantic asshole. I laughed again. Matei, who remembered everything, who corrected my German gently, who had never once made me feel stupid – was apparently a terror at work. I will come by after my shift, I wrote. Bring pastries, Lukas replied. Frau Schmidt's apricot ones. Matei will not admit it but he is obsessed."}, {"type": "practice", "prompt": "Now say “pedantic” – pedantisch.", "answer": "Pedantisch. Ein pedantischer Arschloch – a pedantic asshole.", "slow": "Pedantisch. Ein pedantischer Arschloch – a pedantic asshole.", "grammar": "Ein pedantischer Arschloch – a pedantic asshole."}, {"type": "practice", "prompt": "Now say “to admit” – zugeben (separable). Review.", "answer": "Zugeben. Er gibt es nicht zu – he does not admit it.", "slow": "Zugeben. Er gibt es nicht zu – he does not admit it.", "grammar": "Er gibt es nicht zu – he does not admit it."}, {"type": "narration", "text": "--I did not bring pastries. I brought two croissants and a guilty conscience. Lukas was behind the counter. He saw me and waved."}, {"type": "dialogue", "text": "“Yves! You came.”"}, {"type": "dialogue", "text": "“You said you would buy me coffee.”"}, {"type": "practice", "prompt": "Now say “the croissant” – das Croissant.", "answer": "Das Croissant. Neuter. Zwei Croissants – two croissants.", "slow": "Das Croissant. Neuter. Zwei Croissants – two croissants.", "grammar": "Neuter. Zwei Croissants – two croissants."}, {"type": "practice", "prompt": "Now say “the conscience” – das Gewissen.", "answer": "Das Gewissen. Neuter. Ein schlechtes Gewissen – a guilty conscience.", "slow": "Das Gewissen. Neuter. Ein schlechtes Gewissen – a guilty conscience.", "grammar": "Neuter. Ein schlechtes Gewissen – a guilty conscience."}, {"type": "narration", "text": "--He poured two cups from a pot behind the counter. Handed me one. “How is the café?”"}, {"type": "dialogue", "text": "“Good. Frau Schmidt says I am improving.”"}, {"type": "dialogue", "text": "“She texted Matei that you dropped a cup last week.”"}, {"type": "dialogue", "text": "“She texts him everything.”"}, {"type": "dialogue", "text": "“She is in love with him. We all are.” He leaned on the counter. His smile was"}, {"type": "narration", "text": "easy. “So. You and Matei.”"}, {"type": "practice", "prompt": "Now say “to improve” – sich verbessern.", "answer": "Sich verbessern. Ich verbessere mich – I am improving.", "slow": "Sich verbessern. Ich verbessere mich – I am improving.", "grammar": "Ich verbessere mich – I am improving."}, {"type": "practice", "prompt": "Now say “in love” – verliebt. In jemanden verliebt sein – to be in love with", "answer": "someone.", "slow": "someone.", "grammar": "Repeat aloud: someone."}, {"type": "narration", "text": "--I took a sip of coffee. It was terrible. Worse than Frau Schmidt's."}, {"type": "dialogue", "text": "“What about us?”"}, {"type": "dialogue", "text": "“Are you together or not? He will not say. You will not say. It is like watching"}, {"type": "narration", "text": "two cats circle each other.” I did not know how to answer. Boyfriend felt too small. Something else – I did not have a word for it."}, {"type": "dialogue", "text": "“We are figuring it out,” I said."}, {"type": "practice", "prompt": "Now say “the cat” – die Katze.", "answer": "Die Katze. Feminine. Zwei Katzen – two cats.", "slow": "Die Katze. Feminine. Zwei Katzen – two cats.", "grammar": "Feminine. Zwei Katzen – two cats."}, {"type": "practice", "prompt": "Now say “to circle” – kreisen.", "answer": "Kreisen. Sie kreisen umeinander – they circle each other.", "slow": "Kreisen. Sie kreisen umeinander – they circle each other.", "grammar": "Sie kreisen umeinander – they circle each other."}, {"type": "narration", "text": "--Lukas nodded. “That is what he said.” He paused. “He is different with you, you know. Softer. It is weird.”"}, {"type": "dialogue", "text": "“Weird bad or weird good?”"}, {"type": "dialogue", "text": "“Weird good.” He smiled again. “He deserves someone who does not run away.”"}, {"type": "narration", "text": "The words hit me like a slap. Not because Lukas meant them badly – he did not. But because run away was exactly what I had done my whole life. And Matei knew it. And he had stayed anyway."}, {"type": "practice", "prompt": "Now say “soft” – weich. Weicher – softer.", "answer": "Weicher. Er ist weicher mit dir – he is softer with you.", "slow": "Weicher. Er ist weicher mit dir – he is softer with you.", "grammar": "Er ist weicher mit dir – he is softer with you."}, {"type": "practice", "prompt": "Now say “to deserve” – verdienen.", "answer": "Verdienen. Er verdient jemanden, der nicht wegläuft – he deserves someone who does.", "slow": "Verdienen. Er verdient jemanden, der nicht wegläuft – he deserves someone who does.", "grammar": "Er verdient jemanden, der nicht wegläuft – he deserves someone who does not run away."}, {"type": "dialogue", "text": "--“Where is he?” I asked."}, {"type": "dialogue", "text": "“Back room. Helping with the reading. He will be out in an hour.”"}, {"type": "narration", "text": "I nodded. Drank the terrible coffee. Made small talk about nothing. Then I left without saying goodbye to Matei."}, {"type": "practice", "prompt": "Now say “the back room” – der Hinterraum.", "answer": "Der Hinterraum. Masculine. Im Hinterraum – in the back room.", "slow": "Der Hinterraum. Masculine. Im Hinterraum – in the back room.", "grammar": "Masculine. Im Hinterraum – in the back room."}, {"type": "practice", "prompt": "Now say “small talk” – das Smalltalk or die Plauderei.", "answer": "Das Smalltalk. Neuter. Wir machten Smalltalk – we made small talk.", "slow": "Das Smalltalk. Neuter. Wir machten Smalltalk – we made small talk.", "grammar": "Neuter. Wir machten Smalltalk – we made small talk."}, {"type": "narration", "text": "--That night, he came home late again. I was on the sofa, pretending to read. The book was the same one from last week. I was still on the same page."}, {"type": "dialogue", "text": "“Lukas said you stopped by,” Matei said, hanging his coat."}, {"type": "dialogue", "text": "“I was in the neighbourhood.”"}, {"type": "dialogue", "text": "“You work across town.”"}, {"type": "dialogue", "text": "“I had errands.”"}, {"type": "narration", "text": "He walked to the kitchen. Poured himself a glass of water."}, {"type": "practice", "prompt": "Now say “the neighbourhood” – die Nachbarschaft.", "answer": "Die Nachbarschaft. Feminine. In der Nachbarschaft – in the neighbourhood.", "slow": "Die Nachbarschaft. Feminine. In der Nachbarschaft – in the neighbourhood.", "grammar": "Feminine. In der Nachbarschaft – in the neighbourhood."}, {"type": "practice", "prompt": "Now say “the errand” – die Besorgung.", "answer": "Die Besorgung. Feminine. Besorgungen machen – to run errands.", "slow": "Die Besorgung. Feminine. Besorgungen machen – to run errands.", "grammar": "Feminine. Besorgungen machen – to run errands."}, {"type": "dialogue", "text": "“Yves.”"}, {"type": "dialogue", "text": "“What?”"}, {"type": "dialogue", "text": "“Why did you not come say hi?”"}, {"type": "narration", "text": "I put the book down. “You were busy.”"}, {"type": "dialogue", "text": "“I was in the back room. It is not a fortress.”"}, {"type": "dialogue", "text": "“I did not want to interrupt.”"}, {"type": "narration", "text": "He turned. His face was tired. “You are never an interruption.”"}, {"type": "practice", "prompt": "Now say “the fortress” – die Festung.", "answer": "Die Festung. Feminine. Es ist keine Festung – it is not a fortress.", "slow": "Die Festung. Feminine. Es ist keine Festung – it is not a fortress.", "grammar": "Feminine. Es ist keine Festung – it is not a fortress."}, {"type": "practice", "prompt": "Now say “to interrupt” – unterbrechen.", "answer": "Unterbrechen. Ich wollte nicht unterbrechen – I did not want to interrupt.", "slow": "Unterbrechen. Ich wollte nicht unterbrechen – I did not want to interrupt.", "grammar": "Ich wollte nicht unterbrechen – I did not want to interrupt."}, {"type": "narration", "text": "--I wanted to believe him. But I had heard those words before. From my grandmother. From friends. From people who said you are never a burden and then stopped calling."}, {"type": "dialogue", "text": "“Lukas is nice,” I said, changing the subject."}, {"type": "dialogue", "text": "“Lukas is a pain in the ass.”"}, {"type": "dialogue", "text": "“He said you yelled at a customer.”"}, {"type": "dialogue", "text": "“The customer deserved it.”"}, {"type": "dialogue", "text": "“For mispronouncing Goethe?”"}, {"type": "practice", "prompt": "Now say “a pain in the ass” – eine Nervensäge (literally a nerve saw).", "answer": "Eine Nervensäge. Feminine. Lukas ist eine Nervensäge – Lukas is a pain in the ass.", "slow": "Eine Nervensäge. Feminine. Lukas ist eine Nervensäge – Lukas is a pain in the ass.", "grammar": "Feminine. Lukas ist eine Nervensäge – Lukas is a pain in the ass."}, {"type": "practice", "prompt": "Now say “to mispronounce” – falsch aussprechen (separable).", "answer": "Falsch aussprechen. Er hat Goethe falsch ausgesprochen – he mispronounced Goethe.", "slow": "Falsch aussprechen. Er hat Goethe falsch ausgesprochen – he mispronounced Goethe.", "grammar": "Er hat Goethe falsch ausgesprochen – he mispronounced Goethe."}, {"type": "narration", "text": "--Matei's jaw tightened. “He said Go-eth. Like the word ‘go’ and then ‘eth.’ It was offensive.” I laughed. “You are ridiculous.”"}, {"type": "dialogue", "text": "“I am principled.”"}, {"type": "dialogue", "text": "“Same thing.”"}, {"type": "narration", "text": "He almost smiled. Almost. Then he looked at me – really looked – and the almost disappeared."}, {"type": "dialogue", "text": "“Why did you really come to the bookstore, Yves?”"}, {"type": "dialogue", "text": "“I told you. Errands.”"}, {"type": "dialogue", "text": "“You are lying.”"}, {"type": "practice", "prompt": "Now say “ridiculous” – lächerlich.", "answer": "Lächerlich. Du bist lächerlich – you are ridiculous.", "slow": "Lächerlich. Du bist lächerlich – you are ridiculous.", "grammar": "Du bist lächerlich – you are ridiculous."}, {"type": "practice", "prompt": "Now say “principled” – prinzipientreu.", "answer": "Prinzipientreu. Ich bin prinzipientreu – I am principled.", "slow": "Prinzipientreu. Ich bin prinzipientreu – I am principled.", "grammar": "Ich bin prinzipientreu – I am principled."}, {"type": "dialogue", "text": "--“I am not.”"}, {"type": "narration", "text": "He walked to the sofa. Sat on the other end."}, {"type": "dialogue", "text": "“Lukas texted you, did he not?”"}, {"type": "dialogue", "text": "“I saw him typing on his phone. He had that look. The one he gets when he is"}, {"type": "dialogue", "text": "“He is not meddling. He is being friendly.”"}, {"type": "dialogue", "text": "“Lukas is never just friendly.” Matei's voice was flat. “He flirts with everyone."}, {"type": "narration", "text": "Including people who are taken.”"}, {"type": "practice", "prompt": "Now say “to meddle” – sich einmischen.", "answer": "Sich einmischen. Er mischt sich ein – he meddles.", "slow": "Sich einmischen. Er mischt sich ein – he meddles.", "grammar": "Er mischt sich ein – he meddles."}, {"type": "practice", "prompt": "Now say “taken” – vergeben (past participle of vergeben – to give away).", "answer": "Vergeben. Leute, die vergeben sind – people who are taken.", "slow": "Vergeben. Leute, die vergeben sind – people who are taken.", "grammar": "Leute, die vergeben sind – people who are taken."}, {"type": "dialogue", "text": "--“We are not –”"}, {"type": "dialogue", "text": "“We are not what? Together? Living together? Sleeping in the same bed?” He ran a"}, {"type": "narration", "text": "hand through his hair. “I am not asking for a label, Yves. I am asking for honesty.”"}, {"type": "dialogue", "text": "“I am being honest.”"}, {"type": "dialogue", "text": "“Then why did you not tell me he texted you?”"}, {"type": "narration", "text": "Because I was scared. Because I did not know how to do this."}, {"type": "dialogue", "text": "“I did not think it mattered,” I said."}, {"type": "practice", "prompt": "Now say “honesty” – die Ehrlichkeit.", "answer": "Die Ehrlichkeit. Feminine. Ich bitte um Ehrlichkeit – I am asking for honesty.", "slow": "Die Ehrlichkeit. Feminine. Ich bitte um Ehrlichkeit – I am asking for honesty.", "grammar": "Feminine. Ich bitte um Ehrlichkeit – I am asking for honesty."}, {"type": "practice", "prompt": "Now say “the label” – das Etikett or die Bezeichnung.", "answer": "Das Etikett. Neuter. Ich frage nicht nach einem Etikett – I am not asking for a.", "slow": "Das Etikett. Neuter. Ich frage nicht nach einem Etikett – I am not asking for a.", "grammar": "Neuter. Ich frage nicht nach einem Etikett – I am not asking for a label."}, {"type": "dialogue", "text": "--“It matters.”"}, {"type": "dialogue", "text": "“Why? Because you are jealous?”"}, {"type": "narration", "text": "The word hung in the air. Matei's expression did not change. But his hands – his hands curled into fists on his knees."}, {"type": "dialogue", "text": "“Yes,” he said. “I am jealous. Is that what you wanted to hear?”"}, {"type": "dialogue", "text": "“Matei –”"}, {"type": "dialogue", "text": "“I am jealous. I am angry. I am scared. I am all the things I told myself I would"}, {"type": "narration", "text": "not be again.” He stood up. Walked to the window. “I gave you a key. I gave you a job. I gave you my bed. And you are still holding back.”"}, {"type": "practice", "prompt": "Now say “jealous” – eifersüchtig.", "answer": "Eifersüchtig. Ich bin eifersüchtig – I am jealous.", "slow": "Eifersüchtig. Ich bin eifersüchtig – I am jealous.", "grammar": "Ich bin eifersüchtig – I am jealous."}, {"type": "practice", "prompt": "Now say “the fist” – die Faust.", "answer": "Die Faust. Feminine. Seine Hände ballten sich zu Fäusten – his hands curled into.", "slow": "Die Faust. Feminine. Seine Hände ballten sich zu Fäusten – his hands curled into.", "grammar": "Feminine. Seine Hände ballten sich zu Fäusten – his hands curled into fists."}, {"type": "dialogue", "text": "--“I am not holding back.”"}, {"type": "dialogue", "text": "“You did not tell me about the texts.”"}, {"type": "dialogue", "text": "“Because I did not want you to overreact.”"}, {"type": "dialogue", "text": "“Overreact?” He turned. His grey eyes were hard. “I asked you one thing. One"}, {"type": "narration", "text": "thing. Honesty. That is it. I do not care if Lukas flirts with you. I care that you hid it.”"}, {"type": "dialogue", "text": "“I did not hide it. I just –”"}, {"type": "dialogue", "text": "“You just decided I could not handle it?” He laughed. It was not a happy sound."}, {"type": "dialogue", "text": "“You do not get to decide what I can handle, Yves. That is not your job.”"}, {"type": "practice", "prompt": "Now say “to overreact” – überreagieren.", "answer": "Überreagieren. Ich wollte nicht, dass du überreagierst – I did not want you to.", "slow": "Überreagieren. Ich wollte nicht, dass du überreagierst – I did not want you to.", "grammar": "Ich wollte nicht, dass du überreagierst – I did not want you to overreact."}, {"type": "practice", "prompt": "Now say “to hide” – verstecken. Review.", "answer": "Verstecken. Du hast es versteckt – you hid it.", "slow": "Verstecken. Du hast es versteckt – you hid it.", "grammar": "Du hast es versteckt – you hid it."}, {"type": "narration", "text": "--I stood up. “Then what is my job? To tell you everything? Every text, every conversation, every time someone looks at me?”"}, {"type": "dialogue", "text": "“No. Your job is to trust me.”"}, {"type": "dialogue", "text": "“I do trust you.”"}, {"type": "dialogue", "text": "“Then act like it.”"}, {"type": "narration", "text": "The room was silent. The lamp buzzed. The radiator clicked."}, {"type": "dialogue", "text": "“I do not know how,” I said finally."}, {"type": "narration", "text": "Matei's face softened. Just a little."}, {"type": "dialogue", "text": "“I know,” he said. “That is why I am still here.”"}, {"type": "practice", "prompt": "Now say “to act like it” – danach handeln.", "answer": "Danach handeln. Handel danach – act like it.", "slow": "Danach handeln. Handel danach – act like it.", "grammar": "Handel danach – act like it."}, {"type": "practice", "prompt": "Now say “to soften” – sanfter werden.", "answer": "Sanfter werden. Sein Gesicht wurde sanfter – his face softened.", "slow": "Sanfter werden. Sein Gesicht wurde sanfter – his face softened.", "grammar": "Sein Gesicht wurde sanfter – his face softened."}, {"type": "narration", "text": "--He walked to me. Put his hands on my shoulders."}, {"type": "dialogue", "text": "“I am not asking you to be perfect,” he said. “I am asking you to try.”"}, {"type": "dialogue", "text": "“I am trying.”"}, {"type": "dialogue", "text": "“Then try harder.”"}, {"type": "narration", "text": "I wanted to be angry. I wanted to push him away. But I was tired of being the person who always left first."}, {"type": "dialogue", "text": "“Okay,” I said."}, {"type": "dialogue", "text": "“Okay?”"}, {"type": "dialogue", "text": "“Okay. I will try harder.”"}, {"type": "narration", "text": "He kissed my forehead."}, {"type": "dialogue", "text": "“That is all I need.”"}, {"type": "practice", "prompt": "Now say “perfect” – perfekt.", "answer": "Perfekt. Ich bitte dich nicht, perfekt zu sein – I am not asking you to be.", "slow": "Perfekt. Ich bitte dich nicht, perfekt zu sein – I am not asking you to be.", "grammar": "Ich bitte dich nicht, perfekt zu sein – I am not asking you to be perfect."}, {"type": "practice", "prompt": "Now say “to push away” – wegstoßen (separable).", "answer": "Wegstoßen. Ich wollte ihn wegstoßen – I wanted to push him away.", "slow": "Wegstoßen. Ich wollte ihn wegstoßen – I wanted to push him away.", "grammar": "Ich wollte ihn wegstoßen – I wanted to push him away."}, {"type": "narration", "text": "--We went to bed. He held me. I did not sleep. I stared at the ceiling and thought about Lukas's texts. About Matei's jealousy. About the word together and what it actually meant. I pulled out my phone. Opened Lukas's messages. Hey, I wrote. Thanks for the coffee. But maybe do not text me about Matei anymore. It is weird for both of us. Three dots appeared. Then disappeared. Then: Fair enough. Take care of him. And yourself."}, {"type": "practice", "prompt": "Now say “to take care of” – sich kümmern um.", "answer": "Sich kümmern um. Kümmere dich um ihn – take care of him.", "slow": "Sich kümmern um. Kümmere dich um ihn – take care of him.", "grammar": "Kümmere dich um ihn – take care of him."}, {"type": "practice", "prompt": "Now say “fair enough” – in Ordnung or fair genug.", "answer": "Fair genug. Fair genug – fair enough.", "slow": "Fair genug. Fair genug – fair enough.", "grammar": "Fair genug – fair enough."}, {"type": "narration", "text": "--I put the phone away. Turned over. Pressed my face into Matei's back. He was warm. He was here. He was staying. For now, that was enough."}, {"type": "practice", "prompt": "Now say “to press” – drücken.", "answer": "Drücken. Ich drückte mein Gesicht in seinen Rücken – I pressed my face into his.", "slow": "Drücken. Ich drückte mein Gesicht in seinen Rücken – I pressed my face into his.", "grammar": "Ich drückte mein Gesicht in seinen Rücken – I pressed my face into his back."}, {"type": "practice", "prompt": "Now say “for now” – vorerst.", "answer": "Vorerst. Vorerst reicht das – for now, that is enough.", "slow": "Vorerst. Vorerst reicht das – for now, that is enough.", "grammar": "Vorerst reicht das – for now, that is enough."}], "bg": "apartment", "location": "Matei's Apartment — Night"}, {"id": 9, "title": "The Morning After", "level": "A2", "segments": [{"type": "narration", "text": "passing, distant church bell.) I woke up alone. On the table, there was coffee. Black. No sugar. No milk. And a note. Yves – I need some air. I will be back tonight. – M. I read the note three times. His handwriting was small and neat. The same handwriting that had written Do not burn the milk. Now it wrote I need some air."}, {"type": "practice", "prompt": "Now say “the air” – die Luft. Review.", "answer": "Die Luft. Ich brauche etwas Luft – I need some air.", "slow": "Die Luft. Ich brauche etwas Luft – I need some air.", "grammar": "Ich brauche etwas Luft – I need some air."}, {"type": "practice", "prompt": "Now say “the note” – der Zettel. Review.", "answer": "Der Zettel. Ein Zettel – a note.", "slow": "Der Zettel. Ein Zettel – a note.", "grammar": "Ein Zettel – a note."}, {"type": "narration", "text": "--Work was a disaster. I dropped two cups before noon. Frau Schmidt sat me down."}, {"type": "dialogue", "text": "“What happened?” she asked."}, {"type": "dialogue", "text": "“Nothing.”"}, {"type": "dialogue", "text": "“You dropped two cups. Last week you dropped four total. This is regression.”"}, {"type": "dialogue", "text": "“I am tired.”"}, {"type": "dialogue", "text": "“You are lying.” She folded her arms. “Did you and Matei fight?”"}, {"type": "practice", "prompt": "Now say “the disaster” – die Katastrophe. Review.", "answer": "Die Katastrophe. Die Arbeit war eine Katastrophe – work was a disaster.", "slow": "Die Katastrophe. Die Arbeit war eine Katastrophe – work was a disaster.", "grammar": "Die Arbeit war eine Katastrophe – work was a disaster."}, {"type": "practice", "prompt": "Now say “the regression” – der Rückschritt. Review.", "answer": "Der Rückschritt. Das ist ein Rückschritt – that's regression.", "slow": "Der Rückschritt. Das ist ein Rückschritt – that's regression.", "grammar": "Das ist ein Rückschritt – that's regression."}, {"type": "narration", "text": "--I stared at the table. The wood was scratched. Someone had carved a heart into it, years ago, with two initials inside. T + M. Not Matei. Someone else."}, {"type": "dialogue", "text": "“He is upset,” I said. “Because I did not tell him about something.”"}, {"type": "dialogue", "text": "“What something?”"}, {"type": "dialogue", "text": "“A friend texted me. A coworker of his. It was nothing. But I did not mention it,"}, {"type": "narration", "text": "and he found out, and now he thinks I am hiding things.”"}, {"type": "practice", "prompt": "Now say “upset” – verärgert.", "answer": "Verärgert. Er ist verärgert – he is upset.", "slow": "Verärgert. Er ist verärgert – he is upset.", "grammar": "Er ist verärgert – he is upset."}, {"type": "practice", "prompt": "Now say “the heart” – das Herz.", "answer": "Das Herz. Neuter. Ein Herz in den Tisch geschnitzt – a heart carved into the.", "slow": "Das Herz. Neuter. Ein Herz in den Tisch geschnitzt – a heart carved into the.", "grammar": "Neuter. Ein Herz in den Tisch geschnitzt – a heart carved into the table."}, {"type": "narration", "text": "--Frau Schmidt was quiet for a moment. Then she said, “Is he wrong?” I looked up. “What?”"}, {"type": "dialogue", "text": "“Are you hiding things? Not the texts. Other things.”"}, {"type": "narration", "text": "I opened my mouth. Closed it."}, {"type": "dialogue", "text": "“I do not know,” I said. “Maybe. I do not know how to do this.”"}, {"type": "dialogue", "text": "“Do what?”"}, {"type": "dialogue", "text": "“This.” I gestured at the café, at the window, at the grey sky. “Being with"}, {"type": "narration", "text": "someone. Staying. Not running.”"}, {"type": "practice", "prompt": "Now say “to gesture” – gestikulieren.", "answer": "Gestikulieren. Ich gestikulierte – I gestured.", "slow": "Gestikulieren. Ich gestikulierte – I gestured.", "grammar": "Ich gestikulierte – I gestured."}, {"type": "practice", "prompt": "Now say “to run” – rennen or laufen. Nicht rennen – not running.", "answer": "--She nodded slowly. “My husband was like you.”.", "slow": "--She nodded slowly. “My husband was like you.”.", "grammar": "“My husband was like you.” “He ran?” “He tried. Many times. The first year we were married, he packed a bag three times. Each time, I unpacked it for him.” She smiled. “The fourth time, he packed the bag, and I packed one too. I told him, ‘If you go, I go.’ He never packed again.” “That is not advice.” “It is not advice. It is a story.” She reached across the table and patted my hand. “You want advice? Here it is. Stop trying to be perfect. You will make mistakes. You will hurt him. He will hurt you. This is what it means to be with someone. The question is not whether you will make mistakes. "}, {"type": "practice", "prompt": "Now say “to pack a bag” – einen Koffer packen. Review.", "answer": "Einen Koffer packen. Er packte einen Koffer – he packed a bag.", "slow": "Einen Koffer packen. Er packte einen Koffer – he packed a bag.", "grammar": "Er packte einen Koffer – he packed a bag."}, {"type": "practice", "prompt": "Now say “the mistake” – der Fehler. Review.", "answer": "Der Fehler. Du wirst Fehler machen – you will make mistakes.", "slow": "Der Fehler. Du wirst Fehler machen – you will make mistakes.", "grammar": "Du wirst Fehler machen – you will make mistakes."}, {"type": "narration", "text": "--I looked at the heart carved into the table. T + M."}, {"type": "dialogue", "text": "“What if he leaves first?” I asked."}, {"type": "dialogue", "text": "“Then you let him. And you learn. And you try again with someone else.” She"}, {"type": "narration", "text": "squeezed my hand. “But he has not left yet. Has he?”"}, {"type": "dialogue", "text": "“No.”"}, {"type": "dialogue", "text": "“Then stop planning for a disaster that has not happened.”"}, {"type": "practice", "prompt": "Now say “to let go” – loslassen. Review.", "answer": "Loslassen. Dann lässt du ihn gehen – then you let him go.", "slow": "Loslassen. Dann lässt du ihn gehen – then you let him go.", "grammar": "Dann lässt du ihn gehen – then you let him go."}, {"type": "practice", "prompt": "Now say “to plan” – planen. Hör auf, eine Katastrophe zu planen – stop planning a", "answer": "disaster.", "slow": "disaster.", "grammar": "Repeat aloud: disaster."}, {"type": "narration", "text": "--I left work early. Frau Schmidt shooed me out the door with a bag of apricot pastries. I walked to the bridge. The duck was there today, paddling in circles. I leaned on the railing and ate a pastry. It was warm. Flaky. Too sweet. I ate another one. My phone buzzed. Matei: Where are you?"}, {"type": "practice", "prompt": "Now say “to shoo away” – fortscheuchen. Review.", "answer": "Fortscheuchen. Frau Schmidt scheuchte mich weg – Frau Schmidt shooed me away.", "slow": "Fortscheuchen. Frau Schmidt scheuchte mich weg – Frau Schmidt shooed me away.", "grammar": "Frau Schmidt scheuchte mich weg – Frau Schmidt shooed me away."}, {"type": "practice", "prompt": "Now say “the railing” – das Geländer. Review.", "answer": "Das Geländer. Auf das Geländer lehnen – to lean on the railing.", "slow": "Das Geländer. Auf das Geländer lehnen – to lean on the railing.", "grammar": "Auf das Geländer lehnen – to lean on the railing."}, {"type": "narration", "text": "--I stared at the message. He had not texted me all day. Now he was asking where I was. Bridge, I wrote back. The one with the duck. I know which one. Stay there. I waited. The duck paddled. A family walked past with a dog on a leash. The dog tried to jump into the canal. The family laughed. Twenty minutes later, Matei appeared at the end of the bridge."}, {"type": "practice", "prompt": "Now say “the leash” – die Leine. Review.", "answer": "Die Leine. Ein Hund an der Leine – a dog on a leash.", "slow": "Die Leine. Ein Hund an der Leine – a dog on a leash.", "grammar": "Ein Hund an der Leine – a dog on a leash."}, {"type": "practice", "prompt": "Now say “to appear” – auftauchen. Review.", "answer": "Auftauchen. Matei tauchte am Ende der Brücke auf – Matei appeared at the end of.", "slow": "Auftauchen. Matei tauchte am Ende der Brücke auf – Matei appeared at the end of.", "grammar": "Matei tauchte am Ende der Brücke auf – Matei appeared at the end of the bridge."}, {"type": "narration", "text": "--He was wearing the same grey coat. His hands were in his pockets. His hair was messy. He walked to me. Stopped a metre away. Did not touch me."}, {"type": "dialogue", "text": "“You came,” I said."}, {"type": "dialogue", "text": "“I said I would.”"}, {"type": "dialogue", "text": "“You also said you needed air.”"}, {"type": "dialogue", "text": "“I got air.” He looked at the duck. “A lot of air. I walked halfway across the"}, {"type": "dialogue", "text": "“Did it help?”"}, {"type": "dialogue", "text": "“No.”"}, {"type": "practice", "prompt": "Now say “halfway” – die Hälfte. Die halbe Stadt – half the city.", "answer": "Die halbe Stadt. Ich bin die halbe Stadt gelaufen – I walked halfway across the.", "slow": "Die halbe Stadt. Ich bin die halbe Stadt gelaufen – I walked halfway across the.", "grammar": "Ich bin die halbe Stadt gelaufen – I walked halfway across the city."}, {"type": "practice", "prompt": "Now say “to help” – helfen. Hat es geholfen? – Did it help?", "answer": "--I offered him a pastry. He took it. Ate it in two bites.", "slow": "--I offered him a pastry. He took it. Ate it in two bites.", "grammar": "He took it. Ate it in two bites. “I am not good at this,” he said. “At what?” “At being angry.” He turned to look at me. His grey eyes were tired. “When I am angry, I shut down. I leave. I do not talk. It is what I learned. From my father. From the ex. From all the people who taught me that anger is dangerous.” “It is dangerous.” “Not when it is honest.”"}, {"type": "practice", "prompt": "Now say “to shut down” – sich verschließen. Review.", "answer": "Sich verschließen. Ich verschließe mich – I shut down.", "slow": "Sich verschließen. Ich verschließe mich – I shut down.", "grammar": "Ich verschließe mich – I shut down."}, {"type": "practice", "prompt": "Now say “dangerous” – gefährlich. Review.", "answer": "Gefährlich. Wut ist gefährlich – anger is dangerous.", "slow": "Gefährlich. Wut ist gefährlich – anger is dangerous.", "grammar": "Wut ist gefährlich – anger is dangerous."}, {"type": "dialogue", "text": "“I was angry last night. Not because of Lukas. Because you did not trust me.”"}, {"type": "dialogue", "text": "“I do trust you.”"}, {"type": "dialogue", "text": "“You hide things. Small things. Things that do not matter. And every time you hide"}, {"type": "narration", "text": "something, I wonder what else you are hiding.” I wanted to argue. But that was not true. I had been hiding my whole life."}, {"type": "practice", "prompt": "Now say “to wonder” – sich fragen. Review.", "answer": "Sich fragen. Ich frage mich, was du noch versteckst – I wonder what else you are.", "slow": "Sich fragen. Ich frage mich, was du noch versteckst – I wonder what else you are.", "grammar": "Ich frage mich, was du noch versteckst – I wonder what else you are hiding."}, {"type": "practice", "prompt": "Now say “to argue” – diskutieren or streiten. Review.", "answer": "Diskutieren. Ich wollte diskutieren – I wanted to argue.", "slow": "Diskutieren. Ich wollte diskutieren – I wanted to argue.", "grammar": "Ich wollte diskutieren – I wanted to argue."}, {"type": "dialogue", "text": "--“I am scared,” I said."}, {"type": "dialogue", "text": "“I know.”"}, {"type": "dialogue", "text": "“I am scared that if you know everything about me, you will leave.”"}, {"type": "narration", "text": "He stepped closer. Close enough that I could smell his coat. Cold air. Coffee. Him."}, {"type": "dialogue", "text": "“Yves.”"}, {"type": "dialogue", "text": "“What?”"}, {"type": "dialogue", "text": "“I already know everything about you. Not the facts. The shape of you. The parts"}, {"type": "narration", "text": "that matter.” He reached out. His hand touched my face. “You are scared. You are lonely. You want to be loved but you do not know how to ask for it. You make pasta from memory and drink coffee black and laugh when you are uncomfortable. You dropped a cup yesterday and apologised to the floor.”"}, {"type": "practice", "prompt": "Now say “the shape” – die Gestalt. Review.", "answer": "Die Gestalt. Die Gestalt von dir – the shape of you.", "slow": "Die Gestalt. Die Gestalt von dir – the shape of you.", "grammar": "Die Gestalt von dir – the shape of you."}, {"type": "practice", "prompt": "Now say “to apologise” – sich entschuldigen. Review.", "answer": "Sich entschuldigen. Du hast dich beim Boden entschuldigt – you apologised to the.", "slow": "Sich entschuldigen. Du hast dich beim Boden entschuldigt – you apologised to the.", "grammar": "Du hast dich beim Boden entschuldigt – you apologised to the floor."}, {"type": "dialogue", "text": "--“I did not apologise to the floor.”"}, {"type": "dialogue", "text": "“Frau Schmidt told me.”"}, {"type": "narration", "text": "I laughed. I could not help it."}, {"type": "dialogue", "text": "“She tells you everything.”"}, {"type": "dialogue", "text": "“She does.” He smiled. A real smile. Small. Tired. Real. “I am not going to leave,"}, {"type": "narration", "text": "Yves. Not because you are perfect. Because you are not. And neither am I.”"}, {"type": "dialogue", "text": "“That is a terrible reason to stay.”"}, {"type": "dialogue", "text": "“It is the only reason that matters.”"}, {"type": "practice", "prompt": "Now say “terrible” – schrecklich. Review.", "answer": "Schrecklich. Das ist ein schrecklicher Grund – that is a terrible reason.", "slow": "Schrecklich. Das ist ein schrecklicher Grund – that is a terrible reason.", "grammar": "Das ist ein schrecklicher Grund – that is a terrible reason."}, {"type": "practice", "prompt": "Now say “to matter” – zählen. Review.", "answer": "Zählen. Der einzige Grund, der zählt – the only reason that matters.", "slow": "Zählen. Der einzige Grund, der zählt – the only reason that matters.", "grammar": "Der einzige Grund, der zählt – the only reason that matters."}, {"type": "narration", "text": "--He kissed me. On the bridge. In front of the duck. A family with a dog whistled and said something in German that I did not understand but sounded approving. When he pulled back, his hand was still on my face."}, {"type": "dialogue", "text": "“No more hiding,” he said."}, {"type": "dialogue", "text": "“No more hiding.”"}, {"type": "dialogue", "text": "“And no more running.”"}, {"type": "dialogue", "text": "“I will try.”"}, {"type": "dialogue", "text": "“That is all I ask.”"}, {"type": "practice", "prompt": "Now say “approving” – zustimmend. Review.", "answer": "Zustimmend. Sie klangen zustimmend – they sounded approving.", "slow": "Zustimmend. Sie klangen zustimmend – they sounded approving.", "grammar": "Sie klangen zustimmend – they sounded approving."}, {"type": "practice", "prompt": "Now say “to try” – versuchen. Review.", "answer": "Versuchen. Ich werde es versuchen – I will try.", "slow": "Versuchen. Ich werde es versuchen – I will try.", "grammar": "Ich werde es versuchen – I will try."}, {"type": "narration", "text": "--We walked home together. His hand was in mine. The streets were wet from a rain I had not noticed."}, {"type": "dialogue", "text": "“Matei.”"}, {"type": "dialogue", "text": "“What?”"}, {"type": "dialogue", "text": "“What is the German word for duck?”"}, {"type": "dialogue", "text": "“Ente.”"}, {"type": "dialogue", "text": "“Ente,” I repeated. “That is a stupid word for such a good animal.”"}, {"type": "dialogue", "text": "“German is a stupid language.”"}, {"type": "dialogue", "text": "“You are German.”"}, {"type": "dialogue", "text": "“I am Romanian. I just live here.”"}, {"type": "narration", "text": "I squeezed his hand. He squeezed back."}, {"type": "practice", "prompt": "Now say “the duck” – die Ente. Review.", "answer": "Die Ente.", "slow": "Die Ente.", "grammar": "Repeat aloud: Die Ente."}, {"type": "practice", "prompt": "Now say “Romanian” – rumänisch. Review.", "answer": "Rumänisch. Ich bin Rumäne – I am Romanian.", "slow": "Rumänisch. Ich bin Rumäne – I am Romanian.", "grammar": "Ich bin Rumäne – I am Romanian."}, {"type": "narration", "text": "--That night, we made dinner together. Pasta again. My grandmother's recipe. He chopped the onions. I cried. Not from the onions. When we went to bed, he held me. His chest was warm against my back."}, {"type": "dialogue", "text": "“Yves.”"}, {"type": "dialogue", "text": "“Hm?”"}, {"type": "dialogue", "text": "“I am glad you came to Berlin.”"}, {"type": "narration", "text": "I turned over. Faced him in the dark."}, {"type": "dialogue", "text": "“I am glad I stayed.”"}, {"type": "narration", "text": "He kissed my forehead."}, {"type": "dialogue", "text": "“Good night.”"}, {"type": "dialogue", "text": "“Good night, Matei.”"}, {"type": "practice", "prompt": "Now say “to chop” – schneiden. Review.", "answer": "Schneiden. Er schnitt die Zwiebeln – he chopped the onions.", "slow": "Schneiden. Er schnitt die Zwiebeln – he chopped the onions.", "grammar": "Er schnitt die Zwiebeln – he chopped the onions."}, {"type": "practice", "prompt": "Now say “glad” – froh. Review.", "answer": "Froh. Ich bin froh, dass du gekommen bist – I am glad you came. Ich bin froh, dass.", "slow": "Froh. Ich bin froh, dass du gekommen bist – I am glad you came. Ich bin froh, dass.", "grammar": "Ich bin froh, dass du gekommen bist – I am glad you came. Ich bin froh, dass ich geblieben bin – I am glad I stayed."}], "bg": "bridge", "location": "The Canal Bridge"}, {"id": 10, "title": "The Call", "level": "A2", "segments": [{"type": "narration", "text": "footsteps, hushed voices.) The week after the bridge was different. Not perfect. Nothing was perfect. Matei still forgot to buy groceries. I still dropped cups at work. We still had moments where the silence between us felt like a held breath, waiting to be released. But we were trying. Both of us. And trying, it turned out, was most of the work. Then Frau Schmidt did not show up for work."}, {"type": "practice", "prompt": "Now say “to show up” – auftauchen (separable). Review.", "answer": "Auftauchen. Frau Schmidt tauchte nicht auf – Frau Schmidt did not show up.", "slow": "Auftauchen. Frau Schmidt tauchte nicht auf – Frau Schmidt did not show up.", "grammar": "Frau Schmidt tauchte nicht auf – Frau Schmidt did not show up."}, {"type": "practice", "prompt": "Now say “the silence” – die Stille.", "answer": "Die Stille. Feminine. Die Stille zwischen uns – the silence between us.", "slow": "Die Stille. Feminine. Die Stille zwischen uns – the silence between us.", "grammar": "Feminine. Die Stille zwischen uns – the silence between us."}, {"type": "narration", "text": "--It was a Tuesday. I arrived at Morgenlicht at 8:45, ten minutes early. Matei had started walking me to work in the mornings. He did not say it was romantic. He just said, “It is on my way.” It was not. He worked in the opposite direction. The café was dark. The green awning was still closed. The chalkboard sign was blank. I stood outside, confused. Frau Schmidt was always here before me. She opened at 8:30. She had a routine – unlock the door, turn on the lights, start the espresso machine. The old brass one that hissed like a cat."}, {"type": "practice", "prompt": "Now say “the routine” – die Routine.", "answer": "Die Routine. Feminine. Sie hatte eine Routine – she had a routine.", "slow": "Die Routine. Feminine. Sie hatte eine Routine – she had a routine.", "grammar": "Feminine. Sie hatte eine Routine – she had a routine."}, {"type": "practice", "prompt": "Now say “the opposite direction” – die entgegengesetzte Richtung.", "answer": "Die entgegengesetzte Richtung. In die entgegengesetzte Richtung – in the opposite.", "slow": "Die entgegengesetzte Richtung. In die entgegengesetzte Richtung – in the opposite.", "grammar": "In die entgegengesetzte Richtung – in the opposite direction."}, {"type": "narration", "text": "--I called her phone. No answer. I texted. Nothing. I waited fifteen minutes. Then I called Matei."}, {"type": "dialogue", "text": "“She is not here,” I said."}, {"type": "dialogue", "text": "“Who?”"}, {"type": "dialogue", "text": "“Frau Schmidt. The café is closed. She is not answering her phone.”"}, {"type": "narration", "text": "He was quiet for a moment. “Stay there. I am coming.”"}, {"type": "practice", "prompt": "Now say “to answer” – antworten or abnehmen (for phone).", "answer": "Abnehmen. Sie nahm nicht ab – she did not answer.", "slow": "Abnehmen. Sie nahm nicht ab – she did not answer.", "grammar": "Sie nahm nicht ab – she did not answer."}, {"type": "practice", "prompt": "Now say “quiet” – still. Einen Moment still sein – to be quiet for a moment.", "answer": "--He arrived in a taxi. That is how I knew he was worried – Matei never took taxis.", "slow": "--He arrived in a taxi. That is how I knew he was worried – Matei never took taxis.", "grammar": "That is how I knew he was worried – Matei never took taxis. He walked everywhere, even when it was raining, even when it was freezing, even when I offered to pay for the bus. “Did you try the back door?” he asked. “There is a back door?” He walked around the building. I followed. The alley behind the café was narrow and smelled like old grease. Matei knocked on a metal door. No answer. He knocked again. Harder."}, {"type": "dialogue", "text": "“Frau Schmidt? It is Matei.”"}, {"type": "narration", "text": "Silence. He tried the handle. It was unlocked."}, {"type": "practice", "prompt": "Now say “the taxi” – das Taxi.", "answer": "Das Taxi. Neuter. Er kam mit dem Taxi – he arrived by taxi.", "slow": "Das Taxi. Neuter. Er kam mit dem Taxi – he arrived by taxi.", "grammar": "Neuter. Er kam mit dem Taxi – he arrived by taxi."}, {"type": "practice", "prompt": "Now say “the alley” – die Gasse.", "answer": "Die Gasse. Feminine. Die Gasse hinter dem Café – the alley behind the café.", "slow": "Die Gasse. Feminine. Die Gasse hinter dem Café – the alley behind the café.", "grammar": "Feminine. Die Gasse hinter dem Café – the alley behind the café."}, {"type": "narration", "text": "--The door opened into a small apartment. A kitchen. A table. A sink full of dishes. Frau Schmidt was on the floor. She was unconscious. Not dead – her chest was moving, slow but steady – but her face was pale, and her lips were grey. A phone lay on the floor next to her hand, like she had tried to call someone and dropped it. Matei was on his knees next to her in half a second. His hand was on her wrist, checking her pulse. His face was calm, but I could see the tremor in his fingers."}, {"type": "dialogue", "text": "“Call an ambulance,” he said."}, {"type": "dialogue", "text": "“I do not know the number.”"}, {"type": "dialogue", "text": "“112. Call. Now.”"}, {"type": "practice", "prompt": "Now say “unconscious” – bewusstlos.", "answer": "Bewusstlos. Sie war bewusstlos – she was unconscious.", "slow": "Bewusstlos. Sie war bewusstlos – she was unconscious.", "grammar": "Sie war bewusstlos – she was unconscious."}, {"type": "practice", "prompt": "Now say “the ambulance” – der Krankenwagen.", "answer": "Der Krankenwagen. Masculine. Ruf einen Krankenwagen – call an ambulance.", "slow": "Der Krankenwagen. Masculine. Ruf einen Krankenwagen – call an ambulance.", "grammar": "Masculine. Ruf einen Krankenwagen – call an ambulance."}, {"type": "narration", "text": "--I called. My German was bad. The operator asked questions I could not understand. I handed the phone to Matei. He took it without looking, spoke in rapid German, answered everything, hung up."}, {"type": "dialogue", "text": "“They are coming,” he said. He had not moved from her side. His hand was still on"}, {"type": "dialogue", "text": "“Is she going to be okay?”"}, {"type": "narration", "text": "He did not answer. That was the scariest thing he had done all week."}, {"type": "practice", "prompt": "Now say “the operator” – die Vermittlung.", "answer": "Die Vermittlung. Feminine. Die Vermittlung fragte – the operator asked.", "slow": "Die Vermittlung. Feminine. Die Vermittlung fragte – the operator asked.", "grammar": "Feminine. Die Vermittlung fragte – the operator asked."}, {"type": "practice", "prompt": "Now say “rapid” – schnell or rasch.", "answer": "Rasch. Er sprach rasch Deutsch – he spoke rapid German.", "slow": "Rasch. Er sprach rasch Deutsch – he spoke rapid German.", "grammar": "Er sprach rasch Deutsch – he spoke rapid German."}, {"type": "narration", "text": "--The ambulance came in seven minutes. I know because I counted. The paramedics were fast and efficient and spoke to Matei like he was family. They loaded Frau Schmidt onto a stretcher. One of them asked something in German. Matei answered. The paramedic looked at me."}, {"type": "dialogue", "text": "“You come too,” he said in English. “She would want.”"}, {"type": "narration", "text": "I got in the ambulance. Matei stayed behind to lock the café."}, {"type": "dialogue", "text": "“I will meet you there,” he said."}, {"type": "narration", "text": "The doors closed. The sirens started. I held Frau Schmidt's hand and tried not to cry."}, {"type": "practice", "prompt": "Now say “the paramedic” – der Sanitäter.", "answer": "Der Sanitäter. Masculine. Die Sanitäter kamen – the paramedics came.", "slow": "Der Sanitäter. Masculine. Die Sanitäter kamen – the paramedics came.", "grammar": "Masculine. Die Sanitäter kamen – the paramedics came."}, {"type": "practice", "prompt": "Now say “the stretcher” – die Trage.", "answer": "Die Trage. Feminine. Sie legten sie auf eine Trage – they put her on a stretcher.", "slow": "Die Trage. Feminine. Sie legten sie auf eine Trage – they put her on a stretcher.", "grammar": "Feminine. Sie legten sie auf eine Trage – they put her on a stretcher."}, {"type": "narration", "text": "--The hospital was white and loud and smelled like antiseptic. They took Frau Schmidt to a room. A doctor spoke to me in English. Her English was better than my German, but not by much."}, {"type": "dialogue", "text": "“She had a stroke. Small. We caught it early.”"}, {"type": "dialogue", "text": "“Is she going to be okay?”"}, {"type": "dialogue", "text": "“She will need rehabilitation. Therapy. She cannot work for several weeks. Maybe"}, {"type": "dialogue", "text": "“Months?”"}, {"type": "narration", "text": "The doctor nodded. “Do you know if she has family? Children?” I did not know."}, {"type": "practice", "prompt": "Now say “the hospital” – das Krankenhaus.", "answer": "Das Krankenhaus. Neuter. Das Krankenhaus war weiß und laut – the hospital was.", "slow": "Das Krankenhaus. Neuter. Das Krankenhaus war weiß und laut – the hospital was.", "grammar": "Neuter. Das Krankenhaus war weiß und laut – the hospital was white and loud."}, {"type": "practice", "prompt": "Now say “the stroke” – der Schlaganfall.", "answer": "Der Schlaganfall. Masculine. Sie hatte einen kleinen Schlaganfall – she had a.", "slow": "Der Schlaganfall. Masculine. Sie hatte einen kleinen Schlaganfall – she had a.", "grammar": "Masculine. Sie hatte einen kleinen Schlaganfall – she had a small stroke."}, {"type": "narration", "text": "--Matei arrived an hour later. He had closed the café, turned off the lights, locked the door. He had also called the bakery down the street and told them to cancel the morning pastry delivery."}, {"type": "dialogue", "text": "“How is she?” he asked."}, {"type": "dialogue", "text": "“Stroke. Small. They say she will recover, but it will take time.”"}, {"type": "narration", "text": "He sat down next to me in the waiting room. His hand found mine."}, {"type": "dialogue", "text": "“The café,” I said. “She cannot work. For months.”"}, {"type": "dialogue", "text": "“I know.”"}, {"type": "dialogue", "text": "“She does not have anyone. I do not think she has family.”"}, {"type": "practice", "prompt": "Now say “to recover” – sich erholen.", "answer": "Sich erholen. Sie wird sich erholen – she will recover.", "slow": "Sich erholen. Sie wird sich erholen – she will recover.", "grammar": "Sie wird sich erholen – she will recover."}, {"type": "practice", "prompt": "Now say “the waiting room” – das Wartezimmer.", "answer": "Das Wartezimmer. Neuter. Im Wartezimmer sitzen – to sit in the waiting room.", "slow": "Das Wartezimmer. Neuter. Im Wartezimmer sitzen – to sit in the waiting room.", "grammar": "Neuter. Im Wartezimmer sitzen – to sit in the waiting room."}, {"type": "narration", "text": "--He was quiet for a moment. Then he said, “The café is her life. If it closes, she will lose more than money.”"}, {"type": "dialogue", "text": "“What do we do?”"}, {"type": "narration", "text": "He looked at me. His grey eyes were steady."}, {"type": "dialogue", "text": "“We run it.”"}, {"type": "narration", "text": "I stared at him. “We what?”"}, {"type": "dialogue", "text": "“You know how to make the coffee. You know the customers. You know the routine.”"}, {"type": "dialogue", "text": "“I dropped four cups last week.”"}, {"type": "dialogue", "text": "“You dropped three. Frau Schmidt told me.”"}, {"type": "practice", "prompt": "Now say “to lose” – verlieren.", "answer": "Verlieren. Sie wird mehr als Geld verlieren – she will lose more than money.", "slow": "Verlieren. Sie wird mehr als Geld verlieren – she will lose more than money.", "grammar": "Sie wird mehr als Geld verlieren – she will lose more than money."}, {"type": "practice", "prompt": "Now say “to run” (a business) – führen or leiten. Different from laufen.", "answer": "Führen. Wir führen das Café – we run the café.", "slow": "Führen. Wir führen das Café – we run the café.", "grammar": "Wir führen das Café – we run the café."}, {"type": "dialogue", "text": "--“That is not better.”"}, {"type": "dialogue", "text": "“It is better.” He squeezed my hand. “I will help in the mornings. Before work."}, {"type": "narration", "text": "And I know people. We can find someone to cover the afternoons.”"}, {"type": "dialogue", "text": "“Matei, I cannot run a café. I can barely order food in German.”"}, {"type": "dialogue", "text": "“You do not have to run it alone. You just have to keep it alive. Until she comes"}, {"type": "narration", "text": "back.” I wanted to say no. I wanted to tell him he was crazy. But I looked at him – this man who had given me a key and a job and a reason to stay – and I thought about Frau Schmidt on the floor, reaching for her phone, alone."}, {"type": "dialogue", "text": "“Okay,” I said."}, {"type": "dialogue", "text": "“Okay?”"}, {"type": "dialogue", "text": "“Okay. I will do it.”"}, {"type": "practice", "prompt": "Now say “to cover” – übernehmen (separable) or abdecken.", "answer": "Übernehmen. Wir können die Nachmittage übernehmen – we can cover the afternoons.", "slow": "Übernehmen. Wir können die Nachmittage übernehmen – we can cover the afternoons.", "grammar": "Wir können die Nachmittage übernehmen – we can cover the afternoons."}, {"type": "practice", "prompt": "Now say “alive” – lebendig.", "answer": "Lebendig. Wir müssen das Café am Leben halten – we have to keep the café alive.", "slow": "Lebendig. Wir müssen das Café am Leben halten – we have to keep the café alive.", "grammar": "Wir müssen das Café am Leben halten – we have to keep the café alive."}, {"type": "narration", "text": "--He kissed my forehead. Right there in the hospital waiting room, with fluorescent lights and the smell of antiseptic and a woman who might never make coffee again."}, {"type": "dialogue", "text": "“Good,” he said. “Because I already told the bakery you would be there at 6 AM"}, {"type": "dialogue", "text": "“You did not.”"}, {"type": "dialogue", "text": "“I did.”"}, {"type": "dialogue", "text": "“You are insane.”"}, {"type": "dialogue", "text": "“Probably.”"}, {"type": "practice", "prompt": "Now say “insane” – verrückt.", "answer": "Verrückt. Du bist verrückt – you are insane.", "slow": "Verrückt. Du bist verrückt – you are insane.", "grammar": "Du bist verrückt – you are insane."}, {"type": "practice", "prompt": "Now say “the bakery” – die Bäckerei. Review.", "answer": "Die Bäckerei. Ich habe der Bäckerei schon Bescheid gesagt – I already told the.", "slow": "Die Bäckerei. Ich habe der Bäckerei schon Bescheid gesagt – I already told the.", "grammar": "Ich habe der Bäckerei schon Bescheid gesagt – I already told the bakery."}, {"type": "narration", "text": "--I leaned my head on his shoulder. He put his arm around me. We sat like that until a nurse came to tell us Frau Schmidt was awake. She looked smaller in the hospital bed. The fluorescent light made her grey hair look white. Her eyes were open, though. They were still sharp."}, {"type": "dialogue", "text": "“You are here,” she said. Her voice was weak."}, {"type": "dialogue", "text": "“Where else would we be?”"}, {"type": "dialogue", "text": "“The café,” she said. “I did not open.”"}, {"type": "dialogue", "text": "“We took care of it,” I said. “It is closed. The pastries are cancelled. The"}, {"type": "practice", "prompt": "Now say “the nurse” – die Krankenschwester.", "answer": "Die Krankenschwester. Feminine. Eine Krankenschwester kam – a nurse came.", "slow": "Die Krankenschwester. Feminine. Eine Krankenschwester kam – a nurse came.", "grammar": "Feminine. Eine Krankenschwester kam – a nurse came."}, {"type": "practice", "prompt": "Now say “weak” – schwach.", "answer": "Schwach. Ihre Stimme war schwach – her voice was weak.", "slow": "Schwach. Ihre Stimme war schwach – her voice was weak.", "grammar": "Ihre Stimme war schwach – her voice was weak."}, {"type": "narration", "text": "--She nodded slowly. “Good. Good.”"}, {"type": "dialogue", "text": "“Frau Schmidt,” Matei said. “Do you have family? Someone we should call?”"}, {"type": "narration", "text": "She looked at him. Her eyes were wet."}, {"type": "dialogue", "text": "“No,” she said. “No family. Just the café.”"}, {"type": "dialogue", "text": "“Then we will keep it open,” I said. “Until you come back.”"}, {"type": "narration", "text": "She looked at me. Really looked. The way she had when I had dropped my first cup, the way she had when she had told me Matei talked about me."}, {"type": "dialogue", "text": "“You cannot,” she said. “You do not speak German.”"}, {"type": "dialogue", "text": "“I will learn.”"}, {"type": "dialogue", "text": "“You drop cups.”"}, {"type": "dialogue", "text": "“I will drop fewer.”"}, {"type": "practice", "prompt": "Now say “wet” – nass (for objects) or feucht (for eyes with tears). Ihre Augen", "answer": "waren feucht – her eyes were wet.", "slow": "waren feucht – her eyes were wet.", "grammar": "Repeat aloud: waren feucht – her eyes were wet."}, {"type": "narration", "text": "Feucht. Ihre Augen waren feucht – her eyes were wet."}, {"type": "practice", "prompt": "Now say “to keep open” – offen halten.", "answer": "Offen halten. Wir werden das Café offen halten – we will keep the café open.", "slow": "Offen halten. Wir werden das Café offen halten – we will keep the café open.", "grammar": "Wir werden das Café offen halten – we will keep the café open."}, {"type": "narration", "text": "--She was quiet for a long moment. Then she smiled. A small smile. Tired. Real."}, {"type": "dialogue", "text": "“The keys are in the drawer,” she said. “Behind the counter. There is a blue"}, {"type": "narration", "text": "notebook. The passwords. The supplier numbers. Everything.”"}, {"type": "dialogue", "text": "“I will find it,” I said."}, {"type": "dialogue", "text": "“Yves.”"}, {"type": "dialogue", "text": "“What?”"}, {"type": "dialogue", "text": "“Thank you.”"}, {"type": "narration", "text": "I did not know what to say. So I said nothing. I just stood there while Matei held her hand and promised to visit every day."}, {"type": "practice", "prompt": "Now say “the drawer” – die Schublade.", "answer": "Die Schublade. Feminine. Die Schlüssel sind in der Schublade – the keys are in the.", "slow": "Die Schublade. Feminine. Die Schlüssel sind in der Schublade – the keys are in the.", "grammar": "Feminine. Die Schlüssel sind in der Schublade – the keys are in the drawer."}, {"type": "practice", "prompt": "Now say “the notebook” – das Notizbuch. Review.", "answer": "Das Notizbuch. Ein blaues Notizbuch – a blue notebook.", "slow": "Das Notizbuch. Ein blaues Notizbuch – a blue notebook.", "grammar": "Ein blaues Notizbuch – a blue notebook."}, {"type": "narration", "text": "--That night, we sat on the sofa. The lamp was on. The radiator clicked. The plant on the windowsill – Matei Jr. – was still alive."}, {"type": "dialogue", "text": "“You are scared,” Matei said."}, {"type": "dialogue", "text": "“Terrified.”"}, {"type": "dialogue", "text": "“Good. Terror means you care.”"}, {"type": "dialogue", "text": "“Or it means I am about to ruin someone's life.”"}, {"type": "narration", "text": "He turned to look at me. “Frau Schmidt trusted you. Do you know why?”"}, {"type": "dialogue", "text": "“Because you vouched for me?”"}, {"type": "dialogue", "text": "“No. Because you stayed. When she gave you a chance, you did not leave. You came"}, {"type": "narration", "text": "back the next day. And the next. And the next.” He put his hand on my knee. “That is not nothing, Yves. That is everything.”"}, {"type": "practice", "prompt": "Now say “to vouch for” – bürgen für or sich verbürgen für.", "answer": "Sich verbürgen für. Du hast dich für mich verbürgt – you vouched for me.", "slow": "Sich verbürgen für. Du hast dich für mich verbürgt – you vouched for me.", "grammar": "Du hast dich für mich verbürgt – you vouched for me."}, {"type": "practice", "prompt": "Now say “the chance” – die Chance. Review.", "answer": "Die Chance. Sie gab dir eine Chance – she gave you a chance.", "slow": "Die Chance. Sie gab dir eine Chance – she gave you a chance.", "grammar": "Sie gab dir eine Chance – she gave you a chance."}, {"type": "dialogue", "text": "--“What if I fail?”"}, {"type": "dialogue", "text": "“Then you fail. And you try again.” He squeezed my knee. “That is what staying"}, {"type": "narration", "text": "means.” I leaned into him. His arm went around my shoulders."}, {"type": "dialogue", "text": "“Matei.”"}, {"type": "dialogue", "text": "“What?”"}, {"type": "dialogue", "text": "“I am glad you are here.”"}, {"type": "dialogue", "text": "“I am not going anywhere.”"}, {"type": "narration", "text": "We sat like that until the lamp flickered and the street went quiet. Tomorrow, I would open the café. I would make coffee. I would drop cups and apologise to the floor. I would learn the German words for supplier and invoice. But tonight, I was just here. And for now, that was enough."}, {"type": "practice", "prompt": "Now say “to fail” – scheitern or versagen.", "answer": "Scheitern. Was ist, wenn ich scheitere? – What if I fail?.", "slow": "Scheitern. Was ist, wenn ich scheitere? – What if I fail?.", "grammar": "Was ist, wenn ich scheitere? – What if I fail?"}, {"type": "practice", "prompt": "Now say “the supplier” – der Lieferant.", "answer": "Der Lieferant. Masculine. Der Lieferant – the supplier.", "slow": "Der Lieferant. Masculine. Der Lieferant – the supplier.", "grammar": "Masculine. Der Lieferant – the supplier."}], "bg": "hospital", "location": "Berlin Hospital"}, {"id": 11, "title": "The First Day", "level": "A2", "segments": [{"type": "narration", "text": "outside, distant traffic.) I opened the café at 5:45 AM. That is not a typo. Five forty-five. In the morning. Before the sun. Before the birds. Before any reasonable person should be allowed to operate heavy machinery like an espresso machine that hissed like it wanted to kill me. The blue notebook was exactly where Frau Schmidt said it would be. Behind the counter, in the drawer, next to a bag of spare change and a photograph of a man I did not recognise. Her husband, maybe. The one who had packed a bag three times."}, {"type": "practice", "prompt": "Now say “the typo” – der Tippfehler.", "answer": "Der Tippfehler. Masculine. Das ist kein Tippfehler – that is not a typo.", "slow": "Der Tippfehler. Masculine. Das ist kein Tippfehler – that is not a typo.", "grammar": "Masculine. Das ist kein Tippfehler – that is not a typo."}, {"type": "practice", "prompt": "Now say “the machinery” – die Maschinerie.", "answer": "Die Maschinerie. Feminine. Schwere Maschinerie – heavy machinery.", "slow": "Die Maschinerie. Feminine. Schwere Maschinerie – heavy machinery.", "grammar": "Feminine. Schwere Maschinerie – heavy machinery."}, {"type": "narration", "text": "--The notebook had everything. Passwords. Supplier numbers. Instructions for the espresso machine written in a mix of German and English that made my eyes cross. Turn the red knob. Wait for the green light. Do not overfill the filter or you will regret it. I regretted it anyway. The first espresso shot was pure charcoal. I dumped it. The second was slightly less burnt. I dumped that too. By the fifth attempt, I had something that resembled coffee and not liquid asphalt."}, {"type": "practice", "prompt": "Now say “the knob” – der Knopf or der Griff. Der rote Knopf – the red knob.", "answer": "Der Knopf. Masculine. Den roten Knopf drehen – turn the red knob.", "slow": "Der Knopf. Masculine. Den roten Knopf drehen – turn the red knob.", "grammar": "Masculine. Den roten Knopf drehen – turn the red knob."}, {"type": "practice", "prompt": "Now say “the charcoal” – die Kohle.", "answer": "Die Kohle. Feminine. Reine Kohle – pure charcoal.", "slow": "Die Kohle. Feminine. Reine Kohle – pure charcoal.", "grammar": "Feminine. Reine Kohle – pure charcoal."}, {"type": "narration", "text": "--At 6:15, I unlocked the front door. The green awning rolled out. The chalkboard sign said Heute geöffnet in Frau Schmidt's handwriting. I did not have the heart to change it. The first customer arrived at 6:30. An old man with a newspaper and a limp. He ordered something in German. I understood the word Kaffee and nothing else."}, {"type": "dialogue", "text": "“Black?” I asked."}, {"type": "narration", "text": "He looked at me like I had grown a second head."}, {"type": "dialogue", "text": "“Schwarz?” I tried."}, {"type": "practice", "prompt": "Now say “the awning” – die Markise.", "answer": "Die Markise. Feminine. Die grüne Markise – the green awning.", "slow": "Die Markise. Feminine. Die grüne Markise – the green awning.", "grammar": "Feminine. Die grüne Markise – the green awning."}, {"type": "practice", "prompt": "Now say “the limp” – das Hinken or der Hinkefuß. More common: er humpelte – he", "answer": "limped.", "slow": "limped.", "grammar": "Repeat aloud: limped."}, {"type": "narration", "text": "Humpeln. Ein alter Mann mit einem Hinken – an old man with a limp. --I made him a black coffee. He took a sip. Made a face. Drank it anyway."}, {"type": "dialogue", "text": "“Danke,” he said, and left a two-euro tip."}, {"type": "narration", "text": "I put the tip in my pocket. Frau Schmidt had said tips were for the staff. I was the staff."}, {"type": "practice", "prompt": "Now say “the tip” – das Trinkgeld.", "answer": "Das Trinkgeld. Neuter. Zwei Euro Trinkgeld – two euros tip.", "slow": "Das Trinkgeld. Neuter. Zwei Euro Trinkgeld – two euros tip.", "grammar": "Neuter. Zwei Euro Trinkgeld – two euros tip."}, {"type": "practice", "prompt": "Now say “the staff” – das Personal.", "answer": "Das Personal. Neuter. Das Personal ist die Belegschaft – the staff.", "slow": "Das Personal. Neuter. Das Personal ist die Belegschaft – the staff.", "grammar": "Neuter. Das Personal ist die Belegschaft – the staff."}, {"type": "narration", "text": "--By 8 AM, I had made sixteen coffees, dropped one cup, and learned the German word for receipt from a woman who yelled it at me three times before I understood. Quittung, she yelled. Quittung!"}, {"type": "dialogue", "text": "“Quittung,” I repeated."}, {"type": "narration", "text": "She nodded. Snatched the paper. Left."}, {"type": "practice", "prompt": "Now say “the receipt” – die Quittung.", "answer": "Die Quittung. Feminine. Die Quittung, bitte – the receipt, please.", "slow": "Die Quittung. Feminine. Die Quittung, bitte – the receipt, please.", "grammar": "Feminine. Die Quittung, bitte – the receipt, please."}, {"type": "practice", "prompt": "Now say “to yell” – schreien. Review. Sie schrie – she yelled.", "answer": "Schreien. Sie schrie „Quittung!“ – she yelled “Receipt!”.", "slow": "Schreien. Sie schrie „Quittung!“ – she yelled “Receipt!”.", "grammar": "Sie schrie „Quittung!“ – she yelled “Receipt!”"}, {"type": "narration", "text": "--I was sweating. It was February. Matei showed up at 8:15. He was supposed to be at the bookstore. Instead, he was standing in the doorway, holding a bag of pastries from the bakery down the street."}, {"type": "dialogue", "text": "“You look terrible,” he said."}, {"type": "dialogue", "text": "“I feel terrible.”"}, {"type": "dialogue", "text": "“How many cups?”"}, {"type": "dialogue", "text": "“One.”"}, {"type": "dialogue", "text": "“That is good.”"}, {"type": "dialogue", "text": "“I also burned my hand on the steamer.”"}, {"type": "practice", "prompt": "Now say “to sweat” – schwitzen.", "answer": "Schwitzen. Ich schwitzte – I was sweating.", "slow": "Schwitzen. Ich schwitzte – I was sweating.", "grammar": "Ich schwitzte – I was sweating."}, {"type": "practice", "prompt": "Now say “the steamer” – der Dampfstab (on an espresso machine).", "answer": "Der Dampfstab. Masculine. Am Dampfstab verbrannt – burned on the steamer.", "slow": "Der Dampfstab. Masculine. Am Dampfstab verbrannt – burned on the steamer.", "grammar": "Masculine. Am Dampfstab verbrannt – burned on the steamer."}, {"type": "narration", "text": "--He walked behind the counter. Took my hand. Examined the burn. It was small. A red mark on my thumb. He kissed it."}, {"type": "dialogue", "text": "“That does not help,” I said."}, {"type": "dialogue", "text": "“It helps me.”"}, {"type": "narration", "text": "He put the pastries in the display case. Took over the espresso machine while I handled the register. Together, we got through the morning rush. It was still chaos. But it was shared chaos."}, {"type": "practice", "prompt": "Now say “the burn” – die Verbrennung.", "answer": "Die Verbrennung. Feminine. Eine kleine Verbrennung – a small burn.", "slow": "Die Verbrennung. Feminine. Eine kleine Verbrennung – a small burn.", "grammar": "Feminine. Eine kleine Verbrennung – a small burn."}, {"type": "practice", "prompt": "Now say “the chaos” – das Chaos.", "answer": "Das Chaos. Neuter. Es war Chaos – it was chaos.", "slow": "Das Chaos. Neuter. Es war Chaos – it was chaos.", "grammar": "Neuter. Es war Chaos – it was chaos."}, {"type": "narration", "text": "--A woman walked in at 11. Young. Dark hair. Red coat. She looked at me."}, {"type": "dialogue", "text": "“Yves?”"}, {"type": "dialogue", "text": "“Do I know you?”"}, {"type": "dialogue", "text": "“You do not remember me. That is okay. It was a long time ago.”"}, {"type": "narration", "text": "She paid. Sat at a table. Looked at her phone. My phone buzzed. Unknown number: You look good, Yves. Berlin suits you. I looked at the woman. She looked at me. She smiled."}, {"type": "practice", "prompt": "Now say “the red coat” – der rote Mantel.", "answer": "Der rote Mantel. Eine Frau im roten Mantel – a woman in a red coat.", "slow": "Der rote Mantel. Eine Frau im roten Mantel – a woman in a red coat.", "grammar": "Eine Frau im roten Mantel – a woman in a red coat."}, {"type": "practice", "prompt": "Now say “unknown” – unbekannt.", "answer": "Unbekannt. Eine unbekannte Nummer – an unknown number.", "slow": "Unbekannt. Eine unbekannte Nummer – an unknown number.", "grammar": "Eine unbekannte Nummer – an unknown number."}, {"type": "narration", "text": "--I did not respond to the text. I put my phone away. Made another coffee for a customer who was not there. Matei was watching me."}, {"type": "dialogue", "text": "“Who was that?” he asked quietly."}, {"type"
